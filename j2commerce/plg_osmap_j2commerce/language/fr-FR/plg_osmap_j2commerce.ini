PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Ajoute automatiquement au sitemap OSMap les produits J2Commerce activés et visibles dont l'article est publié et accessible aux invités."

; Paramètres du plugin
PLG_OSMAP_PRIORITY_LABEL="Priorité"
PLG_OSMAP_PRIORITY_DESC="Priorité du sitemap pour les pages produits (0.0–1.0). Défaut : 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Fréquence de modification"
PLG_OSMAP_CHANGEFREQ_DESC="Fréquence probable de modification des pages produits."

; Message post-installation
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce : Installation terminée"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP_LABEL="Étape %d"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Activer le plugin"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>Système → Gérer → Plugins</strong> → rechercher <strong>OSMap - J2Commerce</strong> → activer."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Configurer OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="Dans OSMap (<strong>Composants → OSMap</strong>), ouvrez votre sitemap et assurez-vous que le menu contenant votre boutique est sélectionné. Le plugin détectera automatiquement tous les produits J2Commerce activés."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Régénérer le sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Accédez à l'URL de votre sitemap (ex. <strong>/sitemap</strong>) ou cliquez sur <strong>Actualiser</strong> dans OSMap. Les produits visibles publiquement (publiés et accessibles aux invités) apparaîtront sous forme d'URLs <code>/boutique/alias-produit</code> (sur un site multilingue, chaque URL porte le préfixe SEF de langue de l'élément de menu, ex. <code>/de/boutique/alias-produit</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin activé (Système → Gérer → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Élément de menu boutique sélectionné dans le sitemap OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap régénéré et URLs produits visibles"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Liste de contrôle"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Documentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Notices de l'installateur
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce a été mis à jour vers la version %s."
PLG_OSMAP_J2COMMERCE_ENABLE_HINT="Le plugin est désactivé. Activez-le sous <strong>Système → Gérer → Plugins</strong> (rechercher <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) n'est pas installé. Ce plugin fonctionne uniquement avec OSMap ; installez OSMap pour générer un sitemap."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_DISABLED="OSMap (com_osmap) est installé mais désactivé. Ce plugin fonctionne uniquement avec OSMap ; activez OSMap sous <strong>Système → Gérer → Extensions</strong> pour générer un sitemap."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Ni J2Commerce 6 (com_j2commerce) ni J2Store/J2Commerce 4 (com_j2store) n'est installé et activé. Aucun produit n'est ajouté au sitemap tant que l'un des deux n'est pas disponible."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="L'ancien plugin OSMap pour J2Store (osmap/j2store) a été désactivé, car ce plugin le remplace."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="L'ancien plugin OSMap pour J2Store (osmap/j2store) n'a pas pu être désactivé : %s. Désactivez-le manuellement sous Système → Gérer → Plugins."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="Le fichier OSMap %s a été corrigé afin que Factory::getTable() ne renvoie plus false (compatibilité PHP 8.1+)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="Le fichier OSMap %s n'a pas pu être lu ou écrit ; le correctif de compatibilité PHP 8.1+ n'a pas été appliqué. Mettez OSMap à jour vers la version 5.1.4 ou ultérieure."

; Onglet « Aide »
PLG_OSMAP_J2COMMERCE_HELP_NOTE="Ce que fait ce plugin, comment le configurer et que faire en cas de problème : voir l'onglet « Aide »."
PLG_OSMAP_J2COMMERCE_HELP_TAB="Aide"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_TITLE="Ce que fait le plugin"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P1="OSMap crée le sitemap de votre site mais ne connaît pas les pages produits de J2Store et J2Commerce. Ce plugin ajoute au sitemap tous les produits visibles publiquement."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P2="Un produit apparaît dans le sitemap lorsque toutes ces conditions sont remplies :"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI1="Le produit est activé et visible dans la boutique."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI2="L'article du produit est publié et se trouve dans sa période de publication."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI3="Les invités peuvent voir l'article (niveau d'accès)."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI4="La catégorie de l'article et toutes ses catégories parentes sont publiées et visibles par les invités."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_NOTE="Le plugin fonctionne uniquement avec OSMap. Il n'a pas de page propre, ne crée aucune table et ne transmet rien aux moteurs de recherche. Les produits nouveaux ou réactivés apparaissent au prochain appel du sitemap."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_TITLE="Prérequis et mise en place"
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP1="Installez et activez OSMap (Free ou Pro, version 5 ou plus récente) et la boutique : J2Store 4 (composant <code>com_j2store</code>) ou J2Commerce 6 (composant <code>com_j2commerce</code>). Si l'un d'eux manque ou est désactivé, l'installation du plugin affiche un avertissement."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP2="Activez le plugin sous <strong>Système → Gérer → Plugins</strong> (rechercher <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP3="Vérifiez que la boutique possède un élément de menu avec l'une des vues prises en charge : liste de produits, produit unique, catégories ou alias de catégorie (voir la section suivante)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP4="Dans OSMap, ouvrez votre sitemap sous <strong>Composants → OSMap → Sitemaps</strong>, sélectionnez le menu qui contient l'élément de menu de la boutique et enregistrez."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP5="Ouvrez le sitemap. Chaque produit apparaît avec l'adresse formée du chemin de l'élément de menu de la boutique et de l'alias de l'article, par exemple <code>https://example.org/boutique/alias-produit</code>. Sur un site multilingue, le code de langue vient en premier, par exemple <code>https://example.org/fr/boutique/alias-produit</code>."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP6="Pour que ces adresses fonctionnent, les URL optimisées pour les moteurs de recherche et la réécriture d'URL doivent être activées dans la configuration globale, et le <code>.htaccess</code> doit transmettre toutes les requêtes à <code>index.php</code> (règles standard de Joomla)."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_TITLE="Quels produits apparaissent"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_P1="Ce que le plugin ajoute dépend de la vue de l'élément de menu de la boutique :"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI1="<strong>Liste de produits</strong> (<code>view=products</code>) : tous les produits de la catégorie choisie et de ses sous-catégories, tous les produits si aucune catégorie n'est choisie."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI2="<strong>Catégories</strong> (<code>view=categories</code>) : tous les produits de la catégorie racine choisie et de ses sous-catégories, tous les produits si aucune catégorie n'est choisie."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI3="<strong>Alias de catégorie</strong> (<code>view=categoryalias</code>, J2Commerce 6) : tous les produits de cette catégorie et de ses sous-catégories."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI4="<strong>Produit unique</strong> (<code>view=product</code>) : uniquement ce produit."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI5="Les autres vues de la boutique, par exemple le panier ou la caisse, n'ajoutent aucune entrée."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI6="Si des éléments de menu d'article avec le statut -2 (corbeille) se trouvent sous l'élément de menu de la boutique, un par produit, le plugin utilise leur chemin comme adresse. Chaque produit n'apparaît néanmoins qu'une fois."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_NOTE="Si J2Store et J2Commerce 6 sont activés en même temps, par exemple pendant une migration, J2Store est prioritaire : les éléments de menu de J2Commerce 6 manquent dans le sitemap jusqu'à la désactivation de J2Store. Désactivez J2Store avant de publier les nouveaux éléments de menu de J2Commerce 6."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_TITLE="Paramètres"
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_P1="Les paramètres se trouvent dans l'onglet « Plugin » et s'appliquent à tous les produits que le plugin écrit dans le sitemap."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI1="<strong>« Priorité »</strong> (par défaut 0.8) : valeur de 0.0 à 1.0 que le sitemap indique pour chaque page produit. Elle indique aux moteurs de recherche l'importance de la page par rapport aux autres pages de votre site. Modifiez-la si les produits doivent peser plus ou moins que vos autres pages."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI2="<strong>« Fréquence de modification »</strong> (par défaut <code>weekly</code>) : fréquence probable de modification des pages produits, de <code>always</code> à <code>never</code>. Choisissez par exemple <code>daily</code> si les prix ou les stocks changent chaque jour."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_NOTE="Les deux valeurs sont des indications pour les moteurs de recherche. Elles ne déterminent pas quels produits figurent dans le sitemap."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>Aucun produit dans le sitemap.</strong> Vérifiez que le plugin est activé, que le menu contenant l'élément de menu de la boutique est sélectionné dans le sitemap OSMap et que l'élément de menu utilise une vue prise en charge. Vérifiez ensuite sur un produit les conditions indiquées sous « Ce que fait le plugin »."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>Certains produits manquent.</strong> Le plus souvent, l'article n'est pas (encore ou plus) publié, est restreint pour les invités ou se trouve dans une catégorie restreinte. Le plugin ne peut pas trouver les produits qui ne sont pas liés à un article Joomla."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>Des éléments de menu de J2Commerce 6 manquent.</strong> J2Store est encore activé. Désactivez J2Store sous <strong>Système → Gérer → Extensions</strong> dès que le passage à J2Commerce 6 est terminé."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>Le sitemap reste vide sans message d'erreur.</strong> OSMap ignore les erreurs de ses plugins. Le plugin écrit les erreurs de base de données dans le journal Joomla (catégorie <code>plg_osmap_j2commerce</code>). Que Joomla conserve ces entrées dépend des paramètres de journalisation du site."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>Les adresses des produits renvoient l'erreur 404.</strong> Vérifiez les URL optimisées pour les moteurs de recherche et le <code>.htaccess</code>. Si le <code>.htaccess</code> bloque les adresses avec <code>/component/</code>, excluez <code>/component/j2store</code> ou <code>/component/j2commerce</code>, car la boutique en a besoin pour le panier et la caisse. Si les adresses proviennent d'éléments de menu avec le statut -2 et que leurs chemins sont obsolètes, utilisez le bouton <strong>Reconstruire</strong> sous <strong>Menus → Tous les éléments de menu</strong>."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>Message d'erreur concernant <code>Factory::getTable()</code>.</strong> Il s'agit d'une erreur d'OSMap jusqu'à la version 5.1.3. L'installation du plugin corrige le fichier concerné d'OSMap. Si cela échoue, un avertissement apparaît : mettez alors OSMap à jour vers la version 5.1.4 ou plus récente."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>L'ancien plugin OSMap pour J2Store est désactivé.</strong> L'installation désactive le plugin <code>osmap/j2store</code>, car ce plugin le remplace et l'ancien génère des adresses de produits erronées. Laissez-le désactivé."
