COM_APPOINTMENTS_SCHEDULE_WEEKLY_INTRO="Ajoutez une ligne par plage. Plusieurs lignes le même jour sont permises, par exemple une matinée et un après-midi. Si la fin n'est pas après le début, la plage se poursuit après minuit et compte pour une seule plage."
