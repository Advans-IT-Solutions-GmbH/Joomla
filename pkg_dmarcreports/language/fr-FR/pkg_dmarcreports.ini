PKG_DMARCREPORTS="Pack DMARC Reports"
PKG_DMARCREPORTS_XML_DESCRIPTION="Suite complète de rapports DMARC et TLS-RPT en une seule installation : le composant DMARC Reports, son module de tableau de bord d'administration, le plugin de tâche planifiée pour l'ingestion automatique des boîtes aux lettres et le plugin système de politique MTA-STS. L'installation, la mise à jour et la suppression du paquet gèrent les quatre extensions ensemble."
PKG_DMARCREPORTS_POSTINSTALL_INTRO="La suite DMARC Reports est installée. Ouvrez <strong>Composants → DMARC Reports</strong> et ajoutez une source de boîte aux lettres. La tâche planifiée d'ingestion qui collecte les rapports automatiquement est créée par l'installation si elle manque ; son message l'indique."
PKG_DMARCREPORTS_POSTINSTALL_UPDATED="Paquet DMARC Reports mis à jour vers la version %s."
PKG_DMARCREPORTS_UPDATE_CHANNEL_WARNING="Le paquet DMARC Reports a été installé ou mis à jour, mais Joomla n'a pas pu basculer toutes les extensions incluses vers le canal de mise à jour du paquet. Certaines extensions peuvent encore recevoir des mises à jour autonomes et diverger du paquet. Mettez à jour le paquet à nouveau pour réessayer."
