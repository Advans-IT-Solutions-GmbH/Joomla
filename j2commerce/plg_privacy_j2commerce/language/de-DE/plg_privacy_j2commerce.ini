; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_PRIVACY_J2COMMERCE_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe»."
PLG_PRIVACY_J2COMMERCE_HELP_TAB="Hilfe"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_TITLE="Was dieses Plugin tut"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_P1="Das Plugin ergänzt die Datenschutzfunktionen von Joomla (Komponente Datenschutz, «Benutzer → Datenschutz → Anfragen») um die Daten des Shops. Es unterstützt J2Commerce 6 und J2Store 4 (J2Commerce 4)."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI1="<strong>Export:</strong> Eine Exportanfrage enthält die Bestellungen mit Positionen, Rechnungs- und Lieferdaten, die gespeicherten Adressen, die Checkout-Einwilligungen von Gastbestellungen, die Newsletter-Einwilligungen von Gästen (Newsletterformular der Website und Checkout) und vorhandene Newsletterdaten aus AcyMailing. Mit «Joomla-Kerndaten einbeziehen» kommen Benutzerkonto, Profil und Aktionsprotokoll dazu."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI2="<strong>Löschung:</strong> Eine Löschanfrage löscht die Warenkörbe des Benutzerkontos, Newsletterdaten aus AcyMailing und je nach Einstellung die gespeicherten Adressen. Bestellungen ausserhalb der Aufbewahrungsfrist werden je nach Einstellung anonymisiert. Bestellungen innerhalb der Frist bleiben erhalten und werden gemeldet. Einzelheiten stehen im Abschnitt «Was gelöscht, anonymisiert und behalten wird»."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI3="<strong>Gastbestellungen:</strong> Bestellungen ohne Benutzerkonto ordnet das Plugin einer Anfrage über die E-Mail-Adresse der Anfrage oder des Kontos zu."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI4="<strong>Checkout:</strong> Im Schritt Versand und Zahlung erscheint ein Kontrollfeld für die Einwilligung in die Datenschutzerklärung."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI5="<strong>Profilseite:</strong> Die Profilseite des Shops (MyProfile) erhält den Tab «Datenschutz» mit dem Stand der Einwilligung und Schaltflächen für Anfragen. Gespeicherte Adressen erhalten eine Schaltfläche zum Löschen."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI6="<strong>Bestätigungsseite:</strong> Kundinnen und Kunden ohne Benutzerkonto bestätigen eine Anfrage, welche die Administration erstellt hat, auf einer Seite dieses Plugins."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI7="<strong>Bereinigung:</strong> Eine geplante Aufgabe anonymisiert abgelaufene Bestellungen regelmässig, auch ohne Anfrage."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI8="<strong>Meldungen:</strong> Auf Wunsch sendet das Plugin der Administration E-Mails und schreibt Einträge in das Aktionsprotokoll von Joomla."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_NOTE1="Das Plugin ersetzt keine Rechtsberatung. Aufbewahrungsfrist, Datenschutzerklärung und den Umgang mit Anfragen legen Sie selbst fest."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_TITLE="Voraussetzungen"
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI1="Joomla 5.4 oder 6 und PHP 8.1 oder neuer."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI2="J2Commerce 6 oder J2Store 4 (J2Commerce 4). Für das Kontrollfeld im Checkout von J2Commerce 6 ist Version 6.3.4 oder neuer nötig."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI3="Die Joomla-Komponente Datenschutz (com_privacy) ist aktiviert."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI4="Ein Site-Template auf Basis von Bootstrap 5, damit der Tab «Datenschutz» richtig angezeigt wird."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI5="Ein funktionierender E-Mail-Versand in der Globalen Konfiguration. Joomla sendet darüber die Bestätigungscodes, das Plugin seine Meldungen."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI6="Die mitgelieferten Plugins «System - J2Commerce Datenschutz-Einwilligung» und «Task - J2Commerce Datenschutz-Bereinigung». Der Installer installiert sie mit diesem Plugin und aktiviert sie bei der ersten Installation. Ein Update behält ihren Zustand."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_TITLE="Einrichtung Schritt für Schritt"
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP1="Aktivieren Sie dieses Plugin unter «System → Verwalten → Plugins». Prüfen Sie dort auch, ob die beiden mitgelieferten Plugins aktiviert sind."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP2="Legen Sie im Tab «Aufbewahrungsfristen» die Aufbewahrungsfrist und das Geschäftsjahresende fest und tragen Sie eine «Support E-Mail» ein."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP3="Erstellen Sie unter «Menüs» einen Menüeintrag vom Typ «Datenschutz → Anfrage erstellen» mit der Zugriffsebene «Registriert». Stellen Sie im Tab «Linktyp» die Option «In Menü anzeigen» auf «Nein». Ohne diesen Eintrag führen die Schaltflächen im Tab «Datenschutz» nicht zum Anfrageformular."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP4="Wählen Sie im Tab «Checkout-Einwilligung» unter «Datenschutzerklärung Artikel» den Artikel mit Ihrer Datenschutzerklärung."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP5="Prüfen Sie die Template-Overrides in Ihrem Site-Template (Abschnitt «Template-Overrides»)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP6="Erstellen Sie unter «System → Verwalten → Geplante Aufgaben → Neu» eine Aufgabe vom Typ «J2Commerce - Automatische Datenlöschung». Tragen Sie dort dieselben Werte ein wie in diesem Plugin, denn die Aufgabe übernimmt sie nicht. Wählen Sie eine tägliche Ausführung, aktivieren und speichern Sie die Aufgabe."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP7="Verkaufen Sie Produkte mit unbefristeter Lizenz, markieren Sie diese Produkte (Abschnitt «Unbefristete Lizenzen»)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP8="Testen Sie den Ablauf auf einer Testinstallation mit Testdaten, mit je einer Export- und einer Löschanfrage unter «Benutzer → Datenschutz → Anfragen»."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_NOTE1="Ohne eigenen Auslöser startet Joomla geplante Aufgaben nur bei Seitenaufrufen. Für eine zuverlässige Ausführung richten Sie einen Cronjob mit <code>php cli/joomla.php scheduler:run</code> oder den Web-Cron von Joomla ein."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_TITLE="Template-Overrides"
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_P1="Den Tab «Datenschutz», die Schaltflächen zum Löschen von Adressen und unter J2Store 4 das Kontrollfeld im Checkout zeigen Template-Overrides an. Das Plugin liefert sie im Ordner <code>plugins/privacy/j2commerce/overrides</code> mit."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI1="Bei der ersten Installation kopiert der Installer sie in jedes Site-Template, für <code>com_j2store</code> und <code>com_j2commerce</code>. Vorhandene Dateien überschreibt er nie. Die Meldung nach der Installation listet kopierte und übersprungene Dateien."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI2="Ein Update ergänzt nur <code>myprofile/default_privacy.php</code>, wo das Template schon <code>myprofile/default.php</code> einer installierten Shop-Komponente hat. Alle anderen Overrides bleiben unverändert. Vergleichen Sie sie nach einem Update mit der mitgelieferten Fassung."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI3="J2Commerce 6 braucht für den Checkout kein Override. Das Kontrollfeld erscheint in dessen Checkout-Templates ab Version 6.3.4 über das Ereignis <code>AfterDisplayShippingPayment</code>. Ein eigenes Checkout-Override muss dieses Ereignis weiterhin auslösen."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI4="Unveränderte Checkout-Overrides früherer Plugin-Versionen für J2Commerce 6 benennt der Installer ab J2Commerce 6.3.4 mit der Endung <code>.plg_privacy_j2commerce-disabled</code> um. Geänderte Kopien bleiben, und der Installer warnt."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI5="Ein eigenes Layout des Tabs legen Sie als <code>html/layouts/plg_privacy_j2commerce/privacy_tab.php</code> in Ihrem Template ab. Es hat Vorrang vor dem Layout des Plugins."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_TITLE="Tab «Datenschutz-Einstellungen»"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI1="«Joomla-Kerndaten einbeziehen» (Standard: Ja): Der Export enthält zusätzlich Benutzerkonto, Profilfelder und Aktionsprotokoll der Person. Das gilt nur für Anfragen mit Benutzerkonto. Bei «Nein» liefert dieses Plugin nur Shopdaten."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI2="«Bestellungen anonymisieren» (Standard: Ja): Eine Löschanfrage anonymisiert die Bestellungen ausserhalb der Aufbewahrungsfrist. Bei «Nein» bleiben sie unverändert. Bestellungen werden nie gelöscht."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI3="«Adressen löschen» (Standard: Ja): Eine Löschanfrage löscht die gespeicherten Adressen des Benutzerkontos und die Gastadressen mit der E-Mail-Adresse der Anfrage oder des Kontos. Bei «Nein» bleiben sie erhalten."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_TITLE="Tab «Aufbewahrungsfristen»"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI1="«Aufbewahrungsfrist (Jahre)» (Standard: 10, erlaubt 1 bis 30): So viele Jahre nach dem Ende des Geschäftsjahres der Bestellung bleibt eine Bestellung vollständig erhalten. Die Zahl erscheint auch im Tab «Datenschutz» und in den Meldungen."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI2="«Geschäftsjahresende (MM-TT)» (Standard: 12-31): Letzter Tag Ihres Geschäftsjahres. 02-29 bedeutet den letzten Tag im Februar. Nicht existierende Tage wie 04-31 lehnt Joomla beim Speichern ab. Ändern Sie den Wert nur, wenn Ihr Geschäftsjahr nicht am 31. Dezember endet."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI3="«Rechtsgrundlagen»: Nur zur internen Dokumentation. Kundinnen und Kunden sehen den Text nicht, und das Plugin verwendet ihn in keiner Meldung."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI4="«Support E-Mail» (Standard: leer): Kontaktadresse für Datenschutzfragen. Sie steht in der E-Mail über aufbewahrte Bestellungen und ist das Ziel der E-Mail-Links für Gastkunden im Tab «Datenschutz». Leer gilt die Absenderadresse der Globalen Konfiguration. Tragen Sie vor dem Livebetrieb eine eigene Adresse ein."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_TITLE="Tab «Checkout-Einwilligung»"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI1="«Kontrollfeld für die Einwilligung anzeigen» (Standard: Ja): Zeigt das Kontrollfeld im Schritt Versand und Zahlung. Bei «Nein» erscheint kein Kontrollfeld, und es wird nichts geprüft oder gespeichert."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI2="«Einwilligung erforderlich» (Standard: Ja): Der Checkout geht erst weiter, wenn das Kontrollfeld angekreuzt ist. Unter J2Commerce 6 prüft das Systemplugin das auf dem Server, auch bei der Bestätigung und beim Absenden der Zahlung. Unter J2Store 4 prüft nur ein Skript im Browser. Bei «Nein» ist das Kontrollfeld freiwillig."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI3="«Datenschutzerklärung Artikel» (Standard: keiner): Artikel, auf den der Link im Einwilligungstext zeigt. Ohne Artikel zeigt J2Commerce 6 den Linktext ohne Link, und unter J2Store 4 bleibt der Platzhalter <code>{privacy_policy}</code> sichtbar. Wählen Sie deshalb immer einen Artikel."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI4="«Einwilligungstext» (Standard: leer): Text neben dem Kontrollfeld. <code>{privacy_policy}</code> wird durch den Link auf den Artikel ersetzt. Leer gilt der Standardtext der jeweiligen Sprache. Ein eigener Text gilt für alle Sprachen der Website."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI5="Unter J2Commerce 6 speichert das Systemplugin die Einwilligung in den Datenschutz-Einwilligungen von Joomla, sobald J2Commerce die Bestellung angenommen hat, einmal pro Bestellung. Gespeichert werden Bestellnummer, Zeitpunkt, IP-Adresse und User-Agent, keine E-Mail-Adresse. Unter J2Store 4 und für frühere Bestellungen gibt es keinen solchen Eintrag."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI6="Beschreiben Sie diese Daten, ihren Zweck und ihre Speicherdauer in Ihrer Datenschutzerklärung."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_TITLE="Tab «Frontend-Selbstverwaltung»"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI1="«Schaltflächen zum Löschen von Adressen anzeigen» (Standard: Ja): Zeigt im Adressbereich der Profilseite bei jeder gespeicherten Adresse eine Schaltfläche zum Löschen. Angemeldete Kundinnen und Kunden löschen damit eigene Adressen sofort. Bestellungen bleiben unverändert."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI2="«Alle Daten löschen anzeigen» (Standard: Ja): Zeigt im Tab «Datenschutz» eine Schaltfläche für eine Löschanfrage."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI3="«Datenexport anzeigen» (Standard: Ja): Zeigt im Tab «Datenschutz» eine Schaltfläche für eine Exportanfrage."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI4="«Datenschutz-Bereich anzeigen» (Standard: Ja): Zeigt den Tab «Datenschutz» auf der Profilseite. Bei «Nein» fehlt der Tab."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI5="«Bestätigung durch Gastkunden» (Standard: Ja): Die Links in der Joomla-E-Mail zu Anfragen, welche die Administration erstellt, führen auf die Bestätigungsseite dieses Plugins. Dort bestätigen auch Personen ohne Benutzerkonto mit E-Mail-Adresse und Code. Bei «Nein» behält die E-Mail die Links von Joomla, die nur angemeldete Personen öffnen können. Gastbestellungen werden einer Anfrage in jedem Fall über die E-Mail-Adresse zugeordnet."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI6="Im Tab «Datenschutz» öffnen beide Schaltflächen für angemeldete Personen das Anfrageformular von Joomla, wo die Person die Art der Anfrage wählt. Gastkunden mit einer Bestellsitzung erhalten stattdessen einen E-Mail-Link an die «Support E-Mail». Sind beide Schaltflächen ausgeschaltet, zeigt der Tab nur den Stand der Einwilligung."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI7="Alle Einstellungen dieses Tabs wirken nur, solange dieses Plugin aktiviert ist."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_TITLE="Tab «Benachrichtigungen & Protokollierung»"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI1="«Admin-Benachrichtigungen» (Standard: Nein): Sendet eine E-Mail an die Administration, wenn eine Kundin oder ein Kunde eine gespeicherte Adresse löscht oder eine Löschanfrage ausgeführt wird. Für Exporte gibt es keine Benachrichtigung."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI2="«Admin-E-Mail» (Standard: leer, nur sichtbar bei «Admin-Benachrichtigungen» auf «Ja»): Empfänger der Benachrichtigungen. Leer gilt die Absenderadresse der Globalen Konfiguration. Die E-Mail kommt in der Sprache des Benutzerkontos mit dieser Adresse, sonst in der Standardsprache der Website."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI3="«Aktivitätsprotokollierung» (Standard: Nein): Schreibt Einträge in das Aktionsprotokoll von Joomla, nämlich zum Start einer Löschanfrage mit der Anzahl aufbewahrter Bestellungen, zu gelöschten Adressen, anonymisierten Bestellungen, gelöschten oder behaltenen Newsletterdaten und zu Adressen, die Kundinnen und Kunden selbst gelöscht haben. Jeder Eintrag enthält die IP-Adresse der handelnden Person."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI4="Bestehende Einträge des Aktionsprotokolls ändert oder löscht das Plugin nie."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_TITLE="Wie die Aufbewahrungsfrist berechnet wird"
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_P1="Die Frist jeder Bestellung beginnt am Ende des Geschäftsjahres, in dem sie aufgegeben wurde, nicht am Bestelldatum."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI1="Eine Bestellung bleibt bis zum Ende ihres Geschäftsjahres plus die eingestellte Anzahl Jahre erhalten, bis 23:59:59 Uhr dieses Tages. Ab dem folgenden Tag liegt sie ausserhalb der Frist."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI2="Beispiel mit 10 Jahren und Geschäftsjahresende 12-31: Eine Bestellung vom 15. März 2016 bleibt bis 31. Dezember 2026 erhalten und kann ab 1. Januar 2027 anonymisiert werden."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI3="Massgebend ist die Zeitzone der Website in der Globalen Konfiguration. J2Commerce speichert Bestellzeiten in UTC. Bei der Zeitzone Europe/Zurich gehört eine Bestellung vom 1. Januar 2017 um 00:30 Uhr deshalb zum Geschäftsjahr 2017, obwohl sie in UTC noch auf den 31. Dezember 2016 fällt."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI4="Eine Löschanfrage prüft jede Bestellung einzeln. Die geplante Aufgabe behandelt registrierte Kundinnen und Kunden erst, wenn auch ihre neueste Bestellung ausserhalb der Frist liegt, und anonymisiert dann alle ihre Bestellungen. Gastbestellungen behandelt sie einzeln."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI5="Das Plugin und die geplante Aufgabe haben je eigene Einstellungen. Tragen Sie in beiden dieselbe Frist und dasselbe Geschäftsjahresende ein."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_TITLE="Was gelöscht, anonymisiert und behalten wird"
PLG_PRIVACY_J2COMMERCE_HELP_DATA_P1="Eine Löschanfrage wirkt, wenn Sie sie in Joomla ausführen. Sie betrifft das Benutzerkonto der Anfrage sowie die Gastbestellungen und Gastadressen mit der E-Mail-Adresse der Anfrage oder des Kontos, in allen vorhandenen Shop-Tabellen, auch in J2Store-Tabellen, die nach einer Migration geblieben sind."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI1="<strong>Gelöscht:</strong> Gespeicherte Adressen (bei «Adressen löschen» auf «Ja»), die Warenkörbe des Benutzerkontos und der Newsletter-Abonnent in AcyMailing mit Listen, Feldern, Statistiken, Klicks, Verlauf und Warteschlange. Warenkörbe von Gästen bleiben, weil sie keine E-Mail-Adresse enthalten."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI2="<strong>Anonymisiert</strong> (Bestellungen ausserhalb der Frist, bei «Bestellungen anonymisieren» auf «Ja»): Die E-Mail-Adresse wird zu <code>anonymized@deleted.invalid</code>, der Rechnungsname zu «Anonymized User». Geleert werden Bestellnotiz, IP-Adresse sowie Namen, Adressen, Telefon- und Faxnummern, Firma und Steuernummer von Rechnung und Lieferung."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI3="<strong>Behalten:</strong> Bestellnummer, Datum, Beträge, Positionen und Produkte, weil die Buchhaltung sie braucht. Die Bestellung bleibt dem Benutzerkonto zugeordnet."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI4="Bestellungen innerhalb der Frist bleiben vollständig erhalten. Die Meldung nach der Ausführung und eine E-Mail an die Adresse der Anfrage nennen sie mit dem Ende ihrer Frist. Die geplante Aufgabe anonymisiert sie später."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI5="Einwilligungen aus dem Checkout und Newsletter-Einwilligungen aus dem Checkout verlieren beim Anonymisieren der Bestellung IP-Adresse und User-Agent. Der Eintrag bleibt als Nachweis mit Bestellnummer und Zeitpunkt. Eine Newsletter-Einwilligung aus dem Checkout wird sofort ungültig, weil der Newsletter-Abonnent gelöscht wird. IP-Adresse und User-Agent bleiben bis zur Anonymisierung der Bestellung, als Nachweis für bereits versandte Newsletter."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI6="Das Benutzerkonto selbst pseudonymisiert das Datenschutz-Plugin von Joomla für Benutzerkonten in derselben Anfrage, nicht dieses Plugin."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI7="Das Plugin lehnt eine Löschanfrage nicht wegen Aufbewahrungspflichten ab. Es lehnt sie nur ab, wenn Joomla ein Benutzerkonto mit einer anderen Adresse gefunden hat, z.B. muller@ für müller@."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI8="Das Aktionsprotokoll von Joomla und die Einwilligungseinträge löscht das Plugin nie."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI9="<strong>Weitere Einwilligungseinträge:</strong> Die Einwilligungen von Joomla bei der Registrierung des Benutzerkontos und die Einwilligungen aus dem Newsletterformular der Website werden sofort anonymisiert. E-Mail-Adresse, IP-Adresse und User-Agent werden durch einen neutralen Hinweis ersetzt, und der Eintrag wird ungültig. Ein Eintrag ohne Benutzerkonto zählt nur, wenn sein Feld für die E-Mail-Adresse die Adresse der Anfrage oder des Kontos als ganze Adresse nennt. Einträge eines anderen Benutzerkontos werden nie geändert."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI10="<strong>Platzhalter-Kontakt in AcyMailing:</strong> Gleicht AcyMailing die Joomla-Benutzer ab, legt die Pseudonymisierung des Benutzerkontos durch Joomla einen Kontakt mit der Adresse <code>UserID…removed@email.invalid</code> an. Das Plugin löscht ihn direkt nach der Anfrage, und die Bereinigungsaufgabe löscht übrig gebliebene. Gelöscht wird nur ein Kontakt, der zum pseudonymisierten Konto gehört, genau dessen Platzhalteradresse trägt und keinen Listeneintrag hat."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_NOTE1="Anonymisierte Daten lassen sich nicht wiederherstellen. Testen Sie Einstellungen und Abläufe zuerst auf einer Testinstallation mit Testdaten."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_TITLE="Unbefristete Lizenzen"
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_P1="Bei Bestellungen mit einem Produkt mit unbefristeter Lizenz behalten Löschanfrage und geplante Aufgabe nach Ablauf der Frist die E-Mail-Adresse der Bestellung, damit die Lizenz wieder aktiviert werden kann. Alles andere wird anonymisiert. Die anderen Bestellungen derselben Person werden normal behandelt."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI1="J2Commerce 6: Tabelle <code>#__j2commerce_metafields</code>, Zeile mit owner_id gleich der Produkt-ID, owner_resource <code>product</code>, metakey <code>is_lifetime_license</code> und metavalue <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI2="J2Store 4: Tabelle <code>#__j2store_product_customfields</code>, die Sie selbst anlegen, Zeile mit product_id gleich der Produkt-ID, field_name <code>is_lifetime_license</code> und field_value <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI3="Die SQL-Befehle zeigt die Meldung nach der Installation. Eine Eingabemaske gibt es nicht. Gross- und Kleinschreibung von <code>yes</code> spielen keine Rolle, andere Werte wie 1 gelten nicht."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI4="Kann das Plugin die Markierung wegen eines Datenbankfehlers nicht lesen, behält es die E-Mail-Adresse aller betroffenen Bestellungen und schreibt eine Warnung ins Protokoll."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI5="Ohne Markierung werden auch diese Bestellungen nach der Frist vollständig anonymisiert."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_TITLE="Anfragen von Gastkunden"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_P1="Das Anfrageformular von Joomla steht nur angemeldeten Personen offen. Für Kundinnen und Kunden ohne Benutzerkonto gilt dieser Ablauf:"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP1="Die Person meldet sich per E-Mail, z.B. über den Link im Tab «Datenschutz»."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP2="Sie erstellen die Anfrage unter «Benutzer → Datenschutz → Anfragen» mit genau der E-Mail-Adresse der Bestellungen. Joomla sendet einen Code, der 24 Stunden gültig ist."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP3="Die Person öffnet den Link in der E-Mail und bestätigt auf der Seite dieses Plugins mit E-Mail-Adresse und Code. Die Anfrage gilt dann als bestätigt, und Joomla benachrichtigt die Super-Benutzer."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP4="Sie führen die Anfrage aus und schliessen sie ab."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI1="Fehlversuche sind innerhalb von 15 Minuten begrenzt: 5 pro Sitzung, 5 pro E-Mail-Adresse und 20 pro IP-Adresse. Solange eine Grenze erreicht ist, lehnt die Seite auch den richtigen Code ab. Die Antwort verrät nicht, ob eine Anfrage existiert."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI2="Ein richtiger, aber abgelaufener Code macht die Anfrage ungültig. Erstellen Sie dann eine neue Anfrage."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI3="Joomla nimmt pro E-Mail-Adresse und Art der Anfrage nur eine offene Anfrage an."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI4="Der Ablauf braucht das aktivierte Plugin «System - J2Commerce Datenschutz-Einwilligung» und «Bestätigung durch Gastkunden» auf «Ja»."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI5="Mit dem separaten, optionalen Plugin «System - Datenschutzanfragen» können Personen ohne Konto Löschanfragen auch selbst stellen."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_TITLE="Deaktivieren und deinstallieren"
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI1="Ist dieses Plugin deaktiviert, verarbeitet Joomla bei Anfragen keine Shopdaten. Der Tab «Datenschutz», die Schaltflächen zum Löschen von Adressen und das Kontrollfeld im Checkout verschwinden, und die Bestätigungsseite ist nicht erreichbar. Die geplante Aufgabe läuft weiter."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI2="Die Deinstallation entfernt auch die beiden mitgelieferten Plugins, alle geplanten Aufgaben vom Typ «J2Commerce - Automatische Datenlöschung» und die Tabelle <code>#__privacy_j2commerce_attempts</code> mit den Zählern der Bestätigungsseite."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI3="Erhalten bleiben die kopierten Template-Overrides, alle Shopdaten (bereits anonymisierte bleiben anonymisiert), die Markierungen unbefristeter Lizenzen, die Einwilligungseinträge und das Aktionsprotokoll."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>Der Tab «Datenschutz» fehlt:</strong> Prüfen Sie, ob dieses Plugin aktiviert ist, ob «Datenschutz-Bereich anzeigen» auf «Ja» steht und ob das Template die Overrides <code>myprofile/default.php</code> und <code>myprofile/default_privacy.php</code> hat."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>Die Schaltflächen im Tab führen auf die Startseite:</strong> Es fehlt der Menüeintrag vom Typ «Datenschutz → Anfrage erstellen»."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>Das Kontrollfeld fehlt (J2Commerce 6):</strong> Prüfen Sie, ob «System - J2Commerce Datenschutz-Einwilligung» aktiviert ist, ob J2Commerce 6.3.4 oder neuer installiert ist und ob ein eigenes Checkout-Override das Ereignis <code>AfterDisplayShippingPayment</code> auslöst."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>Der Checkout geht trotz angekreuztem Kontrollfeld nicht weiter (J2Commerce 6):</strong> Die Einwilligung gilt für den aktuellen Warenkorb. Ändert sich der Warenkorb, z.B. durch eine Anmeldung in einem anderen Tab, oder wird der Schritt neu angezeigt, muss die Person das Kontrollfeld erneut ankreuzen."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>Die Schaltfläche zum Fortfahren bleibt gesperrt (J2Store 4):</strong> Das Kontrollfeld ist nicht angekreuzt, oder der Browser lädt <code>consent-validator.js</code> nicht. Ersetzen Sie ein Checkout-Override einer früheren Plugin-Version durch die mitgelieferte Fassung."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>Keine E-Mail über aufbewahrte Bestellungen:</strong> Eine E-Mail geht nur weg, wenn Bestellungen aufbewahrt werden oder Bestellungen mit unbefristeter Lizenz ihre E-Mail-Adresse behalten. War die Adresse ungültig oder scheiterte der Versand, zeigt die Meldung nach der Ausführung eine Warnung mit der Liste. Informieren Sie die Person dann selbst."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>Warnung zu Newsletterdaten oder Einwilligungseinträgen:</strong> Der Abonnent wurde nicht entfernt, die Suche schlug fehl, oder Einwilligungseinträge konnten nicht bearbeitet werden. Solange der Abonnent bleibt, bleiben auch die Newsletter-Einwilligungen der Anfrage unverändert. Beheben Sie die Ursache gemäss Protokoll (Kategorie <code>plg_privacy_j2commerce</code>) und führen Sie die Löschung erneut aus."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI8="<strong>Abgelehnte Löschanfrage oder Warnung beim Export wegen abweichender Adresse:</strong> Joomla hat ein Konto mit einer ähnlichen, aber anderen Adresse gefunden. Prüfen Sie die Adresse der Anfrage und senden Sie einen solchen Export nicht."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI9="<strong>Der Aufgabentyp fehlt in den geplanten Aufgaben:</strong> Aktivieren Sie «Task - J2Commerce Datenschutz-Bereinigung»."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI10="<strong>Die Bestätigungsseite bestätigt nie:</strong> Prüfen Sie Adresse und Code und warten Sie 15 Minuten, falls eine Grenze erreicht ist. Fehlt die Tabelle <code>#__privacy_j2commerce_attempts</code>, bestätigt die Seite aus Sicherheitsgründen nichts. Installieren Sie das Paket dann erneut."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI11="<strong>Eine unbefristete Lizenz wird nicht erkannt:</strong> Prüfen Sie den Namen <code>is_lifetime_license</code>, den Wert <code>yes</code> und die Produkt-ID."
