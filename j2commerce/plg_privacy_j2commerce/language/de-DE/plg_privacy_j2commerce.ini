PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP2_NAV="<strong>System → Verwalten → Plugins → Privacy - J2Commerce Datenschutz</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_RETENTION_HINT="<strong>10</strong> – Schweiz: OR Art. 958f, Deutschland: AO §147. Österreich: 7, UK/Spanien: 6."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_LEGAL_BASIS_HINT="Gesetzliche Grundlage für die Aufbewahrungsfrist eintragen."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SUPPORT_EMAIL_HINT="Kontaktadresse, die Benutzern bei Datenschutzanfragen angezeigt wird. <strong>Muss konfiguriert werden.</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CONSENT_HINT="Zeigt eine Datenschutz-Einwilligung im Checkout an. Verlinken Sie die Datenschutzerklärung als Joomla-Artikel. Ist die Einwilligung erforderlich, kann der Checkout erst nach dem Aktivieren des Kontrollfelds fortgesetzt werden. Unter J2Store/J2Commerce 4 prüft dies das Template-Override im Browser, unter J2Commerce 6 prüft es das mitgelieferte System-Plugin auf dem Server."
