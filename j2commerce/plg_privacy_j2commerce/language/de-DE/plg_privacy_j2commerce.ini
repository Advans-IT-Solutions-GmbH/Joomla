; Installer-Hinweise
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="Privacy - J2Commerce Datenschutz wurde auf Version %s aktualisiert."
PLG_PRIVACY_J2COMMERCE_ENABLE_HINT="Das Plugin ist deaktiviert. Unter <strong>System → Verwalten → Plugins</strong> nach <strong>Privacy - J2Commerce Datenschutz</strong> suchen und aktivieren."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC_TASK_FAILED="<strong>System → Verwalten → Plugins</strong> → nach <strong>Privacy - J2Commerce Datenschutz</strong> suchen → aktivieren. Das mitgelieferte Plugin <strong>Task - J2Commerce Datenschutz-Bereinigung</strong> konnte <strong>nicht</strong> automatisch installiert werden. Siehe die Warnung oben, und installieren Sie das Paket erneut."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_MISSING="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) wurde im Installationspaket nicht gefunden."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_INSTALL_FAILED="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) konnte nicht automatisch installiert werden. Die automatische Bereinigung steht erst nach dessen Installation zur Verfügung."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_MISSING="Weder J2Commerce 6 (com_j2commerce) noch J2Store/J2Commerce 4 (com_j2store) ist installiert. Das Plugin hat keine J2Commerce-Daten zu verarbeiten, bis eine der beiden Komponenten installiert ist."
PLG_PRIVACY_J2COMMERCE_WARN_OVERRIDES_FAILED="Folgende Template-Overrides konnten nicht kopiert werden: %s. Bitte manuell aus plugins/privacy/j2commerce/overrides/ kopieren."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASKS_REMOVED="%d geplante Aufgabe(n) vom Typ J2Commerce - Automatische Datenlöschung wurden gelöscht."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASK_PLUGIN_REMOVED="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) wurde zusammen mit diesem Plugin entfernt."
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE="Erteilt bei"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_CHECKOUT="Checkout, Bestellung %s"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_ACCOUNT="Benutzerkonto (Registrierung oder Profil)"
PLG_PRIVACY_J2COMMERCE_NO_CONSENT_RECORDED="Für Ihr Konto oder Ihre Bestellungen ist keine Einwilligung protokolliert."
PLG_PRIVACY_J2COMMERCE_MYPROFILE_GUEST_REQUEST_DESC="Das Online-Formular für Datenschutzanfragen setzt ein Benutzerkonto voraus. Als Gastkundin oder Gastkunde senden Sie Ihre Anfrage auf Auskunft oder Löschung Ihrer Daten per E-Mail."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_MISSING="Das mitgelieferte System-Plugin (System - J2Commerce Datenschutz-Einwilligung) wurde im Installationspaket nicht gefunden. Die Checkout-Einwilligung wird weder geprüft noch protokolliert."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_INSTALL_FAILED="Das mitgelieferte System-Plugin (System - J2Commerce Datenschutz-Einwilligung) konnte nicht automatisch installiert werden. Die Checkout-Einwilligung wird erst nach dessen Installation geprüft und protokolliert."
PLG_PRIVACY_J2COMMERCE_LEGACY_CONSENTS_ANONYMIZED="%d Einwilligungseintrag/-einträge einer früheren Version des Site-Templates wurden anonymisiert (E-Mail-Adresse, IP-Adresse und User-Agent entfernt). Sie zählen nicht mehr als Einwilligung."
PLG_PRIVACY_J2COMMERCE_WARN_LEGACY_CONSENTS_FAILED="Einwilligungseinträge einer früheren Version des Site-Templates konnten nicht anonymisiert werden: %s. Der Bereinigungs-Task versucht es erneut."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_OUTDATED="Diese J2Commerce-6-Checkout-Overrides lösen weder das J2Commerce-Ereignis AfterDisplayShippingPayment aus noch zeigen sie das Kontrollfeld für die Einwilligung an: %s. Ist eine Einwilligung erforderlich, kann der Checkout damit nicht abgeschlossen werden. Bitte den Aufruf des Ereignisses AfterDisplayShippingPayment aus dem J2Commerce-Kerntemplate (components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php) vor der Weiter-Schaltfläche ergänzen."
PLG_PRIVACY_J2COMMERCE_WARN_J2STORE_CHECKOUT_OVERRIDE_OUTDATED="In diesen von einer älteren Version dieses Plugins ausgelieferten J2Store-4-Checkout-Overrides fehlt mindestens ein Bestandteil, den der Schritt zum Absenden braucht: %s. Erforderlich sind der Joomla-Formular-Token, die drei versteckten Felder task, option und view sowie die Weiter-Schaltfläche als type=\"button\" mit der ID button-payment-method, die das Attribut disabled tragen muss, sobald $_showConsent und $_consentRequired beide zutreffen, damit eine erforderliche Zustimmung nicht übergangen wird, solange der Validator noch nicht geladen ist. J2Store 4.1.8 lehnt den Schritt shipping_payment_method_validate ohne Token mit „Invalid Token“ ab. Ein Update überschreibt solche Kopien nicht. Bitte durch overrides/com_j2store/checkout/default_shipping_payment.php dieses Pakets ersetzen."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_BUNDLED="Diese J2Commerce-6-Checkout-Overrides stammen von einer früheren Version dieses Plugins und wurden bei diesem Update nicht verändert, weil sie von der ausgelieferten Fassung abweichen oder nicht umbenannt werden konnten: %s. Sie ersetzen die J2Commerce-Kerntemplates (bootstrap5 und uikit), und ihnen fehlen neuere Funktionen wie Zusatzfelder im Zahlungsschritt und Beschreibungen der Zahlungsarten. Bitte mit components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php abgleichen und entfernen, wenn sie keine eigenen Änderungen enthalten."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_TOO_OLD="J2Commerce %1$s ist installiert. Das Kontrollfeld für die Einwilligung wird über das J2Commerce-Ereignis AfterDisplayShippingPayment angezeigt, das die J2Commerce-Checkout-Templates ab Version %2$s auslösen. Bitte J2Commerce aktualisieren. Bis dahin fehlt das Kontrollfeld, und bei erforderlicher Einwilligung kann der Checkout nicht abgeschlossen werden."
PLG_PRIVACY_J2COMMERCE_CHECKOUT_OVERRIDE_RETIRED="Unveränderte J2Commerce-6-Checkout-Overrides, die eine frühere Version dieses Plugins kopiert hat, wurden deaktiviert (umbenannt mit der Endung %2$s): %1$s. Der Checkout-Schritt kommt jetzt aus dem J2Commerce-Kerntemplate, einschliesslich des Kontrollfelds für die Einwilligung. Die umbenannten Dateien können gelöscht werden, sobald der Checkout funktioniert."

; Guest privacy requests
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_LABEL="Bestätigung durch Gastkunden"
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_DESC="Kundinnen und Kunden ohne Benutzerkonto (Gastbestellungen) bestätigen eine Datenschutzanfrage, welche die Administration unter Benutzer → Datenschutz → Anfragen erstellt hat, auf einer Seite dieses Plugins mit ihrer E-Mail-Adresse und dem Code aus der Anfrage-E-Mail. Die Links in dieser E-Mail führen auf diese Seite. Gastbestellungen werden einer Anfrage in jedem Fall über deren E-Mail-Adresse zugeordnet."
PLG_PRIVACY_J2COMMERCE_CONFIRM_TITLE="Datenschutzanfrage bestätigen"
PLG_PRIVACY_J2COMMERCE_CONFIRM_INTRO="Geben Sie die E-Mail-Adresse ein, für welche die Anfrage erstellt wurde, sowie den Bestätigungscode aus der E-Mail. Der Code ist 24 Stunden gültig."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EMAIL_LABEL="E-Mail-Adresse"
PLG_PRIVACY_J2COMMERCE_CONFIRM_TOKEN_LABEL="Bestätigungscode"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUBMIT="Anfrage bestätigen"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUCCESS="Vielen Dank. Ihre Anfrage ist bestätigt und wird nun bearbeitet."
PLG_PRIVACY_J2COMMERCE_CONFIRM_FAILED="Die Anfrage konnte nicht bestätigt werden. Prüfen Sie die E-Mail-Adresse und den Bestätigungscode. Wenden Sie sich an uns, falls das Problem bestehen bleibt."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EXPIRED="Der Bestätigungscode ist abgelaufen, die Anfrage wurde deshalb aufgehoben. Bitte wenden Sie sich an uns, damit wir eine neue Anfrage erstellen."
PLG_PRIVACY_J2COMMERCE_CONFIRM_UNAVAILABLE="Datenschutzanfragen können auf dieser Seite nicht bestätigt werden. Bitte wenden Sie sich an uns."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST="Ihre Anfrage zur Löschung Ihrer Daten wurde ausgeführt. Ihre gespeicherten Adressen und ein allfälliges Newsletter-Abonnement wurden gelöscht. Bestelldaten unterliegen einer gesetzlichen Aufbewahrungspflicht und werden bis zum angegebenen Datum aufbewahrt. Danach werden sie anonymisiert. Bei Bestellungen mit unbefristeter Lizenz bleibt die Bestell-E-Mail-Adresse erhalten, damit die Lizenz reaktiviert werden kann."
PLG_PRIVACY_J2COMMERCE_ADMIN_NOTIFICATION_GUEST_DATA_DELETION="Gastkunde %s (ohne Benutzerkonto) hat eine Datenlöschung beantragt."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST_ADDRESSES_KEPT="Ihre Anfrage zur Löschung Ihrer Daten wurde ausgeführt. Ein allfälliges Newsletter-Abonnement wurde gelöscht. Gespeicherte Adressen löscht dieser Shop gemäss seinen Einstellungen nicht. Wenden Sie sich an uns, wenn Sie deren Löschung wünschen. Bestelldaten unterliegen einer gesetzlichen Aufbewahrungspflicht und werden bis zum angegebenen Datum aufbewahrt. Danach werden sie anonymisiert. Bei Bestellungen mit unbefristeter Lizenz bleibt die Bestell-E-Mail-Adresse erhalten, damit die Lizenz reaktiviert werden kann."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_ADDRESSES_KEPT="Ihre Anfrage zur Löschung Ihrer Daten wurde ausgeführt. Ihre Warenkörbe und Newsletter-Daten wurden gelöscht, und Ihr Kundenkonto wurde anonymisiert. Gespeicherte Adressen löscht dieser Shop gemäss seinen Einstellungen nicht. Wenden Sie sich an uns, wenn Sie deren Löschung wünschen. Bestelldaten unterliegen einer gesetzlichen Aufbewahrungspflicht und werden bis zum angegebenen Datum aufbewahrt. Danach werden sie anonymisiert. Bei Bestellungen mit unbefristeter Lizenz bleibt die Bestell-E-Mail-Adresse erhalten, damit die Lizenz reaktiviert werden kann."
PLG_PRIVACY_J2COMMERCE_REMOVAL_ACCOUNT_MISMATCH="J2Commerce: Joomla hat für die Anfrageadresse %2$s das Benutzerkonto %1$s gefunden. Das sind verschiedene Adressen (Joomla vergleicht E-Mail-Adressen ohne Akzente und ohne Sonderformen von Buchstaben). Die Anfrage wurde abgelehnt, damit die Daten dieses Kontos unverändert bleiben. Prüfen Sie die Adresse der Anfrage."
PLG_PRIVACY_J2COMMERCE_EXPORT_ACCOUNT_MISMATCH="J2Commerce: Joomla hat für die Anfrageadresse %2$s das Benutzerkonto %1$s gefunden. Das sind verschiedene Adressen. Die J2Commerce-Daten dieses Kontos sind nicht im Export, Joomla fügt aber die Daten des Kontos selbst hinzu. Senden Sie diesen Export nicht. Prüfen Sie die Adresse der Anfrage."
PLG_PRIVACY_J2COMMERCE_WARN_ATTEMPTS_TABLE_FAILED="Die Tabelle der Bestätigungsversuche (#__privacy_j2commerce_attempts) konnte nicht angelegt werden: %s. Bis sie besteht, bestätigt die Bestätigungsseite für Datenschutzanfragen nichts. Installieren Sie das Paket erneut."
