COM_APPOINTMENTS_MAIL_APPROVED_SUBJECT="Validé : {event_title}"
COM_APPOINTMENTS_MAIL_APPROVED_BODY="Bonjour {invitee_name},\n\nL'hôte a validé votre rendez-vous.\n{event_title}\nDe : {start}\nÀ : {end}\nFuseau horaire : {timezone}\nLieu : {location}\n{conference_url}\n\nAcceptez l'invitation jointe pour mettre à jour votre calendrier."
COM_APPOINTMENTS_MAIL_RESCHEDULE_SUBJECT="Nouvel horaire : {event_title}"
