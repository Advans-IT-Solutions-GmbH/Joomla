COM_DMARCREPORTS_DETAIL_DNS_DISABLED="DNS-Diagnose ist ausgeschaltet. Aktivieren Sie sie in den Komponentenoptionen, um die veröffentlichten DMARC- und SPF-Einträge dieser Domain zu prüfen. Jede Prüfung sendet den Domainnamen an Ihren konfigurierten DNS-Resolver."
