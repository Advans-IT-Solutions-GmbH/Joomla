; Help page
COM_J2STORE_CLEANUP_HELP_TITLE="J2Store Extension Cleanup: Help"
COM_J2STORE_CLEANUP_HELP_LINK="Help: how the scan works and what removal does"
COM_J2STORE_CLEANUP_HELP_INTRO="This page explains what the component checks, how it classifies extensions, what a removal does and what it never does, which permissions are needed and what to do when something goes wrong."
COM_J2STORE_CLEANUP_HELP_CONTENTS="Contents of the help"
COM_J2STORE_CLEANUP_HELP_BACK="Back to J2Store Extension Cleanup"
COM_J2STORE_CLEANUP_HELP_PURPOSE_TITLE="What the component does"
COM_J2STORE_CLEANUP_HELP_PURPOSE_DESC="J2Store Extension Cleanup helps with the move from J2Store to J2Commerce. It lists the extensions of the site that belong to J2Store or J2Commerce, scans their PHP files for programming interfaces (APIs) that the running Joomla version no longer has, and shows the result in groups. A user with the required permissions can uninstall selected extensions from this list."
COM_J2STORE_CLEANUP_HELP_PURPOSE_NOT="The component does not migrate data and does not change products, orders or customers itself. It has no database tables of its own and no scheduled task. Opening the page only reads the list of extensions and their files."
COM_J2STORE_CLEANUP_HELP_WHEN_TITLE="When to use it and when not"
COM_J2STORE_CLEANUP_HELP_WHEN_USE="Use it after the migration to J2Commerce, and before or after an update of Joomla, to find add-ons that use removed APIs or whose files are missing on the server."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT="Do not use it:"
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_PROOF="As proof of compatibility. A clean scan does not show that an extension works, and a finding alone is no reason to remove an extension."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_NEEDED="To remove an extension that the site still needs. Look for an updated version first."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_BACKUP="Without a current backup of files and database that you can restore."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER="A sensible order:"
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_1="Back up the whole site, files and database."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_2="Migrate the shop to J2Commerce and test it: products, orders, checkout and customer accounts."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_3="Open this component and review every result."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_4="Remove only extensions that the site no longer needs or whose files are missing."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_5="Clear the Joomla cache and test the site and the shop again."
COM_J2STORE_CLEANUP_HELP_REQ_TITLE="Prerequisites and permissions"
COM_J2STORE_CLEANUP_HELP_REQ_BACKUP="Make a complete backup of files and database before you remove anything. The component makes no backup, checks no dependencies between extensions and cannot undo a removal."
COM_J2STORE_CLEANUP_HELP_REQ_VIEW="To open the page, see the scan and read this help, a user needs «%1$s» on this component. The «%2$s» button in the toolbar and the link below the page title open this help."
COM_J2STORE_CLEANUP_HELP_REQ_REMOVE="To remove extensions, a user also needs «%1$s» on this component and both «%2$s» and «%1$s» on Joomla's Extensions manager (System → Manage → Extensions). The component therefore never lets anybody uninstall more than Joomla itself allows."
COM_J2STORE_CLEANUP_HELP_REQ_READONLY="Without these permissions the page is read only: it shows no checkboxes and no «Remove Selected Extensions» button, and a removal request is refused."
COM_J2STORE_CLEANUP_HELP_REQ_DEFAULT="In a standard Joomla installation, the group Administrator has no access to the Extensions manager. Administrators can therefore see the scan but cannot remove anything. Super Users can."
COM_J2STORE_CLEANUP_HELP_DETECT_TITLE="Which extensions are listed"
COM_J2STORE_CLEANUP_HELP_DETECT_INTRO="The page lists these extensions of the site:"
COM_J2STORE_CLEANUP_HELP_DETECT_COMPONENTS="Components whose element starts with <code>com_j2store_</code> or <code>com_j2commerce_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_PLUGINS="Plugins of the groups <code>j2store</code> and <code>j2commerce</code>, and plugins whose element is <code>j2store</code> or <code>j2commerce</code> or starts with <code>j2store_</code> or <code>j2commerce_</code>, also with the prefix <code>plg_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_MODULES="Modules whose element is <code>mod_j2store</code> or <code>mod_j2commerce</code> or starts with <code>mod_j2store_</code> or <code>mod_j2commerce_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_TEMPLATES="Templates and libraries whose element is <code>j2store</code> or <code>j2commerce</code> or starts with one of them followed by <code>_</code> or <code>/</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_CORE="The shop components J2Store (<code>com_j2store</code>) and J2Commerce (<code>com_j2commerce</code>) are shown as «Core» and can never be removed."
COM_J2STORE_CLEANUP_HELP_DETECT_NEVER="Never listed: this component itself, file extensions and packages, extensions that Joomla marks as protected or locked, and entries whose element does not start with a lower-case letter or digit or contains characters other than lower-case letters, digits, underscore, dot and hyphen."
COM_J2STORE_CLEANUP_HELP_SCAN_TITLE="How the scan classifies extensions"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER="Each listed extension gets one result, checked in this order:"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_CORE="«Core»: the shop component J2Store or J2Commerce."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_NO_FILES="«No files»: the folder of the extension does not exist on the server. For a component, the administrator, site and API folders must all be missing."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_COMPATIBLE="«Compatible»: the scan finds none of the APIs listed below."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_INCOMPATIBLE="«Incompatible»: the scan finds at least one of them."
COM_J2STORE_CLEANUP_HELP_SCAN_FILES="The scan reads every PHP file in the folders of the extension, including all subfolders. It first removes comments in the form <code>/* … */</code> and <code>// …</code> and then searches for the names of APIs that the running Joomla version no longer has:"
COM_J2STORE_CLEANUP_HELP_SCAN_J4="On Joomla 5 and 6: <code>JPlugin</code>, <code>JModel</code> and <code>JModelLegacy</code>, <code>JTable</code>, <code>JView</code> and <code>JViewLegacy</code>, <code>JController</code> and <code>JControllerLegacy</code>, <code>JForm</code> (removed in Joomla 4)."
COM_J2STORE_CLEANUP_HELP_SCAN_J6="On Joomla 6 also: <code>JFactory</code>, <code>JText</code>, <code>JHtml</code>, <code>JRoute</code>, <code>JUri</code>, <code>JSession</code>, <code>Factory::getUser()</code>, <code>Factory::getDbo()</code>, <code>Factory::getSession()</code>, <code>Factory::getDocument()</code> and <code>$this-&gt;app</code> (removed in Joomla 6)."
COM_J2STORE_CLEANUP_HELP_SCAN_DETAILS="Click the text in the column «Issues found» to see the findings, for example «JFactory (removed in Joomla 6)». There are currently no checks for J2Store-specific APIs, so classes of the F0F framework are not flagged."
COM_J2STORE_CLEANUP_HELP_SCAN_J5_NOTE="On Joomla 5, the APIs that Joomla 6 removes still work through the backward compatibility plugin, so the scan does not flag them there. An extension shown as «Compatible» on Joomla 5 can be «Incompatible» on Joomla 6."
COM_J2STORE_CLEANUP_HELP_SCAN_LIMITS="The scan compares text only. A name inside a text string is flagged as well, and code in files other than PHP is not checked. Version numbers, the author and whether the extension is enabled are not evaluated."
COM_J2STORE_CLEANUP_HELP_RESULT_TITLE="Results on the page"
COM_J2STORE_CLEANUP_HELP_RESULT_INCOMPATIBLE="«Incompatible Extensions (n)»: name, type, element, status and the findings. These entries can be selected for removal."
COM_J2STORE_CLEANUP_HELP_RESULT_NO_FILES="«No Files Found (n)»: entries without files. They can be selected, except parts of a package. These show «Part of a package: uninstall the package under System → Manage → Extensions.» and have no checkbox."
COM_J2STORE_CLEANUP_HELP_RESULT_COMPATIBLE="«Compatible Extensions (n)»: the compatible extensions and the shop component. They cannot be selected."
COM_J2STORE_CLEANUP_HELP_RESULT_ALL="If nothing is incompatible and no files are missing, the page shows «All extensions are compatible.». If the site has none of these extensions, not even the shop component, it shows «No J2Store/J2Commerce extensions found.»."
COM_J2STORE_CLEANUP_HELP_REMOVE_TITLE="What a removal does"
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_1="Select the checkboxes of the extensions to remove. The checkbox in the column heading selects all entries of the table."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_2="Click «Remove Selected Extensions»."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_3="Read the question and confirm it."
COM_J2STORE_CLEANUP_HELP_REMOVE_CHECK="Before removing anything, the server checks the whole selection again. If one selected entry no longer exists or may not be removed, nothing at all is removed and the error names the entry."
COM_J2STORE_CLEANUP_HELP_REMOVE_INCOMPATIBLE="An extension with files is removed with Joomla's uninstaller, as under System → Manage → Extensions: its uninstall routine runs, and Joomla deletes the files and database entries registered for it. What exactly is deleted depends on the extension."
COM_J2STORE_CLEANUP_HELP_REMOVE_NO_FILES="For an entry without files, Joomla cannot run an uninstall. Only the entry in Joomla's list of extensions is deleted, and the message says «(database entry removed, files may remain)». Other traces of the extension, for example its database tables, stay."
COM_J2STORE_CLEANUP_HELP_REMOVE_REFUSED="If Joomla's uninstaller refuses, the entry stays and the error says «Joomla refused to uninstall extension record n.». The component never forces such a removal."
COM_J2STORE_CLEANUP_HELP_REMOVE_EXCEPTION="If the uninstall stops with an error, the component checks the folders of the extension again. Only if no folder is left, the entry is deleted as for an entry without files. Otherwise the entry stays and the error is shown. Tables of the extension may remain in both cases."
COM_J2STORE_CLEANUP_HELP_REMOVE_SEPARATE="Every selected extension is removed separately. If a later one fails, the earlier removals stay done."
COM_J2STORE_CLEANUP_HELP_REMOVE_MESSAGES="Afterwards the page shows how many extensions were removed, how many only partially (entry deleted, files may remain) and how many could not be removed, with the details."
COM_J2STORE_CLEANUP_HELP_NEVER_TITLE="What the component never does"
COM_J2STORE_CLEANUP_HELP_NEVER_CORE="It never removes the shop components J2Store and J2Commerce or itself, also not on a manipulated request."
COM_J2STORE_CLEANUP_HELP_NEVER_PROTECTED="It never removes extensions that Joomla marks as protected or locked, file extensions, packages, extensions outside the list above, or an extension shown as «Compatible»."
COM_J2STORE_CLEANUP_HELP_NEVER_PACKAGE="It never deletes the entry of a package part without files. Uninstall the package instead."
COM_J2STORE_CLEANUP_HELP_NEVER_DATA="It does not change products, orders or customers itself. The uninstall routine of a removed extension can, however, delete the tables and data of that extension."
COM_J2STORE_CLEANUP_HELP_NEVER_EXTRA="It makes no backup, checks no dependencies and migrates no data."
COM_J2STORE_CLEANUP_HELP_UNDO_TITLE="What cannot be undone"
COM_J2STORE_CLEANUP_HELP_UNDO_DESC="A removal cannot be undone in this component. There is no rollback and no trash."
COM_J2STORE_CLEANUP_HELP_UNDO_RESTORE="To get a removed extension back, restore your backup or install the extension again. A new installation does not bring back data that the uninstall routine deleted."
COM_J2STORE_CLEANUP_HELP_OPTIONS_TITLE="Options and permissions"
COM_J2STORE_CLEANUP_HELP_OPTIONS_DESC="The component has no settings of its own. The «%1$s» button in the toolbar opens only the tab «%2$s». The button is shown to users with «%3$s» or «%4$s». Changing the permissions requires «%3$s»."
COM_J2STORE_CLEANUP_HELP_OPTIONS_ADMIN="«%1$s»: change the permissions of this component and open its Options."
COM_J2STORE_CLEANUP_HELP_OPTIONS_OPTIONS="«%1$s»: shows the Options button."
COM_J2STORE_CLEANUP_HELP_OPTIONS_MANAGE="«%1$s»: open the page, see the scan and read this help, without changing anything."
COM_J2STORE_CLEANUP_HELP_OPTIONS_DELETE="«%1$s»: remove extensions, together with the permissions on Joomla's Extensions manager named under «Prerequisites and permissions»."
COM_J2STORE_CLEANUP_HELP_OPTIONS_INHERIT="Joomla permissions are inherited from parent groups and from the Global Configuration unless they are set here. An inherited Denied cannot be overridden here with Allowed."
COM_J2STORE_CLEANUP_HELP_OPTIONS_UPGRADE="Installing or updating the component grants neither «%1$s» nor «%2$s» automatically. Existing rules stay as they are."
COM_J2STORE_CLEANUP_HELP_TROUBLE_TITLE="Typical problems and what to do"
COM_J2STORE_CLEANUP_HELP_TROUBLE_DENIED="The page is refused with «%1$s»: the user lacks «%2$s» on this component. A Super User can grant it in the Options of the component, tab «%3$s»."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NO_BUTTON="No checkboxes and no «Remove Selected Extensions» button: one of the removal permissions under «Prerequisites and permissions» is missing, or no listed entry may be removed."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FLAGGED="An extension you need is shown as «Incompatible»: do not remove it. Open the findings, compare them with the code of the extension and look for an updated version. A text match can be a false alarm."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NOT_ELIGIBLE="«Extension record n is protected or outside the eligible cleanup scope.» or «Extension record n was not found.»: the entry changed after the page was loaded, for example it was removed in another tab or has no findings any more, or the request was manipulated. Reload the page and select again."
COM_J2STORE_CLEANUP_HELP_TROUBLE_REFUSED="«Joomla refused to uninstall extension record n.»: Joomla's uninstaller refused the removal. Check the further messages on the page and try the uninstall under System → Manage → Extensions."
COM_J2STORE_CLEANUP_HELP_TROUBLE_PACKAGE="An entry without files shows «Part of a package: …» and has no checkbox: uninstall the package under System → Manage → Extensions."
COM_J2STORE_CLEANUP_HELP_TROUBLE_DB_ONLY="«… (database entry removed, files may remain)»: only the entry was deleted. Remove remaining files and tables of the extension by hand if needed."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FAILED="«Failed to remove n extension(s): …»: the details name the extension and the error. The entry stays. Earlier removals of the same selection are not undone."
COM_J2STORE_CLEANUP_HELP_TROUBLE_BROKEN="The site shows errors after a removal: another extension probably needed the removed one. Restore your backup or install the removed extension again."
COM_J2STORE_CLEANUP_HELP_TROUBLE_J2COMMERCE="J2Commerce plugins or modules are listed or flagged: this is expected. The list holds every extension that matches the names above, and the result depends only on the scan."
COM_J2STORE_CLEANUP_HELP_TROUBLE_MISSING="An extension you know is not listed: its element does not match the names above, or it is already uninstalled. Check System → Manage → Extensions."
