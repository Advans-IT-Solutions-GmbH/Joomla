PLG_TASK_APPOINTMENTS="Aufgabe - Termine"
PLG_TASK_APPOINTMENTS_XML_DESCRIPTION="Sendet Terminerinnerungen und wendet die Aufbewahrung für Buchungen, Nachweise und Zugriffszähler an."
PLG_TASK_APPOINTMENTS_REMINDERS_TITLE="Termine: Erinnerungen"
PLG_TASK_APPOINTMENTS_REMINDERS_DESC="Sendet fällige Kalendererinnerungen für bestätigte Termine. Die Vorlaufzeiten werden in den Komponentenoptionen festgelegt."
PLG_TASK_APPOINTMENTS_RETENTION_TITLE="Termine: Aufbewahrung"
PLG_TASK_APPOINTMENTS_RETENTION_DESC="Entfernt abgelaufene Buchungsdaten, Nachweise und Zugriffszähler. Die Aufbewahrung wird in den Komponentenoptionen und Terminarten festgelegt."
PLG_TASK_APPOINTMENTS_BATCH_SIZE="Stapelgrösse"
PLG_TASK_APPOINTMENTS_BATCH_SIZE_DESC="Maximale Anzahl von Buchungskandidaten, Nachweisen und Zählerfenstern je Ausführung (1–1000). Erneut ausführen, um den nächsten Stapel zu verarbeiten."
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_TITLE="Termine: Aufräumen der Internetkalender"
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_DESC="Setzt gesperrte Geräte in die nächste Aufräumphase, wenn eine Phase abgelaufen ist, und löscht Zähler fehlgeschlagener Anmeldungen, die älter als 24 Stunden sind. Ohne Wirkung, solange die Internetkalender ausgeschaltet sind."
PLG_TASK_APPOINTMENTS_TEAMLOG_TITLE="Termine: Protokoll der Internetkalender"
PLG_TASK_APPOINTMENTS_TEAMLOG_DESC="Löscht Protokolleinträge der Internetkalender, die älter als zwölf Monate sind. Die verbleibende Kette bleibt prüfbar. Ohne Wirkung, solange die Internetkalender ausgeschaltet sind."
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_TITLE="Termine: abgelaufene Einladungen"
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_DESC="Schliesst abgelaufene Einladungen externer Benutzer und löscht deren Adressen. Ohne Wirkung, solange die Internetkalender ausgeschaltet sind."
PLG_TASK_APPOINTMENTS_TEAMRETENTION_TITLE="Termine: Aufbewahrung der Internetkalender"
PLG_TASK_APPOINTMENTS_TEAMRETENTION_DESC="Löscht in jedem Internetkalender die Einträge, die länger zurückliegen als die beim Kalender eingestellte Aufbewahrung. Kalender mit Aufbewahrung 0 behalten alles. Ohne Wirkung, solange die Internetkalender ausgeschaltet sind."
