COM_APPOINTMENTSRECOVERY="Appointments-Wiederherstellung"
COM_APPOINTMENTSRECOVERY_HELP="Wenn ein Appointments-Update stoppt, laden Sie jede bestehende Datei auf Ihren eigenen Computer herunter, bevor Sie ihren Ersatz freigeben. Auf dem Server werden nur Pfade und Hashes gespeichert, nie Dateiinhalte. Nach dem Update verwendet die Wiederherstellung Ihre hochgeladene lokale Kopie und prüft Hash und Zielpfad. Erstellen Sie vor Update oder Wiederherstellung eine aktuelle, vollständige und unabhängig wiederherstellbare Site-Sicherung und stoppen Sie andere Schreibvorgänge. Der Installer kann die Site-Sicherung nicht prüfen; die Dateiwiederherstellung macht Datenbank- oder Erweiterungsänderungen nicht rückgängig."
COM_APPOINTMENTSRECOVERY_REVIEW="Update-Konflikte"
COM_APPOINTMENTSRECOVERY_NO_REVIEW="Keine ausstehende Appointments-Dateiprüfung."
COM_APPOINTMENTSRECOVERY_EXISTING="Vorhandener SHA-256"
COM_APPOINTMENTSRECOVERY_INCOMING="SHA-256 des Pakets"
COM_APPOINTMENTSRECOVERY_DOWNLOAD="Bestehende Datei auf den eigenen Computer herunterladen"
COM_APPOINTMENTSRECOVERY_DOWNLOAD_FIRST="Laden Sie die bestehende Datei herunter, bevor Sie ihren Ersatz freigeben."
COM_APPOINTMENTSRECOVERY_CONFIRM_REPLACE="Ich habe diese Datei auf meinem Computer gespeichert und weiss, dass das Paket sie ersetzt."
COM_APPOINTMENTSRECOVERY_CONFIRM_REMOVE="Ich habe diese Datei auf meinem Computer gespeichert und weiss, dass das Paket sie entfernt."
COM_APPOINTMENTSRECOVERY_APPROVE_OPERATION="Paketaktion freigeben"
COM_APPOINTMENTSRECOVERY_NO_KEEP="Die lokale Wiederherstellung ist für diese vom Installer verwaltete Datei nicht verfügbar."
COM_APPOINTMENTSRECOVERY_RECOVER="Dateien des letzten Updates"
COM_APPOINTMENTSRECOVERY_MISSING="Datei fehlt"
COM_APPOINTMENTSRECOVERY_UPLOAD="Auf Ihrem Computer gespeicherte Kopie auswählen"
COM_APPOINTMENTSRECOVERY_RESTORE="Hochgeladene lokale Kopie wiederherstellen"
COM_APPOINTMENTSRECOVERY_NO_RESTORE="Die Wiederherstellung ist für diesen Pfad oder bei einer geänderten aktuellen Datei nicht verfügbar."
