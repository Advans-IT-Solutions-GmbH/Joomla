COM_APPOINTMENTS="Rendez-vous"
COM_APPOINTMENTS_MENU_HELP="Aide et conseils"
COM_APPOINTMENTS_HELP_TITLE="Aide et conseils"
COM_APPOINTMENTS_HELP_INTRO="Guide pratique de ce composant auto-hébergé. Commencez avec une petite installation de test et vérifiez tout le cycle de réservation avant publication. Les aides des champs restent disponibles auprès des réglages ; les défauts logiciels ne sont pas des recommandations de conservation légale."
COM_APPOINTMENTS_HELP_CONTENTS="Rubriques d'aide"
COM_APPOINTMENTS_HELP_SETUP_TITLE="Première configuration : calendrier, planning et page de réservation"
COM_APPOINTMENTS_HELP_SETUP_BASE_DESC="Vérifiez les options du composant : avis de confidentialité/consentement, limite des invités, envoi des mails et conservation. Les calendriers Internet sont facultatifs ; la réservation ordinaire fonctionne aussi sans calendrier de réservation lié. Pour les calendriers Internet, commencez avec un calendrier interne et son propriétaire prévu, pas avec de nombreux accès."
COM_APPOINTMENTS_HELP_SETUP_SCHEDULE_DESC="Créez un planning réutilisable avec son véritable fuseau horaire et ses heures hebdomadaires. Ajoutez des périodes bloquées pour les exceptions. Le fuseau du planning règle les heures hebdomadaires ; les heures de réservation enregistrées sont en UTC. Vérifiez les changements d'heure et les heures affichées sur une page de test."
COM_APPOINTMENTS_HELP_SETUP_BOOKING_DESC="Créez un type de rendez-vous, choisissez son planning et son hôte, puis configurez durée, pas, marges, préavis, horizon et capacité. Un calendrier de réservation lié exige l'accès 'Écriture' effectif personnel de l'hôte ; les droits administratifs ne le fournissent pas. Publiez dans les menus Joomla soit 'Réserver un rendez-vous' pour un type, soit la liste des types. Testez réservation, confirmation, déplacement, annulation et effacement avant d'ouvrir la page aux visiteurs."
COM_APPOINTMENTS_HELP_ADMIN_TITLE="Les droits administratifs ne sont pas des clés de contenu"
COM_APPOINTMENTS_HELP_SHARES_TITLE="Accès, propriétaires et récupération"
COM_APPOINTMENTS_HELP_SHARES_DESC="Inspectez les accès et leur état réel dans l'éditeur du calendrier avant de modifier rôles ou propriétaire. Groupe interne, compte actif, second facteur approuvé et enveloppes valides déterminent l'accès effectif ; une ligne d'accès visible ne suffit pas. Un accès administratif avec clés ou un nouveau propriétaire peut rester en attente jusqu'à ce qu'un vrai détenteur ou une récupération autorisée fournisse les enveloppes. La révocation retire l'enveloppe du destinataire et marque le renouvellement des clés de contenu comme dû ; effectuez-le avec de vraies clés autorisées. Conservez le secret de récupération séparément et en sécurité, sans jamais le coller dans une demande d'assistance."
COM_APPOINTMENTS_HELP_DEVICES_TITLE="Appareils et clients CalDAV"
COM_APPOINTMENTS_HELP_DEVICES_DESC="Un client de calendrier exige un appareil appartenant à la personne qui possède un accès effectif et des clés personnelles utilisables. Connectez-vous avec mot de passe et second facteur approuvé, puis créez l'appareil par les actions personnelles des calendriers/appareils. Utilisez l'adresse HTTPS CalDAV et le mot de passe d'appareil affichés par le composant, pas les identifiants d'une autre personne. Gardez le mot de passe affiché une seule fois en sécurité ; révoquez un appareil perdu ou retiré. Les administrateurs peuvent bloquer ou révoquer des appareils sans obtenir des clés de contenu. La révocation ne récupère pas les données déjà téléchargées."
COM_APPOINTMENTS_HELP_RETENTION_TITLE="Trois cycles de conservation distincts"
COM_APPOINTMENTS_HELP_PRIVACY_TITLE="Confidentialité, consentement et effacement"
COM_APPOINTMENTS_HELP_PRIVACY_DESC="Configurez avis, mode de consentement et lien de confidentialité pour votre propre processus ; un défaut logiciel n'est pas une décision juridique. Seul l'invité principal reçoit les liens signés de déplacement, annulation et effacement ; les participants supplémentaires et les hôtes reçoivent des notifications sans ces pouvoirs. Les demandes de confidentialité Joomla et le lien d'effacement de l'invité principal sont des voies distinctes prises en charge. Le délai d'un calendrier Internet ne détermine pas la conservation des données personnelles des réservations."
COM_APPOINTMENTS_HELP_MAIL_TITLE="Mail, langues et conférences facultatives"
COM_APPOINTMENTS_HELP_MAIL_DESC="Configurez le mail Joomla et testez la livraison réelle ; un contrôle local vert ne la prouve pas. Maintenez les modèles de mail en de-DE, en-GB et fr-FR. Les destinataires utilisent la langue de leur compte, sinon celle du site, y compris les invités. Confirmation, déplacement et annulation comprennent une pièce jointe iCalendar. La conférence est facultative : configurez volontairement fournisseur/adresse et vérifiez les liens produits. Le cœur de réservation ne nécessite pas de service externe de planification."
COM_APPOINTMENTS_HELP_TROUBLE_TITLE="Dépannage"
COM_APPOINTMENTS_HELP_TROUBLE_SLOTS_DESC="Aucun créneau réservable ? Vérifiez publication/accès, planning et fuseau sélectionnés, périodes bloquées, préavis, horizon, marges et capacité. Pour les calendriers liés, vérifiez le véritable accès de l'hôte, les calendriers d'occupation et la cible de réservation. Les droits administratifs ne donnent pas à l'hôte un accès 'Écriture'."
COM_APPOINTMENTS_HELP_TROUBLE_SYNC_DESC="Entrées clientes absentes ou anciennes ? Vérifiez calendriers Internet et plugins requis activés, compte/groupe/facteur toujours admissible, appareil actif et enveloppes utilisables de l'accès. Consultez le journal et le renouvellement dû. Un objet supprimé par âge peut être recréé par un envoi ou une modification de réservation ; la suppression n'interdit pas définitivement son UID. Ne réparez jamais des clés en attente par des accès ou enveloppes inventés en base."
COM_APPOINTMENTS_HELP_TROUBLE_CHECKS_DESC="Répétez le contrôle système dans les options du composant et consultez l'historique d'exécution des tâches Joomla. Même actives, elles exigent un véritable déclencheur fiable. Enregistrer un délai ne lance aucun nettoyage. Pour un remplacement de fichiers bloqué à l'installation/mise à jour, vérifiez les empreintes exactes anciennes/nouvelles et utilisez la procédure d'approbation documentée ; n'écrasez pas aveuglément les fichiers."
COM_APPOINTMENTS_HELP_CONFIG_DESC="Ouvrez <a href='index.php?option=com_appointments&amp;view=help'>Aide et conseils</a> pour première configuration, calendriers, plannings, pages de réservation, droits/clés, appareils, conservation, confidentialité, mail et dépannage. Cela complète les aides des champs sans modifier aucun réglage."
COM_APPOINTMENTS_XML_DESCRIPTION="Prise de rendez-vous hébergée sur votre propre serveur. Vous publiez des créneaux réservables, le visiteur choisit lui-même son horaire et chaque confirmation contient l'entrée d'agenda en pièce jointe. Tout fonctionne sur votre serveur et aucun service tiers n'est contacté."

