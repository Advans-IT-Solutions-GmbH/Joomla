COM_APPOINTMENTSRECOVERY="Récupération Appointments"
COM_APPOINTMENTSRECOVERY_HELP="Si une mise à jour Appointments s’arrête, téléchargez chaque fichier existant sur votre propre ordinateur avant d’autoriser son remplacement. Le serveur ne stocke que les chemins et les empreintes, jamais le contenu des fichiers. Après la mise à jour, la restauration utilise votre copie locale téléversée et vérifie son empreinte et sa destination. Avant la mise à jour ou la restauration, effectuez une sauvegarde complète et récente du site, vérifiez qu’elle peut être restaurée indépendamment et arrêtez les autres écritures. L’installateur ne peut pas vérifier la sauvegarde du site ; la restauration de fichiers n’annule pas les modifications de la base de données ni des extensions."
