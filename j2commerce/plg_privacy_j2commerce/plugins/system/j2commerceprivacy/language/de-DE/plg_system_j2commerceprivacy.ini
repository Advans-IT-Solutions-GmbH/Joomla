PLG_SYSTEM_J2COMMERCEPRIVACY="System - J2Commerce Datenschutz-Einwilligung"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Prüft die Datenschutz-Einwilligung im J2Commerce-6-Checkout serverseitig und protokolliert sie pro Bestellung in den Joomla-Datenschutz-Einwilligungen."
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT="J2Commerce-Checkout: Datenschutzerklärung"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT_LEGACY="J2Commerce-Datenschutz (Eintrag aus früherer Version)"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY="<p>Die Kundin oder der Kunde hat im J2Commerce-Checkout für die Bestellung <strong>%1$s</strong> die Datenschutzerklärung zur Kenntnis genommen.</p><p>IP-Adresse: <strong>%2$s</strong></p><p>User-Agent:<br>%3$s</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_EVIDENCE_REMOVED="<p>Die Kundin oder der Kunde hat im J2Commerce-Checkout für die Bestellung <strong>%1$s</strong> die Datenschutzerklärung zur Kenntnis genommen.</p><p>IP-Adresse und User-Agent wurden entfernt, als die Bestellung nach Ablauf ihrer Aufbewahrungsfrist anonymisiert wurde.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_LEGACY="<p>Eintrag aus einer früheren Version des Site-Templates. Der Inhalt ist nicht mehr überprüfbar und kein Nachweis einer Einwilligung. Personendaten (E-Mail-Adresse, IP-Adresse, User-Agent) wurden entfernt.</p>"

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe». Das Plugin wird zusammen mit dem Plugin «Privacy - J2Commerce Datenschutz» installiert und aktualisiert. Dessen Tab «Hilfe» erklärt die ganze Funktion."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_TAB="Hilfe"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="Was dieses Plugin tut"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P1="Dieses Systemplugin gehört zum Plugin «Privacy - J2Commerce Datenschutz». Es übernimmt die Aufgaben, für die Joomla das Datenschutz-Plugin selbst nicht lädt."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI1="Es zeigt im Checkout von J2Commerce 6 das Kontrollfeld für die Einwilligung in die Datenschutzerklärung an, im Schritt Versand und Zahlung vor der Schaltfläche zum Fortfahren."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI2="Es prüft die Einwilligung auf dem Server, im Schritt Versand und Zahlung, bei der Bestätigung und beim Absenden der Zahlung. Fehlt eine erforderliche Einwilligung für den aktuellen Warenkorb, lehnt es den Schritt mit einer Meldung ab."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI3="Es speichert die Einwilligung in den Datenschutz-Einwilligungen von Joomla, sobald J2Commerce die Bestellung angenommen hat, einmal pro Bestellung. Gespeichert werden Bestellnummer, Zeitpunkt, IP-Adresse und User-Agent, keine E-Mail-Adresse."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI4="Es leitet die Links in den Joomla-E-Mails zu Export- und Löschanfragen, welche die Administration erstellt, auf die Bestätigungsseite des Datenschutz-Plugins um. So können auch Kundinnen und Kunden ohne Benutzerkonto bestätigen. Text und Sprache der E-Mail bleiben die von Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI5="Auf der Profilseite des Shops lädt es die Sprachdatei des Datenschutz-Plugins."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P2="Unter J2Store 4 (J2Commerce 4) zeigt ein Template-Override des Datenschutz-Plugins das Kontrollfeld. Dort prüft dieses Plugin nichts und speichert keine Einwilligung."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Einstellungen"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="Dieses Plugin hat ausser diesem Tab keine eigenen Einstellungen. Es verwendet die Einstellungen des Plugins «Privacy - J2Commerce Datenschutz»:"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="«Kontrollfeld für die Einwilligung anzeigen» und «Einwilligung erforderlich» im Tab «Checkout-Einwilligung» steuern Anzeige und Prüfung."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="«Datenschutzerklärung Artikel» und «Einwilligungstext» bestimmen Link und Text neben dem Kontrollfeld."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="«Bestätigung durch Gastkunden» im Tab «Frontend-Selbstverwaltung» schaltet die Umleitung der E-Mail-Links ein oder aus."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_NOTE1="Ist das Plugin «Privacy - J2Commerce Datenschutz» deaktiviert, tut dieses Plugin nichts."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, Update und Deaktivierung"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="Der Installer des Plugins «Privacy - J2Commerce Datenschutz» installiert dieses Plugin und aktiviert es bei der ersten Installation. Ein Update behält den Zustand (aktiviert oder deaktiviert). Ein eigenes Update gibt es nicht."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="Die Deinstallation des Datenschutz-Plugins entfernt auch dieses Plugin. Gespeicherte Einwilligungen bleiben in Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="Ist dieses Plugin deaktiviert, erscheint im Checkout von J2Commerce 6 kein Kontrollfeld, nichts wird geprüft, und keine Einwilligung wird gespeichert. Die E-Mails zu Anfragen der Administration behalten die Links von Joomla, die nur angemeldete Personen öffnen können. Bereits gespeicherte Einwilligungen bleiben unverändert."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>Das Kontrollfeld fehlt:</strong> Prüfen Sie, ob dieses Plugin und das Plugin «Privacy - J2Commerce Datenschutz» aktiviert sind, ob «Kontrollfeld für die Einwilligung anzeigen» auf «Ja» steht, ob J2Commerce 6.3.4 oder neuer installiert ist und ob ein eigenes Checkout-Override das Ereignis <code>AfterDisplayShippingPayment</code> auslöst."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>Der Checkout lehnt trotz angekreuztem Kontrollfeld ab:</strong> Die Einwilligung gilt für den aktuellen Warenkorb. Nach einer Änderung des Warenkorbs, z.B. durch eine Anmeldung in einem anderen Tab, oder wenn der Schritt neu angezeigt wird, muss die Person das Kontrollfeld erneut ankreuzen. Ohne Warenkorb gilt eine erforderliche Einwilligung als nicht erteilt."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>Zu einer Bestellung gibt es keine Einwilligung:</strong> Gespeichert wird nur, wenn J2Commerce die Bestellung angenommen hat und sie aus demselben Warenkorb stammt. Abgelehnte oder unvollständige Bestellungen, Bestellungen vor der Installation und Bestellungen unter J2Store 4 erhalten keinen Eintrag. Setzt ein Zahlungsanbieter den Status erst später direkt an den Server, fehlt der Eintrag ebenfalls. Nachträglich legt das Plugin keine Einwilligungen an."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>Die E-Mail enthält die Links von Joomla:</strong> Prüfen Sie «Bestätigung durch Gastkunden». Umgeleitet werden nur die E-Mails zu Anfragen, welche die Administration erstellt. Haben Sie die E-Mail-Vorlagen angepasst, müssen sie <code>{TOKENURL}</code> oder <code>{FORMURL}</code> und <code>{TOKEN}</code> weiterhin enthalten."
