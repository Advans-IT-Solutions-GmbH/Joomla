name: Release - DMARC Reports Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force version bump (leave empty for auto-detect from commits)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

jobs:
  release:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          TAG_PREFIX="pkgdmarcreports-v"
          XML_FILE="pkg_dmarcreports/pkg_dmarcreports.xml"
          # The package bundles four sub-extensions, so a release-worthy change
          # may land in any of them, not only the package manifest. Scan every
          # bundled path so a fix or feature in a sub-extension still bumps the
          # administrator-facing package stream.
          EXT_PATH="pkg_dmarcreports/"
          EXT_PATHS=("$EXT_PATH" com_dmarcreports/ mod_dmarcreports/ plg_task_dmarcreports/ plg_system_dmarcmtasts/)

          CURRENT=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP="$VERSION_BUMP"

          if [ -z "$BUMP" ]; then
            LAST_TAG=$(git tag -l "${TAG_PREFIX}*" --sort=-v:refname | head -1)

            if [ -n "$LAST_TAG" ]; then
              SUBJECTS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges -- "${EXT_PATHS[@]}")
              BODIES=$(git log "$LAST_TAG"..HEAD --pretty=format:"%b" --no-merges -- "${EXT_PATHS[@]}")
            else
              SUBJECTS=$(git log --pretty=format:"%s" --no-merges -20 -- "${EXT_PATHS[@]}")
              BODIES=$(git log --pretty=format:"%b" --no-merges -20 -- "${EXT_PATHS[@]}")
            fi

            if [ -z "$SUBJECTS" ]; then
              echo "No commits for this extension since last tag — skipping"
              echo "bump=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if echo "$SUBJECTS" | grep -qiE '^[a-z]+(\(.+\))?!:' || echo "$BODIES" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECTS" | grep -qiE '^feat(\(.+\))?:'; then
              BUMP="minor"
            elif echo "$SUBJECTS" | grep -qiE '^fix(\(.+\))?:'; then
              BUMP="patch"
            else
              echo "No conventional commit found — skipping"
              echo "bump=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT → $NEW ($BUMP)"

      - name: Verify bundled child version bumps
        if: steps.version.outputs.bump != 'none'
        run: |
          # The package bundles each child's built archive, which carries that
          # child's own manifest <version>. Joomla only runs a child's schema
          # migration when its bundled manifest version increases, so a
          # child-only schema change shipped without its own version bump would
          # reach existing installs — whether they were installed standalone or
          # through an earlier package — without ever triggering the migration.
          #
          # Validate every bundled child against two baselines: its own latest
          # standalone release tag and the latest package tag. If the child
          # changed since either baseline without a manifest version bump, fail
          # until the child's release workflow has bumped it. A child with no
          # prior tag of a given kind has no existing installs from that channel
          # to migrate, so that baseline is simply skipped — the first package
          # release is NOT waved through wholesale, each child is still checked
          # against its standalone lineage.
          declare -A CHILD_MANIFESTS=(
            ["com_dmarcreports"]="com_dmarcreports/dmarcreports.xml"
            ["mod_dmarcreports"]="mod_dmarcreports/mod_dmarcreports.xml"
            ["plg_task_dmarcreports"]="plg_task_dmarcreports/dmarcreports.xml"
            ["plg_system_dmarcmtasts"]="plg_system_dmarcmtasts/dmarcmtasts.xml"
          )
          # Manifests renamed since an earlier release: read the old name at a baseline
          # where the current one does not exist yet, so the check is never skipped.
          declare -A CHILD_LEGACY_MANIFESTS=(
            ["com_dmarcreports"]="com_dmarcreports/com_dmarcreports.xml"
          )
          declare -A CHILD_TAG_PREFIXES=(
            ["com_dmarcreports"]="dmarcreports-v"
            ["mod_dmarcreports"]="moddmarcreports-v"
            ["plg_task_dmarcreports"]="task-dmarcreports-v"
            ["plg_system_dmarcmtasts"]="system-dmarcmtasts-v"
          )

          PKG_TAG=$(git tag -l "pkgdmarcreports-v*" --sort=-v:refname | head -1)

          manifest_version() {
            # $1 = git ref or empty (empty => working tree), $2 = manifest path
            if [ -z "$1" ]; then
              grep -oP '(?<=<version>)[^<]+' "$2" | head -1 || true
            else
              git show "$1:$2" 2>/dev/null | grep -oP '(?<=<version>)[^<]+' | head -1 || true
            fi
          }

          STALE=""
          for child in "${!CHILD_MANIFESTS[@]}"; do
            manifest="${CHILD_MANIFESTS[$child]}"
            NEW_VER=$(manifest_version "" "$manifest")

            CHILD_TAG=$(git tag -l "${CHILD_TAG_PREFIXES[$child]}*" --sort=-v:refname | head -1)

            for baseline in "$CHILD_TAG" "$PKG_TAG"; do
              [ -z "$baseline" ] && continue

              # Unchanged child directory since this baseline cannot regress the
              # migration contract for that channel. Compare only files that the
              # bundled archive actually ships: mirror shared/build/build.sh's
              # packaging exclusions so a change limited to tests, Docker or
              # Composer/dev scaffolding — none of which reaches an install — does
              # not falsely demand a version bump and block the release.
              PKG_PATHSPECS=(
                "$child/"
                ":(exclude,glob)$child/tests/**"
                ":(exclude,glob)$child/tests-*/**"
                ":(exclude,glob)$child/**/Dockerfile"
                ":(exclude,glob)$child/**/Dockerfile.*"
                ":(exclude,glob)$child/**/docker-compose*.yml"
                ":(exclude,glob)$child/**/docker-compose*.yaml"
                ":(exclude,glob)$child/**/compose*.yml"
                ":(exclude,glob)$child/**/compose*.yaml"
                ":(exclude,glob)$child/**/.gitignore"
                ":(exclude,glob)$child/**/node_modules/**"
                ":(exclude,glob)$child/**/.phpunit.cache/**"
                ":(exclude,glob)$child/**/vendor/**"
                ":(exclude,glob)$child/**/phpunit.xml"
                ":(exclude,glob)$child/**/composer.json"
                ":(exclude,glob)$child/**/*.zip"
                ":(exclude,glob)$child/build.env"
              )

              if git diff --quiet "$baseline" HEAD -- "${PKG_PATHSPECS[@]}"; then
                continue
              fi

              OLD_VER=$(manifest_version "$baseline" "$manifest")
              if [ -z "$OLD_VER" ] && [ -n "${CHILD_LEGACY_MANIFESTS[$child]:-}" ]; then
                OLD_VER=$(manifest_version "$baseline" "${CHILD_LEGACY_MANIFESTS[$child]}")
              fi

              # The child did not exist at this baseline (no manifest there), so
              # there is nothing from that channel to migrate.
              [ -z "$OLD_VER" ] && continue

              echo "$child: changed since $baseline — manifest version $OLD_VER -> $NEW_VER"

              if [ "$OLD_VER" = "$NEW_VER" ]; then
                case " $STALE " in
                  *" $child "*) ;;
                  *) STALE="$STALE $child" ;;
                esac
              fi
            done
          done

          if [ -n "$STALE" ]; then
            echo "::error::These bundled children changed since a prior release tag without a manifest version bump:$STALE. Run each child's release workflow first so its schema migration triggers on update, then re-run the package release."
            exit 1
          fi

          echo "All changed children carry a bumped manifest version relative to their release baselines."

      - name: Update version in files
        if: steps.version.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          DATE=$(date +%Y-%m)
          cd pkg_dmarcreports
          echo "$VERSION" > VERSION
          sed -i "s/VERSION=\".*\"/VERSION=\"$VERSION\"/" build.env
          sed -i \
            -e "s/<version>[^<]*<\/version>/<version>$VERSION<\/version>/" \
            -e "s/<creationDate>[^<]*<\/creationDate>/<creationDate>$DATE<\/creationDate>/" \
            pkg_dmarcreports.xml

      - name: Build package
        if: steps.version.outputs.bump != 'none'
        run: |
          cd pkg_dmarcreports
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        if: steps.version.outputs.bump != 'none'
        id: package
        run: |
          cd pkg_dmarcreports
          PACKAGE=$(ls -1 pkg_dmarcreports_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Update update.xml
        if: steps.version.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          PACKAGE="${{ steps.package.outputs.file }}"
          cat > pkg_dmarcreports/updates/update.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <updates>
              <update>
                  <name>DMARC Reports Package</name>
                  <description>DMARC and TLS-RPT reporting suite: component, dashboard module, ingestion task plugin and MTA-STS policy system plugin</description>
                  <element>pkg_dmarcreports</element>
                  <type>package</type>
                  <version>$VERSION</version>
                  <infourl>https://github.com/Advans-IT-Solutions-GmbH/Joomla/tree/main/pkg_dmarcreports</infourl>
                  <downloads>
                      <downloadurl type="full" format="zip">https://github.com/Advans-IT-Solutions-GmbH/Joomla/releases/download/pkgdmarcreports-v$VERSION/$PACKAGE</downloadurl>
                  </downloads>
                  <tags>
                      <tag>stable</tag>
                  </tags>
                  <targetplatform name="joomla" version="(5\.[4-9]|6\.[0-9])" />
                  <php_minimum>8.1</php_minimum>
              </update>
          </updates>
          EOF

      - name: Create release PR
        if: steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          BRANCH="release/pkgdmarcreports-v${VERSION}"
          TITLE="release: pkgdmarcreports v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main 2>/dev/null || true
          git switch -C "$BRANCH" origin/main
          git add pkg_dmarcreports/
          if git diff --staged --quiet; then
            echo "::notice::No version file changes detected; no release PR was opened."
            exit 0
          fi
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"
          PR_BODY=$'Automated release version bump for `pkgdmarcreports`.\n\nThis PR updates the extension version metadata and update manifest. After a human reviews and merges it into `main`, the matching publish workflow will tag the merge commit and create the GitHub release using the built-in `GITHUB_TOKEN`.'
          echo "::notice::Release PR CI created by GITHUB_TOKEN requires a writer to select 'Approve workflows to run' before review and merge."
          gh label create release --color 0E8A16 --description "Automated release PRs" 2>/dev/null || true
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$PR_BODY" --add-label release
            echo "::notice::Updated existing release PR #$EXISTING_PR"
          else
            if ! PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$PR_BODY"); then
              echo "::error::Release branch $BRANCH was pushed, but opening its PR failed. An owner must allow GitHub Actions to create and approve pull requests in Settings > Actions > General (including any organisation restriction). See README.md#release-permissions-and-ci-approval. The branch is preserved for recovery."
              exit 1
            fi
            gh pr edit "$PR_URL" --add-label release || true
            echo "::notice::Opened release PR: $PR_URL"
          fi

      - name: No release needed
        if: steps.version.outputs.bump == 'none'
        run: echo "::notice::No version bump warranted; no release PR was opened."
