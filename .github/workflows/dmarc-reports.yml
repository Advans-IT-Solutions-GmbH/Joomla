name: Build & Test - DMARC Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'com_dmarcreports/**'
      - 'shared/build/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/dmarc-reports.yml'
  pull_request:
    branches: [main]
    paths:
      - 'com_dmarcreports/**'
      - 'shared/build/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/dmarc-reports.yml'

permissions: {}

# Supersede an outdated run of this workflow instead of letting it finish: a new
# push to a pull request or branch cancels the previous run of the same ref.
# `github.ref` is `refs/pull/<n>/merge` on a pull request, so runs of different
# pull requests never cancel each other. On `main` and for a manual run the group
# key is the unique run id, so no run on the default branch is ever cancelled and a
# manual run never cancels another one: a dispatch is started deliberately, nothing
# supersedes it, and it may carry its own inputs. The publish and release workflows
# deliberately have no concurrency group at all.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd com_dmarcreports
          chmod +x build.sh
          ./build.sh
          cp *.zip tests/extension.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-package
          path: com_dmarcreports/tests/extension.zip
          retention-days: 1

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          # xargs exits non-zero as soon as one file fails; `find -exec \;` would not.
          find com_dmarcreports -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  language-lint:
    name: Language Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
      - name: Lint language files
        run: php shared/tests/lang-lint.php com_dmarcreports
      - name: Check compatibility requirements (Joomla 5.4+, PHP 8.1+)
        run: php shared/tests/requirements-check.php com_dmarcreports
      - name: Scan for deprecated Joomla APIs
        run: php shared/tests/deprecated-api-scan.php com_dmarcreports

  unit-tests:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, zip
          tools: composer
      - name: Install Composer dependencies
        run: |
          cd com_dmarcreports
          composer install --no-interaction --no-progress
      - name: Run unit tests
        run: |
          cd com_dmarcreports
          composer test:unit

  test-j5:
    name: ${{ matrix.name }} (J5)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Parser'
            script: 'parser'
          - name: '04 - Storage'
            script: 'storage'
          - name: '05 - Action Center'
            script: 'action-center'
          - name: '06 - Metrics'
            script: 'metrics'
          - name: '07 - Export'
            script: 'export'
          - name: '08 - Config Forms'
            script: 'config-forms'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '10 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-package
          path: com_dmarcreports/tests/
      - name: Start environment (J5)
        run: |
          cd com_dmarcreports/tests
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_dmarcreports_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd com_dmarcreports/tests
          echo "=== Joomla Container Logs ==="
          docker compose logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_dmarcreports/tests
          chmod +x run-tests.sh
          ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: j5-${{ matrix.script }}-logs
          path: com_dmarcreports/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_dmarcreports/tests
          docker compose down -v

  test-j6:
    name: ${{ matrix.name }} (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Parser'
            script: 'parser'
          - name: '04 - Storage'
            script: 'storage'
          - name: '05 - Action Center'
            script: 'action-center'
          - name: '06 - Metrics'
            script: 'metrics'
          - name: '07 - Export'
            script: 'export'
          - name: '08 - Config Forms'
            script: 'config-forms'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '10 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-package
          path: com_dmarcreports/tests/
      - name: Start environment (J6)
        run: |
          cd com_dmarcreports/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_dmarcreports_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd com_dmarcreports/tests
          echo "=== Joomla Container Logs ==="
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_dmarcreports/tests
          chmod +x run-tests.sh
          CONTAINER_NAME=com_dmarcreports_j6_test ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: j6-${{ matrix.script }}-logs
          path: com_dmarcreports/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_dmarcreports/tests
          docker compose -f docker-compose.joomla6.yml down -v

  # Result of this workflow. Deliberately not named "Collect Results": that
  # required check is produced only by collect-results.yml.
  all-jobs:
    name: DMARC Reports / all jobs
    runs-on: ubuntu-latest
    needs:
      - build
      - syntax-check
      - language-lint
      - unit-tests
      - test-j5
      - test-j6
    if: always()
    permissions:
      actions: read
    steps:
      - name: Download all test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: test-artifacts/
      - name: Collect and display logs
        run: |
          echo "=== Test Results Summary ==="
          for dir in test-artifacts/*/; do
            if [ -d "$dir" ]; then
              echo ""
              echo "--- $(basename "$dir") ---"
              find "$dir" -name "*.txt" -exec cat {} \;
            fi
          done
      - name: Upload combined logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all-test-logs
          path: test-artifacts/
          retention-days: 3
      - name: Fail unless every job succeeded
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # failure, cancelled and skipped all count as not passed
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
