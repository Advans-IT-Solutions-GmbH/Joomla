COM_APPOINTMENTS_TEAM_D_MAIL_ACCOUNT_LOCKED_BODY="Guten Tag {user_name},\n\nDas Konto {account_name} ({account_username}) mit einem Recht auf Internetkalender auf {site_name} ist nach wiederholten Fehlversuchen für {minutes} Minuten gesperrt. Die Sperre endet von selbst. Sie verhindert auch die Anmeldung mit dem richtigen Passwort.\n\nVerursacht jemand anderes die Fehlversuche, ist die betroffene Person ausgesperrt. Sie können die Sperre im Backend unter Internetkalender, Geräte aufheben.\n\nGeräte:\n{devices_url}"
