COM_APPOINTMENTS_CONFERENCE_ALLOW_OUTBOUND_DESC="Désactivé par défaut. Les fournisseurs intégrés ne contactent aucun serveur. Un adaptateur tiers explicitement sélectionné peut transmettre un identifiant de salle, le titre, la durée et les heures UTC, jamais les coordonnées des invités. Les adaptateurs distants doivent respecter un délai de cinq secondes et un seul nouvel essai."
