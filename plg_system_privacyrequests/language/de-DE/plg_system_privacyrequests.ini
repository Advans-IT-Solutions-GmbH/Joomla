PLG_SYSTEM_PRIVACYREQUESTS="System - Datenschutzanfragen"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="E-Mail-Bestätigung ohne Konto für Löschanfragen in Joomla Datenschutz. Ausdrücklich aktivieren und die öffentliche Anfrageseite verlinken. Core-Administratorrechte und Sperren der Datenschutz-Plugins bleiben bestehen."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Löschung personenbezogener Daten anfragen"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="Sie benötigen kein Konto. Geben Sie Ihre E-Mail-Adresse ein, um einen Bestätigungscode anzufordern, oder bestätigen Sie Ihre Anfrage mit dem Code aus Ihrer E-Mail. Fordern Sie einen abgelaufenen Code erneut an; die offene Anfrage behält ihr ursprüngliches Eingangsdatum."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Bestätigungscode (aus Ihrer E-Mail)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Code anfordern oder erneuern"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Anfrage bestätigen"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="Falls diese Adresse zur Bearbeitung angenommen wird, wird eine Core-Anfrage erfasst oder eine bestehende Anfrage beibehalten. Diese Antwort bestätigt weder Eingang noch E-Mail-Versand, Bestätigung oder Datenlöschung. Prüfen Sie Ihre E-Mails; falls kein Code ankommt, versuchen Sie es später erneut oder kontaktieren Sie den Websitebetreiber auf einem anderen Weg. Wiederholte Anfragen können begrenzt werden."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Datenschutzanfrage: Bestätigungsversand fehlgeschlagen"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="Der Bestätigungsversand für Core-Anfrage %d ist fehlgeschlagen. Der ursprüngliche Eingang und der offene Status bleiben erhalten. Prüfen Sie die Core-Anfrage und die Mailkonfiguration. Beheben Sie den Versand an die ursprüngliche Adresse und erneuern Sie den Code über das Gastformular. Die Kontaktaufnahme ermöglicht Kommunikation und eine verhältnismässige Prüfung, bestätigt aber diese Core-Anfrage nicht. Joomla bietet keine unterstützte manuelle Bestätigung für eine abgelehnte ursprüngliche Empfängeradresse. Lassen Sie die Anfrage offen; ersetzen Sie die Adresse nicht und erzwingen Sie weder Bestätigung noch Abschluss."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="Der Bestätigungsversand ist fehlgeschlagen. Diese offene Core-Anfrage und ihr ursprüngliches Eingangsdatum bleiben erhalten; weder Versand noch Identität sind belegt. Exakter Unicode-Abgleich bedeutet nicht, dass Joomla Unicode vor @ beim Versand unterstützt. Nutzen Sie den Betreiberkontakt für Kommunikation und eine verhältnismässige Prüfung. Kontaktaufnahme oder eine andere Antwortadresse bestätigen diese Anfrage nicht. Der Core bietet keine unterstützte manuelle Bestätigung für eine abgelehnte ursprüngliche Empfängeradresse: Die Anfrage bleibt offen, bis die Bestätigung an diese Adresse funktioniert. Umgehen Sie weder Bestätigung noch Löschung oder Abschluss."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Ihre Anfrage ist zur Bearbeitung durch die Administration bestätigt. Dies bestätigt den Zugriff auf diese E-Mail-Adresse, nicht jede Identität oder Berechtigung. Durch diese Bestätigung wurden keine Daten gelöscht."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="Dieser Code ist abgelaufen, nicht Ihr Recht oder die ursprüngliche Anfrage. Fordern Sie hier einen neuen Code an oder kontaktieren Sie den Websitebetreiber für eine alternative Bestätigung."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="Die Anfrage konnte nicht bestätigt werden. Prüfen Sie E-Mail-Adresse und Code oder versuchen Sie es später erneut. Sie können einen neuen Code anfordern oder den Websitebetreiber kontaktieren."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Geben Sie eine gültige E-Mail-Adresse mit höchstens 100 Bytes ein."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="Der Anfragedienst konnte diesen Vorgang nicht abschliessen. Gehen Sie nicht von einem Eingang oder einer Bestätigung aus. Versuchen Sie es später erneut oder kontaktieren Sie den Websitebetreiber auf einem anderen Weg."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="Der Datenschutzvorgang kann nicht sicher starten. Möglicherweise läuft noch ein anderer Vorgang. Gehen Sie nicht von einer Löschung oder einem Abschluss aus; versuchen Sie es später erneut oder prüfen Sie das Administratorprotokoll."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Erneuter Löschlauf gesperrt: Prüfen und bestätigen Sie zuerst die Behebung des früheren unvollständigen Versuchs. Das Kontrollkästchen behebt keine verbliebenen Daten."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="Die Administration prüft Identität, Umfang und geltende Aufbewahrungspflichten vor der Löschung. Die automatische Löschung umfasst nur teilnehmende Datenschutz-Plugins. E-Mail-, Kalender-Client-, CRM-, Sicherungs- und andere externe Kopien sind gesondert zu prüfen; aufbewahrte Protokolle und rechtmässige Nachweise bedeuten nicht, dass alles gelöscht wurde."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="Das von Joomla ausgewählte Konto stimmt nicht genau mit der Anfrageadresse überein. Beheben Sie diese Abweichung vor der Datenlöschung."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Bestätigen Sie diese Anfrage ohne Konto mit E-Mail-Adresse und Bestätigungscode auf der öffentlichen Anfrageseite."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="Ich habe Löschumfang und Antwort an die anfragende Person geprüft"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Vor dem erneuten Löschlauf habe ich die frühere Teilbereinigung überprüft"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="Nur nach unabhängiger Behebung und Überprüfung früherer Fehler verwenden, auch für Kopien, die über die ursprüngliche Adresse nicht mehr auffindbar sind. Übergeht weder aktuelle Fehler noch unlesbare Inhalte oder rechtliche Plugin-Sperren. Schliesst die Anfrage nicht ab."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Führen Sie vor dem Abschluss die Löschung ohne offene Warnungen aus. Prüfen Sie teilnehmende Plugins, zusätzlichen Identitätsnachweis, aufbewahrte Nachweise und separate externe Kopien. Der Core-Abschluss dokumentiert die Bearbeitung, nicht eine universelle Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Abschluss gesperrt: Führen Sie zuerst die Löschung ohne offene Warnungen aus und prüfen Sie danach ausdrücklich Umfang und Antwort. Ein aufgerufener Callback allein belegt keine vollständige Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Kontaktpfad zum Websitebetreiber"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Vor der Aktivierung erforderlich: eine bestehende öffentliche lokale Joomla-Kontaktseite, beginnend mit index.php, beispielsweise index.php?option=com_contact&view=contact&id=42. Verwenden Sie die tatsächliche ID und testen Sie den Kontakt ohne Konto. Keine externe URL, Weiterleitung oder Sprungmarke. Kontakt bestätigt oder schliesst keine Core-Anfrage ab."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Websitebetreiber kontaktieren"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Nutzen Sie diesen Kontakt, falls kein Code ankommt oder Joomla nicht an Ihre ursprüngliche Adresse senden kann. Geben Sie die ursprüngliche Adresse genau an. Eine andere Antwortadresse dient nur der Kommunikation und belegt keinen Zugriff auf dieses Postfach. Kontakt allein bestätigt weder die Core-Anfrage noch berechtigt er zur Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="Hier wurde kein Kontaktlink eingerichtet. Nutzen Sie die Betreiberangaben im Impressum oder in den Datenschutzhinweisen dieser Website. Gehen Sie nicht davon aus, dass diese Seite Ihre Anfrage erhalten oder bestätigt hat."
