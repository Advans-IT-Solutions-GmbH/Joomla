PLG_SYSTEM_J2COMMERCEPRIVACY="System - J2Commerce Privacy Consent"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Validates the privacy consent checkbox of the J2Commerce 6 checkout on the server and records the consent per order in Joomla's privacy consents."
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT="J2Commerce checkout: privacy policy"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT_LEGACY="J2Commerce privacy (entry from an earlier version)"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY="<p>The customer took note of the privacy policy in the J2Commerce checkout for order <strong>%1$s</strong>.</p><p>IP address: <strong>%2$s</strong></p><p>User agent:<br>%3$s</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_EVIDENCE_REMOVED="<p>The customer took note of the privacy policy in the J2Commerce checkout for order <strong>%1$s</strong>.</p><p>IP address and user agent were removed when the order was anonymized after its retention period.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_LEGACY="<p>Entry from an earlier version of the site template. Its content can no longer be verified and is no evidence of a consent. Personal data (e-mail address, IP address, user agent) was removed.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_ERASED="<p>Consent record anonymized by a privacy removal request. Personal data (e-mail address, IP address, user agent) was removed. The record is no longer valid.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_NEWSLETTER_EVIDENCE_REMOVED="removed"
PLG_SYSTEM_J2COMMERCEPRIVACY_NEWSLETTER_BODY_EVIDENCE_REMOVED="Newsletter consent given at checkout for order %1$s. IP address and user agent were removed when the order was anonymized."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_NOTE="The ‘Help’ tab explains what this plugin does, how to set it up and what to do if something goes wrong. The plugin is installed and updated together with the plugin ‘Privacy - J2Commerce’, whose ‘Help’ tab explains the whole function."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_TAB="Help"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="What this plugin does"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P1="This system plugin belongs to the plugin ‘Privacy - J2Commerce’. It does the work for which Joomla does not load the privacy plugin itself."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI1="It shows the checkbox for consent to the privacy policy in the J2Commerce 6 checkout, in the shipping and payment step before the continue button."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI2="It checks the consent on the server, in the shipping and payment step, on confirmation and on payment submission. If a required consent is missing for the current cart, it refuses the step with a message."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI3="It stores the consent in Joomla's privacy consents once J2Commerce has accepted the order, once per order. It stores the order number, the time, the IP address and the user agent, no e-mail address."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI4="It points the links in Joomla's e-mails for export and removal requests created by an administrator to the confirmation page of the privacy plugin. This way customers without a user account can confirm as well. Text and language of the e-mail remain Joomla's."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI5="On the shop's profile page it loads the language file of the privacy plugin."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P2="On J2Store 4 (J2Commerce 4) a template override of the privacy plugin shows the checkbox. There this plugin checks nothing and stores no consent."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Settings"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="Apart from this tab, this plugin has no settings of its own. It uses the settings of the plugin ‘Privacy - J2Commerce’:"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="‘Show Consent Checkbox’ and ‘Consent Required’ on the ‘Checkout Consent’ tab control display and checking."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="‘Privacy Policy Article’ and ‘Consent Text’ define the link and the text next to the checkbox."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="‘Guest Request Confirmation’ on the ‘Frontend Self-Service’ tab switches the redirection of the e-mail links on or off."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_NOTE1="While the plugin ‘Privacy - J2Commerce’ is disabled, this plugin does nothing."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, update and disabling"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="The installer of the plugin ‘Privacy - J2Commerce’ installs this plugin and enables it on the first installation. An update keeps its state (enabled or disabled). There is no separate update."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="Uninstalling the privacy plugin also removes this plugin. Stored consents stay in Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="While this plugin is disabled, no checkbox appears in the J2Commerce 6 checkout, nothing is checked and no consent is stored. The e-mails for requests created by an administrator keep Joomla's links, which only logged-in people can open. Consents already stored stay unchanged."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI4="Before updating the plugin ‘Privacy - J2Commerce’, take a current, complete backup of the whole website that you can restore independently. The installer keeps no file copies and cannot check your backup. The first update attempt shows this recommendation and stops before it changes files, then you start the update again. If the installer finds a modified or unknown file that the update would replace, it stops before copying anything and lists the path and the hashes. Check the file, resolve it by hand or postpone the update, then try again. There is no approval command and no bypass."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI5="The plugin has no <code>access.xml</code> and no permissions of its own, creates no tables, no scheduled task and sends no mail of its own. The consents it stores stay in Joomla's privacy consents. It never deletes them and sets no retention period for them. No data is sent to external services."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Typical problems and solutions"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>The checkbox is missing:</strong> check that this plugin and the plugin ‘Privacy - J2Commerce’ are enabled, that ‘Show Consent Checkbox’ is set to ‘Yes’, that J2Commerce 6.3.4 or later is installed and that a checkout override of your own fires the event <code>AfterDisplayShippingPayment</code>."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>The checkout refuses although the checkbox is ticked:</strong> the consent applies to the current cart. After a change of the cart, e.g. through a login in another tab, or when the step is shown again, the person has to tick the checkbox again. Without a cart a required consent counts as not given."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>An order has no consent record:</strong> the record is only stored when J2Commerce has accepted the order and the order comes from the same cart. Refused or incomplete orders, orders placed before the installation and orders on J2Store 4 get no record. If a payment provider sets the status only later by a direct call to the server, the record is missing as well. The plugin never creates consents afterwards."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>The e-mail contains Joomla's links:</strong> check ‘Guest Request Confirmation’. Only the e-mails for requests created by an administrator are redirected. If you changed the mail templates, they must still contain <code>{TOKENURL}</code> or <code>{FORMURL}</code> and <code>{TOKEN}</code>."
