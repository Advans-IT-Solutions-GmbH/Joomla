COM_APPOINTMENTS_TEAM_C_KEYS_INVALID_DESC="La clé enregistrée de ces comptes échoue au contrôle d'intégrité et n'ouvre donc rien. L'écarter supprime la clé et son accès aux calendriers, suspend les accès et lance le nettoyage des appareils. La prochaine connexion avec mot de passe crée une nouvelle clé, puis un gestionnaire redonne l'accès ou la clé de récupération est utilisée."
