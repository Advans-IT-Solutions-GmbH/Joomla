COM_APPOINTMENTS_CONFERENCE_ALLOW_OUTBOUND="Installierte externe Adapter zulassen"
COM_APPOINTMENTS_CONFERENCE_ALLOW_OUTBOUND_DESC="Standardmässig aus. Die mitgelieferten Anbieter kontaktieren keinen Server. Ein ausdrücklich gewählter Drittanbieter-Adapter darf Raumkennung, Termintitel, Dauer und UTC-Beginn/-Ende übertragen, aber keine Angaben zu eingeladenen Personen. Externe Adapter müssen fünf Sekunden Zeitlimit und genau einen Wiederholungsversuch einhalten."
