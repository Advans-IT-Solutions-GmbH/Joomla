COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_BODY="Guten Tag {user_name},\n\nFür Sie wurde auf {site_name} ein Konto für die Internetkalender angelegt. Legen Sie mit diesem Link Ihr Passwort fest. Der Link gilt einmal und bis {expires}.\n\nKonto aktivieren:\n{activation_url}\n\nBei der ersten Anmeldung richten Sie einen zweiten Faktor ein, z.B. eine Authenticator-App.\n\nHaben Sie kein Konto erwartet? Dann öffnen Sie den Link nicht und informieren Sie die Administration."
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_SUBJECT="Konto aktiviert: {account_name}"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_BODY="Guten Tag {user_name},\n\nDas Konto {account_name} ({account_username}) hat sein Passwort auf {site_name} festgelegt und ist aktiv. Beim ersten Zugriff auf die Internetkalender richtet es den zweiten Faktor ein.\n\nIst das nicht die vorgesehene Person, widerrufen Sie den Zugang mit einem Schritt. Dabei werden alle Freigaben entfernt, das Konto gesperrt und seine Geräte aufgeräumt.\n\nZugang widerrufen:\n{revoke_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_SUBJECT="Freigabe geändert: {calendar_title}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_BODY="Guten Tag {user_name},\n\nIm Internetkalender «{calendar_title}» auf {site_name} wurde eine Freigabe erteilt oder geändert.\n\nPerson: {grantee_name}\nRolle: {role}\nGeändert von: {actor_name}\n\nIst diese Freigabe nicht vorgesehen, informieren Sie sofort die Administration.\n\nMeine Kalender:\n{mycalendars_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_SUBJECT="Ihr Zugang zu den Internetkalendern ist gesperrt"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_BODY="Guten Tag {user_name},\n\nIhr Zugang zu den Internetkalendern auf {site_name} ist gesperrt. Grund: {reason}\n\nIhre Geräte erhalten beim nächsten Abgleich die Kalender leer und löschen ihre Kopie. Danach ist kein Abgleich mehr möglich.\n\nWer einen Kalender verwaltet, kann ihn wieder für Sie freigeben. Haben Sie die Sperre nicht erwartet, informieren Sie die Administration."
; [team-d] end

