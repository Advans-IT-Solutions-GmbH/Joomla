COM_APPOINTMENTS_TEAM_D_MAIL_DEVICE_ADDED_BODY="Guten Tag {user_name},\n\nFür Ihr Konto auf {site_name} wurde ein neues Gerät für die Internetkalender hinzugefügt.\n\nGerät: {device_name}\nProgramm: {client}\nZeitpunkt: {created}\n\nWaren Sie das nicht? Dann melden Sie sich sofort an, entfernen Sie das Gerät unter «Meine Kalender», ändern Sie Ihr Passwort und informieren Sie die Administration.\n\nMeine Kalender:\n{mycalendars_url}\n\nDiese Mail enthält kein Passwort. Das App-Passwort wird nur einmal auf der Website angezeigt."
