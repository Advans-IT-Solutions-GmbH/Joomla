COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION="Retention in days"
COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION_DESC="Whole days, 0-65535; default 0 disables only age-based object deletion and does not inherit booking retention. Empty is invalid, not a booking-retention override. With internet calendars enabled, the 'Appointments: internet calendar retention' task deletes a whole calendar object only when its last safely determined occurrence ends strictly before UTC now minus this period; times without a timezone count as UTC. Finite series expire as a whole after their last occurrence. Age cleanup keeps future, endless, indeterminate, THISANDFUTURE and overly large series. Imported/CalDAV entries and booking copies follow the same object rule, without deleting booking rows or erasure audits. Separately, cancelled, anonymised, deleted or orphaned bookings lose their copies regardless of 0; disabling internet calendars removes booking copies too. Later uploads or booking updates can recreate objects. The Task plugin and a regularly triggered Scheduler are required."
