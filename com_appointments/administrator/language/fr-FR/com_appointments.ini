COM_APPOINTMENTS_TEAM_C_DELETE_INVALID_DESC="Ce calendrier échoue au contrôle d'intégrité, par exemple après un changement du secret du site, et ne s'ouvre pour personne. Il ne peut plus qu'être supprimé, avec toutes ses entrées, tous ses accès et toutes ses clés."
