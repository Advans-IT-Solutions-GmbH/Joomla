PKG_PRIVACY_J2COMMERCE="J2Commerce Privacy package"
PKG_PRIVACY_J2COMMERCE_XML_DESCRIPTION="GDPR and data protection for J2Commerce in one installation: the privacy plugin (export, removal and retention of shop data, privacy tab in the customer profile), the consent system plugin (checkout consent) and the cleanup task plugin (automatic anonymisation). Installing, updating and removing the package manages all three together. Installed over the standalone privacy plugin of an earlier version, the package takes it over with all data, settings and enabled states."
