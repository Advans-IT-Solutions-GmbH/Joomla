COM_APPOINTMENTSRECOVERY="Appointments-Wiederherstellung"
COM_APPOINTMENTSRECOVERY_HELP="Wenn ein Appointments-Update stoppt, prüfen Sie jede Datei und starten Sie dasselbe Update in Joomla erneut. Eine unbekannte Herkunft bedeutet nicht, dass die Datei bearbeitet wurde. Behaltene Dateien können inkompatiblen Code enthalten. Erstellen Sie vor dem Update oder der Wiederherstellung eine vollständige Site-Sicherung und stoppen Sie andere Schreibvorgänge, etwa Deployments oder Hintergrundaufgaben. Die Wiederherstellung von Dateien macht keine Datenbank- oder Erweiterungsänderungen rückgängig."
