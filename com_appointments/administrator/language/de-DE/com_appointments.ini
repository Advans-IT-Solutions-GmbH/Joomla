COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_SUBJECT="Konto aktiviert: {account_name}"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_BODY="Guten Tag {user_name},\n\nDas Konto {account_name} ({account_username}) hat sein Passwort auf {site_name} festgelegt und ist aktiv. Beim ersten Zugriff auf die Internetkalender richtet es den zweiten Faktor ein.\n\nIst das nicht die vorgesehene Person, widerrufen Sie den Zugang mit einem Schritt. Dabei werden alle Freigaben entfernt, das Konto gesperrt und seine Geräte gesperrt, je nach Geräteeinstellung mit Aufräumen.\n\nZugang widerrufen:\n{revoke_url}"
