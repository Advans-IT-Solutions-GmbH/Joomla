; Action items (title + text). Placeholders are positional.
COM_DMARCREPORTS_ACTION_NO_DATA_TITLE="Encore aucun rapport"
COM_DMARCREPORTS_ACTION_NO_DATA_TEXT="Aucun rapport agrégé n'a encore été importé pour %1$s. Publiez un enregistrement DMARC avec une adresse rua, puis importez les premiers rapports."

COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TITLE="Passer à p=quarantine"
COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TEXT="%2$s%% du courrier observé pour %1$s réussit DMARC et atteint le seuil configuré pour passer de p=none à p=quarantine. Vérifiez d'abord les sources en échec afin que le courrier légitime réacheminé ne soit pas mis en quarantaine."

COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TITLE="Rester à p=none pour l'instant"
COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TEXT="Seulement %2$s%% du courrier pour %1$s passe DMARC, en dessous des %3$s%% requis pour passer à p=quarantine. Corrigez d'abord les expéditeurs en échec."

COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TITLE="Passer à p=reject"
COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TEXT="%2$s%% du courrier observé pour %1$s réussit DMARC sous p=quarantine et atteint le seuil configuré pour passer à p=reject. Vérifiez d'abord les sources en échec restantes afin que le courrier légitime ne soit pas rejeté."

COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TITLE="Rester à p=quarantine pour l'instant"
COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TEXT="Seulement %2$s%% du courrier pour %1$s passe DMARC, en dessous des %3$s%% requis pour passer à p=reject. Résolvez d'abord les échecs restants."

COM_DMARCREPORTS_ACTION_ENFORCED_TITLE="Application atteinte"
COM_DMARCREPORTS_ACTION_ENFORCED_TEXT="%1$s applique p=reject. Continuez à importer des rapports et surveillez les nouvelles sources d'envoi."
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TITLE="Application partielle seulement"
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TEXT="%1$s publie p=reject, mais seuls %2$d%% des messages sont soumis à la politique ; les destinataires sont seulement invités à traiter le reste comme si p=quarantine s'appliquait (RFC 7489, selon le destinataire). Portez pct à 100 pour que la politique s'applique à tous les messages."
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TITLE="Quarantaine partielle seulement"
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TEXT="%1$s publie p=quarantine, mais seuls %2$d%% des messages sont soumis à la politique. Portez pct à 100 pour appliquer quarantine à tous les messages avant de passer à reject."

COM_DMARCREPORTS_ACTION_AT_TARGET_TITLE="Politique cible atteinte"
COM_DMARCREPORTS_ACTION_AT_TARGET_TEXT="%1$s a déjà atteint sa politique cible p=%2$s. Continuez à importer des rapports et surveillez les nouvelles sources d'envoi ; relevez la cible si vous souhaitez renforcer davantage."

COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TITLE="Courrier à risque sous p=reject"
COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TEXT="%1$d message(s), %2$s%% du volume, ne sont pas alignés et seraient rejetés sous p=reject. Authentifiez ces expéditeurs avant de renforcer la politique."

COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TITLE="Aligner une source d'envoi"
COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TEXT="%1$s a envoyé %2$d message(s), %3$s%% du volume, sans alignement DKIM ni SPF. Ajoutez-la à SPF et/ou signez avec DKIM."

COM_DMARCREPORTS_ACTION_NEW_SOURCE_TITLE="Nouvelle source d'envoi détectée"
COM_DMARCREPORTS_ACTION_NEW_SOURCE_TEXT="%1$s est une nouvelle source avec %2$d message(s). Confirmez qu'il s'agit d'un expéditeur légitime et authentifiez-le, ou examinez un abus possible."

COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TITLE="Taux de réussite en baisse"
COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TEXT="Le taux de réussite DMARC est passé de %1$s%% à %2$s%%. Vérifiez un expéditeur défaillant ou une nouvelle source non alignée avant de renforcer la politique."

COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TITLE="Publier un enregistrement DMARC"
COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TEXT="Aucun enregistrement DMARC trouvé pour %1$s. Publiez-en un à p=none avec une adresse rua pour commencer à collecter des rapports."
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TITLE="Vérifier le DMARC du domaine organisationnel"
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TEXT="%1$s est un sous-domaine sans enregistrement DMARC propre. Il peut être couvert par la politique du domaine organisationnel, que les destinataires appliquent comme solution de repli. Vérifiez que le domaine organisationnel publie DMARC, et ne publiez un enregistrement dédié ici que si ce sous-domaine nécessite un traitement différent."
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TITLE="Supprimer l'enregistrement DMARC en double"
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TEXT="Plus d'un enregistrement DMARC est publié pour %1$s. C'est invalide et les destinataires ignorent la politique ; conservez exactement un enregistrement sous _dmarc.%1$s."
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TITLE="Corriger l'enregistrement DMARC incorrect"
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TEXT="L'enregistrement DMARC pour %1$s est incorrect : la valeur p doit être none, quarantine ou reject, et pct doit être un nombre entier de 0 à 100. Les destinataires ne peuvent pas appliquer un enregistrement invalide ; corrigez-le sous _dmarc.%1$s."

COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TITLE="La politique DMARC est p=none"
COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TEXT="L'enregistrement DMARC publié pour %1$s est à p=none et n'offre encore aucune protection. Planifiez le passage à quarantine une fois vos expéditeurs conformes."

COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TITLE="Ajouter une adresse rua"
COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TEXT="L'enregistrement DMARC pour %1$s n'a pas d'adresse rua, donc aucun rapport agrégé n'est demandé. Ajoutez rua=mailto: pour les recevoir."

COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TITLE="Le pct DMARC est inférieur à 100"
COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TEXT="L'enregistrement DMARC n'applique la politique qu'à %1$s%% du courrier. Augmentez pct à 100 une fois que vous êtes sûr."

COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TITLE="Envisager un enregistrement SPF"
COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TEXT="Aucun enregistrement SPF trouvé pour %1$s. DMARC peut tout de même réussir via DKIM ou via SPF sur le domaine de l'expéditeur d'enveloppe, ce n'est donc pas forcément un problème ; publiez-en un si vous voulez que ce domaine authentifie aussi ses hôtes d'envoi par IP."
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TITLE="Supprimer l'enregistrement SPF en double"
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TEXT="Plus d'un enregistrement SPF est publié pour %1$s. C'est invalide et provoque un permerror ; fusionnez-les en un seul enregistrement."
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TITLE="Échec de la requête DNS"
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TEXT="La requête DNS pour %1$s a échoué, les enregistrements DMARC et SPF n'ont donc pas pu être vérifiés. C'est généralement temporaire ; réessayez sous peu, et si cela persiste, vérifiez le résolveur DNS du serveur."
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TITLE="Ajouter des hôtes MX pour MTA-STS"
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TEXT="MTA-STS est activé pour %1$s mais aucun hôte MX n'est configuré, aucune politique ne peut donc être construite. Ajoutez les serveurs de messagerie de réception dans les options du composant sous MTA-STS."
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TITLE="Publier l'enregistrement MTA-STS et l'hôte de politique"
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TEXT="Publiez un enregistrement TXT sur %1$s avec la valeur \"%2$s\", et assurez-vous que la politique est accessible avec un certificat TLS valide sur %3$s. Cette étape d'hôte et de DNS est la seule partie que le composant ne peut pas effectuer à votre place."
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TITLE="Mettre à jour l'id de l'enregistrement MTA-STS"
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TEXT="L'id de l'enregistrement _mta-sts publié (%1$s) diffère de l'id de la politique actuelle (%2$s). Mettez à jour l'enregistrement TXT en \"%3$s\" pour que les expéditeurs prennent en compte la dernière politique."
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TITLE="Échec de la requête MTA-STS"
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TEXT="La requête DNS _mta-sts pour %1$s a échoué, l'enregistrement n'a donc pas pu être vérifié. C'est généralement temporaire ; réessayez sous peu, et si cela persiste, vérifiez le résolveur DNS du serveur."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TITLE="Politique MTA-STS inaccessible"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TEXT="La politique sur %1$s n'a pas pu être récupérée via HTTPS. Vérifiez que l'hôte mta-sts existe, présente un certificat TLS valide et que son serveur web transmet /.well-known/mta-sts.txt à Joomla (voir la documentation du plugin MTA-STS)."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TITLE="Politique MTA-STS hébergée obsolète"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TEXT="La politique servie sur %1$s ne correspond pas au mode et aux hôtes MX configurés. Republiez-la, ou vérifiez que le plugin système est activé afin qu'elle soit servie automatiquement."
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TITLE="Passer MTA-STS en enforce"
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TEXT="L'enregistrement et la politique MTA-STS pour %1$s sont cohérents mais toujours en mode testing, qui n'amène jamais les expéditeurs à imposer TLS. Une fois les rapports TLS-RPT propres, passez le mode de la politique à enforce."
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TITLE="Publier l'enregistrement TLS-RPT"
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TEXT="Publiez un enregistrement TXT sur %1$s avec la valeur \"%2$s\" afin que les rapports TLS soient distribués à l'adresse configurée."
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TITLE="Configurer une adresse de rapport TLS-RPT"
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TEXT="Les rapports TLS-RPT sont activés pour %1$s mais aucune adresse de rapport valide n'est configurée ; aucun enregistrement ne peut donc être publié et aucun rapport TLS ne sera jamais reçu. Renseignez une adresse mailto: ou https: valide dans les options du composant."

COM_DMARCREPORTS_ACTION_GENERIC_TITLE="Examiner cet élément"
COM_DMARCREPORTS_ACTION_GENERIC_TEXT="Cet élément requiert votre examen."

