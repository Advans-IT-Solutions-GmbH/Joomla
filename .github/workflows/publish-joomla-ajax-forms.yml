name: Publish - Joomla Ajax Forms

on:
  # A manual run only recovers a release whose push-triggered publication never ran,
  # for example because Actions could not start jobs. It builds the merged release
  # commit of the given version, never the current main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish (x.y.z), as in the merged release PR'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'plg_ajax_joomlaajaxforms/**'

concurrency:
  group: publish-ajaxforms-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: ajaxforms v'))"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out exactly the released source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Builds only the merged release commit, also on a manual run, and compares the
          # trees of every bundled path with it. Runs a copy: the checkout replaces the files.
          cp .github/scripts/release-source.py "$RUNNER_TEMP/release-source.py"
          python3 "$RUNNER_TEMP/release-source.py" --prefix "ajaxforms" \
            --path plg_ajax_joomlaajaxforms \
            --path shared/build \
            --path .github/scripts

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="plg_ajax_joomlaajaxforms/joomlaajaxforms.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "ajaxforms-v" --version "${{ steps.version.outputs.new }}"

      - name: Build extension
        run: |
          cd plg_ajax_joomlaajaxforms
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd plg_ajax_joomlaajaxforms
          PACKAGE=$(ls -1 plg_ajax_joomlaajaxforms_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- plg_ajax_joomlaajaxforms/ | awk '!/\[skip ci\]/ && !/^- release:/ { if (count++ < 20) print }')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: ajaxforms-v${{ steps.version.outputs.new }}
          NOTES: |
            ## Joomla Ajax Forms Plugin v${{ steps.version.outputs.new }}

            Ajax form handling for Joomla (login, registration, password reset, profile, cart).

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable plugin in System → Manage → Plugins

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "ajaxforms-v" --version "${{ steps.version.outputs.new }}" \
            --package "plg_ajax_joomlaajaxforms/${{ steps.package.outputs.file }}" \
            --title "Joomla Ajax Forms v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plg_ajax_joomlaajaxforms/${{ steps.package.outputs.file }}
