PKG_DMARCREPORTS="DMARC Reports Package"
PKG_DMARCREPORTS_XML_DESCRIPTION="Complete DMARC and TLS-RPT reporting suite in one install: the DMARC Reports component, its administrator dashboard module, the scheduler task plugin for automatic mailbox ingestion and the MTA-STS policy system plugin. Installing, updating and removing the package manages all four extensions together."
PKG_DMARCREPORTS_POSTINSTALL_INTRO="The DMARC Reports suite is installed. Open <strong>Components → DMARC Reports</strong> and add a mailbox source. The scheduled ingestion task that collects the reports automatically is created by the installation if it is missing; its message says so."
PKG_DMARCREPORTS_POSTINSTALL_UPDATED="DMARC Reports package updated to version %s."
