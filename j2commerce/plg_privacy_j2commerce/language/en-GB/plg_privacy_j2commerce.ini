PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_SKIPPED_NOTE="<strong>Action required:</strong> These files already existed and were not modified. You must manually verify that they include the privacy consent checkbox and Privacy tab — or replace them with the bundled versions from <code>plugins/privacy/j2commerce/overrides/com_j2store/</code> or <code>plugins/privacy/j2commerce/overrides/com_j2commerce/</code>. Without this, the checkout consent checkbox and the MyProfile Privacy tab will not appear. See <strong>README.md → Template Integration</strong> for instructions."
