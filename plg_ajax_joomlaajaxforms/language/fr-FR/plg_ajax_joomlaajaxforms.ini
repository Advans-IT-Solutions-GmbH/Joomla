; Onglet « Aide »
PLG_AJAX_JOOMLAAJAXFORMS_HELP_NOTE="Ce que fait ce plugin, comment le configurer et que faire en cas de problème : voir l'onglet « Aide »."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_TAB="Aide"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_TITLE="Ce que fait le plugin"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P1="Le plugin envoie les formulaires de compte de Joomla en arrière-plan (AJAX) et affiche la réponse directement dans le formulaire. La page n'est pas rechargée."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI1="<strong>Connexion et déconnexion</strong>, avec redirection vers la page de vérification de Joomla lorsque l'authentification à deux facteurs est configurée pour le compte."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI2="<strong>Inscription</strong> d'un nouveau compte utilisateur."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI3="<strong>Réinitialisation du mot de passe</strong> : demande de l'e-mail de réinitialisation."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI4="<strong>Rappel du nom d'utilisateur</strong> : demande de l'e-mail contenant le nom d'utilisateur."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI5="<strong>Profil</strong> : enregistrement du profil utilisateur avec tous les champs du formulaire de profil de Joomla, y compris les champs des plugins de profil."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI6="<strong>Panier</strong> de J2Store 4 ou J2Commerce 6 : retrait d'un article (clients connectés uniquement) et lecture du nombre d'articles."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P2="Les mêmes règles s'appliquent que dans les formulaires de Joomla : les options de la gestion des utilisateurs (inscription autorisée ou non, règles de mot de passe, captcha, domaines d'e-mail autorisés) et les champs ajoutés par d'autres plugins, par exemple le consentement à la politique de confidentialité. Les e-mails utilisent les modèles d'e-mail de la gestion des utilisateurs de Joomla."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_NOTE="Le plugin n'a pas de page propre et ne crée aucune table. Il modifie uniquement la manière dont les formulaires existants sont envoyés."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_TITLE="Prérequis et mise en place"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP1="Joomla 5.4 ou plus récent et PHP 8.1 ou plus récent. Les fonctions de panier nécessitent J2Store 4 (composant <code>com_j2store</code>) ou J2Commerce 6 (composant <code>com_j2commerce</code>), installé et activé. Tous les autres formulaires fonctionnent sans boutique."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP2="Activez le plugin sous <strong>Système → Gérer → Plugins</strong> (rechercher <strong>Joomla! AJAX Forms</strong>)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP3="Chargez le script <code>plg_ajax_joomlaajaxforms/joomlaajaxforms.js</code> dans le template du site, par exemple dans le fichier <code>index.php</code> du template ou dans une substitution de template. Le plugin ne charge pas le script lui-même. Sans le script, les formulaires sont envoyés normalement. Le README du plugin montre le code (section « Template Integration »)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP4="Le script trouve lui-même les formulaires de Joomla : formulaire de connexion (y compris le module de connexion), inscription, réinitialisation du mot de passe, rappel du nom d'utilisateur et modification du profil. Si une substitution de template remplace le balisage du formulaire de réinitialisation ou de rappel, ajoutez à son élément <code>form</code> l'attribut <code>data-joomlaajaxforms</code> avec la valeur <code>reset</code> ou <code>remind</code>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP5="À chaque installation et mise à jour, le plugin vérifie le fichier <code>.htaccess</code> du site. S'il bloque les adresses avec <code>/component/</code> ou <code>index.php?option=com_</code> sans exception pour <code>com_ajax</code>, un avertissement indique l'exception manquante. Ajoutez-la, sinon toutes les requêtes du plugin échouent."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_TITLE="Installation, mise à jour et désinstallation"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI1="Installez le ZIP avec l'installateur d'extensions de Joomla. Joomla installe le plugin désactivé, activez-le donc (étape 2 ci-dessus). Le plugin n'a besoin d'aucune tâche planifiée et n'en crée aucune."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI2="Avant une mise à jour, effectuez une sauvegarde actuelle et complète de tout le site, que vous pouvez restaurer de manière indépendante. L'installateur ne conserve aucune copie de fichier et ne peut pas vérifier votre sauvegarde. La première tentative de mise à jour affiche cette recommandation et s'arrête avant de modifier des fichiers, puis vous relancez la mise à jour. Les réglages et l'état activé sont conservés."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI3="Si l'installateur trouve un fichier modifié ou inconnu que la mise à jour remplacerait, il s'arrête avant de copier quoi que ce soit et indique le chemin et les empreintes. Vérifiez le fichier, résolvez-le à la main ou reportez la mise à jour, puis réessayez. Il n'existe ni commande d'approbation ni contournement."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI4="À chaque installation et mise à jour, le plugin supprime les entrées de site de mise à jour des versions précédentes et vérifie le fichier <code>.htaccess</code> (étape 5 de la configuration). Les nouvelles versions apparaissent sous <strong>Système → Mise à jour → Extensions</strong>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI5="La désinstallation supprime le plugin. Il n'a ni tables, ni données propres, ni routine de désinstallation. Les exceptions ajoutées à <code>.htaccess</code> restent. Retirez aussi le script de votre template."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_TITLE="Paramètres"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_P1="Les paramètres se trouvent dans l'onglet « Plugin ». Pour les cinq formulaires : tant qu'un paramètre est sur « Non », le script envoie ce formulaire à Joomla de la manière habituelle, avec rechargement de la page. Désactivez un formulaire s'il doit fonctionner sans AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI1="<strong>« Activer la connexion »</strong> (par défaut « Oui ») : envoie le formulaire de connexion en AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI2="<strong>« Activer l'inscription »</strong> (par défaut « Oui ») : envoie le formulaire d'inscription en AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI3="<strong>« Activer la réinitialisation du mot de passe »</strong> (par défaut « Oui ») : envoie le formulaire de réinitialisation du mot de passe en AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI4="<strong>« Activer le rappel de nom d'utilisateur »</strong> (par défaut « Oui ») : envoie le formulaire de rappel du nom d'utilisateur en AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI5="<strong>« Activer le profil »</strong> (par défaut « Oui ») : enregistre le formulaire de profil en AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI6="<strong>« Activer le panier »</strong> (par défaut « Oui ») : retrait d'un article du panier et lecture du nombre d'articles. Tant qu'il est sur « Non », ces requêtes répondent « Cette fonctionnalité est actuellement désactivée. ». Choisissez « Non » si votre site n'utilise pas ces fonctions."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI7="<strong>« Sortie de débogage »</strong> (par défaut « Non ») : écrit les messages de développement du plugin dans la console du navigateur. Les requêtes en échec y apparaissent même sans ce paramètre. Activez-le uniquement pour rechercher une erreur et désactivez-le ensuite."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_NOTE="La déconnexion est toujours prise en charge et n'a pas de paramètre propre."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_TITLE="Sécurité et protection des données"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI1="Chaque requête, à l'exception du chargement des textes du script, nécessite le jeton de formulaire de Joomla. Le plugin refuse les requêtes sans jeton valide."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI2="Une connexion échouée reçoit toujours le même message, qui ne révèle pas si un compte existe. Ce n'est qu'avec un mot de passe correct que le plugin indique que le compte n'est pas encore confirmé ou attend sa validation, et il donne l'adresse e-mail du site."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI3="La réinitialisation du mot de passe et le rappel du nom d'utilisateur répondent toujours de la même façon, que l'adresse soit connue ou non. La réinitialisation respecte la limite définie dans les options de la gestion des utilisateurs (nombre de demandes sur une période) et ne réinitialise jamais depuis le site le mot de passe d'un Super Utilisateur."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI4="Si l'authentification à deux facteurs est configurée ou si un utilisateur doit d'abord changer son mot de passe, ce sont les pages de Joomla qui prennent le relais. Le profil et le panier ne sont accessibles par le plugin qu'ensuite."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI5="Un client ne peut retirer que des articles de son propre panier. Les invités reçoivent toujours 0 comme nombre d'articles."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI6="Le plugin ne conserve aucune donnée propre. Les données personnelles comme le nom et l'adresse e-mail sont enregistrées uniquement là où Joomla et la boutique les enregistrent de toute façon."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI7="Le plugin n'a ni <code>access.xml</code> ni autorisations propres. Les visiteurs peuvent l'appeler sans compte. Les règles de Joomla décident : jeton de formulaire, options du composant Utilisateurs et session. Seuls les comptes autorisés à modifier les plugins peuvent changer les réglages (<strong>Système → Gérer → Plugins</strong>) : donnez-y accès à un autre compte. La conservation des comptes, sessions, e-mails et données de la boutique reste du ressort de Joomla et de la boutique."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_TITLE="E-mails"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI1="La réinitialisation du mot de passe, le rappel du nom d'utilisateur, l'e-mail d'activation et l'avis de nouvelle inscription sont envoyés avec les modèles d'e-mail du composant Utilisateurs de Joomla (<strong>Système → Modèles d'e-mail</strong>) : <code>com_users.password_reset</code>, <code>com_users.reminder</code>, <code>com_users.registration.user.self_activation</code>, <code>com_users.registration.user.admin_activation</code> et <code>com_users.registration.admin.new_notification</code>. L'objet, le texte, la mise en page HTML et le logo définis à cet endroit s'appliquent. Le plugin n'a pas de réglages d'e-mail propres."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI2="La langue est celle du compte du destinataire si c'est l'allemand, l'anglais ou le français. Sinon, la langue du site est utilisée si c'en est une, à défaut l'anglais. La langue de la requête du visiteur n'a aucune importance."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI3="Si un modèle d'e-mail manque ou si l'envoi échoue, le plugin envoie à la place son propre texte traduit. Il suit le format d'e-mail des options des modèles d'e-mail : avec HTML ou les deux, il est envoyé dans la mise en page HTML du site (y compris une surcharge de template) avec le texte comme partie alternative et les saisies échappées, avec texte brut il reste un e-mail texte."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI4="L'avis de nouvelle inscription est envoyé à l'adresse d'expéditeur du site (Configuration globale). Sans adresse d'expéditeur valide, il est omis et un avertissement est écrit dans le journal."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI5="Si Joomla ne confirme pas l'envoi d'un e-mail, le plugin écrit une erreur dans le journal (catégorie <code>plg_ajax_joomlaajaxforms</code>). Le formulaire signale tout de même un succès, car le compte a été créé ou la demande enregistrée."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI1="<strong>La page se recharge à l'envoi, comme sans le plugin.</strong> Vérifiez que le plugin est activé, que le template charge le script et que le paramètre du formulaire est sur « Oui ». Il manque souvent l'attribut <code>data-joomlaajaxforms</code> dans une substitution de template du formulaire de réinitialisation ou de rappel."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI2="<strong>Les formulaires affichent « Une erreur s'est produite. Veuillez réessayer. » ou ne réagissent pas.</strong> Le plus souvent, le <code>.htaccess</code> bloque les appels à <code>com_ajax</code>. Ajoutez l'exception indiquée dans l'avertissement d'installation. Activez ensuite brièvement « Sortie de débogage » et consultez la console du navigateur."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI3="<strong>« L'inscription des utilisateurs est actuellement désactivée. »</strong> L'inscription est désactivée dans les options de la gestion des utilisateurs. Activez-la à cet endroit si les visiteurs doivent pouvoir s'inscrire."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI4="<strong>Un nouvel utilisateur ne peut pas se connecter.</strong> Le compte n'est pas encore confirmé ou attend la validation d'un administrateur. Le message de connexion indique de quel cas il s'agit. Vous validez les comptes sous <strong>Utilisateurs → Gérer</strong>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI5="<strong>Aucun e-mail n'arrive.</strong> Vérifiez les paramètres de messagerie dans la configuration globale. Si un e-mail ne peut pas être envoyé, le plugin écrit une entrée dans le journal Joomla (catégorie <code>plg_ajax_joomlaajaxforms</code>). Que Joomla conserve ces entrées dépend des paramètres de journalisation du site."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI6="<strong>Panier : « J2Commerce n'est pas installé ou n'est pas actif. »</strong> Ni J2Commerce 6 ni J2Store 4 n'est activé avec ses tables. Activez le composant de la boutique. Si les deux sont activés, le plugin utilise J2Commerce 6."
