COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM="Menüeintrag der Datenschutzerklärung"
COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM_DESC="Menüeintrag Ihrer Datenschutzerklärung. Hat Vorrang vor der URL und folgt auf mehrsprachigen Websites den Sprachzuordnungen. Der Datenschutzhinweis und die Beschriftung des Kontrollkästchens verlinken darauf."
