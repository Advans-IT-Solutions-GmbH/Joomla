COM_APPOINTMENTS_CLOSE_NOTE="Optionale direkte CRM-Übertragung, standardmässig ausgeschaltet. Jedes Profil überträgt die Buchungen seiner Terminarten in seine eigene Close-Organisation. Terminarten ohne Profil werden nie übertragen. In Close wird nie etwas gelöscht: Aufbewahrungsfrist, Löschung und Datenschutzanfragen der Website entfernen nur die lokale Verknüpfung. Datenschutzanfragen für Close werden separat in Close bearbeitet."
COM_APPOINTMENTS_CLOSE_PROFILES="Close-Profile"
COM_APPOINTMENTS_CLOSE_PROFILES_DESC="Ein Profil je Close-Organisation oder Kampagne. Jede Terminart gehört zu höchstens einem Profil."
COM_APPOINTMENTS_CLOSE_PROFILE="Profil"
COM_APPOINTMENTS_CLOSE_PROFILE_KEY="Profilkennung"
COM_APPOINTMENTS_CLOSE_PROFILE_KEY_DESC="Kurzer eindeutiger Name aus Kleinbuchstaben, Ziffern, Bindestrich und Unterstrich. Eine Änderung stoppt die Aktualisierung bereits mit diesem Profil übertragener Buchungen."
COM_APPOINTMENTS_CLOSE_PROFILE_EVENTTYPES="Terminarten"
COM_APPOINTMENTS_CLOSE_PROFILE_EVENTTYPES_DESC="Neue Buchungen dieser Terminarten werden mit diesem Profil übertragen."
COM_APPOINTMENTS_CLOSE_ORIGIN="Freigegebener HTTPS-API-Ursprung (ohne Pfad)"
COM_APPOINTMENTS_CLOSE_CREDENTIAL="Server-Umgebungsvariable mit dem API-Schlüssel"
COM_APPOINTMENTS_CLOSE_CREDENTIAL_DESC="Gespeichert wird nur der Name der Variable. Für jede Close-Organisation eine eigene Variable verwenden. Nie den Schlüssel selbst eintragen."
COM_APPOINTMENTS_CLOSE_ORGANIZATION="Erwartete Organisations-ID (freiwillig)"
COM_APPOINTMENTS_CLOSE_ORGANIZATION_DESC="Freiwillige orga_-ID. Vor dem Senden von Personendaten liest die Übertragung immer die Organisation des eingestellten Schlüssels und bindet jeden Übertragungsdatensatz daran. Ist hier eine ID gesetzt, blockiert jede andere Organisation das Profil."
COM_APPOINTMENTS_CLOSE_DELIVERY="Buchungseintrag in Close"
COM_APPOINTMENTS_CLOSE_DELIVERY_DESC="Eine Notiz funktioniert in jedem Close-Tarif. Eine Custom Activity setzt einen Tarif mit Custom Activities voraus."
COM_APPOINTMENTS_CLOSE_DELIVERY_NOTE="Notiz am Lead (alle Tarife)"
COM_APPOINTMENTS_CLOSE_DELIVERY_ACTIVITY="Custom Activity (Tarife mit Custom Activities)"
COM_APPOINTMENTS_CLOSE_TYPE="Typ-ID der Buchungsaktivität (Custom Activity)"
COM_APPOINTMENTS_CLOSE_FIELDS="Buchungsfeldzuordnung (JSON)"
COM_APPOINTMENTS_CLOSE_FIELDS_DESC="JSON-Objekt. Pflicht: uid, sequence, start, end, state, source. Freiwillig: event_type, campaign, contact_created, start_local. Jeder Wert geht in ein eigenes einfaches Textfeld cf_ des gewählten Aktivitätstyps. Zeiten in UTC nach ISO 8601, Zustände pending, confirmed und cancelled."
COM_APPOINTMENTS_CLOSE_ACTIVITY_ANSWERS="Antworten in der Custom Activity (JSON)"
COM_APPOINTMENTS_CLOSE_ACTIVITY_ANSWERS_DESC="JSON-Objekt von der lokalen Formularfeld-ID zu einem einfachen Textfeld cf_ des Aktivitätstyps. Leer bedeutet keine Antworten."
COM_APPOINTMENTS_CLOSE_NOTE_ANSWERS="Antworten in der Buchungsnotiz"
COM_APPOINTMENTS_CLOSE_NOTE_ANSWERS_DESC="Lokale Formularfeld-IDs, durch Komma getrennt. Die Notiz zeigt jede Antwort mit der Feldbezeichnung. Andere Antworten werden nicht übertragen."
COM_APPOINTMENTS_CLOSE_CAMPAIGN="Kampagne"
COM_APPOINTMENTS_CLOSE_CAMPAIGN_DESC="Fester Kampagnenname in jeder Buchungsnotiz oder -aktivität dieses Profils."
COM_APPOINTMENTS_CLOSE_SOURCE="Quelle"
COM_APPOINTMENTS_CLOSE_SOURCE_DESC="Fester Quelltext jeder Buchungsnotiz oder -aktivität. Leer bedeutet Joomla appointments."
COM_APPOINTMENTS_CLOSE_LEAD_NAME="Lead-Name aus Feld"
COM_APPOINTMENTS_CLOSE_LEAD_NAME_DESC="Lokale Formularfeld-IDs, durch Komma getrennt, z.B. das Firmenfeld jeder Terminart. Die erste Antwort wird zum Namen eines neuen Leads."
COM_APPOINTMENTS_CLOSE_CONTACT_TITLE="Kontakttitel aus Feld"
COM_APPOINTMENTS_CLOSE_CONTACT_TITLE_DESC="Lokale Formularfeld-IDs, durch Komma getrennt, z.B. das Feld Funktion. Die erste Antwort wird zum Titel eines neuen Kontakts."
COM_APPOINTMENTS_CLOSE_LEAD_ANSWERS="Leadfelder aus Antworten (JSON)"
COM_APPOINTMENTS_CLOSE_LEAD_ANSWERS_DESC="JSON-Objekt von der lokalen Formularfeld-ID zu einem Leadfeld cf_. Nur bei neuen Leads gesetzt. Felder mehrerer Terminarten dürfen dasselbe Leadfeld verwenden."
COM_APPOINTMENTS_CLOSE_LEAD_VALUES="Feste Leadfelder (JSON)"
COM_APPOINTMENTS_CLOSE_LEAD_VALUES_DESC="JSON-Objekt vom Leadfeld cf_ zu einem festen Text, z.B. der Leadherkunft. Nur bei neuen Leads gesetzt. Auswahlfelder brauchen einen bestehenden Auswahlwert."
COM_APPOINTMENTS_CLOSE_ENABLED="Übertragung eingeschaltet. Übertragungsstatus und geplante Aufgabe prüfen."
COM_APPOINTMENTS_CLOSE_DISABLED="Übertragung ausgeschaltet: keine CRM-Aufrufe."
COM_APPOINTMENTS_CLOSE_CONFIG_MISSING="Close-Konfiguration unvollständig oder ungültig. Keine Übertragung möglich. Die echte Kontozuordnung und Aktivierung erfolgen später durch den Betreiber."
COM_APPOINTMENTS_CLOSE_DELIVERY_HELP="Nur neue Buchungen nach der Aktivierung werden aufgenommen. Eine bekannte E-Mail-Adresse verwendet ihren Kontakt und Lead unverändert. Sichere Wiederholungen erstellen weder Buchungen noch E-Mails erneut. Unklare Neuanlagen müssen abgeglichen werden, sie werden nie automatisch wiederholt. In Close wird nichts gelöscht."
COM_APPOINTMENTS_CLOSE_RETRY="Sichere Übertragungen wiederholen / blockierte neu prüfen"
COM_APPOINTMENTS_CLOSE_RETRY_RESULT="Übertragungslauf beendet. Status unten prüfen. Unklare Neuanlagen wurden nicht wiederholt."
COM_APPOINTMENTS_CLOSE_FAILED="Close-Übertragung konnte nicht ausgeführt werden. Konfiguration, Server-Schlüsselreferenz und Übertragungsstatus prüfen. Keine Buchung oder E-Mail wurde wiederholt."
