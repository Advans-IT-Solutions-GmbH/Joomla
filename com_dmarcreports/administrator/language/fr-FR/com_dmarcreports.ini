COM_DMARCREPORTS_DETAIL_SOURCES_HEADING="Sources d'envoi"
COM_DMARCREPORTS_DETAIL_SOURCES_INTRO="Le logiciel évalue lui-même chaque source. Seule une signature DKIM alignée prouve qu'un e-mail vient de vous, ces sources sont donc confirmées automatiquement. Les e-mails qui n'ont réussi que par SPF sont signalés, car les serveurs de messagerie partagés d'un fournisseur peuvent réussir SPF pour chacun de ses clients. Les e-mails en échec que les destinataires ont rejetés montrent que votre politique fonctionne. L'évaluation se fonde sur la fenêtre de rapports actuelle (les sept jours jusqu'au rapport le plus récent) si la source y a envoyé des e-mails, sinon sur tous ses e-mails. Les chiffres couvrent tous les rapports. La liste montre les 20 plus grandes sources et chaque source citée par le centre d'actions."
