PLG_TASK_DMARCREPORTS="Task - DMARC Reports Ingestion"
PLG_TASK_DMARCREPORTS_XML_DESCRIPTION="Scheduled task that fetches and imports DMARC and TLS-RPT reports from the configured IMAP mailboxes."
PLG_TASK_DMARCREPORTS_TASK_INGEST_TITLE="DMARC Reports - Automatic ingestion"
PLG_TASK_DMARCREPORTS_TASK_INGEST_DESC="Polls every published IMAP source that is bound to a published domain, parses the DMARC and TLS-RPT reports it finds and stores them, so the dashboard stays current without a manual import."
PLG_TASK_DMARCREPORTS_AUTO_CREATE_DOMAINS_LABEL="Auto-create domains"
PLG_TASK_DMARCREPORTS_AUTO_CREATE_DOMAINS_DESC="Register a domain automatically when a report arrives for a domain that is not yet listed. Only takes effect when \"Allow automatic domain creation from scheduler tasks\" is also enabled in the DMARC Reports component options. Leave off to only import reports for existing domains."
PLG_TASK_DMARCREPORTS_ENABLE_HINT="The plugin is disabled. Enable it under <strong>System → Manage → Plugins</strong> (search for <strong>Task - DMARC Reports Ingestion</strong>) so scheduled ingestion can run."
PLG_TASK_DMARCREPORTS_POSTINSTALL_INTRO="The DMARC report ingestion plugin is installed and enabled. The installation creates the scheduled task <strong>DMARC Reports - Automatic ingestion</strong> (every hour) by itself if it is missing, see the message below. It imports reports as soon as a report source is set up in DMARC Reports."
PLG_TASK_DMARCREPORTS_UNINSTALL_TASKS_REMOVED="Deleted %d scheduled task(s) of the type DMARC Reports - Automatic ingestion."

PLG_TASK_DMARCREPORTS_HELP_NOTE="This plugin provides the scheduled task 'DMARC Reports - Automatic ingestion'. Setup and troubleshooting are explained on the <a href='index.php?option=com_dmarcreports&amp;view=help'>Help &amp; tips</a> page of the DMARC Reports component."
PLG_TASK_DMARCREPORTS_HELP_URL="index.php?option=com_dmarcreports&view=help&tmpl=component"
