COM_APPOINTMENTS_TEAM_E_EVENTTYPE_BUSY_DESC="Belegte Zeiten dieser Kalender sperren ebenfalls Zeitfenster. Angeboten werden nur Kalender, auf die der Gastgeber Zugriff hat. Die Buchungsseite zeigt die freien Zeiten, die übrig bleiben."
COM_APPOINTMENTS_TEAM_E_EVENTTYPE_NO_ACCESS="Kalender %d (der Gastgeber hat keinen Zugriff)"
COM_APPOINTMENTS_TEAM_E_EVENTTYPE_ERROR_CALENDAR="Wählen Sie nur Kalender, auf die der Gastgeber Zugriff hat, und als Zielkalender einen, in den er schreiben darf."
COM_APPOINTMENTS_TEAM_E_FEEDS_OFF="Die Abonnement-Feeds mit Token sind ausgeschaltet. Ihre Adressen antworten nicht mehr, und hier wird keine Adresse angezeigt oder erneuert."
COM_APPOINTMENTS_TEAM_E_FEEDS_DEPRECATED="Die Abonnement-Feeds mit Token sind veraltet und werden in Version 2.0.0 entfernt. Wer eine Adresse kennt, liest die Buchungen ohne Anmeldung."
COM_APPOINTMENTS_TEAM_E_FEEDS_REPLACEMENT="Sie werden durch die Internetkalender abgelöst: Buchungen werden in den Zielkalender ihres Veranstaltungstyps geschrieben, und jede berechtigte Person abonniert mit dem eigenen Konto und einem App-Passwort pro Gerät. Die Option «Abonnement-Feeds mit Token» in den Optionen der Komponente schaltet die bisherigen Feeds ein oder aus."
COM_APPOINTMENTS_TEAM_E_BOOKING_UNVERIFIED="Nicht verifiziert"
COM_APPOINTMENTS_TEAM_E_BOOKING_UNVERIFIED_DESC="Diese Buchung stammt aus der Zeit vor Version 1.4.0 und ist noch unverschlüsselt gespeichert, weil ihre Verschlüsselung nicht innerhalb der Übergangsfrist abgeschlossen wurde. Ihre Daten könnten direkt in der Datenbank verändert worden sein. Prüfen Sie die Buchung und verschlüsseln Sie sie danach als Administrator in der Buchungsliste mit «Jetzt verschlüsseln»."
COM_APPOINTMENTS_TEAM_E_BOOKINGS_UNVERIFIED_NOTICE="%d Buchungen aus der Zeit vor Version 1.4.0 sind noch unverschlüsselt gespeichert und als nicht verifiziert gekennzeichnet. Ihre Daten könnten direkt in der Datenbank verändert worden sein. Prüfen Sie sie und verschlüsseln Sie sie danach als Administrator in der Buchungsliste mit «Jetzt verschlüsseln»."
