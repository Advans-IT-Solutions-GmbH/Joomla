name: Build & Test - Appointments

on:
  workflow_dispatch:
    inputs:
      integrated:
        description: 'Require every team-calendar work package (no PENDING results)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'com_appointments/**'
      - 'shared/build/**'
      - 'shared/installer/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-installer-module-url.php'
      - 'shared/tests/scripts/shared-database-check-lib.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/appointments.yml'
  pull_request:
    branches: [main]
    paths:
      - 'com_appointments/**'
      - 'shared/build/**'
      - 'shared/installer/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-installer-module-url.php'
      - 'shared/tests/scripts/shared-database-check-lib.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/appointments.yml'

permissions: {}

# Supersede an outdated run of this workflow instead of letting it finish: a new
# push to a pull request or branch cancels the previous run of the same ref.
# `github.ref` is `refs/pull/<n>/merge` on a pull request, so runs of different
# pull requests never cancel each other. On `main` and for a manual run the group
# key is the unique run id, so no run on the default branch is ever cancelled and a
# manual run never cancels another one: a dispatch is started deliberately, nothing
# supersedes it, and it may carry its own inputs. The publish and release workflows
# deliberately have no concurrency group at all.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd com_appointments
          chmod +x build.sh
          ./build.sh
          cp *.zip tests/extension.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-package
          path: com_appointments/tests/extension.zip
          retention-days: 1

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
      - name: Check PHP syntax
        run: |
          # The component declares PHP 8.1 as its minimum, so the syntax check
          # runs on 8.1: a newer language feature must fail here, not on a
          # customer's server.
          # xargs exits non-zero as soon as one file fails; `find -exec \;` would not.
          find com_appointments -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  language-lint:
    name: Language Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
      - name: Lint language files
        run: php shared/tests/lang-lint.php com_appointments
      - name: Check compatibility requirements (Joomla 5.4+, PHP 8.1+)
        run: php shared/tests/requirements-check.php com_appointments
      - name: Scan for deprecated Joomla APIs
        run: php shared/tests/deprecated-api-scan.php com_appointments

  unit-tests:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, zip, pdo_sqlite, sodium
          tools: composer
      - name: Install Composer dependencies
        run: |
          cd com_appointments
          composer install --no-interaction --no-progress
      - name: Run unit tests
        run: |
          cd com_appointments
          composer test:unit
      - name: Synthetic Close delivery lifecycle (no network)
        run: php com_appointments/tests/close-mock.php

  # The CalDAV libraries in lib/ are generated code: sabre/dav and its
  # dependencies from the pinned composer.lock, prefixed with php-scoper. This
  # job regenerates them and fails on any difference, so lib/ is always exactly
  # what tests/tools/sabre/generate.php produces from the lock files.
  sabre-lib:
    name: Bundled sabre/dav
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml
          tools: composer
      - name: Regenerate lib/ and compare
        run: |
          php com_appointments/tests/tools/sabre/generate.php
          changes="$(git status --porcelain -- com_appointments/administrator/components/com_appointments/lib)"
          if [ -n "$changes" ]; then
            echo "lib/ differs from what generate.php produces:"
            echo "$changes" | head -50
            exit 1
          fi

  test-j5:
    name: ${{ matrix.name }} (J5)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Site Page'
            script: 'site-page'
          - name: '04 - Schedules'
            script: 'schedules'
          - name: '05 - Blocked periods'
            script: 'blocked'
          - name: '06 - Event types'
            script: 'eventtypes'
          - name: '08 - Booking integrity'
            script: 'booking'
          - name: '07 - Public slot parity'
            script: 'slots'
          - name: '09 - Mail and calendar attachments'
            script: 'mail'
          - name: '09 - Email template administration'
            script: 'templates'
          - name: '10 - Signed booking lifecycle'
            script: 'lifecycle'
          - name: '11 - Erasure and audit'
            script: 'erasure'
          - name: '12 - Scheduler and retention'
            script: 'scheduler'
          - name: '12 - Calendar feeds and export'
            script: 'feed'
          - name: '14 - Privacy request integration'
            script: 'privacy'
          - name: '13 - Conferencing providers'
            script: 'conference'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: '15 - Administration and scoped exports'
            script: 'administration'
          - name: '16 - Menu items and routing'
            script: 'menu-routing'
          - name: '17 - Close synthetic delivery'
            script: 'close'
          - name: '21 - Team calendars'
            script: 'teamcalendars'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '20 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-package
          path: com_appointments/tests/
      - name: Start environment (J5)
        run: |
          cd com_appointments/tests
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_appointments_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
          # HTTPS from the test image (caldav/tls/setup-tls.sh), verified against the
          # test CA: the internet calendar suites address the site over TLS.
          docker exec com_appointments_test curl -fsS --cacert /etc/ssl/appointments-test/ca.pem -o /dev/null -w 'HTTPS answered with %{http_code}\n' https://localhost/
      - name: Show container logs
        if: always()
        run: |
          cd com_appointments/tests
          echo "=== Joomla Container Logs ==="
          docker compose logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_appointments/tests
          chmod +x run-tests.sh
          ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: j5-${{ matrix.script }}-logs
          path: com_appointments/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_appointments/tests
          docker compose down -v

  test-j6:
    name: ${{ matrix.name }} (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Site Page'
            script: 'site-page'
          - name: '04 - Schedules'
            script: 'schedules'
          - name: '05 - Blocked periods'
            script: 'blocked'
          - name: '06 - Event types'
            script: 'eventtypes'
          - name: '08 - Booking integrity'
            script: 'booking'
          - name: '07 - Public slot parity'
            script: 'slots'
          - name: '09 - Mail and calendar attachments'
            script: 'mail'
          - name: '09 - Email template administration'
            script: 'templates'
          - name: '10 - Signed booking lifecycle'
            script: 'lifecycle'
          - name: '11 - Erasure and audit'
            script: 'erasure'
          - name: '12 - Scheduler and retention'
            script: 'scheduler'
          - name: '12 - Calendar feeds and export'
            script: 'feed'
          - name: '14 - Privacy request integration'
            script: 'privacy'
          - name: '13 - Conferencing providers'
            script: 'conference'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: '15 - Administration and scoped exports'
            script: 'administration'
          - name: '16 - Menu items and routing'
            script: 'menu-routing'
          - name: '17 - Close synthetic delivery'
            script: 'close'
          - name: '21 - Team calendars'
            script: 'teamcalendars'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '20 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-package
