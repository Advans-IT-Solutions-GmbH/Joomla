PKG_PRIVACY_J2COMMERCE="Paquet J2Commerce Confidentialité"
PKG_PRIVACY_J2COMMERCE_XML_DESCRIPTION="RGPD et protection des données pour J2Commerce en une seule installation : le plugin de confidentialité (export, suppression et conservation des données de la boutique, onglet confidentialité dans le profil client), le plugin système de consentement (consentement au checkout) et le plugin de tâche de nettoyage (anonymisation automatique). Installer, mettre à jour et supprimer le paquet gère les trois ensemble. Installé par-dessus le plugin de confidentialité autonome d'une version antérieure, le paquet le reprend avec toutes ses données, ses réglages et ses états d'activation."
