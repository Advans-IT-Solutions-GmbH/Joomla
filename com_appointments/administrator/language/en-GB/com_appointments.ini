COM_APPOINTMENTS_EVENTTYPE_RETENTION_DESC="Whole days, 0-65535. Empty is stored as NULL and inherits the component booking-retention setting (default 365 days); 0 instead processes already ended bookings on the next 'Appointments: retention' task run, not unlimited retention. The cutoff uses the booking end in UTC, not its cancellation or modification time. The component's 'On erasure' setting chooses anonymisation or complete booking deletion. Future bookings remain outside age-based retention. This override does not change calendar-object or erasure-audit retention; Scheduler must actually run."
