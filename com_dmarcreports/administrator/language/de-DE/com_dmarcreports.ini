COM_DMARCREPORTS_DETAIL_DNS_ERROR="Abfrage fehlgeschlagen (nicht geprüft)"
COM_DMARCREPORTS_DETAIL_DNS_SUGGESTED="Vorgeschlagener Eintrag"
COM_DMARCREPORTS_DETAIL_DNS_DISABLED="DNS-Diagnose ist ausgeschaltet. Aktivieren Sie sie in den Komponentenoptionen, um die veröffentlichten DMARC- und SPF-Einträge dieser Domain zu prüfen. Jede Prüfung sendet den Domainnamen an Ihren konfigurierten DNS-Resolver."
COM_DMARCREPORTS_DETAIL_MTASTS_HEADING="MTA-STS und TLS-RPT"
COM_DMARCREPORTS_DETAIL_MTASTS_DISABLED="MTA-STS ist ausgeschaltet. Aktivieren Sie es in den Komponentenoptionen, um die Richtlinie und die zu veröffentlichenden DNS-Einträge für diese Domain zu erzeugen."
COM_DMARCREPORTS_DETAIL_MTASTS_MANUAL_STEP="Veröffentlichen Sie die untenstehenden Einträge und stellen Sie sicher, dass der Policy-Host (mta-sts.<domain>) über HTTPS mit gültigem Zertifikat erreichbar ist und der Webserver /.well-known/mta-sts.txt an Joomla weitergibt. Diese Schritte kann die Komponente nicht für Sie erledigen. Das Aktionszentrum verfolgt, ob sie umgesetzt sind."
