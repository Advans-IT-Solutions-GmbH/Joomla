COM_APPOINTMENTS_TEMPLATE_ERROR_REQUIRED="Wählen Sie einen unterstützten Benachrichtigungszweck, geben Sie eine Sprachkennung wie en-GB ein und erfassen Sie einen nicht leeren Betreff und Text. Der Betreff muss aus einer einzigen Zeile mit höchstens 255 Zeichen ohne Steuerzeichen bestehen."
