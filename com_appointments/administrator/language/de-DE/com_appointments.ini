COM_APPOINTMENTS_MAIL_LINK_LABEL="%s:"
COM_APPOINTMENTS_CONFIG_REMOVAL_BLOCK_DESC="Optionale rechtliche Erklärung als Klartext. Ein vorhandener Grund blockiert passende Joomla-Entfernungsanfragen und wird dem Administrator angezeigt. Die Einstellung ersetzt keine Datenschutzerklärung und ändert weder Selbstbedienung noch automatische Aufbewahrung."
COM_APPOINTMENTS_CONFIG_AUDIT_RETENTION_DESC="Pflichtwert in ganzen Kalenderjahren, 1-100; Standard 3. Die Aufgabe 'Termine: Aufbewahrung' löscht Nachweise, deren tatsächlicher Zeitpunkt strikt vor UTC-jetzt minus dieser Frist liegt, nicht ab Buchungsende. 0 und leer sind ungültig. Nachweise können den handelnden Administrator identifizieren, niemals einen Gast; diese Einstellung löscht weder Buchungs- noch Kalenderdaten. Das separate Internetkalender-Protokoll hat eine feste Frist von 12 Monaten und seine eigene Aufgabe 'Termine: Protokoll der Internetkalender'."
COM_APPOINTMENTS_FEEDS_TITLE="Kalender-Abonnements"
COM_APPOINTMENTS_FEEDS_PASSWORD_WARNING="Diese Abonnement-URLs sind Passwörter. Wer eine URL besitzt, kann Termindetails lesen. Nicht teilen, per E-Mail versenden oder protokollieren. Die Website speichert von jedem Zugangsschlüssel nur einen Hashwert, deshalb wird eine URL nur einmal angezeigt, wenn das Erneuern sie ausgibt. Beim Erneuern wird die alte URL sofort ungültig."
COM_APPOINTMENTS_FEEDS_READ_ONLY="Abonnierte Kalender sind schreibgeschützt: Das Löschen eines Eintrags storniert die Buchung nicht. Eine Aktualisierung alle 15 Minuten wird angefordert. Das tatsächliche Intervall bestimmt jedoch Ihr Kalenderprogramm."
