name: Publish - J2Commerce Product Compare

on:
  # A manual run only recovers a release whose push-triggered publication never ran,
  # for example because Actions could not start jobs; see the guard step below.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'j2commerce/plg_j2commerce_productcompare/**'

concurrency:
  group: publish-productcompare-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: productcompare v'))"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Allow a manual run only for an unpublished release
        if: github.event_name == 'workflow_dispatch'
        env:
          EXTENSION_PATH: j2commerce/plg_j2commerce_productcompare
          RELEASE_PREFIX: 'release: productcompare v'
        run: |
          # The newest commit on the extension must be its release commit, so the
          # checkout builds exactly the released content. publish-release.py then
          # refuses a version whose tag already exists on another commit.
          SUBJECT=$(git log -1 --format=%s -- "$EXTENSION_PATH/")
          case "$SUBJECT" in
            "$RELEASE_PREFIX"*) echo "Recovering the publication of: $SUBJECT" ;;
            *) echo "::error::The newest commit on $EXTENSION_PATH is not a release commit: $SUBJECT"; exit 1 ;;
          esac

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="j2commerce/plg_j2commerce_productcompare/plg_j2commerce_productcompare.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "productcompare-v" --version "${{ steps.version.outputs.new }}"

      - name: Build extension
        run: |
          cd j2commerce/plg_j2commerce_productcompare
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd j2commerce/plg_j2commerce_productcompare
          PACKAGE=$(ls -1 plg_j2commerce_productcompare_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- j2commerce/plg_j2commerce_productcompare/ | awk '!/\[skip ci\]/ && !/^- release:/ { if (count++ < 20) print }')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: productcompare-v${{ steps.version.outputs.new }}
          NOTES: |
            ## J2Commerce Product Compare Plugin v${{ steps.version.outputs.new }}

            Product comparison for J2Commerce.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable plugin in System → Plugins

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - J2Commerce 4.x or higher

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "productcompare-v" --version "${{ steps.version.outputs.new }}" \
            --package "j2commerce/plg_j2commerce_productcompare/${{ steps.package.outputs.file }}" \
            --title "J2Commerce Product Compare v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: j2commerce/plg_j2commerce_productcompare/${{ steps.package.outputs.file }}
