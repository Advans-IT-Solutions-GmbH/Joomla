PLG_SYSTEM_APPOINTMENTSATTRIBUTION="System - Appointments origin of bookings"
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_DESC="Records in the visitor's session how they reached the site (landing page, campaign parameters, referrer from another host, number of page views), so a booking made later in the same session stores its origin. No cookie of its own, no script. Records nothing until the component option «Origin of bookings» is switched on."
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_HELP_NOTE="What this plugin does and how it works with the Appointments component is explained in <a href='index.php?option=com_appointments&amp;view=help#help-plugins'>Appointments › Help &amp; tips</a>, section «Bundled plugins». The «Help» button at the top right opens the same section."
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_HELP_URL="index.php?option=com_appointments&view=help&tmpl=component#help-plugins"
