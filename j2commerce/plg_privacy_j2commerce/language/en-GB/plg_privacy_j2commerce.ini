PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SUPPORT_EMAIL_HINT="Contact address shown to users for privacy requests. <strong>Must be configured.</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CONSENT_HINT="Displays a privacy consent checkbox at checkout. Link your privacy policy as a Joomla article. If consent is required, the checkout cannot continue until the checkbox is ticked. With J2Store/J2Commerce 4 the template override checks this in the browser, with J2Commerce 6 the bundled system plugin checks it on the server."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP_OPTIONAL_LABEL="Step %d – Optional (Advans IT Solutions GmbH Licensing Configuration)"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Lifetime License Database Flag"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_DESC="Only relevant for shops selling products with perpetual licenses. The privacy removal code and the scheduled cleanup task check for a lifetime license and preserve the order email address for license reactivation. Without this flag, expired customer data is fully anonymized after the retention period expires."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_TITLE="1. J2Commerce 6: mark products via metafields"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_DESC="For each product with a lifetime license, insert a metafield row (replace <strong>123</strong> with the actual J2Commerce product ID):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_HINT="The task checks #__j2commerce_metafields where owner_resource = product, metakey = is_lifetime_license and metavalue = yes."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_TITLE="2. J2Commerce 4 / J2Store: create the custom field table"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_DESC="Only for J2Commerce 4 / J2Store installations: run this SQL in phpMyAdmin or the database console (replace <strong>#__</strong> with your Joomla table prefix, e.g. <strong>jos_</strong>):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_NOTE="This table is <strong>not</strong> visible in the J2Commerce Custom Fields UI (Components → J2Commerce → Custom Fields). It is a separate database table used only by this privacy plugin."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_ASSIGN_TITLE="3. J2Commerce 4 / J2Store: mark products as lifetime licenses"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_ASSIGN_DESC="For each product with a lifetime license, insert a row (replace <strong>123</strong> with the actual J2Store product ID):"
