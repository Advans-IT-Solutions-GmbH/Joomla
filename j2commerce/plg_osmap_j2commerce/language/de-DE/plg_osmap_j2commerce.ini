PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Fügt alle aktivierten J2Commerce-Produkte automatisch zur OSMap-Sitemap hinzu."

; Plugin-Parameter
PLG_OSMAP_PRIORITY_LABEL="Priorität"
PLG_OSMAP_PRIORITY_DESC="Sitemap-Priorität für Produktseiten (0.0–1.0). Standard: 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Änderungshäufigkeit"
PLG_OSMAP_CHANGEFREQ_DESC="Wie häufig sich Produktseiten voraussichtlich ändern."

; Post-Installations-Nachricht
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce: Installation abgeschlossen"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_LABEL="Schritt 1"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Plugin aktivieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Verwalten → Plugins</strong> → nach <strong>OSMap - J2Commerce</strong> suchen → aktivieren."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_LABEL="Schritt 2"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="OSMap konfigurieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="In OSMap (<strong>Komponenten → OSMap</strong>) die Sitemap öffnen und sicherstellen, dass das Menü mit dem Shop-Eintrag ausgewählt ist. Das Plugin erkennt alle aktivierten J2Commerce-Produkte automatisch."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_LABEL="Schritt 3"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Sitemap neu generieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Die Sitemap-URL aufrufen (z.B. <strong>/sitemap</strong>) oder in OSMap auf <strong>Aktualisieren</strong> klicken. Öffentlich sichtbare Produkte (veröffentlicht und für Gäste zugänglich) erscheinen als <code>/shop/produkt-alias</code>-URLs (auf einer mehrsprachigen Website trägt jede URL das Sprach-SEF-Präfix des Menüeintrags, z.B. <code>/de/shop/produkt-alias</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin aktiviert (System → Verwalten → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Shop-Menüeintrag in der OSMap-Sitemap ausgewählt"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap neu generiert und Produkt-URLs sichtbar"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Checkliste"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Dokumentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Installer-Hinweise
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce wurde auf Version %s aktualisiert."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) ist nicht installiert. Dieses Plugin funktioniert nur zusammen mit OSMap; OSMap installieren, um eine Sitemap zu erzeugen."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Weder J2Commerce 6 (com_j2commerce) noch J2Store/J2Commerce 4 (com_j2store) ist installiert und aktiviert. Es werden keine Produkte in die Sitemap aufgenommen, bis eine der beiden Komponenten verfügbar ist."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="Das alte OSMap-Plugin für J2Store (osmap/j2store) wurde deaktiviert, weil dieses Plugin es ersetzt."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="Das alte OSMap-Plugin für J2Store (osmap/j2store) konnte nicht deaktiviert werden: %s. Bitte manuell unter System → Verwalten → Plugins deaktivieren."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="Die OSMap-Datei %s wurde angepasst, damit Factory::getTable() nicht mehr false zurückgibt (Kompatibilität mit PHP 8.1+)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="Die OSMap-Datei %s konnte nicht gelesen oder geschrieben werden; die Anpassung für PHP 8.1+ wurde nicht angewendet. OSMap auf Version 5.1.4 oder neuer aktualisieren."
