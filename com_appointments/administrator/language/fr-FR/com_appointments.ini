COM_APPOINTMENTS_TEAM_C_FIELD_OWNER_DESC="Choisissez un compte d'équipe interne admissible. Le propriétaire reçoit 'Gestion' avec une vraie enveloppe de clé. Si vous vous choisissez et n'avez pas encore de clé, Enregistrer la crée uniquement après mot de passe et second facteur approuvé dans cette session d'administration. Ouvrir ce formulaire ne crée aucune clé. Choisir un autre compte n'initialise jamais sa clé ; ce propriétaire doit d'abord établir sa propre clé."
COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION="Conservation en jours"
COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION_DESC="Jours entiers, 0-65535 ; défaut 0 désactive uniquement la suppression par âge, sans hériter du délai des réservations. Vide est invalide et n'hérite pas non plus du délai des réservations. Calendriers Internet activés, 'Rendez-vous : conservation des calendriers Internet' supprime l'objet entier seulement si sa dernière occurrence déterminable avec sûreté finit strictement avant maintenant en UTC moins ce délai ; sans fuseau, l'heure est traitée en UTC. Une série finie expire entièrement après sa dernière occurrence. Le nettoyage par âge conserve les séries futures, infinies, indéterminables, THISANDFUTURE ou trop grandes. Les entrées importées/CalDAV et copies de réservations suivent la même règle, sans supprimer réservations ni traces d'effacement. Séparément, les réservations annulées, anonymisées, supprimées ou orphelines perdent leurs copies même avec 0 ; désactiver les calendriers Internet retire aussi les copies. Un nouvel envoi ou une modification de réservation peut recréer un objet. Plugin de tâches et Scheduler régulièrement déclenché sont requis."
