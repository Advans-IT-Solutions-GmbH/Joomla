COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_SUBJECT="Ihr Zugang zu den Internetkalendern ist gesperrt"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_BODY="Guten Tag {user_name},\n\nIhr Zugang zu den Internetkalendern auf {site_name} ist gesperrt. Grund: {reason}\n\nGeräte mit der Einstellung «Aufräumen» erhalten beim nächsten Abgleich die Kalender leer und löschen ihre Kopie. Geräte mit «Nur sperren» werden sofort abgewiesen und löschen nichts. Danach kann kein Gerät mehr abgleichen.\n\nWer einen Kalender verwaltet, kann ihn wieder für Sie freigeben. Haben Sie die Sperre nicht erwartet, informieren Sie die Administration."
