COM_APPOINTMENTS_TEAM_D_MAIL_DEVICE_ADDED_BODY="Guten Tag {user_name},\n\nFür Ihr Konto auf {site_name} wurde ein neues Gerät für die Internetkalender hinzugefügt.\n\nGerät: {device_name}\nProgramm: {client}\nZeitpunkt: {created}\n\nWaren Sie das nicht? Dann melden Sie sich sofort an, entfernen Sie das Gerät unter «Meine Kalender», ändern Sie Ihr Passwort und informieren Sie die Administration.\n\nMeine Kalender:\n{mycalendars_url}\n\nDiese Mail enthält kein Passwort. Das App-Passwort wird nur einmal auf der Website angezeigt."
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_SUBJECT="Ihr Konto auf {site_name} aktivieren"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_BODY="Guten Tag {user_name},\n\nFür Sie wurde auf {site_name} ein Konto für die Internetkalender angelegt. Legen Sie mit diesem Link Ihr Passwort fest. Der Link gilt einmal und bis {expires}.\n\nKonto aktivieren:\n{activation_url}\n\nBei der ersten Anmeldung richten Sie einen zweiten Faktor ein, z.B. eine Authenticator-App.\n\nHaben Sie kein Konto erwartet? Dann öffnen Sie den Link nicht und informieren Sie die Administration."
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_SUBJECT="Konto aktiviert: {account_name}"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_BODY="Guten Tag {user_name},\n\nDas Konto {account_name} ({account_username}) hat sein Passwort auf {site_name} festgelegt und ist aktiv. Beim ersten Zugriff auf die Internetkalender richtet es den zweiten Faktor ein.\n\nIst das nicht die vorgesehene Person, widerrufen Sie den Zugang mit einem Schritt. Dabei werden alle Freigaben entfernt, das Konto gesperrt und seine Geräte gesperrt, je nach Geräteeinstellung mit Aufräumen.\n\nZugang widerrufen:\n{revoke_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_SUBJECT="Freigabe geändert: {calendar_title}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_BODY="Guten Tag {user_name},\n\nIm Internetkalender «{calendar_title}» auf {site_name} wurde eine Freigabe erteilt oder geändert.\n\nPerson: {grantee_name}\nRolle: {role}\nGeändert von: {actor_name}\n\nIst diese Freigabe nicht vorgesehen, informieren Sie sofort die Administration.\n\nMeine Kalender:\n{mycalendars_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_SUBJECT="Ihr Zugang zu den Internetkalendern ist gesperrt"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_BODY="Guten Tag {user_name},\n\nIhr Zugang zu den Internetkalendern auf {site_name} ist gesperrt. Grund: {reason}\n\nGeräte mit der Einstellung «Aufräumen» erhalten beim nächsten Abgleich die Kalender leer und löschen ihre Kopie. Geräte mit «Nur sperren» werden sofort abgewiesen und löschen nichts. Danach kann kein Gerät mehr abgleichen.\n\nWer einen Kalender verwaltet, kann ihn wieder für Sie freigeben. Haben Sie die Sperre nicht erwartet, informieren Sie die Administration."
; [team-d] end

; [notify] begin: booking mails to the users of a target calendar, without invitation
COM_APPOINTMENTS_MAIL_CALENDAR_BOOKED_SUBJECT="Neuer Termin in {calendar_title}: {event_title}"
COM_APPOINTMENTS_MAIL_CALENDAR_BOOKED_BODY="Im Kalender {calendar_title} wurde ein neuer Termin gebucht.\n{event_title}\nStatus: {state_label}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nZeit beim Besucher: {invitee_time}\nGastgeber: {host_name}\nName: {invitee_name}\nE-Mail: {invitee_email}\nTelefon: {invitee_phone}\nGäste: {guest_emails}\n{field_answers}\n{attribution}\nOrt: {location}\n{conference_url}\n\nDer Termin kommt über die Synchronisierung in Ihren Kalender. Diese Mail enthält deshalb keine Einladung, damit der Termin nicht doppelt erscheint."
COM_APPOINTMENTS_MAIL_CALENDAR_APPROVED_SUBJECT="Freigegeben in {calendar_title}: {event_title}"
COM_APPOINTMENTS_MAIL_CALENDAR_APPROVED_BODY="Ein Termin im Kalender {calendar_title} wurde freigegeben.\n{event_title}\nStatus: {state_label}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nZeit beim Besucher: {invitee_time}\nGastgeber: {host_name}\nName: {invitee_name}\nE-Mail: {invitee_email}\nTelefon: {invitee_phone}\nGäste: {guest_emails}\n{field_answers}\n{attribution}\nOrt: {location}\n{conference_url}\n\nIhr Kalender zeigt die Änderung nach der nächsten Synchronisierung. Diese Mail enthält keine Einladung."
COM_APPOINTMENTS_MAIL_CALENDAR_RESCHEDULED_SUBJECT="Neue Zeit in {calendar_title}: {event_title}"
COM_APPOINTMENTS_MAIL_CALENDAR_RESCHEDULED_BODY="Ein Termin im Kalender {calendar_title} wurde auf eine neue Zeit verschoben.\n{event_title}\nStatus: {state_label}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nZeit beim Besucher: {invitee_time}\nGastgeber: {host_name}\nName: {invitee_name}\nE-Mail: {invitee_email}\nTelefon: {invitee_phone}\nGäste: {guest_emails}\n{field_answers}\n{attribution}\nOrt: {location}\n{conference_url}\n\nIhr Kalender zeigt die neue Zeit nach der nächsten Synchronisierung. Diese Mail enthält keine Einladung."
COM_APPOINTMENTS_MAIL_CALENDAR_CANCELLED_SUBJECT="Abgesagt in {calendar_title}: {event_title}"
COM_APPOINTMENTS_MAIL_CALENDAR_CANCELLED_BODY="Ein Termin im Kalender {calendar_title} wurde abgesagt.\n{event_title}\nStatus: {state_label}\nGrund der Absage: {cancel_reason}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nZeit beim Besucher: {invitee_time}\nGastgeber: {host_name}\nName: {invitee_name}\nE-Mail: {invitee_email}\nTelefon: {invitee_phone}\nGäste: {guest_emails}\n{field_answers}\n{attribution}\n\nDer Eintrag verschwindet bei der nächsten Synchronisierung aus Ihrem Kalender. Diese Mail enthält keine Kalenderabsage."
COM_APPOINTMENTS_MAIL_CALENDAR_REMINDER_SUBJECT="Erinnerung: {event_title}"
COM_APPOINTMENTS_MAIL_CALENDAR_REMINDER_BODY="Ein Termin im Kalender {calendar_title} steht bevor.\n{event_title}\nStatus: {state_label}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nZeit beim Besucher: {invitee_time}\nName: {invitee_name}\nE-Mail: {invitee_email}\nTelefon: {invitee_phone}\nGäste: {guest_emails}\n{field_answers}\n{attribution}\nOrt: {location}\n{conference_url}\n\nDer Termin ist über die Synchronisierung in Ihrem Kalender. Diese Mail enthält keine Einladung."
