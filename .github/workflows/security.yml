name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: Advans-IT-Solutions-GmbH/.github/.github/workflows/reusable-security.yml@5a49bce76e1f4537ad23c1d1de3c87193b117892 # v1
    with:
      fail_on_findings: false   # Semgrep/zizmor: report-only
      gitleaks_fail: true       # Gitleaks: blockierendes Gate für neue Secrets