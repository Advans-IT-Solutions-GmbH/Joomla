PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP5_DESC="Joomla benötigt einen Frontend-Menüeintrag für <strong>com_privacy</strong>, damit die Datenschutz-Schaltflächen im Profil funktionieren. Ohne diesen Menüeintrag werden Benutzer auf die Startseite umgeleitet."
