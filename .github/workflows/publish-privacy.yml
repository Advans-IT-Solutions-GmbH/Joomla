name: Publish - J2Commerce Privacy

on:
  push:
    branches:
      - main
    paths:
      - 'j2commerce/plg_privacy_j2commerce/**'

concurrency:
  group: publish-privacy-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: privacy v')"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="j2commerce/plg_privacy_j2commerce/j2commerce.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "privacy-v" --version "${{ steps.version.outputs.new }}"

      - name: Build extension
        run: |
          cd j2commerce/plg_privacy_j2commerce
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd j2commerce/plg_privacy_j2commerce
          PACKAGE=$(ls -1 plg_privacy_j2commerce_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- j2commerce/plg_privacy_j2commerce/ | awk '!/\[skip ci\]/ && !/^- release:/ { if (count++ < 20) print }')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: privacy-v${{ steps.version.outputs.new }}
          NOTES: |
            ## J2Commerce Privacy Plugin v${{ steps.version.outputs.new }}

            Privacy plugin for J2Commerce GDPR compliance.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable plugin in System → Plugins

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - J2Commerce 4.x or higher

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "privacy-v" --version "${{ steps.version.outputs.new }}" \
            --package "j2commerce/plg_privacy_j2commerce/${{ steps.package.outputs.file }}" \
            --title "J2Commerce Privacy v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: j2commerce/plg_privacy_j2commerce/${{ steps.package.outputs.file }}
