; Help tab of the module edit screen (manifest, field type helppage)
MOD_APPOINTMENTS_HELP_NOTE="Der Reiter «Hilfe» erklärt, was dieses Modul zeigt, wer es sieht und was bei Problemen zu tun ist."
MOD_APPOINTMENTS_HELP_TAB="Hilfe"
MOD_APPOINTMENTS_HELP_WHAT_TITLE="Was dieses Modul zeigt"
MOD_APPOINTMENTS_HELP_WHAT_P1="Das Modul zeigt die nächsten Termine der Komponente Termine auf dem Dashboard des Administrators."
MOD_APPOINTMENTS_HELP_WHAT_LI1="Die nächsten ausstehenden oder bestätigten Termine, so viele wie unter «Anzahl Termine» eingestellt, mit Datum und Zeit in der Zeitzone der Website (Konfiguration, «Zeitzone der Website»), der Terminart und dem Namen der buchenden Person. Ausstehende Termine sind mit «Freigabe ausstehend» markiert. Ein Klick öffnet die Buchung."
MOD_APPOINTMENTS_HELP_WHAT_LI2="Die Zahl der Buchungen seit Ihrem letzten Besuch, für jeden Benutzer einzeln: Das Modul speichert zu Ihrem Benutzerkonto, wann Sie das Dashboard zuletzt gesehen haben, und zählt die Buchungen, die danach eingegangen sind. Der Bezugspunkt bleibt bis zur nächsten Anmeldung gleich. Beim allerersten Besuch gibt es noch keine Zahl."
MOD_APPOINTMENTS_HELP_WHAT_LI3="Vergangene, abgesagte und gelöschte Termine erscheinen nicht. Gelöschte Buchungen werden nicht gezählt."
MOD_APPOINTMENTS_HELP_WHAT_LI4="«Buchungen öffnen» führt zur Buchungsliste der Komponente."
MOD_APPOINTMENTS_HELP_ACCESS_TITLE="Wer was sieht"
MOD_APPOINTMENTS_HELP_ACCESS_P1="Das Modul folgt den Regeln der Buchungsliste: Ein Benutzer sieht es nur mit «Zugriff auf Administrationsoberfläche» für die Komponente und «Bearbeiten» für mindestens eine Terminart, und dann nur die Termine dieser Terminarten. Alle anderen sehen gar nichts, auch nicht den Titel des Moduls. Die Hilfeseite der Komponente erklärt die Berechtigungen und wie ein weiteres Konto Zugriff erhält (Abschnitt «Berechtigungen»)."
MOD_APPOINTMENTS_HELP_ACCESS_NOTE="Namen der buchenden Personen sind Personendaten. Geben Sie nur Konten Zugriff, die ihn brauchen."
MOD_APPOINTMENTS_HELP_SETUP_TITLE="Einrichtung"
MOD_APPOINTMENTS_HELP_SETUP_STEP1="Die Komponente installiert das Modul bei ihrer ersten Installation, veröffentlicht es auf der Position «cpanel» des Dashboards und gibt ihm den Titel «Nächste Termine». Ein Update behält Position, Titel und Status so bei, wie Sie sie eingestellt haben."
MOD_APPOINTMENTS_HELP_SETUP_STEP2="Unter System, Administratormodule ändern Sie den Titel, die Anzahl Termine, die Position und die Zugriffsebene oder sperren das Modul. Im Register Erweitert stehen das Layout und das Modulklassen-Suffix."
MOD_APPOINTMENTS_HELP_SETUP_STEP3="Die Deinstallation der Komponente entfernt das Modul und die gespeicherten Zeiten der letzten Besuche."
MOD_APPOINTMENTS_HELP_PROBLEMS_TITLE="Probleme und was zu tun ist"
MOD_APPOINTMENTS_HELP_PROBLEMS_LI1="Das Modul fehlt auf dem Dashboard: Prüfen Sie, ob es auf der Position «cpanel» veröffentlicht ist und ob Ihr Konto die Berechtigungen unter «Wer was sieht» hat."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI2="«Die Termine konnten nicht geladen werden.»: Die Ursache steht im Joomla-Protokoll (Kategorie com_appointments). Prüfen Sie, ob die Komponente aktiviert ist, und führen Sie ihre Systemprüfung aus."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI3="Eine Zeit weicht von der Buchungsliste ab: Das Modul zeigt die Zeitzone der Website, die Buchungsliste UTC."
