COM_APPOINTMENTS_TEAM_F_SYSTEM_WELL_KNOWN_FIX="Der Hoster beantwortet /.well-known/ selbst. Bitten Sie darum, die Adresse an Joomla weiterzugeben, oder tragen Sie in den Kalenderprogrammen die vollständige Kalenderadresse ein."
COM_APPOINTMENTS_TEAM_F_PRIVACY_OTHER_PERSON="eine andere Person"
COM_APPOINTMENTS_TEAM_F_PRIVACY_LOG_TRUNCATED="Nur die ersten %d Protokolleinträge sind aufgeführt. Die übrigen erhalten Sie beim Betreiber."
COM_APPOINTMENTS_TEAM_F_SYSTEM_HSTS="Internetkalender: Die Website sendet Strict-Transport-Security (HSTS)"
COM_APPOINTMENTS_TEAM_F_SYSTEM_HSTS_FIX="Empfohlen: Schalten Sie HSTS im Joomla-Plugin «System - HTTP-Header» oder im Webserver ein, damit Browser die Website nie ohne HTTPS aufrufen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROXY="Internetkalender: Website hinter einem Load Balancer"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROXY_FIX="Joomla übernimmt die Adresse des Besuchers dann aus X-Forwarded-For. Stellen Sie sicher, dass der Proxy diesen Header überschreibt, sonst kann ein Programm die Adresse wählen, die die Anmeldesperre zählt."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR="Internetkalender: Schutz gegen eine zurückgespielte Datenbank"
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_FIX="Der Schutz gegen eine ohne ihre Dateien zurückgespielte Datenbank ist aus: Die Komponente kann ihre Ankerdatei unter administrator/components/com_appointments-data nicht schreiben. Erlauben Sie dem Webserver, dort zu schreiben."
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_CLEAR="Noch nicht verschlüsselte Buchungen"
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_CLEAR_FIX="Die geplante Aufgabe «Aufbewahrung der Internetkalender» verschlüsselt sie in Stapeln. Lassen Sie sie laufen, bis die Zahl 0 ist."
COM_APPOINTMENTS_TEAM_F_DEVICES_UNLOCK="Anmeldesperre aufheben"
COM_APPOINTMENTS_TEAM_F_DEVICES_UNLOCKED="Anmeldesperre für %d Benutzer aufgehoben."
COM_APPOINTMENTS_TEAM_F_PRIVACY_CONTENT_NOTE="Enthalten sind nur Zeiten, Titel, Ort und Ihre eigene Teilnahme. Beschreibungen, Notizen, Anhänge und weitere Teilnehmende sind weggelassen, weil sie andere Personen betreffen können."
COM_APPOINTMENTS_TEAM_F_PRIVACY_BOOKINGS_UNREADABLE="Buchungen, die für diese Anfrage nicht gelesen werden konnten (nur die Anzahl). Der Betreiber prüft sie gesondert."
COM_APPOINTMENTS_TEAM_F_PRIVACY_BOOKINGS_UNREADABLE_ADMIN="Die Anfrage ist unvollständig: %d Buchung(en) konnten nicht entschlüsselt werden und wurden nicht durchsucht. Prüfen Sie das Site-Secret und die Systemprüfung."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_BEHIND="Internetkalender: noch nicht verankerte Kalender und Benutzer"
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_BEHIND_FIX="Für diese ist der Schutz gegen eine zurückgespielte Datenbank noch nicht aktiv. Hinweis: Wer nur die Datenbank aus einem Backup zurückspielt, das älter ist als die letzte Rotation, der letzte Entzug oder die letzte Gerätesperre, für den bleiben die betroffenen Kalender und Benutzer geschlossen, bis administrator/components/com_appointments-data/epochs.php gelöscht wird. Das setzt den Schutz zurück."
COM_APPOINTMENTS_TEAM_F_SYSTEM_GUARD="Internetkalender: Ausfälle der Anmeldesperre in den letzten 24 Stunden"
COM_APPOINTMENTS_TEAM_F_SYSTEM_GUARD_FIX="Die Anmeldesperre konnte nicht geprüft werden, und Anmeldungen auf der Website liefen ohne sie weiter. Prüfen Sie die Datenbank und das Joomla-Protokoll."
COM_APPOINTMENTS_TEAM_F_SYSTEM_API_BASIC="Internetkalender: Plugin «API-Authentifizierung - Basic Auth»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_API_BASIC_FIX="Es meldet mit Passwort an, ohne zweiten Faktor und ohne Anmeldesperre. Schalten Sie es unter System, Plugins aus."
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_TRIES="Internetkalender: Versuche für den zweiten Faktor (Versuche / Stunden)"
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_TRIES_FIX="Joomla begrenzt die Versuche für den zweiten Faktor nur mit höchstens 10 Versuchen und einer Zeit von mindestens 1 Stunde. Stellen Sie beides unter Benutzer, Optionen, Multi-Faktor-Authentifizierung ein."
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_UNVERIFIED="Buchungen noch im Klartext und nicht verifiziert"
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_UNVERIFIED_FIX="Diese Buchungen bleiben lesbar, ihr Inhalt ist aber nicht geschützt. Verschlüsseln Sie sie unter Buchungen, «Jetzt verschlüsseln»."
