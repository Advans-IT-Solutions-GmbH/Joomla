; htaccess check
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_WARNING_TITLE=".htaccess: com_ajax exception missing"
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_COMPONENT_BLOCKED="The /component/ block in .htaccess has no exception for com_ajax plugin calls (for example RewriteCond %{QUERY_STRING} !plugin= [NC]). AJAX calls (login, cart, etc.) will fail."
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_OPTION_BLOCKED="The index.php?option=com_* block has no exception for com_ajax (for example RewriteCond %{QUERY_STRING} !^option=com_ajax [NC]). AJAX calls will fail."
