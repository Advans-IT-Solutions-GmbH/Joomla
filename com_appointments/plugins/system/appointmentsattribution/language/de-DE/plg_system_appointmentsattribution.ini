PLG_SYSTEM_APPOINTMENTSATTRIBUTION="System - Termine Herkunft der Buchungen"
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_DESC="Hält in der Sitzung eines Besuchs fest, wie die Person auf die Website gelangt ist (Einstiegsseite, Kampagnenparameter, verweisende Seite eines anderen Hosts, Anzahl Seitenaufrufe), damit eine spätere Buchung in derselben Sitzung ihre Herkunft speichert. Kein eigenes Cookie, kein Skript. Erfasst nichts, bis die Komponentenoption «Herkunft der Buchungen» eingeschaltet ist."
