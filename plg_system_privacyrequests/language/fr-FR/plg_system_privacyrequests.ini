PLG_SYSTEM_PRIVACYREQUESTS="Système - Demandes de confidentialité"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="Confirmation par courriel sans compte pour les demandes de suppression dans Joomla Confidentialité. Activer explicitement et publier le lien vers la page publique. Les autorisations administrateur et les blocages des plugins restent applicables."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Demander la suppression de données personnelles"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="Aucun compte n'est nécessaire. Saisissez votre adresse pour demander un code, ou le code reçu par courriel pour confirmer la demande. Redemandez un code expiré ; la demande en attente conserve sa date de réception initiale."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Code de confirmation (reçu par courriel)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Demander ou renouveler le code"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Confirmer la demande"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="Si cette adresse est acceptée pour traitement, une demande Core est enregistrée ou une demande existante conservée. Cette réponse ne confirme ni réception, ni envoi du courriel, ni confirmation, ni effacement. Vérifiez vos courriels ; sans code, réessayez plus tard ou contactez l'exploitant par un autre moyen. Les envois répétés peuvent être limités."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Demande de confidentialité : échec de l'envoi de confirmation"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="L'envoi de confirmation de la demande Core %d a échoué. Sa date de réception et son état en attente sont conservés. Vérifiez la demande native et la configuration du courrier. Rétablissez l'envoi à l'adresse initiale, puis renouvelez le code par le formulaire invité. Le contact permet la communication et une évaluation proportionnée, pas la confirmation de cette demande Core. Joomla ne fournit aucune action manuelle prise en charge pour confirmer un destinataire initial rejeté. Conservez la demande en attente ; ne remplacez pas l'adresse et ne forcez ni confirmation ni clôture."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="L'envoi de confirmation a échoué. La demande Core en attente et sa date initiale sont conservées ; ni livraison ni identité ne sont prouvées. La comparaison Unicode exacte ne garantit pas l'envoi Joomla avec Unicode avant @. Utilisez le contact opérateur pour communiquer et effectuer une évaluation proportionnée. Le contact ou une autre adresse de réponse ne confirme pas cette demande. Le Core ne fournit aucune confirmation manuelle prise en charge pour un destinataire initial rejeté : conservez la demande en attente jusqu'au fonctionnement de la confirmation à cette adresse. Ne contournez ni confirmation, ni suppression, ni clôture."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Votre demande est confirmée pour traitement par l'administration. Cela confirme l'accès à cette adresse, pas toute identité ou tout droit. Cette confirmation n'a supprimé aucune donnée."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="Ce code a expiré, pas votre droit ni la demande initiale. Demandez un nouveau code ici ou contactez l'exploitant pour une autre méthode de confirmation."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="La demande n'a pas pu être confirmée. Vérifiez l'adresse et le code ou réessayez plus tard. Vous pouvez renouveler le code ou contacter l'exploitant."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Saisissez une adresse valable de 100 caractères au maximum. Les adresses contenant des trémas ou d'autres caractères spéciaux avant le @ ne sont pas acceptées, comme partout dans Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="Le service n'a pas pu terminer cette opération. Ne présumez ni réception ni confirmation. Réessayez plus tard ou contactez l'exploitant par un autre moyen."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="L'opération ne peut pas démarrer en toute sécurité. Une autre opération est peut-être en cours. Ne présumez ni suppression ni clôture ; réessayez plus tard ou consultez le journal d'administration."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Nouvelle tentative de suppression bloquée : vérifiez et confirmez d'abord la correction de la tentative incomplète précédente. Cocher la case ne répare pas les données restantes."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="L'administration vérifie l'identité, le périmètre et les obligations de conservation avant toute suppression. L'automatisation couvre uniquement les plugins participants. Les copies dans les courriels, clients de calendrier, CRM, sauvegardes et autres systèmes externes nécessitent un examen séparé ; les journaux et preuves conservés ne signifient pas que tout a été effacé."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="Le compte choisi par Joomla ne correspond pas exactement à l'adresse demandée. Résolvez cette différence avant la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Confirmez cette demande sans compte avec l'adresse et le code sur la page publique."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="J'ai vérifié le périmètre et la réponse à la personne"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Avant de relancer la suppression, j'ai vérifié la résolution du nettoyage partiel précédent"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="À utiliser uniquement après résolution et vérification indépendantes des erreurs précédentes, y compris les copies introuvables par l'adresse initiale. Ne contourne ni erreurs actuelles, ni contenu illisible, ni blocages légaux. Ne clôture pas la demande."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Avant de terminer, exécutez la suppression sans avertissement non résolu. Vérifiez les plugins participants, les preuves d'identité supplémentaires, les preuves conservées et les copies externes. La clôture Core documente le traitement, pas une suppression universelle."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Clôture bloquée : exécutez d'abord la suppression sans avertissement non résolu, puis vérifiez explicitement le périmètre et la réponse. Un callback exécuté ne prouve pas une suppression complète."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Chemin de contact de l'exploitant"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Obligatoire avant activation : une page de contact Joomla locale et publique existante, commençant par index.php, par exemple index.php?option=com_contact&view=contact&id=42. Utilisez l'identifiant réel et testez sans compte. Aucune URL externe, redirection ou ancre. Le contact ne confirme ni ne clôture une demande Core."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Contacter l'exploitant du site"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Utilisez ce contact si aucun code n'arrive ou si Joomla ne peut pas écrire à votre adresse initiale. Indiquez exactement cette adresse. Une autre adresse de réponse sert uniquement à communiquer et ne prouve pas l'accès à cette boîte. Le contact seul ne confirme pas la demande Core et n'autorise pas la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="Aucun lien de contact n'est configuré ici. Utilisez les coordonnées de l'exploitant dans les mentions légales ou la politique de confidentialité du site. Ne présumez pas que cette page a reçu ou confirmé votre demande."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_PRIVACYREQUESTS_HELP_NOTE="L'onglet « Aide » explique ce que fait ce plugin, comment le configurer et que faire en cas de problème."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_TAB="Aide"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_TITLE="Ce que fait ce plugin"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_P1="Dans le frontend, Joomla n'accepte les demandes de confidentialité que de personnes connectées. Ce plugin ajoute une page publique sur laquelle des personnes sans compte utilisateur déposent une demande de suppression et la confirment avec un code reçu par e-mail. La demande est une demande normale du composant Confidentialité de Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI1="La page a l'adresse <code>index.php?option=com_ajax&plugin=privacyrequests&group=system&format=html</code>. Créez un lien vers elle, p. ex. dans votre politique de confidentialité."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI2="La page n'accepte que des demandes de suppression, pas de demandes d'export."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI3="Le traitement reste entre vos mains : vous exécutez la suppression sous « Utilisateurs → Confidentialité → Demandes » et clôturez la demande. Joomla appelle pour cela tous les plugins de confidentialité actifs."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI4="Tant que le plugin est activé, il ajoute des garde-fous à chaque demande de suppression, y compris aux demandes qui ne proviennent pas de cette page (section « Limites et verrous »)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI5="L'installation n'active pas le plugin, ne modifie aucun réglage d'e-mail et ne crée aucune tâche planifiée."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_NOTE1="Une adresse e-mail confirmée prouve seulement l'accès à cette boîte aux lettres. Vérifiez vous-même l'identité et le périmètre avant de supprimer des données."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_TITLE="Configuration pas à pas"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP1="Vérifiez l'envoi d'e-mails du site dans la configuration globale. Si l'envoi est désactivé, la page n'accepte aucune demande."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP2="Créez une page de contact accessible sans connexion, p. ex. un formulaire de contact du composant Contacts de Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP3="Saisissez son chemin dans le champ « Chemin de contact de l'exploitant » et enregistrez."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP4="Activez le plugin."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP5="Créez un lien vers la page publique."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP6="Testez la demande, la confirmation, la suppression et la clôture sur une installation de test avec une adresse de test comme <code>test@example.org</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_TITLE="Installation, mise à jour et désinstallation"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI1="Installez le ZIP avec l'installateur d'extensions de Joomla. L'installation crée les trois tables auxiliaires, n'active pas le plugin et ne crée aucune tâche planifiée. Le plugin n'a besoin d'aucune tâche planifiée."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI2="Avant une mise à jour, effectuez une sauvegarde actuelle et complète de tout le site, que vous pouvez restaurer de manière indépendante. L'installateur ne conserve aucune copie de fichier et ne peut pas vérifier votre sauvegarde. La première tentative de mise à jour affiche cette recommandation et s'arrête avant de modifier des fichiers, puis vous relancez la mise à jour. Les réglages et l'état activé sont conservés."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI3="Si l'installateur trouve un fichier modifié ou inconnu que la mise à jour remplacerait, il s'arrête avant de copier quoi que ce soit et indique le chemin et les empreintes. Vérifiez le fichier, résolvez-le à la main ou reportez la mise à jour, puis réessayez. Il n'existe ni commande d'approbation ni contournement."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI4="Après une mise à jour, vérifiez à nouveau la route de contact, l'envoi des e-mails et les plugins de confidentialité actifs sur une installation de test."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI5="La désinstallation supprime le plugin et ses trois tables auxiliaires. Les demandes et le journal d'actions de Joomla restent. Clôturez d'abord les demandes ouvertes issues de cette page."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_TITLE="Réglage « Chemin de contact de l'exploitant »"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_P1="Champ obligatoire sans valeur par défaut. Chemin Joomla interne d'une page publique par laquelle la personne vous joint si aucun code n'arrive."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI1="Le chemin commence par <code>index.php</code>, p. ex. <code>index.php?option=com_contact&view=contact&id=42</code> ou <code>index.php?Itemid=42</code>. Utilisez l'ID réel de votre site."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI2="Les adresses externes, les ancres avec #, les espaces et les caractères de contrôle ne sont pas autorisés. Le chemin compte au plus 2048 caractères."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI3="La page publique affiche le lien sous le formulaire. Dans la demande, il apparaît dans l'avertissement lorsque l'envoi du code a échoué. Sans chemin valide, la page invite à utiliser les coordonnées du site."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI4="Une prise de contact ne confirme ni ne clôture une demande."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_TITLE="Déroulement d'une demande"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP1="La personne saisit son adresse e-mail et choisit « Demander ou renouveler le code »."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP2="Le plugin crée une demande de suppression en attente et envoie le code avec le modèle d'e-mail Joomla des demandes de suppression à exactement cette adresse. Les super utilisateurs qui reçoivent les e-mails système reçoivent un message privé Joomla. La page répond toujours de la même façon, pour que personne n'apprenne si une demande existe."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP3="La personne saisit l'adresse et le code et choisit « Confirmer la demande ». Joomla marque la demande comme confirmée. Rien n'est encore supprimé."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP4="Vous ouvrez la demande sous « Utilisateurs → Confidentialité → Demandes » et exécutez la suppression. Joomla appelle les plugins de confidentialité, p. ex. « Privacy - J2Commerce Confidentialité » pour les données de la boutique."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP5="Ensuite, vous cochez « J'ai vérifié le périmètre et la réponse à la personne » et clôturez la demande."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI1="Le code est valable 24 heures et ne peut être utilisé qu'une fois. S'il a expiré, la personne en demande un nouveau sur la même page. La demande reste avec sa date de réception d'origine."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI2="S'il existe déjà pour l'adresse une demande de suppression ouverte qui ne provient pas de cette page, le plugin n'en crée pas de nouvelle et ne modifie pas l'existante. Une demande déjà confirmée reste elle aussi inchangée."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI3="L'e-mail est rédigé dans la langue du compte utilisateur de cette adresse, sinon dans la langue par défaut du site."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_TITLE="Limites et verrous"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI1="La page n'accepte que des adresses e-mail simples de 100 caractères au plus, sans trémas ni autres caractères spéciaux, sans espaces, guillemets ni parenthèses."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI2="Par adresse IP, 20 tentatives de demande et 20 de confirmation sont possibles en 15 minutes, par adresse e-mail 5 demandes. Chaque tentative compte. La page répond de la même façon aux tentatives supplémentaires, mais ne les exécute pas."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI3="Les compteurs n'enregistrent aucune adresse, seulement des sommes de contrôle (HMAC) formées avec la clé secrète du site."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI4="Vous ne pouvez pas passer manuellement au statut confirmé une demande issue de cette page. Seule la personne confirme, avec le code."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI5="La clôture d'une demande de suppression est bloquée tant que la suppression ne s'est pas déroulée avec succès sans avertissement et que la case de vérification n'est pas cochée."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI6="Si une suppression antérieure était incomplète, une nouvelle exécution exige la case « Avant de relancer la suppression, j'ai vérifié la résolution du nettoyage partiel précédent »."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI7="Deux opérations de suppression ou de clôture de la même demande ne s'exécutent jamais en même temps. La seconde est refusée avec un message."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI8="Si Joomla trouve un compte utilisateur dont l'adresse ne correspond pas exactement à la demande, p. ex. muller@ pour müller@, le plugin refuse la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_NOTE1="Tant que le plugin est désactivé, ces verrous ne s'appliquent pas. Ne traitez et ne clôturez alors pas les demandes issues de cette page."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_TITLE="Autorisations"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI1="Le plugin n'a pas d'autorisations propres. Il utilise celles du composant Confidentialité de Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI2="Les cases de vérification, l'avertissement d'envoi et les verrous s'appliquent aux comptes disposant de l'autorisation « Configurer les ACL et les options » (core.admin) dans le composant Confidentialité. Pour qu'un autre compte puisse traiter les demandes, accordez cette autorisation à son groupe dans les options du composant Confidentialité, onglet « Permissions »."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI3="La page publique ne nécessite ni connexion ni autorisation."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_TITLE="Données et conservation"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI1="La demande elle-même, avec l'adresse e-mail, est enregistrée dans les demandes de confidentialité de Joomla. Les trois tables auxiliaires ne contiennent que des numéros de demande, l'état d'envoi, le résultat de la vérification et des compteurs avec empreintes (HMAC), aucune adresse."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI2="Le code n'est enregistré que sous forme de hachage et reste valable 24 heures. Les compteurs d'une fenêtre de 15 minutes expirée sont supprimés lors de demandes ultérieures."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI3="Aucune tâche planifiée de conservation n'existe. Les lignes des tables auxiliaires restent jusqu'à la désinstallation du plugin. Intégrez-les, ainsi que les enregistrements de demandes de Joomla, à votre politique de conservation."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI4="Aucune donnée n'est envoyée à des services externes. Seule la vérification des mises à jour de Joomla contacte GitHub, qui apprend l'adresse IP publique du serveur."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_TITLE="Interaction avec J2Commerce et la prise de rendez-vous"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI1="Les deux sont facultatifs. Le plugin n'a besoin ni de J2Commerce ni de la prise de rendez-vous (com_appointments)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI2="Avec « Privacy - J2Commerce Confidentialité », Joomla traite aussi lors de la suppression les commandes et adresses d'invités portant l'adresse de la demande. Les délais de conservation de la boutique s'y appliquent."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI3="La page de confirmation du plugin de boutique pour les demandes créées par l'administration reste inchangée. Ce plugin utilise un autre modèle d'e-mail et sa propre page. Il ne modifie pas les liens déjà envoyés par la boutique."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI4="Avec la prise de rendez-vous, son plugin de confidentialité traite les réservations de l'adresse. Un motif juridique saisi à cet endroit peut bloquer la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI5="Si un plugin signale un avertissement lors de la suppression, p. ex. des données de newsletter non supprimées, la clôture reste bloquée jusqu'à ce qu'une nouvelle exécution passe sans avertissement."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI6="Joomla ne couvre pas les données contenues dans les e-mails, calendriers, sauvegardes ou systèmes externes. Vérifiez-les séparément."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI1="<strong>La page indique que le service n'est pas disponible :</strong> l'envoi d'e-mails est désactivé, la base de données signale une erreur ou la clé secrète du site manque. Les détails figurent dans le journal sous la catégorie <code>plg_system_privacyrequests</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI2="<strong>Aucun code n'arrive :</strong> vérifiez l'envoi d'e-mails. Si l'envoi échoue, la demande reste en attente, elle affiche un avertissement avec le lien de contact et les super utilisateurs reçoivent un message. Une fois le problème corrigé, la personne demande un nouveau code sur la page. Ne remplacez pas l'adresse par une autre et ne modifiez pas le statut manuellement."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI3="<strong>L'adresse est refusée :</strong> elle contient des trémas ou d'autres caractères spéciaux. La personne utilise une autre adresse ou le chemin de contact."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI4="<strong>La clôture est bloquée :</strong> exécutez d'abord la suppression avec succès et sans avertissement, puis cochez la case de vérification."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI5="<strong>Message indiquant qu'une autre opération est en cours :</strong> attendez la fin de l'autre opération et réessayez."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI6="<strong>Suppression refusée à cause de l'adresse :</strong> Joomla a trouvé un compte avec une adresse différente. Clarifiez l'adresse avant de supprimer des données."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI7="<strong>Désinstallation :</strong> elle supprime les trois tables auxiliaires <code>#__privacy_guest_subjects</code>, <code>#__privacy_guest_attempts</code> et <code>#__privacy_guest_outcomes</code>. Les demandes et le journal d'actions de Joomla restent. Clôturez d'abord les demandes ouvertes issues de cette page."
