PLG_TASK_DMARCREPORTS="Task - DMARC Reports Ingestion"
PLG_TASK_DMARCREPORTS_XML_DESCRIPTION="Geplante Aufgabe, die DMARC- und TLS-RPT-Berichte aus den konfigurierten IMAP-Postfächern abruft und importiert."
PLG_TASK_DMARCREPORTS_TASK_INGEST_TITLE="DMARC Reports - Automatischer Import"
PLG_TASK_DMARCREPORTS_TASK_INGEST_DESC="Ruft jede aktive IMAP-Quelle ab, verarbeitet die gefundenen DMARC- und TLS-RPT-Berichte und speichert sie, damit das Dashboard ohne manuellen Import aktuell bleibt."
PLG_TASK_DMARCREPORTS_AUTO_CREATE_DOMAINS_LABEL="Domains automatisch anlegen"
PLG_TASK_DMARCREPORTS_AUTO_CREATE_DOMAINS_DESC="Legt eine Domain automatisch an, wenn ein Bericht für eine noch nicht erfasste Domain eintrifft. Wirkt nur, wenn in den Optionen der Komponente DMARC Reports zusätzlich «Automatische Domain-Anlage durch geplante Aufgaben erlauben» aktiviert ist. Ausgeschaltet lassen, um nur Berichte für bestehende Domains zu importieren."
PLG_TASK_DMARCREPORTS_ENABLE_HINT="Das Plugin ist deaktiviert. Aktivieren Sie es unter <strong>System → Verwalten → Plugins</strong> (suchen Sie nach <strong>Task - DMARC Reports Ingestion</strong>), damit die geplante Erfassung laufen kann."
PLG_TASK_DMARCREPORTS_POSTINSTALL_INTRO="Das Plugin zur DMARC-Berichtserfassung ist installiert und aktiviert. Legen Sie unter <strong>System → Geplante Aufgaben</strong> eine Aufgabe vom Typ <strong>DMARC Reports - Automatischer Import</strong> an, damit Berichte automatisch abgerufen werden."
