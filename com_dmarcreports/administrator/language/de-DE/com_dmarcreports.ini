COM_DMARCREPORTS_CONFIG_MTASTS_MX_DESC="Ein MX-Host-Muster pro Zeile, z.B. mail.example.com oder *.example.com (genau ein Platzhalter-Label). Diese gemeinsame Richtlinie muss die tatsächlichen empfangenden MX-Hosts aller überwachten Domains mit MTA-STS abdecken. Aktivieren Sie die Diagnose und prüfen Sie die Abdeckung vor Enforce."
COM_DMARCREPORTS_CONFIG_MTASTS_MAX_AGE_LABEL="Max. Alter (Sekunden)"
COM_DMARCREPORTS_CONFIG_MTASTS_MAX_AGE_DESC="Wie lange Absender die Richtlinie zwischenspeichern dürfen. 604800 (eine Woche) ist üblich. Erhöhen Sie den Wert erst, wenn die Richtlinie stabil ist."
COM_DMARCREPORTS_CONFIG_TLSRPT_ENABLE_LABEL="TLS-RPT-Berichte aktivieren"
COM_DMARCREPORTS_CONFIG_TLSRPT_ENABLE_DESC="Erzeugt und überwacht den _smtp._tls-TXT-Eintrag, damit Absender TLS-Zustellprobleme melden - unabhängig vom MTA-STS-Policy-Hosting."
COM_DMARCREPORTS_CONFIG_TLSRPT_RUA_LABEL="TLS-RPT-Berichtsadresse"
COM_DMARCREPORTS_CONFIG_TLSRPT_RUA_DESC="Wohin TLS-RPT-Berichte gesendet werden, z.B. tlsrpt@example.com oder mailto:tlsrpt@example.com. Dient zur Erzeugung des _smtp._tls-TXT-Eintrags."

; Installer messages
COM_DMARCREPORTS_INSTALL_LEGACY_MANIFEST="Die veraltete Manifestdatei %s konnte nicht entfernt werden. Bitte löschen Sie sie im Komponentenordner, damit die Datenbankprüfung von Joomla die Komponente richtig erkennt."
COM_DMARCREPORTS_POSTINSTALL_TITLE="Vielen Dank für die Installation von DMARC Reports"
COM_DMARCREPORTS_POSTINSTALL_DESC="Fügen Sie die zu überwachenden Domains hinzu, konfigurieren Sie ein Postfach, das DMARC-Aggregatberichte empfängt, und öffnen Sie dann die Übersicht, um zu sehen, was Ihre Aufmerksamkeit erfordert."
COM_DMARCREPORTS_POSTINSTALL_DOCS="Beginnen Sie auf der Domain-Seite, fügen Sie eine Berichtsquelle hinzu und führen Sie Ihren ersten Import aus."
COM_DMARCREPORTS_POSTINSTALL_UPDATED="DMARC Reports wurde auf Version %s aktualisiert."

; Hilfeseite
COM_DMARCREPORTS_HELP_TITLE="Hilfe und Tipps"
COM_DMARCREPORTS_HELP_INTRO="DMARC Reports liest die Berichte, die andere Mailserver über Ihre Domains senden, und zeigt Ihnen, ob Ihre E-Mails sauber authentifiziert sind und was als Nächstes zu tun ist. Alles läuft auf Ihrem eigenen Server."
COM_DMARCREPORTS_HELP_CONTENTS="Inhalt"
COM_DMARCREPORTS_HELP_OPEN_OPTIONS="Optionen öffnen"
COM_DMARCREPORTS_HELP_BASICS_TITLE="Die Begriffe in zwei Sätzen"
COM_DMARCREPORTS_HELP_BASICS_DMARC="DMARC ist ein DNS-Eintrag, der empfangenden Mailservern sagt, was sie mit E-Mails tun sollen, die angeblich von Ihrer Domain stammen, aber weder SPF noch DKIM für sie bestehen: nur beobachten (p=none), in den Spam legen (p=quarantine) oder abweisen (p=reject). Zusätzlich bittet er die Empfänger, Ihnen täglich einen Sammelbericht (rua) zu schicken, und genau diese Berichte wertet die Erweiterung aus."
COM_DMARCREPORTS_HELP_BASICS_SPF="SPF ist ein DNS-Eintrag, der die Server aufzählt, die E-Mails für Ihre Domain versenden dürfen. Für DMARC zählt SPF nur, wenn die geprüfte Absenderdomain des Umschlags zur sichtbaren Absenderadresse passt, das nennt man ausgerichtet."
COM_DMARCREPORTS_HELP_BASICS_DKIM="DKIM versieht jede ausgehende E-Mail mit einer digitalen Signatur, die Empfänger mit einem öffentlichen Schlüssel aus Ihrem DNS prüfen. Weil die Signatur auch eine Weiterleitung übersteht, ist eine ausgerichtete DKIM-Signatur der zuverlässigste Weg, DMARC zu bestehen."
COM_DMARCREPORTS_HELP_BASICS_MTASTS="MTA-STS teilt anderen Mailservern mit, dass sie E-Mails an Ihre Domain nur verschlüsselt (TLS) und nur an Ihre echten Mailserver mit gültigem Zertifikat zustellen dürfen. Dazu gehören ein TXT-Eintrag _mta-sts und eine kleine Richtliniendatei unter https://mta-sts.example.org/.well-known/mta-sts.txt (mit Ihrer Domain statt example.org)."
COM_DMARCREPORTS_HELP_BASICS_TLSRPT="TLS-RPT ist ein TXT-Eintrag _smtp._tls, mit dem Sie andere Mailserver bitten, Ihnen täglich zu melden, ob die verschlüsselte Zustellung an Ihre Domain geklappt hat. So sehen Sie Zertifikats- oder Verschlüsselungsprobleme, bevor Sie MTA-STS verschärfen."
COM_DMARCREPORTS_HELP_HOW_TITLE="So arbeitet die Erweiterung"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TITLE="Domains und Berichtsquellen"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TEXT="Unter Domains erfassen Sie jede Domain, die Sie überwachen, mit ihrer Zielrichtlinie. Unter Berichtsquellen hinterlegen Sie das IMAP-Postfach, auf das die rua-Adresse Ihres DMARC-Eintrags zeigt. Das Passwort wird verschlüsselt gespeichert. Ordnen Sie die Quelle einer veröffentlichten Domain zu, damit die geplante Aufgabe sie abruft."
COM_DMARCREPORTS_HELP_HOW_IMPORT_TITLE="Berichte importieren"
COM_DMARCREPORTS_HELP_HOW_IMPORT_TEXT="Berichte kommen auf drei Wegen herein: mit «Import ausführen» in der Liste der Berichtsquellen, durch Hochladen einer Berichtsdatei unten auf derselben Seite oder automatisch über die geplante Aufgabe «DMARC Reports - Automatischer Import» (System, Geplante Aufgaben). Joomla führt die Aufgabe nur aus, wenn etwas sie auslöst: der Lazy Scheduler bei normalen Seitenaufrufen oder ein Cronjob. Doppelte Berichte werden erkannt und nur einmal gespeichert. DMARC-Berichte (XML) und TLS-RPT-Berichte (JSON) dürfen im selben Postfach eintreffen."
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TITLE="Die Zahlen der Übersicht"
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TEXT="«Gemeldete Nachrichten» ist die Summe aller E-Mails mit Ihrer Domain als Absender, über die Empfänger berichtet haben. Die «DMARC-Erfolgsquote» ist der Anteil davon, der DKIM oder SPF ausgerichtet bestanden hat. «Würde unter p=reject abgewiesen» zählt die Nachrichten, die keines von beiden bestanden haben und unter p=reject abgewiesen würden. Diese Zahlen umfassen alle gespeicherten Berichte. Das Aktionszentrum bewertet dagegen die sieben Tage bis zum neuesten Bericht, damit ein alter, längst behobener Fehler den nächsten Schritt nicht blockiert."
COM_DMARCREPORTS_HELP_HOW_DETAIL_TITLE="Domainansicht"
COM_DMARCREPORTS_HELP_HOW_DETAIL_TEXT="Ein Klick auf eine Domain in der Übersicht öffnet ihre Detailansicht mit den Versandquellen (IP-Adresse mit Servername, DKIM- und SPF-Zahlen, fehlgeschlagenen Nachrichten, Beurteilung und letztem Bericht), dem Zeitverlauf, den TLS-RPT-Ergebnissen, den MTA-STS-Einträgen und einem CSV-Export. Ist die DNS-Diagnose eingeschaltet, fragen nur diese Ansicht und die Systemprüfung DNS live ab: die veröffentlichten Einträge und die Servernamen der Quellen."
COM_DMARCREPORTS_HELP_HOW_JUDGE_TITLE="Wie Versandquellen beurteilt werden"
COM_DMARCREPORTS_HELP_HOW_JUDGE_TEXT="Die Komponente beurteilt jede sendende IP-Adresse selbst anhand der DKIM- und SPF-Ergebnisse in den Berichten, Sie müssen nichts Technisches prüfen. Eine Quelle, deren E-Mails eine ausgerichtete DKIM-Signatur tragen, wird automatisch bestätigt und erzeugt keinen Eintrag: Diese Signatur kann nur der private Schlüssel Ihrer Domain erstellen. Eine Quelle, deren E-Mails DMARC nur über SPF bestanden haben, erhält einen dringenden Eintrag. SPF sagt nur, dass der Server in Ihrem SPF-Eintrag steht. Viele Hosting-Anbieter lassen Sie ihre gemeinsamen Mailserver aufnehmen (z.B. mit include:), und diese Server senden für alle Kunden des Anbieters. Ein anderer Kunde könnte so SPF mit Ihrer Domain bestehen. Nur DKIM unterscheidet Ihre E-Mails von seinen. Eine Quelle, deren E-Mails DMARC nicht bestanden haben und von den Empfängern abgewiesen oder in Quarantäne gestellt wurden, braucht nichts von Ihnen, weil Ihre Richtlinie wirkt. Sie erscheint nur in der Statistik. Wurden fehlgeschlagene E-Mails trotzdem zugestellt, etwa bei p=none, erklärt ein Hinweis, was zu tun ist. Mit eingeschalteter DNS-Diagnose zeigt die Domainansicht zu jeder Adresse auch den Servernamen (Rückwärtsauflösung, vorwärts bestätigt), nur zur Information. Die Namen werden zwischengespeichert und neue Abfragen verwenden eine best-effort Prüfung der verstrichenen Zeit, kein garantiertes Auflösungs-Timeout. Ohne DNS funktioniert die Beurteilung genauso."
COM_DMARCREPORTS_HELP_HOW_MODULE_TITLE="Modul im Kontrollzentrum"
COM_DMARCREPORTS_HELP_HOW_MODULE_TEXT="Das Modul «DMARC Reports Dashboard» zeigt die Zusammenfassung und die wichtigsten Einträge des Aktionszentrums auf der Startseite der Administration. Es rechnet nichts selbst und zeigt dieselben Daten wie die Übersicht der Komponente. In seinen Optionen legen Sie fest, ob die Zusammenfassung erscheint und wie viele Einträge angezeigt werden."
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TITLE="MTA-STS-System-Plugin"
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TEXT="Das Plugin «System - DMARC MTA-STS Policy» liefert die MTA-STS-Richtliniendatei unter /.well-known/mta-sts.txt aus, erzeugt aus den Optionen der Komponente. Ändern Sie Modus oder MX-Hosts in den Optionen, ändert sich die ausgelieferte Datei mit. Den Host mta-sts mit gültigem Zertifikat und die DNS-Einträge richten Sie selbst ein. Die Komponente schreibt nie ins DNS."
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TITLE="Datenschutz"
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TEXT="Alle Berichte bleiben in Ihrer Joomla-Datenbank, es gibt keinen externen Dienst. Nur wenn Sie die DNS-Diagnose einschalten, fragt der Server DNS-Einträge Ihrer Domains ab und ruft die MTA-STS-Richtlinie per HTTPS ab. Berichtsinhalte verlassen den Server nie."
COM_DMARCREPORTS_HELP_ACTIONS_TITLE="Das Aktionszentrum"
COM_DMARCREPORTS_HELP_ACTIONS_INTRO="Das Aktionszentrum berechnet bei jedem Aufruf aus den gespeicherten Berichten und den Optionen, was Sie als Nächstes tun sollten, das Wichtigste zuerst. Gespeichert wird nur, wie Sie einen Eintrag behandelt haben. Ändern sich die Daten, verschwindet ein Eintrag von selbst oder ein neuer kommt dazu. Die Farbe zeigt die Dringlichkeit:"
COM_DMARCREPORTS_HELP_SEVERITY_3="Etwas lässt Ihre Domain ungeschützt, oder ein Schritt ist jetzt fällig."
COM_DMARCREPORTS_HELP_SEVERITY_2="Planen Sie die Behebung in den nächsten Tagen ein."
COM_DMARCREPORTS_HELP_SEVERITY_1="Prüfen Sie den Hinweis bei Gelegenheit."
COM_DMARCREPORTS_HELP_SEVERITY_0="Nur zur Information, nichts zu tun."
COM_DMARCREPORTS_HELP_ACTIONS_STATUS="«Als erledigt markieren» und «Ignorieren» blenden einen Eintrag aus, bis Sie ihn wieder öffnen. Nutzen Sie «Als erledigt markieren», wenn Sie die Ursache behoben haben, und «Ignorieren», wenn der Hinweis für Sie nicht zutrifft. «Zurückstellen» blendet ihn für sieben Tage aus. Alle ausgeblendeten Einträge stehen unter «Erledigte Aktionen», wo «Erneut öffnen» sie zurückholt. Ein Eintrag, dessen Ursache weg ist, verschwindet auch ohne Markierung."
COM_DMARCREPORTS_HELP_ACTIONS_VIEWS="Die Übersicht und das Modul im Kontrollzentrum fragen nie etwas im DNS ab, damit sie schnell bleiben. Die Prüfung der veröffentlichten DNS-Einträge (DMARC, SPF, MTA-STS, TLS-RPT, MX) erscheint nur in der Domainansicht und in der Systemprüfung, und nur bei eingeschalteter DNS-Diagnose. Ist sie ausgeschaltet, zeigt die Übersicht stattdessen die zu veröffentlichenden MTA-STS- und TLS-RPT-Einträge, weil sie nicht feststellen kann, ob es sie schon gibt. Die Richtlinie (p=none, quarantine, reject) liest das Aktionszentrum aus dem neuesten Bericht. Nach einer Änderung im DNS dauert es deshalb ein bis zwei Tage, bis die Empfehlung nachzieht."
COM_DMARCREPORTS_HELP_GROUP_POLICY="DMARC-Richtlinie und Einführung"
COM_DMARCREPORTS_HELP_GROUP_SOURCES="Versandquellen"
COM_DMARCREPORTS_HELP_ACTION_SPF_ONLY_SOURCE="Von dieser IP-Adresse kamen in den letzten sieben Tagen E-Mails mit Ihrer Domain als Absender, die DMARC nur über SPF bestanden haben, ohne die DKIM-Signatur Ihrer Domain. SPF zeigt nur, dass Ihr SPF-Eintrag den Server erlaubt, und die gemeinsamen Mailserver eines Anbieters sind für alle seine Kunden erlaubt. Es kann also ein anderer Kunde sein, der Ihre Domain verwendet. Ist es ein eigener Dienst (der Servername in der Domainansicht hilft dabei), schalten Sie dort die DKIM-Signatur für Ihre Domain ein, dann verschwindet der Eintrag von selbst. Wenn nicht, stellen Sie sicher, dass Ihre eigenen E-Mails mit DKIM signiert sind, und entfernen Sie dann den Teil Ihres SPF-Eintrags, der diesen Server erlaubt, oder verlangen Sie vom Anbieter, dass andere Kunden nicht mit Ihrer Domain senden können."
COM_DMARCREPORTS_HELP_GROUP_DNS="DNS-Einträge (nur mit DNS-Diagnose)"
COM_DMARCREPORTS_HELP_GROUP_MTASTS="MTA-STS und TLS-RPT"
COM_DMARCREPORTS_HELP_ACTION_NO_DATA="Für diese Domain ist noch kein DMARC-Bericht gespeichert. Prüfen Sie, ob Ihr DMARC-Eintrag eine rua-Adresse enthält, ob dieses Postfach als Berichtsquelle hinterlegt ist und ob der Import läuft. Die ersten Berichte treffen meist ein bis zwei Tage nach dem Veröffentlichen ein."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_NONE="Die Domain steht auf p=none, und zu wenige E-Mails bestehen DMARC, um sicher auf quarantine zu wechseln (Schwelle in den Optionen, Standard 95). Bringen Sie zuerst die fehlschlagenden Absender in Ordnung, siehe «Eine Versandquelle ausrichten»."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_QUARANTINE="Die Domain steht auf p=none, und in den letzten sieben Tagen haben genug E-Mails DMARC bestanden. Ändern Sie im DNS-Eintrag _dmarc Ihrer Domain p=none in p=quarantine. Prüfen Sie vorher, ob unter den fehlschlagenden Quellen noch ein legitimer Absender ist, z.B. ein Newsletter-Dienst."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_QUARANTINE="Die Domain steht auf p=quarantine, aber noch nicht genug E-Mails bestehen DMARC für p=reject (Schwelle in den Optionen, Standard 99). Beheben Sie die verbleibenden Fehlschläge, bevor Sie verschärfen."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_REJECT="Die Domain steht auf p=quarantine, und in den letzten sieben Tagen haben genug E-Mails DMARC bestanden. Ändern Sie im DNS-Eintrag p=quarantine in p=reject, und sp ebenso, falls Ihr Eintrag sp enthält. Haben Sie das schon getan, verschwindet der Eintrag, sobald der erste Bericht mit der neuen Richtlinie importiert ist."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_QUARANTINE="Der DMARC-Eintrag hat p=quarantine mit pct unter 100, die Richtlinie gilt also nur für einen Teil der E-Mails. Erhöhen Sie pct auf 100 oder entfernen Sie pct, bevor Sie zu p=reject wechseln."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_ENFORCEMENT="Der DMARC-Eintrag hat p=reject mit pct unter 100. Nur dieser Anteil wird abgewiesen, der Rest höchstens in den Spam gelegt. Erhöhen Sie pct auf 100 oder entfernen Sie pct."
COM_DMARCREPORTS_HELP_ACTION_AT_TARGET="Die Domain hat die Zielrichtlinie erreicht, die Sie bei der Domain festgelegt haben. Es ist nichts zu tun. Wollen Sie weiter verschärfen, erhöhen Sie die Zielrichtlinie der Domain."
COM_DMARCREPORTS_HELP_ACTION_ENFORCED="Die Domain steht auf p=reject für alle E-Mails. Gefälschte E-Mails mit Ihrer Domain werden abgewiesen. Es ist nichts zu tun, behalten Sie neue Versandquellen im Auge."
COM_DMARCREPORTS_HELP_ACTION_WOULD_BE_REJECTED="So viele E-Mails der letzten sieben Tage haben weder DKIM noch SPF ausgerichtet bestanden und würden unter p=reject abgewiesen. Ab einem Anteil von 2 Prozent ist der Eintrag rot. Sehen Sie in der Domainansicht nach, von welchen IP-Adressen sie stammen. Sind es eigene Absender, richten Sie diese aus. Sind es Fälschungen, ist das genau, was DMARC verhindern soll."
COM_DMARCREPORTS_HELP_ACTION_ALIGN_SOURCE="Von dieser IP-Adresse kamen in den letzten sieben Tagen E-Mails mit Ihrer Domain als Absender, die DMARC nicht bestanden haben (weder DKIM noch SPF ausgerichtet) und trotzdem zugestellt wurden, weil die Richtlinie p=none ist, nur für einen Teil der E-Mails gilt (pct unter 100) oder ein Empfänger eine Ausnahme gemacht hat. Ist es ein Dienst, den Sie nutzen, etwa ein Newsletter-, Shop- oder Ticketsystem, schalten Sie dort die DKIM-Signatur für Ihre Domain ein. Ziehen Sie DKIM der Aufnahme in SPF vor, weil SPF allein kein Beweis ist (siehe «Wie Versandquellen beurteilt werden»). Ist es kein eigener Dienst, sind die E-Mails gefälscht oder weitergeleitet. Eine strengere Richtlinie hält gefälschte E-Mails auf, und der Eintrag zur Richtlinie sagt Ihnen, wann dieser Schritt sicher ist. Auch eine Mailingliste oder die Weiterleitung eines Empfängers, die die Nachricht verändert, kann legitime E-Mails fehlschlagen lassen. Prüfen Sie darum, wie viele E-Mails es betrifft, bevor Sie verschärfen. Fehlgeschlagene E-Mails, die die Empfänger abgewiesen oder in Quarantäne gestellt haben, erscheinen hier nicht, weil die Richtlinie bereits wirkt."
COM_DMARCREPORTS_HELP_ACTION_PASS_RATE_DROP="Die Erfolgsquote der letzten sieben Tage liegt mehr als 5 Punkte unter der Woche davor. Meist hat ein eigener Dienst seine Signatur verloren oder ein neuer Dienst sendet ohne Authentifizierung. Sehen Sie in der Domainansicht nach, welche Quelle neu fehlschlägt, bevor Sie die Richtlinie verschärfen."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_MISSING="Unter _dmarc der Domain wurde kein DMARC-Eintrag gefunden. Veröffentlichen Sie einen TXT-Eintrag, zum Beginn z.B. v=DMARC1; p=none; rua=mailto:dmarc@example.org (mit Ihrer Berichtsadresse). Ohne ihn gibt es weder Schutz noch Berichte."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_SUBDOMAIN_CHECK="Die überwachte Domain ist eine Subdomain ohne eigenen DMARC-Eintrag. Das ist normal, denn für sie gilt die Richtlinie der übergeordneten Domain (deren Wert sp, sonst p). Prüfen Sie nur, ob die übergeordnete Domain einen DMARC-Eintrag hat."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_DUPLICATE="Es gibt mehr als einen DMARC-Eintrag. Empfänger ignorieren dann alle, und Ihre Domain ist ungeschützt. Löschen Sie die überzähligen TXT-Einträge unter _dmarc, sodass genau einer übrig bleibt."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_INVALID="Der DMARC-Eintrag ist fehlerhaft: p muss none, quarantine oder reject sein und pct eine ganze Zahl von 0 bis 100. Korrigieren Sie den Eintrag, sonst wenden ihn Empfänger nicht an."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_POLICY_NONE="Der veröffentlichte DMARC-Eintrag steht auf p=none. Er sammelt nur Berichte und schützt noch nicht. Folgen Sie den Empfehlungen zur Einführung, um auf quarantine und reject zu wechseln."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_NO_RUA="Dem DMARC-Eintrag fehlt die rua-Adresse, also schickt Ihnen niemand Berichte. Ergänzen Sie rua=mailto: mit Ihrer Berichtsadresse und hinterlegen Sie dieses Postfach als Berichtsquelle."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_PCT="Der DMARC-Eintrag wendet die Richtlinie nur auf einen Teil der E-Mails an (pct unter 100). Erhöhen Sie pct auf 100, sobald die Berichte sauber sind."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_MISSING="Es gibt keinen SPF-Eintrag. Das ist nicht zwingend ein Problem, solange Ihre E-Mails DKIM-signiert sind. Ein SPF-Eintrag mit Ihren Versandservern ist trotzdem empfehlenswert, den passenden Wert nennt Ihr Mailanbieter."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_DUPLICATE="Es gibt mehr als einen SPF-Eintrag. Das ist ungültig und lässt SPF bei Empfängern fehlschlagen. Fassen Sie alle zu einem einzigen v=spf1-Eintrag zusammen."
COM_DMARCREPORTS_HELP_ACTION_DNS_LOOKUP_ERROR="Die DNS-Abfrage ist fehlgeschlagen, daher konnte nichts geprüft werden. Das ist meist vorübergehend. Laden Sie die Seite später neu. Bleibt der Fehler, klären Sie den DNS-Resolver des Servers mit Ihrem Hoster."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_NO_MX="MTA-STS ist eingeschaltet, aber in den Optionen ist kein MX-Host eingetragen, deshalb kann keine Richtlinie entstehen. Tragen Sie unter Optionen, MTA-STS Ihre empfangenden Mailserver ein, einen pro Zeile, so wie sie im MX-Eintrag Ihrer Domain stehen."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_PUBLISH="Zeigt den TXT-Eintrag _mta-sts und die Adresse der Richtliniendatei, die Sie veröffentlichen müssen. Bei ausgeschalteter DNS-Diagnose zeigt die Übersicht ihn immer, auch wenn schon alles veröffentlicht ist, weil sie es nicht prüfen kann. Bei eingeschalteter DNS-Diagnose prüfen Domainansicht und Systemprüfung live und melden ihn nur, wenn der Eintrag wirklich fehlt, und die Übersicht zeigt ihn nicht mehr."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_LOOKUP_ERROR="Die DNS-Abfrage des _mta-sts-Eintrags ist fehlgeschlagen. Das ist meist vorübergehend, versuchen Sie es später erneut."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_RECORD_DRIFT="Die ID im veröffentlichten _mta-sts-Eintrag passt nicht zur aktuellen Richtlinie. Das passiert, nachdem Sie Modus, MX-Hosts oder Max. Alter geändert haben. Ersetzen Sie den TXT-Eintrag durch den angezeigten Wert, damit sendende Server die neue Richtlinie laden."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_UNREACHABLE="Die Richtliniendatei unter https://mta-sts.example.org/.well-known/mta-sts.txt (mit Ihrer Domain) ist nicht erreichbar. Prüfen Sie, ob der Host mta-sts im DNS auf Ihren Webserver zeigt und ein gültiges Zertifikat hat, ob das System-Plugin aktiviert ist und ob der Webserver den Pfad an Joomla weitergibt (Anleitung im README des Plugins)."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_DRIFT="Die ausgelieferte Richtliniendatei weicht von den Optionen ab, z.B. weil eine alte statische Datei statt des Plugins antwortet. Entfernen Sie die statische Datei und aktivieren Sie das System-Plugin."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_LOOKUP_ERROR="Die Abfrage der MX-Einträge Ihrer Domain ist fehlgeschlagen, daher ist nicht bestätigt, dass die Richtlinie alle Mailserver abdeckt. Wiederholen Sie die Prüfung, bevor Sie auf Enforce umstellen."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_NO_ANSWER="Für die Domain gibt es keinen verwendbaren MX-Eintrag. Empfängt sie keine E-Mails, braucht sie kein MTA-STS. Andernfalls prüfen Sie die MX-Einträge bei Ihrem DNS-Anbieter."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_UNCOVERED="Mindestens ein MX-Server Ihrer Domain steht nicht in der MTA-STS-Richtlinie. Im Modus Enforce würden sendende Server die Zustellung an ihn verweigern. Ergänzen Sie die genannten Hosts unter Optionen, MTA-STS und veröffentlichen Sie danach die neue ID."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MODE_TESTING="Eintrag, Richtliniendatei und MX-Abdeckung stimmen, aber die Richtlinie steht noch auf Testing. In diesem Modus melden sendende Server Probleme nur per TLS-RPT und stellen trotzdem zu. Sammeln Sie ein bis zwei Wochen TLS-RPT-Berichte. Zeigen sie keine Fehler und ist das Zertifikat Ihres Mailservers gültig und wird rechtzeitig erneuert, stellen Sie unter Optionen, MTA-STS auf Enforce um und veröffentlichen die neue ID."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_PUBLISH="Zeigt den TXT-Eintrag _smtp._tls, den Sie veröffentlichen müssen, damit TLS-Berichte eintreffen. Wie bei MTA-STS zeigt die Übersicht ihn bei ausgeschalteter DNS-Diagnose immer. Bei eingeschalteter DNS-Diagnose meldet ihn die Domainansicht nur, wenn der Eintrag fehlt oder auf eine andere Adresse zeigt."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_MISSING_RUA="TLS-RPT ist eingeschaltet, aber es ist keine gültige Berichtsadresse eingetragen. Tragen Sie unter Optionen, MTA-STS eine Adresse ein, z.B. mailto:dmarc@example.org. Am einfachsten nehmen Sie dasselbe Postfach wie für DMARC."
COM_DMARCREPORTS_HELP_TASKS_TITLE="Typische Aufgaben"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_TITLE="Ein Berichtspostfach einrichten"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_1="Legen Sie ein eigenes Postfach nur für Berichte an, z.B. dmarc@example.org, und tragen Sie es im DMARC-Eintrag als rua=mailto:dmarc@example.org ein."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_2="Erfassen Sie unter Domains Ihre Domain und wählen Sie die Zielrichtlinie, in der Regel «Abweisen»."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_3="Legen Sie unter Berichtsquellen eine Quelle an mit IMAP-Server, Port 993 mit SSL/TLS, Benutzername, Passwort und Ordner INBOX, und ordnen Sie sie der Domain zu. «Import ausführen» testet die Verbindung sofort."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_4="Legen Sie unter System, Geplante Aufgaben eine Aufgabe vom Typ «DMARC Reports - Automatischer Import» an, z.B. stündlich, damit neue Berichte von selbst hereinkommen."
COM_DMARCREPORTS_HELP_TASK_FAILING_TITLE="Eine fehlschlagende Quelle verstehen"
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_1="Folgen Sie im Aktionszentrum dem Link «Diese Quelle anzeigen» oder öffnen Sie die Domain in der Übersicht, um die Adresse unter «Versandquellen» zu finden."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_2="Der Servername unter der Adresse zeigt, wer sie betreibt (mit eingeschalteter DNS-Diagnose), und die Beurteilung sagt, ob Sie handeln müssen. Werkzeuge zum Nachschlagen brauchen Sie keine."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_3="Ist es ein Dienst, den Sie nutzen, richten Sie dort die DKIM-Signatur für Ihre Domain ein. Die Anleitung dazu liefert der Dienst. Nehmen Sie einen Server nur in den SPF-Eintrag auf, wenn er allein für Sie sendet, nie die gemeinsamen Server eines Anbieters als einzigen Nachweis."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_4="Ist es ein fremder Server, ist die E-Mail entweder gefälscht oder weitergeleitet. Gegen Fälschungen hilft genau die strengere DMARC-Richtlinie. Weiterleitungen über eine Mailingliste oder durch einen Empfänger können legitime E-Mails fehlschlagen lassen: Prüfen Sie, wie viele E-Mails es betrifft und ob diese Empfänger wichtig sind, bevor Sie auf quarantine oder reject wechseln."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_TITLE="Von p=none zu quarantine und reject"
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_1="Beginnen Sie mit p=none und sammeln Sie mindestens zwei Wochen Berichte, damit alle Absender sichtbar werden, auch seltene wie Rechnungsversand oder Newsletter."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_2="Richten Sie jeden eigenen Absender aus, bis das Aktionszentrum «Auf p=quarantine wechseln» empfiehlt. Ändern Sie dann p=none in p=quarantine."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_3="Beobachten Sie weitere ein bis zwei Wochen. Empfiehlt das Aktionszentrum «Auf p=reject wechseln», ändern Sie p=quarantine in p=reject. Setzen Sie sp gleich, falls Ihr Eintrag sp enthält."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_4="Nach jeder Änderung dauert es ein bis zwei Tage, bis die ersten Berichte mit der neuen Richtlinie eintreffen. Bis dahin zeigt das Aktionszentrum noch die vorherige Empfehlung."
COM_DMARCREPORTS_HELP_TASK_MTASTS_TITLE="MTA-STS von Testing auf Enforce umstellen"
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_1="Schalten Sie unter Optionen, MTA-STS die Richtlinie und TLS-RPT ein, wählen Sie den Modus Testing und tragen Sie Ihre MX-Hosts ein."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_2="Richten Sie den Host mta-sts Ihrer Domain mit gültigem Zertifikat auf diese Joomla-Installation ein und veröffentlichen Sie die TXT-Einträge _mta-sts und _smtp._tls aus der Domainansicht."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_3="Schalten Sie die DNS-Diagnose ein. Die Domainansicht meldet «MTA-STS auf Enforce umstellen», sobald Einträge, Richtlinie und MX-Abdeckung stimmen. Warten Sie, bis ein bis zwei Wochen TLS-RPT-Berichte ohne Fehler vorliegen."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_4="Stellen Sie den Modus auf Enforce und ersetzen Sie den _mta-sts-Eintrag durch den neuen Wert mit der neuen ID. Die Richtliniendatei passt das Plugin selbst an."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_TITLE="Wenn keine Berichte mehr eintreffen"
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_1="Prüfen Sie unter Berichtsquellen die Spalte «Letzter Lauf» und führen Sie den Import von Hand aus. Eine Fehlermeldung nennt die Ursache, z.B. eine abgelehnte Anmeldung nach einem Passwortwechsel."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_2="Prüfen Sie unter System, Geplante Aufgaben, ob die Import-Aufgabe aktiv ist und kürzlich gelaufen ist, und ob das Plugin «Task - DMARC Reports Ingestion» aktiviert ist. Ohne Seitenaufrufe oder Cronjob läuft der Lazy Scheduler nicht."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_3="Schauen Sie direkt ins Postfach. Liegen dort neue Berichte, liegt das Problem beim Import. Liegt dort nichts, prüfen Sie im DNS, ob die rua-Adresse im DMARC-Eintrag noch stimmt."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_4="Eine Quelle speichert nur Berichte für ihre zugeordnete Domain und deren Subdomains. Berichte für jede andere Domain werden übersprungen, ausser «Unbekannte Domains automatisch anlegen» ist in den Optionen eingeschaltet. Für die geplante Aufgabe müssen zusätzlich «Automatische Domain-Anlage durch geplante Aufgaben erlauben» in den Optionen und «Domains automatisch anlegen» in der Aufgabe eingeschaltet sein. Angelegte Domains sind unveröffentlicht: Veröffentlichen Sie sie unter Domains, damit sie überwacht werden. Die geplante Aufgabe ruft nur Quellen ab, die einer veröffentlichten Domain zugeordnet sind."
COM_DMARCREPORTS_HELP_SETTINGS_TITLE="Wo die Einstellungen sind"
COM_DMARCREPORTS_HELP_SETTINGS_INTRO="Die Optionen der Komponente öffnen Sie in der Übersicht über die Schaltfläche «Optionen» oben rechts. Sie haben drei Registerkarten, die Zielrichtlinie stellen Sie je Domain ein."
COM_DMARCREPORTS_HELP_SETTINGS_BASIC="Standard-Zielrichtlinie für neue Domains, die Schwellen für Quarantäne (Standard 95) und Abweisung (Standard 99), Zeitlimit und Grenzen des Postfachimports, CSV-Trennzeichen, die DNS-Diagnose und das automatische Anlegen unbekannter Domains."
COM_DMARCREPORTS_HELP_SETTINGS_MTASTS="MTA-STS-Richtlinie ein oder aus, Modus (Testing oder Enforce), MX-Hosts und Max. Alter, sowie TLS-RPT ein oder aus mit der Berichtsadresse."
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS_TITLE="Berechtigungen"
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS="Wer die Komponente öffnen, Domains und Quellen anlegen und bearbeiten, Einträge des Aktionszentrums markieren (Status bearbeiten) und Berichte importieren darf (DMARC-Berichte importieren)."
COM_DMARCREPORTS_HELP_SETTINGS_DOMAIN="Die Zielrichtlinie stellen Sie je Domain unter Domains ein. Das Aktionszentrum empfiehlt nie einen Schritt über dieses Ziel hinaus."
COM_DMARCREPORTS_CONFIG_HELP_NOTE="Was diese Einstellungen bewirken und was jeder Eintrag im Aktionszentrum bedeutet, erklärt die Seite <a href='index.php?option=com_dmarcreports&amp;view=help'>Hilfe und Tipps</a>."
