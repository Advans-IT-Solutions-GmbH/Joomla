; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_PRIVACY_J2COMMERCE_HELP_NOTE="L'onglet « Aide » explique ce que fait ce plugin, comment le configurer et que faire en cas de problème."
PLG_PRIVACY_J2COMMERCE_HELP_TAB="Aide"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_TITLE="Ce que fait ce plugin"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_P1="Le plugin ajoute les données de la boutique aux fonctions de confidentialité de Joomla (composant Confidentialité, « Utilisateurs → Confidentialité → Demandes »). Il prend en charge J2Commerce 6 et J2Store 4 (J2Commerce 4)."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI1="<strong>Export :</strong> une demande d'export contient les commandes avec leurs articles, données de facturation et de livraison, les adresses enregistrées, les consentements au checkout des commandes d'invités, les consentements à la newsletter des invités (formulaire de newsletter du site et checkout) et les éventuelles données de newsletter d'AcyMailing. Avec « Inclure les données Joomla core », le compte utilisateur, le profil et le journal d'actions s'y ajoutent."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI2="<strong>Suppression :</strong> une demande de suppression efface les paniers du compte utilisateur, les données de newsletter d'AcyMailing et, selon les réglages, les adresses enregistrées. Selon les réglages, les commandes hors du délai de conservation sont anonymisées. Celles dans le délai sont conservées et signalées. Les détails figurent dans la section « Ce qui est supprimé, anonymisé et conservé »."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI3="<strong>Commandes d'invités :</strong> les commandes sans compte utilisateur sont rattachées à une demande par l'adresse e-mail de la demande ou du compte."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI4="<strong>Checkout :</strong> l'étape livraison et paiement affiche une case à cocher pour le consentement à la politique de confidentialité."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI5="<strong>Page de profil :</strong> la page de profil de la boutique (MyProfile) reçoit l'onglet « Confidentialité » avec l'état du consentement et des boutons pour les demandes. Les adresses enregistrées reçoivent un bouton de suppression."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI6="<strong>Page de confirmation :</strong> les clients sans compte utilisateur confirment sur une page de ce plugin une demande créée par l'administration."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI7="<strong>Nettoyage :</strong> une tâche planifiée anonymise régulièrement les commandes expirées, même sans demande."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI8="<strong>Notifications :</strong> sur demande, le plugin envoie des e-mails à l'administration et écrit des entrées dans le journal d'actions de Joomla."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_NOTE1="Le plugin ne remplace pas un conseil juridique. Vous fixez vous-même le délai de conservation, la politique de confidentialité et le traitement des demandes."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_TITLE="Prérequis"
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI1="Joomla 5.4 ou 6 et PHP 8.1 ou plus récent."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI2="J2Commerce 6 ou J2Store 4 (J2Commerce 4). La case du checkout sous J2Commerce 6 nécessite la version 6.3.4 ou plus récente."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI3="Le composant Confidentialité de Joomla (com_privacy) est activé."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI4="Un template de site basé sur Bootstrap 5, pour que l'onglet « Confidentialité » s'affiche correctement."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI5="Un envoi d'e-mails fonctionnel dans la configuration globale. Joomla l'utilise pour les codes de confirmation, le plugin pour ses messages."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI6="Les plugins inclus « Système - J2Commerce Consentement de confidentialité » et « Tâche - Nettoyage confidentialité J2Commerce ». L'installateur les installe avec ce plugin et les active lors de la première installation. Une mise à jour conserve leur état."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_TITLE="Configuration pas à pas"
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP1="Activez ce plugin sous « Système → Gérer → Plugins ». Vérifiez-y aussi que les deux plugins inclus sont activés."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP2="Dans l'onglet « Conservation des données », définissez la période de conservation et la fin de l'exercice et saisissez un « E-mail de support »."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP3="Sous « Menus », créez un élément de menu du type « Confidentialité → Créer une demande » avec le niveau d'accès « Enregistré ». Dans l'onglet « Type de lien », réglez « Afficher dans le menu » sur « Non ». Sans cet élément, les boutons de l'onglet « Confidentialité » ne mènent pas au formulaire de demande."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP4="Dans l'onglet « Consentement Checkout », choisissez sous « Article politique de confidentialité » l'article contenant votre politique de confidentialité."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP5="Vérifiez les overrides de template dans votre template de site (section « Overrides de template »)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP6="Sous « Système → Gérer → Tâches planifiées → Nouveau », créez une tâche du type « J2Commerce - Suppression automatique des données ». Saisissez-y les mêmes valeurs que dans ce plugin, car la tâche ne les reprend pas. Choisissez une exécution quotidienne, puis activez et enregistrez la tâche."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP7="Si vous vendez des produits avec une licence à vie, marquez ces produits (section « Licences à vie »)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP8="Testez le déroulement sur une installation de test avec des données de test, avec une demande d'export et une demande de suppression sous « Utilisateurs → Confidentialité → Demandes »."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_NOTE1="Sans déclencheur propre, Joomla ne lance les tâches planifiées que lors des visites de pages. Pour une exécution fiable, configurez une tâche cron avec <code>php cli/joomla.php scheduler:run</code> ou le web cron de Joomla."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_TITLE="Overrides de template"
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_P1="L'onglet « Confidentialité », les boutons de suppression d'adresse et, sous J2Store 4, la case du checkout sont affichés par des overrides de template. Le plugin les fournit dans le dossier <code>plugins/privacy/j2commerce/overrides</code>."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI1="Lors de la première installation, l'installateur les copie dans chaque template de site, pour <code>com_j2store</code> et <code>com_j2commerce</code>. Il n'écrase jamais les fichiers existants. Le message après l'installation liste les fichiers copiés et ignorés."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI2="Une mise à jour ajoute seulement <code>myprofile/default_privacy.php</code> là où le template contient déjà <code>myprofile/default.php</code> d'un composant de boutique installé. Tous les autres overrides restent inchangés. Comparez-les avec la version fournie après une mise à jour."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI3="J2Commerce 6 n'a pas besoin d'override pour le checkout. La case apparaît dans ses templates de checkout à partir de la version 6.3.4 via l'événement <code>AfterDisplayShippingPayment</code>. Un override de checkout personnel doit continuer à déclencher cet événement."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI4="À partir de J2Commerce 6.3.4, l'installateur renomme les overrides de checkout J2Commerce 6 inchangés des versions antérieures du plugin avec le suffixe <code>.plg_privacy_j2commerce-disabled</code>. Les copies modifiées restent et l'installateur les signale."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI5="Placez votre propre layout de l'onglet sous <code>html/layouts/plg_privacy_j2commerce/privacy_tab.php</code> dans votre template. Il a priorité sur le layout du plugin."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_TITLE="Onglet « Paramètres de confidentialité »"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI1="« Inclure les données Joomla core » (par défaut : Oui) : l'export contient en plus le compte utilisateur, les champs de profil et le journal d'actions de la personne. Cela ne vaut que pour les demandes avec compte utilisateur. Avec « Non », ce plugin ne fournit que les données de la boutique."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI2="« Anonymiser les commandes » (par défaut : Oui) : une demande de suppression anonymise les commandes hors du délai de conservation. Avec « Non », elles restent inchangées. Les commandes ne sont jamais supprimées."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI3="« Supprimer les adresses » (par défaut : Oui) : une demande de suppression efface les adresses enregistrées du compte utilisateur et les adresses d'invité portant l'adresse e-mail de la demande ou du compte. Avec « Non », elles sont conservées."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_TITLE="Onglet « Conservation des données »"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI1="« Période de conservation (années) » (par défaut : 10, de 1 à 30) : nombre d'années après la fin de l'exercice de la commande pendant lesquelles une commande est conservée intégralement. Ce nombre apparaît aussi dans l'onglet « Confidentialité » et dans les messages."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI2="« Fin de l'exercice (MM-JJ) » (par défaut : 12-31) : dernier jour de votre exercice. 02-29 signifie le dernier jour de février. Les jours inexistants comme 04-31 sont refusés à l'enregistrement. Ne modifiez la valeur que si votre exercice ne se termine pas le 31 décembre."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI3="« Base juridique » : uniquement pour la documentation interne. Les clients ne voient pas ce texte et le plugin ne l'utilise dans aucun message."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI4="« E-mail de support » (par défaut : vide) : adresse de contact pour les questions de confidentialité. Elle figure dans l'e-mail sur les commandes conservées et sert de destinataire aux liens e-mail des clients invités dans l'onglet « Confidentialité ». Si le champ est vide, l'adresse d'expéditeur de la configuration globale est utilisée. Saisissez votre propre adresse avant la mise en ligne."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_TITLE="Onglet « Consentement Checkout »"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI1="« Afficher case de consentement » (par défaut : Oui) : affiche la case à l'étape livraison et paiement. Avec « Non », aucune case n'apparaît et rien n'est vérifié ni enregistré."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI2="« Consentement requis » (par défaut : Oui) : le checkout ne continue que si la case est cochée. Sous J2Commerce 6, le plugin système le vérifie sur le serveur, aussi lors de la confirmation et de l'envoi du paiement. Sous J2Store 4, seul un script dans le navigateur le vérifie. Avec « Non », la case est facultative."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI3="« Article politique de confidentialité » (par défaut : aucun) : article vers lequel pointe le lien du texte de consentement. Sans article, J2Commerce 6 affiche le texte du lien sans lien et, sous J2Store 4, l'espace réservé <code>{privacy_policy}</code> reste visible. Choisissez donc toujours un article."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI4="« Texte de consentement » (par défaut : vide) : texte à côté de la case. <code>{privacy_policy}</code> est remplacé par le lien vers l'article. Si le champ est vide, le texte par défaut de la langue courante est utilisé. Un texte personnel s'applique à toutes les langues du site."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI5="Sous J2Commerce 6, le plugin système enregistre le consentement dans les consentements de confidentialité de Joomla dès que J2Commerce a accepté la commande, une fois par commande. Il enregistre le numéro de commande, le moment, l'adresse IP et l'agent utilisateur, sans adresse e-mail. Sous J2Store 4 et pour les commandes antérieures, il n'existe pas d'entrée de ce type."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI6="Décrivez ces données, leur finalité et leur durée de conservation dans votre politique de confidentialité."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_TITLE="Onglet « Libre-service frontend »"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI1="« Afficher boutons supprimer adresse » (par défaut : Oui) : affiche un bouton de suppression à côté de chaque adresse enregistrée dans la zone des adresses de la page de profil. Les clients connectés suppriment ainsi immédiatement leurs propres adresses. Les commandes restent inchangées."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI2="« Afficher supprimer toutes les données » (par défaut : Oui) : affiche dans l'onglet « Confidentialité » un bouton pour une demande de suppression."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI3="« Afficher export données » (par défaut : Oui) : affiche dans l'onglet « Confidentialité » un bouton pour une demande d'export."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI4="« Afficher la section confidentialité » (par défaut : Oui) : affiche l'onglet « Confidentialité » sur la page de profil. Avec « Non », l'onglet n'apparaît pas."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI5="« Confirmation par les clients invités » (par défaut : Oui) : les liens de l'e-mail Joomla concernant les demandes créées par l'administration mènent à la page de confirmation de ce plugin. Les personnes sans compte utilisateur peuvent aussi y confirmer avec leur adresse e-mail et le code. Avec « Non », l'e-mail garde les liens de Joomla, que seules les personnes connectées peuvent ouvrir. Les commandes d'invités sont de toute façon rattachées à une demande par son adresse e-mail."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI6="Dans l'onglet « Confidentialité », les deux boutons ouvrent pour les personnes connectées le formulaire de demande de Joomla, où la personne choisit le type de demande. Les clients invités avec une session de commande reçoivent à la place un lien e-mail vers l'« E-mail de support ». Si les deux boutons sont désactivés, l'onglet n'affiche que l'état du consentement."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI7="Tous les réglages de cet onglet ne s'appliquent que tant que ce plugin est activé."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_TITLE="Onglet « Notifications & Journalisation »"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI1="« Notifications Admin » (par défaut : Non) : envoie un e-mail à l'administration lorsqu'un client supprime une adresse enregistrée ou qu'une demande de suppression est exécutée. Il n'y a pas de notification pour les exports."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI2="« E-mail de l'administration » (par défaut : vide, visible seulement si « Notifications Admin » est sur « Oui ») : destinataire des notifications. Si le champ est vide, l'adresse d'expéditeur de la configuration globale est utilisée. L'e-mail est rédigé dans la langue du compte utilisateur de cette adresse, sinon dans la langue par défaut du site."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI3="« Journalisation des activités » (par défaut : Non) : écrit des entrées dans le journal d'actions de Joomla, à savoir pour le début d'une demande de suppression avec le nombre de commandes conservées, pour les adresses supprimées, les commandes anonymisées, les données de newsletter supprimées ou conservées et pour les adresses que les clients ont supprimées eux-mêmes. Chaque entrée contient l'adresse IP de la personne qui agit."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI4="Le plugin ne modifie ni ne supprime jamais les entrées existantes du journal d'actions."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_TITLE="Calcul du délai de conservation"
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_P1="Le délai de chaque commande commence à la fin de l'exercice au cours duquel elle a été passée, et non à la date de commande."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI1="Une commande est conservée jusqu'à la fin de son exercice plus le nombre d'années réglé, jusqu'à 23:59:59 ce jour-là. Dès le jour suivant, elle est hors du délai."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI2="Exemple avec 10 ans et fin d'exercice 12-31 : une commande du 15 mars 2016 est conservée jusqu'au 31 décembre 2026 et peut être anonymisée à partir du 1er janvier 2027."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI3="C'est le fuseau horaire du site dans la configuration globale qui fait foi. J2Commerce enregistre les heures de commande en UTC. Avec le fuseau horaire Europe/Zurich, une commande du 1er janvier 2017 à 00:30 appartient donc à l'exercice 2017, bien qu'en UTC elle tombe encore le 31 décembre 2016."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI4="Une demande de suppression vérifie chaque commande séparément. La tâche planifiée ne traite les clients enregistrés que lorsque leur commande la plus récente est elle aussi hors du délai, puis anonymise toutes leurs commandes. Elle traite les commandes d'invités une par une."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI5="Le plugin et la tâche planifiée ont chacun leurs propres réglages. Saisissez le même délai et la même fin d'exercice dans les deux."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_TITLE="Ce qui est supprimé, anonymisé et conservé"
PLG_PRIVACY_J2COMMERCE_HELP_DATA_P1="Une demande de suppression prend effet lorsque vous l'exécutez dans Joomla. Elle concerne le compte utilisateur de la demande ainsi que les commandes et adresses d'invités portant l'adresse e-mail de la demande ou du compte, dans toutes les tables de boutique existantes, y compris les tables J2Store restées après une migration."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI1="<strong>Supprimé :</strong> les adresses enregistrées (avec « Supprimer les adresses » sur « Oui »), les paniers du compte utilisateur et l'abonné à la newsletter AcyMailing avec listes, champs, statistiques, clics, historique et file d'attente. Les paniers des invités restent, car ils ne contiennent pas d'adresse e-mail."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI2="<strong>Anonymisé</strong> (commandes hors du délai, avec « Anonymiser les commandes » sur « Oui ») : l'adresse e-mail devient <code>anonymized@deleted.invalid</code>, le nom de facturation « Anonymized User ». La note de commande, l'adresse IP ainsi que les noms, adresses, numéros de téléphone et de fax, l'entreprise et le numéro fiscal de facturation et de livraison sont vidés."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI3="<strong>Conservé :</strong> numéro de commande, date, montants, articles et produits, car la comptabilité en a besoin. La commande reste liée au compte utilisateur."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI4="Les commandes dans le délai sont conservées intégralement. Le message après l'exécution et un e-mail à l'adresse de la demande les citent avec la fin de leur délai. La tâche planifiée les anonymise plus tard."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI5="Les consentements du checkout et les consentements à la newsletter donnés au checkout perdent l'adresse IP et l'agent utilisateur lors de l'anonymisation de la commande. L'entrée reste comme preuve avec le numéro de commande et le moment. Un consentement à la newsletter donné au checkout devient invalide immédiatement, car l'abonné à la newsletter est supprimé. Son adresse IP et son agent utilisateur restent jusqu'à l'anonymisation de la commande, comme preuve pour les newsletters déjà envoyées."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI6="Le compte utilisateur lui-même est pseudonymisé par le plugin de confidentialité de Joomla pour les comptes utilisateur dans la même demande, et non par ce plugin."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI7="Le plugin ne refuse pas une demande de suppression pour des obligations de conservation. Il ne la refuse que si Joomla a trouvé un compte utilisateur avec une autre adresse, p. ex. muller@ pour müller@."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI8="Le plugin ne supprime jamais le journal d'actions de Joomla ni les entrées de consentement."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI9="<strong>Autres entrées de consentement :</strong> les consentements de Joomla lors de l'inscription du compte utilisateur et les consentements du formulaire de newsletter du site sont anonymisés immédiatement. L'adresse e-mail, l'adresse IP et l'agent utilisateur sont remplacés par une note neutre et l'entrée devient invalide. Une entrée sans compte utilisateur ne compte que si son champ d'adresse e-mail indique l'adresse de la demande ou du compte comme adresse complète. Les entrées d'un autre compte utilisateur ne sont jamais modifiées."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI10="<strong>Contact de remplacement dans AcyMailing :</strong> si AcyMailing synchronise les utilisateurs Joomla, la pseudonymisation du compte utilisateur par Joomla crée un contact avec l'adresse <code>UserID…removed@email.invalid</code>. Le plugin le supprime juste après la demande et la tâche de nettoyage supprime ceux qui restent. Seul un contact qui appartient au compte pseudonymisé, porte exactement son adresse de remplacement et n'a aucune entrée de liste est supprimé."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_NOTE1="Les données anonymisées ne peuvent pas être restaurées. Testez d'abord les réglages et les processus sur une installation de test avec des données de test."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_TITLE="Licences à vie"
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_P1="Pour les commandes contenant un produit avec licence à vie, la demande de suppression et la tâche planifiée conservent après le délai l'adresse e-mail de la commande, afin que la licence puisse être réactivée. Tout le reste est anonymisé. Les autres commandes de la même personne sont traitées normalement."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI1="J2Commerce 6 : table <code>#__j2commerce_metafields</code>, une ligne avec owner_id égal à l'ID du produit, owner_resource <code>product</code>, metakey <code>is_lifetime_license</code> et metavalue <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI2="J2Store 4 : table <code>#__j2store_product_customfields</code>, que vous créez vous-même, une ligne avec product_id égal à l'ID du produit, field_name <code>is_lifetime_license</code> et field_value <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI3="Le message après l'installation montre les commandes SQL. Il n'existe pas de formulaire de saisie. La casse de <code>yes</code> n'a pas d'importance, les autres valeurs comme 1 ne comptent pas."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI4="Si une erreur de base de données empêche la lecture du marquage, le plugin conserve l'adresse e-mail de toutes les commandes concernées et consigne un avertissement."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI5="Sans marquage, ces commandes sont elles aussi entièrement anonymisées après le délai."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_TITLE="Demandes de clients invités"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_P1="Le formulaire de demande de Joomla n'est ouvert qu'aux personnes connectées. Pour les clients sans compte utilisateur, la procédure est la suivante :"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP1="La personne vous contacte par e-mail, p. ex. via le lien de l'onglet « Confidentialité »."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP2="Vous créez la demande sous « Utilisateurs → Confidentialité → Demandes » avec exactement l'adresse e-mail des commandes. Joomla envoie un code valable 24 heures."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP3="La personne ouvre le lien de l'e-mail et confirme sur la page de ce plugin avec l'adresse e-mail et le code. La demande est alors confirmée et Joomla informe les super utilisateurs."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP4="Vous exécutez la demande et la clôturez."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI1="Les tentatives échouées sont limitées sur 15 minutes : 5 par session, 5 par adresse e-mail et 20 par adresse IP. Tant qu'une limite est atteinte, la page refuse aussi le bon code. La réponse ne révèle pas si une demande existe."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI2="Un code correct mais expiré rend la demande invalide. Créez alors une nouvelle demande."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI3="Joomla n'accepte qu'une seule demande ouverte par adresse e-mail et par type de demande."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI4="La procédure nécessite le plugin activé « Système - J2Commerce Consentement de confidentialité » et « Confirmation par les clients invités » sur « Oui »."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI5="Avec le plugin séparé et facultatif « Système - Demandes de confidentialité », les personnes sans compte peuvent aussi déposer elles-mêmes des demandes de suppression."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_TITLE="Désactivation et désinstallation"
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI1="Tant que ce plugin est désactivé, Joomla ne traite aucune donnée de boutique lors des demandes. L'onglet « Confidentialité », les boutons de suppression d'adresse et la case du checkout disparaissent, et la page de confirmation n'est pas accessible. La tâche planifiée continue de s'exécuter."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI2="La désinstallation supprime aussi les deux plugins inclus, toutes les tâches planifiées du type « J2Commerce - Suppression automatique des données » et la table <code>#__privacy_j2commerce_attempts</code> avec les compteurs de la page de confirmation."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI3="Restent en place les overrides de template copiés, toutes les données de boutique (les données déjà anonymisées le restent), les marquages des licences à vie, les entrées de consentement et le journal d'actions."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>L'onglet « Confidentialité » manque :</strong> vérifiez que ce plugin est activé, que « Afficher la section confidentialité » est sur « Oui » et que le template contient les overrides <code>myprofile/default.php</code> et <code>myprofile/default_privacy.php</code>."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>Les boutons de l'onglet mènent à la page d'accueil :</strong> l'élément de menu du type « Confidentialité → Créer une demande » manque."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>La case manque (J2Commerce 6) :</strong> vérifiez que « Système - J2Commerce Consentement de confidentialité » est activé, que J2Commerce 6.3.4 ou plus récent est installé et qu'un override de checkout personnel déclenche l'événement <code>AfterDisplayShippingPayment</code>."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>Le checkout ne continue pas bien que la case soit cochée (J2Commerce 6) :</strong> le consentement vaut pour le panier courant. Si le panier change, p. ex. par une connexion dans un autre onglet, ou si l'étape est affichée de nouveau, la personne doit cocher la case une nouvelle fois."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>Le bouton pour continuer reste bloqué (J2Store 4) :</strong> la case n'est pas cochée, ou le navigateur ne charge pas <code>consent-validator.js</code>. Remplacez un override de checkout d'une version antérieure du plugin par la version fournie."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>Pas d'e-mail sur les commandes conservées :</strong> un e-mail n'est envoyé que si des commandes sont conservées ou si des commandes avec licence à vie gardent leur adresse e-mail. Si l'adresse était invalide ou si l'envoi a échoué, le message après l'exécution affiche un avertissement avec la liste. Informez alors la personne vous-même."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>Avertissement sur les données de newsletter :</strong> l'abonné n'a pas été supprimé ou la recherche a échoué. Les consentements à la newsletter de la demande restent alors également inchangés. Corrigez la cause d'après le journal (catégorie <code>plg_privacy_j2commerce</code>) et exécutez de nouveau la suppression."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI8="<strong>Demande de suppression refusée ou avertissement à l'export pour une adresse différente :</strong> Joomla a trouvé un compte avec une adresse semblable mais différente. Vérifiez l'adresse de la demande et n'envoyez pas un tel export."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI9="<strong>Le type de tâche manque dans les tâches planifiées :</strong> activez « Tâche - Nettoyage confidentialité J2Commerce »."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI10="<strong>La page de confirmation ne confirme jamais :</strong> vérifiez l'adresse et le code et attendez 15 minutes si une limite est atteinte. Si la table <code>#__privacy_j2commerce_attempts</code> manque, la page ne confirme rien pour des raisons de sécurité. Installez alors de nouveau le paquet."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI11="<strong>Une licence à vie n'est pas détectée :</strong> vérifiez le nom <code>is_lifetime_license</code>, la valeur <code>yes</code> et l'ID du produit."
