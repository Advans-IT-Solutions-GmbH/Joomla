PKG_PRIVACY_J2COMMERCE="Paket J2Commerce Datenschutz"
PKG_PRIVACY_J2COMMERCE_XML_DESCRIPTION="DSGVO und Datenschutz für J2Commerce in einer Installation: das Datenschutz-Plugin (Export, Löschung und Aufbewahrung der Shopdaten, Datenschutz-Tab im Kundenprofil), das System-Plugin für die Einwilligung (Checkout-Einwilligung) und das Task-Plugin für die Bereinigung (automatische Anonymisierung). Installieren, Aktualisieren und Entfernen des Pakets verwaltet alle drei gemeinsam. Über das eigenständige Datenschutz-Plugin einer früheren Version installiert, übernimmt das Paket es mit allen Daten, Einstellungen und Aktivierungszuständen."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_INTRO="Das Paket J2Commerce Datenschutz ist installiert. Die mitgelieferten Plugins <strong>System - J2Commerce Datenschutz-Einwilligung</strong> und <strong>Task - J2Commerce Datenschutz-Bereinigung</strong> sind installiert und aktiviert, und die geplante Bereinigung wird unten geprüft. Aktivieren Sie <strong>Privacy - J2Commerce Datenschutz</strong> selbst, wie die Anleitung oben es beschreibt."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="Paket J2Commerce Datenschutz auf Version %s aktualisiert."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_MIGRATED="J2Commerce Datenschutz läuft jetzt als Paket (Version %s). Das Datenschutz-Plugin und seine mitgelieferten Plugins wurden übernommen, wie sie waren: Daten, Einstellungen und Aktivierungszustände sind unverändert. Updates kommen jetzt über das Paket."
PKG_PRIVACY_J2COMMERCE_INSTALL_CHILD_NEWER="%1$s ist in Version %2$s installiert, die neuer ist als die Version %3$s in diesem Paket. Die Installation wurde angehalten, es wurde nichts geändert. Installieren Sie das aktuelle Paket J2Commerce Datenschutz."
PKG_PRIVACY_J2COMMERCE_UPDATE_CHANNEL_WARNING="Das Paket J2Commerce Datenschutz wurde installiert oder aktualisiert, aber Joomla konnte nicht alle mitgelieferten Plugins auf den Paket-Updatekanal umstellen. Einzelne Plugins können weiterhin eigenständige Updates erhalten. Aktualisieren Sie das Paket erneut, um die Umstellung zu wiederholen."
