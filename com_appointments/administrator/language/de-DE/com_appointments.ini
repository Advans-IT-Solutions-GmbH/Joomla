COM_APPOINTMENTS_MAIL_CONFIRMATION_SUBJECT="Bestätigt: {event_title}"
COM_APPOINTMENTS_MAIL_CONFIRMATION_BODY="Guten Tag {invitee_name},\n\nIhr Termin ist bestätigt.\n{event_title}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nOrt: {location}\n{conference_url}\n\nDie angehängte Einladung trägt diesen Termin in Ihren Kalender ein."
COM_APPOINTMENTS_MAIL_PENDING_SUBJECT="Freigabe ausstehend: {event_title}"
COM_APPOINTMENTS_MAIL_PENDING_BODY="Guten Tag {invitee_name},\n\nDie gewünschte Zeit ist reserviert, während der Gastgeber Ihre Anfrage prüft.\n{event_title}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\n\nDie angehängte Kalendereinladung ist bis zur Freigabe vorläufig."
COM_APPOINTMENTS_MAIL_APPROVED_SUBJECT="Freigegeben: {event_title}"
COM_APPOINTMENTS_MAIL_APPROVED_BODY="Guten Tag {invitee_name},\n\nDer Gastgeber hat Ihren Termin freigegeben.\n{event_title}\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\nOrt: {location}\n{conference_url}\n\nNehmen Sie die angehängte Einladung an, um Ihren Kalender zu aktualisieren."
