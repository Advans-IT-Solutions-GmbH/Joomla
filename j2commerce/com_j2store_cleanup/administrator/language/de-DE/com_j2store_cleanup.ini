COM_J2STORE_CLEANUP_REASON_JOOMLA_ISSUES="%d Joomla-Schnittstellenproblem(e)"
COM_J2STORE_CLEANUP_REASON_INCOMPATIBLE="%1$s (%2$s)"
COM_J2STORE_CLEANUP_MSG_DB_ONLY="%s (Datenbankeintrag entfernt, Dateien können verbleiben)"
COM_J2STORE_CLEANUP_MENU_FAILED="Der Eintrag von J2Store Cleanup im Menü «Komponenten» konnte nicht angelegt werden. Öffnen Sie die Komponente über System, Verwalten, Erweiterungen, oder legen Sie den Menüeintrag im Administrator von Hand an."
COM_J2STORE_CLEANUP_MENU_ORPHAN_QUERY_FAILED="Die früheren Menüeinträge von J2Store Cleanup im Administrator konnten nicht gesucht werden: %s"
COM_J2STORE_CLEANUP_MENU_ORPHAN_FAILED="Der frühere Menüeintrag %1$d von J2Store Cleanup im Administrator konnte nicht entfernt werden: %2$s"
COM_J2STORE_CLEANUP_MENU_ORPHAN_KEPT="Der frühere Menüeintrag %d von J2Store Cleanup im Administrator wurde beibehalten, weil andere Menüeinträge darunter liegen. Entfernen Sie ihn von Hand im Menü des Administrators."
COM_J2STORE_CLEANUP_MENU_ALIAS_BLOCKED="Der Menüeintrag %1$d im Administrator (Menü «%2$s», Link «%3$s», Komponenten-ID %4$d) belegt noch den Alias von J2Store Cleanup und wurde beibehalten. Entfernen oder benennen Sie ihn um und installieren Sie das Update erneut."

; Hilfeseite
COM_J2STORE_CLEANUP_HELP_TITLE="J2Store Erweiterungs-Bereinigung: Hilfe"
COM_J2STORE_CLEANUP_HELP_LINK="Hilfe: wie die Prüfung arbeitet und was das Entfernen bewirkt"
COM_J2STORE_CLEANUP_HELP_INTRO="Diese Seite erklärt, was die Komponente prüft, wie sie Erweiterungen einstuft, was das Entfernen bewirkt und was es nie tut, welche Berechtigungen nötig sind und was bei Problemen zu tun ist."
COM_J2STORE_CLEANUP_HELP_CONTENTS="Inhalt der Hilfe"
COM_J2STORE_CLEANUP_HELP_BACK="Zurück zur J2Store Erweiterungs-Bereinigung"
COM_J2STORE_CLEANUP_HELP_PURPOSE_TITLE="Was die Komponente tut"
COM_J2STORE_CLEANUP_HELP_PURPOSE_DESC="Die J2Store Erweiterungs-Bereinigung hilft beim Wechsel von J2Store zu J2Commerce. Sie listet die Erweiterungen der Website auf, die zu J2Store oder J2Commerce gehören, durchsucht ihre PHP-Dateien nach Programmierschnittstellen (APIs), die die laufende Joomla-Version nicht mehr hat, und zeigt das Ergebnis in Gruppen. Ein Benutzer mit den nötigen Berechtigungen kann ausgewählte Erweiterungen aus dieser Liste deinstallieren."
COM_J2STORE_CLEANUP_HELP_PURPOSE_NOT="Die Komponente migriert keine Daten und ändert selbst keine Produkte, Bestellungen oder Kunden. Sie hat keine eigenen Datenbanktabellen und keine geplante Aufgabe. Das Öffnen der Seite liest nur die Liste der Erweiterungen und deren Dateien."
COM_J2STORE_CLEANUP_HELP_WHEN_TITLE="Wann Sie sie einsetzen und wann nicht"
COM_J2STORE_CLEANUP_HELP_WHEN_USE="Setzen Sie sie nach der Migration zu J2Commerce und vor oder nach einem Update von Joomla ein, um Zusatzerweiterungen zu finden, die entfernte APIs verwenden oder deren Dateien auf dem Server fehlen."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT="Setzen Sie sie nicht ein:"
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_PROOF="Als Nachweis der Kompatibilität. Eine Prüfung ohne Befund zeigt nicht, dass eine Erweiterung funktioniert, und ein Befund allein ist kein Grund, eine Erweiterung zu entfernen."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_NEEDED="Um eine Erweiterung zu entfernen, die die Website noch braucht. Suchen Sie zuerst nach einer aktualisierten Version."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_BACKUP="Ohne aktuelle Sicherung von Dateien und Datenbank, die Sie wiederherstellen können."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER="Eine sinnvolle Reihenfolge:"
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_1="Sichern Sie die ganze Website, Dateien und Datenbank."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_2="Migrieren Sie den Shop zu J2Commerce und testen Sie ihn: Produkte, Bestellungen, Kasse und Kundenkonten."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_3="Öffnen Sie diese Komponente und prüfen Sie jedes Ergebnis."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_4="Entfernen Sie nur Erweiterungen, die die Website nicht mehr braucht oder deren Dateien fehlen."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_5="Leeren Sie den Joomla-Cache und testen Sie Website und Shop erneut."
COM_J2STORE_CLEANUP_HELP_REQ_TITLE="Voraussetzungen und Berechtigungen"
COM_J2STORE_CLEANUP_HELP_REQ_BACKUP="Erstellen Sie eine vollständige Sicherung von Dateien und Datenbank, bevor Sie etwas entfernen. Die Komponente erstellt keine Sicherung, prüft keine Abhängigkeiten zwischen Erweiterungen und kann ein Entfernen nicht rückgängig machen."
COM_J2STORE_CLEANUP_HELP_REQ_VIEW="Um die Seite zu öffnen, die Prüfung zu sehen und diese Hilfe zu lesen, braucht ein Benutzer «%1$s» für diese Komponente. Die Schaltfläche «%2$s» in der Werkzeugleiste und der Link unter dem Seitentitel öffnen diese Hilfe."
COM_J2STORE_CLEANUP_HELP_REQ_REMOVE="Um Erweiterungen zu entfernen, braucht ein Benutzer zusätzlich «%1$s» für diese Komponente und sowohl «%2$s» als auch «%1$s» für die Erweiterungsverwaltung von Joomla (System → Verwalten → Erweiterungen). Die Komponente lässt deshalb nie jemanden mehr deinstallieren, als Joomla selbst erlaubt."
COM_J2STORE_CLEANUP_HELP_REQ_READONLY="Ohne diese Berechtigungen ist die Seite nur lesbar: Sie zeigt keine Kontrollfelder und keine Schaltfläche «Ausgewählte Erweiterungen entfernen», und eine Anfrage zum Entfernen wird abgelehnt."
COM_J2STORE_CLEANUP_HELP_REQ_DEFAULT="In einer Standardinstallation von Joomla hat die Gruppe Administrator keinen Zugriff auf die Erweiterungsverwaltung. Administratoren sehen deshalb die Prüfung, können aber nichts entfernen. Super Users können es."
COM_J2STORE_CLEANUP_HELP_DETECT_TITLE="Welche Erweiterungen aufgelistet werden"
COM_J2STORE_CLEANUP_HELP_DETECT_INTRO="Die Seite listet diese Erweiterungen der Website auf:"
COM_J2STORE_CLEANUP_HELP_DETECT_COMPONENTS="Komponenten, deren Element mit <code>com_j2store_</code> oder <code>com_j2commerce_</code> beginnt."
COM_J2STORE_CLEANUP_HELP_DETECT_PLUGINS="Plugins der Gruppen <code>j2store</code> und <code>j2commerce</code> sowie Plugins, deren Element <code>j2store</code> oder <code>j2commerce</code> lautet oder mit <code>j2store_</code> oder <code>j2commerce_</code> beginnt, auch mit dem Präfix <code>plg_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_MODULES="Module, deren Element <code>mod_j2store</code> oder <code>mod_j2commerce</code> lautet oder mit <code>mod_j2store_</code> oder <code>mod_j2commerce_</code> beginnt."
COM_J2STORE_CLEANUP_HELP_DETECT_TEMPLATES="Templates und Bibliotheken, deren Element <code>j2store</code> oder <code>j2commerce</code> lautet oder mit einem davon gefolgt von <code>_</code> oder <code>/</code> beginnt."
COM_J2STORE_CLEANUP_HELP_DETECT_CORE="Die Shop-Komponenten J2Store (<code>com_j2store</code>) und J2Commerce (<code>com_j2commerce</code>) erscheinen als «Kern» und lassen sich nie entfernen."
COM_J2STORE_CLEANUP_HELP_DETECT_NEVER="Nie aufgelistet werden: diese Komponente selbst, Dateierweiterungen und Pakete, Erweiterungen, die Joomla als geschützt oder gesperrt kennzeichnet, und Einträge, deren Element nicht mit einem Kleinbuchstaben oder einer Ziffer beginnt oder andere Zeichen als Kleinbuchstaben, Ziffern, Unterstrich, Punkt und Bindestrich enthält."
COM_J2STORE_CLEANUP_HELP_SCAN_TITLE="Wie die Prüfung Erweiterungen einstuft"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER="Jede aufgelistete Erweiterung erhält ein Ergebnis, geprüft in dieser Reihenfolge:"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_CORE="«Kern»: Die Shop-Komponente J2Store oder J2Commerce."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_NO_FILES="«Keine Dateien»: Der Ordner der Erweiterung besteht auf dem Server nicht. Bei einer Komponente müssen der Administrator-, der Website- und der API-Ordner alle fehlen."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_COMPATIBLE="«Kompatibel»: Die Prüfung findet keine der unten genannten APIs."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_INCOMPATIBLE="«Inkompatibel»: Die Prüfung findet mindestens eine davon."
COM_J2STORE_CLEANUP_HELP_SCAN_FILES="Die Prüfung liest jede PHP-Datei in den Ordnern der Erweiterung, auch in allen Unterordnern. Sie entfernt zuerst Kommentare der Form <code>/* … */</code> und <code>// …</code> und sucht dann nach den Namen von APIs, die die laufende Joomla-Version nicht mehr hat:"
COM_J2STORE_CLEANUP_HELP_SCAN_J4="Unter Joomla 5 und 6: <code>JPlugin</code>, <code>JModel</code> und <code>JModelLegacy</code>, <code>JTable</code>, <code>JView</code> und <code>JViewLegacy</code>, <code>JController</code> und <code>JControllerLegacy</code>, <code>JForm</code> (entfernt in Joomla 4)."
COM_J2STORE_CLEANUP_HELP_SCAN_J6="Unter Joomla 6 zusätzlich: <code>JFactory</code>, <code>JText</code>, <code>JHtml</code>, <code>JRoute</code>, <code>JUri</code>, <code>JSession</code>, <code>Factory::getUser()</code>, <code>Factory::getDbo()</code>, <code>Factory::getSession()</code>, <code>Factory::getDocument()</code> und <code>$this-&gt;app</code> (entfernt in Joomla 6)."
COM_J2STORE_CLEANUP_HELP_SCAN_DETAILS="Klicken Sie auf den Text in der Spalte «Gefundene Probleme», um die Befunde zu sehen, z.B. «JFactory (entfernt in Joomla 6)». Prüfungen auf J2Store-eigene APIs gibt es derzeit keine, Klassen des F0F-Frameworks werden also nicht gemeldet."
COM_J2STORE_CLEANUP_HELP_SCAN_J5_NOTE="Unter Joomla 5 funktionieren die APIs, die Joomla 6 entfernt, über das Plugin für die Rückwärtskompatibilität noch. Die Prüfung meldet sie dort deshalb nicht. Eine Erweiterung, die unter Joomla 5 «Kompatibel» ist, kann unter Joomla 6 «Inkompatibel» sein."
COM_J2STORE_CLEANUP_HELP_SCAN_LIMITS="Die Prüfung vergleicht nur Text. Ein Name in einer Zeichenkette wird ebenfalls gemeldet, und Code in anderen Dateien als PHP wird nicht geprüft. Versionsnummern, Autor und ob die Erweiterung aktiviert ist, werden nicht ausgewertet."
COM_J2STORE_CLEANUP_HELP_RESULT_TITLE="Ergebnisse auf der Seite"
COM_J2STORE_CLEANUP_HELP_RESULT_INCOMPATIBLE="«Inkompatible Erweiterungen (n)»: Name, Typ, Element, Status und die Befunde. Diese Einträge lassen sich zum Entfernen auswählen."
COM_J2STORE_CLEANUP_HELP_RESULT_NO_FILES="«Keine Dateien gefunden (n)»: Einträge ohne Dateien. Sie lassen sich auswählen, ausser Teile eines Pakets. Diese zeigen «Teil eines Pakets: Bitte das Paket unter System → Verwalten → Erweiterungen deinstallieren.» und haben kein Kontrollfeld."
COM_J2STORE_CLEANUP_HELP_RESULT_COMPATIBLE="«Kompatible Erweiterungen (n)»: Die kompatiblen Erweiterungen und die Shop-Komponente. Sie lassen sich nicht auswählen."
COM_J2STORE_CLEANUP_HELP_RESULT_ALL="Ist nichts inkompatibel und fehlen keine Dateien, zeigt die Seite «Alle Erweiterungen sind kompatibel.». Hat die Website keine dieser Erweiterungen, nicht einmal die Shop-Komponente, zeigt sie «Keine J2Store/J2Commerce-Erweiterungen gefunden.»."
COM_J2STORE_CLEANUP_HELP_REMOVE_TITLE="Was das Entfernen bewirkt"
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_1="Aktivieren Sie die Kontrollfelder der Erweiterungen, die Sie entfernen wollen. Das Kontrollfeld in der Spaltenüberschrift wählt alle Einträge der Tabelle aus."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_2="Klicken Sie auf «Ausgewählte Erweiterungen entfernen»."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_3="Lesen Sie die Rückfrage und bestätigen Sie sie."
COM_J2STORE_CLEANUP_HELP_REMOVE_CHECK="Bevor etwas entfernt wird, prüft der Server die ganze Auswahl erneut. Besteht ein ausgewählter Eintrag nicht mehr oder darf er nicht entfernt werden, wird gar nichts entfernt, und die Fehlermeldung nennt den Eintrag."
COM_J2STORE_CLEANUP_HELP_REMOVE_INCOMPATIBLE="Eine Erweiterung mit Dateien wird mit dem Deinstallationsprogramm von Joomla entfernt, wie unter System → Verwalten → Erweiterungen: Ihre Deinstallationsroutine läuft, und Joomla löscht die Dateien und Datenbankeinträge, die für sie registriert sind. Was genau gelöscht wird, hängt von der Erweiterung ab."
COM_J2STORE_CLEANUP_HELP_REMOVE_NO_FILES="Für einen Eintrag ohne Dateien kann Joomla keine Deinstallation ausführen. Nur der Eintrag in der Erweiterungsliste von Joomla wird gelöscht, und die Meldung sagt «(Datenbankeintrag entfernt, Dateien können verbleiben)». Andere Spuren der Erweiterung, z.B. ihre Datenbanktabellen, bleiben."
COM_J2STORE_CLEANUP_HELP_REMOVE_REFUSED="Lehnt das Deinstallationsprogramm von Joomla ab, bleibt der Eintrag bestehen, und die Fehlermeldung lautet «Joomla hat die Deinstallation von Erweiterungseintrag n abgelehnt.». Die Komponente erzwingt ein solches Entfernen nie."
COM_J2STORE_CLEANUP_HELP_REMOVE_EXCEPTION="Bricht die Deinstallation mit einem Fehler ab, prüft die Komponente die Ordner der Erweiterung erneut. Nur wenn kein Ordner mehr besteht, wird der Eintrag wie bei einem Eintrag ohne Dateien gelöscht. Sonst bleibt der Eintrag bestehen, und der Fehler wird angezeigt. Tabellen der Erweiterung können in beiden Fällen bleiben."
COM_J2STORE_CLEANUP_HELP_REMOVE_SEPARATE="Jede ausgewählte Erweiterung wird einzeln entfernt. Schlägt eine spätere fehl, bleiben die früheren entfernt."
COM_J2STORE_CLEANUP_HELP_REMOVE_MESSAGES="Danach zeigt die Seite, wie viele Erweiterungen entfernt wurden, wie viele nur teilweise (Eintrag gelöscht, Dateien können verbleiben) und wie viele nicht entfernt werden konnten, jeweils mit den Einzelheiten."
COM_J2STORE_CLEANUP_HELP_NEVER_TITLE="Was die Komponente nie tut"
COM_J2STORE_CLEANUP_HELP_NEVER_CORE="Sie entfernt nie die Shop-Komponenten J2Store und J2Commerce oder sich selbst, auch nicht bei einer manipulierten Anfrage."
COM_J2STORE_CLEANUP_HELP_NEVER_PROTECTED="Sie entfernt nie Erweiterungen, die Joomla als geschützt oder gesperrt kennzeichnet, Dateierweiterungen, Pakete, Erweiterungen ausserhalb der obigen Liste und keine Erweiterung, die als «Kompatibel» erscheint."
COM_J2STORE_CLEANUP_HELP_NEVER_PACKAGE="Sie löscht nie den Eintrag eines Paketteils ohne Dateien. Deinstallieren Sie stattdessen das Paket."
COM_J2STORE_CLEANUP_HELP_NEVER_DATA="Sie ändert selbst keine Produkte, Bestellungen oder Kunden. Die Deinstallationsroutine einer entfernten Erweiterung kann aber die Tabellen und Daten dieser Erweiterung löschen."
COM_J2STORE_CLEANUP_HELP_NEVER_EXTRA="Sie erstellt keine Sicherung, prüft keine Abhängigkeiten und migriert keine Daten."
COM_J2STORE_CLEANUP_HELP_UNDO_TITLE="Was sich nicht rückgängig machen lässt"
COM_J2STORE_CLEANUP_HELP_UNDO_DESC="Ein Entfernen lässt sich in dieser Komponente nicht rückgängig machen. Es gibt kein Zurückrollen und keinen Papierkorb."
COM_J2STORE_CLEANUP_HELP_UNDO_RESTORE="Um eine entfernte Erweiterung zurückzuholen, stellen Sie Ihre Sicherung wieder her oder installieren die Erweiterung erneut. Eine neue Installation bringt keine Daten zurück, die die Deinstallationsroutine gelöscht hat."
COM_J2STORE_CLEANUP_HELP_OPTIONS_TITLE="Optionen und Berechtigungen"
COM_J2STORE_CLEANUP_HELP_OPTIONS_DESC="Die Komponente hat keine eigenen Einstellungen. Die Schaltfläche «%1$s» in der Werkzeugleiste öffnet nur das Register «%2$s». Die Schaltfläche erscheint für Benutzer mit «%3$s» oder «%4$s». Um die Berechtigungen zu ändern, braucht es «%3$s»."
COM_J2STORE_CLEANUP_HELP_OPTIONS_ADMIN="«%1$s»: Die Berechtigungen dieser Komponente ändern und ihre Optionen öffnen."
COM_J2STORE_CLEANUP_HELP_OPTIONS_OPTIONS="«%1$s»: Zeigt die Schaltfläche Optionen."
COM_J2STORE_CLEANUP_HELP_OPTIONS_MANAGE="«%1$s»: Die Seite öffnen, die Prüfung sehen und diese Hilfe lesen, ohne etwas zu ändern."
COM_J2STORE_CLEANUP_HELP_OPTIONS_DELETE="«%1$s»: Erweiterungen entfernen, zusammen mit den Berechtigungen für die Erweiterungsverwaltung von Joomla, die unter «Voraussetzungen und Berechtigungen» genannt sind."
COM_J2STORE_CLEANUP_HELP_OPTIONS_INHERIT="Joomla-Berechtigungen werden von übergeordneten Gruppen und aus der globalen Konfiguration geerbt, solange sie hier nicht gesetzt sind. Ein geerbtes Verweigert lässt sich hier nicht mit Erlaubt aufheben."
COM_J2STORE_CLEANUP_HELP_OPTIONS_UPGRADE="Installation und Update der Komponente vergeben weder «%1$s» noch «%2$s» automatisch. Bestehende Regeln bleiben unverändert."
COM_J2STORE_CLEANUP_HELP_TROUBLE_TITLE="Typische Probleme und was zu tun ist"
COM_J2STORE_CLEANUP_HELP_TROUBLE_DENIED="Die Seite wird mit «%1$s» abgelehnt: Dem Benutzer fehlt «%2$s» für diese Komponente. Ein Mitglied der Gruppe Super Users kann es in den Optionen der Komponente, Register «%3$s», erteilen."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NO_BUTTON="Keine Kontrollfelder und keine Schaltfläche «Ausgewählte Erweiterungen entfernen»: Eine der Berechtigungen zum Entfernen unter «Voraussetzungen und Berechtigungen» fehlt, oder kein aufgelisteter Eintrag darf entfernt werden."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FLAGGED="Eine Erweiterung, die Sie brauchen, erscheint als «Inkompatibel»: Entfernen Sie sie nicht. Öffnen Sie die Befunde, vergleichen Sie sie mit dem Code der Erweiterung und suchen Sie nach einer aktualisierten Version. Ein Textvergleich kann ein Fehlalarm sein."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NOT_ELIGIBLE="«Erweiterungseintrag n ist geschützt oder liegt ausserhalb des zulässigen Bereinigungsbereichs.» oder «Erweiterungseintrag n wurde nicht gefunden.»: Der Eintrag hat sich seit dem Laden der Seite geändert, z.B. wurde er in einer anderen Registerkarte entfernt oder hat keine Befunde mehr, oder die Anfrage wurde manipuliert. Laden Sie die Seite neu und wählen Sie erneut aus."
COM_J2STORE_CLEANUP_HELP_TROUBLE_REFUSED="«Joomla hat die Deinstallation von Erweiterungseintrag n abgelehnt.»: Das Deinstallationsprogramm von Joomla hat das Entfernen abgelehnt. Prüfen Sie die weiteren Meldungen auf der Seite und versuchen Sie die Deinstallation unter System → Verwalten → Erweiterungen."
COM_J2STORE_CLEANUP_HELP_TROUBLE_PACKAGE="Ein Eintrag ohne Dateien zeigt «Teil eines Pakets: …» und hat kein Kontrollfeld: Deinstallieren Sie das Paket unter System → Verwalten → Erweiterungen."
COM_J2STORE_CLEANUP_HELP_TROUBLE_DB_ONLY="«… (Datenbankeintrag entfernt, Dateien können verbleiben)»: Nur der Eintrag wurde gelöscht. Entfernen Sie verbliebene Dateien und Tabellen der Erweiterung bei Bedarf von Hand."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FAILED="«n Erweiterung(en) konnten nicht entfernt werden: …»: Die Einzelheiten nennen die Erweiterung und den Fehler. Der Eintrag bleibt bestehen. Frühere Entfernungen derselben Auswahl werden nicht rückgängig gemacht."
COM_J2STORE_CLEANUP_HELP_TROUBLE_BROKEN="Die Website zeigt nach dem Entfernen Fehler: Wahrscheinlich brauchte eine andere Erweiterung die entfernte. Stellen Sie Ihre Sicherung wieder her oder installieren Sie die entfernte Erweiterung erneut."
COM_J2STORE_CLEANUP_HELP_TROUBLE_J2COMMERCE="J2Commerce-Plugins oder -Module werden aufgelistet oder gemeldet: Das ist so gewollt. Die Liste enthält jede Erweiterung, die zu den obigen Namen passt, und das Ergebnis hängt allein von der Prüfung ab."
COM_J2STORE_CLEANUP_HELP_TROUBLE_MISSING="Eine Erweiterung, die Sie kennen, fehlt in der Liste: Ihr Element passt nicht zu den obigen Namen, oder sie ist schon deinstalliert. Prüfen Sie System → Verwalten → Erweiterungen."
