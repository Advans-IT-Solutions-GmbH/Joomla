COM_APPOINTMENTS_TEAM_C_ERROR_OWNER_KEY="Der gewählte Eigentümer hat noch keinen nutzbaren Schlüssel. Beim eigenen berechtigten Teamkonto kann Speichern den ersten Schlüssel nach Passwort und zugelassenem zweiten Faktor in dieser Sitzung anlegen. Ein anderer Eigentümer muss sich selbst mit Passwort und zugelassenem zweiten Faktor anmelden und zuerst Meine Kalender öffnen. Versuchen Sie es danach erneut."
