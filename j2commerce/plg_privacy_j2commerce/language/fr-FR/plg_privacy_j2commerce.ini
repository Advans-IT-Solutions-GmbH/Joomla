PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST_ADDRESSES_KEPT_NEWSLETTER_KEPT="Votre demande de suppression de données a été traitée. Votre abonnement à la newsletter n'a pas encore pu être supprimé. Nous effectuerons cette suppression ultérieurement. Les adresses enregistrées ne sont pas supprimées selon les paramètres de cette boutique. Contactez-nous si vous souhaitez leur suppression. Les données de commande sont soumises à une obligation légale de conservation et sont conservées jusqu'à la date indiquée. Elles sont ensuite anonymisées. Pour les commandes avec licence à vie, l'adresse e-mail de la commande est conservée afin de pouvoir réactiver la licence."
