; Action items (title + text). Placeholders are positional.
COM_DMARCREPORTS_ACTION_NO_DATA_TITLE="No reports yet"
COM_DMARCREPORTS_ACTION_NO_DATA_TEXT="No aggregate reports have been imported for %1$s yet. Publish a DMARC record with a rua address, then import the first reports."

COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TITLE="Move to p=quarantine"
COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TEXT="%2$s%% of observed mail for %1$s passes DMARC, meeting the configured threshold to move from p=none to p=quarantine. Review the failing sources before enforcing so legitimate forwarded mail is not quarantined."

COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TITLE="Stay at p=none for now"
COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TEXT="Only %2$s%% of mail for %1$s passes DMARC, below the %3$s%% needed to move to p=quarantine. Fix the failing senders first."

COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TITLE="Move to p=reject"
COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TEXT="%2$s%% of observed mail for %1$s passes DMARC under p=quarantine, meeting the configured threshold to move to p=reject. Review the remaining failing sources before enforcing so legitimate mail is not rejected."

COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TITLE="Stay at p=quarantine for now"
COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TEXT="Only %2$s%% of mail for %1$s passes DMARC, below the %3$s%% needed to move to p=reject. Resolve the remaining failures first."

COM_DMARCREPORTS_ACTION_ENFORCED_TITLE="Enforcement reached"
COM_DMARCREPORTS_ACTION_ENFORCED_TEXT="%1$s is enforcing p=reject. Keep importing reports and watch for new sending sources."
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TITLE="Partial enforcement only"
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TEXT="%1$s publishes p=reject but only %2$d%% of its mail is subject to the policy; the rest still falls back to quarantine. Raise pct to 100 so the policy applies to all mail."
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TITLE="Partial quarantine only"
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TEXT="%1$s publishes p=quarantine but only %2$d%% of its mail is subject to the policy. Raise pct to 100 to exercise quarantine on all mail before advancing towards reject."

COM_DMARCREPORTS_ACTION_AT_TARGET_TITLE="Target policy reached"
COM_DMARCREPORTS_ACTION_AT_TARGET_TEXT="%1$s is already at its chosen target policy p=%2$s. Keep importing reports and watch for new sending sources; raise the target if you want to tighten further."

COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TITLE="Mail at risk under p=reject"
COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TEXT="%1$d message(s), %2$s%% of the volume, are unaligned and would be rejected under p=reject. Authenticate these senders before tightening the policy."

COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TITLE="Align a sending source"
COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TEXT="%1$s sent %2$d message(s), %3$s%% of the volume, with no DKIM or SPF alignment. Add it to SPF and/or sign with DKIM."

COM_DMARCREPORTS_ACTION_NEW_SOURCE_TITLE="New sending source seen"
COM_DMARCREPORTS_ACTION_NEW_SOURCE_TEXT="%1$s is a new source with %2$d message(s). Confirm it is a legitimate sender and authenticate it, or investigate possible abuse."

COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TITLE="Pass rate dropped"
COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TEXT="The DMARC pass rate fell from %1$s%% to %2$s%%. Check for a broken sender or a new unaligned source before tightening the policy."

COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TITLE="Publish a DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TEXT="No DMARC record was found for %1$s. Publish one at p=none with a rua address to start collecting reports."
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TITLE="Remove the duplicate DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TEXT="More than one DMARC record is published for %1$s. This is invalid and receivers ignore the policy; keep exactly one record at _dmarc.%1$s."
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TITLE="Fix the malformed DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TEXT="The DMARC record for %1$s is malformed: the p value must be none, quarantine or reject, and pct must be a whole number from 0 to 100. Receivers cannot apply an invalid record, so correct it at _dmarc.%1$s."

COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TITLE="DMARC policy is p=none"
COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TEXT="The published DMARC record for %1$s is at p=none and provides no protection yet. Plan the move to quarantine once your senders pass."

COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TITLE="Add a rua address"
COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TEXT="The DMARC record for %1$s has no rua address, so no aggregate reports are being requested. Add rua=mailto: to receive them."

COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TITLE="DMARC pct is below 100"
COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TEXT="The DMARC record applies the policy to only %1$s%% of mail. Raise pct to 100 once you are confident."

COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TITLE="Publish an SPF record"
COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TEXT="No SPF record was found for %1$s. Publish one so receivers can authenticate your sending hosts."
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TITLE="Remove the duplicate SPF record"
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TEXT="More than one SPF record is published for %1$s. This is invalid and causes a permerror; merge them into a single record."
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TITLE="DNS lookup failed"
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TEXT="The DNS lookup for %1$s failed, so its DMARC and SPF records could not be checked. This is usually temporary; retry shortly, and if it persists check the server's DNS resolver."

COM_DMARCREPORTS_ACTION_GENERIC_TITLE="Review this item"
COM_DMARCREPORTS_ACTION_GENERIC_TEXT="This item needs your review."

