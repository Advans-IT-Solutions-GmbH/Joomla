PLG_SYSTEM_J2COMMERCEPRIVACY="System - J2Commerce Datenschutz-Einwilligung"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Prüft die Datenschutz-Einwilligung im J2Commerce-6-Checkout serverseitig und protokolliert sie pro Bestellung in den Joomla-Datenschutz-Einwilligungen. Verknüpft zudem die E-Mail zu Datenschutzanfragen, welche die Administration erstellt hat, mit der Bestätigungsseite des J2Commerce-Datenschutz-Plugins, die auch Kundinnen und Kunden ohne Benutzerkonto nutzen können."
