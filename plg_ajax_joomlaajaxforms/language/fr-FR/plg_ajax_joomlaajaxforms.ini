PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_WARNING_TITLE=".htaccess : exception com_ajax manquante"
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_COMPONENT_BLOCKED="Le bloc /component/ dans .htaccess n'a pas d'exception pour les appels de plugin com_ajax (par exemple RewriteCond %{QUERY_STRING} !plugin= [NC]). Les appels AJAX (connexion, panier, etc.) échoueront."
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_OPTION_BLOCKED="Le bloc index.php?option=com_* n'a pas d'exception pour com_ajax (par exemple RewriteCond %{QUERY_STRING} !^option=com_ajax [NC]). Les appels AJAX échoueront."
PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_WARNING_ACTION="Ajoutez les exceptions dans .htaccess. Consultez le README de ce plugin pour les règles complètes."
