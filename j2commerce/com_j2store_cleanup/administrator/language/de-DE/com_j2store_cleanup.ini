COM_J2STORE_CLEANUP_REASON_INFO="%1$s, Version %2$s"
COM_J2STORE_CLEANUP_REASON_NO_FILES="Dateien nicht auf dem Server gefunden (%s)"
COM_J2STORE_CLEANUP_REASON_COMPATIBLE="Keine Probleme gefunden (%s)"
