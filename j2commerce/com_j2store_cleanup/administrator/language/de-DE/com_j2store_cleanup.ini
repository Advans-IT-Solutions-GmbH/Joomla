COM_J2STORE_CLEANUP_POSTINSTALL_DESC="Die Komponente ist verfügbar unter <strong>Komponenten → J2Store Cleanup</strong>. Sie zeigt J2Store-Erweiterungen, die als nicht kompatibel erkannt werden, und deinstalliert die ausgewählten Erweiterungen. Die Komponente selbst ändert keine Shopdaten. Die Deinstallationsroutine einer entfernten Erweiterung kann jedoch deren eigene Tabellen löschen."
COM_J2STORE_CLEANUP_POSTINSTALL_DOCS="Dokumentation: <strong>README.md</strong> im Komponenten-Ordner · Support: <a href='https://advans.ch' style='color:#2563eb'>advans.ch</a>"
