COM_APPOINTMENTS_MAIL_LINK_LABEL="%s :"
COM_APPOINTMENTS_CONFIG_REMOVAL_BLOCK_DESC="Explication juridique facultative en texte brut. Un motif bloque les demandes Joomla correspondantes et est affiché à l'administrateur. Il ne remplace pas votre politique et ne modifie ni l'effacement autonome ni la conservation automatique."
COM_APPOINTMENTS_CONFIG_AUDIT_RETENTION_DESC="Valeur obligatoire en années calendaires entières, 1-100 ; défaut 3. 'Rendez-vous : conservation' supprime les traces dont l'heure réelle précède strictement maintenant en UTC moins ce délai, pas depuis la fin de la réservation. 0 et une valeur vide sont invalides. Ces traces peuvent identifier l'administrateur responsable, jamais un invité ; ce réglage ne supprime ni réservations ni calendriers. Le journal séparé des calendriers Internet a un délai fixe de 12 mois et sa propre tâche 'Rendez-vous : journal des calendriers Internet'."
COM_APPOINTMENTS_FEEDS_TITLE="Flux de calendrier"
COM_APPOINTMENTS_FEEDS_PASSWORD_WARNING="Ces URL d’abonnement sont des mots de passe. Toute personne possédant une URL peut lire les détails des rendez-vous. Ne les partagez jamais, ne les envoyez pas par e-mail et ne les consignez pas dans les journaux. Le site n’enregistre qu’une empreinte de chaque clé d’accès, une URL n’est donc affichée qu’une seule fois, lorsqu’un renouvellement la génère. Le renouvellement révoque immédiatement l’ancienne URL."
COM_APPOINTMENTS_FEEDS_READ_ONLY="Les calendriers abonnés sont en lecture seule : supprimer une entrée n’annule pas sa réservation. Une actualisation toutes les 15 minutes est demandée, mais votre logiciel de calendrier détermine l’intervalle réel."
