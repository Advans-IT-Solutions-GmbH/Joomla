COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_FIX="Legen Sie die Aufgabe unter System, Geplante Aufgaben an und lassen Sie sie täglich laufen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE="Internetkalender: Prüfungen der eigenen Adresse"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE_OFF="Nicht ausgeführt. Nutzen Sie oben «Hosting prüfen»."
