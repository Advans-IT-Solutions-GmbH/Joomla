name: Build & Test - Joomla AJAX Forms

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plg_ajax_joomlaajaxforms/**'
      - 'shared/**'
      - '.github/workflows/joomla-ajax-forms.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plg_ajax_joomlaajaxforms/**'
      - 'shared/**'
      - '.github/workflows/joomla-ajax-forms.yml'

permissions: {}

env:
  # J2Commerce 6 publishes no release tags. The source is pinned to the commit
  # used in production (default branch as of 2026-08-28) so every run tests the
  # same J2Commerce 6 code instead of the moving default branch.
  J2C6_REF: '7edb6e11ae9148bf996b06c47a0d8266865af7b2'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tests use the package produced by build.sh, the same script the
      # publish workflow uses for the released ZIP.
      - name: Build extension
        run: |
          cd plg_ajax_joomlaajaxforms
          chmod +x build.sh
          ./build.sh
          ls -la plg_ajax_joomlaajaxforms_*.zip

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/plg_ajax_joomlaajaxforms_*.zip
          retention-days: 7

  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: ./

      - name: Validate XML manifest
        run: |
          cd plg_ajax_joomlaajaxforms
          echo "Validating joomlaajaxforms.xml..."
          grep -q '<extension type="plugin"' joomlaajaxforms.xml || (echo "Missing extension element" && exit 1)
          grep -q '<name>' joomlaajaxforms.xml || (echo "Missing name element" && exit 1)
          grep -q '<version>' joomlaajaxforms.xml || (echo "Missing version element" && exit 1)
          grep -q '<namespace' joomlaajaxforms.xml || (echo "Missing namespace element" && exit 1)
          echo "XML manifest is valid"

      - name: Validate PHP syntax
        run: |
          cd plg_ajax_joomlaajaxforms
          find . -name "*.php" -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: |
          cd plg_ajax_joomlaajaxforms
          node --check media/js/joomlaajaxforms.js

      - name: Check language files
        run: |
          cd plg_ajax_joomlaajaxforms
          for tag in en-GB de-DE fr-FR; do
            test -f "language/$tag/plg_ajax_joomlaajaxforms.ini" || (echo "Missing $tag ini file" && exit 1)
            test -f "language/$tag/plg_ajax_joomlaajaxforms.sys.ini" || (echo "Missing $tag sys.ini file" && exit 1)
          done
          echo "Language files are present"

  language-lint:
    name: Language Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Lint language files
        run: php shared/tests/lang-lint.php plg_ajax_joomlaajaxforms
      - name: Check compatibility requirements (Joomla 5.4+, PHP 8.1+)
        run: php shared/tests/requirements-check.php plg_ajax_joomlaajaxforms
      - name: Scan for deprecated Joomla APIs
        run: php shared/tests/deprecated-api-scan.php plg_ajax_joomlaajaxforms

  test-j5:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - AJAX Endpoint'
            script: 'ajax-endpoint'
          - name: '04 - Login'
            script: 'login'
          - name: '05 - Registration'
            script: 'registration'
          - name: '06 - Reset Request'
            script: 'reset-request'
          - name: '07 - Remind Request'
            script: 'remind-request'
          - name: '08 - Security'
            script: 'security'
          - name: '10 - Profile'
            script: 'profile'
          - name: '12 - Htaccess Check'
            script: 'htaccess-check'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '09 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/tests/
      - name: Rename package
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          mv plg_ajax_joomlaajaxforms_*.zip extension.zip
      - name: Start test environment
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          timeout 300 bash -c 'until docker exec plg_ajax_joomlaajaxforms_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          chmod +x run-tests.sh
          ./run-tests.sh "$SUITE"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: j5-${{ matrix.script }}-logs
          path: plg_ajax_joomlaajaxforms/tests/test-results/*.txt
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          docker compose down -v

  test-j6:
    name: ${{ matrix.name }} (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - AJAX Endpoint'
            script: 'ajax-endpoint'
          - name: '04 - Login'
            script: 'login'
          - name: '05 - Registration'
            script: 'registration'
          - name: '06 - Reset Request'
            script: 'reset-request'
          - name: '07 - Remind Request'
            script: 'remind-request'
          - name: '08 - Security'
            script: 'security'
          - name: '10 - Profile'
            script: 'profile'
          - name: '12 - Htaccess Check'
            script: 'htaccess-check'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '09 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/tests/
      - name: Rename package
        run: mv plg_ajax_joomlaajaxforms/tests/plg_ajax_joomlaajaxforms_*.zip plg_ajax_joomlaajaxforms/tests/extension.zip
      - name: Start environment (J6)
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec plg_ajax_joomlaajaxforms_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          chmod +x run-tests.sh
          CONTAINER_NAME=plg_ajax_joomlaajaxforms_j6_test ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: j6-${{ matrix.script }}-logs
          path: plg_ajax_joomlaajaxforms/tests/test-results/*.txt
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          docker compose -f docker-compose.joomla6.yml down -v

  test-j2c4-full:
    name: ${{ matrix.name }} (J5+J2C4)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - AJAX Endpoint'
            script: 'ajax-endpoint'
          - name: '04 - Login'
            script: 'login'
          - name: '05 - Registration'
            script: 'registration'
          - name: '06 - Reset Request'
            script: 'reset-request'
          - name: '07 - Remind Request'
            script: 'remind-request'
          - name: '08 - Security'
            script: 'security'
          - name: '10 - Profile'
            script: 'profile'
          - name: '11 - J2Store Cart'
            script: 'j2store-cart'
          - name: '13 - Shop Detection'
            script: 'shop-detection'
          - name: '12 - htaccess Check'
            script: 'htaccess-check'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '09 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/tests-j2c4/
      - name: Rename package
        run: mv plg_ajax_joomlaajaxforms/tests-j2c4/plg_ajax_joomlaajaxforms_*.zip plg_ajax_joomlaajaxforms/tests-j2c4/extension.zip
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build \
              -f plg_ajax_joomlaajaxforms/tests-j2c4/Dockerfile \
              --build-arg J2C4_URL=https://github.com/j2commerce/j2cart/releases/download/v4.1.4/com_j2store_v4-4.1.4-pro.zip \
              -t plg_ajax_j2c4_test \
              .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker build failed after $attempt attempts"
              exit 1
            fi
            echo "docker build failed (likely a transient registry error); retrying ($attempt/3)"
            sleep 20
          done
      - name: Start environment
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c4
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          timeout 360 bash -c 'until docker exec plg_ajax_j2c4_test cat /var/www/html/health.txt 2>/dev/null | grep -q OK; do sleep 5; done'
      - name: Show container logs
        if: always()
        run: docker logs plg_ajax_j2c4_test 2>&1 | tail -80 || true
      - name: Run ${{ matrix.name }}
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c4
          ./run-tests.sh "$SUITE"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: j2c4-${{ matrix.script }}-logs
          path: plg_ajax_joomlaajaxforms/tests-j2c4/test-results/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c4
          docker compose down -v

  test-j2c6-full:
    name: ${{ matrix.name }} (J6+J2C6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - AJAX Endpoint'
            script: 'ajax-endpoint'
          - name: '04 - Login'
            script: 'login'
          - name: '05 - Registration'
            script: 'registration'
          - name: '06 - Reset Request'
            script: 'reset-request'
          - name: '07 - Remind Request'
            script: 'remind-request'
          - name: '08 - Security'
            script: 'security'
          - name: '10 - Profile'
            script: 'profile'
          - name: '11 - J2Store Cart'
            script: 'j2store-cart'
          - name: '13 - Shop Detection'
            script: 'shop-detection'
          - name: '12 - htaccess Check'
            script: 'htaccess-check'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '09 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/tests-j2c6/
      - name: Rename package
        run: mv plg_ajax_joomlaajaxforms/tests-j2c6/plg_ajax_joomlaajaxforms_*.zip plg_ajax_joomlaajaxforms/tests-j2c6/extension.zip
      - name: Setup PHP for J2Commerce build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
      - name: Build J2Commerce 6 from source (pinned)
        run: |
          git init /tmp/j2commerce6-src
          git -C /tmp/j2commerce6-src remote add origin https://github.com/j2commerce/j2commerce.git
          git -C /tmp/j2commerce6-src fetch --depth 1 origin "$J2C6_REF"
          git -C /tmp/j2commerce6-src checkout --detach FETCH_HEAD
          echo "J2Commerce 6 source commit (pinned $J2C6_REF): $(git -C /tmp/j2commerce6-src rev-parse HEAD)"
          # The pinned J2Commerce 6 build minifies assets with esbuild (npm) unless --no-minify is passed;
          # the tests only need the PHP package, so the unminified build is used.
          cd /tmp/j2commerce6-src && php build/build_package.php --no-minify
          ZIP=$(ls docs/packages/pkg_j2commerce_*.zip docs/packages/com_j2commerce_*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "ERROR: No J2Commerce 6 ZIP found" && ls docs/packages/ && exit 1
          sha256sum "$ZIP"
          cp "$ZIP" "$GITHUB_WORKSPACE/plg_ajax_joomlaajaxforms/tests-j2c6/j2commerce6.zip"
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build \
              -f plg_ajax_joomlaajaxforms/tests-j2c6/Dockerfile \
              -t plg_ajax_j2c6_test \
              .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker build failed after $attempt attempts"
              exit 1
            fi
            echo "docker build failed (likely a transient registry error); retrying ($attempt/3)"
            sleep 20
          done
      - name: Start environment
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          timeout 360 bash -c 'until docker exec plg_ajax_j2c6_test cat /var/www/html/health.txt 2>/dev/null | grep -q OK; do sleep 5; done'
      - name: Show container logs
        if: always()
        run: docker logs plg_ajax_j2c6_test 2>&1 | tail -80 || true
      - name: Run ${{ matrix.name }}
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          ./run-tests.sh "$SUITE"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: j2c6-${{ matrix.script }}-logs
          path: plg_ajax_joomlaajaxforms/tests-j2c6/test-results/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          docker compose down -v

  test-production:
    name: Production-like (newest J6, PHP 8.4, MariaDB 10.6, J2C6 production pin)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: plg_ajax_joomlaajaxforms/tests-j2c6/
      - name: Rename package
        run: mv plg_ajax_joomlaajaxforms/tests-j2c6/plg_ajax_joomlaajaxforms_*.zip plg_ajax_joomlaajaxforms/tests-j2c6/extension.zip
      - name: Setup PHP for J2Commerce build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
      - name: Build J2Commerce 6 from the production pin
        run: |
          git init /tmp/j2commerce6-src
          git -C /tmp/j2commerce6-src remote add origin https://github.com/j2commerce/j2commerce.git
          git -C /tmp/j2commerce6-src fetch --depth 1 origin "$J2C6_REF"
          git -C /tmp/j2commerce6-src checkout --detach FETCH_HEAD
          # The pinned J2Commerce 6 build minifies assets with esbuild (npm) unless --no-minify is passed;
          # the tests only need the PHP package, so the unminified build is used.
          cd /tmp/j2commerce6-src && php build/build_package.php --no-minify
          ZIP=$(ls docs/packages/pkg_j2commerce_*.zip docs/packages/com_j2commerce_*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "ERROR: No J2Commerce 6 ZIP found" && exit 1
          cp "$ZIP" "$GITHUB_WORKSPACE/plg_ajax_joomlaajaxforms/tests-j2c6/j2commerce6.zip"
      - name: Build image (PHP 8.4, deprecations logged)
        run: |
          for attempt in 1 2 3; do
            if docker build \
              -f plg_ajax_joomlaajaxforms/tests-j2c6/Dockerfile \
              --build-arg JOOMLA_BASE_IMAGE=joomla:6-php8.4-apache \
              --build-arg PHP_STRICT_DEPRECATIONS=1 \
              -t plg_ajax_j2c6_test \
              .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker build failed after $attempt attempts"
              exit 1
            fi
            echo "docker build failed (likely a transient registry error); retrying ($attempt/3)"
            sleep 20
          done
      - name: Start environment (MariaDB 10.6)
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose down -v || true
            sleep 20
          done
          timeout 420 bash -c 'until docker exec plg_ajax_j2c6_test cat /var/www/html/health.txt 2>/dev/null | grep -q OK; do sleep 5; done'
          docker exec plg_ajax_j2c6_test php -v
      - name: Show container logs
        if: always()
        run: docker logs plg_ajax_j2c6_test 2>&1 | tail -80 || true
      - name: Arm deprecation tracing
        run: |
          docker exec plg_ajax_j2c6_test mkdir -p /var/www/html/tests/scripts
          for f in shared-test-helpers.php shared-deprecation-tracer.php shared-deprecations.php; do
            docker cp shared/tests/scripts/$f plg_ajax_j2c6_test:/var/www/html/tests/scripts/
          done
          docker exec plg_ajax_j2c6_test php /var/www/html/tests/scripts/shared-deprecations.php --arm
      - name: Run all suites
        env:
          TEST_STRICT_SKIP: '1'
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          ./run-tests.sh all
      - name: Evaluate PHP deprecations
        if: always()
        run: |
          docker exec -e TEST_STRICT_SKIP=1 plg_ajax_j2c6_test \
            php /var/www/html/tests/scripts/shared-deprecations.php
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-logs
          path: plg_ajax_joomlaajaxforms/tests-j2c6/test-results/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests-j2c6
          docker compose down -v

  test-update:
    name: Update from previous release (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: /tmp/new-package/
      - name: Build the previous release from git
        run: |
          # Older release tags are deleted by the publish workflow, so the
          # previous version is rebuilt from the last release commit on main.
          REF=$(git rev-parse --verify -q origin/main || git rev-parse HEAD)
          PREVIOUS=$(git log "$REF" --grep '^release: ajaxforms v' -n 1 --format=%H)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::No release commit found for ajaxforms"
            exit 1
          fi
          echo "Previous release commit: $PREVIOUS ($(git log -1 --format=%s "$PREVIOUS"))"
          git worktree add /tmp/previous "$PREVIOUS"
          (cd /tmp/previous/plg_ajax_joomlaajaxforms && chmod +x build.sh && ./build.sh)
          cp /tmp/previous/plg_ajax_joomlaajaxforms/plg_ajax_joomlaajaxforms_*.zip plg_ajax_joomlaajaxforms/tests/extension.zip
      - name: Start environment with the previous release (J6)
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          timeout 300 bash -c 'until docker exec plg_ajax_joomlaajaxforms_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
      - name: Update to the package under test
        run: |
          C=plg_ajax_joomlaajaxforms_j6_test
          NEW_PACKAGE=$(ls /tmp/new-package/plg_ajax_joomlaajaxforms_*.zip | head -1)
          docker cp "$NEW_PACKAGE" "$C:/tmp/extension-new.zip"
          docker exec "$C" mkdir -p /var/www/html/tests/scripts
          docker cp shared/tests/scripts/shared-test-helpers.php "$C:/var/www/html/tests/scripts/"
          docker cp shared/tests/scripts/shared-update-from-previous.php "$C:/var/www/html/tests/scripts/"
          docker exec -e TEST_STRICT_SKIP=1 "$C" php /var/www/html/tests/scripts/shared-update-from-previous.php
      - name: Show container logs
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Cleanup
        if: always()
        run: |
          cd plg_ajax_joomlaajaxforms/tests
          docker compose -f docker-compose.joomla6.yml down -v

  official-j5-j2c4:
    name: Ajax Forms / official-j5-j2c4
    runs-on: ubuntu-latest
    needs: test-j2c4-full
    if: always()
    permissions: {}
    steps:
      - name: Verify official J5/J2C4 matrix
        env:
          RESULT: ${{ needs.test-j2c4-full.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Official J5/J2C4 matrix did not pass: $RESULT"
            exit 1
          fi

  official-j6-j2c6:
    name: Ajax Forms / official-j6-j2c6
    runs-on: ubuntu-latest
    needs: test-j2c6-full
    if: always()
    permissions: {}
    steps:
      - name: Verify official J6/J2C6 matrix
        env:
          RESULT: ${{ needs.test-j2c6-full.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Official J6/J2C6 matrix did not pass: $RESULT"
            exit 1
          fi

  # Result of this workflow. Deliberately not named "Collect Results": that
  # required check is produced only by collect-results.yml.
  all-jobs:
    name: Ajax Forms / all jobs
    runs-on: ubuntu-latest
    needs:
      - build
      - validate
      - language-lint
      - test-j5
      - test-j6
      - test-j2c4-full
      - test-j2c6-full
      - test-production
      - test-update
      - official-j5-j2c4
      - official-j6-j2c6
    if: always()
    permissions:
      actions: read
    steps:
      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: test-artifacts/
      - name: Collect and display logs
        run: |
          echo "=== Test Results Summary ==="
          for dir in test-artifacts/*/; do
            if [ -d "$dir" ]; then
              echo ""
              echo "--- $(basename "$dir") ---"
              find "$dir" -name "*.txt" -exec cat {} \;
            fi
          done
      - name: Upload combined logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: all-test-logs
          path: test-artifacts/
          retention-days: 30
      - name: Fail unless every job succeeded
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # failure, cancelled and skipped all count as not passed
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
