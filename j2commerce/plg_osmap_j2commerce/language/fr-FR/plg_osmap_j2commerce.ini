PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Ajoute automatiquement tous les produits J2Commerce activés au sitemap OSMap."

; Paramètres du plugin
PLG_OSMAP_PRIORITY_LABEL="Priorité"
PLG_OSMAP_PRIORITY_DESC="Priorité du sitemap pour les pages produits (0.0–1.0). Défaut : 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Fréquence de modification"
PLG_OSMAP_CHANGEFREQ_DESC="Fréquence probable de modification des pages produits."

; Message post-installation
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce : Installation terminée"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_LABEL="Étape 1"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Activer le plugin"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>Système → Gérer → Plugins</strong> → rechercher <strong>OSMap - J2Commerce</strong> → activer."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_LABEL="Étape 2"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Configurer OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="Dans OSMap (<strong>Composants → OSMap</strong>), ouvrez votre sitemap et assurez-vous que le menu contenant votre boutique est sélectionné. Le plugin détectera automatiquement tous les produits J2Commerce activés."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_LABEL="Étape 3"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Régénérer le sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Accédez à l'URL de votre sitemap (ex. <strong>/sitemap</strong>) ou cliquez sur <strong>Actualiser</strong> dans OSMap. Les produits visibles publiquement (publiés et accessibles aux invités) apparaîtront sous forme d'URLs <code>/boutique/alias-produit</code> (sur un site multilingue, chaque URL porte le préfixe SEF de langue de l'élément de menu, ex. <code>/de/boutique/alias-produit</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin activé (Système → Gérer → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Élément de menu boutique sélectionné dans le sitemap OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap régénéré et URLs produits visibles"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Liste de contrôle"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Documentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Notices de l'installateur
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce a été mis à jour vers la version %s."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) n'est pas installé. Ce plugin fonctionne uniquement avec OSMap ; installez OSMap pour générer un sitemap."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Ni J2Commerce 6 (com_j2commerce) ni J2Store/J2Commerce 4 (com_j2store) n'est installé et activé. Aucun produit n'est ajouté au sitemap tant que l'un des deux n'est pas disponible."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="L'ancien plugin OSMap pour J2Store (osmap/j2store) a été désactivé, car ce plugin le remplace."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="L'ancien plugin OSMap pour J2Store (osmap/j2store) n'a pas pu être désactivé : %s. Désactivez-le manuellement sous Système → Gérer → Plugins."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="Le fichier OSMap %s a été corrigé afin que Factory::getTable() ne renvoie plus false (compatibilité PHP 8.1+)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="Le fichier OSMap %s n'a pas pu être lu ou écrit ; le correctif de compatibilité PHP 8.1+ n'a pas été appliqué. Mettez OSMap à jour vers la version 5.1.4 ou ultérieure."
