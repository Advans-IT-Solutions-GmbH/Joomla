COM_APPOINTMENTS_MENU_FIELD_BACK_TARGET_DESC="Où mène le bouton, y compris sur la confirmation et sur les pages ouvertes par les liens des e-mails. Sans choix, ou pour un élément de menu que le visiteur ne peut pas ouvrir, il mène à la liste de tous les types de rendez-vous. Les alias, titres, séparateurs et URL externes ne sont pas utilisés."
