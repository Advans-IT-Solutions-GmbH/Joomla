COM_APPOINTMENTS_CONFIG_CONSENT="Informationen zu Buchungsdaten"
COM_APPOINTMENTS_CONFIG_CONSENT_DESC="Erläutern Sie, welche Personendaten Sie wofür erfassen. Der Text steht beim Datenschutzhinweis. Dies ersetzt Ihre Datenschutzerklärung nicht."
COM_APPOINTMENTS_CONFIG_CONSENT_MODE="Datenschutzhinweis im Buchungsformular"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_DESC="«Nur Hinweis» zeigt den Datenschutzhinweis mit Link in der Infospalte, ohne Kontrollkästchen. «Kenntnisnahme bestätigen» verlangt ein Kontrollkästchen, dass die Person den Hinweis zur Kenntnis genommen hat, gespeichert wird nichts. «Einwilligung einholen» verlangt ein Kontrollkästchen für die Einwilligung und speichert bei der Buchung Zeitpunkt und Version des Wortlauts als Nachweis. Wählen Sie die Einwilligung nur, wenn Ihre Bearbeitung auf einer Einwilligung beruht."
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_NOTICE="Nur Hinweis"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_ACKNOWLEDGE="Kenntnisnahme bestätigen"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_CONSENT="Einwilligung einholen"
COM_APPOINTMENTS_CONFIG_PRIVACY_URL="URL der Datenschutzerklärung"
COM_APPOINTMENTS_CONFIG_PRIVACY_URL_DESC="Adresse Ihrer Datenschutzerklärung, auch relativ wie /datenschutz#termine. Gilt, wenn unten kein Menüeintrag gewählt ist. Der Datenschutzhinweis und die Beschriftung des Kontrollkästchens verlinken darauf."
COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM="Menüeintrag der Datenschutzerklärung"
COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM_DESC="Menüeintrag Ihrer Datenschutzerklärung. Hat Vorrang vor der URL und folgt auf mehrsprachigen Websites den Sprachzuordnungen. Der Datenschutzhinweis und die Beschriftung des Kontrollkästchens verlinken darauf."
COM_APPOINTMENTS_CONFIG_PRIVACY_ANCHOR="Sprungmarke im Menüeintrag"
COM_APPOINTMENTS_CONFIG_PRIVACY_ANCHOR_DESC="Optionale Sprungmarke des Datenschutzabschnitts auf der Seite des Menüeintrags, ohne #, zum Beispiel datenschutz."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY="Vorgewählte Landesvorwahl"
COM_APPOINTMENTS_CONFIG_MAX_GUESTS="Höchstzahl weiterer Gäste"
COM_APPOINTMENTS_CONFIG_MAX_GUESTS_DESC="Wie viele weitere E-Mail-Adressen eine buchende Person höchstens angeben kann, von 0 bis 50. Mit 0 zeigt das Buchungsformular kein Feld für Gäste."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_DESC="In Telefonfeldern vorgewählte Landesvorwahl, nur Ziffern, zum Beispiel 41 oder 49. Leer: Die Besucherin oder der Besucher wählt."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE="Wahl der Landesvorwahl"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_DESC="Ob die buchende Person die Landesvorwahl ihrer Telefonnummer selbst wählt. «Nur die vorgewählte Vorwahl» gilt nur, wenn oben eine gültige Landesvorwahl eingetragen ist. Dann nehmen alle Telefonfelder nur Nummern mit dieser Vorwahl an, auch eine mit + oder 00 eingetippte Nummer."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FREE="Besuchende wählen die Vorwahl"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FIXED="Nur die vorgewählte Vorwahl"
COM_APPOINTMENTS_CONFIG_ERASE_MODE="Bei Datenlöschung"
COM_APPOINTMENTS_CONFIG_ERASE_MODE_DESC="Anonymisieren (Standard) entfernt Daten der eingeladenen Personen, Gäste, Zusatzfelder und Konferenz, behält aber die Buchung als Statistik. Löschen entfernt die ganze Buchungszeile. Der Nachweis enthält den tatsächlichen UTC-Verarbeitungszeitpunkt, nicht das Fristende; bei Anonymisierung steht dieser Zeitpunkt auch in der verbleibenden Zeile. Beide entfernen verknüpfte Kalenderkopien. Eine ausdrückliche Löschung sagt auch zukünftige Buchungen ab; altersbasierte Aufbewahrung wählt diese nicht aus. Bereits anonymisierte Zeilen werden nicht erneut automatisch verarbeitet."
COM_APPOINTMENTS_CONFIG_ERASE_ANONYMISE="Anonymisierten Termin behalten"
COM_APPOINTMENTS_CONFIG_ERASE_DELETE="Buchung vollständig löschen"
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS="Erinnerungsvorlaufzeiten (Minuten)"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL="Öffentliche Website-URL"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL_DESC="Kanonische HTTP(S)-Basis-URL, gegebenenfalls mit Joomla-Unterverzeichnis, ohne Abfrage oder Fragment. Erforderlich: Ohne sie und ohne live_site in Joomla versendet die Komponente keine E-Mails und nimmt keine Buchungen an. E-Mail-Links werden nie aus der Adresse einer Anfrage gebildet."
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS_DESC="Durch Kommas getrennte Minuten vor einem bestätigten Termin, jeweils zwischen 1 und 525600. Standard: 1440,60. Leer lassen, um Erinnerungen zu deaktivieren. Der Scheduler muss die Erinnerungsaufgabe ausführen."
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS="Buchungsaufbewahrung (Tage)"
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS_DESC="Pflichtwert in ganzen Tagen, 0-65535; Standard 365. Die Aufgabe 'Termine: Aufbewahrung' verarbeitet noch nicht anonymisierte Buchungen, deren Ende strikt vor UTC-jetzt minus dieser Frist liegt, auch abgesagte Buchungen. 0 verarbeitet bereits beendete Buchungen beim nächsten Aufgabenlauf und bedeutet nicht unbegrenzt. Ein leeres Terminart-Feld (NULL) erbt diesen Wert. 'Bei Datenlöschung' bestimmt Anonymisierung oder vollständige Buchungslöschung. Zukünftige und in die Zukunft verschobene Buchungen werden nicht ausgewählt. Kalenderobjekte und Löschnachweise haben getrennte Fristen."
COM_APPOINTMENTS_CONFIG_RETENTION_TASKS_DESC="Buchungsdaten, Kalenderobjekte und Protokolle haben getrennte Lebenszyklen. Richten Sie in Joomlas geplanten Aufgaben 'Termine: Aufbewahrung', 'Termine: Aufbewahrung der Internetkalender' und 'Termine: Protokoll der Internetkalender' nach Bedarf ein und aktivieren Sie sie. Das Aufgaben-Plugin für Termine muss aktiv sein und Scheduler regelmässig tatsächlich ausgelöst werden, z.B. durch Cron. Speichern führt keine Bereinigung aus. Die Standards sind Softwareeinstellungen, keine Empfehlung zu gesetzlichen Aufbewahrungsfristen."
