COM_APPOINTMENTS_CONFIG_CONSENT="Information sur les données de réservation"
COM_APPOINTMENTS_CONFIG_CONSENT_DESC="Expliquez quelles données personnelles vous recueillez et pourquoi. Le texte accompagne la mention de confidentialité. Ce texte ne remplace pas votre politique de confidentialité."
COM_APPOINTMENTS_CONFIG_CONSENT_MODE="Mention de confidentialité du formulaire de réservation"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_DESC="« Mention seule » affiche la mention de confidentialité avec son lien dans la colonne d'information, sans case à cocher. « Confirmer la prise de connaissance » exige une case attestant que la personne a pris connaissance de la mention, rien n'est enregistré. « Demander le consentement » exige une case de consentement et enregistre avec la réservation l'heure et la version du texte comme preuve. Ne choisissez le consentement que si votre traitement repose sur un consentement."
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_NOTICE="Mention seule"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_ACKNOWLEDGE="Confirmer la prise de connaissance"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_CONSENT="Demander le consentement"
COM_APPOINTMENTS_CONFIG_PRIVACY_URL="URL de la politique de confidentialité"
COM_APPOINTMENTS_CONFIG_PRIVACY_URL_DESC="Adresse de votre politique de confidentialité, aussi relative comme /rgpd#rendez-vous. Utilisée si aucun élément de menu n'est choisi ci-dessous. La mention de confidentialité et le libellé de la case y renvoient."
COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM="Élément de menu de la politique de confidentialité"
COM_APPOINTMENTS_CONFIG_PRIVACY_MENUITEM_DESC="Élément de menu de votre politique de confidentialité. Prime sur l'URL et suit les associations de langue d'un site multilingue. La mention de confidentialité et le libellé de la case y renvoient."
COM_APPOINTMENTS_CONFIG_PRIVACY_ANCHOR="Ancre dans l'élément de menu"
COM_APPOINTMENTS_CONFIG_PRIVACY_ANCHOR_DESC="Ancre facultative de la section sur la confidentialité dans la page de l'élément de menu, sans #, par exemple rgpd."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY="Indicatif présélectionné"
COM_APPOINTMENTS_CONFIG_MAX_GUESTS="Nombre maximal d'invités supplémentaires"
COM_APPOINTMENTS_CONFIG_MAX_GUESTS_DESC="Nombre maximal d'adresses e-mail supplémentaires que la personne qui réserve peut indiquer, de 0 à 50. Avec 0, le formulaire de réservation n'affiche aucun champ pour les invités."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_DESC="Indicatif de pays présélectionné dans les champs de téléphone, chiffres uniquement, par exemple 41 ou 33. Vide : le visiteur choisit."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE="Choix de l'indicatif"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_DESC="Indique si la personne qui réserve choisit l'indicatif de son numéro de téléphone. « Seulement l'indicatif présélectionné » ne s'applique que si un indicatif valide est saisi ci-dessus. Tous les champs de téléphone n'acceptent alors que des numéros avec cet indicatif, y compris un numéro saisi avec + ou 00."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FREE="Le visiteur choisit l'indicatif"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FIXED="Seulement l'indicatif présélectionné"
COM_APPOINTMENTS_CONFIG_ERASE_MODE="Lors de l'effacement"
COM_APPOINTMENTS_CONFIG_ERASE_MODE_DESC="Anonymiser (par défaut) efface les données des invités, des participants supplémentaires, des champs personnalisés et de la conférence, mais conserve le créneau statistique. Supprimer efface toute la ligne de réservation. La trace porte l'heure UTC réelle du traitement, pas l'échéance ; l'anonymisation inscrit aussi cette heure dans la ligne conservée. Les deux retirent les copies liées dans les calendriers. Un effacement explicite annule aussi les réservations futures ; la conservation par âge ne les sélectionne pas. Les lignes déjà anonymisées ne sont pas retraitées automatiquement."
COM_APPOINTMENTS_CONFIG_ERASE_ANONYMISE="Conserver un créneau anonymisé"
COM_APPOINTMENTS_CONFIG_ERASE_DELETE="Supprimer entièrement la réservation"
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS="Délais des rappels (minutes)"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL="URL publique du site"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL_DESC="URL HTTP(S) canonique, avec le sous-répertoire Joomla si nécessaire, sans requête ni fragment. Requise pour les rappels CLI sauf si live_site est défini. Les requêtes web utilisent sinon la racine actuelle du site."
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS_DESC="Minutes avant un rendez-vous confirmé, séparées par des virgules, entre 1 et 525600 chacune. Par défaut : 1440,60. Laissez vide pour désactiver les rappels. La tâche du planificateur doit être active."
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS="Conservation des réservations (jours)"
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS_DESC="Valeur obligatoire en jours entiers, 0-65535 ; défaut 365. La tâche 'Rendez-vous : conservation' traite les réservations non encore anonymisées dont la fin précède strictement maintenant en UTC moins ce délai, y compris les réservations annulées. 0 traite les réservations déjà terminées à la prochaine exécution, sans signifier une conservation illimitée. Un champ vide dans le type (NULL) hérite de cette valeur. 'Lors de l'effacement' choisit l'anonymisation ou la suppression complète. Les réservations futures, même déplacées vers l'avenir, ne sont pas sélectionnées. Les objets de calendrier et les traces d'effacement ont des délais séparés."
COM_APPOINTMENTS_CONFIG_RETENTION_TASKS_DESC="Les réservations, les objets de calendrier et les journaux ont des cycles indépendants. Dans les tâches planifiées de Joomla, configurez et activez selon vos besoins 'Rendez-vous : conservation', 'Rendez-vous : conservation des calendriers Internet' et 'Rendez-vous : journal des calendriers Internet'. Le plugin de tâches Rendez-vous doit être activé et Scheduler réellement déclenché régulièrement, p.ex. par cron. Enregistrer ces réglages ne lance aucun nettoyage. Les défauts sont des réglages logiciels, pas une recommandation de conservation légale."
