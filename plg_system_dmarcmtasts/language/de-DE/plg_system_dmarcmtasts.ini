PLG_SYSTEM_DMARCMTASTS="System - DMARC MTA-STS Policy"
PLG_SYSTEM_DMARCMTASTS_XML_DESCRIPTION="Liefert die MTA-STS-Richtlinie (RFC 8461) für die konfigurierten Domains unter /.well-known/mta-sts.txt, erzeugt aus den Einstellungen der DMARC-Reports-Komponente."
PLG_SYSTEM_DMARCMTASTS_ENABLE_HINT="Das Plugin ist deaktiviert. Aktivieren Sie es unter <strong>System → Verwalten → Plugins</strong> (suchen Sie nach <strong>System - DMARC MTA-STS Policy</strong>), damit der Richtlinien-Endpunkt antworten kann."
PLG_SYSTEM_DMARCMTASTS_POSTINSTALL_INTRO="Das MTA-STS-Policy-Plugin ist installiert und aktiviert. Schalten Sie MTA-STS ein und hinterlegen Sie Ihre Mail-Hosts unter <strong>Komponenten → DMARC Reports → Optionen</strong> und veröffentlichen Sie anschliessend die vom Aktionszentrum angezeigten DNS-Einträge, damit der Richtlinien-Endpunkt erreichbar ist."
