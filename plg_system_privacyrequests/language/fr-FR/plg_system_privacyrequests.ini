PLG_SYSTEM_PRIVACYREQUESTS="Système - Demandes de confidentialité"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="Confirmation par courriel sans compte pour les demandes de suppression dans Joomla Confidentialité. Activer explicitement et publier le lien vers la page publique. Les autorisations administrateur et les blocages des plugins restent applicables."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Demander la suppression de données personnelles"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="Aucun compte n'est nécessaire. Saisissez votre adresse pour demander un code, ou le code reçu par courriel pour confirmer la demande. Redemandez un code expiré ; la demande en attente conserve sa date de réception initiale."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Code de confirmation (reçu par courriel)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Demander ou renouveler le code"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Confirmer la demande"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="Si cette adresse est acceptée pour traitement, une demande Core est enregistrée ou une demande existante conservée. Cette réponse ne confirme ni réception, ni envoi du courriel, ni confirmation, ni effacement. Vérifiez vos courriels ; sans code, réessayez plus tard ou contactez l'exploitant par un autre moyen. Les envois répétés peuvent être limités."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Demande de confidentialité : échec de l'envoi de confirmation"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="L'envoi de confirmation de la demande Core %d a échoué. Sa date de réception et son état en attente sont conservés. Vérifiez la demande native et la configuration du courrier. Rétablissez l'envoi à l'adresse initiale, puis renouvelez le code par le formulaire invité. Le contact permet la communication et une évaluation proportionnée, pas la confirmation de cette demande Core. Joomla ne fournit aucune action manuelle prise en charge pour confirmer un destinataire initial rejeté. Conservez la demande en attente ; ne remplacez pas l'adresse et ne forcez ni confirmation ni clôture."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="L'envoi de confirmation a échoué. La demande Core en attente et sa date initiale sont conservées ; ni livraison ni identité ne sont prouvées. La comparaison Unicode exacte ne garantit pas l'envoi Joomla avec Unicode avant @. Utilisez le contact opérateur pour communiquer et effectuer une évaluation proportionnée. Le contact ou une autre adresse de réponse ne confirme pas cette demande. Le Core ne fournit aucune confirmation manuelle prise en charge pour un destinataire initial rejeté : conservez la demande en attente jusqu'au fonctionnement de la confirmation à cette adresse. Ne contournez ni confirmation, ni suppression, ni clôture."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Votre demande est confirmée pour traitement par l'administration. Cela confirme l'accès à cette adresse, pas toute identité ou tout droit. Cette confirmation n'a supprimé aucune donnée."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="Ce code a expiré, pas votre droit ni la demande initiale. Demandez un nouveau code ici ou contactez l'exploitant pour une autre méthode de confirmation."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="La demande n'a pas pu être confirmée. Vérifiez l'adresse et le code ou réessayez plus tard. Vous pouvez renouveler le code ou contacter l'exploitant."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Saisissez une adresse valable de 100 caractères au maximum. Les adresses contenant des trémas ou d'autres caractères spéciaux avant le @ ne sont pas acceptées, comme partout dans Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="Le service n'a pas pu terminer cette opération. Ne présumez ni réception ni confirmation. Réessayez plus tard ou contactez l'exploitant par un autre moyen."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="L'opération ne peut pas démarrer en toute sécurité. Une autre opération est peut-être en cours. Ne présumez ni suppression ni clôture ; réessayez plus tard ou consultez le journal d'administration."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Nouvelle tentative de suppression bloquée : vérifiez et confirmez d'abord la correction de la tentative incomplète précédente. Cocher la case ne répare pas les données restantes."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="L'administration vérifie l'identité, le périmètre et les obligations de conservation avant toute suppression. L'automatisation couvre uniquement les plugins participants. Les copies dans les courriels, clients de calendrier, CRM, sauvegardes et autres systèmes externes nécessitent un examen séparé ; les journaux et preuves conservés ne signifient pas que tout a été effacé."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="Le compte choisi par Joomla ne correspond pas exactement à l'adresse demandée. Résolvez cette différence avant la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Confirmez cette demande sans compte avec l'adresse et le code sur la page publique."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="J'ai vérifié le périmètre et la réponse à la personne"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Avant de relancer la suppression, j'ai vérifié la résolution du nettoyage partiel précédent"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="À utiliser uniquement après résolution et vérification indépendantes des erreurs précédentes, y compris les copies introuvables par l'adresse initiale. Ne contourne ni erreurs actuelles, ni contenu illisible, ni blocages légaux. Ne clôture pas la demande."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Avant de terminer, exécutez la suppression sans avertissement non résolu. Vérifiez les plugins participants, les preuves d'identité supplémentaires, les preuves conservées et les copies externes. La clôture Core documente le traitement, pas une suppression universelle."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Clôture bloquée : exécutez d'abord la suppression sans avertissement non résolu, puis vérifiez explicitement le périmètre et la réponse. Un callback exécuté ne prouve pas une suppression complète."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Chemin de contact de l'exploitant"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Obligatoire avant activation : une page de contact Joomla locale et publique existante, commençant par index.php, par exemple index.php?option=com_contact&view=contact&id=42. Utilisez l'identifiant réel et testez sans compte. Aucune URL externe, redirection ou ancre. Le contact ne confirme ni ne clôture une demande Core."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Contacter l'exploitant du site"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Utilisez ce contact si aucun code n'arrive ou si Joomla ne peut pas écrire à votre adresse initiale. Indiquez exactement cette adresse. Une autre adresse de réponse sert uniquement à communiquer et ne prouve pas l'accès à cette boîte. Le contact seul ne confirme pas la demande Core et n'autorise pas la suppression."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="Aucun lien de contact n'est configuré ici. Utilisez les coordonnées de l'exploitant dans les mentions légales ou la politique de confidentialité du site. Ne présumez pas que cette page a reçu ou confirmé votre demande."
