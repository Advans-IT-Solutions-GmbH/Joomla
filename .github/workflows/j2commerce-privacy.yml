name: Build & Test - J2Commerce Privacy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'j2commerce/plg_privacy_j2commerce/**'
      - 'shared/**'
      - '.github/workflows/j2commerce-privacy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'j2commerce/plg_privacy_j2commerce/**'
      - 'shared/**'
      - '.github/workflows/j2commerce-privacy.yml'

permissions: {}

env:
  # J2Commerce 6 publishes no release tags. The source is pinned to the commit
  # used in production (default branch as of 2026-08-28) so every run tests the
  # same J2Commerce 6 code instead of the moving default branch.
  J2C6_REF: '7edb6e11ae9148bf996b06c47a0d8266865af7b2'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd j2commerce/plg_privacy_j2commerce
          chmod +x build.sh
          ./build.sh
          mkdir -p tests
          cp *.zip tests/extension.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-package
          path: j2commerce/plg_privacy_j2commerce/tests/extension.zip
          retention-days: 1

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          # xargs exits non-zero as soon as one file fails; `find -exec \;` would not.
          find j2commerce/plg_privacy_j2commerce -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  language-lint:
    name: Language Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Lint language files
        run: php shared/tests/lang-lint.php j2commerce/plg_privacy_j2commerce
      - name: Check compatibility requirements (Joomla 5.4+, PHP 8.1+)
        run: php shared/tests/requirements-check.php j2commerce/plg_privacy_j2commerce
      - name: Scan for deprecated Joomla APIs
        run: php shared/tests/deprecated-api-scan.php j2commerce/plg_privacy_j2commerce

  test-j5:
    name: ${{ matrix.name }} (J5)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - Privacy Plugin Base'
            script: 'privacy'
          - name: '04 - Data Integration'
            script: 'data_integration'
          - name: '04b - Data Isolation'
            script: 'data_isolation'
          - name: '05 - Data Export'
            script: 'export'
          - name: '06 - Data Anonymization'
            script: 'anonymization'
          - name: '07 - GDPR Compliance'
            script: 'gdpr'
          - name: '08 - Template Overrides'
            script: 'template_overrides'
          - name: '08b - Consent UI Render'
            script: 'consent_render'
          - name: '08c - Consent Logging'
            script: 'consent_logging'
          - name: '09 - AutoCleanup Task'
            script: 'autocleanup_task'
          - name: '10 - AcyMailing Integration'
            script: 'acymailing'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '11 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: j2commerce/plg_privacy_j2commerce/tests/
      - name: Start environment (J5)
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 600 bash -c 'until docker exec plg_privacy_j2commerce_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          chmod +x run-tests.sh
          ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: j5-${{ matrix.script }}-logs
          path: j2commerce/plg_privacy_j2commerce/tests/test-results/*.txt
      - name: Cleanup
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose down -v

  test-j6:
    name: ${{ matrix.name }} (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Configuration'
            script: 'configuration'
          - name: '03 - Privacy Plugin Base'
            script: 'privacy'
          - name: '04 - Data Integration'
            script: 'data_integration'
          - name: '04b - Data Isolation'
            script: 'data_isolation'
          - name: '05 - Data Export'
            script: 'export'
          - name: '06 - Data Anonymization'
            script: 'anonymization'
          - name: '07 - GDPR Compliance'
            script: 'gdpr'
          - name: '08 - Template Overrides'
            script: 'template_overrides'
          - name: '08b - Consent UI Render'
            script: 'consent_render'
          - name: '08c - Consent Logging'
            script: 'consent_logging'
          - name: '09 - AutoCleanup Task'
            script: 'autocleanup_task'
          - name: '10 - AcyMailing Integration'
            script: 'acymailing'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '11 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: j2commerce/plg_privacy_j2commerce/tests/
      - name: Setup PHP for J2Commerce build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
      - name: Build J2Commerce 6 from source (pinned)
        run: |
          git init /tmp/j2commerce6-src
          git -C /tmp/j2commerce6-src remote add origin https://github.com/j2commerce/j2commerce.git
          git -C /tmp/j2commerce6-src fetch --depth 1 origin "$J2C6_REF"
          git -C /tmp/j2commerce6-src checkout --detach FETCH_HEAD
          echo "J2Commerce 6 source commit (pinned $J2C6_REF): $(git -C /tmp/j2commerce6-src rev-parse HEAD)"
          # The pinned J2Commerce 6 build minifies assets with esbuild (npm) unless --no-minify is passed;
          # the tests only need the PHP package, so the unminified build is used.
          cd /tmp/j2commerce6-src && php build/build_package.php --no-minify
          ZIP=$(ls docs/packages/pkg_j2commerce_*.zip docs/packages/com_j2commerce_*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "ERROR: No J2Commerce 6 ZIP found" && ls docs/packages/ && exit 1
          sha256sum "$ZIP"
          cp "$ZIP" "$GITHUB_WORKSPACE/j2commerce/plg_privacy_j2commerce/tests/j2commerce6.zip"
      - name: Start environment (J6)
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 600 bash -c 'until docker exec plg_privacy_j2commerce_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          chmod +x run-tests.sh
          J2COMMERCE_STACK=j6 CONTAINER_NAME=plg_privacy_j2commerce_j6_test ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: j6-${{ matrix.script }}-logs
          path: j2commerce/plg_privacy_j2commerce/tests/test-results/*.txt
      - name: Cleanup
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.joomla6.yml down -v

  test-production:
    name: Production-like (newest J6, PHP 8.4, MariaDB 10.6, J2C6 production pin)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: j2commerce/plg_privacy_j2commerce/tests/
      - name: Setup PHP for J2Commerce build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
      - name: Build J2Commerce 6 from the production pin
        run: |
          git init /tmp/j2commerce6-src
          git -C /tmp/j2commerce6-src remote add origin https://github.com/j2commerce/j2commerce.git
          git -C /tmp/j2commerce6-src fetch --depth 1 origin "$J2C6_REF"
          git -C /tmp/j2commerce6-src checkout --detach FETCH_HEAD
          # The pinned J2Commerce 6 build minifies assets with esbuild (npm) unless --no-minify is passed;
          # the tests only need the PHP package, so the unminified build is used.
          cd /tmp/j2commerce6-src && php build/build_package.php --no-minify
          ZIP=$(ls docs/packages/pkg_j2commerce_*.zip docs/packages/com_j2commerce_*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "ERROR: No J2Commerce 6 ZIP found" && exit 1
          sha256sum "$ZIP"
          cp "$ZIP" "$GITHUB_WORKSPACE/j2commerce/plg_privacy_j2commerce/tests/j2commerce6.zip"
      - name: Start environment (production-like)
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.production.yml up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose -f docker-compose.production.yml down -v || true
            sleep 20
          done
          timeout 600 bash -c 'until docker exec plg_privacy_j2commerce_prod_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          docker exec plg_privacy_j2commerce_prod_test php -v
      - name: Show container logs
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.production.yml logs joomla 2>&1 | tail -100 || true
      - name: Arm deprecation tracing
        run: |
          docker exec plg_privacy_j2commerce_prod_test mkdir -p /var/www/html/tests/scripts
          for f in shared-test-helpers.php shared-deprecation-tracer.php shared-deprecations.php; do
            docker cp shared/tests/scripts/$f plg_privacy_j2commerce_prod_test:/var/www/html/tests/scripts/
          done
          docker exec plg_privacy_j2commerce_prod_test php /var/www/html/tests/scripts/shared-deprecations.php --arm
      - name: Run all suites
        env:
          TEST_STRICT_SKIP: '1'
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          chmod +x run-tests.sh
          J2COMMERCE_STACK=j6 CONTAINER_NAME=plg_privacy_j2commerce_prod_test ./run-tests.sh all
      - name: Evaluate PHP deprecations
        if: always()
        run: |
          docker exec -e TEST_STRICT_SKIP=1 plg_privacy_j2commerce_prod_test \
            php /var/www/html/tests/scripts/shared-deprecations.php
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-logs
          path: j2commerce/plg_privacy_j2commerce/tests/test-results/*.txt
      - name: Cleanup
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.production.yml down -v

  test-update:
    name: Update from previous release (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: /tmp/new-package/
      - name: Build the previous release from git
        run: |
          # Older release tags are deleted by the publish workflow, so the
          # previous version is rebuilt from the last release commit on main.
          REF=$(git rev-parse --verify -q origin/main || git rev-parse HEAD)
          PREVIOUS=$(git log "$REF" --grep '^release: privacy v' -n 1 --format=%H)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::No release commit found for privacy"
            exit 1
          fi
          echo "Previous release commit: $PREVIOUS ($(git log -1 --format=%s "$PREVIOUS"))"
          git worktree add /tmp/previous "$PREVIOUS"
          (cd /tmp/previous/j2commerce/plg_privacy_j2commerce && chmod +x build.sh && ./build.sh)
          cp /tmp/previous/j2commerce/plg_privacy_j2commerce/plg_privacy_j2commerce_*.zip j2commerce/plg_privacy_j2commerce/tests/extension.zip
      - name: Setup PHP for J2Commerce build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
      - name: Build J2Commerce 6 from source (pinned)
        run: |
          git init /tmp/j2commerce6-src
          git -C /tmp/j2commerce6-src remote add origin https://github.com/j2commerce/j2commerce.git
          git -C /tmp/j2commerce6-src fetch --depth 1 origin "$J2C6_REF"
          git -C /tmp/j2commerce6-src checkout --detach FETCH_HEAD
          # The pinned J2Commerce 6 build minifies assets with esbuild (npm) unless --no-minify is passed;
          # the tests only need the PHP package, so the unminified build is used.
          cd /tmp/j2commerce6-src && php build/build_package.php --no-minify
          ZIP=$(ls docs/packages/pkg_j2commerce_*.zip docs/packages/com_j2commerce_*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "ERROR: No J2Commerce 6 ZIP found" && exit 1
          cp "$ZIP" "$GITHUB_WORKSPACE/j2commerce/plg_privacy_j2commerce/tests/j2commerce6.zip"
      - name: Start environment with the previous release
        env:
          STRICT_INSTALL_MESSAGES: '0'
          PRIVACY_INSTALL_METHOD: 'cli'
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker compose up failed after $attempt attempts"
              exit 1
            fi
            echo "docker compose up failed; retrying after cleanup ($attempt/3)"
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          timeout 600 bash -c 'until docker exec plg_privacy_j2commerce_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
      - name: Update to the package under test
        run: |
          C=plg_privacy_j2commerce_j6_test
          docker cp /tmp/new-package/extension.zip "$C:/tmp/extension-new.zip"
          docker exec "$C" mkdir -p /var/www/html/tests/scripts
          docker cp shared/tests/scripts/shared-test-helpers.php "$C:/var/www/html/tests/scripts/"
          docker cp shared/tests/scripts/shared-update-from-previous.php "$C:/var/www/html/tests/scripts/"
          docker exec -e TEST_STRICT_SKIP=1 "$C" php /var/www/html/tests/scripts/shared-update-from-previous.php
      - name: Show container logs
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Cleanup
        if: always()
        run: |
          cd j2commerce/plg_privacy_j2commerce/tests
          docker compose -f docker-compose.joomla6.yml down -v

  official-j5-j2c4:
    name: Privacy / official-j5-j2c4
    runs-on: ubuntu-latest
    needs: test-j5
    if: always()
    permissions: {}
    steps:
      - name: Verify official J5/J2C4 matrix
        env:
          RESULT: ${{ needs.test-j5.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Official J5/J2C4 matrix did not pass: $RESULT"
            exit 1
          fi

  official-j6-j2c6:
    name: Privacy / official-j6-j2c6
    runs-on: ubuntu-latest
    needs: test-j6
    if: always()
    permissions: {}
    steps:
      - name: Verify official J6/J2C6 matrix
        env:
          RESULT: ${{ needs.test-j6.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Official J6/J2C6 matrix did not pass: $RESULT"
            exit 1
          fi

  # Result of this workflow. Deliberately not named "Collect Results": that
  # required check is produced only by collect-results.yml.
  all-jobs:
    name: Privacy / all jobs
    runs-on: ubuntu-latest
    needs:
      - build
      - syntax-check
      - language-lint
      - test-j5
      - test-j6
      - test-production
      - test-update
      - official-j5-j2c4
      - official-j6-j2c6
    if: always()
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: test-artifacts/
      - name: Collect and display logs
        run: |
          echo "=== Test Results Summary ==="
          for dir in test-artifacts/*/; do
            if [ -d "$dir" ]; then
              echo ""
              echo "--- $(basename "$dir") ---"
              find "$dir" -name "*.txt" -exec cat {} \;
            fi
          done
      - name: Upload combined logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: all-test-logs
          path: test-artifacts/
          retention-days: 30
      - name: Fail unless every job succeeded
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # failure, cancelled and skipped all count as not passed
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
