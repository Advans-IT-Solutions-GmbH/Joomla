COM_APPOINTMENTS_CLOSE_FIELDS_DESC="JSON-Objekt. Pflicht: uid, sequence, start, end, state, source. Freiwillig: event_type, campaign, contact_created, start_local, matched_by, duplicates. Jeder Wert geht in ein eigenes einfaches Textfeld cf_ des gewählten Aktivitätstyps. Zeiten in UTC nach ISO 8601, Zustände pending, confirmed und cancelled."
