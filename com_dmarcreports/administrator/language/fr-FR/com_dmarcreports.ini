COM_DMARCREPORTS_CONFIG_TASK_AUTO_CREATE_DESC="Lorsqu'elle est activée, une tâche d'ingestion planifiée peut créer des domaines surveillés pour les rapports provenant de domaines non encore suivis. Cette option est désactivée par défaut afin que la création d'une tâche planifiée ne puisse pas contourner l'autorisation de création de la composante. La modification de cette option nécessite des droits d'administrateur sur la composante. N'a d'effet qu'avec l'option « Créer automatiquement les domaines inconnus ». Les domaines créés ne sont pas publiés."
COM_DMARCREPORTS_CONFIG_AUTO_CREATE_LABEL="Créer automatiquement les domaines inconnus"
COM_DMARCREPORTS_CONFIG_AUTO_CREATE_DESC="Crée un domaine lorsqu'un rapport importé nomme un domaine pas encore répertorié. Le domaine est toujours créé non publié et n'est surveillé et pris en compte pour MTA-STS qu'une fois publié par l'administration, car n'importe qui peut envoyer un rapport. S'applique au téléversement manuel, à la relève de la boîte aux lettres et à la tâche planifiée (qui nécessite aussi l'option ci-dessous). Désactivé par défaut : les rapports des domaines inconnus sont ignorés."
