PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Adds all enabled J2Commerce products to the OSMap sitemap automatically."

; Plugin params
PLG_OSMAP_PRIORITY_LABEL="Priority"
PLG_OSMAP_PRIORITY_DESC="Sitemap priority for product pages (0.0–1.0). Default: 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Change Frequency"
PLG_OSMAP_CHANGEFREQ_DESC="How often product pages are likely to change."

; Post-install message
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce: Installation Complete"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP_LABEL="Step %d"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Enable Plugin"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Manage → Plugins</strong> → search for <strong>OSMap - J2Commerce</strong> → enable."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Configure OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="In OSMap (<strong>Components → OSMap</strong>), open your sitemap and make sure the menu containing your shop item is selected. The plugin will automatically pick up all enabled J2Commerce products."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Regenerate Sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Open your sitemap URL (e.g. <strong>/sitemap</strong>) or click <strong>Refresh</strong> in OSMap to regenerate. Publicly visible products (published and accessible to guests) appear as <code>/shop/product-alias</code> URLs (on a multilingual site each URL carries the menu item's language SEF prefix, e.g. <code>/de/shop/product-alias</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin enabled (System → Manage → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Shop menu item is selected in OSMap sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap regenerated and product URLs visible"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Checklist"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Documentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Installer notices
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce has been updated to version %s."
PLG_OSMAP_J2COMMERCE_ENABLE_HINT="The plugin is disabled. Enable it under <strong>System → Manage → Plugins</strong> (search for <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) is not installed. This plugin only works together with OSMap; install OSMap to generate a sitemap."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Neither J2Commerce 6 (com_j2commerce) nor J2Store/J2Commerce 4 (com_j2store) is installed and enabled. No products are added to the sitemap until one of them is available."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="The legacy OSMap plugin for J2Store (osmap/j2store) was disabled because this plugin replaces it."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="The legacy OSMap plugin for J2Store (osmap/j2store) could not be disabled: %s. Disable it manually under System → Manage → Plugins."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="The OSMap file %s was patched so that Factory::getTable() no longer returns false (PHP 8.1+ compatibility)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="The OSMap file %s could not be read or written, so the PHP 8.1+ compatibility patch was not applied. Update OSMap to version 5.1.4 or later."
