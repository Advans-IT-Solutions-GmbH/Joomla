PKG_PRIVACY_J2COMMERCE="J2Commerce Privacy package"
PKG_PRIVACY_J2COMMERCE_XML_DESCRIPTION="GDPR and data protection for J2Commerce in one installation: the privacy plugin (export, removal and retention of shop data, privacy tab in the customer profile), the consent system plugin (checkout consent) and the cleanup task plugin (automatic anonymisation). Installing, updating and removing the package manages all three together. Installed over the standalone privacy plugin of an earlier version, the package takes it over with all data, settings and enabled states."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_INTRO="The J2Commerce Privacy package is installed. The bundled plugins <strong>System - J2Commerce Privacy Consent</strong> and <strong>Task - J2Commerce Privacy Cleanup</strong> are installed and enabled, and the scheduled cleanup task is checked below. Enable <strong>Privacy - J2Commerce</strong> yourself as the guide above describes."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="J2Commerce Privacy package updated to version %s."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_MIGRATED="J2Commerce Privacy now runs as a package (version %s). The privacy plugin and its bundled plugins were taken over as they were: data, settings and enabled states are unchanged. Updates now come through the package."
PKG_PRIVACY_J2COMMERCE_INSTALL_CHILD_NEWER="%1$s is installed in version %2$s, which is newer than the version %3$s in this package. The installation was stopped and nothing has been changed. Install the current J2Commerce Privacy package."
PKG_PRIVACY_J2COMMERCE_UPDATE_CHANNEL_WARNING="The J2Commerce Privacy package was installed or updated, but Joomla could not complete the switch to the package update channel. One or more bundled plugins may still receive standalone updates. Update the package again to retry the switch."
