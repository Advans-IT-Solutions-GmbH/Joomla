PLG_PRIVACY_J2COMMERCE_REMOVAL_DONE_RETAINED_NO_ADDRESS="J2Commerce: Adressen, Warenkörbe, Newsletter-Daten und abgelaufene Bestellungen dieses Benutzers wurden gelöscht bzw. anonymisiert. Die Kundin oder der Kunde wurde NICHT informiert: Die Adresse der Anfrage „%s“ ist keine gültige E-Mail-Adresse. Bitte über diese Bestellungen informieren:"
PLG_PRIVACY_J2COMMERCE_REMOVAL_DONE_RETAINED_MAIL_FAILED="J2Commerce: Adressen, Warenkörbe, Newsletter-Daten und abgelaufene Bestellungen dieses Benutzers wurden gelöscht bzw. anonymisiert. Die E-Mail an %s konnte NICHT gesendet werden (siehe Log). Bitte über diese Bestellungen informieren:"
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY="Ihre Anfrage zur Löschung Ihrer Daten wurde ausgeführt. Ihre gespeicherten Adressen, Warenkörbe und Newsletter-Daten wurden gelöscht, und Ihr Kundenkonto wurde anonymisiert. Bestelldaten unterliegen einer gesetzlichen Aufbewahrungspflicht und werden bis zum angegebenen Datum aufbewahrt; danach werden sie anonymisiert. Bei Bestellungen mit unbefristeter Lizenz bleibt die Bestell-E-Mail-Adresse erhalten, damit die Lizenz reaktiviert werden kann."
