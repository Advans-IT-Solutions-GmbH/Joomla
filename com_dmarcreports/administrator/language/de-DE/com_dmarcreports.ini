COM_DMARCREPORTS_CONFIG_DNS_DIAGNOSTICS_LABEL="DNS-Diagnose"
COM_DMARCREPORTS_CONFIG_DNS_DIAGNOSTICS_DESC="Aktiviert Live-DNS-Prüfungen für DMARC/SPF sowie bei separat aktiviertem MTA-STS/TLS-RPT deren Einträge und die empfangende MX-Abdeckung in Domainansicht und Systemcheck. Die MTA-STS-Prüfung ruft auch die gehostete Richtlinie per HTTPS ab. Standardmässig aus: DNS-Abfragen legen überwachte Domainnamen und IP-Adressen sendender Quellen gegenüber Resolvern offen. HTTPS legt Policy-Host, Pfad und Verbindungsmetadaten des Servers gegenüber diesem Host offen. Berichtsinhalte werden nicht übertragen."
COM_DMARCREPORTS_CONFIG_TASK_AUTO_CREATE_LABEL="Automatische Domain-Anlage durch geplante Aufgaben erlauben"
COM_DMARCREPORTS_CONFIG_TASK_AUTO_CREATE_DESC="Wenn aktiviert, darf eine geplante Ingestion-Aufgabe überwachte Domains für Reports anlegen, deren Domain noch nicht erfasst ist. Standardmässig ist dies ausgeschaltet, damit das Anlegen einer geplanten Aufgabe die Erstellen-Berechtigung der Komponente nicht umgehen kann. Das Ändern dieser Option erfordert Administratorrechte an der Komponente. Wirkt nur zusammen mit der Option «Unbekannte Domains automatisch anlegen». Angelegte Domains sind unveröffentlicht."
COM_DMARCREPORTS_CONFIG_AUTO_CREATE_LABEL="Unbekannte Domains automatisch anlegen"
COM_DMARCREPORTS_CONFIG_AUTO_CREATE_DESC="Legt eine Domain an, wenn ein importierter Bericht eine noch nicht erfasste Domain nennt. Die Domain wird immer unveröffentlicht angelegt und erst nach dem Veröffentlichen durch die Administration überwacht und für MTA-STS berücksichtigt, denn jeder kann einen Bericht senden. Gilt für das manuelle Hochladen, den Postfachabruf und die geplante Aufgabe (dort zusätzlich die Option unten). Standardmässig aus: Berichte für unbekannte Domains werden übersprungen."
