PLG_PRIVACY_J2COMMERCE_MYPROFILE_DATA_LIST="We store the following data about you: account information (name, e-mail address, username, registration date), billing and shipping addresses, orders and order history, privacy consents (time, IP address, browser identification), login and activity logs (time, IP address) and any newsletter subscription."
PLG_PRIVACY_J2COMMERCE_RETENTION_NOTICE_TITLE="Data retention notice"
PLG_PRIVACY_J2COMMERCE_RETENTION_NOTICE_DYNAMIC="Legal requirements oblige us to keep order data including addresses for %d years from the end of the fiscal year of the order for accounting purposes. Orders within this retention period cannot be deleted or anonymized. After the period, they are anonymized on your deletion request or by the regular cleanup, if the shop has set it up. For orders with a lifetime license, the order e-mail address is kept so that the license can be reactivated."
PLG_PRIVACY_J2COMMERCE_PAYMENT_PROVIDER_TITLE="Payment data"
PLG_PRIVACY_J2COMMERCE_PAYMENT_PROVIDER_NOTICE="Payment data (credit card and bank details) is stored and processed by the payment service providers (for example Stripe, PayPal), not by us. We have no access to your complete payment details. For questions about your payment data, please contact the payment service provider directly."
