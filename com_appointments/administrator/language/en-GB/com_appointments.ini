COM_APPOINTMENTS_CONFIG_CONSENT_MODE="Privacy notice on the booking form"
COM_APPOINTMENTS_CONFIG_CONSENT_MODE_DESC="“Notice only” shows the privacy notice with its link in the information column, without a checkbox. “Confirm acknowledgement” requires a checkbox that the person has taken note of the notice; nothing is stored. “Ask for consent” requires a consent checkbox and stores the time and the version of the wording with the booking as proof. Choose consent only if your processing is based on consent."
