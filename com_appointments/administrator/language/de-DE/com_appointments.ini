COM_APPOINTMENTS_TEAM_F_SYSTEM_LEGACY_FIX="Die Token-Feeds werden durch die Internetkalender ersetzt und mit Version 2.0.0 entfernt. Schalten Sie sie in den Optionen aus, sobald jeder Gastgeber einen Internetkalender nutzt."
COM_APPOINTMENTS_TEAM_F_SYSTEM_OUTLOOK_CLEANUP="Internetkalender: aktive Outlook-Geräte mit «Aufräumen»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_OUTLOOK_CLEANUP_FIX="Prüfen Sie diese Geräte unter Internetkalender, Geräte. Gleicht ein Outlook-Gerät beidseitig mit dem Outlook-Hauptkalender ab, stellen Sie es auf «Nur sperren». Sonst löscht Outlook beim Entfernen des Geräts, nach einem Passwort-Reset oder bei einer Sperre alle abgeglichenen Termine dieses Kalenders. Geräte aus der Zeit vor dieser Einstellung stehen auf «Aufräumen». Gleicht das Gerät nur in einen eigenen, leeren Ordner ab, ist «Aufräumen» richtig und dieser Hinweis kann bleiben."
COM_APPOINTMENTS_HELP_DEVREMOVE_TITLE="Geräte entfernen"
COM_APPOINTMENTS_HELP_DEVREMOVE_SETTING="Jedes Gerät hat die Einstellung «Beim Entfernen oder Sperren». Die Person wählt sie beim Hinzufügen unter «Meine Kalender» und kann sie dort später ändern. Administratoren ändern sie unter Internetkalender, Geräte. Sonst kann niemand sie ändern."
COM_APPOINTMENTS_HELP_DEVREMOVE_CLEANUP="«Aufräumen»: Beim nächsten Abgleich erhält das Gerät seine Kalender leer. Jeder bekannte Eintrag gilt als gelöscht, Schreibzugriffe werden abgelehnt. Danach verschwinden die Kalender, danach wird jede Anfrage mit 401 abgelehnt. Das Programm löscht dabei seine lokale Kopie, der Server behält alle Einträge. Gedacht für Handys und Tablets, auf denen die Internetkalender eigene Kalender sind."
COM_APPOINTMENTS_HELP_DEVREMOVE_BLOCK="«Nur sperren»: Das Gerät wird sofort widerrufen. Jede Anfrage, auch PROPFIND und REPORT, wird mit 401 abgelehnt. Ein leerer Kalender wird nie ausgeliefert. Das Programm meldet einen Fehler und löscht nichts. Die Kopie auf dem Gerät bleibt, bis die Person sie im Programm entfernt."
COM_APPOINTMENTS_HELP_DEVREMOVE_OUTLOOK="Warum «Nur sperren» für Outlook: CalDav Synchronizer gleicht im Modus «Two-Way» in beide Richtungen ab. Ist der Internetkalender dem Outlook-Hauptkalender zugeordnet, sind die abgeglichenen Einträge die Originaltermine der Person. Ein leerer Kalender beim Aufräumen würde Outlook veranlassen, diese Termine zu löschen. Mit «Nur sperren» meldet Outlook nur einen Fehler, alle Termine bleiben."
COM_APPOINTMENTS_HELP_DEVREMOVE_TRIGGERS="Wer betroffen ist: Gerät entfernen unter «Meine Kalender» und «Nach Geräteeinstellung sperren» im Backend betreffen nur dieses eine Gerät, alle anderen Geräte laufen unverändert weiter. Ein Passwort-Reset, die Sperre des Joomla-Kontos, die Sperre des Kalenderzugriffs, der Widerruf eines Zugangs und das Verwerfen eines ungültigen Schlüssels sperren alle Geräte der Person, jedes nach seiner eigenen Einstellung. «Sofort sperren» widerruft immer ohne Aufräumen, für ein verlorenes Gerät."
COM_APPOINTMENTS_HELP_DEVREMOVE_CALENDAR="Wird nur die Freigabe für einen Kalender entzogen, behält das Gerät seine anderen Kalender. Der entzogene Kalender wird nicht mehr aufgelistet und antwortet mit 404, auch auf PROPFIND und REPORT. Bei «Nur sperren» wird er nie leer ausgeliefert. Bei «Aufräumen» erhält das Gerät ihn erst leer, wenn das ganze Gerät aufgeräumt wird."
COM_APPOINTMENTS_HELP_DEVREMOVE_DEFAULTS="Vorgabe beim Hinzufügen: «Nur sperren» für Outlook mit CalDav Synchronizer, Thunderbird, eM Client und andere Programme, «Aufräumen» für iPhone, iPad und Android mit DAVx⁵. Geräte aus der Zeit vor dieser Einstellung stehen nach dem Update auf «Aufräumen», wie bisher. Die Systemprüfung meldet aktive Outlook-Geräte mit «Aufräumen». Stellen Sie diese auf «Nur sperren», wenn sie beidseitig mit dem Outlook-Hauptkalender abgleichen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_CLEANUP="Internetkalender: geplante Aufgabe «Aufräumen»"
