COM_APPOINTMENTS_INSTALL_LEGACY_MANIFEST="Die veraltete Manifestdatei %s konnte nicht entfernt werden. Bitte löschen Sie sie im Komponentenordner, damit die Datenbankprüfung von Joomla die Komponente richtig erkennt."
