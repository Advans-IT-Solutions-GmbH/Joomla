PLG_TASK_APPOINTMENTS="Task - Appointments"
PLG_TASK_APPOINTMENTS_XML_DESCRIPTION="Delivers appointment reminders and applies booking, audit and rate-limit retention."
PLG_TASK_APPOINTMENTS_REMINDERS_TITLE="Appointments: reminders"
PLG_TASK_APPOINTMENTS_REMINDERS_DESC="Send due calendar reminders for confirmed appointments. Configure reminder offsets in the component options."
PLG_TASK_APPOINTMENTS_RETENTION_TITLE="Appointments: retention"
PLG_TASK_APPOINTMENTS_RETENTION_DESC="Erase expired booking data and remove expired audit and rate-limit rows. Configure retention in the component options and event types."
PLG_TASK_APPOINTMENTS_BATCH_SIZE="Batch size"
PLG_TASK_APPOINTMENTS_BATCH_SIZE_DESC="Maximum booking candidates, audit rows and rate-limit windows per execution (1–1000). Run again to process the next batch."
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_TITLE="Appointments: internet calendar clean-up"
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_DESC="Moves blocked devices to their next clean-up phase when a phase has run out and deletes sign-in failure counters older than 24 hours. Does nothing while internet calendars are switched off."
PLG_TASK_APPOINTMENTS_TEAMLOG_TITLE="Appointments: internet calendar log"
PLG_TASK_APPOINTMENTS_TEAMLOG_DESC="Deletes internet calendar log entries older than twelve months. The remaining chain stays verifiable. Does nothing while internet calendars are switched off."
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_TITLE="Appointments: expired invitations"
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_DESC="Closes expired invitations of external users and clears their addresses. Does nothing while internet calendars are switched off."
PLG_TASK_APPOINTMENTS_TEAMRETENTION_TITLE="Appointments: internet calendar retention"
PLG_TASK_APPOINTMENTS_TEAMRETENTION_DESC="Age-based calendar-object deletion runs only with internet calendars enabled; 0 disables that deletion. Also removes cancelled, erased and orphan booking copies (all booking copies while internet calendars are off), retries guest-link copy cleanups that previously failed, and resumes encryption of older booking rows. Does not erase booking rows or erasure-audit data."
PLG_TASK_APPOINTMENTS_CLOSE_TITLE="Appointments: deliver approved bookings to Close"
PLG_TASK_APPOINTMENTS_CLOSE_DESC="Optional direct CRM transfer. Disabled until configured and enabled; no cloud calendar, booking recreation or email replay. Uncertain creations require operator reconciliation."
