COM_APPOINTMENTS_CONFIG_MAX_GUESTS_DESC="How many additional email addresses the booking person may enter, from 0 to 50. With 0 the booking form has no guest field."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_DESC="Calling code preselected in telephone fields, digits only, for example 41 or 49. Empty: the visitor chooses."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE="Calling code choice"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_DESC="Whether the booking person chooses the calling code of their telephone number. “Only the preselected calling code” applies only when a valid calling code is entered above. Every telephone field then accepts only numbers with that code, also a number typed with + or 00."
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FREE="Visitor chooses the calling code"
COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_CHOICE_FIXED="Only the preselected calling code"
COM_APPOINTMENTS_CONFIG_ERASE_MODE="On erasure"
COM_APPOINTMENTS_CONFIG_ERASE_MODE_DESC="Anonymise (the default) clears invitee, guest, custom-field and conference data but keeps the statistical booking slot. Delete removes the whole booking row. Erasure is recorded at the actual UTC processing time, not the retention deadline; anonymisation records that time on the remaining row. Both remove linked calendar copies. An explicit erasure also cancels future bookings; age-based retention does not select future bookings. Already anonymised rows are not processed again by automatic retention."
COM_APPOINTMENTS_CONFIG_ERASE_ANONYMISE="Keep an anonymised slot"
COM_APPOINTMENTS_CONFIG_ERASE_DELETE="Delete the booking entirely"
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS="Reminder offsets (minutes)"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL="Public site URL"
COM_APPOINTMENTS_CONFIG_PUBLIC_SITE_URL_DESC="Canonical HTTP(S) root URL, including a Joomla subdirectory when applicable, without a query or fragment. Required for CLI reminders unless Joomla's live_site is set. Web requests otherwise use the current site root."
COM_APPOINTMENTS_CONFIG_REMINDER_OFFSETS_DESC="Comma-separated minutes before a confirmed appointment, each between 1 and 525600. Default: 1440,60. Leave empty to disable reminders. Delivery requires an active Scheduler reminder task."
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS="Booking retention (days)"
COM_APPOINTMENTS_CONFIG_RETENTION_DAYS_DESC="Required whole days, 0-65535; default 365. The 'Appointments: retention' task processes not-yet-anonymised bookings whose end is strictly before UTC now minus this period, including cancelled bookings. 0 processes already ended bookings on the next task run; it does not mean unlimited retention. An empty event-type override (NULL) inherits this value. 'On erasure' selects anonymisation or complete booking deletion. Future bookings are not selected, including bookings rescheduled into the future. Calendar objects and erasure-audit rows have separate retention settings."
COM_APPOINTMENTS_CONFIG_RETENTION_TASKS_DESC="Booking data, calendar objects and logs have independent lifecycles. In Joomla's Scheduled Tasks, configure and enable 'Appointments: retention', 'Appointments: internet calendar retention' and 'Appointments: internet calendar log' as needed. The Task - Appointments plugin must be enabled and Scheduler must actually be triggered regularly, for example by cron. Saving these settings does not run cleanup. The defaults are software settings, not a legal retention recommendation."
COM_APPOINTMENTS_CONFIG_AUDIT_RETENTION="Erasure-audit retention (years)"
