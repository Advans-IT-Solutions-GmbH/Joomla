PKG_PRIVACY_J2COMMERCE="Paquet J2Commerce Confidentialité"
PKG_PRIVACY_J2COMMERCE_XML_DESCRIPTION="RGPD et protection des données pour J2Commerce en une seule installation : le plugin de confidentialité (export, suppression et conservation des données de la boutique, onglet confidentialité dans le profil client), le plugin système de consentement (consentement au checkout) et le plugin de tâche de nettoyage (anonymisation automatique). Installer, mettre à jour et supprimer le paquet gère les trois ensemble. Installé par-dessus le plugin de confidentialité autonome d'une version antérieure, le paquet le reprend avec toutes ses données, ses réglages et ses états d'activation."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_INTRO="Le paquet J2Commerce Confidentialité est installé. Les plugins inclus <strong>Système - J2Commerce Consentement de confidentialité</strong> et <strong>Tâche - Nettoyage confidentialité J2Commerce</strong> sont installés et activés, et la tâche planifiée de nettoyage est vérifiée ci-dessous. Activez vous-même <strong>Privacy - J2Commerce Confidentialité</strong> comme le décrit le guide ci-dessus."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="Paquet J2Commerce Confidentialité mis à jour vers la version %s."
PKG_PRIVACY_J2COMMERCE_POSTINSTALL_MIGRATED="J2Commerce Confidentialité fonctionne désormais comme un paquet (version %s). Le plugin de confidentialité et ses plugins inclus ont été repris tels quels : données, réglages et états d'activation sont inchangés. Les mises à jour passent désormais par le paquet."
PKG_PRIVACY_J2COMMERCE_INSTALL_CHILD_NEWER="%1$s est installé en version %2$s, plus récente que la version %3$s de ce paquet. L'installation a été arrêtée et rien n'a été modifié. Installez le paquet J2Commerce Confidentialité actuel."
PKG_PRIVACY_J2COMMERCE_UPDATE_CHANNEL_WARNING="Le paquet J2Commerce Confidentialité a été installé ou mis à jour, mais Joomla n'a pas pu terminer le passage au canal de mise à jour du paquet. Un ou plusieurs plugins inclus peuvent encore recevoir des mises à jour autonomes. Mettez à jour le paquet à nouveau pour réessayer."
