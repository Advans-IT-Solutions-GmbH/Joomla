COM_APPOINTMENTS_MAIL_CANCELLATION_SUBJECT="Annulé : {event_title}"
COM_APPOINTMENTS_MAIL_CANCELLATION_BODY="Le rendez-vous a été annulé.\n{event_title}\nDe : {start}\nÀ : {end}\nFuseau horaire : {timezone}\n\nL'annulation jointe supprime l'entrée existante du calendrier."
