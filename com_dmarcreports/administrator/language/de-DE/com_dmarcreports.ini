; Action items (title + text). Placeholders are positional.
COM_DMARCREPORTS_ACTION_NO_DATA_TITLE="Noch keine Berichte"
COM_DMARCREPORTS_ACTION_NO_DATA_TEXT="Für %1$s wurden noch keine Aggregatberichte importiert. Veröffentlichen Sie einen DMARC-Eintrag mit einer rua-Adresse und importieren Sie dann die ersten Berichte."

COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TITLE="Auf p=quarantine wechseln"
COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TEXT="%2$s%% der beobachteten E-Mails für %1$s bestehen DMARC und erreichen den konfigurierten Schwellenwert, um von p=none auf p=quarantine zu wechseln. Prüfen Sie zuerst die fehlschlagenden Quellen, damit legitime weitergeleitete E-Mails nicht in Quarantäne geraten."

COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TITLE="Vorerst bei p=none bleiben"
COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TEXT="Nur %2$s%% der E-Mails für %1$s bestehen DMARC, unter den für p=quarantine nötigen %3$s%%. Beheben Sie zuerst die fehlschlagenden Absender."

COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TITLE="Auf p=reject wechseln"
COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TEXT="%2$s%% der beobachteten E-Mails für %1$s bestehen DMARC unter p=quarantine und erreichen den konfigurierten Schwellenwert, um auf p=reject zu wechseln. Prüfen Sie zuerst die verbleibenden fehlschlagenden Quellen, damit legitime E-Mails nicht abgewiesen werden."

COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TITLE="Vorerst bei p=quarantine bleiben"
COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TEXT="Nur %2$s%% der E-Mails für %1$s bestehen DMARC, unter den für p=reject nötigen %3$s%%. Beheben Sie zuerst die verbleibenden Fehlschläge."

COM_DMARCREPORTS_ACTION_ENFORCED_TITLE="Durchsetzung erreicht"
COM_DMARCREPORTS_ACTION_ENFORCED_TEXT="%1$s setzt p=reject durch. Importieren Sie weiter Berichte und achten Sie auf neue Versandquellen."
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TITLE="Nur teilweise Durchsetzung"
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TEXT="%1$s veröffentlicht p=reject, aber nur %2$d%% der Nachrichten unterliegen der Richtlinie. Empfänger sind lediglich angehalten, den Rest so zu behandeln, als gälte p=quarantine (RFC 7489, empfängerabhängig). Erhöhen Sie pct auf 100, damit die Richtlinie für alle Nachrichten gilt."
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TITLE="Nur teilweise Quarantäne"
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TEXT="%1$s veröffentlicht p=quarantine, aber nur %2$d%% der Nachrichten unterliegen der Richtlinie. Erhöhen Sie pct auf 100, damit quarantine für alle Nachrichten greift, bevor Sie zu reject übergehen."

COM_DMARCREPORTS_ACTION_AT_TARGET_TITLE="Zielrichtlinie erreicht"
COM_DMARCREPORTS_ACTION_AT_TARGET_TEXT="%1$s hat bereits die gewählte Zielrichtlinie p=%2$s erreicht. Importieren Sie weiter Berichte und achten Sie auf neue Versandquellen. Erhöhen Sie das Ziel, wenn Sie weiter verschärfen möchten."

COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TITLE="E-Mails unter p=reject gefährdet"
COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TEXT="%1$d Nachricht(en), %2$s%% des Volumens, sind nicht ausgerichtet und würden unter p=reject abgewiesen. Authentifizieren Sie diese Absender, bevor Sie die Richtlinie verschärfen."

COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TITLE="Eine Versandquelle ausrichten"
COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TEXT="%1$s hat %2$d Nachricht(en), %3$s%% des Volumens, ohne DKIM- oder SPF-Ausrichtung gesendet. Nehmen Sie sie in SPF auf und/oder signieren Sie mit DKIM."

COM_DMARCREPORTS_ACTION_NEW_SOURCE_TITLE="Neue Versandquelle erkannt"
COM_DMARCREPORTS_ACTION_NEW_SOURCE_TEXT="%1$s ist eine neue Quelle mit %2$d Nachricht(en). Bestätigen Sie, dass es ein legitimer Absender ist, und authentifizieren Sie ihn, oder prüfen Sie möglichen Missbrauch."

COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TITLE="Erfolgsquote gesunken"
COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TEXT="Die DMARC-Erfolgsquote ist von %1$s%% auf %2$s%% gefallen. Prüfen Sie auf einen defekten Absender oder eine neue nicht ausgerichtete Quelle, bevor Sie die Richtlinie verschärfen."

COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TITLE="DMARC-Eintrag veröffentlichen"
COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TEXT="Für %1$s wurde kein DMARC-Eintrag gefunden. Veröffentlichen Sie einen mit p=none und einer rua-Adresse, um Berichte zu sammeln."
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TITLE="DMARC der organisatorischen Domain prüfen"
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TEXT="%1$s ist eine Subdomain ohne eigenen DMARC-Eintrag. Sie kann durch die Richtlinie der organisatorischen Domain abgedeckt sein, die Empfänger als Rückfallebene anwenden. Prüfen Sie, ob die organisatorische Domain DMARC veröffentlicht, und veröffentlichen Sie hier nur dann einen eigenen Eintrag, wenn diese Subdomain anders behandelt werden soll."
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TITLE="Doppelten DMARC-Eintrag entfernen"
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TEXT="Für %1$s ist mehr als ein DMARC-Eintrag veröffentlicht. Das ist ungültig und Empfänger ignorieren die Richtlinie. Behalten Sie genau einen Eintrag unter _dmarc.%1$s."
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TITLE="Fehlerhaften DMARC-Eintrag korrigieren"
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TEXT="Der DMARC-Eintrag für %1$s ist fehlerhaft: Der Wert p muss none, quarantine oder reject sein, und pct muss eine ganze Zahl von 0 bis 100 sein. Empfänger können einen ungültigen Eintrag nicht anwenden. Korrigieren Sie ihn unter _dmarc.%1$s."

COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TITLE="DMARC-Richtlinie ist p=none"
COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TEXT="Der veröffentlichte DMARC-Eintrag für %1$s steht auf p=none und bietet noch keinen Schutz. Planen Sie den Wechsel auf quarantine, sobald Ihre Absender bestehen."

COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TITLE="rua-Adresse hinzufügen"
COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TEXT="Der DMARC-Eintrag für %1$s hat keine rua-Adresse, daher werden keine Aggregatberichte angefordert. Fügen Sie rua=mailto: hinzu, um sie zu erhalten."

COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TITLE="DMARC-pct liegt unter 100"
COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TEXT="Der DMARC-Eintrag wendet die Richtlinie nur auf %1$s%% der E-Mails an. Erhöhen Sie pct auf 100, sobald Sie sicher sind."

COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TITLE="SPF-Eintrag erwägen"
COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TEXT="Für %1$s wurde kein SPF-Eintrag gefunden. DMARC kann weiterhin über DKIM oder über SPF der Envelope-Absenderdomain bestehen, daher ist dies nicht zwingend ein Problem. Veröffentlichen Sie einen, wenn diese Domain ihre Versandhosts zusätzlich per IP authentifizieren soll."
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TITLE="Doppelten SPF-Eintrag entfernen"
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TEXT="Für %1$s ist mehr als ein SPF-Eintrag veröffentlicht. Das ist ungültig und verursacht einen permerror. Fassen Sie sie zu einem einzigen Eintrag zusammen."
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TITLE="DNS-Abfrage fehlgeschlagen"
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TEXT="Die DNS-Abfrage für %1$s ist fehlgeschlagen, daher konnten die DMARC- und SPF-Einträge nicht geprüft werden. Das ist meist vorübergehend. Versuchen Sie es in Kürze erneut, und prüfen Sie bei anhaltendem Fehler den DNS-Resolver des Servers."
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TITLE="MX-Hosts für MTA-STS ergänzen"
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TEXT="MTA-STS ist für %1$s aktiviert, aber es sind keine MX-Hosts konfiguriert, daher kann keine Richtlinie erstellt werden. Ergänzen Sie die empfangenden Mailserver in den Komponentenoptionen unter MTA-STS."
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TITLE="MTA-STS-Eintrag und Policy-Host veröffentlichen"
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TEXT="Veröffentlichen Sie einen TXT-Eintrag unter %1$s mit dem Wert \"%2$s\" und stellen Sie sicher, dass die Richtlinie mit gültigem TLS-Zertifikat unter %3$s erreichbar ist. Dieser Host- und DNS-Schritt ist der einzige Teil, den die Komponente nicht für Sie erledigen kann."
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TITLE="MTA-STS-Eintrags-ID aktualisieren"
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TEXT="Die veröffentlichte _mta-sts-Eintrags-ID (%1$s) unterscheidet sich von der aktuellen Richtlinien-ID (%2$s). Aktualisieren Sie den TXT-Eintrag auf \"%3$s\", damit Absender die neueste Richtlinie übernehmen."
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TITLE="MTA-STS-Abfrage fehlgeschlagen"
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TEXT="Die _mta-sts-DNS-Abfrage für %1$s ist fehlgeschlagen, daher konnte der Eintrag nicht geprüft werden. Das ist meist vorübergehend. Versuchen Sie es in Kürze erneut, und prüfen Sie bei anhaltendem Fehler den DNS-Resolver des Servers."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TITLE="MTA-STS-Richtlinie nicht erreichbar"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TEXT="Die Richtlinie unter %1$s konnte nicht über HTTPS abgerufen werden. Prüfen Sie, ob der mta-sts-Host existiert, ein gültiges TLS-Zertifikat vorweist und ob sein Webserver /.well-known/mta-sts.txt an Joomla weitergibt (siehe Dokumentation des MTA-STS-Plugins)."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TITLE="Gehostete MTA-STS-Richtlinie ist veraltet"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TEXT="Die unter %1$s ausgelieferte Richtlinie stimmt nicht mit dem konfigurierten Modus und den MX-Hosts überein. Veröffentlichen Sie sie neu, oder stellen Sie sicher, dass das System-Plugin aktiviert ist, damit sie automatisch ausgeliefert wird."
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TITLE="MTA-STS auf Enforce umstellen"
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TEXT="Der MTA-STS-Eintrag und die Richtlinie für %1$s sind konsistent, aber noch im Testing-Modus, der Absender nie zur TLS-Erzwingung veranlasst. Sobald die TLS-RPT-Berichte sauber aussehen, stellen Sie den Richtlinien-Modus auf Enforce um."
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TITLE="TLS-RPT-Eintrag veröffentlichen"
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TEXT="Veröffentlichen Sie einen TXT-Eintrag unter %1$s mit dem Wert \"%2$s\", damit TLS-Berichte an die konfigurierte Adresse zugestellt werden."
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TITLE="TLS-RPT-Berichtsadresse konfigurieren"
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TEXT="Die TLS-RPT-Berichterstattung ist für %1$s aktiviert, aber es ist keine gültige Berichtsadresse konfiguriert. Daher kann kein Eintrag veröffentlicht werden und es treffen nie TLS-Berichte ein. Hinterlegen Sie in den Komponentenoptionen eine gültige mailto:- oder https:-Adresse."

COM_DMARCREPORTS_ACTION_GENERIC_TITLE="Diesen Punkt prüfen"
COM_DMARCREPORTS_ACTION_GENERIC_TEXT="Dieser Punkt erfordert Ihre Prüfung."

