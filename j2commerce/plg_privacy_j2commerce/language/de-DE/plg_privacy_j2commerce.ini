PLG_PRIVACY_J2COMMERCE_REMOVAL_DONE_RETAINED="J2Commerce: Adressen, Warenkörbe, Newsletter-Daten und abgelaufene Bestellungen dieses Benutzers wurden gelöscht bzw. anonymisiert. Die aufbewahrten Bestellungen wurden per E-Mail an %s gemeldet:"
