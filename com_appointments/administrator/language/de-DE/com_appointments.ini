COM_APPOINTMENTS_TEAM_F_SYSTEM_METHODS_FIX="Der Webserver oder eine Firewall-Regel (z.B. ModSecurity) hält diese Methoden vor Joomla an. Bitten Sie den Hoster, OPTIONS, PROPFIND, REPORT, PUT, DELETE und MKCALENDAR für die Kalenderadresse zuzulassen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_AUTH_HEADER="Internetkalender: Der Authorization-Header erreicht PHP"
COM_APPOINTMENTS_TEAM_F_SYSTEM_AUTH_HEADER_FIX="Verwenden Sie Joomlas htaccess.txt als .htaccess, die den Header mit der Regel E=HTTP_AUTHORIZATION weitergibt, oder bitten Sie den Hoster, den Authorization-Header an PHP weiterzugeben."
