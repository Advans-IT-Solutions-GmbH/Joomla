name: Publish - DMARC Reports MTA-STS Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'plg_system_dmarcmtasts/**'

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: system-dmarcmtasts v')"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="plg_system_dmarcmtasts/dmarcmtasts.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build extension
        run: |
          cd plg_system_dmarcmtasts
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd plg_system_dmarcmtasts
          PACKAGE=$(ls -1 plg_system_dmarcmtasts_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="system-dmarcmtasts-v${VERSION}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "::notice::Tag ${TAG} already exists on origin; treating as already published and skipping retag."
            exit 0
          fi
          git tag -a "${TAG}" -m "Release system-dmarcmtasts v${VERSION}"
          git push origin "${TAG}"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag -l "system-dmarcmtasts-v*" --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges -- plg_system_dmarcmtasts/ | grep -v '\[skip ci\]' | grep -v '^- release:' | head -20)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: system-dmarcmtasts-v${{ steps.version.outputs.new }}
          NOTES: |
            ## DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}

            System plugin that serves the MTA-STS policy (RFC 8461) for the
            DMARC Reports component dynamically at
            https://mta-sts.<domain>/.well-known/mta-sts.txt, built from the
            component's options with no hand-maintained static file. The DNS
            records and the one manual subdomain/TLS step are shown in the
            component's Action Center.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable the plugin and configure MTA-STS in the DMARC Reports
               component options

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - The DMARC Reports component (com_dmarcreports)

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          shopt -s nullglob
          FILES=(plg_system_dmarcmtasts/${{ steps.package.outputs.file }})
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}" \
            --notes "$NOTES" \
            --latest \
            "${FILES[@]}"

      - name: Delete previous releases
        run: |
          TAG_PREFIX="system-dmarcmtasts-v"
          CURRENT_TAG="system-dmarcmtasts-v${{ steps.version.outputs.new }}"
          for tag in $(git tag -l "${TAG_PREFIX}*" --sort=-v:refname | grep -v "^${CURRENT_TAG}$"); do
            release_id=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
            if [ -n "$release_id" ] && [ "$release_id" != "None" ]; then
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
              echo "Deleted release $tag (id: $release_id)"
            fi
            git push origin --delete "$tag" 2>/dev/null || true
            echo "Deleted tag $tag"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plg_system_dmarcmtasts/${{ steps.package.outputs.file }}
