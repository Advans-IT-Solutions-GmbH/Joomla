COM_APPOINTMENTS_SCHEDULE_FIELD_TIMEZONE_DESC="Le fuseau dans lequel les heures ci-dessous s'appliquent. Il décide de ce que signifie une heure telle que 14:00, y compris les deux jours de l'année où les horloges changent. Un visiteur peut afficher les heures dans son propre fuseau, ce qui ne change rien à la valeur enregistrée."
