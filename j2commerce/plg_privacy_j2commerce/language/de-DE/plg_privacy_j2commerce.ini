PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_LABEL="Template-Overrides"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_TITLE="Checkout- &amp; MyProfile-Overrides installiert"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_DESC="Das Plugin hat J2Commerce-Template-Overrides in Ihr aktives Frontend-Template kopiert. Diese Overrides fügen den Datenschutz-Tab im MyProfile hinzu und für J2Store/J2Commerce 4 die Datenschutz-Einwilligungscheckbox im Checkout. Unter J2Commerce 6 zeigt das mitgelieferte System-Plugin die Checkbox in den Checkout-Kerntemplates an, prüft sie serverseitig und protokolliert die Einwilligung pro Bestellung."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_COPIED="Kopiert:"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_SKIPPED="Bereits vorhanden (nicht überschrieben):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_SKIPPED_NOTE="<strong>Handlungsbedarf:</strong> Diese Dateien existierten bereits und wurden nicht verändert. Sie müssen manuell prüfen, ob sie die Datenschutz-Einwilligungscheckbox und den Datenschutz-Tab enthalten — oder sie durch die mitgelieferten Versionen aus <code>plugins/privacy/j2commerce/overrides/com_j2store/</code> bzw. <code>plugins/privacy/j2commerce/overrides/com_j2commerce/</code> ersetzen. Ohne diese Anpassung erscheinen weder die Checkout-Consent-Checkbox noch der MyProfile-Datenschutz-Tab. Siehe <strong>README.md → Template Integration</strong>."
PLG_PRIVACY_J2COMMERCE_ACYM_DOMAIN="Newsletter-Abonnements"

