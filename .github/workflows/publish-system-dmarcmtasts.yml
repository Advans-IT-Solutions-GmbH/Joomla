name: Publish - DMARC Reports MTA-STS Plugin

on:
  # A manual run only recovers a release whose push-triggered publication never ran,
  # for example because Actions could not start jobs; see the guard step below.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plg_system_dmarcmtasts/**'

concurrency:
  group: publish-system-dmarcmtasts-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: system-dmarcmtasts v'))"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Allow a manual run only for an unpublished release
        if: github.event_name == 'workflow_dispatch'
        env:
          EXTENSION_PATH: plg_system_dmarcmtasts
          RELEASE_PREFIX: 'release: system-dmarcmtasts v'
        run: |
          # The newest commit on the extension must be its release commit, so the
          # checkout builds exactly the released content. publish-release.py then
          # refuses a version whose tag already exists on another commit.
          SUBJECT=$(git log -1 --format=%s -- "$EXTENSION_PATH/")
          case "$SUBJECT" in
            "$RELEASE_PREFIX"*) echo "Recovering the publication of: $SUBJECT" ;;
            *) echo "::error::The newest commit on $EXTENSION_PATH is not a release commit: $SUBJECT"; exit 1 ;;
          esac

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="plg_system_dmarcmtasts/dmarcmtasts.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "system-dmarcmtasts-v" --version "${{ steps.version.outputs.new }}"

      - name: Build extension
        run: |
          cd plg_system_dmarcmtasts
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd plg_system_dmarcmtasts
          PACKAGE=$(ls -1 plg_system_dmarcmtasts_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- plg_system_dmarcmtasts/ | awk '!/\[skip ci\]/ && !/^- release:/ { if (count++ < 20) print }')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: system-dmarcmtasts-v${{ steps.version.outputs.new }}
          NOTES: |
            ## DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}

            System plugin that serves the MTA-STS policy (RFC 8461) for the
            DMARC Reports component dynamically at
            https://mta-sts.<domain>/.well-known/mta-sts.txt, built from the
            component's options with no hand-maintained static file. The DNS
            records and the one manual subdomain/TLS step are shown in the
            component's Action Center.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable the plugin and configure MTA-STS in the DMARC Reports
               component options

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - The DMARC Reports component (com_dmarcreports)

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "system-dmarcmtasts-v" --version "${{ steps.version.outputs.new }}" \
            --package "plg_system_dmarcmtasts/${{ steps.package.outputs.file }}" \
            --title "DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plg_system_dmarcmtasts/${{ steps.package.outputs.file }}
