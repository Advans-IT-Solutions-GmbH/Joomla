; Help page
COM_J2COMMERCE_IMPORTEXPORT_HELP_TITLE="J2Commerce Import/Export: Help"
COM_J2COMMERCE_IMPORTEXPORT_HELP_INTRO="This page explains the export and the import of products, the import options and the Options of the component, how the import finds existing products and what it does when a record fails."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CONTENTS="Contents of the help"
COM_J2COMMERCE_IMPORTEXPORT_HELP_BACK="Back to J2Commerce Import/Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_TITLE="What the component does"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_DESC="J2Commerce Import/Export writes the product data of your shop to a file and imports complete products from a JSON or CSV file. Use it to move products from one site to another, to keep a copy of the products as a file, or to create and change many products at once."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_PRODUCT="A product of the shop consists of a Joomla article (title, texts, category, images) and the product record of the shop with variants, stock, tier prices, product images, options, filters, download files, tags and custom fields. The export type «Products (Complete)» and the import handle all these parts together, and optionally a menu item for the article."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_SCOPE="The component has no database tables of its own, no scheduled task and sends no e-mail. Uninstalling it does not undo imports: the imported articles, categories and products stay."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TITLE="Prerequisites and permissions"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP="The component works with J2Store 4 and with J2Commerce 6. It detects the shop by itself, there is nothing to set:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_1="J2Commerce 6, when the component J2Commerce (<code>com_j2commerce</code>) is enabled and its product table exists."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_2="Otherwise J2Store 4, when the component J2Store (<code>com_j2store</code>) is enabled and its product table exists."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_3="If neither applies, the tables of J2Commerce 6 if they exist, otherwise the tables of J2Store 4."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_BOTH="If both shop components are enabled, as right after a migration, the component works with J2Commerce 6."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACCESS="To open the component and this help, a user needs the permission «%1$s» on the component. The «%2$s» button in the toolbar of the component opens this page."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACTIONS="The export area also requires the action «Export», the import area the action «Import». Both are set under «%1$s», tab «%2$s». The page shows only the areas the user may use. Installing or updating the component grants both actions to every group that may manage the component at that moment. Rules that already exist stay as they are."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT="An import also checks the Joomla permissions of the importing user, as the backend does when the same changes are saved by hand. A record fails if one of these permissions is missing:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_ARTICLE="Articles: «%1$s» in the target category for a new article and for moving an article into another category. «%2$s» for an existing article, or «%3$s» if you are its author."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_STATE="Status, access level, featured flag and publishing dates of an article: changing them requires «%1$s». Without this permission a new article is saved unpublished with the access level ID 1 (Public in a standard installation), and an existing article keeps these values. A record that sets other values fails."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_CATEGORY="New categories: «%1$s» on the Articles component or on at least one category. A new category is published only with «%2$s» on the Articles component."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_MENU="Menu items: «%1$s» on the target menu for a new item, «%2$s» for an existing item, and «%3$s» when the publication state changes. This also applies to a new item that is published."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_TAGS="New tags: «%1$s» on the Tags component. Custom fields: «%2$s» on the field."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TRUST="Give access to this component only to trusted administrators. An import changes articles, categories, menus and shop data."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TITLE="Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_1="In the «Export» area, choose the «Type»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_2="Choose the «Format»: JSON, CSV or XML."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_3="Click «Export Data». The browser downloads a file named after the type, the date and the time, for example <code>products_full_2026-01-31_14-05-00.json</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPES_TITLE="What each type contains"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_FULL="«Products (Complete)»: every product of the shop whose source is a Joomla article. Each record holds the article (title, alias, texts, status, category with its title, alias and path, access level, language, featured flag, dates, images, links, attributes and metadata), the product record, the variants with stock and tier prices, the product images, the options with their values, the filters, the download files, the tags, the custom field values, the metafields and one site menu item that links to the article."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRODUCTS="«Products (J2Store only)»: all records of the product table of the detected shop, without article data. Despite the name, this is the J2Commerce 6 table when the component works with J2Commerce 6."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_CATEGORIES="«Categories»: all article categories with all their fields, in the order of the category tree."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_VARIANTS="«Variants»: all variant records of the shop, without stock and tier prices."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRICES="«Prices»: all tier price records of the shop."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_NO_FILTER="The export has no filters and no selection. It always contains all records of the chosen type, including unpublished, disabled and trashed ones."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMATS_TITLE="Formats"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_JSON="JSON: a part <code>_documentation</code> with notes and a description of the fields, followed by the list <code>products</code>. The list has this name for every type, also for categories, variants and prices."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_CSV="CSV: UTF-8 with byte order mark. The first line describes each column and starts with <code>#</code>, the second line holds the column headings, then follows one line per record. Delimiter and enclosure come from the Options («CSV Delimiter», «CSV Enclosure»)."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_FORMULA="In CSV, a text cell that a spreadsheet would run as a formula (it starts with <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code>, a tab or a line break) gets a leading apostrophe. Plain numbers, also negative ones, stay unchanged. The import removes the apostrophe again."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_XML="XML: a part <code>field_documentation</code> and a part <code>items</code>. XML files cannot be imported."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FOR_IMPORT="Only «Products (Complete)» can be imported again. Use the format JSON for this export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_TITLE="Import"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_1="In the «Import» area, the «Type» is always «Products (Complete)»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_2="Under «File», choose the JSON or CSV file."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_3="Open «%1$s» below the file and check the import options."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_4="Click «Upload File». The file is uploaded and read completely. The «Preview» shows the first five records and the «Total rows»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_5="Click «Start Import» and confirm the question. A message then shows how many records were «Imported» and how many «Failed», with the reason for every failed record."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_SESSION="Preview and import always use the file you uploaded last. If you choose another file, the preview disappears and you upload again. If you upload a file in another browser tab, the first tab can no longer start its import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPTIONS_TITLE="Import options"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_UPDATE="«Update existing products» (selected by default): a record that matches an existing product updates it, see «How existing products are found and updated». If the checkbox is cleared, every record creates a new article and a new product. A record whose alias already exists in its category then fails."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU="«Create menu items» (cleared by default): for every record with a <code>menu_item</code> part, a site menu item that shows the article is created or updated. Records without this part get no menu item. The part needs a title. A menu item in the same menu, with the same parent item and the same link to the article, is updated instead of created again."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU_DEFAULTS="«Menu», «Menu Access Level» and «Menu items published» apply only where the <code>menu_item</code> part has no <code>menutype</code>, <code>access</code> or <code>published</code>. An exported <code>menu_item</code> always contains these values, so the values of the file apply. The parent item comes from <code>parent_id</code>. Without it, the item is created at the top level of the menu."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_CATEGORY="«Default Category»: the article category for records that have neither <code>catid</code> nor <code>category_path</code>. The list shows the published article categories."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_QUANTITY="«Quantity Update Mode»: «Replace (overwrite)» stores the quantity of the file as the new stock. «Add (to existing stock)» adds the quantity of the file to the stock the variant already has. A variant without stock record gets the quantity of the file in both modes. A variant without <code>quantity</code> counts as 0, so in the mode «Replace (overwrite)» its stock becomes 0."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_NOT_SAVED="The import options are not stored. Check them before every import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_TITLE="Import file"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_JSON="JSON: a list of product records, or an object with the list <code>products</code>, as the export «Products (Complete)» writes it. Other parts such as <code>_documentation</code> are ignored. Every record must be an object with named fields."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV="CSV: UTF-8, with or without byte order mark. The import always expects a comma as delimiter and double quotes as enclosure, whatever the Options say. Empty lines and lines whose first cell starts with <code>#</code> are skipped. The first other line holds the column headings, none of them may be empty or appear twice. Every line needs as many cells as there are headings. A quote inside a cell is doubled. Files with backslash escapes, as older exports wrote them, are read as well."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV_LISTS="In CSV, the columns <code>variants</code>, <code>product_images</code>, <code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code>, <code>metafields</code> and <code>menu_item</code> hold JSON text, for example a list in square brackets. An empty cell means none."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_SIZE="A file may be at most 10 MB. A lower upload limit of the server (PHP settings <code>upload_max_filesize</code> and <code>post_max_size</code>) applies first."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_INVALID="The preview already reads the whole file. Errors in the file as a whole stop it, and nothing is imported: invalid JSON, a JSON object without the list <code>products</code>, a record that is not an object, wrong quoting, a wrong number of cells or a list column that is not valid JSON."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELDS_TITLE="Fields of a product record"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TITLE="<code>title</code>: required. A record without title fails."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ALIAS="<code>alias</code>: optional. If it is missing or empty, the alias is formed from the title. The alias is stored in the URL-safe form Joomla uses."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TEXT="<code>introtext</code> and <code>fulltext</code>: HTML. They pass the text filters of the user groups of the importing user (Global Configuration, tab «Text Filters»), as when the article is saved in the backend."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_STATE="<code>article_state</code> (1 published, 0 unpublished, 2 archived, -2 trashed), <code>access</code> (ID of an access level), <code>featured</code> (1 or 0), <code>publish_up</code> and <code>publish_down</code> (date, empty means none, an empty <code>publish_up</code> keeps the current start), <code>language</code> (default <code>*</code>), <code>metakey</code> and <code>metadesc</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_JSON="<code>article_images</code>, <code>urls</code>, <code>attribs</code> and <code>metadata</code>: JSON objects. Markup is removed from their texts. The links <code>urla</code>, <code>urlb</code>, <code>urlc</code>, <code>image_intro</code> and <code>image_fulltext</code> may only use http, https, mailto, tel, ftp, ftps or sftp, other links are emptied. A value that is not a JSON object makes the record fail."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_CATEGORY="<code>catid</code>, <code>category_path</code>, <code>category_title</code> and <code>category_alias</code>: the target category, see «Categories, articles and aliases»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ID="<code>article_id</code>: the ID of the article to update, see «How existing products are found and updated»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_PRODUCT="Product fields: <code>product_type</code> (default <code>simple</code>), <code>visibility</code>, <code>enabled</code>, <code>taxprofile_id</code>, <code>manufacturer_id</code>, <code>vendor_id</code>, <code>has_options</code>, <code>addtocart_text</code>, <code>params</code>, <code>plugins</code>, <code>up_sells</code>, <code>cross_sells</code> and <code>main_tag</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_VARIANTS="<code>variants</code>: list of variants with <code>sku</code>, <code>price</code>, <code>quantity</code>, <code>manage_stock</code>, <code>weight</code>, <code>length</code>, <code>width</code>, <code>height</code> and the other variant fields of the export. Each variant may have a list <code>tier_prices</code> with <code>quantity_from</code>, <code>quantity_to</code>, <code>date_from</code>, <code>date_to</code>, <code>customer_group_id</code> and <code>price</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_IMAGES="<code>product_images</code>: <code>main_image</code>, <code>thumb_image</code> and <code>additional_images</code> with their alternative texts. Paths are relative to the Joomla root, for example <code>images/products/photo.jpg</code>. The import stores only the paths: upload the image files beforehand, for example with the Media manager."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_LISTS="<code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code> and <code>metafields</code>: lists as the export writes them. An entry of <code>custom_fields</code> needs <code>name</code> and <code>value</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_MENU="<code>menu_item</code>: optional part with <code>title</code>, <code>alias</code>, <code>menutype</code>, <code>parent_id</code>, <code>access</code>, <code>published</code>, <code>language</code> and <code>params</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_DEFAULTS="When an existing product is updated, every product field and every variant field missing in the record is written with its default value, it is not kept. Import complete records, best an export that you have edited."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_TITLE="How existing products are found and updated"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_INTRO="With «Update existing products» selected, the import looks for the article of each record in this order and stops at the first hit:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_1="The article with the ID in <code>article_id</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_2="An article with the same alias, in any category: first in the URL-safe form, then as written in the file."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_3="The article of the product that has a variant with the SKU of the first variant of the record."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_SHOP_ONLY="The article found must belong to a product of the active shop. Otherwise the record fails with Joomla's permission message, so an ordinary article with the same alias is never overwritten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_VARIANTS="The product record of the article is updated. Variants are matched by SKU within the product: a variant with a known SKU is updated, every other variant of the file is added. Variants that are missing in the file stay unchanged."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TITLE="What is replaced and what is added"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_PRICES="Tier prices of a variant: replaced when the variant in the file has tier prices, otherwise kept."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_IMAGES="Product images: replaced when the record has <code>product_images</code>, otherwise kept."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_OPTIONS="Options: all options of the product are replaced when the record has <code>options</code>. An option is found by <code>option_unique_name</code>, an option value by its name within the option. Missing options and values are created."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILTERS="Filters: replaced when the record has <code>filters</code>. A filter is taken by <code>filter_id</code> or found by its name within its filter group. Missing filters and filter groups are created."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TAGS="Tags: replaced when the record has <code>tags</code>. A tag is taken by <code>id</code> or found by its title. A missing tag is created."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FIELDS="Custom fields: the value of each named field is replaced. Unknown field names are skipped without a message."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_META="Metafields: only with J2Commerce 6, replaced when the record has <code>metafields</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILES="Download files: always added, never replaced. Importing the same record again adds its files once more."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_STOCK="Stock: besides the quantity, the import also writes <code>on_hold</code> and <code>qty_sold</code> from the file, 0 if they are missing."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_TITLE="Categories, articles and aliases"
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_CATID="<code>catid</code> is set: this article category is used. If it does not exist, the record fails. <code>catid</code> takes precedence over <code>category_path</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_PATH="<code>category_path</code> is set and <code>catid</code> is not: the article category with exactly this path is used, for example <code>shop/electronics</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW="If no category has this path, a new category is created at the top level, not below the path. Its title is <code>category_title</code>, or Imported if that is missing. Its alias is <code>category_alias</code> or else the title, in URL-safe form. If a top-level article category with this alias exists and is not trashed, it is used, so the later records of the same file land in the same category."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_DEFAULT="Neither <code>catid</code> nor <code>category_path</code>: the «Default Category» of the import options is used."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW_STATE="A new category is published only if you have «%1$s» on the Articles component, otherwise it is unpublished. It gets the default access level of the site and the language All, and it inherits its permissions."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_NEW="New articles are created through Joomla's article table. They pass Joomla's checks and get their own permissions, which they inherit from their category. The importing user is recorded as author."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_UPDATE="Existing articles are updated directly. Their alias must be unique within the target category, otherwise the record fails with Joomla's message about the alias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_MOVE="If a record moves an article into another category, the permissions of the article are placed below the new category after the record is saved. If that fails, the error of the record says that the record was imported. The next import of this article places the permissions correctly first."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_ALIAS="If neither the alias nor the title gives a URL-safe alias, for example a title in a non-Latin script while Unicode aliases are switched off in the Global Configuration, the record fails. Give the record an alias with Latin letters or digits."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_TITLE="Errors and undo of failed records"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ROWS="Every record is imported on its own. A failing record does not stop the others. The result shows «Imported» and «Failed» and one line per failed record, for example «Row 3: …». The number counts the product records of the file, starting at 1, not the lines of the file. If no record is imported, the message «Import failed. Please check the file and try again.» appears with the same lines."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ORDER="Joomla stores categories, permissions and menu items in a way that ends an open database transaction. That is why the import first writes the new category, the new article and the menu item of a record, and then everything else in one transaction: the update of an existing article, the product, variants, stock, tier prices, images, options, filters, download files, tags, custom fields and metafields."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_UNDO="If a later step fails, the transaction is rolled back. The category, article and menu item that the record created are deleted again. A menu item that the record changed gets its previous values back, including the publication state of its child items."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP="This undo leaves an item alone if someone changed it in the meantime:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_CATEGORY="A new category that already holds articles or subcategories, or that was edited."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_ARTICLE="A new article that was saved or opened by an editor."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU="A new menu item that was edited or got child items."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU_CHANGED="A changed menu item that was edited again or whose child items changed."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_REPORT="Everything that was not undone is named in the error of the record: «These changes of the row could not be undone: …». Check these items and remove or correct them by hand."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_NO_UNDO="A successful import cannot be undone. Export the products or back up the database before a large import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_TITLE="Options"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_OPEN="The «%1$s» button in the toolbar opens the Options of the component. It is shown only to users with «%2$s» or «%3$s»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_DELIMITER="«CSV Delimiter»: comma (default), semicolon or tab. Applies only to the CSV export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_ENCLOSURE="«CSV Enclosure»: double quote (default) or single quote. Applies only to the CSV export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_PERMISSIONS="Tab «%1$s»: who may open the component («%2$s»), import («Import») and export («Export»)."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_CSV_IMPORT="The import always expects comma and double quote. A CSV file exported with other settings cannot be imported unchanged."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TITLE="Typical problems and what to do"
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILE_TYPE="«Invalid file type. Only CSV and JSON files are allowed.»: the file name must end in <code>.csv</code> or <code>.json</code> and the content must be text. XML files and spreadsheet files such as <code>.xlsx</code> cannot be imported. Save a spreadsheet as CSV, comma separated, UTF-8."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TOO_LARGE="«File too large. Maximum file size is 10 MB.» or «File upload failed.»: the file exceeds 10 MB or the upload limit of the server. Split it into several files."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_INVALID="«Invalid import data. …»: the file or a record does not have the expected form, for example invalid JSON, a wrong number of cells, an unknown value in <code>article_state</code>, a <code>catid</code> that is no article category, a menu that does not exist or a JSON column that is not an object. In CSV, check that all list columns hold valid JSON."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DENIED="«%1$s» for a record: one of the Joomla permissions under «Prerequisites and permissions» is missing, or the article found does not belong to a product of the active shop, for example an ordinary article with the same alias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DUPLICATES="Products are created twice: «Update existing products» was cleared, or the record has no <code>article_id</code>, alias or SKU that matches the existing product."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_OTHER_SITE="Importing an export from another site: IDs differ between sites. <code>article_id</code> may update the wrong product or be refused, <code>catid</code> may point to a wrong or missing category, and the IDs of tags, filters, tax profiles, manufacturers and parent menu items are used as they are. Remove <code>article_id</code> and <code>catid</code> (the category then comes from <code>category_path</code>) and check the other IDs before the import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_STOCK="The stock is 0 after the import: with «Replace (overwrite)» a variant without <code>quantity</code> gets 0. Include the quantity or choose «Add (to existing stock)»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_IMAGES="Images are missing: the import stores only paths. Upload the images first and use paths relative to the Joomla root."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_EMPTY="The export is empty: there are no records of this type, or for «Products (Complete)» no product whose source is a Joomla article. If J2Store and J2Commerce are both installed, check which shop component is enabled, see «Prerequisites and permissions»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_APOSTROPHE="Cells of the CSV export start with an apostrophe: this protects values that a spreadsheet would run as a formula. Leave the apostrophe in place, the import removes it."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILES="Download files appear twice: they are added on every import. Remove the list <code>files</code> from records that you import again."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_ALIAS="«The alias or title cannot be converted into a URL-safe alias. …»: see «Categories, articles and aliases»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_CHANGED="«The upload no longer matches this preview. …» or «File not found. Please upload the file again.»: another tab replaced the upload, the file was already imported or the session ended. Upload the file again."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_TITLE="Data protection"
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_EXPORT="Export files contain product and article data of the shop, including the internal user IDs of authors and editors and the settings of menu items. They contain no orders and no customer data. Keep them protected and delete them when you no longer need them."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_UPLOAD="An uploaded import file is stored in the <code>tmp</code> folder of Joomla under a random name (<code>j2commerce_import_…</code>). The import deletes the file after it has run. A file that you upload but do not import stays there: delete such files regularly."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_LOCAL="Export and import run on your own server. The files travel only between your browser and your site."
