ADVANS_TASKS_TRIGGER_LAZY="Geplante Aufgaben werden durch Besuche der Website gestartet (Lazy-Zeitplaner). Auf einer wenig besuchten Website laufen sie verspätet; ein Cronjob auf dem Server ist zuverlässiger."
ADVANS_TASKS_TRIGGER_WEBCRON="Web-Cron ist eingeschaltet. Ob ein externer Dienst ihn regelmässig aufruft, lässt sich hier nicht prüfen."
ADVANS_TASKS_TRIGGER_RUNNER_OFF="Das Plugin «System – Zeitplan Runner» ist ausgeschaltet. Geplante Aufgaben laufen dann nur, wenn der Server sie mit einem Cronjob startet (php cli/joomla.php scheduler:run). Gibt es keinen solchen Cronjob, schalten Sie das Plugin unter System → Verwalten → Plugins ein."
ADVANS_TASKS_TRIGGER_CLI_ONLY="Weder der Lazy-Zeitplaner noch Web-Cron ist eingeschaltet (System → Verwalten → Geplante Aufgaben → Optionen). Geplante Aufgaben laufen dann nur, wenn der Server sie mit einem Cronjob startet (php cli/joomla.php scheduler:run). Gibt es keinen solchen Cronjob, schalten Sie dort den Lazy-Zeitplaner ein."
ADVANS_TASKS_TRIGGER_OFF="Die Joomla-Komponente «Geplante Aufgaben» ist ausgeschaltet. Deshalb läuft keine geplante Aufgabe. Schalten Sie sie unter System → Verwalten → Erweiterungen ein."
ADVANS_TASK_PURPOSE_PRIVACY_CLEANUP="Sie anonymisiert Shop-Bestellungen und löscht gespeicherte Adressen, sobald die gesetzliche Aufbewahrungsfrist abgelaufen ist, wie es das Datenschutzrecht verlangt."
ADVANS_TASK_SETTINGS_PRIVACY_CLEANUP="Aufbewahrungsfrist: %1$s Jahre nach dem Ende des Geschäftsjahres am %2$s (Monat-Tag), wie im Datenschutz-Plugin eingestellt. Die Aufgabe übernimmt auch dessen Einstellungen «Bestellungen anonymisieren» und «Adressen löschen»."
ADVANS_TASK_PURPOSE_APPOINTMENTS_REMINDERS="Sie verschickt die Terminerinnerungen zu den Zeitpunkten, die in den Optionen von Termine eingestellt sind."
ADVANS_TASK_PURPOSE_APPOINTMENTS_RETENTION="Sie anonymisiert beendete Buchungen nach der Aufbewahrungsfrist aus den Optionen von Termine, wie es das Datenschutzrecht verlangt."
ADVANS_TASK_PURPOSE_APPOINTMENTS_CLOSE="Sie überträgt freigegebene Buchungen an Close. Sie wird erst gebraucht, wenn die Übertragung an Close eingerichtet ist."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMCLEANUP="Sie entfernt gesperrte Geräte der Internetkalender und abgelaufene Anmeldezähler."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMLOG="Sie löscht Einträge im Protokoll der Internetkalender nach ihrer Aufbewahrungsfrist."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMINVITATIONS="Sie schliesst abgelaufene Einladungen zu den Internetkalendern."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMRETENTION="Sie löscht Buchungskopien in den Internetkalendern nach der Aufbewahrungsfrist des jeweiligen Kalenders."
ADVANS_TASK_PURPOSE_DMARC_INGEST="Sie importiert die DMARC- und TLS-Berichte aus den Postfächern, die in DMARC Reports eingerichtet sind. Ohne Postfach tut sie nichts."
