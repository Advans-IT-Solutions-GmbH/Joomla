COM_APPOINTMENTS_TEAM_E_BOOKING_UNVERIFIED_DESC="Diese Buchung stammt aus der Zeit vor Version 1.4.0 und ist noch unverschlüsselt gespeichert, weil ihre Verschlüsselung nicht innerhalb der Übergangsfrist abgeschlossen wurde. Ihre Daten könnten direkt in der Datenbank verändert worden sein. Prüfen Sie die Buchung und verschlüsseln Sie sie danach als Administrator in der Buchungsliste mit «Jetzt verschlüsseln»."
COM_APPOINTMENTS_TEAM_E_BOOKINGS_UNVERIFIED_NOTICE="%d Buchungen aus der Zeit vor Version 1.4.0 sind noch unverschlüsselt gespeichert und als nicht verifiziert gekennzeichnet. Ihre Daten könnten direkt in der Datenbank verändert worden sein. Prüfen Sie sie und verschlüsseln Sie sie danach als Administrator in der Buchungsliste mit «Jetzt verschlüsseln»."
