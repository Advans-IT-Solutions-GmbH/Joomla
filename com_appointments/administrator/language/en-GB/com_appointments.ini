COM_APPOINTMENTS="Appointments"
COM_APPOINTMENTS_MENU_HELP="Help & tips"
COM_APPOINTMENTS_HELP_TITLE="Help & tips"
COM_APPOINTMENTS_HELP_INTRO="A practical guide to configuring this self-hosted component. Start with a small test setup and verify the complete booking lifecycle before publishing. Field help remains available where each setting is edited; software defaults are not legal retention recommendations."
COM_APPOINTMENTS_HELP_CONTENTS="Help topics"
COM_APPOINTMENTS_HELP_SETUP_TITLE="First setup: calendar, schedule and booking page"
COM_APPOINTMENTS_HELP_SETUP_BASE_DESC="Review component Options: privacy notice/consent, guest limits, mail delivery and retention. Internet calendars are optional; ordinary scheduling can run without linking a booking calendar. If you use internet calendars, start with one internal calendar and its intended owner, not a large set of grants."
COM_APPOINTMENTS_HELP_SETUP_SCHEDULE_DESC="Create a reusable schedule with its actual timezone and weekly opening hours. Add blocked periods for exceptions. The schedule timezone controls the weekly hours; stored booking times are UTC. Check daylight-saving transitions and the displayed times on a test booking page."
COM_APPOINTMENTS_HELP_SETUP_BOOKING_DESC="Create an event type, select its schedule and host, then configure duration, slot step, buffers, notice, booking horizon and capacity. A linked booking calendar requires the host's own effective Write access; an administrator does not supply that access. Publish either 'Book an appointment' for one event type or the 'Event types' list through Joomla's menu manager. Test booking, confirmation, rescheduling, cancellation and erasure before opening the page to visitors."
COM_APPOINTMENTS_HELP_ADMIN_TITLE="Administrative rights are not content keys"
COM_APPOINTMENTS_HELP_SHARES_TITLE="Grants, ownership and recovery"
COM_APPOINTMENTS_HELP_SHARES_DESC="Use the calendar editor to inspect grants and their actual state before changing roles or ownership. Internal membership, an active account, an approved second factor and valid key wraps determine effective access; a visible grant row alone does not. Key-holding administrative grants or a new owner may remain pending until a genuine holder or authorised recovery supplies the wraps. Revocation removes the recipient's wrap and marks content-key rotation due; perform rotation with real authorised keys. Store the recovery secret securely and separately, and never paste it into support messages."
COM_APPOINTMENTS_HELP_DEVICES_TITLE="Devices and CalDAV clients"
COM_APPOINTMENTS_HELP_DEVICES_DESC="A calendar client needs a device belonging to the person who has effective calendar access and usable personal keys. Sign in with password and an approved second factor, then use the personal calendar/device actions to create the device. Use the HTTPS CalDAV address and device password shown by the component, not another person's credentials. Keep the one-time password safe; revoke a lost or retired device. Administrators can block or revoke devices without thereby gaining content keys. Revocation cannot recall data a client has already downloaded."
COM_APPOINTMENTS_HELP_RETENTION_TITLE="Three separate retention lifecycles"
COM_APPOINTMENTS_HELP_PRIVACY_TITLE="Privacy, consent and erasure"
COM_APPOINTMENTS_HELP_PRIVACY_DESC="Configure the notice, consent mode and privacy link for your own process rather than treating a software default as a legal decision. Only the primary invitee receives signed rescheduling, cancellation and erasure capabilities; additional guests and hosts receive notifications without those capabilities. Joomla privacy requests and the primary invitee's erasure link are separate supported entry points. An internet-calendar retention period does not determine how long personal booking data is kept."
COM_APPOINTMENTS_HELP_MAIL_TITLE="Mail, languages and optional conferencing"
COM_APPOINTMENTS_HELP_MAIL_DESC="Configure Joomla mail and test actual delivery; a green local system check alone does not prove delivery. Maintain e-mail templates in de-DE, en-GB and fr-FR. Recipients use their account language, otherwise the site default, including guests. Confirmation, rescheduling and cancellation include an iCalendar attachment. Conferencing is optional: configure any provider/address deliberately and verify its generated links. The core booking flow requires no external scheduling service."
COM_APPOINTMENTS_HELP_TROUBLE_TITLE="Troubleshooting"
COM_APPOINTMENTS_HELP_TROUBLE_SLOTS_DESC="No bookable slots? Check publication/access, the selected schedule and its timezone, blocked periods, notice, horizon, buffers and capacity. For linked calendars, check the host's genuine access, the selected busy calendars and booking target. Administrative rights alone do not make a host writable."
COM_APPOINTMENTS_HELP_TROUBLE_SYNC_DESC="Missing or stale client entries? Check that internet calendars and required plugins are enabled, the account/group/factor is still eligible, the device is active and the grant has usable wraps. Review the calendar log and pending rotation. An age-deleted object can be recreated by a later upload or booking update; deletion is not a permanent ban on its UID. Never fix a pending key by fabricating database grants or wraps."
COM_APPOINTMENTS_HELP_TROUBLE_CHECKS_DESC="Repeat the system check from component Options and inspect Joomla's Scheduled Tasks execution history. Enabled tasks still need a reliable actual trigger. Saving a retention setting does not execute cleanup. For failed installation/update replacements, review the exact old/new file hashes and use the documented installer approval process; do not overwrite files blindly."
COM_APPOINTMENTS_HELP_CONFIG_DESC="Open <a href='index.php?option=com_appointments&amp;view=help'>Help &amp; tips</a> for first setup, calendars, schedules, booking pages, rights/keys, devices, retention, privacy, mail and troubleshooting. This supplements the field help and does not change any setting."
COM_APPOINTMENTS_XML_DESCRIPTION="Self-hosted appointment scheduling. Publish bookable time slots, let a visitor pick a time, and attach the calendar entry to every confirmation. Everything runs on your own server and no third-party service is contacted."

