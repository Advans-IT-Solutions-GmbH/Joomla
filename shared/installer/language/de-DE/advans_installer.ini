ADVANS_CHECK_GUARD_ERROR="Die Installation wurde abgebrochen, bevor etwas verändert wurde: Die vorhandenen Dateien liessen sich nicht sicher prüfen, zum Beispiel weil eine Datei nicht lesbar oder ein symbolischer Link ist. Bitten Sie die Serveradministration, die Dateirechte zu prüfen, und wiederholen Sie dann die Installation."
ADVANS_CHECK_APPROVAL="Updates ersetzen die Dateien dieser Erweiterung selbständig. Dateien, die auf dieser Website geändert wurden, werden vorher gesichert und nach der Installation aufgelistet. Die Installation hält nur an, wenn das Fortfahren eine andere Erweiterung beschädigen könnte."
