PLG_SYSTEM_PRIVACYREQUESTS="System - Privacy Requests"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="Account-free email confirmation for removal requests in Joomla Privacy. Enable explicitly, then link the public request page. Core administrator permissions and privacy plugin blockers still apply."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Request removal of personal data"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="You do not need an account. Enter your email address to request a confirmation code, or enter the code from your email to confirm your request. Request a code again if it expired; this renews a pending request without changing its original receipt date."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Confirmation code (from your email)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Request or renew code"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Confirm request"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="If this address is accepted for processing, a Core request is recorded or an existing request retained. This response does not confirm receipt, email delivery, confirmation or data removal. Check your email; if no code arrives, retry later or contact the site operator by an alternative channel. Repeated submissions may be limited."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Privacy request: confirmation delivery failed"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="Confirmation delivery failed for Core request %d. Its original receipt and pending state remain. Review the native request and mail configuration. Resolve delivery to the original address, then renew through the guest request form. Operator contact permits communication and proportionate assessment, not confirmation of this Core request. Stock Joomla provides no supported manual confirmation action for a rejected original recipient. Keep it pending; do not substitute an address or force confirmed/completed status."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="Confirmation delivery failed. This pending Core receipt and its original date are retained; neither delivery nor identity is proven. Exact Unicode matching does not imply Joomla mail support for Unicode before @. Use the operator contact route for communication and proportionate assessment. Contact or another reply address does not confirm this request. Stock Core provides no supported manual confirmation action for a rejected original recipient: keep it pending until original-address confirmation works. Do not bypass confirmation, Remove or Complete."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Your request is confirmed for administrator processing. This confirms access to this email address, not every identity or entitlement. No data has been removed by this confirmation."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="This code has expired, not your right or the original request. Request a renewed code on this page or contact the site operator for an alternative way to confirm."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="The request could not be confirmed. Check the email address and code, or try again later. You can request a renewed code or contact the site operator."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Enter a valid email address of at most 100 characters. Addresses with umlauts or other special characters before the @ are not accepted, as everywhere in Joomla."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="The request service could not finish this operation. Do not assume receipt or confirmation. Please retry later or contact the site operator by an alternative channel."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="The privacy operation cannot start safely. Another operation may still be running. Do not assume removal or completion; retry later or inspect the administrator log."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="The administrator reviews identity, scope and applicable retention requirements before removal. Automated removal covers only participating privacy plugins. Email, calendar-client, CRM, backup and other external copies require separate assessment; retained audit and lawful evidence are not a claim that everything was erased."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="The account selected by Joomla does not exactly match the request address. Resolve the address mismatch before removing data."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Confirm this account-free request using its email address and confirmation code on the public request page."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="I reviewed the removal scope and the response to the requester"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Before retrying Remove, I verified remediation of earlier partial cleanup"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Removal retry is blocked: explicitly review remediation of the earlier incomplete attempt before running Remove again. Checking the box does not repair remaining data."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="Use only after independently resolving and verifying earlier failures, including copies no longer discoverable by the original address. This is not a waiver of current errors, unreadable content or plugin legal blockers. It does not complete the request."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Before Complete, run Remove successfully without unresolved warnings. Review participating plugins, additional identity needs, retained evidence, and separate external copies. Core completion records processing, not proof of universal erasure."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Completion is blocked: first run Remove without unresolved warnings, then explicitly review the scope and response. A dispatched callback alone is not proof of complete erasure."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Operator contact route"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Required before activation: an existing public local Joomla contact page, starting with index.php, for example index.php?option=com_contact&view=contact&id=42. Use the site's actual ID and test contact without an account. No external URL, redirect or fragment. Contact does not confirm or complete a Core request."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Contact the site operator"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Use this contact route if no code arrives or Joomla cannot send to your original address. State the original address accurately. Another reply address is a communication channel only, not proof of control of that mailbox. Contact alone does not confirm the Core request or authorize removal."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="A contact link has not been configured here. Use the operator contact details in this site's legal or privacy information. Do not assume that this page has received or confirmed your request."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_PRIVACYREQUESTS_HELP_NOTE="The ‘Help’ tab explains what this plugin does, how to set it up and what to do if something goes wrong."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_TAB="Help"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_TITLE="What this plugin does"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_P1="In the frontend Joomla accepts privacy requests only from logged-in people. This plugin adds a public page on which people without a user account submit a removal request and confirm it with a code from an e-mail. The request is a normal request of Joomla's Privacy component."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI1="The page has the address <code>index.php?option=com_ajax&plugin=privacyrequests&group=system&format=html</code>. Link to it, e.g. from your privacy policy."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI2="The page accepts removal requests only, no export requests."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI3="Processing stays with you: you carry out the removal under ‘Users → Privacy → Requests’ and complete the request. Joomla calls all active privacy plugins for this."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI4="While the plugin is enabled, it adds safeguards to every removal request, also to requests that did not come from this page (section ‘Limits and locks’)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI5="The installation does not enable the plugin, changes no mail settings and creates no scheduled tasks."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_NOTE1="A confirmed e-mail address only proves access to that mailbox. Check identity and scope yourself before you delete data."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_TITLE="Setup step by step"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP1="Check the website's mail delivery in the Global Configuration. If sending mail is switched off, the page accepts no requests."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP2="Create a contact page that can be reached without logging in, e.g. a contact form of Joomla's Contacts component."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP3="Enter its path in the field ‘Operator contact route’ and save."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP4="Enable the plugin."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP5="Link to the public page."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP6="Test request, confirmation, removal and completion on a test installation with a test address such as <code>test@example.org</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_TITLE="Installation, update and uninstall"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI1="Install the ZIP with Joomla's extension installer. The installation creates the three helper tables, does not enable the plugin and creates no scheduled tasks. The plugin needs no scheduled task."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI2="Before updating, take a current, complete backup of the whole website that you can restore independently. The installer keeps no file copies and cannot check your backup. The first update attempt shows this recommendation and stops before it changes files, then you start the update again. Settings and the enabled state are kept."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI3="If the installer finds a modified or unknown file that the update would replace, it stops before copying anything and lists the path and the hashes. Check the file, resolve it by hand or postpone the update, then try again. There is no approval command and no bypass."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI4="After an update, check the contact route, the mail delivery and the active privacy plugins again on a test installation."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_INSTALL_LI5="Uninstalling removes the plugin and its three helper tables. Joomla's own requests and action log stay. Complete open requests from this page first."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_TITLE="Setting ‘Operator contact route’"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_P1="Required field without a default value. The internal Joomla path of a public page through which the person reaches you if no code arrives."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI1="The path starts with <code>index.php</code>, e.g. <code>index.php?option=com_contact&view=contact&id=42</code> or <code>index.php?Itemid=42</code>. Use the actual ID of your website."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI2="External addresses, anchors with #, spaces and control characters are not allowed. The path has at most 2048 characters."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI3="The public page shows the link below the form. In the request it appears in the warning when sending the code failed. Without a valid path the page asks people to use the website's contact details."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI4="Contacting you neither confirms nor completes a request."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_TITLE="How a request is processed"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP1="The person enters their e-mail address and chooses ‘Request or renew code’."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP2="The plugin creates a pending removal request and sends the code with Joomla's mail template for removal requests to exactly this address. Super users who receive system e-mails get a private Joomla message. The page always gives the same answer, so nobody learns whether a request exists."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP3="The person enters the address and the code and chooses ‘Confirm request’. Joomla marks the request as confirmed. Nothing has been deleted yet."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP4="You open the request under ‘Users → Privacy → Requests’ and carry out the removal. Joomla calls the privacy plugins, e.g. ‘Privacy - J2Commerce’ for shop data."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP5="Then you tick ‘I reviewed the removal scope and the response to the requester’ and complete the request."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI1="The code is valid for 24 hours and can be used only once. If it has expired, the person requests a new one on the same page. The request remains with its original date of receipt."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI2="If an open removal request for the address already exists that did not come from this page, the plugin creates no new one and does not change the existing one. A request already confirmed also stays unchanged."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI3="The e-mail is written in the language of the user account with this address, otherwise in the website's default language."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_TITLE="Limits and locks"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI1="The page only accepts simple e-mail addresses of at most 100 characters, without umlauts and other special characters, without spaces, quotation marks and brackets."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI2="Per IP address, 20 attempts to request and 20 to confirm are possible within 15 minutes, per e-mail address 5 requests. Every attempt counts. The page answers further attempts the same way but does not carry them out."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI3="The counters store no addresses, only checksums (HMAC) formed with the website's secret key."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI4="You cannot set the status to confirmed by hand for requests from this page. Only the person confirms, with the code."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI5="Completing a removal request is locked until the removal ran successfully without warnings and the review checkbox is ticked."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI6="If an earlier removal was incomplete, a new run requires the checkbox ‘Before retrying Remove, I verified remediation of earlier partial cleanup’."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI7="Two removal or completion operations of the same request never run at the same time. The second one is refused with a message."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI8="If Joomla finds a user account whose address does not exactly match the request, e.g. muller@ for müller@, the plugin refuses the removal."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_NOTE1="While the plugin is disabled, these locks do not apply. Do not process or complete requests from this page in that case."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_TITLE="Permissions"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI1="The plugin has no permissions of its own. It uses the permissions of Joomla's Privacy component."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI2="The review checkboxes, the delivery warning and the locks apply to accounts that have the permission ‘Configure ACL & Options’ (core.admin) in the Privacy component. To let another account process requests, grant this permission to its group in the options of the Privacy component, tab ‘Permissions’."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PERMS_LI3="The public page needs no login and no permission."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_TITLE="Data and retention"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI1="The request itself, with the e-mail address, is stored in Joomla's own privacy requests. The three helper tables hold only request numbers, delivery status, the review result and counters with checksums (HMAC), no addresses."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI2="The code is stored only as a hash and is valid for 24 hours. Counters of an expired 15-minute window are deleted at later requests."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI3="No scheduled retention task exists. The rows of the helper tables stay until the plugin is uninstalled. Include them and Joomla's request records in your retention policy."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_DATA_LI4="No data is sent to external services. Only Joomla's update check contacts GitHub, which learns the server's public IP address."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_TITLE="Working with J2Commerce and appointments"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI1="Both are optional. The plugin needs neither J2Commerce nor the appointment booking (com_appointments)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI2="With ‘Privacy - J2Commerce’, Joomla also processes the guest orders and guest addresses with the request address during the removal. The shop's retention periods apply there."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI3="The shop plugin's confirmation page for requests created by an administrator stays unchanged. This plugin uses a different mail template and its own page. It does not change links the shop has already sent."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI4="With the appointment booking, its privacy plugin processes the bookings of the address. A legal reason entered there can block the removal."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI5="If a plugin reports a warning during the removal, e.g. newsletter data not removed, completion stays locked until a new run passes without warnings."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI6="Joomla does not cover data in e-mails, calendars, backups or external systems. Check them separately."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_TITLE="Typical problems and solutions"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI1="<strong>The page says the service is not available:</strong> sending mail is switched off, the database reports an error or the website's secret key is missing. Details are in the log under the category <code>plg_system_privacyrequests</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI2="<strong>No code arrives:</strong> check the mail delivery. If sending fails, the request stays pending, it shows a warning with the contact link and the super users get a message. Once the problem is fixed, the person requests a new code on the page. Do not substitute another address and do not change the status by hand."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI3="<strong>The address is refused:</strong> it contains umlauts or other special characters. The person uses another address or the contact route."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI4="<strong>Completion is locked:</strong> first carry out the removal successfully without warnings, then tick the review checkbox."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI5="<strong>Message that another operation is still running:</strong> wait until the other operation has finished and try again."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI6="<strong>Removal refused because of the address:</strong> Joomla found an account with a different address. Clarify the address before you delete data."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI7="<strong>Uninstalling:</strong> it removes the three helper tables <code>#__privacy_guest_subjects</code>, <code>#__privacy_guest_attempts</code> and <code>#__privacy_guest_outcomes</code>. Joomla's requests and action log stay. Complete open requests from this page first."
