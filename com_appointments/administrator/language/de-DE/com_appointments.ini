COM_APPOINTMENTS_TEMPLATE_SUBJECT="E-Mail-Betreff"
COM_APPOINTMENTS_TEMPLATE_BODY="E-Mail-Text ohne Formatierung"
COM_APPOINTMENTS_TEMPLATE_BODY_DESC="Nur Klartext. HTML wird nicht dargestellt und Leerzeichen bleiben erhalten. Verwenden Sie {event_title}, {invitee_name} (vollständiger Name), {invitee_first_name}, {invitee_last_name}, {invitee_email}, {invitee_phone}, {host_name}, {host_email}, {location}, {conference_url} und {guest_emails}. Die schreibgeschützten Darstellungsplatzhalter {start}, {end}, {timezone} und {state_label} liefern formatierte Datumsangaben, die Zeitzone und den übersetzten Status. Buchungsfelder verwenden Platzhalter wie {start_utc}, {end_utc} und {state}. Verwenden Sie {custom_fields.ID} für eine Antwort und ersetzen Sie ID durch die ID des benutzerdefinierten Feldes. Die signierten Links {reschedule_url}, {cancel_url} und {erase_url} sind nur in E-Mails an eingeladene Personen verfügbar. Weitere Gäste erhalten stattdessen die Gast-Vorlagen mit einer neutralen Anrede. Darin ist {guest_email} die eigene Adresse des Gasts und {guest_remove_url} der signierte Link, der nur diese Adresse aus dem Termin entfernt. Kalenderanhänge und die obligatorische Fusszeile mit Aktionslinks werden automatisch ergänzt."
