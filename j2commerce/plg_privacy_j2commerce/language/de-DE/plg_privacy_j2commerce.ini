PLG_PRIVACY_J2COMMERCE_POSTINSTALL_TASK_DESC="Anonymisiert automatisch J2Commerce-Kundendaten, deren Aufbewahrungsfrist abgelaufen ist. Die in Joomla enthaltene Aufgabe vom Typ <strong>privacy.consent</strong> ist eine andere Aufgabe und ersetzt diese Bereinigung nicht."
