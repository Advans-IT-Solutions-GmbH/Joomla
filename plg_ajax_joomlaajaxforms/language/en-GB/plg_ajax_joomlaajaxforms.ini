PLG_AJAX_JOOMLAAJAXFORMS="Joomla! AJAX Forms"
PLG_AJAX_JOOMLAAJAXFORMS_DESC="Provides AJAX handling for login, logout, registration, password reset, username reminder and profile as well as the J2Commerce cart. Answers with JSON without reloading the page."

