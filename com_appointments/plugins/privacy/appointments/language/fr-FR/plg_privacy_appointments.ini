PLG_PRIVACY_APPOINTMENTS="Confidentialité - Rendez-vous"
PLG_PRIVACY_APPOINTMENTS_XML_DESCRIPTION="Exporte et efface les données des rendez-vous dans le flux de demandes de confidentialité de Joomla."
PLG_PRIVACY_APPOINTMENTS_DOMAIN="Réservations et réponses aux formulaires"
PLG_PRIVACY_APPOINTMENTS_ACCOUNT_MISMATCH="Le compte trouvé par Joomla ne correspond pas à l'adresse demandée. L'effacement est bloqué pour protéger l'autre compte."
PLG_PRIVACY_APPOINTMENTS_LEGAL_BLOCK="L'effacement des rendez-vous est bloqué pour le motif juridique configuré : %s"
PLG_PRIVACY_APPOINTMENTS_REMOVED="Réservations effacées : %d."
PLG_PRIVACY_APPOINTMENTS_CLEANUP_FAILED="Les réservations ont été traitées, mais le nettoyage des copies de calendrier ou des conférences a échoué. Corrigez le problème de stockage ou de fournisseur et relancez la suppression native : des références opérationnelles chiffrées conservent le nettoyage en attente même sans adresse de réservation. La clôture reste bloquée ; une nouvelle recherche vide ou une confirmation ne prouve pas l'effacement."
PLG_PRIVACY_APPOINTMENTS_DISABLED_REMAINDER="Les calendriers Internet sont désactivés, mais des données de calendrier ou de clés du personnel restent présentes. Elles n'ont été ni recherchées ni supprimées. Examinez-les avec un accès réellement autorisé avant de clore la demande."
PLG_PRIVACY_APPOINTMENTS_INCOMPLETE="La suppression des rendez-vous est incomplète. Résolvez les avertissements concernant les accès du personnel, copies, conférences, réservations illisibles ou calendriers non recherchés, puis réessayez avant la clôture Core. Les suppressions déjà effectuées ne sont pas annulées."
PLG_PRIVACY_APPOINTMENTS_STAFF_SCOPE_FAILED="Le périmètre initial du personnel ou son nettoyage complet n'a pas pu être vérifié. Gardez la demande ouverte et examinez les preuves de nettoyage conservées ; ne les remplacez pas par un succès pour un invité et ne réinitialisez pas un indicateur de résultat."
PLG_PRIVACY_APPOINTMENTS_MAIL_FAILED="Les données ont été effacées, mais une notification d'annulation à l'hôte n'a pas pu être envoyée."
PLG_PRIVACY_APPOINTMENTS_GUEST_DOMAIN="Rendez-vous auxquels l'adresse est invitée comme participant supplémentaire"
PLG_PRIVACY_APPOINTMENTS_GUEST_REMOVED="Adresses d'invités retirées des réservations : %d."
PLG_PRIVACY_APPOINTMENTS_STAFF_ABSENCES="Indisponibilités (absences) du compte collaborateur"
PLG_PRIVACY_APPOINTMENTS_STAFF_HOST="Enregistrement d’organisateur du compte collaborateur (sans la clé d’accès du flux)"
PLG_PRIVACY_APPOINTMENTS_STAFF_EVENT_TYPES="Types de rendez-vous dont le compte collaborateur est l’organisateur, avec les informations affichées sur la personne"
PLG_PRIVACY_APPOINTMENTS_STAFF_SCHEDULES="Horaires appartenant au compte collaborateur"
PLG_PRIVACY_APPOINTMENTS_STAFF_REMOVED="Données du collaborateur : indisponibilités passées supprimées : %1$d. Motifs retirés des indisponibilités en cours ou futures : %2$d. Enregistrements d’organisateur supprimés : %3$d."
PLG_PRIVACY_APPOINTMENTS_STAFF_EVENT_TYPES_REVIEW="Le compte est l’organisateur de ces types de rendez-vous : %s. Ils n’ont pas été modifiés. Attribuez un autre organisateur et vérifiez le nom, la photo et la fonction affichés sur la page de réservation."
PLG_PRIVACY_APPOINTMENTS_STAFF_SCHEDULES_REVIEW="Le compte possède ces horaires : %s. Ils n’ont pas été modifiés. Vérifiez leurs titres et leur propriétaire."
PLG_PRIVACY_APPOINTMENTS_STAFF_FAILED="Les données du collaborateur (indisponibilités, enregistrement d’organisateur) n’ont pas pu être supprimées. Rien n’a été modifié."
PLG_PRIVACY_APPOINTMENTS_BUSY="Une autre opération de confidentialité est encore en cours pour cette demande. Rechargez la demande et réessayez dans un instant."
