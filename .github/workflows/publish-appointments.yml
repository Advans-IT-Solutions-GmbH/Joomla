name: Publish - Appointments

on:
  push:
    branches:
      - main
    paths:
      - 'com_appointments/**'

concurrency:
  group: publish-appointments-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: appointments v')"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="com_appointments/com_appointments.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "appointments-v" --version "${{ steps.version.outputs.new }}"

      - name: Build extension
        run: |
          cd com_appointments
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd com_appointments
          PACKAGE=$(ls -1 com_appointments_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges -- com_appointments/ | grep -v '\[skip ci\]' | grep -v '^- release:' | head -20 || true)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: appointments-v${{ steps.version.outputs.new }}
          # Stage-neutral on purpose. The component is built in stages, so this
          # text must not promise a feature set: whatever is implemented at the
          # time of a release is listed in the component's own README, and the
          # changelog below says what this version changed.
          NOTES: |
            ## Appointments Component v${{ steps.version.outputs.new }}

            Self-hosted appointment scheduling for Joomla. Everything runs on
            your own server and no third-party scheduling service is contacted.

            The component is being built in stages. For the features this
            version actually ships, see the "What is implemented so far"
            section of its
            [README](https://github.com/Advans-IT-Solutions-GmbH/Joomla/tree/main/com_appointments#readme).

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Access via Components → Appointments

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - MySQL or MariaDB

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "appointments-v" --version "${{ steps.version.outputs.new }}" \
            --package "com_appointments/${{ steps.package.outputs.file }}" \
            --title "Appointments v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: com_appointments/${{ steps.package.outputs.file }}
