PLG_PRIVACY_J2COMMERCE_POSTINSTALL_TASK_TYPE="Task-Typ: <strong>J2Commerce - Automatische Datenlöschung</strong>. Falls er fehlt, prüfen Sie, ob <strong>Task - J2Commerce Datenschutz-Bereinigung</strong> aktiviert ist."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_TASK_PARAMS="Task-Parameter: dieselbe Aufbewahrungsfrist, Bestell-Anonymisierung und Adresslöschung verwenden, die im Privacy-Plugin konfiguriert wurden."
