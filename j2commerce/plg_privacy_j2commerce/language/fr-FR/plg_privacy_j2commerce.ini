PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_SKIPPED_NOTE="<strong>Action requise :</strong> Ces fichiers existaient déjà et n'ont pas été modifiés. Vous devez vérifier manuellement qu'ils contiennent la case de consentement et l'onglet Confidentialité — ou les remplacer par les versions fournies dans <code>plugins/privacy/j2commerce/overrides/com_j2store/</code> ou <code>plugins/privacy/j2commerce/overrides/com_j2commerce/</code>. Sans cela, la case de consentement au checkout et l'onglet Confidentialité MyProfile n'apparaîtront pas. Voir <strong>README.md → Template Integration</strong>."
