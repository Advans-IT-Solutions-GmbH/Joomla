COM_APPOINTMENTS_FEEDS_URL_HIDDEN="Nicht angezeigt: Die Website speichert nur einen Hashwert. Die aktuelle URL funktioniert weiter. Erneuern Sie den Zugangsschlüssel, um eine neue URL zu erhalten. Die aktuelle wird damit ungültig."
