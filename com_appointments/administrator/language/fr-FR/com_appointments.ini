COM_APPOINTMENTS_MAIL_HOST_NOTICE_BODY="Une nouvelle réservation a été reçue.\n{event_title}\nÉtat : {state_label}\nDe : {start}\nÀ : {end}\nFuseau horaire : {timezone}\nNom : {invitee_name}\nE-mail : {invitee_email}\nTéléphone : {invitee_phone}\nInvités : {guest_emails}\nLieu : {location}\n{conference_url}\n\nL'invitation au calendrier est jointe."
COM_APPOINTMENTS_MAIL_ERASURE_NOTICE_SUBJECT="Annulé : {event_title}"
