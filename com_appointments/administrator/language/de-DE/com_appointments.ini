COM_APPOINTMENTS_SYSTEM_SITE_URL_FIX="Tragen Sie die öffentliche Website-URL in den Optionen der Komponente ein, Register Allgemein, oder setzen Sie live_site in Joomla. Bis dahin versendet die Komponente keine E-Mails und nimmt keine Buchungen an: Buchungsseiten zeigen «Eine Buchung ist derzeit nicht möglich», und Verschiebungen und Absagen über die Links früherer E-Mails werden abgelehnt. Links werden nie aus dem Host-Header einer Anfrage gebildet."
