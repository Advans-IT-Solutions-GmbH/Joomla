COM_APPOINTMENTS_EVENTTYPE_RETENTION="Conservation (jours)"
COM_APPOINTMENTS_EVENTTYPE_RETENTION_DESC="Jours entiers, 0-65535. Vide est enregistré comme NULL et hérite du délai du composant (365 jours par défaut). 0 traite plutôt les réservations déjà terminées à la prochaine tâche 'Rendez-vous : conservation', sans signifier une conservation illimitée. La limite utilise la fin en UTC, pas l'annulation ou la modification. 'Lors de l'effacement' du composant choisit anonymisation ou suppression complète. Les réservations futures restent hors de la conservation par âge. Cette valeur ne change ni les délais des objets de calendrier ni ceux des traces ; Scheduler doit réellement fonctionner."
