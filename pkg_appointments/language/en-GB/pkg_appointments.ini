PKG_APPOINTMENTS="Appointments package"
PKG_APPOINTMENTS_XML_DESCRIPTION="Self-hosted appointment scheduling in one installation: the Appointments component, its administrator dashboard module and its six plugins (scheduled tasks, privacy requests, privacy consent, internet calendars, origin of bookings and key handling at sign-in). Installing, updating and removing the package manages all of them together. Installed over the standalone component of an earlier version, the package takes it over with all data, settings and enabled states."
PKG_APPOINTMENTS_POSTINSTALL_INTRO="The Appointments package is installed. Open <strong>Components → Appointments</strong> to set up schedules and event types. The dashboard module shows the next appointments on the administrator home page; the scheduled tasks the component needs are created by the installation, its messages say so."
PKG_APPOINTMENTS_POSTINSTALL_UPDATED="Appointments package updated to version %s."
PKG_APPOINTMENTS_POSTINSTALL_MIGRATED="Appointments now runs as a package (version %s). The component, its module and its plugins were taken over as they were: data, settings and enabled states are unchanged. Updates now come through the package."
PKG_APPOINTMENTS_INSTALL_CHILD_NEWER="%1$s is installed in version %2$s, which is newer than the version %3$s in this package. The installation was stopped and nothing has been changed. Install the current Appointments package."
PKG_APPOINTMENTS_UPDATE_CHANNEL_WARNING="The Appointments package was installed or updated, but Joomla could not complete the switch to the package update channel. One or more bundled extensions may still receive standalone updates. Update the package again to retry the switch."
PKG_APPOINTMENTS_INSTALL_CONFLICT_ERROR="Appointments could not safely inspect the existing files. The installation was stopped; check the installer log."
PKG_APPOINTMENTS_INSTALL_CONFLICT_TITLE="Appointments installation stopped before copying files."
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXPLANATION="The following existing files differ from the package and their contents are not known to be unchanged release files. This does not mean they were edited. No file contents were copied to server storage. Download each file to your computer in Appointments Recovery before approving replacement, then retry the same update."
PKG_APPOINTMENTS_INSTALL_CONFLICT_REVIEW="Open Appointments Recovery"
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXISTING="Existing SHA-256"
PKG_APPOINTMENTS_INSTALL_CONFLICT_INCOMING="Incoming SHA-256 (or removal operation)"
PKG_APPOINTMENTS_INSTALL_TASK_FAILED="The scheduled task “%s” could not be created. Create it yourself under System, Scheduled Tasks."
PKG_APPOINTMENTS_INSTALL_TASK_DISABLED="The optional scheduled task “%s” has been created switched off: it is needed only once the transfer of bookings to Close is set up. Switch it on then under System, Scheduled Tasks."
PKG_APPOINTMENTS_MODULE_DEFAULT_TITLE="Next appointments"
PKG_APPOINTMENTS_UNINSTALL_RETAINED_ACL_CONFLICT="The Appointments permission data could not be retained because another retained permission tree already exists. Resolve the duplicate asset before uninstalling again. Nothing has been removed."
