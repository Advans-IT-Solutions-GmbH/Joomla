PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Manage → Plugins</strong> → search for <strong>Privacy - J2Commerce</strong> → enable. The bundled <strong>Task - J2Commerce Privacy Cleanup</strong> plugin is installed and enabled automatically so Joomla can discover the scheduled task type."
