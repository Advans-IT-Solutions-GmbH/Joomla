; Traductions de secours des modèles Joomla natifs (uniquement si com_users n'a pas de traduction)
COM_USERS_EMAIL_PASSWORD_RESET_SUBJECT="Demande de réinitialisation du mot de passe pour {SITENAME}"
COM_USERS_EMAIL_PASSWORD_RESET_BODY="Bonjour,\n\nUne demande de réinitialisation du mot de passe de votre compte sur {SITENAME} a été effectuée. Pour vérifier que cette demande est légitime, saisissez ce code de vérification :\n\n{TOKEN}\n\nOuvrez ensuite le lien ci-dessous pour réinitialiser votre mot de passe :\n\n{LINK_TEXT}\n\nMerci."
COM_USERS_EMAIL_USERNAME_REMINDER_SUBJECT="Votre nom d'utilisateur sur {SITENAME}"
COM_USERS_EMAIL_USERNAME_REMINDER_BODY="Bonjour,\n\nUn rappel du nom d'utilisateur de votre compte sur {SITENAME} a été demandé.\n\nVotre nom d'utilisateur : {USERNAME}\n\nOuvrez le lien ci-dessous pour vous connecter :\n\n{LINK_TEXT}\n\nMerci."
COM_USERS_EMAIL_ACCOUNT_DETAILS="Informations du compte de {NAME} sur {SITENAME}"
COM_USERS_EMAIL_REGISTERED_WITH_ACTIVATION_BODY_NOPW="Bonjour {NAME},\n\nMerci de vous être inscrit sur {SITENAME}. Votre compte doit être activé avant de pouvoir être utilisé.\nActivez votre compte à l'aide du lien ci-dessous ou copiez-le dans votre navigateur :\n{ACTIVATE}\n\nAprès l'activation, vous pourrez vous connecter sur {SITEURL} avec votre nom d'utilisateur et le mot de passe choisi lors de l'inscription :\n\nNom d'utilisateur : {USERNAME}"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY_NOPW="Bonjour {NAME},\n\nMerci de vous être inscrit sur {SITENAME}. Votre compte doit être vérifié avant de pouvoir être utilisé.\n\nVérifiez votre adresse e-mail à l'aide du lien ci-dessous ou copiez-le dans votre navigateur :\n{ACTIVATE}\n\nAprès la vérification, l'administration sera informée et activera votre compte. Vous recevrez un autre e-mail lorsque ce sera fait.\n\nVous pourrez alors vous connecter sur {SITEURL} avec votre nom d'utilisateur et le mot de passe choisi lors de l'inscription :\n\nNom d'utilisateur : {USERNAME}"
COM_USERS_EMAIL_REGISTERED_NOTIFICATION_TO_ADMIN_SUBJECT="Nouvelle inscription sur {SITENAME}"
COM_USERS_EMAIL_REGISTERED_NOTIFICATION_TO_ADMIN_BODY="Un nouvel utilisateur « {NAME} », dont le nom d'utilisateur est « {USERNAME} », s'est inscrit sur {SITEURL}."

