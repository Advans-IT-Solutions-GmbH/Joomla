COM_J2STORE_CLEANUP_BACKUP_WARNING="<strong>Attention :</strong> créez toujours une sauvegarde complète (par exemple avec Akeeba Backup) avant de supprimer des extensions. La suppression utilise le désinstallateur de Joomla, qui supprime aussi les fichiers et exécute les scripts de désinstallation."
