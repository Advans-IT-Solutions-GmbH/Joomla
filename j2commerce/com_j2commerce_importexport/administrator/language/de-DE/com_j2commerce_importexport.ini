; Hilfeseite
COM_J2COMMERCE_IMPORTEXPORT_HELP_TITLE="J2Commerce Import/Export: Hilfe"
COM_J2COMMERCE_IMPORTEXPORT_HELP_INTRO="Diese Seite erklärt den Export und den Import von Produkten, die Importoptionen und die Optionen der Komponente, wie der Import bestehende Produkte findet und was er tut, wenn ein Datensatz fehlschlägt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CONTENTS="Inhalt der Hilfe"
COM_J2COMMERCE_IMPORTEXPORT_HELP_BACK="Zurück zu J2Commerce Import/Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_TITLE="Was die Komponente tut"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_DESC="J2Commerce Import/Export schreibt die Produktdaten Ihres Shops in eine Datei und importiert vollständige Produkte aus einer JSON- oder CSV-Datei. Damit übertragen Sie Produkte von einer Website auf eine andere, bewahren eine Kopie der Produkte als Datei auf oder legen viele Produkte auf einmal an und ändern sie."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_PRODUCT="Ein Produkt des Shops besteht aus einem Joomla-Beitrag (Titel, Texte, Kategorie, Bilder) und dem Produktdatensatz des Shops mit Varianten, Lagerbestand, Staffelpreisen, Produktbildern, Optionen, Filtern, Download-Dateien, Tags und benutzerdefinierten Feldern. Der Exporttyp «Produkte (Komplett)» und der Import behandeln alle diese Teile gemeinsam, auf Wunsch auch einen Menüeintrag für den Beitrag."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_SCOPE="Die Komponente hat keine eigenen Datenbanktabellen und keine geplante Aufgabe und sendet keine E-Mails. Eine Deinstallation macht Importe nicht rückgängig: Die importierten Beiträge, Kategorien und Produkte bleiben bestehen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TITLE="Voraussetzungen und Berechtigungen"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP="Die Komponente arbeitet mit J2Store 4 und mit J2Commerce 6. Sie erkennt den Shop selbst, es gibt nichts einzustellen:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_1="J2Commerce 6, wenn die Komponente J2Commerce (<code>com_j2commerce</code>) aktiviert ist und ihre Produkttabelle besteht."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_2="Sonst J2Store 4, wenn die Komponente J2Store (<code>com_j2store</code>) aktiviert ist und ihre Produkttabelle besteht."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_3="Trifft beides nicht zu, die Tabellen von J2Commerce 6, wenn es sie gibt, sonst die Tabellen von J2Store 4."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_BOTH="Sind beide Shop-Komponenten aktiviert, wie direkt nach einer Migration, arbeitet die Komponente mit J2Commerce 6."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACCESS="Um die Komponente und diese Hilfe zu öffnen, braucht ein Benutzer die Berechtigung «%1$s» für die Komponente. Die Schaltfläche «%2$s» in der Werkzeugleiste der Komponente öffnet diese Seite."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACTIONS="Der Bereich Export verlangt zusätzlich die Aktion «Export», der Bereich Import die Aktion «Import». Beide setzen Sie unter «%1$s», Register «%2$s». Die Seite zeigt nur die Bereiche, die der Benutzer nutzen darf. Installation und Update der Komponente geben beide Aktionen jeder Gruppe, die die Komponente in diesem Moment verwalten darf. Bestehende Regeln bleiben unverändert."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT="Ein Import prüft zusätzlich die Joomla-Berechtigungen des importierenden Benutzers, so wie das Backend beim Speichern derselben Änderungen von Hand. Ein Datensatz schlägt fehl, wenn eine dieser Berechtigungen fehlt:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_ARTICLE="Beiträge: «%1$s» in der Zielkategorie für einen neuen Beitrag und für das Verschieben eines Beitrags in eine andere Kategorie. «%2$s» für einen bestehenden Beitrag, oder «%3$s», wenn Sie ihn verfasst haben."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_STATE="Status, Zugriffsebene, Hauptbeitrag und Veröffentlichungsdaten eines Beitrags: Für eine Änderung braucht es «%1$s». Ohne diese Berechtigung wird ein neuer Beitrag unveröffentlicht mit der Zugriffsebene ID 1 gespeichert (in einer Standardinstallation «Öffentlich»), und ein bestehender Beitrag behält diese Werte. Ein Datensatz, der andere Werte setzt, schlägt fehl."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_CATEGORY="Neue Kategorien: «%1$s» für die Komponente Beiträge oder für mindestens eine Kategorie. Eine neue Kategorie wird nur mit «%2$s» für die Komponente Beiträge veröffentlicht."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_MENU="Menüeinträge: «%1$s» für das Zielmenü bei einem neuen Eintrag, «%2$s» bei einem bestehenden Eintrag und «%3$s», wenn sich der Veröffentlichungsstatus ändert. Das gilt auch für einen neuen Eintrag, der veröffentlicht wird."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_TAGS="Neue Tags: «%1$s» für die Komponente Tags. Benutzerdefinierte Felder: «%2$s» für das Feld."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TRUST="Geben Sie den Zugriff auf diese Komponente nur vertrauenswürdigen Administratoren. Ein Import ändert Beiträge, Kategorien, Menüs und Shopdaten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TITLE="Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_1="Wählen Sie im Bereich «Export» den «Typ»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_2="Wählen Sie das «Format»: JSON, CSV oder XML."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_3="Klicken Sie auf «Daten exportieren». Der Browser lädt eine Datei herunter, die nach Typ, Datum und Uhrzeit benannt ist, z.B. <code>products_full_2026-01-31_14-05-00.json</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPES_TITLE="Was jeder Typ enthält"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_FULL="«Produkte (Komplett)»: Jedes Produkt des Shops, dessen Quelle ein Joomla-Beitrag ist. Jeder Datensatz enthält den Beitrag (Titel, Alias, Texte, Status, Kategorie mit Titel, Alias und Pfad, Zugriffsebene, Sprache, Hauptbeitrag, Daten, Bilder, Links, Attribute und Metadaten), den Produktdatensatz, die Varianten mit Lagerbestand und Staffelpreisen, die Produktbilder, die Optionen mit ihren Werten, die Filter, die Download-Dateien, die Tags, die Werte der benutzerdefinierten Felder, die Metafelder und einen Menüeintrag der Website, der auf den Beitrag verweist."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRODUCTS="«Produkte (nur J2Store)»: Alle Datensätze der Produkttabelle des erkannten Shops, ohne Beitragsdaten. Trotz des Namens ist das die Tabelle von J2Commerce 6, wenn die Komponente mit J2Commerce 6 arbeitet."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_CATEGORIES="«Kategorien»: Alle Beitragskategorien mit allen Feldern, in der Reihenfolge des Kategoriebaums."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_VARIANTS="«Varianten»: Alle Variantendatensätze des Shops, ohne Lagerbestand und Staffelpreise."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRICES="«Preise»: Alle Staffelpreis-Datensätze des Shops."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_NO_FILTER="Der Export hat keine Filter und keine Auswahl. Er enthält immer alle Datensätze des gewählten Typs, auch unveröffentlichte, deaktivierte und gelöschte im Papierkorb."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMATS_TITLE="Formate"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_JSON="JSON: Ein Teil <code>_documentation</code> mit Hinweisen und einer Beschreibung der Felder, danach die Liste <code>products</code>. Die Liste heisst bei jedem Typ so, auch bei Kategorien, Varianten und Preisen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_CSV="CSV: UTF-8 mit Byte-Order-Mark. Die erste Zeile beschreibt jede Spalte und beginnt mit <code>#</code>, die zweite Zeile enthält die Spaltenüberschriften, danach folgt eine Zeile pro Datensatz. Trennzeichen und Textbegrenzer kommen aus den Optionen («CSV-Trennzeichen», «CSV-Textbegrenzer»)."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_FORMULA="In CSV erhält eine Textzelle, die eine Tabellenkalkulation als Formel ausführen würde (sie beginnt mit <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code>, einem Tabulator oder einem Zeilenumbruch), ein vorangestelltes Apostroph. Reine Zahlen, auch negative, bleiben unverändert. Der Import entfernt das Apostroph wieder."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_XML="XML: Ein Teil <code>field_documentation</code> und ein Teil <code>items</code>. XML-Dateien lassen sich nicht importieren."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FOR_IMPORT="Nur «Produkte (Komplett)» lässt sich wieder importieren. Verwenden Sie für diesen Export das Format JSON."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_TITLE="Import"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_1="Im Bereich «Import» ist der «Typ» immer «Produkte (Komplett)»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_2="Wählen Sie unter «Datei» die JSON- oder CSV-Datei."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_3="Öffnen Sie «%1$s» unter der Datei und prüfen Sie die Importoptionen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_4="Klicken Sie auf «Datei hochladen». Die Datei wird hochgeladen und vollständig gelesen. Die «Vorschau» zeigt die ersten fünf Datensätze und die «Anzahl Zeilen»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_5="Klicken Sie auf «Import starten» und bestätigen Sie die Rückfrage. Eine Meldung zeigt danach, wie viele Datensätze «Importiert» und wie viele «Fehlgeschlagen» sind, mit dem Grund für jeden fehlgeschlagenen Datensatz."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_SESSION="Vorschau und Import verwenden immer die zuletzt hochgeladene Datei. Wählen Sie eine andere Datei, verschwindet die Vorschau und Sie laden erneut hoch. Laden Sie in einer anderen Registerkarte des Browsers eine Datei hoch, kann die erste Registerkarte ihren Import nicht mehr starten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPTIONS_TITLE="Importoptionen"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_UPDATE="«Bestehende Produkte aktualisieren» (standardmässig aktiviert): Ein Datensatz, der zu einem bestehenden Produkt passt, aktualisiert dieses, siehe «Wie bestehende Produkte gefunden und aktualisiert werden». Ist das Kontrollfeld deaktiviert, legt jeder Datensatz einen neuen Beitrag und ein neues Produkt an. Ein Datensatz, dessen Alias in seiner Kategorie schon besteht, schlägt dann fehl."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU="«Menüeinträge erstellen» (standardmässig deaktiviert): Für jeden Datensatz mit einem Teil <code>menu_item</code> wird ein Menüeintrag der Website angelegt oder aktualisiert, der den Beitrag zeigt. Datensätze ohne diesen Teil erhalten keinen Menüeintrag. Der Teil braucht einen Titel. Ein Menüeintrag im selben Menü, mit demselben übergeordneten Eintrag und demselben Link auf den Beitrag wird aktualisiert statt neu angelegt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU_DEFAULTS="«Menü», «Menü-Zugriffsebene» und «Menüeinträge veröffentlicht» gelten nur, wo der Teil <code>menu_item</code> kein <code>menutype</code>, <code>access</code> oder <code>published</code> enthält. Ein exportiertes <code>menu_item</code> enthält diese Werte immer, es gelten also die Werte der Datei. Der übergeordnete Eintrag kommt aus <code>parent_id</code>. Fehlt dieser Wert, wird der Eintrag auf der obersten Ebene des Menüs angelegt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_CATEGORY="«Standard-Kategorie»: Die Beitragskategorie für Datensätze, die weder <code>catid</code> noch <code>category_path</code> haben. Die Auswahlliste zeigt die veröffentlichten Beitragskategorien."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_QUANTITY="«Mengen-Aktualisierungsmodus»: «Ersetzen (überschreiben)» speichert die Menge aus der Datei als neuen Lagerbestand. «Addieren (zum Bestand)» zählt die Menge aus der Datei zum Lagerbestand hinzu, den die Variante schon hat. Eine Variante ohne Lagerdatensatz erhält in beiden Modi die Menge aus der Datei. Eine Variante ohne <code>quantity</code> zählt als 0, im Modus «Ersetzen (überschreiben)» wird ihr Lagerbestand also 0."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_NOT_SAVED="Die Importoptionen werden nicht gespeichert. Prüfen Sie sie vor jedem Import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_TITLE="Importdatei"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_JSON="JSON: Eine Liste von Produktdatensätzen oder ein Objekt mit der Liste <code>products</code>, wie der Export «Produkte (Komplett)» sie schreibt. Andere Teile wie <code>_documentation</code> werden übergangen. Jeder Datensatz muss ein Objekt mit benannten Feldern sein."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV="CSV: UTF-8, mit oder ohne Byte-Order-Mark. Der Import erwartet immer ein Komma als Trennzeichen und doppelte Anführungszeichen als Textbegrenzer, unabhängig von den Optionen. Leere Zeilen und Zeilen, deren erste Zelle mit <code>#</code> beginnt, werden übersprungen. Die erste andere Zeile enthält die Spaltenüberschriften, keine davon darf leer sein oder doppelt vorkommen. Jede Zeile braucht so viele Zellen, wie es Überschriften gibt. Ein Anführungszeichen in einer Zelle wird verdoppelt. Dateien mit Backslash-Maskierung, wie ältere Exporte sie schrieben, werden ebenfalls gelesen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV_LISTS="In CSV enthalten die Spalten <code>variants</code>, <code>product_images</code>, <code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code>, <code>metafields</code> und <code>menu_item</code> JSON-Text, z.B. eine Liste in eckigen Klammern. Eine leere Zelle bedeutet keine Einträge."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_SIZE="Eine Datei darf höchstens 10 MB gross sein. Eine tiefere Upload-Grenze des Servers (PHP-Einstellungen <code>upload_max_filesize</code> und <code>post_max_size</code>) gilt zuerst."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_INVALID="Schon die Vorschau liest die ganze Datei. Fehler in der Datei als Ganzes stoppen sie, und nichts wird importiert: ungültiges JSON, ein JSON-Objekt ohne die Liste <code>products</code>, ein Datensatz, der kein Objekt ist, falsch gesetzte Anführungszeichen, eine falsche Anzahl Zellen oder eine Listenspalte ohne gültiges JSON."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELDS_TITLE="Felder eines Produktdatensatzes"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TITLE="<code>title</code>: Pflichtfeld. Ein Datensatz ohne Titel schlägt fehl."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ALIAS="<code>alias</code>: Freiwillig. Fehlt er oder ist er leer, wird der Alias aus dem Titel gebildet. Der Alias wird in der URL-tauglichen Form gespeichert, die Joomla verwendet."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TEXT="<code>introtext</code> und <code>fulltext</code>: HTML. Sie durchlaufen die Textfilter der Benutzergruppen des importierenden Benutzers (Globale Konfiguration, Register «Textfilter»), wie beim Speichern des Beitrags im Backend."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_STATE="<code>article_state</code> (1 veröffentlicht, 0 unveröffentlicht, 2 archiviert, -2 im Papierkorb), <code>access</code> (ID einer Zugriffsebene), <code>featured</code> (1 oder 0), <code>publish_up</code> und <code>publish_down</code> (Datum, leer bedeutet keines, ein leeres <code>publish_up</code> behält den bisherigen Beginn), <code>language</code> (Standard <code>*</code>), <code>metakey</code> und <code>metadesc</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_JSON="<code>article_images</code>, <code>urls</code>, <code>attribs</code> und <code>metadata</code>: JSON-Objekte. Aus ihren Texten wird Markup entfernt. Die Links <code>urla</code>, <code>urlb</code>, <code>urlc</code>, <code>image_intro</code> und <code>image_fulltext</code> dürfen nur http, https, mailto, tel, ftp, ftps oder sftp verwenden, andere Links werden geleert. Ein Wert, der kein JSON-Objekt ist, lässt den Datensatz fehlschlagen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_CATEGORY="<code>catid</code>, <code>category_path</code>, <code>category_title</code> und <code>category_alias</code>: Die Zielkategorie, siehe «Kategorien, Beiträge und Aliase»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ID="<code>article_id</code>: Die ID des Beitrags, der aktualisiert werden soll, siehe «Wie bestehende Produkte gefunden und aktualisiert werden»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_PRODUCT="Produktfelder: <code>product_type</code> (Standard <code>simple</code>), <code>visibility</code>, <code>enabled</code>, <code>taxprofile_id</code>, <code>manufacturer_id</code>, <code>vendor_id</code>, <code>has_options</code>, <code>addtocart_text</code>, <code>params</code>, <code>plugins</code>, <code>up_sells</code>, <code>cross_sells</code> und <code>main_tag</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_VARIANTS="<code>variants</code>: Liste der Varianten mit <code>sku</code>, <code>price</code>, <code>quantity</code>, <code>manage_stock</code>, <code>weight</code>, <code>length</code>, <code>width</code>, <code>height</code> und den weiteren Variantenfeldern des Exports. Jede Variante kann eine Liste <code>tier_prices</code> mit <code>quantity_from</code>, <code>quantity_to</code>, <code>date_from</code>, <code>date_to</code>, <code>customer_group_id</code> und <code>price</code> haben."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_IMAGES="<code>product_images</code>: <code>main_image</code>, <code>thumb_image</code> und <code>additional_images</code> mit ihren Alternativtexten. Pfade sind relativ zum Joomla-Stammverzeichnis, z.B. <code>images/products/photo.jpg</code>. Der Import speichert nur die Pfade: Laden Sie die Bilddateien vorher hoch, z.B. mit der Medienverwaltung."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_LISTS="<code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code> und <code>metafields</code>: Listen, wie der Export sie schreibt. Ein Eintrag in <code>custom_fields</code> braucht <code>name</code> und <code>value</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_MENU="<code>menu_item</code>: Freiwilliger Teil mit <code>title</code>, <code>alias</code>, <code>menutype</code>, <code>parent_id</code>, <code>access</code>, <code>published</code>, <code>language</code> und <code>params</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_DEFAULTS="Wird ein bestehendes Produkt aktualisiert, erhält jedes Produktfeld und jedes Variantenfeld, das im Datensatz fehlt, seinen Standardwert. Der bisherige Wert bleibt nicht erhalten. Importieren Sie vollständige Datensätze, am besten einen Export, den Sie bearbeitet haben."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_TITLE="Wie bestehende Produkte gefunden und aktualisiert werden"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_INTRO="Ist «Bestehende Produkte aktualisieren» aktiviert, sucht der Import den Beitrag jedes Datensatzes in dieser Reihenfolge und hört beim ersten Treffer auf:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_1="Den Beitrag mit der ID in <code>article_id</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_2="Einen Beitrag mit demselben Alias, in irgendeiner Kategorie: zuerst in der URL-tauglichen Form, dann so, wie er in der Datei steht."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_3="Den Beitrag des Produkts, das eine Variante mit der SKU der ersten Variante des Datensatzes hat."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_SHOP_ONLY="Der gefundene Beitrag muss zu einem Produkt des aktiven Shops gehören. Sonst schlägt der Datensatz mit der Berechtigungsmeldung von Joomla fehl. Ein gewöhnlicher Beitrag mit demselben Alias wird also nie überschrieben."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_VARIANTS="Der Produktdatensatz des Beitrags wird aktualisiert. Varianten werden innerhalb des Produkts über die SKU zugeordnet: Eine Variante mit bekannter SKU wird aktualisiert, jede andere Variante der Datei wird hinzugefügt. Varianten, die in der Datei fehlen, bleiben unverändert."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TITLE="Was ersetzt und was hinzugefügt wird"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_PRICES="Staffelpreise einer Variante: Ersetzt, wenn die Variante in der Datei Staffelpreise hat, sonst behalten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_IMAGES="Produktbilder: Ersetzt, wenn der Datensatz <code>product_images</code> hat, sonst behalten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_OPTIONS="Optionen: Alle Optionen des Produkts werden ersetzt, wenn der Datensatz <code>options</code> hat. Eine Option wird über <code>option_unique_name</code> gefunden, ein Optionswert über seinen Namen innerhalb der Option. Fehlende Optionen und Werte werden angelegt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILTERS="Filter: Ersetzt, wenn der Datensatz <code>filters</code> hat. Ein Filter wird über <code>filter_id</code> übernommen oder über seinen Namen innerhalb seiner Filtergruppe gefunden. Fehlende Filter und Filtergruppen werden angelegt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TAGS="Tags: Ersetzt, wenn der Datensatz <code>tags</code> hat. Ein Tag wird über <code>id</code> übernommen oder über seinen Titel gefunden. Ein fehlender Tag wird angelegt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FIELDS="Benutzerdefinierte Felder: Der Wert jedes genannten Felds wird ersetzt. Unbekannte Feldnamen werden ohne Meldung übersprungen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_META="Metafelder: Nur mit J2Commerce 6, ersetzt, wenn der Datensatz <code>metafields</code> hat."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILES="Download-Dateien: Immer hinzugefügt, nie ersetzt. Wird derselbe Datensatz erneut importiert, kommen seine Dateien ein weiteres Mal hinzu."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_STOCK="Lagerbestand: Neben der Menge schreibt der Import auch <code>on_hold</code> und <code>qty_sold</code> aus der Datei, 0, wenn sie fehlen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_TITLE="Kategorien, Beiträge und Aliase"
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_CATID="<code>catid</code> ist gesetzt: Diese Beitragskategorie wird verwendet. Besteht sie nicht, schlägt der Datensatz fehl. <code>catid</code> hat Vorrang vor <code>category_path</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_PATH="<code>category_path</code> ist gesetzt und <code>catid</code> nicht: Die Beitragskategorie mit genau diesem Pfad wird verwendet, z.B. <code>shop/electronics</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW="Hat keine Kategorie diesen Pfad, wird eine neue Kategorie auf der obersten Ebene angelegt, nicht unterhalb des Pfads. Ihr Titel ist <code>category_title</code> oder Imported, wenn dieser fehlt. Ihr Alias ist <code>category_alias</code> oder sonst der Titel, in URL-tauglicher Form. Besteht auf der obersten Ebene schon eine Beitragskategorie mit diesem Alias, die nicht im Papierkorb liegt, wird sie verwendet. So landen die späteren Datensätze derselben Datei in derselben Kategorie."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_DEFAULT="Weder <code>catid</code> noch <code>category_path</code>: Die «Standard-Kategorie» der Importoptionen wird verwendet."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW_STATE="Eine neue Kategorie wird nur veröffentlicht, wenn Sie «%1$s» für die Komponente Beiträge haben, sonst ist sie unveröffentlicht. Sie erhält die Standard-Zugriffsebene der Website und die Sprache Alle und erbt ihre Berechtigungen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_NEW="Neue Beiträge werden über die Beitragstabelle von Joomla angelegt. Sie durchlaufen die Prüfungen von Joomla und erhalten eigene Berechtigungen, die sie von ihrer Kategorie erben. Der importierende Benutzer wird als Autor eingetragen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_UPDATE="Bestehende Beiträge werden direkt aktualisiert. Ihr Alias muss in der Zielkategorie eindeutig sein, sonst schlägt der Datensatz mit der Meldung von Joomla zum Alias fehl."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_MOVE="Verschiebt ein Datensatz einen Beitrag in eine andere Kategorie, werden die Berechtigungen des Beitrags nach dem Speichern des Datensatzes unter die neue Kategorie gestellt. Schlägt das fehl, sagt die Fehlermeldung des Datensatzes, dass er importiert wurde. Der nächste Import dieses Beitrags stellt die Berechtigungen zuerst richtig."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_ALIAS="Ergeben weder Alias noch Titel einen URL-tauglichen Alias, z.B. bei einem Titel in nicht lateinischer Schrift, während Unicode-Aliase in der globalen Konfiguration ausgeschaltet sind, schlägt der Datensatz fehl. Geben Sie dem Datensatz einen Alias mit lateinischen Buchstaben oder Ziffern."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_TITLE="Fehler und Rückgängigmachen fehlgeschlagener Datensätze"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ROWS="Jeder Datensatz wird für sich importiert. Ein fehlschlagender Datensatz hält die anderen nicht auf. Das Ergebnis zeigt «Importiert» und «Fehlgeschlagen» und eine Zeile pro fehlgeschlagenem Datensatz, z.B. «Zeile 3: …». Die Nummer zählt die Produktdatensätze der Datei ab 1, nicht die Zeilen der Datei. Wird kein Datensatz importiert, erscheint die Meldung «Import fehlgeschlagen. Bitte prüfen Sie die Datei und versuchen Sie es erneut.» mit denselben Zeilen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ORDER="Joomla speichert Kategorien, Berechtigungen und Menüeinträge auf eine Weise, die eine offene Datenbanktransaktion beendet. Deshalb schreibt der Import zuerst die neue Kategorie, den neuen Beitrag und den Menüeintrag eines Datensatzes und danach alles andere in einer Transaktion: die Aktualisierung eines bestehenden Beitrags, das Produkt, die Varianten, den Lagerbestand, die Staffelpreise, die Bilder, die Optionen, die Filter, die Download-Dateien, die Tags, die benutzerdefinierten Felder und die Metafelder."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_UNDO="Schlägt ein späterer Schritt fehl, wird die Transaktion zurückgerollt. Die Kategorie, der Beitrag und der Menüeintrag, die der Datensatz angelegt hat, werden wieder gelöscht. Ein Menüeintrag, den der Datensatz geändert hat, erhält seine vorherigen Werte zurück, auch den Veröffentlichungsstatus seiner untergeordneten Einträge."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP="Dieses Rückgängigmachen lässt ein Element stehen, wenn es inzwischen jemand geändert hat:"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_CATEGORY="Eine neue Kategorie, die schon Beiträge oder Unterkategorien enthält oder bearbeitet wurde."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_ARTICLE="Ein neuer Beitrag, den jemand gespeichert oder zum Bearbeiten geöffnet hat."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU="Ein neuer Menüeintrag, der bearbeitet wurde oder untergeordnete Einträge erhalten hat."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU_CHANGED="Ein geänderter Menüeintrag, der erneut bearbeitet wurde oder dessen untergeordnete Einträge sich geändert haben."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_REPORT="Alles, was nicht rückgängig gemacht wurde, nennt die Fehlermeldung des Datensatzes: «Diese Änderungen der Zeile konnten nicht rückgängig gemacht werden: …». Prüfen Sie diese Elemente und entfernen oder korrigieren Sie sie von Hand."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_NO_UNDO="Ein erfolgreicher Import lässt sich nicht rückgängig machen. Exportieren Sie die Produkte oder sichern Sie die Datenbank vor einem grossen Import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_TITLE="Optionen"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_OPEN="Die Schaltfläche «%1$s» in der Werkzeugleiste öffnet die Optionen der Komponente. Sie erscheint nur für Benutzer mit «%2$s» oder «%3$s»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_DELIMITER="«CSV-Trennzeichen»: Komma (Standard), Semikolon oder Tabulator. Gilt nur für den CSV-Export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_ENCLOSURE="«CSV-Textbegrenzer»: Doppeltes Anführungszeichen (Standard) oder einfaches Anführungszeichen. Gilt nur für den CSV-Export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_PERMISSIONS="Register «%1$s»: Wer die Komponente öffnen («%2$s»), importieren («Import») und exportieren («Export») darf."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_CSV_IMPORT="Der Import erwartet immer Komma und doppeltes Anführungszeichen. Eine CSV-Datei, die mit anderen Einstellungen exportiert wurde, lässt sich nicht unverändert importieren."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TITLE="Typische Probleme und was zu tun ist"
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILE_TYPE="«Ungültiger Dateityp. Nur CSV- und JSON-Dateien sind erlaubt.»: Der Dateiname muss auf <code>.csv</code> oder <code>.json</code> enden, und der Inhalt muss Text sein. XML-Dateien und Tabellendateien wie <code>.xlsx</code> lassen sich nicht importieren. Speichern Sie eine Tabelle als CSV, kommagetrennt, UTF-8."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TOO_LARGE="«Datei zu gross. Maximale Dateigrösse: 10 MB.» oder «Das Hochladen der Datei ist fehlgeschlagen.»: Die Datei ist grösser als 10 MB oder als die Upload-Grenze des Servers. Teilen Sie sie in mehrere Dateien auf."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_INVALID="«Ungültige Importdaten. …»: Die Datei oder ein Datensatz hat nicht die erwartete Form, z.B. ungültiges JSON, eine falsche Anzahl Zellen, ein unbekannter Wert in <code>article_state</code>, eine <code>catid</code>, die keine Beitragskategorie ist, ein Menü, das nicht besteht, oder eine JSON-Spalte, die kein Objekt ist. Prüfen Sie bei CSV, ob alle Listenspalten gültiges JSON enthalten."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DENIED="«%1$s» bei einem Datensatz: Eine der Joomla-Berechtigungen unter «Voraussetzungen und Berechtigungen» fehlt, oder der gefundene Beitrag gehört zu keinem Produkt des aktiven Shops, z.B. ein gewöhnlicher Beitrag mit demselben Alias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DUPLICATES="Produkte werden doppelt angelegt: «Bestehende Produkte aktualisieren» war deaktiviert, oder der Datensatz hat keine <code>article_id</code>, keinen Alias und keine SKU, die zum bestehenden Produkt passen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_OTHER_SITE="Import eines Exports von einer anderen Website: Die IDs unterscheiden sich zwischen Websites. <code>article_id</code> kann das falsche Produkt aktualisieren oder abgelehnt werden, <code>catid</code> kann auf eine falsche oder fehlende Kategorie zeigen, und die IDs von Tags, Filtern, Steuerprofilen, Herstellern und übergeordneten Menüeinträgen werden unverändert übernommen. Entfernen Sie <code>article_id</code> und <code>catid</code> (die Kategorie kommt dann aus <code>category_path</code>) und prüfen Sie die übrigen IDs vor dem Import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_STOCK="Der Lagerbestand ist nach dem Import 0: Mit «Ersetzen (überschreiben)» erhält eine Variante ohne <code>quantity</code> den Wert 0. Geben Sie die Menge mit oder wählen Sie «Addieren (zum Bestand)»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_IMAGES="Bilder fehlen: Der Import speichert nur Pfade. Laden Sie die Bilder zuerst hoch und verwenden Sie Pfade relativ zum Joomla-Stammverzeichnis."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_EMPTY="Der Export ist leer: Es gibt keine Datensätze dieses Typs oder bei «Produkte (Komplett)» kein Produkt, dessen Quelle ein Joomla-Beitrag ist. Sind J2Store und J2Commerce beide installiert, prüfen Sie, welche Shop-Komponente aktiviert ist, siehe «Voraussetzungen und Berechtigungen»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_APOSTROPHE="Zellen des CSV-Exports beginnen mit einem Apostroph: Das schützt Werte, die eine Tabellenkalkulation als Formel ausführen würde. Lassen Sie das Apostroph stehen, der Import entfernt es."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILES="Download-Dateien erscheinen doppelt: Sie werden bei jedem Import hinzugefügt. Entfernen Sie die Liste <code>files</code> aus Datensätzen, die Sie erneut importieren."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_ALIAS="«Alias oder Titel lassen sich nicht in einen URL-tauglichen Alias umwandeln. …»: Siehe «Kategorien, Beiträge und Aliase»."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_CHANGED="«Die hochgeladene Datei stimmt nicht mehr mit dieser Vorschau überein. …» oder «Datei nicht gefunden. Bitte laden Sie die Datei erneut hoch.»: Eine andere Registerkarte hat den Upload ersetzt, die Datei wurde schon importiert oder die Sitzung ist abgelaufen. Laden Sie die Datei erneut hoch."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_TITLE="Datenschutz"
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_EXPORT="Exportdateien enthalten Produkt- und Beitragsdaten des Shops, auch die internen Benutzer-IDs von Autoren und Bearbeitern und die Einstellungen von Menüeinträgen. Sie enthalten keine Bestellungen und keine Kundendaten. Bewahren Sie sie geschützt auf und löschen Sie sie, wenn Sie sie nicht mehr brauchen."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_UPLOAD="Eine hochgeladene Importdatei liegt im Ordner <code>tmp</code> von Joomla unter einem zufälligen Namen (<code>j2commerce_import_…</code>). Der Import löscht die Datei, nachdem er gelaufen ist. Eine Datei, die Sie hochladen, aber nicht importieren, bleibt dort liegen: Löschen Sie solche Dateien regelmässig."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_LOCAL="Export und Import laufen auf Ihrem eigenen Server. Die Dateien gehen nur zwischen Ihrem Browser und Ihrer Website hin und her."
