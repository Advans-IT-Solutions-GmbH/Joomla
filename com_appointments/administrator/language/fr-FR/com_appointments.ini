COM_APPOINTMENTS_TEAM_D_MAIL_CALENDAR_DELETED_BODY="Bonjour {user_name},\n\nLe calendrier Internet « {calendar_title} » sur {site_name} a été supprimé avec toutes ses entrées.\n\nSupprimé par : {actor_name}\nDate : {deleted}\n\nVos appareils retirent le calendrier à leur prochaine synchronisation. Si cette suppression n'était pas prévue, informez immédiatement l'administration."
