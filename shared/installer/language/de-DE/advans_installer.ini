ADVANS_CHECK_ROUTING_PATH="System → Einrichtung → Konfiguration → Site → SEO: URL-Rewrite prüfen. Die Serveradministration muss .htaccess oder entsprechende Webserver-Regeln prüfen und die Erweiterungs-URLs testen; dieser Check sendet keine HTTP-Anfragen und verändert diese Dateien nie."
ADVANS_GUARD_BACKUP_FAILED="Die Installation wurde abgebrochen, bevor etwas verändert wurde: Die Sicherung von %1$s konnte nicht geschrieben oder geprüft werden. Bitten Sie die Serveradministration, %2$s beschreibbar zu machen, und wiederholen Sie dann die Installation."
ADVANS_GUARD_REPORT_REPLACED="Auf dieser Website geändert und durch das Update ersetzt: %1$s. Die geänderten Fassungen sind unter %2$s gesichert. Anpassungen gehören in Template-Overrides, damit ein Update sie nicht ersetzt."
ADVANS_GUARD_REPORT_REMOVED="Auf dieser Website geändert und vom Update entfernt, weil die neue Version sie nicht mehr verwendet: %1$s. Die geänderten Fassungen sind unter %2$s gesichert."
ADVANS_GUARD_REPORT_FOREIGN="Angepasste Dateien anderer Erweiterungen oder Templates: %1$s. Die vorherigen Fassungen sind unter %2$s gesichert."
