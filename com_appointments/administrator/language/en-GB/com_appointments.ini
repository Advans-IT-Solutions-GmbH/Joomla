COM_APPOINTMENTS_TEMPLATE_BODY_DESC="Plain text only; HTML is not rendered and whitespace is retained. Use {event_title}, {invitee_name}, {invitee_email}, {invitee_phone}, {host_name}, {host_email}, {location}, {conference_url} and {guest_emails}. Read-only presentation tokens {start}, {end}, {timezone} and {state_label} provide formatted dates, the time zone and translated status. Booking fields use tokens such as {start_utc}, {end_utc} and {state}. Use {custom_fields.ID} for an answer, replacing ID with the custom field ID. Signed {reschedule_url}, {cancel_url} and {erase_url} links are available only in invitee emails. Calendar attachments and the mandatory action footer are added automatically."
