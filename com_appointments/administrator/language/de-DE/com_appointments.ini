COM_APPOINTMENTS_SCHEDULE_FIELD_TITLE_DESC="Eine interne Bezeichnung. Sie wird einem Interessenten nie angezeigt."
COM_APPOINTMENTS_SCHEDULE_FIELD_TIMEZONE="Zeitzone"
COM_APPOINTMENTS_SCHEDULE_FIELD_TIMEZONE_DESC="Die Zone, in der die Zeiten unten gelten. Sie entscheidet, was eine Zeit wie 14:00 bedeutet, auch an den zwei Tagen im Jahr, an denen die Uhren umgestellt werden. Ein Interessent kann die Zeiten in seiner eigenen Zone anzeigen, am gespeicherten Wert ändert das nichts."
