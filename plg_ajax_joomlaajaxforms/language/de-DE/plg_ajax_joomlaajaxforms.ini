; Tab «Hilfe»
PLG_AJAX_JOOMLAAJAXFORMS_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe»."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_TAB="Hilfe"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_TITLE="Was das Plugin tut"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P1="Das Plugin sendet die Konto-Formulare von Joomla im Hintergrund (AJAX) und zeigt die Antwort direkt im Formular an. Die Seite wird dabei nicht neu geladen."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI1="<strong>Anmeldung und Abmeldung</strong>, mit Weiterleitung auf die Bestätigungsseite von Joomla, wenn für das Konto die Zwei-Faktor-Authentifizierung eingerichtet ist."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI2="<strong>Registrierung</strong> eines neuen Benutzerkontos."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI3="<strong>Passwort zurücksetzen</strong>: Anfrage der E-Mail zum Zurücksetzen des Passworts."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI4="<strong>Benutzername erinnern</strong>: Anfrage der E-Mail mit dem Benutzernamen."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI5="<strong>Profil</strong>: Speichern des Benutzerprofils mit allen Feldern des Profilformulars von Joomla, auch mit Feldern von Profil-Plugins."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI6="<strong>Warenkorb</strong> von J2Store 4 oder J2Commerce 6: eine Position entfernen (nur angemeldete Kunden) und die Anzahl der Artikel abfragen."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P2="Es gelten dieselben Regeln wie in den Formularen von Joomla: die Optionen der Benutzerverwaltung (Registrierung erlaubt oder nicht, Passwortregeln, Captcha, erlaubte E-Mail-Domains) und die Felder anderer Plugins, z.B. die Zustimmung zur Datenschutzerklärung. Die E-Mails verwenden die E-Mail-Vorlagen der Benutzerverwaltung von Joomla."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_NOTE="Das Plugin hat keine eigene Seite und legt keine Tabellen an. Es ändert nur, wie die vorhandenen Formulare gesendet werden."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_TITLE="Voraussetzungen und Einrichtung"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP1="Joomla 5.4 oder neuer und PHP 8.1 oder neuer. Für die Warenkorb-Funktionen muss J2Store 4 (Komponente <code>com_j2store</code>) oder J2Commerce 6 (Komponente <code>com_j2commerce</code>) installiert und aktiviert sein. Alle anderen Formulare funktionieren ohne Shop."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP2="Aktivieren Sie das Plugin unter <strong>System → Verwalten → Plugins</strong> (Suche nach <strong>Joomla! AJAX Forms</strong>)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP3="Binden Sie das Skript <code>plg_ajax_joomlaajaxforms/joomlaajaxforms.js</code> im Template der Website ein, z.B. in der Datei <code>index.php</code> des Templates oder in einer Template-Überschreibung. Das Plugin lädt das Skript nicht selbst. Ohne Skript werden die Formulare wie bisher gesendet. Den Code zeigt das README des Plugins (Abschnitt «Template Integration»)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP4="Das Skript findet die Formulare von Joomla selbst: Anmeldeformular (auch das Anmeldemodul), Registrierung, Passwort zurücksetzen, Benutzername erinnern und Profil bearbeiten. Ersetzt eine Template-Überschreibung das Formular zum Zurücksetzen oder Erinnern, ergänzen Sie am Element <code>form</code> das Attribut <code>data-joomlaajaxforms</code> mit dem Wert <code>reset</code> oder <code>remind</code>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP5="Bei jeder Installation und jedem Update prüft das Plugin die Datei <code>.htaccess</code> der Website. Sperrt sie Adressen mit <code>/component/</code> oder <code>index.php?option=com_</code> ohne Ausnahme für <code>com_ajax</code>, nennt eine Warnung die fehlende Ausnahme. Ergänzen Sie diese, sonst schlagen alle Anfragen des Plugins fehl."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_TITLE="Installation, Update und Deinstallation"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI1="Installieren Sie das ZIP mit dem Erweiterungs-Installer von Joomla. Joomla installiert das Plugin deaktiviert, aktivieren Sie es also (Schritt 2 oben). Das Plugin braucht keine geplante Aufgabe und legt keine an."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI2="Erstellen Sie vor einem Update eine aktuelle, vollständige Sicherung der ganzen Website, die Sie unabhängig davon wiederherstellen können. Der Installer behält keine Dateikopien und kann Ihre Sicherung nicht prüfen. Der erste Update-Versuch zeigt diese Empfehlung an und hält an, bevor er Dateien ändert. Danach starten Sie das Update erneut. Einstellungen und der aktivierte Zustand bleiben erhalten."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI3="Findet der Installer eine geänderte oder unbekannte Datei, die das Update ersetzen würde, hält er an, bevor er etwas kopiert, und listet Pfad und Hashes auf. Prüfen Sie die Datei, lösen Sie sie von Hand oder verschieben Sie das Update und versuchen Sie es dann erneut. Es gibt weder einen Freigabebefehl noch eine Umgehung."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI4="Bei jeder Installation und jedem Update entfernt das Plugin Update-Site-Einträge früherer Plugin-Versionen und prüft die <code>.htaccess</code> (Einrichtungsschritt 5). Neue Versionen erscheinen unter <strong>System → Update → Erweiterungen</strong>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_INSTALL_LI5="Die Deinstallation entfernt das Plugin. Es hat keine Tabellen, keine eigenen Daten und keine Deinstallationsroutine. Ausnahmen, die Sie in der <code>.htaccess</code> ergänzt haben, bleiben bestehen. Entfernen Sie auch das Script aus Ihrem Template."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_TITLE="Einstellungen"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_P1="Die Einstellungen stehen im Tab «Plugin». Für die fünf Formulare gilt: Steht eine Einstellung auf «Nein», sendet das Skript dieses Formular wie ohne Plugin an Joomla, mit neu geladener Seite. Schalten Sie ein Formular aus, wenn es ohne AJAX arbeiten soll."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI1="<strong>«Anmeldung aktivieren»</strong> (Standard «Ja»): Sendet das Anmeldeformular per AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI2="<strong>«Registrierung aktivieren»</strong> (Standard «Ja»): Sendet das Registrierungsformular per AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI3="<strong>«Passwort zurücksetzen aktivieren»</strong> (Standard «Ja»): Sendet das Formular zum Zurücksetzen des Passworts per AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI4="<strong>«Benutzername erinnern aktivieren»</strong> (Standard «Ja»): Sendet das Formular zum Erinnern an den Benutzernamen per AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI5="<strong>«Profil aktivieren»</strong> (Standard «Ja»): Speichert das Profilformular per AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI6="<strong>«Warenkorb aktivieren»</strong> (Standard «Ja»): Position aus dem Warenkorb entfernen und Anzahl der Artikel abfragen. Steht die Einstellung auf «Nein», antworten diese Anfragen mit «Diese Funktion ist derzeit deaktiviert.». Stellen Sie «Nein» ein, wenn Ihre Website diese Funktionen nicht nutzt."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI7="<strong>«Debug-Ausgabe»</strong> (Standard «Nein»): Schreibt Entwicklermeldungen des Plugins in die Konsole des Browsers. Fehlgeschlagene Anfragen erscheinen dort auch ohne diese Einstellung. Schalten Sie sie nur zur Fehlersuche ein und danach wieder aus."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_NOTE="Die Abmeldung ist immer aktiv und hat keine eigene Einstellung."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_TITLE="Sicherheit und Datenschutz"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI1="Jede Anfrage ausser dem Laden der Texte des Skripts braucht das Formular-Token von Joomla. Anfragen ohne gültiges Token lehnt das Plugin ab."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI2="Eine fehlgeschlagene Anmeldung erhält immer dieselbe Meldung, die nicht verrät, ob ein Konto existiert. Nur bei richtigem Passwort meldet das Plugin, dass das Konto noch nicht bestätigt ist oder auf die Freigabe wartet, und nennt die E-Mail-Adresse der Website."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI3="Passwort zurücksetzen und Benutzername erinnern antworten immer gleich, ob die Adresse bekannt ist oder nicht. Das Zurücksetzen hält die Begrenzung aus den Optionen der Benutzerverwaltung ein (Anzahl Anfragen in einem Zeitraum) und setzt das Passwort eines Super Users nie von der Website aus zurück."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI4="Ist die Zwei-Faktor-Authentifizierung eingerichtet oder muss ein Benutzer zuerst sein Passwort ändern, übernehmen die Seiten von Joomla. Profil und Warenkorb sind über das Plugin erst danach erreichbar."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI5="Ein Kunde kann nur Positionen aus seinem eigenen Warenkorb entfernen. Gäste erhalten als Anzahl der Artikel immer 0."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI6="Das Plugin speichert keine eigenen Daten. Personendaten wie Name und E-Mail-Adresse werden nur dort gespeichert, wo Joomla und der Shop sie ohnehin speichern."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI7="Das Plugin hat keine <code>access.xml</code> und keine eigenen Berechtigungen. Besucher können es ohne Konto aufrufen. Es gelten die Regeln von Joomla: Formular-Token, Optionen der Benutzerverwaltung und die Sitzung. Nur Konten, die Plugins bearbeiten dürfen, können die Einstellungen ändern (<strong>System → Verwalten → Plugins</strong>). Geben Sie einem weiteren Konto dort Zugriff. Die Aufbewahrung von Konten, Sitzungen, Mails und Shopdaten bleibt bei Joomla und beim Shop."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_TITLE="E-Mails"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI1="Passwort-Zurücksetzen, Benutzernamen-Erinnerung, die Aktivierungsmail und die Meldung über eine neue Registrierung werden mit den Mailvorlagen der Benutzerverwaltung von Joomla gesendet (<strong>System → Mailvorlagen</strong>): <code>com_users.password_reset</code>, <code>com_users.reminder</code>, <code>com_users.registration.user.self_activation</code>, <code>com_users.registration.user.admin_activation</code> und <code>com_users.registration.admin.new_notification</code>. Betreff, Text, HTML-Layout und Logo, die Sie dort einstellen, gelten. Das Plugin hat keine eigenen Mail-Einstellungen."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI2="Die Sprache ist die Kontosprache des Empfängers, wenn sie Deutsch, Englisch oder Französisch ist. Sonst gilt die Sprache der Website, wenn sie eine davon ist, andernfalls Englisch. Die Sprache der Anfrage des Besuchers spielt keine Rolle."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI3="Fehlt eine Mailvorlage oder scheitert das Senden damit, sendet das Plugin stattdessen seinen eigenen übersetzten Text. Er folgt dem Mailformat der Optionen der Mailvorlagen: Bei HTML oder beidem wird er im HTML-Layout der Website (auch mit Template-Override) mit dem Text als alternativem Teil und mit maskierten Eingaben gesendet, bei reinem Text bleibt es eine Textmail."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI4="Die Meldung über eine neue Registrierung geht an die Absenderadresse der Website (Globale Konfiguration). Ohne gültige Absenderadresse entfällt sie und eine Warnung wird ins Protokoll geschrieben."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_MAIL_LI5="Bestätigt Joomla das Senden einer Mail nicht, schreibt das Plugin einen Fehler ins Protokoll (Kategorie <code>plg_ajax_joomlaajaxforms</code>). Das Formular meldet trotzdem Erfolg, weil das Konto angelegt oder die Anfrage gespeichert wurde."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI1="<strong>Die Seite lädt beim Absenden neu wie ohne Plugin.</strong> Prüfen Sie, ob das Plugin aktiviert ist, ob das Template das Skript lädt und ob die Einstellung des Formulars auf «Ja» steht. Einer Template-Überschreibung des Formulars zum Zurücksetzen oder Erinnern fehlt oft das Attribut <code>data-joomlaajaxforms</code>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI2="<strong>Formulare melden «Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.» oder reagieren nicht.</strong> Meist sperrt die <code>.htaccess</code> Aufrufe von <code>com_ajax</code>. Ergänzen Sie die Ausnahme aus der Warnung bei der Installation. Schalten Sie danach kurz «Debug-Ausgabe» ein und prüfen Sie die Konsole des Browsers."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI3="<strong>«Die Benutzerregistrierung ist derzeit deaktiviert.»</strong> Die Registrierung ist in den Optionen der Benutzerverwaltung ausgeschaltet. Schalten Sie sie dort ein, wenn sich Besucher registrieren sollen."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI4="<strong>Ein neuer Benutzer kann sich nicht anmelden.</strong> Das Konto ist noch nicht bestätigt oder wartet auf die Freigabe durch einen Administrator. Die Meldung bei der Anmeldung sagt, welcher Fall vorliegt. Konten geben Sie unter <strong>Benutzer → Verwalten</strong> frei."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI5="<strong>Es kommen keine E-Mails an.</strong> Prüfen Sie die Mail-Einstellungen in der Globalen Konfiguration. Kann eine E-Mail nicht gesendet werden, schreibt das Plugin einen Eintrag in das Joomla-Protokoll (Kategorie <code>plg_ajax_joomlaajaxforms</code>). Ob Joomla diese Einträge speichert, hängt von den Protokoll-Einstellungen der Website ab."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI6="<strong>Warenkorb: «J2Commerce ist nicht installiert oder nicht aktiv.»</strong> Weder J2Commerce 6 noch J2Store 4 ist mit seinen Tabellen aktiviert. Aktivieren Sie die Shop-Komponente. Sind beide aktiviert, verwendet das Plugin J2Commerce 6."
