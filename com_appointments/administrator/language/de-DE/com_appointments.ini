COM_APPOINTMENTS_EVENTTYPE_RETENTION="Aufbewahrung (Tage)"
COM_APPOINTMENTS_EVENTTYPE_RETENTION_DESC="Ganze Tage, 0-65535. Leer wird als NULL gespeichert und erbt die Buchungsfrist der Komponente (Standard 365 Tage). 0 verarbeitet dagegen bereits beendete Buchungen beim nächsten Lauf von 'Termine: Aufbewahrung' und bedeutet nicht unbegrenzt. Massgeblich ist das Buchungsende in UTC, nicht der Absage- oder Änderungszeitpunkt. 'Bei Datenlöschung' in der Komponente bestimmt Anonymisierung oder vollständige Buchungslöschung. Zukünftige Buchungen bleiben ausserhalb der altersbasierten Aufbewahrung. Diese Vorgabe ändert weder Kalenderobjekt- noch Nachweisfristen; Scheduler muss tatsächlich laufen."
