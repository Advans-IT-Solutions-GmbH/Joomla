name: Publish - DMARC Reports Package

on:
  push:
    branches:
      - main
    paths:
      - 'pkg_dmarcreports/**'

concurrency:
  group: publish-pkgdmarcreports-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: pkgdmarcreports v')"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="pkg_dmarcreports/pkg_dmarcreports.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "pkgdmarcreports-v" --version "${{ steps.version.outputs.new }}"

      - name: Build package
        run: |
          cd pkg_dmarcreports
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd pkg_dmarcreports
          PACKAGE=$(ls -1 pkg_dmarcreports_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges -- pkg_dmarcreports/ | grep -v '\[skip ci\]' | grep -v '^- release:' | head -20 || true)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: pkgdmarcreports-v${{ steps.version.outputs.new }}
          NOTES: |
            ## DMARC Reports Package v${{ steps.version.outputs.new }}

            One-install bundle of the complete DMARC and TLS-RPT reporting
            solution: the DMARC Reports component, its administrator dashboard
            module, the scheduler task plugin for automatic mailbox ingestion
            and the MTA-STS policy system plugin. Installing, updating and
            removing the package manages all four extensions together.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Configure the DMARC Reports component, then add a
               "DMARC Reports: Ingest" task in the Scheduled Tasks component

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "pkgdmarcreports-v" --version "${{ steps.version.outputs.new }}" \
            --package "pkg_dmarcreports/${{ steps.package.outputs.file }}" \
            --title "DMARC Reports Package v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: pkg_dmarcreports/${{ steps.package.outputs.file }}
