PLG_SYSTEM_J2COMMERCEPRIVACY="System - J2Commerce Datenschutz-Einwilligung"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Prüft die Datenschutz-Einwilligung im J2Commerce-6-Checkout serverseitig und protokolliert sie pro Bestellung in den Joomla-Datenschutz-Einwilligungen."
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT="J2Commerce-Checkout: Datenschutzerklärung"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY="<p>Die Kundin oder der Kunde hat im J2Commerce-Checkout für die Bestellung <strong>%1$s</strong> der Datenschutzerklärung zugestimmt.</p><p>IP-Adresse: <strong>%2$s</strong></p><p>User-Agent:<br>%3$s</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_EVIDENCE_REMOVED="<p>Die Kundin oder der Kunde hat im J2Commerce-Checkout für die Bestellung <strong>%1$s</strong> der Datenschutzerklärung zugestimmt.</p><p>IP-Adresse und User-Agent wurden entfernt, als die Bestellung nach Ablauf ihrer Aufbewahrungsfrist anonymisiert wurde.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_LEGACY="<p>Die Kundin oder der Kunde hat im J2Commerce-Checkout der Datenschutzerklärung zugestimmt (erfasst von einem früheren Template-Override). Der Eintrag konnte keiner eindeutigen Bestellung zugeordnet werden; E-Mail-Adresse, IP-Adresse und User-Agent wurden entfernt.</p>"
