COM_APPOINTMENTS_TEAM_E_EVENTTYPE_BUSY_DESC="Belegte Zeiten dieser Kalender sperren ebenfalls Zeitfenster. Angeboten werden nur Kalender, auf die der Gastgeber Zugriff hat. Die Buchungsseite zeigt die freien Zeiten, die übrig bleiben."
