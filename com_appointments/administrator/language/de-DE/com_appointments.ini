COM_APPOINTMENTS_TEAM_C_KEYS_INVALID_DESC="Der gespeicherte Schlüssel dieser Konten besteht die Integritätsprüfung nicht und öffnet daher nichts. Verwerfen entfernt den Schlüssel und seinen Kalenderzugriff, setzt die Freigaben aus und sperrt die Geräte, je nach Geräteeinstellung mit Aufräumen. Die nächste Anmeldung mit Passwort erzeugt einen neuen Schlüssel, danach gibt ein Verwalter erneut frei oder der Wiederherstellungsschlüssel wird verwendet."
