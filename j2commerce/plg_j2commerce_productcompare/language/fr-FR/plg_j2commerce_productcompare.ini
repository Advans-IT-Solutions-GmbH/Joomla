PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_TITLE="Comparaison de produits : Installation terminée"
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_ENABLE="<strong>Système → Gérer → Plugins</strong> → rechercher <strong>J2Commerce - Comparaison de produits</strong> → activer."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_UPDATED="J2Commerce - Comparaison de produits a été mis à jour vers la version %s."
PLG_J2COMMERCE_PRODUCTCOMPARE_ENABLE_HINT="Le plugin est désactivé. Activez-le sous <strong>Système → Gérer → Plugins</strong> (rechercher <strong>J2Commerce - Comparaison de produits</strong>)."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_SEARCH="Ajuster les paramètres du plugin selon vos besoins : emplacement du bouton de comparaison (liste des produits, détails du produit), nombre maximum de produits à comparer, ainsi que texte et classe CSS du bouton."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_J2STORE_NOTE="J2Store 4 : le bouton de comparaison apparaît dans les listes de produits après le bouton d'ajout au panier et à la fin de la page produit. J2Store n'affiche le bloc d'ajout au panier que si le panier peut être affiché ; en mode catalogue, ou pour les invités lorsque le panier est réservé aux utilisateurs enregistrés, les listes de produits n'affichent donc pas de bouton de comparaison. Les mises en page de produits J2Store qui déclenchent ces événements sont nécessaires (app_bootstrap3/4/5) ; les substitutions de template sans ces appels d'événements n'affichent pas de bouton."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_DOCS="Documentation : <strong>README.md</strong> dans le dossier du plugin · Support : <a href='https://advans.ch' style='color:#2563eb'>advans.ch</a>"

; Onglet « Aide »
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_NOTE="Ce que fait ce plugin, comment le configurer et que faire en cas de problème : voir l'onglet « Aide »."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_TAB="Aide"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_TITLE="Ce que fait le plugin"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_P1="Le plugin ajoute un bouton « Comparer » aux produits de la boutique. Les visiteurs l'utilisent pour sélectionner plusieurs produits et les comparer côte à côte dans une fenêtre."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI1="Le bouton apparaît dans les listes de produits et sur la page produit. Un deuxième clic retire le produit de la comparaison."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI2="Une barre en bas de la page affiche les produits sélectionnés avec les boutons « Voir la comparaison » et « Tout supprimer »."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI3="La comparaison affiche pour chaque produit la référence, le prix, l'état du stock (en stock ou en rupture) et les 200 premiers caractères du texte d'introduction de l'article. Elle nécessite au moins deux produits."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI4="La comparaison n'affiche que les produits que le visiteur peut aussi voir dans la boutique."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_NOTE="Le navigateur du visiteur enregistre la sélection (<code>localStorage</code>), uniquement les numéros de produits. Le plugin ne crée aucune table et n'enregistre aucune donnée personnelle."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_TITLE="Prérequis et mise en place"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP1="Joomla 5.4 avec J2Store 4 (composant <code>com_j2store</code>) ou Joomla 6 avec J2Commerce 6 (composant <code>com_j2commerce</code>). Le composant de la boutique doit être activé."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP2="Activez le plugin sous <strong>Système → Gérer → Plugins</strong> (rechercher <strong>J2Commerce - Comparaison de produits</strong>). Sous Joomla 5, le gestionnaire de plugins le place dans le groupe <code>j2store</code>, car J2Store 4 ne charge que les plugins de ce groupe."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP3="Adaptez les paramètres dans l'onglet « Plugin »."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP4="Ouvrez sur le site une liste de produits et une page produit et vérifiez que le bouton apparaît. J2Commerce 6 l'affiche après chaque produit d'une liste et à la fin de la page produit. J2Store 4 l'affiche dans les listes après la zone d'ajout au panier et à la fin de la page produit."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP5="Facultatif : modifiez l'apparence avec des substitutions de template dans <code>templates/VOTRE-TEMPLATE/html/plg_j2commerce_productcompare/</code>. Copiez pour cela le fichier souhaité depuis le dossier <code>tmpl</code> du plugin : <code>button.php</code> (bouton), <code>bar.php</code> (barre), <code>modal.php</code> (fenêtre) ou <code>table.php</code> (tableau de comparaison)."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_NOTE="Le bouton n'apparaît que là où les mises en page de produits de la boutique appellent les événements d'affichage de la boutique. Les substitutions de template des mises en page de produits sans ces appels n'affichent aucun bouton."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_TITLE="Paramètres"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_P1="Les paramètres se trouvent dans l'onglet « Plugin »."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI1="<strong>« Afficher dans la liste des produits »</strong> (par défaut « Oui ») : affiche le bouton dans les listes de produits. Choisissez « Non » si le bouton ne doit apparaître que sur la page produit."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI2="<strong>« Afficher dans les détails du produit »</strong> (par défaut « Oui ») : affiche le bouton sur la page produit. Choisissez « Non » si le bouton ne doit apparaître que dans les listes."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI3="<strong>« Produits maximum »</strong> (par défaut 4, de 2 à 10) : nombre de produits qu'un visiteur peut comparer en même temps. Qui en sélectionne davantage reçoit un message, et le serveur n'en renvoie jamais plus. Choisissez un nombre plus petit si le tableau devient trop large pour votre mise en page."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI4="<strong>« Texte du bouton »</strong> (par défaut : le texte de langue propre au plugin, affiché comme « Comparer » dans la langue du visiteur) : libellé du bouton. Vous pouvez saisir une clé de langue, qui est traduite, ou un texte personnalisé, qui s'affiche de la même façon dans toutes les langues."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI5="<strong>« Classe CSS du bouton »</strong> (par défaut <code>btn btn-secondary</code>) : classes CSS du bouton, par exemple <code>btn btn-primary</code> pour un bouton plus visible. Le plugin ajoute toujours la classe <code>j2store-compare-btn</code>, nécessaire au fonctionnement."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI1="<strong>Aucun bouton n'est visible.</strong> Vérifiez que le plugin est activé, que « Afficher dans la liste des produits » ou « Afficher dans les détails du produit » est sur « Oui » et que le composant de la boutique est activé. Vérifiez les substitutions de template des mises en page de produits. Videz ensuite le cache de Joomla."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI2="<strong>J2Store 4 : le bouton manque dans les listes mais pas sur la page produit.</strong> J2Store n'affiche la zone d'ajout au panier dans les listes que lorsque le panier peut être affiché. En mode catalogue, ou lorsque seuls les clients enregistrés peuvent commander, les invités ne voient donc aucun bouton dans les listes."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI3="<strong>Le bouton ne réagit pas ou la barre n'apparaît pas.</strong> Si tous les boutons d'une page proviennent d'une sortie mise en cache, par exemple d'un module avec cache, la page ne charge pas le script du plugin. Désactivez le cache de ce module. Vérifiez aussi les erreurs dans la console du navigateur."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI4="<strong>La sélection est perdue.</strong> La sélection est conservée dans le navigateur, séparément pour chaque navigateur et chaque adresse de site. Les fenêtres privées et la suppression des données du site l'effacent."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI5="<strong>Un produit sélectionné manque dans la comparaison.</strong> La comparaison n'affiche que les produits activés et visibles, dont l'article est publié et dans sa période de publication et que le visiteur peut voir avec ses niveaux d'accès et sa langue. Il en va de même pour la catégorie et ses catégories parentes."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI6="<strong>« La comparaison n'a pas pu être générée. »</strong> La cause figure dans le journal Joomla (catégorie <code>plg_j2commerce_productcompare</code>), si les paramètres de journalisation du site conservent ces entrées."
