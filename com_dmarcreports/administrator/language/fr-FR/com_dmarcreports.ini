COM_DMARCREPORTS_DETAIL_MTASTS_MANUAL_STEP="Publiez les enregistrements ci-dessous et assurez-vous que l'hôte de politique (mta-sts.<domain>) est accessible via HTTPS avec un certificat valide et que le serveur web transmet /.well-known/mta-sts.txt à Joomla. Ce sont les étapes que le composant ne peut pas effectuer à votre place ; le Centre d'actions suit si elles sont en place."
