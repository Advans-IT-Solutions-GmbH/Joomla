COM_APPOINTMENTS_TEAM_C_RECOVERY_SECRET_NOTE="Wird nur jetzt angezeigt und nirgends gespeichert. Drucken Sie ihn zweimal aus, zusammen mit dem Site-Secret aus configuration.php, und bewahren Sie die beiden Ausdrucke offline an getrennten Orten auf. Ohne ihn lässt sich ein Kalender, dessen Schlüsselinhaber alle ihren Zugang verloren haben, nicht mehr öffnen."
