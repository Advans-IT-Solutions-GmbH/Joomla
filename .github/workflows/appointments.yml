name: Build & Test - Appointments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'com_appointments/**'
      - 'shared/build/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/appointments.yml'
  pull_request:
    branches: [main]
    paths:
      - 'com_appointments/**'
      - 'shared/build/**'
      - 'shared/tests/run-tests.sh'
      - 'shared/tests/lang-lint.php'
      - 'shared/tests/requirements-check.php'
      - 'shared/tests/deprecated-api-scan.php'
      - 'shared/tests/scripts/shared-test-helpers.php'
      - 'shared/tests/scripts/shared-install-messages.php'
      - 'shared/tests/scripts/shared-backend-views.php'
      - '.github/workflows/appointments.yml'

permissions: {}

# Supersede an outdated run of this workflow instead of letting it finish: a new
# push to a pull request or branch cancels the previous run of the same ref.
# `github.ref` is `refs/pull/<n>/merge` on a pull request, so runs of different
# pull requests never cancel each other. On `main` and for a manual run the group
# key is the unique run id, so no run on the default branch is ever cancelled and a
# manual run never cancels another one: a dispatch is started deliberately, nothing
# supersedes it, and it may carry its own inputs. The publish and release workflows
# deliberately have no concurrency group at all.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cd com_appointments
          chmod +x build.sh
          ./build.sh
          cp *.zip tests/extension.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-package
          path: com_appointments/tests/extension.zip
          retention-days: 1

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
      - name: Check PHP syntax
        run: |
          # The component declares PHP 8.1 as its minimum, so the syntax check
          # runs on 8.1: a newer language feature must fail here, not on a
          # customer's server.
          # xargs exits non-zero as soon as one file fails; `find -exec \;` would not.
          find com_appointments -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  language-lint:
    name: Language Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Lint language files
        run: php shared/tests/lang-lint.php com_appointments
      - name: Check compatibility requirements (Joomla 5.4+, PHP 8.1+)
        run: php shared/tests/requirements-check.php com_appointments
      - name: Scan for deprecated Joomla APIs
        run: php shared/tests/deprecated-api-scan.php com_appointments

  unit-tests:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, zip
          tools: composer
      - name: Install Composer dependencies
        run: |
          cd com_appointments
          composer install --no-interaction --no-progress
      - name: Run unit tests
        run: |
          cd com_appointments
          composer test:unit

  test-j5:
    name: ${{ matrix.name }} (J5)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Site Page'
            script: 'site-page'
          - name: '04 - Schedules'
            script: 'schedules'
          - name: '05 - Blocked periods'
            script: 'blocked'
          - name: '06 - Event types'
            script: 'eventtypes'
          - name: '08 - Booking integrity'
            script: 'booking'
          - name: '07 - Public slot parity'
            script: 'slots'
          - name: '09 - Mail and calendar attachments'
            script: 'mail'
          - name: '09 - Email template administration'
            script: 'templates'
          - name: '10 - Signed booking lifecycle'
            script: 'lifecycle'
          - name: '11 - Erasure and audit'
            script: 'erasure'
          - name: '12 - Scheduler and retention'
            script: 'scheduler'
          - name: '12 - Calendar feeds and export'
            script: 'feed'
          - name: '14 - Privacy request integration'
            script: 'privacy'
          - name: '13 - Conferencing providers'
            script: 'conference'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: '15 - Administration and scoped exports'
            script: 'administration'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '20 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: com_appointments/tests/
      - name: Start environment (J5)
        run: |
          cd com_appointments/tests
          for attempt in 1 2 3; do
            if docker compose up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_appointments_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd com_appointments/tests
          echo "=== Joomla Container Logs ==="
          docker compose logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_appointments/tests
          chmod +x run-tests.sh
          ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: j5-${{ matrix.script }}-logs
          path: com_appointments/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_appointments/tests
          docker compose down -v

  test-j6:
    name: ${{ matrix.name }} (J6)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '03 - Site Page'
            script: 'site-page'
          - name: '04 - Schedules'
            script: 'schedules'
          - name: '05 - Blocked periods'
            script: 'blocked'
          - name: '06 - Event types'
            script: 'eventtypes'
          - name: '08 - Booking integrity'
            script: 'booking'
          - name: '07 - Public slot parity'
            script: 'slots'
          - name: '09 - Mail and calendar attachments'
            script: 'mail'
          - name: '09 - Email template administration'
            script: 'templates'
          - name: '10 - Signed booking lifecycle'
            script: 'lifecycle'
          - name: '11 - Erasure and audit'
            script: 'erasure'
          - name: '12 - Scheduler and retention'
            script: 'scheduler'
          - name: '12 - Calendar feeds and export'
            script: 'feed'
          - name: '14 - Privacy request integration'
            script: 'privacy'
          - name: '13 - Conferencing providers'
            script: 'conference'
          - name: 'Backend Views'
            script: 'backend-views'
          - name: '15 - Administration and scoped exports'
            script: 'administration'
          - name: 'Installer Messages'
            script: 'install-messages'
          - name: '20 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: com_appointments/tests/
      - name: Start environment (J6)
        run: |
          cd com_appointments/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.joomla6.yml up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose -f docker-compose.joomla6.yml down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_appointments_j6_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show container logs
        if: always()
        run: |
          cd com_appointments/tests
          echo "=== Joomla Container Logs ==="
          docker compose -f docker-compose.joomla6.yml logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_appointments/tests
          chmod +x run-tests.sh
          CONTAINER_NAME=com_appointments_j6_test ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: j6-${{ matrix.script }}-logs
          path: com_appointments/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_appointments/tests
          docker compose -f docker-compose.joomla6.yml down -v

  # MariaDB lane. The component advertises MySQL or MariaDB, and its booking
  # table relies on an indexed STORED generated column that exists in that form
  # because the two engines disagree about indexing a VIRTUAL one. Only the
  # schema-sensitive suites run here; the rest is engine independent and already
  # covered by the two lanes above.
  test-mariadb:
    name: ${{ matrix.name }} (MariaDB)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: '01 - Installation'
            script: 'installation'
          - name: '02 - Structure'
            script: 'structure'
          - name: '20 - Uninstall'
            script: 'uninstall'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-package
          path: com_appointments/tests/
      - name: Start environment (MariaDB)
        run: |
          cd com_appointments/tests
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.mariadb.yml up -d; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            docker compose -f docker-compose.mariadb.yml down -v || true
            sleep 20
          done
          echo "Waiting for container to be ready..."
          timeout 300 bash -c 'until docker exec com_appointments_mariadb_test test -f /var/www/html/health.txt 2>/dev/null; do sleep 5; done'
          echo "Container ready"
      - name: Show database and container versions
        if: always()
        run: |
          cd com_appointments/tests
          docker exec com_appointments_mariadb_test_mysql mariadb --version || true
          echo "=== Joomla Container Logs ==="
          docker compose -f docker-compose.mariadb.yml logs joomla 2>&1 | tail -100 || true
      - name: Run tests
        env:
          TEST_STRICT_SKIP: '1'
          SUITE: ${{ matrix.script }}
        run: |
          cd com_appointments/tests
          chmod +x run-tests.sh
          CONTAINER_NAME=com_appointments_mariadb_test ./run-tests.sh "$SUITE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mariadb-${{ matrix.script }}-logs
          path: com_appointments/tests/test-results/*.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          cd com_appointments/tests
          docker compose -f docker-compose.mariadb.yml down -v

  # Result of this workflow. Deliberately not named "Collect Results": that
  # required check is produced only by collect-results.yml.
  all-jobs:
    name: Appointments / all jobs
    runs-on: ubuntu-latest
    needs:
      - build
      - syntax-check
      - language-lint
      - unit-tests
      - test-j5
      - test-j6
      - test-mariadb
    if: always()
    permissions:
      actions: read
    steps:
      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: test-artifacts/
      - name: Collect and display logs
        run: |
          echo "=== Test Results Summary ==="
          for dir in test-artifacts/*/; do
            if [ -d "$dir" ]; then
              echo ""
              echo "--- $(basename "$dir") ---"
              find "$dir" -name "*.txt" -exec cat {} \;
            fi
          done
      # Confirming the integration results should not require downloading an
      # artifact. Every suite's own pass/fail lines go into the run summary,
      # grouped by lane, so a reviewer sees on one page what each of the three
      # database and platform lanes actually asserted.
      - name: Write the integration results into the run summary
        if: always()
        run: |
          {
            echo "## Integration results"
            echo
            echo "Lanes: Joomla 5.4 with MySQL 8, Joomla 6 with MySQL 8, Joomla 6 with MariaDB 10.6."
            echo "The MariaDB lane runs the schema-sensitive suites only."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in test-artifacts/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            # The combined artifact of an earlier run of this job would nest.
            [ "$name" = "all-test-logs" ] && continue

            {
              echo "<details><summary>${name}</summary>"
              echo
              echo '```'
              find "$dir" -name '*.txt' -exec cat {} \;
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload combined logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: all-test-logs
          path: test-artifacts/
          retention-days: 3
      - name: Fail unless every job succeeded
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # failure, cancelled and skipped all count as not passed
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
