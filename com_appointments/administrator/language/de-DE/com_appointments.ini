COM_APPOINTMENTS_TEAM_C_FIELD_ALLOW_EXTERNAL_DESC="Nur dann können Benutzer mit dem Recht «Für Externe freigeben» diesen Kalender an externe Benutzer freigeben, höchstens mit der Rolle «Schreiben». Ausschalten entfernt sofort alle externen Freigaben."
COM_APPOINTMENTS_TEAM_C_FIELD_BLOCKS="Sperrt Buchungszeiten"
COM_APPOINTMENTS_TEAM_C_FIELD_BLOCKS_DESC="Belegte Zeiten in diesem Kalender sperren die Zeitfenster der Ereignistypen, die ihn verwenden."
COM_APPOINTMENTS_TEAM_C_FIELD_COLOUR="Farbe"
COM_APPOINTMENTS_TEAM_C_FIELD_DESCRIPTION_DESC="Erscheint unverschlüsselt in Kalenderlisten. Bitte keinen vertraulichen Text eingeben."
COM_APPOINTMENTS_TEAM_C_FIELD_OWNER="Eigentümer"
COM_APPOINTMENTS_TEAM_C_FIELD_OWNER_DESC="Wählen Sie ein berechtigtes internes Teamkonto. Der Eigentümer erhält 'Verwalten' mit einer echten Schlüsselhülle. Wählen Sie sich selbst und haben noch keinen Schlüssel, legt Speichern ihn erst nach einer Passwortanmeldung und einem zugelassenen zweiten Faktor in dieser Backend-Sitzung an. Das Öffnen dieses Formulars erstellt keinen Schlüssel. Die Wahl eines anderen Kontos initialisiert dessen Schlüssel nie; der Eigentümer muss zuerst selbst einen Schlüssel einrichten."
COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION="Buchungskopien löschen nach (Tagen)"
COM_APPOINTMENTS_TEAM_C_FIELD_RETENTION_DESC="Ganze Tage, 0 bis 65535. Der Standard 0 heisst nie. Bei aktiven Internetkalendern löscht die Aufgabe «Termine: Aufbewahrung der Internetkalender» die Buchungskopien in diesem Kalender, deren letztes sicher bestimmbares Ende länger als diese Frist zurückliegt. Eigene Einträge ohne Buchung löscht sie nie, auch nicht bei einem Wert über 0. Jede Löschung erreicht beim nächsten Abgleich alle Geräte, die diesen Kalender abgleichen, auch Outlook. Die Buchungsfrist löscht Buchungskopien ohnehin, darum bleibt der Wert in der Regel 0, bei Teamkalendern immer. Abgesagte, anonymisierte, gelöschte und verwaiste Buchungen verlieren ihre Kopien unabhängig von diesem Wert. Zeiten ohne Zeitzone gelten als UTC. Endliche Serien verfallen als Ganzes nach ihrer letzten Instanz. Endlose, unbestimmbare und THISANDFUTURE-Serien bleiben. Speichern löscht nichts, die Aufgabe muss regelmässig laufen."
COM_APPOINTMENTS_TEAM_C_RETENTION_ACTIVE="Dieser Kalender löscht Buchungskopien %d Tage nach ihrem Ende, auch auf allen Geräten, die ihn abgleichen. Eigene Einträge bleiben. Bei Teamkalendern lassen Sie den Wert auf 0."
COM_APPOINTMENTS_TEAM_C_RETENTION_SET_WARNING="Achtung: Ab dem nächsten Lauf der Aufgabe «Termine: Aufbewahrung der Internetkalender» löscht dieser Kalender Buchungskopien %1$d Tage nach ihrem Ende. Die Löschung erreicht %2$d Gerät(e), die ihn abgleichen, bei Outlook im zugeordneten Ordner. Eigene Einträge löscht die Frist nie. Bei Teamkalendern lassen Sie den Wert auf 0."
COM_APPOINTMENTS_TEAM_C_RETENTION_SET_WARNING_PLAIN="Achtung: Ab dem nächsten Lauf der Aufgabe «Termine: Aufbewahrung der Internetkalender» löscht dieser Kalender Buchungskopien nach der eingestellten Frist, auch auf allen Geräten, die ihn abgleichen. Eigene Einträge löscht die Frist nie. Bei Teamkalendern lassen Sie den Wert auf 0."
