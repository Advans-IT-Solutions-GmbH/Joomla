; Help tab
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_NOTE="What this plugin does, how to set it up and what to do when something goes wrong is explained on the «Help» tab."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_TAB="Help"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_TITLE="What the plugin does"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_P1="The plugin adds a «Compare» button to the products of the shop. Visitors use it to select several products and compare them side by side in a window."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI1="The button appears in product lists and on the product page. A second click removes the product from the comparison again."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI2="A bar at the bottom of the page shows the selected products with the buttons «View Comparison» and «Clear All»."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI3="The comparison shows SKU, price, stock status (in stock or out of stock) and the first 200 characters of the article's intro text for each product. It needs at least two products."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI4="The comparison shows only products the visitor may also see in the shop."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_NOTE="The visitor's browser stores the selection (<code>localStorage</code>), only the product numbers. The plugin creates no tables and stores no personal data."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_TITLE="Prerequisites and setup"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP1="Joomla 5.4 with J2Store 4 (component <code>com_j2store</code>) or Joomla 6 with J2Commerce 6 (component <code>com_j2commerce</code>). The shop component must be enabled."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP2="Enable the plugin under <strong>System → Manage → Plugins</strong> (search for <strong>J2Commerce - Product Compare</strong>). On Joomla 5 the plugin manager lists it in the group <code>j2store</code>, because J2Store 4 loads only plugins of that group."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP3="Adjust the settings on the «Plugin» tab."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP4="Open a product list and a product page on the site and check that the button appears. J2Commerce 6 shows it after each product of a list and at the end of the product page. J2Store 4 shows it in lists after the add-to-cart area and at the end of the product page."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP5="Optional: change the look with template overrides in <code>templates/YOUR-TEMPLATE/html/plg_j2commerce_productcompare/</code>. Copy the file you want to change from the plugin's <code>tmpl</code> folder: <code>button.php</code> (button), <code>bar.php</code> (bar), <code>modal.php</code> (window) or <code>table.php</code> (comparison table)."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_NOTE="The button appears only where the shop's product layouts call the shop's display events. Template overrides of the product layouts without these calls show no button."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_TITLE="Settings"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_P1="The settings are on the «Plugin» tab."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI1="<strong>«Show in Product List»</strong> (default «Yes»): shows the button in product lists. Set it to «No» if the button is to appear only on the product page."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI2="<strong>«Show in Product Detail»</strong> (default «Yes»): shows the button on the product page. Set it to «No» if the button is to appear only in lists."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI3="<strong>«Maximum Products»</strong> (default 4, from 2 to 10): how many products a visitor can compare at the same time. Anyone who selects more gets a message, and the server never returns more either. Choose a smaller number if the table becomes too wide for your layout."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI4="<strong>«Button Text»</strong> (default: the plugin's own language string, shown as «Compare» in the visitor's language): label of the button. You can enter a language key, which is translated, or a text of your own, which is shown the same in every language."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI5="<strong>«Button CSS Class»</strong> (default <code>btn btn-secondary</code>): CSS classes of the button, for example <code>btn btn-primary</code> for a more prominent button. The plugin always adds the class <code>j2store-compare-btn</code>, which the function needs."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_TITLE="Typical problems and what to do"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI1="<strong>No button is visible.</strong> Check that the plugin is enabled, that «Show in Product List» or «Show in Product Detail» is set to «Yes» and that the shop component is enabled. Check template overrides of the product layouts. Then clear Joomla's cache."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI2="<strong>J2Store 4: the button is missing in lists but not on the product page.</strong> J2Store shows the add-to-cart area in lists only when the cart may be shown. In catalogue mode, or when only registered customers may order, guests therefore see no button in lists."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI3="<strong>The button does nothing or the bar does not appear.</strong> If all buttons of a page come from cached output, for example a module with caching, the page does not load the plugin's script. Switch off caching for that module. Also check the browser console for errors."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI4="<strong>The selection is lost.</strong> The selection is kept in the browser, separately for each browser and each site address. Private windows and deleting the site data remove it."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI5="<strong>A selected product is missing from the comparison.</strong> The comparison shows only products that are enabled and visible, whose article is published and within its publishing period and which the visitor may see with their access levels and language. The same applies to the category and its parent categories."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI6="<strong>«The comparison could not be built.»</strong> The cause is in the Joomla log (category <code>plg_j2commerce_productcompare</code>), provided the logging settings of the site keep these entries."
PLG_J2COMMERCE_PRODUCTCOMPARE_MIRROR_OCCUPIED="Product Compare was not added to J2Store: the folder plugins/j2store/productcompare belongs to another extension (%s). Nothing of that extension was changed. Product Compare stays available for J2Commerce. To use it with J2Store, uninstall that extension first and then install Product Compare again."
