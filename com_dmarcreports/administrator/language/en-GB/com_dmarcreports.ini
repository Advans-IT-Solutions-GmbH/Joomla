; Help page
COM_DMARCREPORTS_HELP_TITLE="Help & tips"
COM_DMARCREPORTS_HELP_INTRO="DMARC Reports reads the reports that other mail servers send about your domains and shows you whether your e-mail is properly authenticated and what to do next. Everything runs on your own server."
COM_DMARCREPORTS_HELP_CONTENTS="Contents"
COM_DMARCREPORTS_HELP_OPEN_OPTIONS="Open the Options"
COM_DMARCREPORTS_HELP_BASICS_TITLE="The terms in two sentences"
COM_DMARCREPORTS_HELP_BASICS_DMARC="DMARC is a DNS record that tells receiving mail servers what to do with mail that claims to come from your domain but passes neither SPF nor DKIM for it: only watch (p=none), move it to spam (p=quarantine) or reject it (p=reject). It also asks receivers to send you a daily aggregate report (rua), and these reports are what this extension evaluates."
COM_DMARCREPORTS_HELP_BASICS_SPF="SPF is a DNS record that lists the servers allowed to send mail for your domain. For DMARC, SPF only counts when the checked envelope sender domain matches the visible From address, which is called alignment."
COM_DMARCREPORTS_HELP_BASICS_DKIM="DKIM adds a digital signature to every outgoing message, which receivers verify with a public key published in your DNS. Because the signature survives forwarding, an aligned DKIM signature is the most reliable way to pass DMARC."
COM_DMARCREPORTS_HELP_BASICS_MTASTS="MTA-STS tells other mail servers to deliver mail to your domain only over an encrypted connection (TLS) and only to your real mail servers with a valid certificate. It consists of a TXT record named _mta-sts and a small policy file at https://mta-sts.example.org/.well-known/mta-sts.txt (with your domain instead of example.org)."
COM_DMARCREPORTS_HELP_BASICS_TLSRPT="TLS-RPT is a TXT record named _smtp._tls that asks other mail servers to report to you every day whether encrypted delivery to your domain worked. It shows certificate or encryption problems before you tighten MTA-STS."
COM_DMARCREPORTS_HELP_HOW_TITLE="How the extension works"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TITLE="Domains and report sources"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TEXT="Under Domains you add every domain you monitor, with its target policy. Under Report sources you enter the IMAP mailbox that the rua address of your DMARC record points to. The password is stored encrypted. Assign the source to a published domain so that the scheduled task polls it."
COM_DMARCREPORTS_HELP_HOW_IMPORT_TITLE="Importing reports"
COM_DMARCREPORTS_HELP_HOW_IMPORT_TEXT="Reports come in three ways: with 'Run import' in the list of report sources, by uploading a report file at the bottom of the same page, or automatically through the scheduled task 'DMARC Reports - Automatic ingestion' (System, Scheduled Tasks). Joomla runs the task only when something triggers it: the Lazy Scheduler on normal page views or a cron job. Duplicate reports are recognised and stored once. DMARC reports (XML) and TLS-RPT reports (JSON) may arrive in the same mailbox."
COM_DMARCREPORTS_HELP_HOW_SCHEDULED_TITLE="Scheduled tasks"
COM_DMARCREPORTS_HELP_HOW_SCHEDULED_TEXT="The automatic import needs one scheduled task, 'DMARC Reports - Automatic ingestion' of the plugin 'Task - DMARC Reports Ingestion'. It is required for the automatic import. After every installation and update of the plugin or the package, the installation checks it: if it is missing, it creates it switched on, running every hour, and says so. Without a report source it does nothing. An existing task is never changed or duplicated; one that is switched off or in the trash stays so and is reported with the way to switch it on. Check it under System, Scheduled Tasks, or in the System check tab of the plugin, which also shows whether Joomla starts scheduled tasks on this site. The task has one parameter, 'Auto-create domains' (default: off), which only works together with the two component options of the same kind. Change the interval under Scheduled Tasks if every hour does not suit you. Joomla runs due tasks only when something triggers it: the Lazy Scheduler on normal page views, or a real cron job, which is recommended for unattended operation. The task is reported as failed when a mailbox connection fails. A successful result does not prove that every report was imported, so also check the run messages under Report sources. The component itself needs no scheduled task."
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TITLE="The dashboard figures"
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TEXT="'Messages reported' is the total of all messages with your domain as sender that receivers reported. The 'DMARC pass rate' is the share of them that passed DKIM or SPF with alignment. 'Would be rejected under p=reject' counts the messages that passed neither and would be rejected under p=reject. These figures cover every stored report. The Action Center instead assesses the seven days up to the newest report, so that an old, long-fixed failure does not block the next step. The domain view lists all flagged sources of this reporting window. The dashboard and the control panel module load, per domain, at most the 50 most urgent open sources and 200 sources that are already handled (done, ignored or snoozed). Handled sources therefore never take the place of open ones and stay reopenable, and further sources appear only in the domain view."
COM_DMARCREPORTS_HELP_HOW_DETAIL_TITLE="Domain detail"
COM_DMARCREPORTS_HELP_HOW_DETAIL_TEXT="Clicking a domain on the dashboard opens its detail view with the sending sources (IP address with server name, DKIM and SPF figures, failed messages, assessment and latest report), the timeline, the TLS-RPT results, the MTA-STS records and a CSV export. When DNS diagnostics are on, only this view and the system check look up DNS live: the published records and the server names of the sources."
COM_DMARCREPORTS_HELP_HOW_JUDGE_TITLE="How sending sources are judged"
COM_DMARCREPORTS_HELP_HOW_JUDGE_TEXT="The component judges every sending IP address itself from the DKIM and SPF results in the reports, so you do not have to check anything technical. A source whose mail carries an aligned DKIM signature is confirmed automatically and causes no entry: only the private key of your domain can create that signature. A source whose mail passed DMARC only through SPF gets an urgent entry. SPF only says that the server is listed in your SPF record. Many hosting providers have you include their shared mail servers (for example with include:), and those servers send for all customers of the provider, so another customer could pass SPF with your domain. Only DKIM tells your mail apart from theirs. A source whose mail failed DMARC and was rejected or quarantined by the receivers needs nothing from you, because your policy works. It only appears in the statistics. If failing mail was still delivered, for example under p=none, an informational entry explains what to do. With DNS diagnostics switched on, the domain view also shows the server name of each address (reverse DNS, confirmed forward), for information only. The names are cached and new lookups use a best-effort elapsed-time check, not a guaranteed resolver deadline. Without DNS the assessment works the same."
COM_DMARCREPORTS_HELP_HOW_MODULE_TITLE="Control panel module"
COM_DMARCREPORTS_HELP_HOW_MODULE_TEXT="The 'DMARC Reports Dashboard' module shows the summary and the most important Action Center entries on the administrator home page. It calculates nothing itself and shows the same data as the component dashboard. Publish it yourself at the position cpanel, it is not published by the installation. Its options are 'Show summary' (default: yes) and 'Action items' (default: 5, from 0 to 20, 0 hides the list). It shows a notice instead of figures when the component is missing or disabled, or when the account lacks the permission core.manage of the component. The module stores nothing, sends nothing and sends no e-mail."
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TITLE="MTA-STS system plugin"
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TEXT="The 'System - DMARC MTA-STS Policy' plugin serves the MTA-STS policy file at /.well-known/mta-sts.txt, built from the component options. It is enabled by the installation, has no options of its own and answers only for domains that are listed and published under Domains while MTA-STS is switched on. When you change the mode or the MX hosts in the options, the served file changes with them. You set up the mta-sts host with a valid certificate, the DNS records and the web-server rule yourself. The component never writes to DNS."
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TITLE="Privacy"
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TEXT="All reports stay in your Joomla database, there is no external analysis service. The extensions open outbound connections only to the mailbox servers you configure (IMAP) and, when you switch on DNS diagnostics, to DNS and to the MTA-STS policy host over HTTPS. Report contents never leave the server. Joomla's own update check contacts the update server on GitHub for version information only. The hosted MTA-STS policy answers inbound requests and holds no reports or credentials. The extensions send no e-mail."
COM_DMARCREPORTS_HELP_HOW_RETENTION_TITLE="Stored data and retention"
COM_DMARCREPORTS_HELP_HOW_RETENTION_TEXT="Reports contain the sending IP addresses, domains, counts, authentication results and the name and contact address of the reporting organisation as stated in the report. Report sources contain mailbox credentials, the password is stored encrypted. Nothing is deleted automatically, there is no age-based retention: decide how long you keep reports and delete them deliberately. Deleting a domain removes its DMARC and TLS-RPT reports, records and actions. Deleting a source removes its settings and clears the source link of its reports, the reports stay. With 'Delete after import' on a source, the mailbox copy of newly imported reports is deleted. The Joomla log file com_dmarcreports.php holds source numbers, message numbers, limits and counts only, never report contents, subjects or addresses. Restrict access with the permissions below and protect downloaded CSV exports."
COM_DMARCREPORTS_HELP_ACTIONS_TITLE="The Action Center"
COM_DMARCREPORTS_HELP_ACTIONS_INTRO="The Action Center works out on every page view, from the stored reports and the options, what you should do next, most important first. Only how you handled an entry is stored. When the data changes, an entry disappears by itself or a new one appears. The colour shows the urgency:"
COM_DMARCREPORTS_HELP_SEVERITY_3="Something leaves your domain unprotected, or a step is due now."
COM_DMARCREPORTS_HELP_SEVERITY_2="Plan the fix for the next few days."
COM_DMARCREPORTS_HELP_SEVERITY_1="Check the hint when convenient."
COM_DMARCREPORTS_HELP_SEVERITY_0="For information only, nothing to do."
COM_DMARCREPORTS_HELP_ACTIONS_STATUS="'Mark done' and 'Ignore' hide an entry until you reopen it. Use 'Mark done' when you have fixed the cause and 'Ignore' when the hint does not apply to you. 'Snooze' hides it for seven days. All hidden entries are listed under 'Handled actions', where 'Reopen' brings them back. An entry whose cause is gone disappears without any marking."
COM_DMARCREPORTS_HELP_ACTIONS_VIEWS="The dashboard and the control panel module never look anything up in DNS, so they stay fast. The check of the published DNS records (DMARC, SPF, MTA-STS, TLS-RPT, MX) appears only in the domain detail and the system check, and only when DNS diagnostics are on. With DNS diagnostics off, the dashboard shows the MTA-STS and TLS-RPT records to publish instead, because it cannot tell whether they already exist. The Action Center reads the policy (p=none, quarantine, reject) from the newest report, so after a DNS change it takes one or two days until the advice catches up."
COM_DMARCREPORTS_HELP_GROUP_POLICY="DMARC policy and rollout"
COM_DMARCREPORTS_HELP_GROUP_SOURCES="Sending sources"
COM_DMARCREPORTS_HELP_ACTION_SPF_ONLY_SOURCE="In the last seven days this IP address sent mail with your domain as sender that passed DMARC only through SPF, without the DKIM signature of your domain. SPF only shows that your SPF record allows the server, and the shared mail servers of a provider are allowed for all of its customers, so this may be another customer using your domain. If it is a service of yours (the server name in the domain view helps), switch on DKIM signing for your domain in that service, and the entry disappears by itself. If it is not, make sure your own mail is DKIM-signed, then remove the part of your SPF record that allows this server, or ask the provider to stop other customers from sending with your domain."
COM_DMARCREPORTS_HELP_GROUP_DNS="DNS records (only with DNS diagnostics)"
COM_DMARCREPORTS_HELP_GROUP_MTASTS="MTA-STS and TLS-RPT"
COM_DMARCREPORTS_HELP_ACTION_NO_DATA="No DMARC report is stored for this domain yet. Check that your DMARC record has a rua address, that this mailbox is set up as a report source and that the import runs. The first reports usually arrive one or two days after publishing the record."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_NONE="The domain is at p=none and too few messages pass DMARC to move safely to quarantine (threshold in the options, default 95). Fix the failing senders first, see 'Align a sending source'."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_QUARANTINE="The domain is at p=none and enough messages passed DMARC in the last seven days. In the DNS record _dmarc of your domain, change p=none to p=quarantine. Check first that no legitimate sender, such as a newsletter service, is still among the failing sources."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_QUARANTINE="The domain is at p=quarantine, but not yet enough messages pass DMARC for p=reject (threshold in the options, default 99). Fix the remaining failures before tightening."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_REJECT="The domain is at p=quarantine and enough messages passed DMARC in the last seven days. In the DNS record, change p=quarantine to p=reject, and sp too if your record has it. If you have already done so, the entry disappears as soon as the first report with the new policy is imported."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_QUARANTINE="The DMARC record has p=quarantine with pct below 100, so the policy applies to only part of the mail. Raise pct to 100 or remove it before moving to p=reject."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_ENFORCEMENT="The DMARC record has p=reject with pct below 100. Only that share is rejected, the rest is at most moved to spam. Raise pct to 100 or remove it."
COM_DMARCREPORTS_HELP_ACTION_AT_TARGET="The domain has reached the target policy set on the domain. Nothing to do. If you want to tighten further, raise the domain's target policy."
COM_DMARCREPORTS_HELP_ACTION_ENFORCED="The domain is at p=reject for all mail. Forged mail with your domain is rejected. Nothing to do, keep an eye on new sending sources."
COM_DMARCREPORTS_HELP_ACTION_WOULD_BE_REJECTED="This many messages of the last seven days passed neither DKIM nor SPF with alignment and would be rejected under p=reject. From a share of 2 percent the entry is red. Look up in the domain detail which IP addresses sent them. If they are your own senders, align them. If they are forgeries, that is exactly what DMARC is meant to stop."
COM_DMARCREPORTS_HELP_ACTION_ALIGN_SOURCE="In the last seven days this IP address sent mail with your domain as sender that failed DMARC (neither DKIM nor SPF aligned) and was still delivered, because the policy is p=none, applies to only part of the mail (pct below 100) or a receiver made an exception. If it is a service you use, such as a newsletter, shop or ticket system, switch on DKIM signing for your domain there. Prefer DKIM to adding the service to SPF, because SPF alone is not proof (see 'How sending sources are judged'). If it is not your service, the mail is forged or forwarded. A stricter policy stops forged mail, and the policy entry tells you when that step is safe. A mailing list or a recipient's forwarding that alters the message can make legitimate mail fail too, so check how much mail it concerns before you tighten. Failing mail that the receivers rejected or quarantined is not listed here, because the policy already works."
COM_DMARCREPORTS_HELP_ACTION_PASS_RATE_DROP="The pass rate of the last seven days is more than 5 points below the week before. Usually a service of yours lost its signature or a new service sends without authentication. Check in the domain detail which source newly fails before you tighten the policy."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_MISSING="No DMARC record was found under _dmarc of the domain. Publish a TXT record, to start with for example v=DMARC1; p=none; rua=mailto:dmarc@example.org (with your report address). Without it there is neither protection nor reports."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_SUBDOMAIN_CHECK="The monitored domain is a subdomain without a DMARC record of its own. That is normal: the policy of the parent domain applies to it (its sp value, otherwise p). Only check that the parent domain has a DMARC record."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_DUPLICATE="There is more than one DMARC record. Receivers then ignore all of them and your domain is unprotected. Delete the extra TXT records under _dmarc so that exactly one remains."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_INVALID="The DMARC record is malformed: p must be none, quarantine or reject and pct a whole number from 0 to 100. Correct the record, otherwise receivers do not apply it."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_POLICY_NONE="The published DMARC record is at p=none: it only collects reports and does not protect yet. Follow the rollout advice to move to quarantine and reject."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_NO_RUA="The DMARC record has no rua address, so nobody sends you reports. Add rua=mailto: with your report address and set up that mailbox as a report source."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_PCT="The DMARC record applies the policy to only part of the mail (pct below 100). Raise pct to 100 once the reports are clean."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_MISSING="There is no SPF record. That is not necessarily a problem as long as your mail is DKIM-signed. An SPF record listing your sending servers is still recommended, your mail provider tells you the right value."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_DUPLICATE="There is more than one SPF record. That is invalid and makes SPF fail at receivers. Merge them into a single v=spf1 record."
COM_DMARCREPORTS_HELP_ACTION_DNS_LOOKUP_ERROR="The DNS lookup failed, so nothing could be checked. This is usually temporary: reload the page later. If it persists, check the server's DNS resolver with your host."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_NO_MX="MTA-STS is on, but no MX host is entered in the options, so no policy can be built. Under Options, MTA-STS, enter your receiving mail servers, one per line, as they appear in your domain's MX record."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_PUBLISH="Shows the _mta-sts TXT record and the address of the policy file you need to publish. With DNS diagnostics off, the dashboard always shows it, even when everything is already published, because it cannot check. With DNS diagnostics on, the domain detail and the system check verify it live and report it only when the record is really missing, and the dashboard no longer shows it."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_LOOKUP_ERROR="The DNS lookup of the _mta-sts record failed. Usually temporary, try again later."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_RECORD_DRIFT="The id in the published _mta-sts record does not match the current policy. This happens after you change the mode, the MX hosts or the max age. Replace the TXT record with the value shown so that sending servers load the new policy."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_UNREACHABLE="The policy file at https://mta-sts.example.org/.well-known/mta-sts.txt (with your domain) cannot be reached. Check that the mta-sts host points to your web server in DNS and has a valid certificate, that the system plugin is enabled and that the web server passes the path to Joomla (instructions in the plugin README)."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_DRIFT="The served policy file differs from the options, for example because an old static file answers instead of the plugin. Remove the static file and enable the system plugin."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_LOOKUP_ERROR="The lookup of your domain's MX records failed, so it is not confirmed that the policy covers all mail servers. Repeat the check before switching to enforce."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_NO_ANSWER="The domain has no usable MX record. If it receives no mail, it needs no MTA-STS. Otherwise check the MX records with your DNS provider."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_UNCOVERED="At least one MX server of your domain is not in the MTA-STS policy. In enforce mode, sending servers would refuse to deliver to it. Add the hosts named under Options, MTA-STS and then publish the new id."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MODE_TESTING="Record, policy file and MX coverage are consistent, but the policy is still in testing mode. In this mode sending servers only report problems through TLS-RPT and deliver anyway. Collect one or two weeks of TLS-RPT reports. If they show no failures and your mail server certificate is valid and renewed in time, switch to enforce under Options, MTA-STS and publish the new id."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_PUBLISH="Shows the _smtp._tls TXT record you need to publish so that TLS reports arrive. As for MTA-STS, the dashboard shows it whenever DNS diagnostics are off. With DNS diagnostics on, the domain detail reports it only when the record is missing or points to another address."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_MISSING_RUA="TLS-RPT is on, but no valid report address is entered. Under Options, MTA-STS, enter an address such as mailto:dmarc@example.org. The simplest choice is the same mailbox as for DMARC."
COM_DMARCREPORTS_HELP_TASKS_TITLE="Typical tasks"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_TITLE="Set up a report mailbox"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_1="Create a mailbox only for reports, for example dmarc@example.org, and enter it in your DMARC record as rua=mailto:dmarc@example.org."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_2="Under Domains, add your domain and choose the target policy, usually Reject."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_3="Under Report sources, add a source with the IMAP server, port 993 with SSL/TLS, user name, password and folder INBOX, and assign it to the domain. 'Run import' tests the connection right away."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_4="Under System, Scheduled Tasks, check that the task 'DMARC Reports - Automatic ingestion' is switched on. The installation of the plugin creates it, running every hour, so that new reports come in by themselves."
COM_DMARCREPORTS_HELP_TASK_FAILING_TITLE="Read a failing source"
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_1="Follow 'Show this source' in the Action Center, or open the domain from the dashboard, to reach the address under 'Sending sources'."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_2="The server name under the address shows who operates it (with DNS diagnostics switched on), and the assessment says whether you need to act. You do not need any lookup tools."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_3="If it is a service you use, set up DKIM signing for your domain there. The service provides the instructions. Add a server to your SPF record only if it sends for you alone, never a provider's shared servers as the only proof."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_4="If it is a foreign server, the mail is either forged or forwarded. Forgery is exactly what a stricter DMARC policy stops. Forwarding by a mailing list or by a recipient can make legitimate mail fail: check how much mail it concerns and whether those recipients matter before you move to quarantine or reject."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_TITLE="Move from p=none to quarantine and reject"
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_1="Start with p=none and collect reports for at least two weeks so that every sender shows up, including rare ones such as invoicing or newsletters."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_2="Align every sender of yours until the Action Center recommends 'Move to p=quarantine'. Then change p=none to p=quarantine."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_3="Watch for another one or two weeks. When the Action Center recommends 'Move to p=reject', change p=quarantine to p=reject. Set sp to the same value if your record has sp."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_4="After each change it takes one or two days until the first reports with the new policy arrive. Until then the Action Center still shows the previous advice."
COM_DMARCREPORTS_HELP_TASK_MTASTS_TITLE="Move MTA-STS from testing to enforce"
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_1="Under Options, MTA-STS, turn on the policy and TLS-RPT, choose the testing mode and enter your MX hosts."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_2="Point the host mta-sts of your domain to this Joomla installation with a valid certificate and publish the _mta-sts and _smtp._tls TXT records shown in the domain detail."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_3="Turn on DNS diagnostics. The domain detail shows 'Switch MTA-STS to enforce' as soon as records, policy and MX coverage are consistent. Wait until you have one or two weeks of TLS-RPT reports without failures."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_4="Set the mode to enforce and replace the _mta-sts record with the new value and its new id. The plugin updates the policy file by itself."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_TITLE="When reports stop arriving"
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_1="Under Report sources, check the 'Last run' column and run the import by hand. An error message names the cause, for example a refused login after a password change."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_2="Under System, Scheduled Tasks, check that the import task is enabled and has run recently, and that the plugin 'Task - DMARC Reports Ingestion' is enabled. Without page views or a cron job the Lazy Scheduler does not run."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_3="Look into the mailbox itself. If new reports are there, the problem is the import. If nothing is there, check in DNS that the rua address of the DMARC record is still correct."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_4="A source stores reports only for its assigned domain and its subdomains. Reports for any other domain are skipped unless 'Create unknown domains automatically' is on in the options. For the scheduled task, 'Allow automatic domain creation from scheduler tasks' in the options and 'Auto-create domains' in the task must be on as well. Created domains are unpublished: publish them under Domains to monitor them. The scheduled task only polls sources assigned to a published domain."
COM_DMARCREPORTS_HELP_SETTINGS_TITLE="Where the settings are"
COM_DMARCREPORTS_HELP_SETTINGS_INTRO="Open the component options with the Options button at the top right of the dashboard. It needs the permission core.admin or core.options. The tabs are General, MTA-STS and Permissions; installed builds add a read-only System check tab with the platform check of the installation. The target policy is set per domain. Every option below shows its default."
COM_DMARCREPORTS_HELP_SETTINGS_BASIC="These options apply to all domains and report sources."
COM_DMARCREPORTS_HELP_SETTINGS_MTASTS="These options apply to all monitored domains and are read by the system plugin that serves the policy."
COM_DMARCREPORTS_HELP_OPT_POLICY_TARGET="Default: Reject. The target policy that is preselected when a domain is created, by hand or automatically. Each domain keeps its own target policy, which you change under Domains."
COM_DMARCREPORTS_HELP_OPT_QUARANTINE="Default: 95. The share of messages in percent that must pass DMARC with alignment before the Action Center recommends moving from p=none to p=quarantine. Allowed: 50 to 100."
COM_DMARCREPORTS_HELP_OPT_REJECT="Default: 99. The share of messages in percent that must pass DMARC with alignment before the Action Center recommends moving from p=quarantine to p=reject. Allowed: 50 to 100."
COM_DMARCREPORTS_HELP_OPT_IMAP_TIMEOUT="Default: 20 seconds. How long an import waits for the mailbox server. Allowed: 5 to 120."
COM_DMARCREPORTS_HELP_OPT_MAX_MESSAGES="Default: 200. The most messages fetched from one mailbox in one run. It applies to every source on its own, not to a whole scheduled task. Allowed: 10 to 2000."
COM_DMARCREPORTS_HELP_OPT_MAX_RUN_REPORTS="Default: 1000. The most reports stored from one mailbox in one run. Further messages stay untouched in the mailbox and are imported by the next run. Allowed: 50 to 20000, and at least twice the reports per message is used."
COM_DMARCREPORTS_HELP_OPT_MAX_RUN_UNPACKED="Default: 256 MiB. The most unpacked report data processed from one mailbox in one run. Further messages wait for the next run. Allowed: 16 to 2048, and at least four times the size per message is used."
COM_DMARCREPORTS_HELP_OPT_MAX_ATTACHMENTS="Default: 10. A message with more report attachments is held: nothing of it is stored, it stays unread, is flagged in the mailbox for manual review and is named in the run message and the log. Allowed: 1 to 100."
COM_DMARCREPORTS_HELP_OPT_MAX_MESSAGE_REPORTS="Default: 20. The most reports in one message, counting every report inside its archives. A message with more is held like above. Allowed: 1 to 256."
COM_DMARCREPORTS_HELP_OPT_MAX_MESSAGE_UNPACKED="Default: 32 MiB. The most unpacked report data in one message. A message over it, or with a single report over 8 MiB, is held like above. Allowed: 8 to 256."
COM_DMARCREPORTS_HELP_OPT_CSV="Default: Semicolon. The field separator of the CSV export of the record data: semicolon, comma or tab."
COM_DMARCREPORTS_HELP_OPT_DNS="Default: Off. Switches on live DNS checks in the domain detail and the System check: SPF and DMARC records, the server names of sending addresses and, when enabled separately, MTA-STS, TLS-RPT and MX coverage. MTA-STS validation also fetches the hosted policy over HTTPS. The queried names and addresses are disclosed to the DNS servers and the policy host sees the request. Report contents are never sent. The dashboard and the module never query DNS."
COM_DMARCREPORTS_HELP_OPT_AUTO_CREATE="Default: Off. Lets an import create a domain that a report names but that is not yet listed. Such a domain is always created unpublished, because anyone can send a report: it is neither monitored nor served a policy until you publish it. It applies to the manual upload and the mailbox import (both also need core.create) and to the scheduled task (which also needs the next option and its own parameter). While off, reports for unknown domains are skipped."
COM_DMARCREPORTS_HELP_OPT_TASK_AUTO_CREATE="Default: Off. Additional switch for the scheduled task. The task may create domains only when this option, the option above and its own 'Auto-create domains' parameter are all on. Changing it needs administrator rights on the component."
COM_DMARCREPORTS_HELP_OPT_MTASTS_ENABLE="Default: Off. Turns on the MTA-STS guidance and policy. The system plugin then serves the policy for published domains. You set up DNS, the mta-sts host with a valid certificate and the web-server rule yourself."
COM_DMARCREPORTS_HELP_OPT_MTASTS_MODE="Default: Testing. None, Testing or Enforce. Start with Testing to collect TLS-RPT reports without affecting delivery. Switch to Enforce only when records, policy and MX coverage are consistent. Shown only while MTA-STS is on."
COM_DMARCREPORTS_HELP_OPT_MTASTS_MX="Default: empty. One MX host pattern per line, for example mail.example.org or *.example.org (one wildcard label at the start). The list is shared by all monitored domains and must cover the actual MX hosts of every domain before Enforce. Without a valid list no policy is served."
COM_DMARCREPORTS_HELP_OPT_MTASTS_MAX_AGE="Default: 604800 (one week). How long senders may cache the policy, in seconds. Allowed: 86400 to 31557600. Raise it only when the policy is stable, and publish a new policy id in the _mta-sts record after every change."
COM_DMARCREPORTS_HELP_OPT_TLSRPT_ENABLE="Default: Off. Generates and monitors the _smtp._tls TXT record, independently of the MTA-STS policy. It does not switch off the import of TLS-RPT reports."
COM_DMARCREPORTS_HELP_OPT_TLSRPT_RUA="Default: empty. Where senders should send TLS-RPT reports, for example tlsrpt@example.org or mailto:tlsrpt@example.org. It is used to generate the record, which you publish yourself."
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS_TITLE="Permissions"
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS="Permissions are set in the component options on the Permissions tab, or inherited from Global Configuration. Without core.manage no view of the component opens. The other permissions add the following:"
COM_DMARCREPORTS_HELP_PERM_MANAGE="Opens the component: dashboard, domain detail, domains, report sources, System check, this page and the CSV export."
COM_DMARCREPORTS_HELP_PERM_INGEST="Shown as 'Import DMARC reports'. Allows 'Run import' for a source and the upload of a report file. Letting an import create an unknown domain also needs core.create."
COM_DMARCREPORTS_HELP_PERM_CREATE="Add domains and report sources. Also required for an import to create an unknown domain automatically."
COM_DMARCREPORTS_HELP_PERM_EDIT="Edit existing domains and report sources."
COM_DMARCREPORTS_HELP_PERM_EDIT_STATE="Publish and unpublish domains and report sources, and mark Action Center entries as done, ignored, snoozed or reopened."
COM_DMARCREPORTS_HELP_PERM_DELETE="Delete domains and report sources. Deleting a domain also deletes its reports."
COM_DMARCREPORTS_HELP_PERM_ADMIN="Open the component options. Changing the permissions themselves belongs to core.admin."
COM_DMARCREPORTS_HELP_PERM_HOWTO="To give another account access: put the account into a user group, open the component options, tab Permissions, choose that group, set core.manage to Allowed, add the permissions the account needs (for example Import DMARC reports for importing, Edit state for the Action Center) and save. The control panel module follows core.manage, too. The scheduled import does not use a person's permissions: it follows the options, so restrict who may change the options and the Scheduled Tasks."
COM_DMARCREPORTS_HELP_SETTINGS_DOMAIN="Domain (required, for example example.org, at most 190 characters, each domain only once), Title (optional label), Target policy (default: Reject, the Action Center never recommends a step beyond it), Notes (optional, internal) and Status. Only published domains are monitored, polled by the scheduled task and served an MTA-STS policy."
COM_DMARCREPORTS_HELP_SETTINGS_SOURCE="Name (required), Domain (the reports of the mailbox are assigned to it; 'Automatic' matches by the reported domain, but the scheduled task polls only sources bound to a published domain), Delete after import (default: no; deletes messages whose report was newly imported, duplicates and invalid messages are kept, without the IMAP extension UIDPLUS they are only flagged as deleted), Host (required), Port (default: 993), Connection security (default: SSL/TLS, or STARTTLS), User name (required), Password (stored encrypted; leave it blank to keep it as long as server, port, security and user name stay the same), Folder (default: INBOX) and Status. Only the IMAP protocol is supported."
COM_DMARCREPORTS_HELP_INSTALL_TITLE="Installation, update and removal"
COM_DMARCREPORTS_HELP_INSTALL_REQUIREMENTS_TITLE="Requirements"
COM_DMARCREPORTS_HELP_INSTALL_REQUIREMENTS_TEXT="Joomla 5.4 or later, PHP 8.1 or later and the PHP extensions simplexml, libxml, mbstring and openssl. The component needs a MySQL or MariaDB database and refuses to install on another one. Unpacking compressed reports needs zlib (gzip) or ZipArchive (ZIP): if one is missing, the System check shows it and the installation continues. The mailbox connection is made by the component itself and needs outbound access to the IMAP server, not the PHP imap extension."
COM_DMARCREPORTS_HELP_INSTALL_BEHAVIOUR_TITLE="How the installer behaves"
COM_DMARCREPORTS_HELP_INSTALL_BEHAVIOUR_TEXT="The installer decides by itself and asks no questions. Before Joomla copies anything, it compares every file it would replace, remove or adjust with the record of the installed files and the hashes of the released versions. A modified or unknown file stops the update before anything is copied. The notice names each path, its current and incoming SHA-256 hash and the reason. Review the file, resolve the conflict by hand or postpone the update, then retry. The installer keeps no copy of file contents and has no approval or bypass step. Before the first update attempt of each extension it stops once and recommends a current, complete backup of the whole site (files and database) that you can restore independently. It cannot check that a backup exists, and the retry only acknowledges the note. A package update can show the note once for the package and once more for each of its extensions."
COM_DMARCREPORTS_HELP_INSTALL_PACKAGE_TITLE="The package"
COM_DMARCREPORTS_HELP_INSTALL_PACKAGE_TEXT="The package installs the component, the dashboard module, the plugin 'Task - DMARC Reports Ingestion' and the plugin 'System - DMARC MTA-STS Policy' together, and the scheduled task described above is created if it is missing. Both plugins are enabled by a fresh installation. The module is not: publish it at the position cpanel. While the package is installed, the single extensions cannot be uninstalled separately. After an installation or update the installer shows a short report, and the System check tab can be reopened at any time."
COM_DMARCREPORTS_HELP_INSTALL_UPDATE_TITLE="Updating"
COM_DMARCREPORTS_HELP_INSTALL_UPDATE_TEXT="Update under System, Update, Extensions once releases are published, or install a newer ZIP over the existing installation. The package is the only update channel: the installer removes the old update links of single extensions, and if that fails it shows a warning and retries at the next package update. Collected reports, sources and the stored mailbox passwords are kept. Plugins keep their enabled or disabled state, and a disabled plugin is pointed out."
COM_DMARCREPORTS_HELP_INSTALL_UNINSTALL_TITLE="Removal"
COM_DMARCREPORTS_HELP_INSTALL_UNINSTALL_TEXT="Uninstall under System, Manage, Extensions. This drops all eight tables of the component: domains, sources, DMARC reports and records, actions, and TLS-RPT reports, policies and failures. All collected data and the stored mailbox credentials are deleted with them. Export what you need and take a backup of files and database first, a CSV export is not a complete recovery. Removing the task plugin deletes its scheduled tasks. DNS records, certificates and web-server rules are not changed."
COM_DMARCREPORTS_HELP_TROUBLE_TITLE="Troubleshooting"
COM_DMARCREPORTS_HELP_TROUBLE_IMAP_TITLE="The import cannot reach the mailbox"
COM_DMARCREPORTS_HELP_TROUBLE_IMAP_TEXT="Check host, port and connection security, whether the server may connect outwards, and user name and password. After a change of server, port, security or user name, enter the password again. The System check shows whether the connection type is available. Manual upload works without a mailbox."
COM_DMARCREPORTS_HELP_TROUBLE_UPLOAD_TITLE="A report file is rejected"
COM_DMARCREPORTS_HELP_TROUBLE_UPLOAD_TEXT="Accepted are DMARC aggregate XML and TLS-RPT JSON, raw or packed as gzip or ZIP, up to 16 MiB (and the PHP upload limit). Forensic failure reports are a different format and are not read. A damaged or oversized report is rejected as a whole. The upload summary names the reason."
COM_DMARCREPORTS_HELP_TROUBLE_HELD_TITLE="A message stays unread and is flagged in the mailbox"
COM_DMARCREPORTS_HELP_TROUBLE_HELD_TEXT="It exceeded a limit per message and was held for review. Nothing of it is stored. If it is a genuine report, raise the limit in the options, then move the message out of the folder and back, or upload its attachment by hand. The run message and the log file com_dmarcreports.php name the message."
COM_DMARCREPORTS_HELP_TROUBLE_ACCESS_TITLE="No access or a notice instead of figures"
COM_DMARCREPORTS_HELP_TROUBLE_ACCESS_TEXT="The account needs core.manage for the component, see Permissions above. The module shows a notice when the component is missing or disabled or the account lacks this permission."
COM_DMARCREPORTS_HELP_TROUBLE_MTASTS_TITLE="The policy address answers 404"
COM_DMARCREPORTS_HELP_TROUBLE_MTASTS_TEXT="The policy is served only when the plugin is enabled, MTA-STS is on with a valid MX list, the domain is listed and published, the host mta-sts.<domain> reaches this site with a valid certificate, and the web server hands exactly /.well-known/mta-sts.txt to Joomla's index.php. The README of the system plugin gives the rewrite rule."
COM_DMARCREPORTS_CONFIG_HELP_NOTE="What these settings do and what every Action Center entry means is explained on the <a href='index.php?option=com_dmarcreports&amp;view=help'>Help &amp; tips</a> page."
