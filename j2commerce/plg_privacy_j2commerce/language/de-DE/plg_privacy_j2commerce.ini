PLG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="Privacy - J2Commerce Datenschutz wurde auf Version %s aktualisiert."
PLG_PRIVACY_J2COMMERCE_ENABLE_HINT="Das Plugin ist deaktiviert. Unter <strong>System → Verwalten → Plugins</strong> nach <strong>Privacy - J2Commerce Datenschutz</strong> suchen und aktivieren."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC_TASK_FAILED="<strong>System → Verwalten → Plugins</strong> → nach <strong>Privacy - J2Commerce Datenschutz</strong> suchen → aktivieren. Das mitgelieferte Plugin <strong>Task - J2Commerce Datenschutz-Bereinigung</strong> konnte <strong>nicht</strong> automatisch installiert werden; siehe Warnung oben und das Paket erneut installieren."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_MISSING="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) wurde im Installationspaket nicht gefunden."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_INSTALL_FAILED="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) konnte nicht automatisch installiert werden. Die automatische Bereinigung steht erst nach dessen Installation zur Verfügung."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_MISSING="Weder J2Commerce 6 (com_j2commerce) noch J2Store/J2Commerce 4 (com_j2store) ist installiert. Das Plugin hat keine J2Commerce-Daten zu verarbeiten, bis eine der beiden Komponenten installiert ist."
PLG_PRIVACY_J2COMMERCE_WARN_OVERRIDES_FAILED="Folgende Template-Overrides konnten nicht kopiert werden: %s. Bitte manuell aus plugins/privacy/j2commerce/overrides/ kopieren."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASKS_REMOVED="%d geplante Aufgabe(n) vom Typ J2Commerce - Automatische Datenlöschung wurden gelöscht."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASK_PLUGIN_REMOVED="Das mitgelieferte Task-Plugin (Task - J2Commerce Datenschutz-Bereinigung) wurde zusammen mit diesem Plugin entfernt."
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE="Erteilt bei"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_CHECKOUT="Checkout, Bestellung %s"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_ACCOUNT="Benutzerkonto (Registrierung oder Profil)"
PLG_PRIVACY_J2COMMERCE_NO_CONSENT_RECORDED="Für Ihr Konto oder Ihre Bestellungen ist keine Einwilligung protokolliert."
PLG_PRIVACY_J2COMMERCE_MYPROFILE_GUEST_REQUEST_DESC="Das Online-Formular für Datenschutzanfragen setzt ein Benutzerkonto voraus. Als Gastkundin oder Gastkunde senden Sie Ihre Anfrage auf Auskunft oder Löschung Ihrer Daten per E-Mail."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_MISSING="Das mitgelieferte System-Plugin (System - J2Commerce Datenschutz-Einwilligung) wurde im Installationspaket nicht gefunden. Die Checkout-Einwilligung wird weder geprüft noch protokolliert."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_INSTALL_FAILED="Das mitgelieferte System-Plugin (System - J2Commerce Datenschutz-Einwilligung) konnte nicht automatisch installiert werden. Die Checkout-Einwilligung wird erst nach dessen Installation geprüft und protokolliert."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_OUTDATED="Diese J2Commerce-6-Checkout-Overrides lösen weder das J2Commerce-Ereignis AfterDisplayShippingPayment aus noch zeigen sie die Einwilligungs-Checkbox an: %s. Ist eine Einwilligung erforderlich, kann der Checkout damit nicht abgeschlossen werden. Bitte den Aufruf des Ereignisses AfterDisplayShippingPayment aus dem J2Commerce-Kerntemplate (components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php) vor der Weiter-Schaltfläche ergänzen."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_BUNDLED="Diese J2Commerce-6-Checkout-Overrides stammen von einer früheren Version dieses Plugins und wurden bei diesem Update nicht verändert, weil sie von der ausgelieferten Fassung abweichen oder nicht umbenannt werden konnten: %s. Sie ersetzen die J2Commerce-Kerntemplates (bootstrap5 und uikit), und ihnen fehlen neuere Funktionen wie Zusatzfelder im Zahlungsschritt und Beschreibungen der Zahlungsarten. Bitte mit components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php abgleichen und entfernen, wenn sie keine eigenen Änderungen enthalten."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_TOO_OLD="J2Commerce %1$s ist installiert. Die Einwilligungs-Checkbox wird über das J2Commerce-Ereignis AfterDisplayShippingPayment angezeigt, das die J2Commerce-Checkout-Templates ab Version %2$s auslösen. Bitte J2Commerce aktualisieren; bis dahin fehlt die Checkbox, und bei erforderlicher Einwilligung kann der Checkout nicht abgeschlossen werden."
PLG_PRIVACY_J2COMMERCE_CHECKOUT_OVERRIDE_RETIRED="Unveränderte J2Commerce-6-Checkout-Overrides, die eine frühere Version dieses Plugins kopiert hat, wurden deaktiviert (umbenannt mit der Endung %2$s): %1$s. Der Checkout-Schritt kommt jetzt aus dem J2Commerce-Kerntemplate, einschliesslich der Einwilligungs-Checkbox. Die umbenannten Dateien können gelöscht werden, sobald der Checkout funktioniert."
