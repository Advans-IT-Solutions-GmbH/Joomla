PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Fügt aktivierte und sichtbare J2Commerce-Produkte, deren Artikel veröffentlicht und für Gäste zugänglich ist, automatisch zur OSMap-Sitemap hinzu."

; Plugin-Parameter
PLG_OSMAP_PRIORITY_LABEL="Priorität"
PLG_OSMAP_PRIORITY_DESC="Sitemap-Priorität für Produktseiten (0.0–1.0). Standard: 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Änderungshäufigkeit"
PLG_OSMAP_CHANGEFREQ_DESC="Wie häufig sich Produktseiten voraussichtlich ändern."

; Post-Installations-Nachricht
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce: Installation abgeschlossen"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP_LABEL="Schritt %d"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Plugin aktivieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Verwalten → Plugins</strong> → nach <strong>OSMap - J2Commerce</strong> suchen → aktivieren."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="OSMap konfigurieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="In OSMap (<strong>Komponenten → OSMap</strong>) die Sitemap öffnen und sicherstellen, dass das Menü mit dem Shop-Eintrag ausgewählt ist. Das Plugin erkennt alle aktivierten J2Commerce-Produkte automatisch."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Sitemap neu generieren"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Die Sitemap-URL aufrufen (z.B. <strong>/sitemap</strong>) oder in OSMap auf <strong>Aktualisieren</strong> klicken. Öffentlich sichtbare Produkte (veröffentlicht und für Gäste zugänglich) erscheinen als <code>/shop/produkt-alias</code>-URLs (auf einer mehrsprachigen Website trägt jede URL das Sprach-SEF-Präfix des Menüeintrags, z.B. <code>/de/shop/produkt-alias</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin aktiviert (System → Verwalten → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Shop-Menüeintrag in der OSMap-Sitemap ausgewählt"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap neu generiert und Produkt-URLs sichtbar"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Checkliste"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Dokumentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Installer-Hinweise
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce wurde auf Version %s aktualisiert."
PLG_OSMAP_J2COMMERCE_ENABLE_HINT="Das Plugin ist deaktiviert. Unter <strong>System → Verwalten → Plugins</strong> nach <strong>OSMap - J2Commerce</strong> suchen und aktivieren."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) ist nicht installiert. Dieses Plugin funktioniert nur zusammen mit OSMap. OSMap installieren, um eine Sitemap zu erzeugen."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_DISABLED="OSMap (com_osmap) ist installiert, aber deaktiviert. Dieses Plugin funktioniert nur zusammen mit OSMap. OSMap unter <strong>System → Verwalten → Erweiterungen</strong> aktivieren, um eine Sitemap zu erzeugen."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Weder J2Commerce 6 (com_j2commerce) noch J2Store/J2Commerce 4 (com_j2store) ist installiert und aktiviert. Es werden keine Produkte in die Sitemap aufgenommen, bis eine der beiden Komponenten verfügbar ist."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="Das alte OSMap-Plugin für J2Store (osmap/j2store) wurde deaktiviert, weil dieses Plugin es ersetzt."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="Das alte OSMap-Plugin für J2Store (osmap/j2store) konnte nicht deaktiviert werden: %s. Bitte manuell unter System → Verwalten → Plugins deaktivieren."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="Die OSMap-Datei %s wurde angepasst, damit Factory::getTable() nicht mehr false zurückgibt (Kompatibilität mit PHP 8.1+)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="Die OSMap-Datei %s konnte nicht gelesen oder geschrieben werden. Die Anpassung für PHP 8.1+ wurde nicht angewendet. OSMap auf Version 5.1.4 oder neuer aktualisieren."

; Tab «Hilfe»
PLG_OSMAP_J2COMMERCE_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe»."
PLG_OSMAP_J2COMMERCE_HELP_TAB="Hilfe"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_TITLE="Was das Plugin tut"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P1="OSMap erstellt die Sitemap Ihrer Website, kennt aber die Produktseiten von J2Store und J2Commerce nicht. Dieses Plugin ergänzt die Sitemap um alle öffentlich sichtbaren Produkte."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P2="Ein Produkt erscheint in der Sitemap, wenn alle diese Bedingungen erfüllt sind:"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI1="Das Produkt ist im Shop aktiviert und sichtbar."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI2="Der Artikel des Produkts ist veröffentlicht und liegt in seinem Veröffentlichungszeitraum."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI3="Gäste dürfen den Artikel sehen (Zugriffsebene)."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI4="Die Kategorie des Artikels und alle übergeordneten Kategorien sind veröffentlicht und für Gäste sichtbar."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_NOTE="Das Plugin arbeitet nur zusammen mit OSMap. Es hat keine eigene Seite, legt keine Tabellen an und meldet nichts an Suchmaschinen. Neue oder wieder aktivierte Produkte erscheinen beim nächsten Aufruf der Sitemap."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_TITLE="Voraussetzungen und Einrichtung"
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP1="Installieren und aktivieren Sie OSMap (Free oder Pro, Version 5 oder neuer) und den Shop: J2Store 4 (Komponente <code>com_j2store</code>) oder J2Commerce 6 (Komponente <code>com_j2commerce</code>). Fehlt eines davon oder ist es deaktiviert, zeigt die Installation des Plugins eine Warnung."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP2="Aktivieren Sie das Plugin unter <strong>System → Verwalten → Plugins</strong> (Suche nach <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP3="Stellen Sie sicher, dass der Shop einen Menüeintrag mit einer der unterstützten Ansichten hat: Produktliste, einzelnes Produkt, Kategorien oder Kategorie-Alias (siehe nächster Abschnitt)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP4="Öffnen Sie in OSMap unter <strong>Komponenten → OSMap → Sitemaps</strong> Ihre Sitemap, wählen Sie das Menü mit dem Shop-Menüeintrag aus und speichern Sie."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP5="Rufen Sie die Sitemap auf. Jedes Produkt erscheint mit der Adresse aus dem Pfad des Shop-Menüeintrags und dem Alias des Artikels, z.B. <code>https://example.org/shop/produkt-alias</code>. Auf einer mehrsprachigen Website steht das Sprachkürzel davor, z.B. <code>https://example.org/de/shop/produkt-alias</code>."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP6="Damit diese Adressen funktionieren, müssen in der Globalen Konfiguration suchmaschinenfreundliche URLs und URL-Rewrite eingeschaltet sein, und die <code>.htaccess</code> muss alle Anfragen an <code>index.php</code> weiterleiten (Standardregeln von Joomla)."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_TITLE="Welche Produkte erscheinen"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_P1="Was das Plugin ergänzt, hängt von der Ansicht des Shop-Menüeintrags ab:"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI1="<strong>Produktliste</strong> (<code>view=products</code>): Alle Produkte der gewählten Kategorie und ihrer Unterkategorien, ohne gewählte Kategorie alle Produkte."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI2="<strong>Kategorien</strong> (<code>view=categories</code>): Alle Produkte der gewählten Hauptkategorie und ihrer Unterkategorien, ohne gewählte Kategorie alle Produkte."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI3="<strong>Kategorie-Alias</strong> (<code>view=categoryalias</code>, J2Commerce 6): Alle Produkte dieser Kategorie und ihrer Unterkategorien."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI4="<strong>Einzelnes Produkt</strong> (<code>view=product</code>): Nur dieses Produkt."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI5="Andere Ansichten des Shops, z.B. Warenkorb oder Kasse, ergänzen keine Einträge."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI6="Liegen unter dem Shop-Menüeintrag Artikel-Menüeinträge mit dem Status -2 (Papierkorb), einer pro Produkt, verwendet das Plugin deren Pfad als Adresse. Jedes Produkt erscheint trotzdem nur einmal."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_NOTE="Sind J2Store und J2Commerce 6 gleichzeitig aktiviert, z.B. während eines Umstiegs, hat J2Store Vorrang: Menüeinträge von J2Commerce 6 fehlen in der Sitemap, bis J2Store deaktiviert ist. Deaktivieren Sie J2Store, bevor Sie die neuen Menüeinträge von J2Commerce 6 veröffentlichen."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_TITLE="Einstellungen"
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_P1="Die Einstellungen stehen im Tab «Plugin» und gelten für alle Produkte, die das Plugin in die Sitemap schreibt."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI1="<strong>«Priorität»</strong> (Standard 0.8): Wert von 0.0 bis 1.0, den die Sitemap für jede Produktseite angibt. Er sagt Suchmaschinen, wie wichtig die Seite im Vergleich zu den anderen Seiten Ihrer Website ist. Ändern Sie ihn, wenn Produkte mehr oder weniger Gewicht haben sollen als Ihre übrigen Seiten."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI2="<strong>«Änderungshäufigkeit»</strong> (Standard <code>weekly</code>): Wie oft sich die Produktseiten voraussichtlich ändern, von <code>always</code> bis <code>never</code>. Wählen Sie z.B. <code>daily</code>, wenn sich Preise oder Bestände täglich ändern."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_NOTE="Beide Werte sind Hinweise an Suchmaschinen. Sie bestimmen nicht, welche Produkte in der Sitemap stehen."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>Keine Produkte in der Sitemap.</strong> Prüfen Sie, ob das Plugin aktiviert ist, ob in der OSMap-Sitemap das Menü mit dem Shop-Menüeintrag ausgewählt ist und ob der Menüeintrag eine unterstützte Ansicht verwendet. Prüfen Sie danach an einem Produkt die Bedingungen unter «Was das Plugin tut»."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>Einzelne Produkte fehlen.</strong> Meist ist der Artikel noch nicht oder nicht mehr veröffentlicht, für Gäste gesperrt oder in einer gesperrten Kategorie. Produkte ohne verknüpften Joomla-Artikel kann das Plugin nicht finden."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>Shop-Menüeinträge von J2Commerce 6 fehlen.</strong> J2Store ist noch aktiviert. Deaktivieren Sie J2Store unter <strong>System → Verwalten → Erweiterungen</strong>, sobald der Umstieg auf J2Commerce 6 abgeschlossen ist."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>Die Sitemap bleibt ohne Fehlermeldung leer.</strong> OSMap übergeht Fehler seiner Plugins. Das Plugin schreibt Datenbankfehler in das Joomla-Protokoll (Kategorie <code>plg_osmap_j2commerce</code>). Ob Joomla diese Einträge speichert, hängt von den Protokoll-Einstellungen der Website ab."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>Produktadressen liefern den Fehler 404.</strong> Prüfen Sie die suchmaschinenfreundlichen URLs und die <code>.htaccess</code>. Sperrt die <code>.htaccess</code> Adressen mit <code>/component/</code>, nehmen Sie <code>/component/j2store</code> oder <code>/component/j2commerce</code> davon aus, weil der Shop sie für Warenkorb und Kasse braucht. Stammen die Adressen aus Menüeinträgen mit dem Status -2 und sind deren Pfade veraltet, verwenden Sie unter <strong>Menüs → Alle Menüeinträge</strong> die Schaltfläche <strong>Neu aufbauen</strong>."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>Fehlermeldung zu <code>Factory::getTable()</code>.</strong> Das ist ein Fehler von OSMap bis Version 5.1.3. Die Installation des Plugins korrigiert die betroffene Datei von OSMap. Gelingt das nicht, erscheint eine Warnung. Aktualisieren Sie OSMap dann auf Version 5.1.4 oder neuer."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>Das alte OSMap-Plugin für J2Store ist deaktiviert.</strong> Die Installation deaktiviert das Plugin <code>osmap/j2store</code>, weil dieses Plugin es ersetzt und das alte falsche Produktadressen erzeugt. Lassen Sie es deaktiviert."
