COM_APPOINTMENTS_TEAM_F_DEVICES_INTRO="Das Sperren eines Geräts folgt seiner Einstellung «Beim Entfernen oder Sperren». «Aufräumen»: Beim nächsten Abgleich erhält das Gerät seine Kalender leer und löscht seine lokale Kopie, danach verschwinden die Kalender, danach wird jede Anfrage abgelehnt. «Nur sperren»: Jede Anfrage wird sofort abgelehnt, das Gerät erhält nie einen leeren Kalender und löscht nichts, für Outlook mit beidseitigem Abgleich. «Sofort sperren» lehnt jede Anfrage sofort ab, ohne Aufräumen, für ein verlorenes oder gestohlenes Gerät."
