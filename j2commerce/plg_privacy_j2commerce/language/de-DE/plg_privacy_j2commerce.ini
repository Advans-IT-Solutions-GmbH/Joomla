; Post-Installation Message
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_TITLE="Datenschutz – J2Commerce: Installation abgeschlossen"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP_LABEL="Schritt %d"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Plugin aktivieren"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Verwalten → Plugins</strong> → nach <strong>Privacy - J2Commerce Datenschutz</strong> suchen → aktivieren. Das mitgelieferte Plugin <strong>Task - J2Commerce Datenschutz-Bereinigung</strong> wird automatisch installiert und aktiviert, damit Joomla den geplanten Task-Typ findet."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Plugin-Einstellungen"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP2_NAV="<strong>System → Verwalten → Plugins → Privacy - J2Commerce Datenschutz</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_RETENTION_HINT="<strong>10</strong> – Schweiz: OR Art. 958f, Deutschland: AO §147. Österreich: 7, UK/Spanien: 6."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_LEGAL_BASIS_HINT="Gesetzliche Grundlage für die Aufbewahrungsfrist eintragen."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SUPPORT_EMAIL_HINT="Kontaktadresse, die Benutzern bei Datenschutzanfragen angezeigt wird. <strong>Muss konfiguriert werden.</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CONSENT_HINT="Zeigt eine Datenschutz-Einwilligung im Checkout an. Datenschutzerklärung als Joomla-Artikel verlinken. Mit J2Store/J2Commerce 4 blockiert eine Pflicht-Checkbox den Checkout-Schritt, bis sie angehakt ist; mit J2Commerce 6 wird die Checkbox nur angezeigt, aber nicht erzwungen."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP_OPTIONAL_LABEL="Schritt %d – Optional (Lizenzeinstellung, spezifisch für Advans IT Solutions GmbH)"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Unbefristete Lizenzen in der Datenbank kennzeichnen"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_DESC="Nur relevant für Shops mit unbefristeten Lizenzen. Die Datenschutz-Löschung und der geplante Bereinigungstask prüfen, ob eine Lifetime-Lizenz vorliegt, und bewahren die Bestell-E-Mail-Adresse für Lizenz-Reaktivierung auf. Ohne dieses Kennzeichen werden abgelaufene Kundendaten nach Ablauf der Aufbewahrungsfrist vollständig anonymisiert."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_TITLE="1. J2Commerce 6: Produkte über Metafields markieren"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_DESC="Für jedes Produkt mit Lifetime-Lizenz eine Metafield-Zeile einfügen (<strong>123</strong> durch die tatsächliche J2Commerce-Produkt-ID ersetzen):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_HINT="Der Task prüft #__j2commerce_metafields mit owner_resource = product, metakey = is_lifetime_license und metavalue = yes."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_TITLE="2. J2Commerce 4 / J2Store: Custom-Field-Tabelle erstellen"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_DESC="Nur für J2Commerce 4 / J2Store Installationen: dieses SQL in phpMyAdmin oder der Datenbankkonsole ausführen (<strong>#__</strong> durch das Joomla-Tabellenpräfix ersetzen, z.B. <strong>jos_</strong>):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_NOTE="Diese Tabelle ist <strong>nicht</strong> in der J2Commerce Custom Fields Oberfläche sichtbar (Komponenten → J2Commerce → Custom Fields). Es ist eine separate Datenbanktabelle, die ausschliesslich von diesem Privacy-Plugin verwendet wird."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_ASSIGN_TITLE="3. J2Commerce 4 / J2Store: Produkte als Lifetime-Lizenzen markieren"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_ASSIGN_DESC="Für jedes Produkt mit Lifetime-Lizenz eine Zeile einfügen (<strong>123</strong> durch die tatsächliche J2Store-Produkt-ID ersetzen):"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_ASSIGN_HINT="Die J2Store-Produkt-ID finden Sie unter <strong>Komponenten → J2Store → Katalog → Produkte</strong> in der Spalte ID."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_QUERY_TITLE="4. Wie das Plugin diese Kennzeichen verwendet"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_QUERY_DESC="Das Plugin und der Task fragen diese Felder ab, wenn Datenlöschungen verarbeitet werden:"
