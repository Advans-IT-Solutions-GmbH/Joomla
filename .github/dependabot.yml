version: 2
# Composer ignore rules: every extension declares "php": "^8.1" (Joomla 5.4 minimum),
# and the CI runs composer install on PHP 8.1 (unit tests of Product Compare and Privacy)
# and 8.3 (PHPUnit jobs). require-dev must stay installable on PHP 8.1, so these
# major versions are excluded until the PHP minimum is raised:
#   - phpunit/phpunit >= 11 (11 needs PHP 8.2, 12 needs PHP 8.3, 13 needs PHP 8.4.1)
#   - joomla/registry >= 4 (4.x needs PHP 8.3, Joomla 5.4 ships registry 3.x)
updates:
  # Privacy Plugin
  - package-ecosystem: "composer"
    directory: "/j2commerce/plg_privacy_j2commerce"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "privacy"

  # Import/Export Component
  - package-ecosystem: "composer"
    directory: "/j2commerce/com_j2commerce_importexport"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "importexport"

  # J2Store Cleanup Component
  - package-ecosystem: "composer"
    directory: "/j2commerce/com_j2store_cleanup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "cleanup"

  # Product Compare Plugin
  - package-ecosystem: "composer"
    directory: "/j2commerce/plg_j2commerce_productcompare"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "productcompare"

  # OSMap Plugin
  - package-ecosystem: "composer"
    directory: "/j2commerce/plg_osmap_j2commerce"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "osmap"

  - package-ecosystem: "composer"
    directory: "/com_dmarcreports"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/mod_dmarcreports"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
      - dependency-name: "joomla/registry"
        versions: [">= 4"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/plg_task_dmarcreports"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/plg_system_dmarcmtasts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/com_appointments"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 11"]
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
