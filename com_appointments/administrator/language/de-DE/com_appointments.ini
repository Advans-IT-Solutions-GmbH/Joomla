COM_APPOINTMENTS_SCHEDULE_ERROR_WEEKDAY="Jedes wöchentliche Zeitfenster braucht einen Wochentag."
COM_APPOINTMENTS_SCHEDULE_ERROR_DATE="Ein Eintrag für ein einzelnes Datum braucht ein gültiges Datum."
COM_APPOINTMENTS_SCHEDULE_ERROR_TIME="Bitte geben Sie die Zeiten als Stunden und Minuten an, zum Beispiel 09:00."

