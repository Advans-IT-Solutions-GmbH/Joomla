; Page d'aide
COM_J2COMMERCE_IMPORTEXPORT_HELP_TITLE="J2Commerce Import/Export : aide"
COM_J2COMMERCE_IMPORTEXPORT_HELP_INTRO="Cette page explique l'export et l'import des produits, les options d'import et les options du composant, comment l'import retrouve les produits existants et ce qu'il fait lorsqu'un enregistrement échoue."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CONTENTS="Sommaire de l'aide"
COM_J2COMMERCE_IMPORTEXPORT_HELP_BACK="Retour à J2Commerce Import/Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_TITLE="Ce que fait le composant"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_DESC="J2Commerce Import/Export écrit les données produit de votre boutique dans un fichier et importe des produits complets depuis un fichier JSON ou CSV. Il sert à transférer des produits d'un site à un autre, à conserver une copie des produits sous forme de fichier ou à créer et modifier de nombreux produits en une fois."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_PRODUCT="Un produit de la boutique se compose d'un article Joomla (titre, textes, catégorie, images) et de l'enregistrement produit de la boutique avec ses variantes, son stock, ses prix échelonnés, ses images, ses options, ses filtres, ses fichiers à télécharger, ses tags et ses champs personnalisés. Le type d'export « Produits (Complet) » et l'import traitent toutes ces parties ensemble, ainsi que, si vous le souhaitez, un élément de menu pour l'article."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OVERVIEW_SCOPE="Le composant n'a pas de tables de base de données propres, pas de tâche planifiée et n'envoie aucun e-mail. Le désinstaller n'annule pas les imports : les articles, catégories et produits importés restent en place."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TITLE="Prérequis et autorisations"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP="Le composant fonctionne avec J2Store 4 et avec J2Commerce 6. Il détecte la boutique lui-même, il n'y a rien à régler :"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_1="J2Commerce 6, si le composant J2Commerce (<code>com_j2commerce</code>) est activé et que sa table des produits existe."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_2="Sinon J2Store 4, si le composant J2Store (<code>com_j2store</code>) est activé et que sa table des produits existe."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_RULE_3="Si aucun des deux cas ne s'applique, les tables de J2Commerce 6 si elles existent, sinon celles de J2Store 4."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_SHOP_BOTH="Si les deux composants de boutique sont activés, comme juste après une migration, le composant travaille avec J2Commerce 6."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACCESS="Pour ouvrir le composant et cette aide, un utilisateur a besoin de l'autorisation « %1$s » sur le composant. Le bouton « %2$s » de la barre d'outils du composant ouvre cette page."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_ACTIONS="La zone d'export exige en plus l'action « Exportation », la zone d'import l'action « Importation ». Les deux se règlent sous « %1$s », onglet « %2$s ». La page n'affiche que les zones que l'utilisateur peut utiliser. L'installation et la mise à jour du composant accordent les deux actions à chaque groupe qui peut gérer le composant à ce moment. Les règles existantes restent inchangées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT="Un import vérifie aussi les autorisations Joomla de l'utilisateur qui importe, comme le fait l'administration lorsque les mêmes modifications sont enregistrées à la main. Un enregistrement échoue s'il manque l'une de ces autorisations :"
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_ARTICLE="Articles : « %1$s » dans la catégorie cible pour un nouvel article et pour déplacer un article dans une autre catégorie. « %2$s » pour un article existant, ou « %3$s » si vous en êtes l'auteur."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_STATE="Statut, niveau d'accès, mise en vedette et dates de publication d'un article : les modifier exige « %1$s ». Sans cette autorisation, un nouvel article est enregistré non publié avec le niveau d'accès ID 1 (Public dans une installation standard), et un article existant garde ces valeurs. Un enregistrement qui définit d'autres valeurs échoue."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_CATEGORY="Nouvelles catégories : « %1$s » sur le composant Articles ou sur au moins une catégorie. Une nouvelle catégorie n'est publiée qu'avec « %2$s » sur le composant Articles."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_MENU="Éléments de menu : « %1$s » sur le menu cible pour un nouvel élément, « %2$s » pour un élément existant et « %3$s » lorsque le statut de publication change. Cela vaut aussi pour un nouvel élément publié."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_CONTENT_TAGS="Nouveaux tags : « %1$s » sur le composant Tags. Champs personnalisés : « %2$s » sur le champ."
COM_J2COMMERCE_IMPORTEXPORT_HELP_REQ_TRUST="N'accordez l'accès à ce composant qu'à des administrateurs de confiance. Un import modifie des articles, des catégories, des menus et des données de la boutique."
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_TITLE="Installation, mise à jour et désinstallation"
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_NEW="Installez le ZIP du composant avec l'installateur d'extensions de Joomla (Système → Installer → Extensions). Le composant apparaît ensuite sous Composants. Il ne crée aucune table de base de données et n'a besoin d'aucune tâche planifiée."
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_BACKUP="Avant une mise à jour, effectuez une sauvegarde actuelle et complète de tout le site, que vous pouvez restaurer de manière indépendante. L'installateur ne conserve aucune copie de fichier et ne peut pas vérifier votre sauvegarde. La première tentative de mise à jour affiche cette recommandation et s'arrête avant de modifier des fichiers, puis vous relancez la mise à jour. Les options et les autorisations sont conservées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_CONFLICT="Si l'installateur trouve un fichier modifié ou inconnu que la mise à jour remplacerait, il s'arrête avant de copier quoi que ce soit et indique le chemin et les empreintes. Vérifiez le fichier, résolvez-le à la main ou reportez la mise à jour, puis réessayez. Il n'existe ni commande d'approbation ni contournement."
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_UPDATES="Les nouvelles versions apparaissent sous Système → Mise à jour → Extensions. Chaque installation et mise à jour garantit que le site de mise à jour du composant est enregistré et supprime les sites de mise à jour qui pointent encore vers l'ancien chemin du dépôt."
COM_J2COMMERCE_IMPORTEXPORT_HELP_INSTALL_UNINSTALL="La désinstallation supprime les fichiers du composant et ses fichiers de langue. Il n'a pas de routine de désinstallation propre. Les articles, catégories, éléments de menu et données de la boutique créés ou modifiés par une importation restent dans la base de données, et les autorisations du composant sont supprimées avec lui."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TITLE="Export"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_1="Dans la zone « Export », choisissez le « Type »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_2="Choisissez le « Format » : JSON, CSV ou XML."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_STEP_3="Cliquez sur « Exporter les données ». Le navigateur télécharge un fichier nommé d'après le type, la date et l'heure, par exemple <code>products_full_2026-01-31_14-05-00.json</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPES_TITLE="Contenu de chaque type"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_FULL="« Produits (Complet) » : chaque produit de la boutique dont la source est un article Joomla. Chaque enregistrement contient l'article (titre, alias, textes, statut, catégorie avec son titre, son alias et son chemin, niveau d'accès, langue, mise en vedette, dates, images, liens, attributs et métadonnées), l'enregistrement produit, les variantes avec stock et prix échelonnés, les images du produit, les options avec leurs valeurs, les filtres, les fichiers à télécharger, les tags, les valeurs des champs personnalisés, les métachamps et un élément de menu du site qui pointe vers l'article."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRODUCTS="« Produits (J2Store uniquement) » : tous les enregistrements de la table des produits de la boutique détectée, sans les données d'article. Malgré son nom, c'est la table de J2Commerce 6 lorsque le composant travaille avec J2Commerce 6."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_CATEGORIES="« Catégories » : toutes les catégories d'articles avec tous leurs champs, dans l'ordre de l'arborescence."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_VARIANTS="« Variantes » : tous les enregistrements de variantes de la boutique, sans stock ni prix échelonnés."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_TYPE_PRICES="« Prix » : tous les enregistrements de prix échelonnés de la boutique."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_NO_FILTER="L'export n'a ni filtre ni sélection. Il contient toujours tous les enregistrements du type choisi, y compris ceux qui sont non publiés, désactivés ou à la corbeille."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMATS_TITLE="Formats"
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_JSON="JSON : une partie <code>_documentation</code> avec des remarques et une description des champs, suivie de la liste <code>products</code>. La liste porte ce nom pour chaque type, y compris pour les catégories, les variantes et les prix."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_CSV="CSV : UTF-8 avec indicateur d'ordre des octets (BOM). La première ligne décrit chaque colonne et commence par <code>#</code>, la deuxième contient les en-têtes de colonnes, puis vient une ligne par enregistrement. Le délimiteur et le délimiteur de texte proviennent des options (« Délimiteur CSV », « Délimiteur de texte CSV »)."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_FORMULA="En CSV, une cellule de texte qu'un tableur exécuterait comme formule (elle commence par <code>=</code>, <code>+</code>, <code>-</code>, <code>@</code>, une tabulation ou un saut de ligne) reçoit une apostrophe en tête. Les nombres simples, même négatifs, restent inchangés. L'import retire l'apostrophe."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FORMAT_XML="XML : une partie <code>field_documentation</code> et une partie <code>items</code>. Les fichiers XML ne peuvent pas être importés."
COM_J2COMMERCE_IMPORTEXPORT_HELP_EXPORT_FOR_IMPORT="Seul « Produits (Complet) » peut être réimporté. Utilisez le format JSON pour cet export."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_TITLE="Import"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_1="Dans la zone « Import », le « Type » est toujours « Produits (Complet) »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_2="Sous « Fichier », choisissez le fichier JSON ou CSV."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_3="Ouvrez « %1$s » sous le fichier et vérifiez les options d'import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_4="Cliquez sur « Téléverser le fichier ». Le fichier est téléversé et lu en entier. L'« Aperçu » montre les cinq premiers enregistrements et le « Nombre de lignes »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_STEP_5="Cliquez sur « Démarrer l'import » et confirmez la question. Un message indique ensuite combien d'enregistrements ont été importés (« Importé ») et combien ont échoué (« Échoué »), avec la raison pour chaque enregistrement en échec."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_SESSION="L'aperçu et l'import utilisent toujours le dernier fichier téléversé. Si vous choisissez un autre fichier, l'aperçu disparaît et vous téléversez à nouveau. Si vous téléversez un fichier dans un autre onglet du navigateur, le premier onglet ne peut plus lancer son import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPTIONS_TITLE="Options d'import"
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_UPDATE="« Mettre à jour les produits existants » (cochée par défaut) : un enregistrement qui correspond à un produit existant met celui-ci à jour, voir « Comment les produits existants sont retrouvés et mis à jour ». Si la case est décochée, chaque enregistrement crée un nouvel article et un nouveau produit. Un enregistrement dont l'alias existe déjà dans sa catégorie échoue alors."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU="« Créer des éléments de menu » (décochée par défaut) : pour chaque enregistrement avec une partie <code>menu_item</code>, un élément de menu du site qui affiche l'article est créé ou mis à jour. Les enregistrements sans cette partie ne reçoivent pas d'élément de menu. La partie doit avoir un titre. Un élément de menu dans le même menu, avec le même élément parent et le même lien vers l'article, est mis à jour au lieu d'être créé une seconde fois."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_MENU_DEFAULTS="« Menu », « Niveau d'accès du menu » et « Éléments de menu publiés » ne s'appliquent que si la partie <code>menu_item</code> ne contient pas <code>menutype</code>, <code>access</code> ou <code>published</code>. Un <code>menu_item</code> exporté contient toujours ces valeurs, ce sont donc les valeurs du fichier qui s'appliquent. L'élément parent provient de <code>parent_id</code>. Sans cette valeur, l'élément est créé au premier niveau du menu."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_CATEGORY="« Catégorie par défaut » : la catégorie d'articles pour les enregistrements qui n'ont ni <code>catid</code> ni <code>category_path</code>. La liste montre les catégories d'articles publiées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_QUANTITY="« Mode de mise à jour des quantités » : « Remplacer (écraser) » enregistre la quantité du fichier comme nouveau stock. « Ajouter (au stock existant) » ajoute la quantité du fichier au stock que la variante possède déjà. Une variante sans enregistrement de stock reçoit la quantité du fichier dans les deux modes. Une variante sans <code>quantity</code> compte pour 0, son stock devient donc 0 en mode « Remplacer (écraser) »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_IMPORT_OPT_NOT_SAVED="Les options d'import ne sont pas enregistrées. Vérifiez-les avant chaque import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_TITLE="Fichier d'import"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_JSON="JSON : une liste d'enregistrements produit, ou un objet avec la liste <code>products</code>, tel que l'écrit l'export « Produits (Complet) ». Les autres parties comme <code>_documentation</code> sont ignorées. Chaque enregistrement doit être un objet avec des champs nommés."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV="CSV : UTF-8, avec ou sans indicateur d'ordre des octets. L'import attend toujours une virgule comme délimiteur et des guillemets doubles comme délimiteur de texte, quelles que soient les options. Les lignes vides et les lignes dont la première cellule commence par <code>#</code> sont ignorées. La première autre ligne contient les en-têtes de colonnes, aucun ne peut être vide ni figurer deux fois. Chaque ligne doit avoir autant de cellules qu'il y a d'en-têtes. Un guillemet à l'intérieur d'une cellule est doublé. Les fichiers avec échappement par barre oblique inverse, comme les écrivaient d'anciens exports, sont aussi lus."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_CSV_LISTS="En CSV, les colonnes <code>variants</code>, <code>product_images</code>, <code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code>, <code>metafields</code> et <code>menu_item</code> contiennent du texte JSON, par exemple une liste entre crochets. Une cellule vide signifie aucune entrée."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_SIZE="Un fichier peut faire 10 Mo au plus. Une limite de téléversement plus basse du serveur (réglages PHP <code>upload_max_filesize</code> et <code>post_max_size</code>) s'applique en premier."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_INVALID="L'aperçu lit déjà tout le fichier. Les erreurs qui concernent le fichier entier l'arrêtent, et rien n'est importé : JSON invalide, objet JSON sans la liste <code>products</code>, enregistrement qui n'est pas un objet, guillemets mal placés, nombre de cellules incorrect ou colonne de liste sans JSON valide."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELDS_TITLE="Champs d'un enregistrement produit"
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TITLE="<code>title</code> : obligatoire. Un enregistrement sans titre échoue."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ALIAS="<code>alias</code> : facultatif. S'il manque ou s'il est vide, l'alias est formé à partir du titre. L'alias est enregistré sous la forme utilisable dans une URL qu'emploie Joomla."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_TEXT="<code>introtext</code> et <code>fulltext</code> : HTML. Ils passent par les filtres de texte des groupes de l'utilisateur qui importe (Configuration globale, onglet « Filtres de texte »), comme lors de l'enregistrement de l'article dans l'administration."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_STATE="<code>article_state</code> (1 publié, 0 non publié, 2 archivé, -2 à la corbeille), <code>access</code> (ID d'un niveau d'accès), <code>featured</code> (1 ou 0), <code>publish_up</code> et <code>publish_down</code> (date, vide signifie aucune, un <code>publish_up</code> vide garde le début actuel), <code>language</code> (par défaut <code>*</code>), <code>metakey</code> et <code>metadesc</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_JSON="<code>article_images</code>, <code>urls</code>, <code>attribs</code> et <code>metadata</code> : objets JSON. Le balisage est retiré de leurs textes. Les liens <code>urla</code>, <code>urlb</code>, <code>urlc</code>, <code>image_intro</code> et <code>image_fulltext</code> ne peuvent utiliser que http, https, mailto, tel, ftp, ftps ou sftp, les autres liens sont vidés. Une valeur qui n'est pas un objet JSON fait échouer l'enregistrement."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_CATEGORY="<code>catid</code>, <code>category_path</code>, <code>category_title</code> et <code>category_alias</code> : la catégorie cible, voir « Catégories, articles et alias »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_ID="<code>article_id</code> : l'ID de l'article à mettre à jour, voir « Comment les produits existants sont retrouvés et mis à jour »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_PRODUCT="Champs du produit : <code>product_type</code> (par défaut <code>simple</code>), <code>visibility</code>, <code>enabled</code>, <code>taxprofile_id</code>, <code>manufacturer_id</code>, <code>vendor_id</code>, <code>has_options</code>, <code>addtocart_text</code>, <code>params</code>, <code>plugins</code>, <code>up_sells</code>, <code>cross_sells</code> et <code>main_tag</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_VARIANTS="<code>variants</code> : liste des variantes avec <code>sku</code>, <code>price</code>, <code>quantity</code>, <code>manage_stock</code>, <code>weight</code>, <code>length</code>, <code>width</code>, <code>height</code> et les autres champs de variante de l'export. Chaque variante peut avoir une liste <code>tier_prices</code> avec <code>quantity_from</code>, <code>quantity_to</code>, <code>date_from</code>, <code>date_to</code>, <code>customer_group_id</code> et <code>price</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_IMAGES="<code>product_images</code> : <code>main_image</code>, <code>thumb_image</code> et <code>additional_images</code> avec leurs textes alternatifs. Les chemins sont relatifs à la racine de Joomla, par exemple <code>images/products/photo.jpg</code>. L'import n'enregistre que les chemins : téléversez les images au préalable, par exemple avec le gestionnaire de médias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_LISTS="<code>options</code>, <code>filters</code>, <code>files</code>, <code>tags</code>, <code>custom_fields</code> et <code>metafields</code> : listes telles que les écrit l'export. Une entrée de <code>custom_fields</code> a besoin de <code>name</code> et de <code>value</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_FIELD_MENU="<code>menu_item</code> : partie facultative avec <code>title</code>, <code>alias</code>, <code>menutype</code>, <code>parent_id</code>, <code>access</code>, <code>published</code>, <code>language</code> et <code>params</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_FILE_DEFAULTS="Lors de la mise à jour d'un produit existant, chaque champ de produit et chaque champ de variante absent de l'enregistrement reçoit sa valeur par défaut. L'ancienne valeur n'est pas conservée. Importez des enregistrements complets, idéalement un export que vous avez modifié."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_TITLE="Comment les produits existants sont retrouvés et mis à jour"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_INTRO="Lorsque « Mettre à jour les produits existants » est cochée, l'import cherche l'article de chaque enregistrement dans cet ordre et s'arrête au premier résultat :"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_1="L'article dont l'ID figure dans <code>article_id</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_2="Un article avec le même alias, dans n'importe quelle catégorie : d'abord sous la forme utilisable dans une URL, puis tel qu'il est écrit dans le fichier."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_3="L'article du produit qui a une variante avec le SKU de la première variante de l'enregistrement."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_SHOP_ONLY="L'article trouvé doit appartenir à un produit de la boutique active. Sinon l'enregistrement échoue avec le message d'autorisation de Joomla. Un article ordinaire avec le même alias n'est donc jamais écrasé."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_VARIANTS="L'enregistrement produit de l'article est mis à jour. Les variantes sont associées par SKU à l'intérieur du produit : une variante dont le SKU est connu est mise à jour, toute autre variante du fichier est ajoutée. Les variantes absentes du fichier restent inchangées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TITLE="Ce qui est remplacé et ce qui est ajouté"
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_PRICES="Prix échelonnés d'une variante : remplacés si la variante du fichier a des prix échelonnés, sinon conservés."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_IMAGES="Images du produit : remplacées si l'enregistrement a <code>product_images</code>, sinon conservées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_OPTIONS="Options : toutes les options du produit sont remplacées si l'enregistrement a <code>options</code>. Une option est retrouvée par <code>option_unique_name</code>, une valeur d'option par son nom dans l'option. Les options et valeurs manquantes sont créées."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILTERS="Filtres : remplacés si l'enregistrement a <code>filters</code>. Un filtre est repris par <code>filter_id</code> ou retrouvé par son nom dans son groupe de filtres. Les filtres et groupes de filtres manquants sont créés."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_TAGS="Tags : remplacés si l'enregistrement a <code>tags</code>. Un tag est repris par <code>id</code> ou retrouvé par son titre. Un tag manquant est créé."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FIELDS="Champs personnalisés : la valeur de chaque champ nommé est remplacée. Les noms de champs inconnus sont ignorés sans message."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_META="Métachamps : seulement avec J2Commerce 6, remplacés si l'enregistrement a <code>metafields</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_FILES="Fichiers à télécharger : toujours ajoutés, jamais remplacés. Réimporter le même enregistrement ajoute ses fichiers une fois de plus."
COM_J2COMMERCE_IMPORTEXPORT_HELP_MATCH_REPLACE_STOCK="Stock : en plus de la quantité, l'import écrit aussi <code>on_hold</code> et <code>qty_sold</code> depuis le fichier, 0 s'ils manquent."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_TITLE="Catégories, articles et alias"
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_CATID="<code>catid</code> est renseigné : cette catégorie d'articles est utilisée. Si elle n'existe pas, l'enregistrement échoue. <code>catid</code> a la priorité sur <code>category_path</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_PATH="<code>category_path</code> est renseigné et <code>catid</code> ne l'est pas : la catégorie d'articles qui a exactement ce chemin est utilisée, par exemple <code>shop/electronics</code>."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW="Si aucune catégorie n'a ce chemin, une nouvelle catégorie est créée au premier niveau, et non sous le chemin. Son titre est <code>category_title</code>, ou Imported s'il manque. Son alias est <code>category_alias</code>, sinon le titre, sous une forme utilisable dans une URL. S'il existe déjà au premier niveau une catégorie d'articles avec cet alias qui n'est pas à la corbeille, elle est utilisée. Ainsi les enregistrements suivants du même fichier arrivent dans la même catégorie."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_DEFAULT="Ni <code>catid</code> ni <code>category_path</code> : la « Catégorie par défaut » des options d'import est utilisée."
COM_J2COMMERCE_IMPORTEXPORT_HELP_CAT_NEW_STATE="Une nouvelle catégorie n'est publiée que si vous avez « %1$s » sur le composant Articles, sinon elle est non publiée. Elle reçoit le niveau d'accès par défaut du site et la langue Toutes, et elle hérite ses autorisations."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_NEW="Les nouveaux articles sont créés par la table d'articles de Joomla. Ils passent les contrôles de Joomla et reçoivent leurs propres autorisations, qu'ils héritent de leur catégorie. L'utilisateur qui importe est enregistré comme auteur."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_UPDATE="Les articles existants sont mis à jour directement. Leur alias doit être unique dans la catégorie cible, sinon l'enregistrement échoue avec le message de Joomla sur l'alias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_MOVE="Si un enregistrement déplace un article dans une autre catégorie, les autorisations de l'article sont placées sous la nouvelle catégorie après l'enregistrement. Si cela échoue, le message d'erreur de l'enregistrement indique qu'il a été importé. Le prochain import de cet article remet d'abord les autorisations en place."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ART_ALIAS="Si ni l'alias ni le titre ne donnent un alias utilisable dans une URL, par exemple un titre en écriture non latine alors que les alias Unicode sont désactivés dans la configuration globale, l'enregistrement échoue. Donnez à l'enregistrement un alias avec des lettres latines ou des chiffres."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_TITLE="Erreurs et annulation des enregistrements en échec"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ROWS="Chaque enregistrement est importé séparément. Un enregistrement en échec n'arrête pas les autres. Le résultat indique « Importé » et « Échoué » et une ligne par enregistrement en échec, par exemple « Ligne 3 : … ». Le numéro compte les enregistrements produit du fichier à partir de 1, et non les lignes du fichier. Si aucun enregistrement n'est importé, le message « Échec de l'import. Veuillez vérifier le fichier et réessayer. » apparaît avec les mêmes lignes."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_ORDER="Joomla enregistre les catégories, les autorisations et les éléments de menu d'une manière qui termine une transaction de base de données ouverte. C'est pourquoi l'import écrit d'abord la nouvelle catégorie, le nouvel article et l'élément de menu d'un enregistrement, puis tout le reste dans une seule transaction : la mise à jour d'un article existant, le produit, les variantes, le stock, les prix échelonnés, les images, les options, les filtres, les fichiers à télécharger, les tags, les champs personnalisés et les métachamps."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_UNDO="Si une étape ultérieure échoue, la transaction est annulée. La catégorie, l'article et l'élément de menu créés par l'enregistrement sont supprimés. Un élément de menu modifié par l'enregistrement retrouve ses valeurs précédentes, y compris le statut de publication de ses éléments enfants."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP="Cette annulation laisse un élément en place si quelqu'un l'a modifié entre-temps :"
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_CATEGORY="Une nouvelle catégorie qui contient déjà des articles ou des sous-catégories, ou qui a été modifiée."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_ARTICLE="Un nouvel article qui a été enregistré ou ouvert en modification."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU="Un nouvel élément de menu qui a été modifié ou qui a reçu des éléments enfants."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_KEEP_MENU_CHANGED="Un élément de menu modifié qui a de nouveau été modifié ou dont les éléments enfants ont changé."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_REPORT="Tout ce qui n'a pas été annulé est cité dans le message d'erreur de l'enregistrement : « Ces modifications de la ligne n'ont pas pu être annulées : … ». Vérifiez ces éléments et supprimez-les ou corrigez-les à la main."
COM_J2COMMERCE_IMPORTEXPORT_HELP_ERR_NO_UNDO="Un import réussi ne peut pas être annulé. Exportez les produits ou sauvegardez la base de données avant un import important."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_TITLE="Options"
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_OPEN="Le bouton « %1$s » de la barre d'outils ouvre les options du composant. Il n'apparaît que pour les utilisateurs ayant « %2$s » ou « %3$s »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_DELIMITER="« Délimiteur CSV » : virgule (par défaut), point-virgule ou tabulation. S'applique seulement à l'export CSV."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_ENCLOSURE="« Délimiteur de texte CSV » : guillemet double (par défaut) ou guillemet simple. S'applique seulement à l'export CSV."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_PERMISSIONS="Onglet « %1$s » : qui peut ouvrir le composant (« %2$s »), importer (« Importation ») et exporter (« Exportation »)."
COM_J2COMMERCE_IMPORTEXPORT_HELP_OPTIONS_CSV_IMPORT="L'import attend toujours la virgule et le guillemet double. Un fichier CSV exporté avec d'autres réglages ne peut pas être importé tel quel."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TITLE="Problèmes fréquents et solutions"
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILE_TYPE="« Type de fichier invalide. Seuls les fichiers CSV et JSON sont autorisés. » : le nom du fichier doit se terminer par <code>.csv</code> ou <code>.json</code> et le contenu doit être du texte. Les fichiers XML et les fichiers de tableur comme <code>.xlsx</code> ne peuvent pas être importés. Enregistrez un tableau au format CSV, séparé par des virgules, en UTF-8."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_TOO_LARGE="« Fichier trop volumineux. La taille maximale est de 10 Mo. » ou « Échec du téléversement du fichier. » : le fichier dépasse 10 Mo ou la limite de téléversement du serveur. Répartissez-le sur plusieurs fichiers."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_INVALID="« Données d'import invalides. … » : le fichier ou un enregistrement n'a pas la forme attendue, par exemple un JSON invalide, un nombre de cellules incorrect, une valeur inconnue dans <code>article_state</code>, un <code>catid</code> qui n'est pas une catégorie d'articles, un menu qui n'existe pas ou une colonne JSON qui n'est pas un objet. En CSV, vérifiez que toutes les colonnes de liste contiennent du JSON valide."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DENIED="« %1$s » pour un enregistrement : il manque l'une des autorisations Joomla citées sous « Prérequis et autorisations », ou l'article trouvé n'appartient à aucun produit de la boutique active, par exemple un article ordinaire avec le même alias."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_DUPLICATES="Des produits sont créés en double : « Mettre à jour les produits existants » était décochée, ou l'enregistrement n'a pas d'<code>article_id</code>, d'alias ou de SKU qui correspond au produit existant."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_OTHER_SITE="Import d'un export provenant d'un autre site : les ID diffèrent d'un site à l'autre. <code>article_id</code> peut mettre à jour le mauvais produit ou être refusé, <code>catid</code> peut désigner une catégorie erronée ou absente, et les ID des tags, filtres, profils de taxe, fabricants et éléments de menu parents sont repris tels quels. Retirez <code>article_id</code> et <code>catid</code> (la catégorie vient alors de <code>category_path</code>) et vérifiez les autres ID avant l'import."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_STOCK="Le stock vaut 0 après l'import : avec « Remplacer (écraser) », une variante sans <code>quantity</code> reçoit 0. Indiquez la quantité ou choisissez « Ajouter (au stock existant) »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_IMAGES="Des images manquent : l'import n'enregistre que des chemins. Téléversez d'abord les images et utilisez des chemins relatifs à la racine de Joomla."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_EMPTY="L'export est vide : il n'existe aucun enregistrement de ce type ou, pour « Produits (Complet) », aucun produit dont la source est un article Joomla. Si J2Store et J2Commerce sont installés tous les deux, vérifiez quel composant de boutique est activé, voir « Prérequis et autorisations »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_APOSTROPHE="Des cellules de l'export CSV commencent par une apostrophe : elle protège les valeurs qu'un tableur exécuterait comme formule. Laissez l'apostrophe en place, l'import la retire."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_FILES="Des fichiers à télécharger apparaissent en double : ils sont ajoutés à chaque import. Retirez la liste <code>files</code> des enregistrements que vous réimportez."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_ALIAS="« L'alias ou le titre ne peut pas être converti en un alias utilisable dans une URL. … » : voir « Catégories, articles et alias »."
COM_J2COMMERCE_IMPORTEXPORT_HELP_TROUBLE_CHANGED="« Le fichier ne correspond plus à cet aperçu. … » ou « Fichier introuvable. Veuillez téléverser le fichier à nouveau. » : un autre onglet a remplacé le fichier, le fichier a déjà été importé ou la session a expiré. Téléversez le fichier à nouveau."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_TITLE="Protection des données"
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_EXPORT="Les fichiers d'export contiennent des données de produits et d'articles de la boutique, y compris les ID internes des utilisateurs auteurs et modificateurs et les réglages des éléments de menu. Ils ne contiennent ni commandes ni données de clients. Conservez-les à l'abri et supprimez-les lorsque vous n'en avez plus besoin."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_UPLOAD="Un fichier d'import téléversé est placé dans le dossier <code>tmp</code> de Joomla sous un nom aléatoire (<code>j2commerce_import_…</code>). L'import supprime le fichier une fois exécuté. Un fichier téléversé mais non importé y reste : supprimez régulièrement ces fichiers."
COM_J2COMMERCE_IMPORTEXPORT_HELP_PRIVACY_LOCAL="L'export et l'import s'exécutent sur votre propre serveur. Les fichiers ne circulent qu'entre votre navigateur et votre site."
