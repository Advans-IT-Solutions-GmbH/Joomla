PLG_SYSTEM_J2COMMERCEPRIVACY="Système - J2Commerce Consentement de confidentialité"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Vérifie côté serveur la case de consentement du checkout J2Commerce 6 et enregistre le consentement par commande dans les consentements de confidentialité de Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT="Checkout J2Commerce : politique de confidentialité"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_SUBJECT_LEGACY="Confidentialité J2Commerce (entrée d'une version antérieure)"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY="<p>Le client a pris connaissance de la politique de confidentialité dans le checkout J2Commerce pour la commande <strong>%1$s</strong>.</p><p>Adresse IP : <strong>%2$s</strong></p><p>Agent utilisateur :<br>%3$s</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_EVIDENCE_REMOVED="<p>Le client a pris connaissance de la politique de confidentialité dans le checkout J2Commerce pour la commande <strong>%1$s</strong>.</p><p>L'adresse IP et l'agent utilisateur ont été supprimés lors de l'anonymisation de la commande après sa durée de conservation.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_LEGACY="<p>Entrée d'une version antérieure du template du site. Son contenu n'est plus vérifiable et ne prouve aucun consentement. Les données personnelles (adresse e-mail, adresse IP, agent utilisateur) ont été supprimées.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_CONSENT_BODY_ERASED="<p>Entrée de consentement anonymisée par une demande de suppression. Les données personnelles (adresse e-mail, adresse IP, agent utilisateur) ont été supprimées. L'entrée n'est plus valable.</p>"
PLG_SYSTEM_J2COMMERCEPRIVACY_NEWSLETTER_EVIDENCE_REMOVED="supprimé"
PLG_SYSTEM_J2COMMERCEPRIVACY_NEWSLETTER_BODY_EVIDENCE_REMOVED="Consentement à la newsletter donné lors de la commande %1$s. L'adresse IP et l'agent utilisateur ont été supprimés lors de l'anonymisation de la commande."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_NOTE="L'onglet « Aide » explique ce que fait ce plugin, comment le configurer et que faire en cas de problème. Le plugin est installé et mis à jour avec le plugin « Privacy - J2Commerce Confidentialité », dont l'onglet « Aide » explique l'ensemble de la fonction."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_TAB="Aide"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="Ce que fait ce plugin"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P1="Ce plugin système fait partie du plugin « Privacy - J2Commerce Confidentialité ». Il assure les tâches pour lesquelles Joomla ne charge pas le plugin de confidentialité lui-même."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI1="Il affiche dans le checkout de J2Commerce 6 la case de consentement à la politique de confidentialité, à l'étape livraison et paiement avant le bouton pour continuer."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI2="Il vérifie le consentement sur le serveur, à l'étape livraison et paiement, lors de la confirmation et lors de l'envoi du paiement. Si un consentement requis manque pour le panier courant, il refuse l'étape avec un message."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI3="Il enregistre le consentement dans les consentements de confidentialité de Joomla dès que J2Commerce a accepté la commande, une fois par commande. Il enregistre le numéro de commande, le moment, l'adresse IP et l'agent utilisateur, sans adresse e-mail."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI4="Il redirige les liens des e-mails Joomla concernant les demandes d'export et de suppression créées par l'administration vers la page de confirmation du plugin de confidentialité. Ainsi, les clients sans compte utilisateur peuvent aussi confirmer. Le texte et la langue de l'e-mail restent ceux de Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_LI5="Sur la page de profil de la boutique, il charge le fichier de langue du plugin de confidentialité."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_WHAT_P2="Sous J2Store 4 (J2Commerce 4), un override de template du plugin de confidentialité affiche la case. Ce plugin n'y vérifie rien et n'enregistre aucun consentement."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Réglages"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="En dehors de cet onglet, ce plugin n'a pas de réglages propres. Il utilise les réglages du plugin « Privacy - J2Commerce Confidentialité » :"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="« Afficher case de consentement » et « Consentement requis » dans l'onglet « Consentement Checkout » règlent l'affichage et la vérification."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="« Article politique de confidentialité » et « Texte de consentement » définissent le lien et le texte à côté de la case."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="« Confirmation par les clients invités » dans l'onglet « Libre-service frontend » active ou désactive la redirection des liens e-mail."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_SETTINGS_NOTE1="Tant que le plugin « Privacy - J2Commerce Confidentialité » est désactivé, ce plugin ne fait rien."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, mise à jour et désactivation"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="L'installateur du plugin « Privacy - J2Commerce Confidentialité » installe ce plugin et l'active lors de la première installation. Une mise à jour conserve son état (activé ou désactivé). Il n'existe pas de mise à jour séparée."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="La désinstallation du plugin de confidentialité supprime aussi ce plugin. Les consentements enregistrés restent dans Joomla."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="Tant que ce plugin est désactivé, aucune case n'apparaît dans le checkout de J2Commerce 6, rien n'est vérifié et aucun consentement n'est enregistré. Les e-mails des demandes créées par l'administration gardent les liens de Joomla, que seules les personnes connectées peuvent ouvrir. Les consentements déjà enregistrés restent inchangés."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI4="Avant une mise à jour du plugin « Privacy - J2Commerce », effectuez une sauvegarde actuelle et complète de tout le site, que vous pouvez restaurer de manière indépendante. L'installateur ne conserve aucune copie de fichier et ne peut pas vérifier votre sauvegarde. La première tentative de mise à jour affiche cette recommandation et s'arrête avant de modifier des fichiers, puis vous relancez la mise à jour. Si l'installateur trouve un fichier modifié ou inconnu que la mise à jour remplacerait, il s'arrête avant de copier quoi que ce soit et indique le chemin et les empreintes. Vérifiez le fichier, résolvez-le à la main ou reportez la mise à jour, puis réessayez. Il n'existe ni commande d'approbation ni contournement."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_INSTALL_LI5="Le plugin n'a ni <code>access.xml</code> ni autorisations propres, ne crée ni table ni tâche planifiée et n'envoie aucun e-mail de lui-même. Les consentements qu'il enregistre restent dans les consentements de confidentialité de Joomla. Il ne les supprime jamais et ne prévoit aucune durée de conservation pour eux. Aucune donnée n'est envoyée à des services externes."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>La case manque :</strong> vérifiez que ce plugin et le plugin « Privacy - J2Commerce Confidentialité » sont activés, que « Afficher case de consentement » est sur « Oui », que J2Commerce 6.3.4 ou plus récent est installé et qu'un override de checkout personnel déclenche l'événement <code>AfterDisplayShippingPayment</code>."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>Le checkout refuse bien que la case soit cochée :</strong> le consentement vaut pour le panier courant. Après une modification du panier, p. ex. par une connexion dans un autre onglet, ou lorsque l'étape est affichée de nouveau, la personne doit cocher la case une nouvelle fois. Sans panier, un consentement requis est considéré comme non donné."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>Une commande n'a pas d'entrée de consentement :</strong> l'entrée n'est enregistrée que si J2Commerce a accepté la commande et que celle-ci provient du même panier. Les commandes refusées ou incomplètes, les commandes antérieures à l'installation et les commandes sous J2Store 4 n'en reçoivent pas. Si un prestataire de paiement ne fixe le statut que plus tard par un appel direct au serveur, l'entrée manque aussi. Le plugin ne crée jamais de consentements après coup."
PLG_SYSTEM_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>L'e-mail contient les liens de Joomla :</strong> vérifiez « Confirmation par les clients invités ». Seuls les e-mails des demandes créées par l'administration sont redirigés. Si vous avez modifié les modèles d'e-mail, ils doivent toujours contenir <code>{TOKENURL}</code> ou <code>{FORMURL}</code> et <code>{TOKEN}</code>."
