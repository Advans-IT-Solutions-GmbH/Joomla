; Page d'aide
COM_J2STORE_CLEANUP_HELP_TITLE="Nettoyage des extensions J2Store : aide"
COM_J2STORE_CLEANUP_HELP_LINK="Aide : fonctionnement de l'analyse et effets de la suppression"
COM_J2STORE_CLEANUP_HELP_INTRO="Cette page explique ce que le composant vérifie, comment il classe les extensions, ce que fait une suppression et ce qu'elle ne fait jamais, quelles autorisations sont nécessaires et que faire en cas de problème."
COM_J2STORE_CLEANUP_HELP_CONTENTS="Sommaire de l'aide"
COM_J2STORE_CLEANUP_HELP_BACK="Retour au nettoyage des extensions J2Store"
COM_J2STORE_CLEANUP_HELP_PURPOSE_TITLE="Ce que fait le composant"
COM_J2STORE_CLEANUP_HELP_PURPOSE_DESC="Le nettoyage des extensions J2Store accompagne le passage de J2Store à J2Commerce. Il liste les extensions du site qui appartiennent à J2Store ou à J2Commerce, analyse leurs fichiers PHP à la recherche d'interfaces de programmation (API) que la version de Joomla en service ne possède plus, et présente le résultat par groupes. Un utilisateur qui a les autorisations nécessaires peut désinstaller les extensions sélectionnées dans cette liste."
COM_J2STORE_CLEANUP_HELP_PURPOSE_NOT="Le composant ne migre aucune donnée et ne modifie lui-même ni produits, ni commandes, ni clients. Il n'a pas de tables de base de données propres ni de tâche planifiée. L'ouverture de la page ne fait que lire la liste des extensions et leurs fichiers."
COM_J2STORE_CLEANUP_HELP_WHEN_TITLE="Quand l'utiliser et quand ne pas l'utiliser"
COM_J2STORE_CLEANUP_HELP_WHEN_USE="Utilisez-le après la migration vers J2Commerce, et avant ou après une mise à jour de Joomla, pour trouver les extensions complémentaires qui utilisent des API supprimées ou dont les fichiers manquent sur le serveur."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT="Ne l'utilisez pas :"
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_PROOF="Comme preuve de compatibilité. Une analyse sans résultat ne montre pas qu'une extension fonctionne, et un résultat seul n'est pas une raison de supprimer une extension."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_NEEDED="Pour supprimer une extension dont le site a encore besoin. Cherchez d'abord une version mise à jour."
COM_J2STORE_CLEANUP_HELP_WHEN_NOT_BACKUP="Sans une sauvegarde récente des fichiers et de la base de données que vous pouvez restaurer."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER="Un ordre judicieux :"
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_1="Sauvegardez tout le site, fichiers et base de données."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_2="Migrez la boutique vers J2Commerce et testez-la : produits, commandes, passage en caisse et comptes clients."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_3="Ouvrez ce composant et examinez chaque résultat."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_4="Ne supprimez que les extensions dont le site n'a plus besoin ou dont les fichiers manquent."
COM_J2STORE_CLEANUP_HELP_WHEN_ORDER_5="Videz le cache de Joomla et testez de nouveau le site et la boutique."
COM_J2STORE_CLEANUP_HELP_REQ_TITLE="Prérequis et autorisations"
COM_J2STORE_CLEANUP_HELP_REQ_BACKUP="Faites une sauvegarde complète des fichiers et de la base de données avant de supprimer quoi que ce soit. Le composant ne fait aucune sauvegarde, ne vérifie aucune dépendance entre extensions et ne peut pas annuler une suppression."
COM_J2STORE_CLEANUP_HELP_REQ_VIEW="Pour ouvrir la page, voir l'analyse et lire cette aide, un utilisateur a besoin de « %1$s » sur ce composant. Le bouton « %2$s » de la barre d'outils et le lien sous le titre de la page ouvrent cette aide."
COM_J2STORE_CLEANUP_HELP_REQ_REMOVE="Pour supprimer des extensions, un utilisateur a besoin en plus de « %1$s » sur ce composant ainsi que de « %2$s » et de « %1$s » sur le gestionnaire des extensions de Joomla (Système → Gérer → Extensions). Le composant ne permet donc jamais à quiconque de désinstaller davantage que ce que Joomla autorise lui-même."
COM_J2STORE_CLEANUP_HELP_REQ_READONLY="Sans ces autorisations, la page est en lecture seule : elle n'affiche ni cases à cocher ni bouton « Supprimer les extensions sélectionnées », et une demande de suppression est refusée."
COM_J2STORE_CLEANUP_HELP_REQ_DEFAULT="Dans une installation standard de Joomla, le groupe Administrator n'a pas accès au gestionnaire des extensions. Les administrateurs voient donc l'analyse mais ne peuvent rien supprimer. Les Super Users le peuvent."
COM_J2STORE_CLEANUP_HELP_DETECT_TITLE="Quelles extensions sont listées"
COM_J2STORE_CLEANUP_HELP_DETECT_INTRO="La page liste ces extensions du site :"
COM_J2STORE_CLEANUP_HELP_DETECT_COMPONENTS="Les composants dont l'élément commence par <code>com_j2store_</code> ou <code>com_j2commerce_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_PLUGINS="Les plugins des groupes <code>j2store</code> et <code>j2commerce</code>, ainsi que les plugins dont l'élément est <code>j2store</code> ou <code>j2commerce</code> ou commence par <code>j2store_</code> ou <code>j2commerce_</code>, aussi avec le préfixe <code>plg_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_MODULES="Les modules dont l'élément est <code>mod_j2store</code> ou <code>mod_j2commerce</code> ou commence par <code>mod_j2store_</code> ou <code>mod_j2commerce_</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_TEMPLATES="Les templates et bibliothèques dont l'élément est <code>j2store</code> ou <code>j2commerce</code> ou commence par l'un d'eux suivi de <code>_</code> ou de <code>/</code>."
COM_J2STORE_CLEANUP_HELP_DETECT_CORE="Les composants de boutique J2Store (<code>com_j2store</code>) et J2Commerce (<code>com_j2commerce</code>) apparaissent comme « Cœur » et ne peuvent jamais être supprimés."
COM_J2STORE_CLEANUP_HELP_DETECT_NEVER="Ne sont jamais listés : ce composant lui-même, les extensions de type fichier et les paquets, les extensions que Joomla marque comme protégées ou verrouillées, et les entrées dont l'élément ne commence pas par une lettre minuscule ou un chiffre ou contient d'autres caractères que des lettres minuscules, des chiffres, le trait de soulignement, le point et le trait d'union."
COM_J2STORE_CLEANUP_HELP_SCAN_TITLE="Comment l'analyse classe les extensions"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER="Chaque extension listée reçoit un résultat, vérifié dans cet ordre :"
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_CORE="« Cœur » : le composant de boutique J2Store ou J2Commerce."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_NO_FILES="« Aucun fichier » : le dossier de l'extension n'existe pas sur le serveur. Pour un composant, les dossiers administrateur, site et API doivent tous manquer."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_COMPATIBLE="« Compatible » : l'analyse ne trouve aucune des API citées ci-dessous."
COM_J2STORE_CLEANUP_HELP_SCAN_ORDER_INCOMPATIBLE="« Incompatible » : l'analyse en trouve au moins une."
COM_J2STORE_CLEANUP_HELP_SCAN_FILES="L'analyse lit chaque fichier PHP des dossiers de l'extension, y compris tous les sous-dossiers. Elle retire d'abord les commentaires de la forme <code>/* … */</code> et <code>// …</code>, puis cherche les noms des API que la version de Joomla en service ne possède plus :"
COM_J2STORE_CLEANUP_HELP_SCAN_J4="Sous Joomla 5 et 6 : <code>JPlugin</code>, <code>JModel</code> et <code>JModelLegacy</code>, <code>JTable</code>, <code>JView</code> et <code>JViewLegacy</code>, <code>JController</code> et <code>JControllerLegacy</code>, <code>JForm</code> (supprimées dans Joomla 4)."
COM_J2STORE_CLEANUP_HELP_SCAN_J6="Sous Joomla 6 en plus : <code>JFactory</code>, <code>JText</code>, <code>JHtml</code>, <code>JRoute</code>, <code>JUri</code>, <code>JSession</code>, <code>Factory::getUser()</code>, <code>Factory::getDbo()</code>, <code>Factory::getSession()</code>, <code>Factory::getDocument()</code> et <code>$this-&gt;app</code> (supprimées dans Joomla 6)."
COM_J2STORE_CLEANUP_HELP_SCAN_DETAILS="Cliquez sur le texte de la colonne « Problèmes trouvés » pour voir les résultats, par exemple « JFactory (supprimée dans Joomla 6) ». Il n'existe actuellement aucune vérification des API propres à J2Store, les classes du framework F0F ne sont donc pas signalées."
COM_J2STORE_CLEANUP_HELP_SCAN_J5_NOTE="Sous Joomla 5, les API que Joomla 6 supprime fonctionnent encore grâce au plugin de compatibilité ascendante, l'analyse ne les signale donc pas. Une extension « Compatible » sous Joomla 5 peut être « Incompatible » sous Joomla 6."
COM_J2STORE_CLEANUP_HELP_SCAN_LIMITS="L'analyse ne compare que du texte. Un nom figurant dans une chaîne de caractères est aussi signalé, et le code placé dans d'autres fichiers que PHP n'est pas vérifié. Les numéros de version, l'auteur et l'état activé ou non de l'extension ne sont pas évalués."
COM_J2STORE_CLEANUP_HELP_RESULT_TITLE="Résultats sur la page"
COM_J2STORE_CLEANUP_HELP_RESULT_INCOMPATIBLE="« Extensions incompatibles (n) » : nom, type, élément, statut et résultats de l'analyse. Ces entrées peuvent être sélectionnées pour la suppression."
COM_J2STORE_CLEANUP_HELP_RESULT_NO_FILES="« Aucun fichier trouvé (n) » : entrées sans fichiers. Elles peuvent être sélectionnées, sauf les parties d'un paquet. Celles-ci affichent « Fait partie d'un paquet : désinstallez le paquet dans Système → Gérer → Extensions. » et n'ont pas de case à cocher."
COM_J2STORE_CLEANUP_HELP_RESULT_COMPATIBLE="« Extensions compatibles (n) » : les extensions compatibles et le composant de boutique. Elles ne peuvent pas être sélectionnées."
COM_J2STORE_CLEANUP_HELP_RESULT_ALL="Si rien n'est incompatible et qu'aucun fichier ne manque, la page affiche « Toutes les extensions sont compatibles. ». Si le site n'a aucune de ces extensions, pas même le composant de boutique, elle affiche « Aucune extension J2Store/J2Commerce trouvée. »."
COM_J2STORE_CLEANUP_HELP_REMOVE_TITLE="Ce que fait une suppression"
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_1="Cochez les cases des extensions à supprimer. La case de l'en-tête de colonne sélectionne toutes les entrées du tableau."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_2="Cliquez sur « Supprimer les extensions sélectionnées »."
COM_J2STORE_CLEANUP_HELP_REMOVE_STEP_3="Lisez la question et confirmez-la."
COM_J2STORE_CLEANUP_HELP_REMOVE_CHECK="Avant toute suppression, le serveur vérifie de nouveau toute la sélection. Si une entrée sélectionnée n'existe plus ou ne peut pas être supprimée, rien du tout n'est supprimé et le message d'erreur cite l'entrée."
COM_J2STORE_CLEANUP_HELP_REMOVE_INCOMPATIBLE="Une extension avec des fichiers est supprimée par le programme de désinstallation de Joomla, comme sous Système → Gérer → Extensions : sa routine de désinstallation s'exécute et Joomla supprime les fichiers et les entrées de base de données enregistrés pour elle. Ce qui est supprimé exactement dépend de l'extension."
COM_J2STORE_CLEANUP_HELP_REMOVE_NO_FILES="Pour une entrée sans fichiers, Joomla ne peut pas exécuter de désinstallation. Seule l'entrée dans la liste des extensions de Joomla est supprimée, et le message indique « (entrée de base de données supprimée, des fichiers peuvent subsister) ». Les autres traces de l'extension, par exemple ses tables de base de données, restent en place."
COM_J2STORE_CLEANUP_HELP_REMOVE_REFUSED="Si le programme de désinstallation de Joomla refuse, l'entrée reste et le message d'erreur indique « Joomla a refusé de désinstaller l'enregistrement d'extension n. ». Le composant ne force jamais une telle suppression."
COM_J2STORE_CLEANUP_HELP_REMOVE_EXCEPTION="Si la désinstallation s'arrête sur une erreur, le composant vérifie de nouveau les dossiers de l'extension. Seulement s'il ne reste aucun dossier, l'entrée est supprimée comme une entrée sans fichiers. Sinon l'entrée reste et l'erreur est affichée. Des tables de l'extension peuvent subsister dans les deux cas."
COM_J2STORE_CLEANUP_HELP_REMOVE_SEPARATE="Chaque extension sélectionnée est supprimée séparément. Si une suppression ultérieure échoue, les suppressions précédentes restent effectives."
COM_J2STORE_CLEANUP_HELP_REMOVE_MESSAGES="Ensuite, la page indique combien d'extensions ont été supprimées, combien seulement en partie (entrée supprimée, des fichiers peuvent subsister) et combien n'ont pas pu l'être, avec les détails."
COM_J2STORE_CLEANUP_HELP_NEVER_TITLE="Ce que le composant ne fait jamais"
COM_J2STORE_CLEANUP_HELP_NEVER_CORE="Il ne supprime jamais les composants de boutique J2Store et J2Commerce ni lui-même, même en cas de requête manipulée."
COM_J2STORE_CLEANUP_HELP_NEVER_PROTECTED="Il ne supprime jamais les extensions que Joomla marque comme protégées ou verrouillées, les extensions de type fichier, les paquets, les extensions hors de la liste ci-dessus, ni une extension affichée comme « Compatible »."
COM_J2STORE_CLEANUP_HELP_NEVER_PACKAGE="Il ne supprime jamais l'entrée d'une partie de paquet sans fichiers. Désinstallez plutôt le paquet."
COM_J2STORE_CLEANUP_HELP_NEVER_DATA="Il ne modifie lui-même ni produits, ni commandes, ni clients. La routine de désinstallation d'une extension supprimée peut toutefois effacer les tables et données de cette extension."
COM_J2STORE_CLEANUP_HELP_NEVER_EXTRA="Il ne fait aucune sauvegarde, ne vérifie aucune dépendance et ne migre aucune donnée."
COM_J2STORE_CLEANUP_HELP_UNDO_TITLE="Ce qui ne peut pas être annulé"
COM_J2STORE_CLEANUP_HELP_UNDO_DESC="Une suppression ne peut pas être annulée dans ce composant. Il n'y a ni retour en arrière ni corbeille."
COM_J2STORE_CLEANUP_HELP_UNDO_RESTORE="Pour récupérer une extension supprimée, restaurez votre sauvegarde ou installez de nouveau l'extension. Une nouvelle installation ne rétablit pas les données que la routine de désinstallation a effacées."
COM_J2STORE_CLEANUP_HELP_OPTIONS_TITLE="Options et autorisations"
COM_J2STORE_CLEANUP_HELP_OPTIONS_DESC="Le composant n'a pas de réglages propres. Le bouton « %1$s » de la barre d'outils n'ouvre que l'onglet « %2$s ». Le bouton apparaît pour les utilisateurs ayant « %3$s » ou « %4$s ». Modifier les autorisations exige « %3$s »."
COM_J2STORE_CLEANUP_HELP_OPTIONS_ADMIN="« %1$s » : modifier les autorisations de ce composant et ouvrir ses options."
COM_J2STORE_CLEANUP_HELP_OPTIONS_OPTIONS="« %1$s » : affiche le bouton Options."
COM_J2STORE_CLEANUP_HELP_OPTIONS_MANAGE="« %1$s » : ouvrir la page, voir l'analyse et lire cette aide, sans rien modifier."
COM_J2STORE_CLEANUP_HELP_OPTIONS_DELETE="« %1$s » : supprimer des extensions, avec les autorisations sur le gestionnaire des extensions de Joomla citées sous « Prérequis et autorisations »."
COM_J2STORE_CLEANUP_HELP_OPTIONS_INHERIT="Les autorisations Joomla sont héritées des groupes parents et de la configuration globale tant qu'elles ne sont pas définies ici. Un Refusé hérité ne peut pas être levé ici par un Autorisé."
COM_J2STORE_CLEANUP_HELP_OPTIONS_UPGRADE="L'installation et la mise à jour du composant n'accordent automatiquement ni « %1$s » ni « %2$s ». Les règles existantes restent inchangées."
COM_J2STORE_CLEANUP_HELP_TROUBLE_TITLE="Problèmes fréquents et solutions"
COM_J2STORE_CLEANUP_HELP_TROUBLE_DENIED="La page est refusée avec « %1$s » : il manque à l'utilisateur « %2$s » sur ce composant. Un membre du groupe Super Users peut l'accorder dans les options du composant, onglet « %3$s »."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NO_BUTTON="Ni cases à cocher ni bouton « Supprimer les extensions sélectionnées » : il manque l'une des autorisations de suppression citées sous « Prérequis et autorisations », ou aucune entrée listée ne peut être supprimée."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FLAGGED="Une extension dont vous avez besoin apparaît comme « Incompatible » : ne la supprimez pas. Ouvrez les résultats, comparez-les au code de l'extension et cherchez une version mise à jour. Une correspondance de texte peut être une fausse alerte."
COM_J2STORE_CLEANUP_HELP_TROUBLE_NOT_ELIGIBLE="« L'enregistrement d'extension n est protégé ou hors du périmètre de nettoyage autorisé. » ou « L'enregistrement d'extension n est introuvable. » : l'entrée a changé depuis le chargement de la page, par exemple elle a été supprimée dans un autre onglet ou n'a plus de résultat, ou la requête a été manipulée. Rechargez la page et sélectionnez de nouveau."
COM_J2STORE_CLEANUP_HELP_TROUBLE_REFUSED="« Joomla a refusé de désinstaller l'enregistrement d'extension n. » : le programme de désinstallation de Joomla a refusé la suppression. Vérifiez les autres messages de la page et essayez la désinstallation sous Système → Gérer → Extensions."
COM_J2STORE_CLEANUP_HELP_TROUBLE_PACKAGE="Une entrée sans fichiers affiche « Fait partie d'un paquet : … » et n'a pas de case à cocher : désinstallez le paquet sous Système → Gérer → Extensions."
COM_J2STORE_CLEANUP_HELP_TROUBLE_DB_ONLY="« … (entrée de base de données supprimée, des fichiers peuvent subsister) » : seule l'entrée a été supprimée. Retirez à la main, si nécessaire, les fichiers et tables restants de l'extension."
COM_J2STORE_CLEANUP_HELP_TROUBLE_FAILED="« Échec de la suppression de n extension(s) : … » : les détails citent l'extension et l'erreur. L'entrée reste. Les suppressions précédentes de la même sélection ne sont pas annulées."
COM_J2STORE_CLEANUP_HELP_TROUBLE_BROKEN="Le site affiche des erreurs après une suppression : une autre extension avait probablement besoin de celle qui a été supprimée. Restaurez votre sauvegarde ou installez de nouveau l'extension supprimée."
COM_J2STORE_CLEANUP_HELP_TROUBLE_J2COMMERCE="Des plugins ou modules J2Commerce sont listés ou signalés : c'est normal. La liste contient toute extension qui correspond aux noms ci-dessus, et le résultat dépend uniquement de l'analyse."
COM_J2STORE_CLEANUP_HELP_TROUBLE_MISSING="Une extension que vous connaissez ne figure pas dans la liste : son élément ne correspond pas aux noms ci-dessus, ou elle est déjà désinstallée. Vérifiez sous Système → Gérer → Extensions."
