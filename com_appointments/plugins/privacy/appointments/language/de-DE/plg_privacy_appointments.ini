PLG_PRIVACY_APPOINTMENTS="Datenschutz - Termine"
PLG_PRIVACY_APPOINTMENTS_XML_DESCRIPTION="Exportiert und entfernt Termindaten über die Joomla-Datenschutzanfragen."
PLG_PRIVACY_APPOINTMENTS_DOMAIN="Terminbuchungen und Antworten"
PLG_PRIVACY_APPOINTMENTS_ACCOUNT_MISMATCH="Das von Joomla gefundene Konto stimmt nicht mit der angefragten Adresse überein. Die Entfernung wird zum Schutz des anderen Kontos blockiert."
PLG_PRIVACY_APPOINTMENTS_LEGAL_BLOCK="Die Entfernung der Termindaten ist aus folgendem konfigurierten Rechtsgrund blockiert: %s"
PLG_PRIVACY_APPOINTMENTS_REMOVED="Entfernte Terminbuchungsdatensätze: %d."
PLG_PRIVACY_APPOINTMENTS_CLEANUP_FAILED="Buchungsdatensätze wurden bearbeitet, aber die Bereinigung von Kalenderkopien oder Konferenzen ist fehlgeschlagen. Beheben Sie das Speicher- oder Anbieterproblem und wiederholen Sie die native Entfernung: Verschlüsselte Betriebsreferenzen erhalten die ausstehende Bereinigung auch ohne Buchungsadresse. Der Abschluss bleibt blockiert; ein leerer Wiederholungsversuch oder eine Bestätigung beweist keine Löschung."
PLG_PRIVACY_APPOINTMENTS_CRM_PENDING="Buchungsdatensätze wurden bearbeitet, aber die Bereinigung der an Close übertragenen Buchungen steht noch aus. Prüfen Sie den Abschnitt «Buchungsübertragung an Close» in der Termine-Übersicht, lösen Sie dort blockierte oder unklare Übertragungen und wiederholen Sie die native Entfernung. Der Abschluss bleibt blockiert, bis die Bereinigung in Close bestätigt ist."
PLG_PRIVACY_APPOINTMENTS_DISABLED_REMAINDER="Internetkalender sind deaktiviert, aber Kalender- oder Personalschlüsseldaten bleiben vorhanden. Diese Datensätze wurden nicht durchsucht oder entfernt. Prüfen Sie sie mit tatsächlich berechtigtem Zugriff, bevor Sie die Anfrage abschliessen."
PLG_PRIVACY_APPOINTMENTS_INCOMPLETE="Die Terminlöschung ist unvollständig. Beheben Sie Warnungen zu Personalzugriffen, Kalenderkopien, Konferenzen, der Close-Bereinigung, unlesbaren Buchungen oder nicht durchsuchten Kalendern und versuchen Sie es vor dem Core-Abschluss erneut. Bereits erfolgte Löschungen werden nicht rückgängig gemacht."
PLG_PRIVACY_APPOINTMENTS_STAFF_SCOPE_FAILED="Der ursprüngliche Personalbezug oder dessen vollständige Bereinigung konnte nicht geprüft werden. Lassen Sie die Anfrage offen und prüfen Sie die gespeicherten Bereinigungsnachweise. Ersetzen Sie diese nicht durch einen Gasterfolg und setzen Sie kein Ergebniskennzeichen zurück."
PLG_PRIVACY_APPOINTMENTS_MAIL_FAILED="Die Buchungsdaten wurden entfernt, aber eine Stornierungsnachricht an den Gastgeber konnte nicht zugestellt werden."
PLG_PRIVACY_APPOINTMENTS_GUEST_DOMAIN="Termine, zu denen die Adresse als weiterer Gast eingeladen ist"
PLG_PRIVACY_APPOINTMENTS_GUEST_REMOVED="Gästeadressen aus Terminbuchungen entfernt: %d."
PLG_PRIVACY_APPOINTMENTS_BUSY="Für diese Anfrage läuft noch ein anderer Datenschutzvorgang. Laden Sie die Anfrage neu und versuchen Sie es in Kürze erneut."
PLG_PRIVACY_APPOINTMENTS_CHANGED="Die Anfrage hat sich während dieses Vorgangs geändert. Laden Sie die Anfrage neu und prüfen Sie ihren aktuellen Stand."
