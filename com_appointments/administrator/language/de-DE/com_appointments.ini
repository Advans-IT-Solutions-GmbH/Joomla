COM_APPOINTMENTS_TEAM_E_FEEDS_DEPRECATED="Die Abonnement-Feeds mit Token sind veraltet und werden in Version 2.0.0 entfernt. Wer eine Adresse kennt, liest die Buchungen ohne Anmeldung."
COM_APPOINTMENTS_TEAM_E_FEEDS_REPLACEMENT="Sie werden durch die Internetkalender abgelöst: Buchungen werden in den Zielkalender ihres Veranstaltungstyps geschrieben, und jede berechtigte Person abonniert mit dem eigenen Konto und einem App-Passwort pro Gerät. Die Option «Abonnement-Feeds mit Token» in den Optionen der Komponente schaltet die bisherigen Feeds ein oder aus."
