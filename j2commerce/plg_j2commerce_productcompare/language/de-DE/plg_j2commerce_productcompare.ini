; Post-Installation Message
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_TITLE="Produktvergleich: Installation abgeschlossen"
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_ENABLE="<strong>System → Verwalten → Plugins</strong> → nach <strong>J2Commerce - Produktvergleich</strong> suchen → aktivieren."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_UPDATED="J2Commerce - Produktvergleich wurde auf Version %s aktualisiert."
PLG_J2COMMERCE_PRODUCTCOMPARE_ENABLE_HINT="Das Plugin ist deaktiviert. Unter <strong>System → Verwalten → Plugins</strong> nach <strong>J2Commerce - Produktvergleich</strong> suchen und aktivieren."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_SEARCH="Plugin-Einstellungen nach Bedarf anpassen: wo die Vergleichsschaltfläche erscheint (Produktliste, Produktdetails), die maximale Anzahl zu vergleichender Produkte sowie Beschriftung und CSS-Klasse der Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_J2STORE_NOTE="J2Store 4: Die Vergleichsschaltfläche erscheint in Produktlisten nach der Warenkorb-Schaltfläche und am Ende der Produktseite. J2Store zeigt den Warenkorb-Bereich nur, wenn der Warenkorb angezeigt werden darf. Im Katalogmodus und für Gäste, wenn der Warenkorb registrierten Benutzern vorbehalten ist, fehlt die Vergleichsschaltfläche deshalb in Produktlisten. Dafür braucht es die J2Store-Produktlayouts, die diese Ereignisse auslösen (app_bootstrap3/4/5). Template-Overrides ohne diese Ereignis-Aufrufe zeigen keine Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_DOCS="Dokumentation: <strong>README.md</strong> im Plugin-Ordner · Support: <a href='https://advans.ch' style='color:#2563eb'>advans.ch</a>"

; Tab «Hilfe»
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe»."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_TAB="Hilfe"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_TITLE="Was das Plugin tut"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_P1="Das Plugin ergänzt die Produkte im Shop um eine Schaltfläche «Vergleichen». Besucher wählen damit mehrere Produkte aus und vergleichen sie in einem Fenster nebeneinander."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI1="Die Schaltfläche erscheint in Produktlisten und auf der Produktseite. Ein zweiter Klick nimmt das Produkt wieder aus dem Vergleich."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI2="Eine Leiste am unteren Rand der Seite zeigt die ausgewählten Produkte mit den Schaltflächen «Vergleich anzeigen» und «Alle entfernen»."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI3="Der Vergleich zeigt pro Produkt Artikelnummer, Preis, Lagerstatus (auf Lager oder nicht auf Lager) und die ersten 200 Zeichen des Einleitungstexts des Artikels. Er braucht mindestens zwei Produkte."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_LI4="Der Vergleich zeigt nur Produkte, die der Besucher auch im Shop sehen darf."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_WHAT_NOTE="Die Auswahl speichert der Browser des Besuchers (<code>localStorage</code>), nur die Produktnummern. Das Plugin legt keine Tabellen an und speichert keine Personendaten."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_TITLE="Voraussetzungen und Einrichtung"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP1="Joomla 5.4 mit J2Store 4 (Komponente <code>com_j2store</code>) oder Joomla 6 mit J2Commerce 6 (Komponente <code>com_j2commerce</code>). Die Shop-Komponente muss aktiviert sein."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP2="Aktivieren Sie das Plugin unter <strong>System → Verwalten → Plugins</strong> (Suche nach <strong>J2Commerce - Produktvergleich</strong>). Unter Joomla 5 führt die Pluginverwaltung es in der Gruppe <code>j2store</code>, weil J2Store 4 nur Plugins dieser Gruppe lädt."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP3="Passen Sie die Einstellungen im Tab «Plugin» an."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP4="Öffnen Sie auf der Website eine Produktliste und eine Produktseite und prüfen Sie, ob die Schaltfläche erscheint. J2Commerce 6 zeigt sie nach jedem Produkt einer Liste und am Ende der Produktseite. J2Store 4 zeigt sie in Listen nach dem Warenkorb-Bereich und am Ende der Produktseite."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_STEP5="Optional: Ändern Sie das Aussehen mit Template-Überschreibungen in <code>templates/IHR-TEMPLATE/html/plg_j2commerce_productcompare/</code>. Kopieren Sie dafür die gewünschte Datei aus dem Ordner <code>tmpl</code> des Plugins: <code>button.php</code> (Schaltfläche), <code>bar.php</code> (Leiste), <code>modal.php</code> (Fenster) oder <code>table.php</code> (Vergleichstabelle)."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETUP_NOTE="Die Schaltfläche erscheint nur dort, wo die Produktlayouts des Shops die Anzeige-Ereignisse des Shops aufrufen. Template-Überschreibungen der Produktlayouts ohne diese Aufrufe zeigen keine Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_TITLE="Einstellungen"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_P1="Die Einstellungen stehen im Tab «Plugin»."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI1="<strong>«In Produktliste anzeigen»</strong> (Standard «Ja»): Zeigt die Schaltfläche in Produktlisten. Stellen Sie «Nein» ein, wenn die Schaltfläche nur auf der Produktseite erscheinen soll."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI2="<strong>«In Produktdetails anzeigen»</strong> (Standard «Ja»): Zeigt die Schaltfläche auf der Produktseite. Stellen Sie «Nein» ein, wenn die Schaltfläche nur in Listen erscheinen soll."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI3="<strong>«Maximale Produkte»</strong> (Standard 4, erlaubt 2 bis 10): So viele Produkte kann ein Besucher gleichzeitig vergleichen. Wer mehr auswählt, erhält eine Meldung, und auch der Server liefert nie mehr. Wählen Sie eine kleinere Zahl, wenn die Tabelle für Ihr Layout zu breit wird."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI4="<strong>«Beschriftung der Schaltfläche»</strong> (Standard: der Sprachschlüssel <code>PLG_J2COMMERCE_PRODUCTCOMPARE_DEFAULT_BUTTON_TEXT</code>, angezeigt als «Vergleichen» in der Sprache des Besuchers): Beschriftung der Schaltfläche. Ein Sprachschlüssel wird übersetzt, ein eigener Text erscheint in allen Sprachen gleich."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_SETTINGS_LI5="<strong>«CSS-Klasse der Schaltfläche»</strong> (Standard <code>btn btn-secondary</code>): CSS-Klassen der Schaltfläche, z.B. <code>btn btn-primary</code> für eine auffälligere Schaltfläche. Die Klasse <code>j2store-compare-btn</code> setzt das Plugin immer, die Funktion braucht sie."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI1="<strong>Keine Schaltfläche zu sehen.</strong> Prüfen Sie, ob das Plugin aktiviert ist, ob «In Produktliste anzeigen» oder «In Produktdetails anzeigen» auf «Ja» steht und ob die Shop-Komponente aktiviert ist. Prüfen Sie Template-Überschreibungen der Produktlayouts. Leeren Sie danach den Cache von Joomla."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI2="<strong>J2Store 4: In Listen fehlt die Schaltfläche, auf der Produktseite nicht.</strong> J2Store zeigt den Warenkorb-Bereich in Listen nur, wenn der Warenkorb angezeigt werden darf. Im Katalogmodus oder wenn nur registrierte Kunden bestellen dürfen, sehen Gäste deshalb in Listen keine Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI3="<strong>Die Schaltfläche reagiert nicht oder die Leiste erscheint nicht.</strong> Stammen alle Schaltflächen einer Seite aus zwischengespeicherter Ausgabe, z.B. aus einem Modul mit Cache, lädt die Seite das Skript des Plugins nicht. Schalten Sie den Cache dieses Moduls aus. Prüfen Sie ausserdem die Konsole des Browsers auf Fehler."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI4="<strong>Die Auswahl geht verloren.</strong> Die Auswahl liegt im Browser, getrennt je Browser und Adresse der Website. Private Fenster und das Löschen der Website-Daten entfernen sie."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI5="<strong>Ein ausgewähltes Produkt fehlt im Vergleich.</strong> Der Vergleich zeigt nur Produkte, die aktiviert und sichtbar sind, deren Artikel veröffentlicht ist und in seinem Veröffentlichungszeitraum liegt und die der Besucher mit seinen Zugriffsebenen und seiner Sprache sehen darf. Dasselbe gilt für die Kategorie und ihre übergeordneten Kategorien."
PLG_J2COMMERCE_PRODUCTCOMPARE_HELP_PROBLEMS_LI6="<strong>«Der Vergleich konnte nicht erstellt werden.»</strong> Die Ursache steht im Joomla-Protokoll (Kategorie <code>plg_j2commerce_productcompare</code>), sofern die Protokoll-Einstellungen der Website diese Einträge speichern."
