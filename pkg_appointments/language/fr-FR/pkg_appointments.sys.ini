PKG_APPOINTMENTS="Paquet Rendez-vous"
PKG_APPOINTMENTS_XML_DESCRIPTION="Prise de rendez-vous auto-hébergée en une seule installation : le composant Rendez-vous, son module de tableau de bord d'administration et ses six plugins (tâches planifiées, demandes de confidentialité, consentement, calendriers Internet, origine des réservations et gestion des clés à la connexion). L'installation, la mise à jour et la suppression du paquet les gèrent ensemble. Installé sur le composant autonome d'une version antérieure, le paquet le reprend avec toutes ses données, tous ses réglages et ses états d'activation."
