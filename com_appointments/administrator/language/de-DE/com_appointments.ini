COM_APPOINTMENTS_TEAM_E_EVENTTYPE_CALENDAR_DESC="Buchungen dieses Veranstaltungstyps werden in diesen Kalender geschrieben, und seine belegten Zeiten sperren Zeitfenster. Angeboten werden nur Kalender, in die der Gastgeber schreiben darf."
COM_APPOINTMENTS_TEAM_E_RESTORE_REQUEST_FAILED="Die Terminart ist gespeichert. Die Kopien der künftigen Buchungen konnten aber nicht zum Neuschreiben im neuen Zielkalender vorgemerkt werden. Speichern Sie die Terminart später erneut mit geändertem Zielkalender, oder die Kopien folgen erst bei der nächsten Änderung jeder Buchung."
