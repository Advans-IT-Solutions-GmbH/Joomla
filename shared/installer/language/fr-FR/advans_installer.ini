ADVANS_CHECK_SERVER="Demandez à l’administration du serveur de corriger la configuration, puis relancez cette vérification."
ADVANS_CHECK_JOOMLA_UPDATE="Système → Mise à jour → Joomla : utilisez une version de Joomla prise en charge."
ADVANS_CHECK_DATABASE="Pilote de base de données"
ADVANS_CHECK_MYSQL="MySQL ou MariaDB est requis. Demandez à l’administration du serveur de vérifier le pilote."
ADVANS_CHECK_OPTIONAL_ARCHIVES="La prise en charge facultative de ce format d’archive est absente. Installez l’extension PHP sur le serveur si nécessaire."
ADVANS_CHECK_MANAGE="Système → Gestion → Extensions : installez ou activez l’extension requise."
ADVANS_CHECK_SHOP="Boutiques activées avec tables de commandes"
ADVANS_CHECK_PLUGIN="État du plugin"
ADVANS_CHECK_PLUGINS="Système → Gestion → Plugins : configurez et activez ce plugin uniquement lorsque ses prérequis sont satisfaits."
ADVANS_CHECK_SCHEDULER="Déclencheur du planificateur"
ADVANS_CHECK_SCHEDULER_PATH="Système → Gestion → Tâches planifiées : configurez les tâches requises, consultez leur historique et configurez un déclencheur fiable dans les options."
ADVANS_CHECK_MAIL="Courriels sortants"
ADVANS_CHECK_MAIL_UNVERIFIED="L’envoi est activé ; la livraison n’a pas été testée."
ADVANS_CHECK_MAIL_PATH="Système → Configuration → Configuration globale → Serveur → E-mail : vérifiez les paramètres et envoyez un courriel de test."
ADVANS_CHECK_FILES="Dossier de l’extension"
ADVANS_CHECK_WRITABLE="Existe et est accessible en écriture"
ADVANS_CHECK_NOT_WRITABLE="Absent ou non accessible en écriture"
ADVANS_CHECK_REPEAT="Ouvrir / relancer la vérification"
ADVANS_CHECK_REPEAT_PATH="À tout moment : composants sous Système → Configuration → Configuration globale → extension ; plugins sous Système → Gestion → Plugins → plugin ; modules d’administration sous Système → Gestion → Modules d’administration → module. Ouvrez l’onglet Vérification du système et rechargez pour actualiser."
ADVANS_CHECK_GUARD_ERROR="L’installation a été interrompue avant toute modification : les fichiers existants n’ont pas pu être contrôlés de manière sûre, par exemple parce qu’un fichier est illisible ou est un lien symbolique. Demandez à l’administration du serveur de vérifier les droits des fichiers, puis relancez l’installation."
ADVANS_CHECK_APPROVAL="L'installateur vérifie les fichiers existants avant une mise à jour. Le comportement en cas de conflit et pour les sauvegardes est décrit dans le README de l'extension."
ADVANS_CHECK_HTTPS="HTTPS"
ADVANS_CHECK_HTTPS_UNKNOWN="Une installation CLI ne permet pas de vérifier HTTPS."
ADVANS_CHECK_HTTPS_CURRENT="Cette requête d'administration utilise HTTPS ; les points d'accès publics ne sont pas vérifiés."
ADVANS_CHECK_HTTPS_INSECURE="Cette requête n'utilise pas HTTPS."
ADVANS_CHECK_HTTPS_PATH="Système → Configuration → Serveur → Forcer HTTPS : configurez HTTPS après vérification du certificat et du proxy par l'administration du serveur."
ADVANS_CHECK_ROUTING="Routage du serveur web"
ADVANS_CHECK_ROUTING_ABSENT="Aucun .htaccess trouvé à la racine ; la configuration de routage active n'est pas vérifiée."
ADVANS_CHECK_ROUTING_UNREADABLE="Le .htaccess à la racine est illisible ; le routage n'est pas vérifié."
ADVANS_CHECK_ROUTING_UNVERIFIED="Aucun motif de blocage connu trouvé dans .htaccess ; le routage HTTP réel n'est pas vérifié."
ADVANS_CHECK_ROUTING_BLOCKED="Le .htaccess à la racine contient une redirection ou une interdiction pouvant bloquer les requêtes component ou option."
ADVANS_CHECK_ROUTING_PATH="Système → Configuration → Site → SEO : vérifiez la réécriture d'URL. L'administration du serveur doit examiner .htaccess ou les règles équivalentes et tester les URL de l'extension ; ce contrôle n'envoie aucune requête HTTP et ne modifie jamais ces fichiers."
ADVANS_GUARD_BACKUP_RECOMMENDATION_TITLE="Avant la mise à jour"
ADVANS_GUARD_BACKUP_RECOMMENDATION_BODY="Avant toute modification du site, effectuez une sauvegarde complète et récente, puis assurez-vous qu’elle peut être restaurée indépendamment. L’installateur ne peut vérifier ni l’existence ni la restaurabilité d’une sauvegarde."
ADVANS_GUARD_BACKUP_RECOMMENDATION_RETRY="Cette première tentative s’est arrêtée avant toute modification de fichier. Après avoir lu cet avis et effectué la sauvegarde, relancez la même mise à jour pour continuer."
ADVANS_GUARD_PAUSED_TITLE="L’installation a été suspendue. Rien n’a été modifié."
ADVANS_GUARD_PAUSED_WHY="Le fichier actuel diffère du paquet et n’est pas reconnu comme une version inchangée de cette extension. L’installateur ne peut pas le remplacer ou le supprimer sans risque :"
ADVANS_GUARD_PAUSED_REASON="contient des données locales ou d’origine inconnue"
ADVANS_GUARD_PAUSED_EXISTING="SHA-256 actuel"
ADVANS_GUARD_PAUSED_INCOMING="SHA-256 du paquet"
ADVANS_GUARD_PAUSED_NEXT_STEPS="Examinez chaque différence, résolvez ou fusionnez volontairement les changements locaux, puis relancez la mise à jour. Une nouvelle tentative n’approuve ni ne contourne ce contrôle."
ADVANS_GUARD_LOCKED="L’installation d’une autre extension est en cours. Rien n’a été modifié ; attendez sa fin, puis réessayez."
ADVANS_CHECK_TASK="Tâche planifiée « %s »"
ADVANS_CHECK_TASK_RAN="Activée, dernière exécution le %s (UTC)."
ADVANS_CHECK_TASK_NOT_RUN="Activée, pas encore exécutée."
ADVANS_CHECK_TASK_NOT_RUN_PATH="Requise. Elle s’exécute à sa prochaine heure prévue. Si elle ne s’est toujours pas exécutée ensuite, le planificateur n’est pas démarré : voir « Déclencheur du planificateur »."
ADVANS_CHECK_TASK_FAILED="Activée, la dernière exécution le %s (UTC) a échoué."
ADVANS_CHECK_TASK_FAILED_PATH="Système → Gestion → Tâches planifiées : le journal de cette tâche indique la raison."
ADVANS_CHECK_TASK_MISSING="Absente (requise)."
ADVANS_CHECK_TASK_MISSING_PATH="Installez ou mettez à jour cette extension à nouveau : l’installation crée la tâche elle-même. Ou créez-la sous Système → Gestion → Tâches planifiées → Nouveau → « %s » et activez-la."
ADVANS_CHECK_TASK_OFF="Désactivée ou dans la corbeille (requise)."
ADVANS_CHECK_TASK_OFF_PATH="Système → Gestion → Tâches planifiées : sélectionnez « %s » et cliquez sur Activer. Une tâche dans la corbeille apparaît lorsque le filtre d’état est réglé sur la corbeille. L’installation ne l’active jamais elle-même, car quelqu’un l’a désactivée volontairement."
ADVANS_CHECK_TASK_PLUGIN_OFF="Le plugin de tâche qui l’exécute est désactivé ou absent (requis)."
ADVANS_CHECK_TASK_PLUGIN_PATH="Système → Gestion → Plugins : filtrez sur le type « task » et activez le plugin de cette extension. S’il est absent, installez cette extension à nouveau."
ADVANS_CHECK_TASK_OPTIONAL_ON="Facultative, activée."
ADVANS_CHECK_TASK_OPTIONAL_OFF="Facultative, désactivée."
ADVANS_CHECK_TASK_OPTIONAL_MISSING="Facultative, non créée."
ADVANS_TASKS_CREATED="La tâche planifiée requise « %1$s » manquait. L’installation l’a créée et activée : elle s’exécute %2$s. %3$s Vous pouvez la vérifier sous Système → Gestion → Tâches planifiées."
ADVANS_TASKS_SWITCHED_OFF="La tâche planifiée requise « %1$s » est désactivée ou dans la corbeille. %2$s Tant qu’elle est désactivée, cela n’a pas lieu. L’installation la laisse telle quelle, car quelqu’un l’a désactivée volontairement. Pour l’activer : Système → Gestion → Tâches planifiées, sélectionnez « %1$s » et cliquez sur Activer (une tâche dans la corbeille apparaît lorsque le filtre d’état est réglé sur la corbeille)."
ADVANS_TASKS_CREATE_FAILED="La tâche planifiée requise « %1$s » manque et n’a pas pu être créée. %2$s Créez-la sous Système → Gestion → Tâches planifiées → Nouveau → « %1$s » et activez-la."
ADVANS_TASKS_PLUGIN_MISSING="La tâche planifiée requise « %1$s » ne peut pas être créée, car son plugin de tâche n’est pas installé. %2$s Installez cette extension à nouveau."
ADVANS_TASKS_PLUGIN_DISABLED="Le plugin de tâche qui exécute « %s » est désactivé, la tâche ne s’exécute donc pas. Activez-le sous Système → Gestion → Plugins (filtrez sur le type « task »)."
ADVANS_TASKS_CHECK_FAILED="Les tâches planifiées de cette extension n’ont pas pu être vérifiées. Ouvrez Système → Gestion → Tâches planifiées et vérifiez que les tâches indiquées comme requises sur la page d’aide de cette extension existent et sont activées."
ADVANS_TASKS_EVERY_MINUTES="toutes les %d minutes"
ADVANS_TASKS_EVERY_HOUR="toutes les heures"
ADVANS_TASKS_EVERY_HOURS="toutes les %d heures"
ADVANS_TASKS_DAILY="une fois par jour"
ADVANS_TASKS_DAILY_AT="chaque jour à %s UTC"
ADVANS_TASKS_TRIGGER_RAN="Des tâches planifiées de cette extension se sont exécutées, la dernière fois le %s (UTC)."
ADVANS_TASKS_TRIGGER_LAZY="Les tâches planifiées sont démarrées par les visites du site (Lazy Scheduler). Sur un site peu visité, elles s’exécutent en retard ; une tâche cron sur le serveur est plus fiable."
ADVANS_TASKS_TRIGGER_WEBCRON="Web Cron est activé. Il n’est pas possible de vérifier ici si un service externe l’appelle régulièrement."
ADVANS_TASKS_TRIGGER_RUNNER_OFF="Le plugin système qui démarre les tâches planifiées (« schedulerunner ») est désactivé. Les tâches planifiées ne s’exécutent alors que si le serveur les démarre avec une tâche cron (php cli/joomla.php scheduler:run). Sans une telle tâche cron, activez ce plugin sous Système → Gestion → Plugins."
ADVANS_TASKS_TRIGGER_CLI_ONLY="Ni le Lazy Scheduler ni Web Cron n’est activé (Système → Gestion → Tâches planifiées → Options). Les tâches planifiées ne s’exécutent alors que si le serveur les démarre avec une tâche cron (php cli/joomla.php scheduler:run). Sans une telle tâche cron, activez-y le Lazy Scheduler."
ADVANS_TASKS_TRIGGER_OFF="Le composant Joomla Tâches planifiées est désactivé, aucune tâche planifiée ne s’exécute donc. Activez-le sous Système → Gestion → Extensions."
ADVANS_TASK_PURPOSE_PRIVACY_CLEANUP="Elle anonymise les commandes de la boutique et supprime les adresses enregistrées dès que le délai légal de conservation est écoulé, comme l’exige la protection des données."
ADVANS_TASK_SETTINGS_PRIVACY_CLEANUP="Délai de conservation : %1$s ans après la fin de l’exercice le %2$s (mois-jour), comme réglé dans le plugin de protection des données ; vous pouvez le modifier dans la tâche."
ADVANS_TASK_PURPOSE_APPOINTMENTS_REMINDERS="Elle envoie les rappels de rendez-vous aux moments réglés dans les options de Rendez-vous."
ADVANS_TASK_PURPOSE_APPOINTMENTS_RETENTION="Elle anonymise les réservations terminées après le délai de conservation réglé dans les options de Rendez-vous, comme l’exige la protection des données."
ADVANS_TASK_PURPOSE_APPOINTMENTS_CLOSE="Elle transfère les réservations autorisées vers Close. Elle n’est nécessaire qu’une fois le transfert vers Close configuré."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMCLEANUP="Elle retire les appareils bloqués des calendriers Internet et les compteurs de connexion expirés."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMLOG="Elle supprime les entrées du journal des calendriers Internet après leur délai de conservation."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMINVITATIONS="Elle clôt les invitations expirées aux calendriers Internet."
ADVANS_TASK_PURPOSE_APPOINTMENTS_TEAMRETENTION="Elle supprime les copies de réservations dans les calendriers Internet après le délai de conservation de chaque calendrier."
ADVANS_TASK_PURPOSE_DMARC_INGEST="Elle importe les rapports DMARC et TLS des boîtes aux lettres configurées dans DMARC Reports. Sans boîte aux lettres, elle ne fait rien."
