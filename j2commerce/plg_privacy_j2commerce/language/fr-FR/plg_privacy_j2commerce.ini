PLG_PRIVACY_J2COMMERCE_MYPROFILE_GUEST_REQUEST_DESC="Le formulaire de demande en ligne nécessite un compte utilisateur. En tant que client invité, envoyez votre demande de copie ou de suppression de vos données par e-mail."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_MISSING="Le plugin système inclus (Système - J2Commerce Consentement de confidentialité) est introuvable dans le paquet d'installation. Le consentement au checkout n'est ni vérifié ni enregistré."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_INSTALL_FAILED="Le plugin système inclus (Système - J2Commerce Consentement de confidentialité) n'a pas pu être installé automatiquement. Le consentement au checkout n'est vérifié et enregistré qu'après son installation."
PLG_PRIVACY_J2COMMERCE_LEGACY_CONSENTS_ANONYMIZED="%d enregistrement(s) de consentement d'une version antérieure du template du site ont été anonymisés (adresse e-mail, adresse IP et agent utilisateur supprimés). Ils ne comptent plus comme consentement."
PLG_PRIVACY_J2COMMERCE_WARN_LEGACY_CONSENTS_FAILED="Les enregistrements de consentement d'une version antérieure du template du site n'ont pas pu être anonymisés : %s. La tâche de nettoyage réessaiera."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_OUTDATED="Ces substitutions du checkout J2Commerce 6 ne déclenchent pas l'événement J2Commerce AfterDisplayShippingPayment et n'affichent pas la case de consentement : %s. Si le consentement est obligatoire, le checkout ne peut pas être finalisé avec elles. Ajoutez l'appel de l'événement AfterDisplayShippingPayment du template J2Commerce (components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php) avant le bouton Continuer."
PLG_PRIVACY_J2COMMERCE_WARN_J2STORE_CHECKOUT_OVERRIDE_OUTDATED="Dans ces substitutions du checkout J2Store 4 déployées par une version antérieure de ce plugin, au moins un élément nécessaire à l'envoi de l'étape est absent : %s. Sont requis le jeton de formulaire Joomla, les trois champs masqués task, option et view, ainsi que le bouton Continuer en type=\"button\" avec l'identifiant button-payment-method, qui doit porter l'attribut disabled dès que $_showConsent et $_consentRequired sont tous deux vrais, afin qu'un consentement requis ne puisse pas être contourné tant que le validateur n'est pas chargé. J2Store 4.1.8 refuse l'étape shipping_payment_method_validate sans jeton avec « Invalid Token ». Une mise à jour ne remplace pas ces copies. Remplacez-les par overrides/com_j2store/checkout/default_shipping_payment.php de ce paquet."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_BUNDLED="Ces substitutions du checkout J2Commerce 6 proviennent d'une version antérieure de ce plugin et n'ont pas été modifiées par cette mise à jour, car elles diffèrent de la version livrée ou n'ont pas pu être renommées : %s. Elles remplacent les templates J2Commerce (bootstrap5 et uikit) et il leur manque des fonctions plus récentes, comme les champs personnalisés de l'étape de paiement et les descriptions des modes de paiement. Comparez-les avec components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php et supprimez-les si elles ne contiennent aucune modification de votre part."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_TOO_OLD="J2Commerce %1$s est installé. La case de consentement est affichée par l'événement J2Commerce AfterDisplayShippingPayment, que les templates de checkout J2Commerce déclenchent à partir de la version %2$s. Mettez J2Commerce à jour ; d'ici là, la case manque et, si le consentement est obligatoire, le checkout ne peut pas être finalisé."
PLG_PRIVACY_J2COMMERCE_CHECKOUT_OVERRIDE_RETIRED="Les substitutions du checkout J2Commerce 6 non modifiées, copiées par une version antérieure de ce plugin, ont été désactivées (renommées avec le suffixe %2$s) : %1$s. L'étape du checkout provient maintenant du template J2Commerce, y compris la case de consentement. Supprimez les fichiers renommés dès que le checkout fonctionne."

; Guest privacy requests
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_LABEL="Confirmation par les clients invités"
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_DESC="Les clients sans compte utilisateur (commandes d'invités) confirment une demande de confidentialité créée par un administrateur sous Utilisateurs → Confidentialité → Demandes sur une page de ce plugin, avec leur adresse e-mail et le code de l'e-mail de demande. Les liens de cet e-mail mènent à cette page. Les commandes d'invités sont dans tous les cas attribuées à une demande par son adresse e-mail."
PLG_PRIVACY_J2COMMERCE_CONFIRM_TITLE="Confirmer la demande de confidentialité"
PLG_PRIVACY_J2COMMERCE_CONFIRM_INTRO="Saisissez l'adresse e-mail pour laquelle la demande a été créée ainsi que le code de confirmation reçu par e-mail. Le code est valable 24 heures."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EMAIL_LABEL="Adresse e-mail"
PLG_PRIVACY_J2COMMERCE_CONFIRM_TOKEN_LABEL="Code de confirmation"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUBMIT="Confirmer la demande"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUCCESS="Merci. Votre demande est confirmée et va maintenant être traitée."
PLG_PRIVACY_J2COMMERCE_CONFIRM_FAILED="La demande n'a pas pu être confirmée. Vérifiez l'adresse e-mail et le code de confirmation. Si le problème persiste, contactez-nous."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EXPIRED="Le code de confirmation a expiré et la demande a été annulée. Veuillez nous contacter afin que nous créions une nouvelle demande."
PLG_PRIVACY_J2COMMERCE_CONFIRM_UNAVAILABLE="Les demandes de confidentialité ne peuvent pas être confirmées sur cette page. Veuillez nous contacter."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST="Votre demande de suppression de données a été traitée. Vos adresses enregistrées et un éventuel abonnement à la newsletter ont été supprimés. Les données de commande sont soumises à une obligation légale de conservation et sont conservées jusqu'à la date indiquée. Elles sont ensuite anonymisées. Pour les commandes avec licence à vie, l'adresse e-mail de la commande est conservée afin de pouvoir réactiver la licence."
PLG_PRIVACY_J2COMMERCE_ADMIN_NOTIFICATION_GUEST_DATA_DELETION="Le client invité %s (sans compte utilisateur) a demandé la suppression des données."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST_ADDRESSES_KEPT="Votre demande de suppression de données a été traitée. Un éventuel abonnement à la newsletter a été supprimé. Les adresses enregistrées ne sont pas supprimées selon les paramètres de cette boutique. Contactez-nous si vous souhaitez leur suppression. Les données de commande sont soumises à une obligation légale de conservation et sont conservées jusqu'à la date indiquée. Elles sont ensuite anonymisées. Pour les commandes avec licence à vie, l'adresse e-mail de la commande est conservée afin de pouvoir réactiver la licence."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_ADDRESSES_KEPT="Votre demande de suppression de données a été traitée. Vos paniers et données de newsletter ont été supprimés et votre compte client a été anonymisé. Les adresses enregistrées ne sont pas supprimées selon les paramètres de cette boutique. Contactez-nous si vous souhaitez leur suppression. Les données de commande sont soumises à une obligation légale de conservation et sont conservées jusqu'à la date indiquée. Elles sont ensuite anonymisées. Pour les commandes avec licence à vie, l'adresse e-mail de la commande est conservée afin de pouvoir réactiver la licence."
PLG_PRIVACY_J2COMMERCE_REMOVAL_ACCOUNT_MISMATCH="J2Commerce : Joomla a trouvé le compte utilisateur %1$s pour l'adresse de la demande %2$s. Ce sont des adresses différentes (Joomla compare les adresses e-mail sans accents ni formes spéciales de lettres). La demande a été refusée afin que les données de ce compte restent intactes. Vérifiez l'adresse de la demande."
PLG_PRIVACY_J2COMMERCE_EXPORT_ACCOUNT_MISMATCH="J2Commerce : Joomla a trouvé le compte utilisateur %1$s pour l'adresse de la demande %2$s. Ce sont des adresses différentes. Les données J2Commerce de ce compte ne font pas partie de cet export, mais Joomla ajoute les données du compte lui-même. N'envoyez pas cet export. Vérifiez l'adresse de la demande."
PLG_PRIVACY_J2COMMERCE_WARN_ATTEMPTS_TABLE_FAILED="La table des tentatives de confirmation (#__privacy_j2commerce_attempts) n'a pas pu être créée : %s. Tant qu'elle n'existe pas, la page de confirmation des demandes de confidentialité ne confirme rien. Installez à nouveau le paquet."

; MyProfile privacy tab of site template overrides (tests/language-keys-for-template-overrides.txt)
PLG_PRIVACY_J2COMMERCE_MYPROFILE_DATA_WE_STORE="Données enregistrées"
PLG_PRIVACY_J2COMMERCE_MYPROFILE_DATA_LIST="Nous enregistrons les données suivantes vous concernant : informations de compte (nom, adresse e-mail, nom d'utilisateur, date d'inscription), adresses de facturation et de livraison, commandes et historique des commandes, consentements de confidentialité (date et heure, adresse IP, identification du navigateur), journaux de connexion et d'activité (date et heure, adresse IP) ainsi qu'un éventuel abonnement à la newsletter."
PLG_PRIVACY_J2COMMERCE_RETENTION_NOTICE_TITLE="Remarque sur la conservation des données"
PLG_PRIVACY_J2COMMERCE_RETENTION_NOTICE_DYNAMIC="Conformément aux exigences légales, les données de commande, y compris les adresses, doivent être conservées pendant %d ans à compter de la fin de l'exercice de la commande à des fins comptables. Les commandes couvertes par ce délai de conservation ne peuvent être ni supprimées ni anonymisées. À l'expiration du délai, elles sont anonymisées sur votre demande de suppression ou par le nettoyage régulier, si la boutique l'a mis en place. Pour les commandes avec licence à vie, l'adresse e-mail de la commande est conservée afin de pouvoir réactiver la licence."
PLG_PRIVACY_J2COMMERCE_PAYMENT_PROVIDER_TITLE="Données de paiement"
PLG_PRIVACY_J2COMMERCE_PAYMENT_PROVIDER_NOTICE="Les données de paiement (données de carte de crédit et coordonnées bancaires) sont enregistrées et traitées par les prestataires de paiement (par ex. Stripe, PayPal), pas par nous. Nous n'avons pas accès à vos données de paiement complètes. Pour toute question concernant vos données de paiement, veuillez vous adresser directement au prestataire de paiement concerné."
