PLG_TASK_APPOINTMENTS="Tâche - Rendez-vous"
PLG_TASK_APPOINTMENTS_XML_DESCRIPTION="Envoie les rappels et applique la conservation des réservations, du journal et des compteurs de requêtes."
PLG_TASK_APPOINTMENTS_REMINDERS_TITLE="Rendez-vous : rappels"
PLG_TASK_APPOINTMENTS_REMINDERS_DESC="Envoie les rappels avec calendrier des rendez-vous confirmés. Configurez les délais dans les options du composant."
PLG_TASK_APPOINTMENTS_RETENTION_TITLE="Rendez-vous : conservation"
PLG_TASK_APPOINTMENTS_RETENTION_DESC="Efface les données expirées et supprime les lignes expirées du journal et des compteurs. Configurez la conservation dans les options et les types de rendez-vous."
PLG_TASK_APPOINTMENTS_BATCH_SIZE="Taille du lot"
PLG_TASK_APPOINTMENTS_BATCH_SIZE_DESC="Nombre maximal de réservations candidates, de lignes du journal et de fenêtres de compteurs par exécution (1–1000). Relancez pour traiter le lot suivant."
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_TITLE="Rendez-vous : nettoyage des calendriers Internet"
PLG_TASK_APPOINTMENTS_TEAMCLEANUP_DESC="Fait passer les appareils bloqués à la phase de nettoyage suivante lorsqu’une phase est échue et supprime les compteurs d’échecs de connexion de plus de 24 heures. Sans effet tant que les calendriers Internet sont désactivés."
PLG_TASK_APPOINTMENTS_TEAMLOG_TITLE="Rendez-vous : journal des calendriers Internet"
PLG_TASK_APPOINTMENTS_TEAMLOG_DESC="Supprime les entrées du journal des calendriers Internet de plus de douze mois. La chaîne restante reste vérifiable. Sans effet tant que les calendriers Internet sont désactivés."
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_TITLE="Rendez-vous : invitations expirées"
PLG_TASK_APPOINTMENTS_TEAMINVITATIONS_DESC="Clôture les invitations expirées d’utilisateurs externes et efface leurs adresses. Sans effet tant que les calendriers Internet sont désactivés."
PLG_TASK_APPOINTMENTS_TEAMRETENTION_TITLE="Rendez-vous : conservation des calendriers Internet"
PLG_TASK_APPOINTMENTS_TEAMRETENTION_DESC="La suppression d'objets de calendrier par âge exige des calendriers Internet actifs ; 0 la désactive. Retire aussi les copies de réservations annulées, anonymisées, supprimées ou orphelines (toutes les copies si les calendriers Internet sont désactivés), relance les nettoyages de copies ayant échoué après un retrait d'invité par lien et reprend le chiffrement des anciennes lignes de réservation. N'efface ni réservations ni traces d'effacement."
PLG_TASK_APPOINTMENTS_CLOSE_TITLE="Rendez-vous : transférer les réservations autorisées vers Close"
PLG_TASK_APPOINTMENTS_CLOSE_DESC="Transfert CRM direct facultatif. Désactivé jusqu'à la configuration et l'activation ; aucun calendrier cloud, aucune recréation de réservation ni répétition d'e-mail. Les créations incertaines nécessitent un rapprochement par l'opérateur."
