PLG_TASK_J2COMMERCEPRIVACY="Tâche - Nettoyage confidentialité J2Commerce"
PLG_TASK_J2COMMERCEPRIVACY_XML_DESCRIPTION="Anonymisation planifiée des données client J2Commerce expirées."
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_TITLE="J2Commerce - Suppression automatique des données"
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_DESC="Anonymise automatiquement les données client J2Commerce après expiration de la période de conservation configurée."
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_LABEL="Période de conservation (années)"
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_DESC="Délai de conservation en années à compter de la fin de l'exercice de la commande. Les données de commande des utilisateurs enregistrés sont anonymisées lorsque leur commande la plus récente est hors délai. Les commandes invité sont anonymisées une à une dès que leur délai a expiré."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_LABEL="Fin de l'exercice (MM-JJ)"
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_INVALID="Fin de l'exercice : saisissez un jour existant au format MM-JJ, p. ex. 12-31 ou 06-30."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_DESC="Dernier jour de l'exercice au format MM-JJ, p. ex. 12-31. La durée de conservation d'une commande commence à la fin de son exercice (CO art. 958f), déterminé dans le fuseau horaire du site. 02-29 signifie le dernier jour de février."
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_LABEL="Anonymiser les commandes"
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_DESC="Anonymiser les notes de commande, adresses IP, e-mails et données de facturation/livraison."
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_LABEL="Supprimer les adresses"
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_DESC="Supprimer les adresses J2Commerce enregistrées des utilisateurs dont la période de conservation a expiré."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_TASK_J2COMMERCEPRIVACY_HELP_NOTE="L'onglet « Aide » explique ce que fait ce plugin, comment le configurer et que faire en cas de problème. Le plugin est installé et mis à jour avec le plugin « Privacy - J2Commerce Confidentialité », dont l'onglet « Aide » explique l'ensemble de la fonction."
PLG_TASK_J2COMMERCEPRIVACY_HELP_TAB="Aide"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="Ce que fait ce plugin"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P1="Ce plugin fournit le type de tâche « J2Commerce - Suppression automatique des données » dans les tâches planifiées de Joomla. La tâche anonymise les données de boutique dont le délai de conservation est écoulé, même sans demande de confidentialité. À chaque exécution, voici ce qui se passe dans toutes les tables de boutique existantes (J2Commerce 6 et J2Store 4) :"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI1="Clients enregistrés dont la commande la plus récente est hors du délai : toutes leurs commandes sont anonymisées (avec « Anonymiser les commandes » sur « Oui ») et leurs adresses enregistrées sont supprimées (avec « Supprimer les adresses » sur « Oui »)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI2="Les commandes d'invités hors du délai sont anonymisées une par une, tant qu'elles contiennent encore des données personnelles (avec « Anonymiser les commandes » sur « Oui »)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI3="Les commandes contenant un produit marqué comme licence à vie conservent leur adresse e-mail. Si la tâche ne peut pas lire le marquage, elle conserve l'adresse e-mail de toutes les commandes concernées."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI4="Les consentements du checkout et les consentements à la newsletter donnés au checkout perdent l'adresse IP et l'agent utilisateur lorsque leur commande est anonymisée ou supprimée ou que l'entrée est hors du délai. L'entrée elle-même reste comme preuve. Les consentements à la newsletter donnés au checkout dont la commande ne porte plus ni adresse ni compte utilisateur (anonymisée ou supprimée) deviennent aussi invalides, car personne ne peut plus leur être attribué."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI5="Les entrées de consentement d'une version antérieure du template sont anonymisées et marquées comme invalides."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI6="Les compteurs expirés de la page de confirmation pour les demandes d'invités sont supprimés."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI7="Les contacts AcyMailing créés par la pseudonymisation d'un compte utilisateur par Joomla (adresse <code>UserID…removed@email.invalid</code>) sont supprimés, uniquement si le compte est pseudonymisé, que le contact porte exactement son adresse de remplacement et qu'il n'a aucune entrée de liste."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P2="L'anonymisation fonctionne comme pour une demande de suppression : adresse e-mail, noms, adresses, numéros de téléphone et de fax, entreprise, numéro fiscal, note de commande et adresse IP. Le numéro de commande, la date, les montants et les produits restent. La tâche ne modifie ni les comptes utilisateur, ni les paniers, ni les adresses d'invités, ni les abonnés à la newsletter, à l'exception des contacts de remplacement AcyMailing ci-dessus. Une demande de suppression est nécessaire pour cela."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Réglages de la tâche"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="En dehors de cet onglet, ce plugin n'a pas de réglages propres. Vous réglez les valeurs dans la tâche sous « Système → Gérer → Tâches planifiées ». Elles ne valent que pour cette tâche. La tâche ne reprend pas les réglages du plugin « Privacy - J2Commerce Confidentialité », saisissez donc les mêmes valeurs."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="« Période de conservation (années) » (par défaut : 10, obligatoire, de 1 à 30) : délai en années à compter de la fin de l'exercice de la commande."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="« Fin de l'exercice (MM-JJ) » (par défaut : 12-31) : dernier jour de l'exercice. 02-29 signifie le dernier jour de février. La tâche remplace une valeur enregistrée invalide par 12-31 et l'inscrit dans le journal."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="« Anonymiser les commandes » (par défaut : Oui) : avec « Non », la tâche n'anonymise aucune commande, pas même les commandes d'invités. Les consentements hors du délai perdent tout de même l'adresse IP et l'agent utilisateur."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI4="« Supprimer les adresses » (par défaut : Oui) : supprime les adresses enregistrées des clients enregistrés dont la commande la plus récente est hors du délai. Avec « Non », elles sont conservées."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P2="Le délai d'une commande se termine à la fin de son exercice plus les années réglées, à 23:59:59 dans le fuseau horaire du site. Exemple avec 10 ans et 12-31 : une commande du 15 mars 2016 est conservée jusqu'au 31 décembre 2026 et anonymisée lors de la première exécution à partir du 1er janvier 2027."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_TITLE="Configurer la tâche"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP1="Vérifiez que ce plugin est activé."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP2="Sous « Système → Gérer → Tâches planifiées → Nouveau », choisissez le type « J2Commerce - Suppression automatique des données »."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP3="Saisissez les mêmes valeurs que dans le plugin « Privacy - J2Commerce Confidentialité »."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP4="Choisissez une exécution quotidienne, p. ex. à 02:00, puis activez et enregistrez la tâche."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP5="Configurez un déclencheur fiable, une tâche cron avec <code>php cli/joomla.php scheduler:run</code> ou le web cron de Joomla. Sans lui, Joomla ne lance les tâches que lors des visites de pages."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_NOTE1="Il n'existe pas d'exécution à blanc. Les données anonymisées ne peuvent pas être restaurées. Testez d'abord la tâche sur une installation de test avec des données de test. La tâche Joomla du type <code>privacy.consent</code> est une autre tâche et ne remplace pas celle-ci."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, mise à jour et désactivation"
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="L'installateur du plugin « Privacy - J2Commerce Confidentialité » installe ce plugin et l'active lors de la première installation. Une mise à jour conserve son état (activé ou désactivé). Il n'existe pas de mise à jour séparée."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="La tâche utilise des parties du programme du plugin de confidentialité. Si elles manquent, elle se termine avec un statut d'erreur et n'anonymise rien."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="La désinstallation du plugin de confidentialité supprime aussi ce plugin et toutes les tâches de ce type. Les données déjà anonymisées le restent."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI4="Tant que ce plugin est désactivé, Joomla ne propose plus le type de tâche et les tâches existantes de ce type ne traitent aucune donnée. Les données expirées restent alors en place jusqu'à ce qu'une demande de suppression les anonymise ou que vous réactiviez le plugin."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Problèmes fréquents et solutions"
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>Le type de tâche manque :</strong> activez ce plugin."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>La tâche ne s'exécute pas :</strong> vérifiez que la tâche est activée, que la planification est correcte et qu'un déclencheur fonctionne. La tâche affiche l'historique de ses exécutions sous « Système → Gérer → Tâches planifiées »."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>La tâche se termine avec un statut d'erreur :</strong> lisez le journal de la tâche. Des erreurs sur les commandes d'invités, les entrées de consentement, les contacts de remplacement AcyMailing, la suppression des compteurs ou sur tous les utilisateurs mènent à ce statut. Si seuls certains utilisateurs échouent, la tâche signale un succès mais cite les erreurs dans le journal."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>Une commande n'a pas été anonymisée :</strong> elle est encore dans le délai, la personne a une commande plus récente dans le délai, « Anonymiser les commandes » est sur « Non », ou la commande a une licence à vie et garde donc son adresse e-mail."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI5="<strong>Avertissement sur des numéros de commande utilisés plusieurs fois :</strong> si un numéro de commande appartient aussi à une autre commande, la tâche laisse inchangés les données de facturation et de livraison et le consentement de ce numéro. Vérifiez ces commandes manuellement."
