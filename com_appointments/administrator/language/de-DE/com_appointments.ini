COM_APPOINTMENTS_CONFIG_PHONE_COUNTRY_DESC="In Telefonfeldern vorgewählte Landesvorwahl, nur Ziffern, zum Beispiel 41 oder 49. Leer: Die Besucherin oder der Besucher wählt."
