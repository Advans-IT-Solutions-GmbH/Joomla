PLG_OSMAP_J2COMMERCE="OSMap - J2Commerce"
PLG_OSMAP_J2COMMERCE_XML_DESCRIPTION="Automatically adds enabled, visible J2Commerce products whose article is published and accessible to guests to the OSMap sitemap."

; Plugin params
PLG_OSMAP_PRIORITY_LABEL="Priority"
PLG_OSMAP_PRIORITY_DESC="Sitemap priority for product pages (0.0–1.0). Default: 0.8"
PLG_OSMAP_CHANGEFREQ_LABEL="Change Frequency"
PLG_OSMAP_CHANGEFREQ_DESC="How often product pages are likely to change."

; Post-install message
PLG_OSMAP_J2COMMERCE_POSTINSTALL_TITLE="OSMap J2Commerce: Installation Complete"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP_LABEL="Step %d"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Enable Plugin"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>System → Manage → Plugins</strong> → search for <strong>OSMap - J2Commerce</strong> → enable."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Configure OSMap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP2_DESC="In OSMap (<strong>Components → OSMap</strong>), open your sitemap and make sure the menu containing your shop item is selected. The plugin will automatically pick up all enabled J2Commerce products."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Regenerate Sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_STEP3_DESC="Open your sitemap URL (e.g. <strong>/sitemap</strong>) or click <strong>Refresh</strong> in OSMap to regenerate. Publicly visible products (published and accessible to guests) appear as <code>/shop/product-alias</code> URLs (on a multilingual site each URL carries the menu item's language SEF prefix, e.g. <code>/de/shop/product-alias</code>)."
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_ENABLED="Plugin enabled (System → Manage → Plugins → OSMap - J2Commerce)"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_MENU="Shop menu item is selected in OSMap sitemap"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECK_SITEMAP="Sitemap regenerated and product URLs visible"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_CHECKLIST_TITLE="Checklist"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_DOCS="Documentation"
PLG_OSMAP_J2COMMERCE_POSTINSTALL_SUPPORT="Support"

; Installer notices
PLG_OSMAP_J2COMMERCE_POSTINSTALL_UPDATED="OSMap - J2Commerce has been updated to version %s."
PLG_OSMAP_J2COMMERCE_ENABLE_HINT="The plugin is disabled. Enable it under <strong>System → Manage → Plugins</strong> (search for <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_MISSING="OSMap (com_osmap) is not installed. This plugin only works together with OSMap; install OSMap to generate a sitemap."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_DISABLED="OSMap (com_osmap) is installed but disabled. This plugin only works together with OSMap; enable OSMap under <strong>System → Manage → Extensions</strong> to generate a sitemap."
PLG_OSMAP_J2COMMERCE_WARN_J2COMMERCE_MISSING="Neither J2Commerce 6 (com_j2commerce) nor J2Store/J2Commerce 4 (com_j2store) is installed and enabled. No products are added to the sitemap until one of them is available."
PLG_OSMAP_J2COMMERCE_INFO_LEGACY_DISABLED="The legacy OSMap plugin for J2Store (osmap/j2store) was disabled because this plugin replaces it."
PLG_OSMAP_J2COMMERCE_WARN_LEGACY_DISABLE_FAILED="The legacy OSMap plugin for J2Store (osmap/j2store) could not be disabled: %s. Disable it manually under System → Manage → Plugins."
PLG_OSMAP_J2COMMERCE_INFO_OSMAP_PATCHED="The OSMap file %s was patched so that Factory::getTable() no longer returns false (PHP 8.1+ compatibility)."
PLG_OSMAP_J2COMMERCE_WARN_OSMAP_PATCH_FAILED="The OSMap file %s could not be read or written, so the PHP 8.1+ compatibility patch was not applied. Use an OSMap release that fixes Factory::getTable()."

; Help tab
PLG_OSMAP_J2COMMERCE_HELP_NOTE="What this plugin does, how to set it up and what to do when something goes wrong is explained on the «Help» tab."
PLG_OSMAP_J2COMMERCE_HELP_TAB="Help"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_TITLE="What the plugin does"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P1="OSMap creates the sitemap of your site but does not know the product pages of J2Store and J2Commerce. This plugin adds every publicly visible product to the sitemap."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_P2="A product appears in the sitemap when all of these conditions are met:"
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI1="The product is enabled and visible in the shop."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI2="The product's article is published and within its publishing period."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI3="Guests may view the article (access level)."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_LI4="The article's category and all its parent categories are published and visible to guests."
PLG_OSMAP_J2COMMERCE_HELP_WHAT_NOTE="The plugin works only together with OSMap. It has no page of its own, creates no tables and reports nothing to search engines. New or re-enabled products appear the next time the sitemap is requested."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_TITLE="Prerequisites and setup"
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP1="Install and enable OSMap (Free or Pro, version 5 or later) and the shop: J2Store 4 (component <code>com_j2store</code>) or J2Commerce 6 (component <code>com_j2commerce</code>). If one of them is missing or disabled, the plugin installation shows a warning."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP2="Enable the plugin under <strong>System → Manage → Plugins</strong> (search for <strong>OSMap - J2Commerce</strong>)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP3="Make sure the shop has a menu item with one of the supported views: product list, single product, categories or category alias (see the next section)."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP4="In OSMap, open your sitemap under <strong>Components → OSMap → Sitemaps</strong>, select the menu that contains the shop menu item and save."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP5="Open the sitemap. Each product appears with the address made of the shop menu item's path and the article alias, for example <code>https://example.org/shop/product-alias</code>. On a multilingual site the language code comes first, for example <code>https://example.org/en/shop/product-alias</code>."
PLG_OSMAP_J2COMMERCE_HELP_SETUP_STEP6="For these addresses to work, search engine friendly URLs and URL rewriting must be switched on in the Global Configuration, and the <code>.htaccess</code> must pass all requests to <code>index.php</code> (Joomla's standard rules)."
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_TITLE="Installation, update and uninstall"
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_LI1="Install the ZIP with Joomla's extension installer and enable the plugin. The plugin needs no scheduled task and creates none. On every installation and update the installer disables the old plugin <code>osmap/j2store</code> if present, registers the update site if missing, removes update sites that still point to the former repository path and, for OSMap up to version 5.1.3, corrects the one faulty line of its <code>Factory.php</code>."
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_LI2="Before updating, take a current, complete backup of the whole website that you can restore independently. The installer keeps no file copies and cannot check your backup. The first update attempt shows this recommendation and stops before it changes files, then you start the update again. Settings and the enabled state are kept."
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_LI3="If the installer finds a modified or unknown file that the update would replace or adjust, it stops before copying anything and lists the path and the hashes. This includes an OSMap file it does not recognise. Check the file, resolve it by hand (for OSMap, update to version 5.1.4 or later) or postpone the update, then try again. There is no approval command and no bypass."
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_LI4="New versions appear under <strong>System → Update → Extensions</strong>. After an update, open the sitemap once and check the product addresses."
PLG_OSMAP_J2COMMERCE_HELP_INSTALL_LI5="Uninstalling removes the plugin. It has no uninstall routine: the correction of the OSMap file and the disabled state of the old plugin <code>osmap/j2store</code> are not reverted. Shop data is not touched."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_TITLE="Which products appear"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_P1="What the plugin adds depends on the view of the shop menu item:"
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI1="<strong>Product list</strong> (<code>view=products</code>): all products of the selected category and its subcategories, all products if no category is selected."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI2="<strong>Categories</strong> (<code>view=categories</code>): all products of the selected root category and its subcategories, all products if no category is selected."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI3="<strong>Category alias</strong> (<code>view=categoryalias</code>, J2Commerce 6): all products of this category and its subcategories."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI4="<strong>Single product</strong> (<code>view=product</code>): only this product."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI5="Other views of the shop, for example cart or checkout, add no entries."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_LI6="If article menu items with status -2 (trashed) exist below the shop menu item, one per product, the plugin uses their path as the address. Each product still appears only once."
PLG_OSMAP_J2COMMERCE_HELP_CONTENT_NOTE="If J2Store and J2Commerce 6 are both enabled, for example during a migration, J2Store takes precedence: menu items of J2Commerce 6 are missing from the sitemap until J2Store is disabled. Disable J2Store before you publish the new J2Commerce 6 menu items."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_TITLE="Settings"
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_P1="The settings are on the «Plugin» tab and apply to every product the plugin writes to the sitemap."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI1="<strong>«Priority»</strong> (default 0.8): value from 0.0 to 1.0 that the sitemap gives for each product page. It tells search engines how important the page is compared with the other pages of your site. Change it if products are to weigh more or less than your other pages."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_LI2="<strong>«Change Frequency»</strong> (default <code>weekly</code>): how often the product pages are likely to change, from <code>always</code> to <code>never</code>. Choose for example <code>daily</code> if prices or stock change every day."
PLG_OSMAP_J2COMMERCE_HELP_SETTINGS_NOTE="Both values are hints for search engines. They do not decide which products are in the sitemap."
PLG_OSMAP_J2COMMERCE_HELP_PERMS_TITLE="Permissions and data"
PLG_OSMAP_J2COMMERCE_HELP_PERMS_LI1="The plugin has no <code>access.xml</code> and no permissions of its own. Only accounts that may edit plugins can change its two settings (<strong>System → Manage → Plugins</strong>): give another account access there. Who may view or edit sitemaps is decided by OSMap."
PLG_OSMAP_J2COMMERCE_HELP_PERMS_LI2="Only products that guests may see are listed, even when an administrator requests the sitemap. Who may open the public sitemap is decided by OSMap."
PLG_OSMAP_J2COMMERCE_HELP_PERMS_LI3="The plugin stores no data, writes no tables, sends no mails and sends nothing to search engines. It reads the product addresses from the database when the sitemap is generated. Joomla's update check is separate."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_TITLE="Typical problems and what to do"
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>No products in the sitemap.</strong> Check that the plugin is enabled, that the menu with the shop menu item is selected in the OSMap sitemap and that the menu item uses a supported view. Then check the conditions listed under «What the plugin does» for one product."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>Single products are missing.</strong> Usually the article is not published (yet or any more), restricted for guests or in a restricted category. Products that are not linked to a Joomla article cannot be found by the plugin."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>Shop menu items of J2Commerce 6 are missing.</strong> J2Store is still enabled. Disable J2Store under <strong>System → Manage → Extensions</strong> once the move to J2Commerce 6 is complete."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>The sitemap stays empty without an error message.</strong> OSMap ignores errors of its plugins. The plugin writes database errors to the Joomla log (category <code>plg_osmap_j2commerce</code>). Whether Joomla keeps these entries depends on the logging settings of the site."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>Product addresses return error 404.</strong> Check the search engine friendly URLs and the <code>.htaccess</code>. If the <code>.htaccess</code> blocks addresses with <code>/component/</code>, exclude <code>/component/j2store</code> or <code>/component/j2commerce</code>, because the shop needs them for cart and checkout. If the addresses come from menu items with status -2 and their paths are out of date, use the <strong>Rebuild</strong> button under <strong>Menus → All Menu Items</strong>."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>Error message about <code>Factory::getTable()</code>.</strong> This is a fault of some OSMap releases. The plugin installation corrects the affected OSMap file by itself when the file is exactly that of a release the plugin knows. For any other file the installation stops and changes nothing: use an OSMap release that fixes the fault or apply the fix described in the README of the plugin."
PLG_OSMAP_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>The old OSMap plugin for J2Store is disabled.</strong> The installation disables the plugin <code>osmap/j2store</code> because this plugin replaces it and the old one creates wrong product addresses. Leave it disabled."
PLG_OSMAP_J2COMMERCE_PAUSE_OSMAP_FACTORY="This OSMap file is not a release the plugin knows how to patch, or it was changed on this site. Nothing was changed. Use an OSMap release that fixes Factory::getTable(), or ask the plugin maintainers to add your OSMap release."
