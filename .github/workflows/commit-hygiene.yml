name: Commit Hygiene

# Owner decision of 2026-11-23: a pull request with an unverified commit, a Co-authored-by
# trailer or an agent signature in a commit message must not be mergeable.
#
# No path filter: this workflow is therefore an unconditional pull_request workflow, and
# .github/scripts/collect-results.sh requires it on every pull request. The required check
# "Collect Results" fails when this workflow does not succeed.

run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} base={1} base-sha={2} head-sha={3} merge-sha={4}', github.event.pull_request.number, github.event.pull_request.base.ref, github.event.pull_request.base.sha, github.event.pull_request.head.sha, github.sha) || (github.event_name == 'push' && github.event.head_commit.message) || github.workflow }}"

on:
  pull_request:
    branches: [main, advansit-superuser-calendar-administration, advansit-guest-privacy-requests]

permissions:
  contents: read

jobs:
  commit-hygiene:
    name: Commit hygiene
    permissions:
      contents: read
      pull-requests: read
    uses: Advans-IT-Solutions-GmbH/.github/.github/workflows/reusable-commit-hygiene.yml@5a3231b6d3de6a02e140303b6a7c812550d0fba8 # commit hygiene, to be re-pinned to the merge commit