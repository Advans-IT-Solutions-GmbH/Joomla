COM_APPOINTMENTS_TEMPLATE_BODY_DESC="Nur Klartext. HTML wird nicht dargestellt und Leerzeichen bleiben erhalten. Verwenden Sie {event_title}, {invitee_name}, {invitee_email}, {invitee_phone}, {host_name}, {host_email}, {location}, {conference_url} und {guest_emails}. Die schreibgeschützten Darstellungsplatzhalter {start}, {end}, {timezone} und {state_label} liefern formatierte Datumsangaben, die Zeitzone und den übersetzten Status. Buchungsfelder verwenden Platzhalter wie {start_utc}, {end_utc} und {state}. Verwenden Sie {custom_fields.ID} für eine Antwort und ersetzen Sie ID durch die ID des benutzerdefinierten Feldes. Die signierten Links {reschedule_url}, {cancel_url} und {erase_url} sind nur in E-Mails an eingeladene Personen verfügbar. Kalenderanhänge und die obligatorische Fusszeile mit Aktionslinks werden automatisch ergänzt."
