ADVANS_GUARD_PAUSED_TITLE="Die Installation wurde angehalten. Es wurde nichts verändert."
ADVANS_GUARD_PAUSED_WHY="Diese Version müsste Dateien ersetzen, die nicht zu ihr gehören. Das könnte eine andere Erweiterung funktionsunfähig machen, und eine Sicherung würde das nicht beheben:"
ADVANS_GUARD_PAUSED_REASON="gehört zu einer anderen Erweiterung oder wurde auf dieser Website geändert"
ADVANS_GUARD_PAUSED_APPROVE_UPDATE="Wenn Sie sicher sind, dass die andere Erweiterung diese Dateien nicht mehr braucht, gibt ein Super User sie frei, indem er innerhalb einer Stunde nochmals aktualisiert: Klicken Sie auf «Freigeben» und aktualisieren Sie diese Erweiterung danach erneut. Jede Datei ist bereits unter %s gesichert."
ADVANS_GUARD_PAUSED_APPROVE_INSTALL="Wenn Sie sicher sind, dass die andere Erweiterung diese Dateien nicht mehr braucht, gibt ein Super User sie frei, indem er dasselbe Paket innerhalb einer Stunde nochmals installiert: Klicken Sie auf «Freigeben» und installieren Sie das Paket danach erneut. Jede Datei ist bereits unter %s gesichert."
ADVANS_GUARD_PAUSED_BUTTON="Freigeben"
ADVANS_GUARD_PAUSED_SUPERUSER="Nur ein Super User kann diesen Schritt freigeben. Bitten Sie einen Super User, die Installation zu wiederholen."
ADVANS_GUARD_PAUSED_CLI="Die Serveradministration kann stattdessen auf der Kommandozeile freigeben, mit dem Freigabebefehl aus der README der Erweiterung und dem Prüfplan %s."
