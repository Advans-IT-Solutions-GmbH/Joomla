PLG_PRIVACY_APPOINTMENTS="Confidentialité - Rendez-vous"
PLG_PRIVACY_APPOINTMENTS_XML_DESCRIPTION="Exporte et efface les données des rendez-vous dans le flux de demandes de confidentialité de Joomla."
PLG_PRIVACY_APPOINTMENTS_DOMAIN="Réservations et réponses aux formulaires"
PLG_PRIVACY_APPOINTMENTS_ACCOUNT_MISMATCH="Le compte trouvé par Joomla ne correspond pas à l'adresse demandée. L'effacement est bloqué pour protéger l'autre compte."
PLG_PRIVACY_APPOINTMENTS_LEGAL_BLOCK="L'effacement des rendez-vous est bloqué pour le motif juridique configuré : %s"
PLG_PRIVACY_APPOINTMENTS_REMOVED="Réservations effacées : %d."
PLG_PRIVACY_APPOINTMENTS_CLEANUP_FAILED="Les réservations ont été traitées, mais le nettoyage des copies de calendrier ou des conférences a échoué. Corrigez le problème de stockage ou de fournisseur et relancez la suppression native : des références opérationnelles chiffrées conservent le nettoyage en attente même sans adresse de réservation. La clôture reste bloquée ; une nouvelle recherche vide ou une confirmation ne prouve pas l'effacement."
PLG_PRIVACY_APPOINTMENTS_DISABLED_REMAINDER="Les calendriers Internet sont désactivés, mais des données de calendrier ou de clés du personnel restent présentes. Elles n'ont été ni recherchées ni supprimées. Examinez-les avec un accès réellement autorisé avant de clore la demande."
PLG_PRIVACY_APPOINTMENTS_INCOMPLETE="La suppression des rendez-vous est incomplète. Résolvez les avertissements concernant les copies, conférences, réservations illisibles ou calendriers non recherchés, puis réessayez avant la clôture Core. Les suppressions déjà effectuées ne sont pas annulées."
PLG_PRIVACY_APPOINTMENTS_MAIL_FAILED="Les données ont été effacées, mais une notification d'annulation à l'hôte n'a pas pu être envoyée."
PLG_PRIVACY_APPOINTMENTS_GUEST_DOMAIN="Rendez-vous auxquels l'adresse est invitée comme participant supplémentaire"
