COM_APPOINTMENTS_MAIL_CONFIRMATION_SUBJECT="Confirmé : {event_title}"
COM_APPOINTMENTS_MAIL_CONFIRMATION_BODY="Bonjour {invitee_name},\n\nVotre rendez-vous est confirmé.\n{event_title}\nDe : {start}\nÀ : {end}\nFuseau horaire : {timezone}\nLieu : {location}\n{conference_url}\n\nL'invitation jointe ajoute ce rendez-vous à votre calendrier."
COM_APPOINTMENTS_MAIL_PENDING_SUBJECT="En attente de validation : {event_title}"
