COM_APPOINTMENTS_TEMPLATE_BODY="Corps de l'e-mail en texte brut"
COM_APPOINTMENTS_TEMPLATE_BODY_DESC="Texte brut uniquement ; le HTML n'est pas interprété et les espaces sont conservés. Utilisez {event_title}, {invitee_name} (nom complet), {invitee_first_name}, {invitee_last_name}, {invitee_email}, {invitee_phone}, {host_name}, {host_email}, {location}, {conference_url} et {guest_emails}. Les variables de présentation en lecture seule {start}, {end}, {timezone} et {state_label} fournissent les dates formatées, le fuseau horaire et le statut traduit. Les champs de réservation utilisent des variables telles que {start_utc}, {end_utc} et {state}. Utilisez {custom_fields.ID} pour une réponse, en remplaçant ID par l'identifiant du champ personnalisé. Les liens signés {reschedule_url}, {cancel_url} et {erase_url} sont disponibles uniquement dans les e-mails destinés aux personnes invitées. Les invités supplémentaires reçoivent à la place les modèles pour invités, avec une formule d'appel neutre : {guest_email} y est l'adresse de l'invité et {guest_remove_url} le lien signé qui retire uniquement cette adresse du rendez-vous. Les pièces jointes de calendrier et le pied de page obligatoire contenant les liens d'action sont ajoutés automatiquement."
