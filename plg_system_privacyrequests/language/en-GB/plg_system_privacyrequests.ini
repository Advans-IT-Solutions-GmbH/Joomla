PLG_SYSTEM_PRIVACYREQUESTS="System - Privacy Requests"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="Account-free email confirmation for removal requests in Joomla Privacy. Enable explicitly, then link the public request page. Core administrator permissions and privacy plugin blockers still apply."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Request removal of personal data"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="You do not need an account. Enter your email address to request a confirmation code, or enter the code from your email to confirm your request. Request a code again if it expired; this renews a pending request without changing its original receipt date."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Confirmation code (from your email)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Request or renew code"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Confirm request"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="If this address is accepted for processing, a Core request is recorded or an existing request retained. This response does not confirm receipt, email delivery, confirmation or data removal. Check your email; if no code arrives, retry later or contact the site operator by an alternative channel. Repeated submissions may be limited."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Privacy request: confirmation delivery failed"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="Confirmation delivery failed for Core request %d. Its original receipt and pending state remain. Review the native request and mail configuration. Resolve delivery to the original address, then renew through the guest request form. Operator contact permits communication and proportionate assessment, not confirmation of this Core request. Stock Joomla provides no supported manual confirmation action for a rejected original recipient. Keep it pending; do not substitute an address or force confirmed/completed status."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="Confirmation delivery failed. This pending Core receipt and its original date are retained; neither delivery nor identity is proven. Exact Unicode matching does not imply Joomla mail support for Unicode before @. Use the operator contact route for communication and proportionate assessment. Contact or another reply address does not confirm this request. Stock Core provides no supported manual confirmation action for a rejected original recipient: keep it pending until original-address confirmation works. Do not bypass confirmation, Remove or Complete."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Your request is confirmed for administrator processing. This confirms access to this email address, not every identity or entitlement. No data has been removed by this confirmation."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="This code has expired, not your right or the original request. Request a renewed code on this page or contact the site operator for an alternative way to confirm."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="The request could not be confirmed. Check the email address and code, or try again later. You can request a renewed code or contact the site operator."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Enter a valid email address of at most 100 bytes."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="The request service could not finish this operation. Do not assume receipt or confirmation. Please retry later or contact the site operator by an alternative channel."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="The privacy operation cannot start safely. Another operation may still be running. Do not assume removal or completion; retry later or inspect the administrator log."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="The administrator reviews identity, scope and applicable retention requirements before removal. Automated removal covers only participating privacy plugins. Email, calendar-client, CRM, backup and other external copies require separate assessment; retained audit and lawful evidence are not a claim that everything was erased."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="The account selected by Joomla does not exactly match the request address. Resolve the address mismatch before removing data."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Confirm this account-free request using its email address and confirmation code on the public request page."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="I reviewed the removal scope and the response to the requester"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Before retrying Remove, I verified remediation of earlier partial cleanup"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Removal retry is blocked: explicitly review remediation of the earlier incomplete attempt before running Remove again. Checking the box does not repair remaining data."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="Use only after independently resolving and verifying earlier failures, including copies no longer discoverable by the original address. This is not a waiver of current errors, unreadable content or plugin legal blockers. It does not complete the request."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Before Complete, run Remove successfully without unresolved warnings. Review participating plugins, additional identity needs, retained evidence, and separate external copies. Core completion records processing, not proof of universal erasure."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Completion is blocked: first run Remove without unresolved warnings, then explicitly review the scope and response. A dispatched callback alone is not proof of complete erasure."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Operator contact route"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Required before activation: an existing public local Joomla contact page, starting with index.php, for example index.php?option=com_contact&view=contact&id=42. Use the site's actual ID and test contact without an account. No external URL, redirect or fragment. Contact does not confirm or complete a Core request."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Contact the site operator"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Use this contact route if no code arrives or Joomla cannot send to your original address. State the original address accurately. Another reply address is a communication channel only, not proof of control of that mailbox. Contact alone does not confirm the Core request or authorize removal."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="A contact link has not been configured here. Use the operator contact details in this site's legal or privacy information. Do not assume that this page has received or confirmed your request."
