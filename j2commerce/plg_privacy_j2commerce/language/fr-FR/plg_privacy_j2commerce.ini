PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC_TASK_FAILED="<strong>Système → Gérer → Plugins</strong> → rechercher <strong>Privacy - J2Commerce Confidentialité</strong> → activer. Le plugin inclus <strong>Tâche - Nettoyage confidentialité J2Commerce</strong> n'a <strong>pas</strong> pu être installé automatiquement ; voir l'avertissement ci-dessus et réinstaller le paquet."
