name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, advansit-superuser-calendar-administration, advansit-guest-privacy-requests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: Advans-IT-Solutions-GmbH/.github/.github/workflows/reusable-security.yml@173eca8f3c221dcf744bd8e1f36ef90297c866db # v1
    with:
      fail_on_findings: false   # Semgrep/zizmor: report-only
      gitleaks_fail: true       # Gitleaks: blockierendes Gate für neue Secrets