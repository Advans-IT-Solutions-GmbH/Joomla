name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: Advans-IT-Solutions-GmbH/.github/.github/workflows/reusable-security.yml@475bfe17d50e140e4804d0128b71cf62094f3c89 # v1
    with:
      fail_on_findings: false   # Semgrep/zizmor: report-only
      gitleaks_fail: true       # Gitleaks: blockierendes Gate für neue Secrets