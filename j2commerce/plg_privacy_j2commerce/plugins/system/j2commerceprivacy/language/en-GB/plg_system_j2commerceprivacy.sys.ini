PLG_SYSTEM_J2COMMERCEPRIVACY="System - J2Commerce Privacy Consent"
PLG_SYSTEM_J2COMMERCEPRIVACY_XML_DESCRIPTION="Validates the privacy consent checkbox of the J2Commerce 6 checkout on the server and records the consent per order in Joomla's privacy consents. Also links the mail for privacy requests created by an administrator to the confirmation page of the J2Commerce privacy plugin, which customers without a user account can use."
