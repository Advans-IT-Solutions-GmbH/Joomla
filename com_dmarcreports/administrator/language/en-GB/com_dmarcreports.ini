COM_DMARCREPORTS_DETAIL_SOURCES_INTRO="The software judges every source itself. Only an aligned DKIM signature proves that mail comes from you, so such sources are confirmed automatically. Mail that passed only through SPF is flagged, because the shared mail servers of a provider can pass SPF for every one of its customers. Failing mail that the receivers rejected shows that your policy works. The assessment is based on the current reporting window (the seven days up to the newest report) when the source sent mail in it, otherwise on all its mail. The counts cover all reports. The list shows the 20 largest sources and every source the Action Center names."
