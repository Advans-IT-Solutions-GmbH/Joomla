COM_DMARCREPORTS_DETAIL_SOURCES_INTRO="Die Software beurteilt jede Quelle selbst. Nur eine ausgerichtete DKIM-Signatur beweist, dass E-Mails von Ihnen stammen, solche Quellen werden darum automatisch bestätigt. E-Mails, die nur über SPF bestanden haben, werden gemeldet, weil die gemeinsamen Mailserver eines Anbieters SPF für jeden seiner Kunden bestehen können. Fehlgeschlagene E-Mails, die die Empfänger abgewiesen haben, zeigen, dass Ihre Richtlinie wirkt. Die Beurteilung stützt sich auf das aktuelle Berichtsfenster (die sieben Tage bis zum neuesten Bericht), wenn die Quelle darin gesendet hat, sonst auf alle ihre E-Mails. Die Zahlen umfassen alle Berichte. Die Liste zeigt die 20 grössten Quellen und jede Quelle, die das Aktionszentrum nennt."
COM_DMARCREPORTS_DETAIL_SOURCES_PERIOD="Die Zahlen sind Gesamtwerte; das Klassenabzeichen verwendet das aktuelle Berichtsfenster und fällt nur auf Gesamtwerte zurück, wenn die Quelle in diesem Fenster keine E-Mail gesendet hat."
