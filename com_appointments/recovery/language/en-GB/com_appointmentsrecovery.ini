COM_APPOINTMENTSRECOVERY_HELP="When an Appointments update stops, download each listed existing file to your own computer before approving its replacement. The server stores only paths and hashes, never a copy of the file contents. After the update, recovery uses the copy you upload and verifies its hash and destination. Before updating or restoring, take a current, complete site backup that can be restored independently, and stop other writers. The installer cannot verify a site backup; file recovery does not roll back database or extension changes."
