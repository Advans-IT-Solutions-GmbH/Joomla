PLG_AJAX_JOOMLAAJAXFORMS_HTACCESS_COMPONENT_BLOCKED="Die /component/-Blockierung in der .htaccess hat keine Ausnahme für com_ajax-Plugin-Aufrufe (zum Beispiel RewriteCond %{QUERY_STRING} !plugin= [NC]). AJAX-Aufrufe (Anmeldung, Warenkorb usw.) werden fehlschlagen."
