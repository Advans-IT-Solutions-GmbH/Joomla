COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET_FIX="Alle Serverschlüssel der Internetkalender stammen aus dem Site-Secret in configuration.php. Stellen Sie das bisherige Secret aus den gedruckten Wiederherstellungsunterlagen wieder her. Mit einem neuen Secret sind App-Passwörter, Zeitdaten und Schutzcodes nicht mehr gültig."
COM_APPOINTMENTS_TEAM_F_SYSTEM_LEGACY_FEEDS="Token-Feeds (veraltet)"
