PKG_APPOINTMENTS="Paquet Rendez-vous"
PKG_APPOINTMENTS_XML_DESCRIPTION="Prise de rendez-vous auto-hébergée en une seule installation : le composant Rendez-vous, son module de tableau de bord d'administration et ses six plugins (tâches planifiées, demandes de confidentialité, consentement, calendriers Internet, origine des réservations et gestion des clés à la connexion). L'installation, la mise à jour et la suppression du paquet les gèrent ensemble. Installé sur le composant autonome d'une version antérieure, le paquet le reprend avec toutes ses données, tous ses réglages et ses états d'activation."
PKG_APPOINTMENTS_POSTINSTALL_INTRO="Le paquet Rendez-vous est installé. Ouvrez <strong>Composants → Rendez-vous</strong> pour configurer les plannings et les types de rendez-vous. Le module de tableau de bord affiche les prochains rendez-vous sur la page d'accueil de l'administration ; les tâches planifiées dont le composant a besoin sont créées par l'installation, ses messages l'indiquent."
PKG_APPOINTMENTS_POSTINSTALL_UPDATED="Paquet Rendez-vous mis à jour en version %s."
PKG_APPOINTMENTS_POSTINSTALL_MIGRATED="Rendez-vous fonctionne désormais comme paquet (version %s). Le composant, son module et ses plugins ont été repris tels quels : données, réglages et états d'activation sont inchangés. Les mises à jour passent désormais par le paquet."
PKG_APPOINTMENTS_INSTALL_CHILD_NEWER="%1$s est installé en version %2$s, plus récente que la version %3$s de ce paquet. L'installation a été arrêtée et rien n'a été modifié. Installez le paquet Rendez-vous actuel."
PKG_APPOINTMENTS_UPDATE_CHANNEL_WARNING="Le paquet Rendez-vous a été installé ou mis à jour, mais Joomla n'a pas pu basculer toutes les extensions incluses vers le canal de mise à jour du paquet. Certaines extensions peuvent encore recevoir des mises à jour autonomes. Mettez à jour le paquet à nouveau pour réessayer."
PKG_APPOINTMENTS_INSTALL_CONFLICT_ERROR="Appointments n'a pas pu examiner les fichiers existants en toute sécurité. L'installation a été arrêtée ; consultez le journal de l'installateur."
PKG_APPOINTMENTS_INSTALL_CONFLICT_TITLE="L'installation d'Appointments a été arrêtée avant la copie des fichiers."
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXPLANATION="Les fichiers existants ci-dessous diffèrent du paquet et ne sont pas reconnus comme des fichiers de version inchangés. Cela ne signifie pas qu’ils ont été modifiés. Aucun contenu de fichier n’a été copié sur le serveur. Téléchargez chaque fichier sur votre ordinateur dans Récupération Appointments avant d’autoriser son remplacement, puis relancez la même mise à jour."
PKG_APPOINTMENTS_INSTALL_CONFLICT_REVIEW="Ouvrir Récupération Appointments"
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXISTING="SHA-256 existant"
PKG_APPOINTMENTS_INSTALL_CONFLICT_INCOMING="SHA-256 entrant (ou opération de suppression)"
PKG_APPOINTMENTS_INSTALL_TASK_FAILED="La tâche planifiée « %s » n'a pas pu être créée. Créez-la vous-même sous Système, Tâches planifiées."
PKG_APPOINTMENTS_INSTALL_TASK_DISABLED="La tâche planifiée facultative « %s » a été créée désactivée : elle n’est nécessaire qu’une fois le transfert des réservations vers Close configuré. Activez-la alors sous Système, Tâches planifiées."
PKG_APPOINTMENTS_MODULE_DEFAULT_TITLE="Prochains rendez-vous"
PKG_APPOINTMENTS_UNINSTALL_RETAINED_ACL_CONFLICT="Les autorisations Appointments n'ont pas pu être conservées car un autre arbre d'autorisations conservé existe déjà. Résolvez le doublon d'asset avant de désinstaller à nouveau. Rien n'a été supprimé."
