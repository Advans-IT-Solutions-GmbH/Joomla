ADVANS_TASKS_CREATED="Die erforderliche geplante Aufgabe «%1$s» fehlte. Die Installation hat sie angelegt und eingeschaltet: Sie läuft %2$s. %3$s Prüfen können Sie sie unter System → Verwalten → Geplante Aufgaben."
ADVANS_TASKS_SWITCHED_OFF="Die erforderliche geplante Aufgabe «%1$s» ist ausgeschaltet oder im Papierkorb. %2$s Solange sie ausgeschaltet ist, geschieht das nicht. Die Installation lässt sie so, weil sie jemand absichtlich ausgeschaltet hat. Einschalten: System → Verwalten → Geplante Aufgaben, «%1$s» auswählen und «Aktivieren» klicken (eine Aufgabe im Papierkorb erscheint mit dem Statusfilter «Papierkorb»)."
ADVANS_TASKS_CREATE_FAILED="Die erforderliche geplante Aufgabe «%1$s» fehlt und konnte nicht angelegt werden. %2$s Legen Sie sie unter System → Verwalten → Geplante Aufgaben → Neu → «%1$s» an und schalten Sie sie ein."
ADVANS_TASKS_PLUGIN_MISSING="Die erforderliche geplante Aufgabe «%1$s» kann nicht angelegt werden, weil ihr Aufgaben-Plugin nicht installiert ist. %2$s Installieren Sie diese Erweiterung erneut."
ADVANS_TASKS_PLUGIN_DISABLED="Das Aufgaben-Plugin, das «%s» ausführt, ist ausgeschaltet. Die Aufgabe läuft deshalb nicht. Schalten Sie es unter System → Verwalten → Plugins ein (nach dem Typ «task» filtern)."
ADVANS_TASKS_CHECK_FAILED="Die geplanten Aufgaben dieser Erweiterung konnten nicht geprüft werden. Prüfen Sie unter System → Verwalten → Geplante Aufgaben, ob die Aufgaben, die die Hilfeseite dieser Erweiterung als erforderlich nennt, vorhanden und eingeschaltet sind."
