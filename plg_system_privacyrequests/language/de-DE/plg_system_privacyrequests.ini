PLG_SYSTEM_PRIVACYREQUESTS="System - Datenschutzanfragen"
PLG_SYSTEM_PRIVACYREQUESTS_XML_DESCRIPTION="E-Mail-Bestätigung ohne Konto für Löschanfragen in Joomla Datenschutz. Ausdrücklich aktivieren und die öffentliche Anfrageseite verlinken. Die Administratorrechte von Joomla und die Sperren der Datenschutz-Plugins bleiben bestehen."
PLG_SYSTEM_PRIVACYREQUESTS_TITLE="Löschung personenbezogener Daten anfragen"
PLG_SYSTEM_PRIVACYREQUESTS_INTRO="Sie benötigen kein Konto. Geben Sie Ihre E-Mail-Adresse ein, um einen Bestätigungscode anzufordern, oder bestätigen Sie Ihre Anfrage mit dem Code aus Ihrer E-Mail. Fordern Sie einen abgelaufenen Code erneut an. Die offene Anfrage behält ihr ursprüngliches Eingangsdatum."
PLG_SYSTEM_PRIVACYREQUESTS_TOKEN="Bestätigungscode (aus Ihrer E-Mail)"
PLG_SYSTEM_PRIVACYREQUESTS_REQUEST="Code anfordern oder erneuern"
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM="Anfrage bestätigen"
PLG_SYSTEM_PRIVACYREQUESTS_RECEIVED="Falls diese Adresse zur Bearbeitung angenommen wird, wird eine Datenschutzanfrage erfasst oder eine bestehende Anfrage beibehalten. Diese Antwort bestätigt weder Eingang noch E-Mail-Versand, Bestätigung oder Datenlöschung. Prüfen Sie Ihre E-Mails. Falls kein Code ankommt, versuchen Sie es später erneut oder kontaktieren Sie den Websitebetreiber auf einem anderen Weg. Wiederholte Anfragen können begrenzt werden."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_SUBJECT="Datenschutzanfrage: Bestätigungsversand fehlgeschlagen"
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_MESSAGE="Der Bestätigungsversand für die Joomla-Datenschutzanfrage %d ist fehlgeschlagen. Der ursprüngliche Eingang und der offene Status bleiben erhalten. Prüfen Sie die Datenschutzanfrage in Joomla und die Mailkonfiguration. Beheben Sie den Versand an die ursprüngliche Adresse und erneuern Sie den Code über das Gastformular. Die Kontaktaufnahme ermöglicht Kommunikation und eine verhältnismässige Prüfung, bestätigt aber diese Datenschutzanfrage nicht. Joomla bietet keine unterstützte manuelle Bestätigung für eine abgelehnte ursprüngliche Empfängeradresse. Lassen Sie die Anfrage offen. Ersetzen Sie die Adresse nicht und erzwingen Sie weder Bestätigung noch Abschluss."
PLG_SYSTEM_PRIVACYREQUESTS_DELIVERY_WARNING="Der Bestätigungsversand ist fehlgeschlagen. Diese offene Joomla-Datenschutzanfrage und ihr ursprüngliches Eingangsdatum bleiben erhalten. Weder Versand noch Identität sind belegt. Exakter Unicode-Abgleich bedeutet nicht, dass Joomla Unicode vor @ beim Versand unterstützt. Nutzen Sie den Betreiberkontakt für Kommunikation und eine verhältnismässige Prüfung. Kontaktaufnahme oder eine andere Antwortadresse bestätigen diese Anfrage nicht. Joomla bietet keine unterstützte manuelle Bestätigung für eine abgelehnte ursprüngliche Empfängeradresse. Die Anfrage bleibt offen, bis die Bestätigung an diese Adresse funktioniert. Umgehen Sie weder Bestätigung noch Löschung oder Abschluss."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRMED="Ihre Anfrage ist zur Bearbeitung durch die Administration bestätigt. Dies bestätigt den Zugriff auf diese E-Mail-Adresse, nicht jede Identität oder Berechtigung. Durch diese Bestätigung wurden keine Daten gelöscht."
PLG_SYSTEM_PRIVACYREQUESTS_EXPIRED="Dieser Code ist abgelaufen, nicht Ihr Recht oder die ursprüngliche Anfrage. Fordern Sie hier einen neuen Code an oder kontaktieren Sie den Websitebetreiber für eine alternative Bestätigung."
PLG_SYSTEM_PRIVACYREQUESTS_CONFIRM_FAILED="Die Anfrage konnte nicht bestätigt werden. Prüfen Sie E-Mail-Adresse und Code oder versuchen Sie es später erneut. Sie können einen neuen Code anfordern oder den Websitebetreiber kontaktieren."
PLG_SYSTEM_PRIVACYREQUESTS_INVALID_EMAIL="Geben Sie eine gültige E-Mail-Adresse mit höchstens 100 Zeichen ein. Datenschutzanfragen ohne Konto: E-Mail-Adressen mit Umlauten oder anderen Sonderzeichen vor dem @ werden wie überall in Joomla nicht angenommen."
PLG_SYSTEM_PRIVACYREQUESTS_UNAVAILABLE="Der Anfragedienst konnte diesen Vorgang nicht abschliessen. Gehen Sie nicht von einem Eingang oder einer Bestätigung aus. Versuchen Sie es später erneut oder kontaktieren Sie den Websitebetreiber auf einem anderen Weg."
PLG_SYSTEM_PRIVACYREQUESTS_OPERATION_BUSY="Der Datenschutzvorgang kann nicht sicher starten. Möglicherweise läuft noch ein anderer Vorgang. Gehen Sie nicht von einer Löschung oder einem Abschluss aus. Versuchen Sie es später erneut oder prüfen Sie das Administratorprotokoll."
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_REQUIRED="Erneuter Löschlauf gesperrt: Prüfen und bestätigen Sie zuerst die Behebung des früheren unvollständigen Versuchs. Das Kontrollkästchen behebt keine verbliebenen Daten."
PLG_SYSTEM_PRIVACYREQUESTS_LIMITS="Die Administration prüft Identität, Umfang und geltende Aufbewahrungspflichten vor der Löschung. Die automatische Löschung umfasst nur die Datenschutz-Erweiterungen dieser Website, die daran teilnehmen. Kopien in E-Mails, Kalenderprogrammen, Kundenverwaltungssystemen, Sicherungen und anderen externen Systemen sind gesondert zu prüfen. Aufbewahrte Protokolle und rechtmässige Nachweise bedeuten nicht, dass alles gelöscht wurde."
PLG_SYSTEM_PRIVACYREQUESTS_ACCOUNT_MISMATCH="Das von Joomla ausgewählte Konto stimmt nicht genau mit der Anfrageadresse überein. Beheben Sie diese Abweichung vor der Datenlöschung."
PLG_SYSTEM_PRIVACYREQUESTS_USE_CONFIRMATION="Bestätigen Sie diese Anfrage ohne Konto mit E-Mail-Adresse und Bestätigungscode auf der öffentlichen Anfrageseite."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_LABEL="Ich habe Löschumfang und Antwort an die anfragende Person geprüft"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_LABEL="Vor dem erneuten Löschlauf habe ich die frühere Teilbereinigung überprüft"
PLG_SYSTEM_PRIVACYREQUESTS_REMEDIATION_DESC="Nur nach unabhängiger Behebung und Überprüfung früherer Fehler verwenden, auch für Kopien, die über die ursprüngliche Adresse nicht mehr auffindbar sind. Übergeht weder aktuelle Fehler noch unlesbare Inhalte oder rechtliche Plugin-Sperren. Schliesst die Anfrage nicht ab."
PLG_SYSTEM_PRIVACYREQUESTS_REVIEW_DESC="Führen Sie vor dem Abschluss die Löschung ohne offene Warnungen aus. Prüfen Sie teilnehmende Plugins, zusätzlichen Identitätsnachweis, aufbewahrte Nachweise und separate externe Kopien. Der Abschluss in Joomla dokumentiert die Bearbeitung, nicht eine universelle Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_COMPLETION_BLOCKED="Abschluss gesperrt: Führen Sie zuerst die Löschung ohne offene Warnungen aus und prüfen Sie danach ausdrücklich Umfang und Antwort. Ein aufgerufener Callback allein belegt keine vollständige Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE="Kontaktpfad zum Websitebetreiber"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_ROUTE_DESC="Vor der Aktivierung erforderlich: eine bestehende öffentliche lokale Joomla-Kontaktseite, beginnend mit index.php, beispielsweise index.php?option=com_contact&view=contact&id=42. Verwenden Sie die tatsächliche ID und testen Sie den Kontakt ohne Konto. Keine externe URL, Weiterleitung oder Sprungmarke. Eine Kontaktaufnahme bestätigt keine Joomla-Datenschutzanfrage und schliesst sie nicht ab."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT="Websitebetreiber kontaktieren"
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_NOTE="Nutzen Sie diesen Kontakt, falls kein Code ankommt oder Joomla nicht an Ihre ursprüngliche Adresse senden kann. Geben Sie die ursprüngliche Adresse genau an. Eine andere Antwortadresse dient nur der Kommunikation und belegt keinen Zugriff auf dieses Postfach. Die Kontaktaufnahme allein bestätigt Ihre Datenschutzanfrage nicht und berechtigt nicht zur Löschung."
PLG_SYSTEM_PRIVACYREQUESTS_CONTACT_UNCONFIGURED="Hier wurde kein Kontaktlink eingerichtet. Nutzen Sie die Betreiberangaben im Impressum oder in den Datenschutzhinweisen dieser Website. Gehen Sie nicht davon aus, dass diese Seite Ihre Anfrage erhalten oder bestätigt hat."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_SYSTEM_PRIVACYREQUESTS_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe»."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_TAB="Hilfe"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_TITLE="Was dieses Plugin tut"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_P1="Joomla nimmt Datenschutzanfragen im Frontend nur von angemeldeten Personen an. Dieses Plugin ergänzt eine öffentliche Seite, auf der Personen ohne Benutzerkonto eine Löschanfrage stellen und mit einem Code aus einer E-Mail bestätigen. Die Anfrage ist eine normale Anfrage der Joomla-Komponente Datenschutz."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI1="Die Seite hat die Adresse <code>index.php?option=com_ajax&plugin=privacyrequests&group=system&format=html</code>. Verlinken Sie sie z.B. in Ihrer Datenschutzerklärung."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI2="Die Seite nimmt nur Löschanfragen an, keine Exportanfragen."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI3="Die Bearbeitung bleibt bei Ihnen: Sie führen die Löschung unter «Benutzer → Datenschutz → Anfragen» aus und schliessen die Anfrage ab. Joomla ruft dabei alle aktiven Datenschutz-Plugins auf."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI4="Solange das Plugin aktiviert ist, sichert es jede Löschanfrage zusätzlich ab, auch Anfragen, die nicht über diese Seite entstanden sind (Abschnitt «Grenzen und Sperren»)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_LI5="Die Installation aktiviert das Plugin nicht, ändert keine E-Mail-Einstellungen und legt keine geplanten Aufgaben an."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_WHAT_NOTE1="Eine bestätigte E-Mail-Adresse beweist nur den Zugriff auf dieses Postfach. Prüfen Sie Identität und Umfang selbst, bevor Sie Daten löschen."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_TITLE="Einrichtung Schritt für Schritt"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP1="Prüfen Sie den E-Mail-Versand der Website in der Globalen Konfiguration. Ist der Versand ausgeschaltet, nimmt die Seite keine Anfragen an."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP2="Erstellen Sie eine Kontaktseite, die ohne Anmeldung erreichbar ist, z.B. ein Kontaktformular der Joomla-Komponente Kontakte."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP3="Tragen Sie deren Pfad im Feld «Kontaktpfad zum Websitebetreiber» ein und speichern Sie."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP4="Aktivieren Sie das Plugin."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP5="Verlinken Sie die öffentliche Seite."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETUP_STEP6="Testen Sie Anfrage, Bestätigung, Löschung und Abschluss auf einer Testinstallation mit einer Testadresse wie <code>test@example.org</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_TITLE="Einstellung «Kontaktpfad zum Websitebetreiber»"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_P1="Pflichtfeld ohne Standardwert. Interner Joomla-Pfad einer öffentlichen Seite, über welche die Person Sie erreicht, wenn kein Code ankommt."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI1="Der Pfad beginnt mit <code>index.php</code>, z.B. <code>index.php?option=com_contact&view=contact&id=42</code> oder <code>index.php?Itemid=42</code>. Verwenden Sie die tatsächliche ID Ihrer Website."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI2="Nicht erlaubt sind externe Adressen, Sprungmarken mit #, Leerzeichen und Steuerzeichen. Der Pfad hat höchstens 2048 Zeichen."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI3="Die öffentliche Seite zeigt den Link unter dem Formular. In der Anfrage erscheint er im Warnhinweis, wenn der Versand des Codes scheiterte. Ohne gültigen Pfad bittet die Seite, die Kontaktangaben der Website zu verwenden."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_SETTING_LI4="Eine Kontaktaufnahme bestätigt keine Anfrage und schliesst sie nicht ab."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_TITLE="Ablauf einer Anfrage"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP1="Die Person gibt ihre E-Mail-Adresse ein und wählt «Code anfordern oder erneuern»."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP2="Das Plugin legt eine ausstehende Löschanfrage an und sendet den Code mit der Joomla-E-Mail-Vorlage für Löschanfragen an genau diese Adresse. Super-Benutzer, für die der Empfang von Systemmails aktiviert ist, erhalten eine private Joomla-Nachricht. Die Seite antwortet immer gleich, damit niemand erfährt, ob eine Anfrage existiert."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP3="Die Person gibt Adresse und Code ein und wählt «Anfrage bestätigen». Joomla setzt die Anfrage auf bestätigt. Gelöscht ist damit noch nichts."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP4="Sie öffnen die Anfrage unter «Benutzer → Datenschutz → Anfragen» und führen die Löschung aus. Joomla ruft die Datenschutz-Plugins auf, z.B. «Privacy - J2Commerce Datenschutz» für Shopdaten."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_STEP5="Danach kreuzen Sie «Ich habe Löschumfang und Antwort an die anfragende Person geprüft» an und schliessen die Anfrage ab."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI1="Der Code ist 24 Stunden gültig und nur einmal verwendbar. Ist er abgelaufen, fordert die Person auf derselben Seite einen neuen an. Die Anfrage bleibt mit ihrem ursprünglichen Eingangsdatum bestehen."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI2="Gibt es für die Adresse bereits eine offene Löschanfrage, die nicht über diese Seite entstanden ist, legt das Plugin keine neue an und ändert die bestehende nicht. Eine bereits bestätigte Anfrage bleibt ebenfalls unverändert."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_FLOW_LI3="Die E-Mail kommt in der Sprache des Benutzerkontos mit dieser Adresse, sonst in der Standardsprache der Website."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_TITLE="Grenzen und Sperren"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI1="Die Seite nimmt nur einfache E-Mail-Adressen mit höchstens 100 Zeichen an, ohne Umlaute und andere Sonderzeichen, ohne Leerzeichen, Anführungszeichen und Klammern."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI2="Pro IP-Adresse sind innerhalb von 15 Minuten 20 Versuche zum Anfordern und 20 zum Bestätigen möglich, pro E-Mail-Adresse 5 Anforderungen. Gezählt wird jeder Versuch. Weitere Versuche beantwortet die Seite gleich, führt sie aber nicht aus."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI3="Die Zähler speichern keine Adressen, sondern nur mit dem Geheimschlüssel der Website gebildete Prüfsummen (HMAC)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI4="Den Status «Bestätigt» können Sie für Anfragen dieser Seite nicht von Hand setzen. Nur die Person selbst bestätigt mit dem Code."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI5="Das Abschliessen einer Löschanfrage ist gesperrt, bis die Löschung erfolgreich und ohne Warnung gelaufen ist und das Kontrollfeld zur Prüfung angekreuzt ist."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI6="Lief eine frühere Löschung unvollständig, verlangt ein erneuter Lauf das Kontrollfeld «Vor dem erneuten Löschlauf habe ich die frühere Teilbereinigung überprüft»."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI7="Zwei Lösch- oder Abschlussvorgänge derselben Anfrage laufen nie gleichzeitig. Der zweite wird mit einer Meldung abgelehnt."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_LI8="Findet Joomla ein Benutzerkonto, dessen Adresse nicht genau der Anfrage entspricht, z.B. muller@ für müller@, lehnt das Plugin die Löschung ab."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_LIMITS_NOTE1="Ist das Plugin deaktiviert, fallen diese Sperren weg. Bearbeiten und schliessen Sie Anfragen dieser Seite dann nicht ab."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_TITLE="Zusammenspiel mit J2Commerce und der Terminbuchung"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI1="Beide sind optional. Das Plugin braucht weder J2Commerce noch die Terminbuchung (com_appointments)."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI2="Mit «Privacy - J2Commerce Datenschutz» verarbeitet Joomla bei der Löschung auch die Gastbestellungen und Gastadressen mit der Adresse der Anfrage. Dort gelten die Aufbewahrungsfristen des Shops."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI3="Die Bestätigungsseite des Shop-Plugins für Anfragen, welche die Administration erstellt, bleibt unverändert. Dieses Plugin verwendet eine andere E-Mail-Vorlage und seine eigene Seite. Bereits versandte Links des Shops ändert es nicht."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI4="Mit der Terminbuchung verarbeitet deren Datenschutz-Plugin die Buchungen der Adresse. Ein dort eingetragener rechtlicher Grund kann die Löschung sperren."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI5="Meldet ein Plugin bei der Löschung eine Warnung, z.B. nicht entfernte Newsletterdaten, bleibt das Abschliessen gesperrt, bis ein erneuter Lauf ohne Warnung durchgeht."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_OTHERS_LI6="Daten in E-Mails, Kalendern, Sicherungen oder externen Systemen erfasst Joomla nicht. Prüfen Sie diese getrennt."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI1="<strong>Die Seite meldet, der Dienst sei nicht verfügbar:</strong> Der E-Mail-Versand ist ausgeschaltet, die Datenbank meldet einen Fehler, oder der Geheimschlüssel der Website fehlt. Details stehen im Protokoll unter der Kategorie <code>plg_system_privacyrequests</code>."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI2="<strong>Es kommt kein Code an:</strong> Prüfen Sie den E-Mail-Versand. Scheitert der Versand, bleibt die Anfrage ausstehend, die Anfrage zeigt einen Warnhinweis mit dem Kontaktlink, und die Super-Benutzer erhalten eine Nachricht. Nach der Behebung fordert die Person auf der Seite einen neuen Code an. Setzen Sie keine andere Adresse ein und ändern Sie den Status nicht von Hand."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI3="<strong>Die Adresse wird abgelehnt:</strong> Sie enthält Umlaute oder andere Sonderzeichen. Die Person verwendet eine andere Adresse oder den Kontaktweg."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI4="<strong>Abschliessen ist gesperrt:</strong> Führen Sie die Löschung zuerst erfolgreich und ohne Warnung aus und kreuzen Sie dann das Kontrollfeld zur Prüfung an."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI5="<strong>Meldung, ein anderer Vorgang laufe noch:</strong> Warten Sie, bis der andere Vorgang beendet ist, und versuchen Sie es erneut."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI6="<strong>Löschung wegen der Adresse abgelehnt:</strong> Joomla hat ein Konto mit einer abweichenden Adresse gefunden. Klären Sie die Adresse, bevor Sie Daten löschen."
PLG_SYSTEM_PRIVACYREQUESTS_HELP_PROBLEMS_LI7="<strong>Deinstallation:</strong> Sie entfernt die drei Hilfstabellen <code>#__privacy_guest_subjects</code>, <code>#__privacy_guest_attempts</code> und <code>#__privacy_guest_outcomes</code>. Anfragen und Aktionsprotokoll von Joomla bleiben. Schliessen Sie offene Anfragen dieser Seite vorher ab."
