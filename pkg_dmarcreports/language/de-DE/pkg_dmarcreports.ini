PKG_DMARCREPORTS="DMARC Reports Paket"
PKG_DMARCREPORTS_XML_DESCRIPTION="Vollständige DMARC- und TLS-RPT-Reporting-Lösung in einer Installation: die Komponente DMARC Reports, ihr Administrator-Dashboard-Modul, das Scheduler-Task-Plugin für die automatische Postfach-Erfassung und das MTA-STS-Policy-System-Plugin. Installieren, Aktualisieren und Entfernen des Pakets verwaltet alle vier Erweiterungen gemeinsam."
PKG_DMARCREPORTS_POSTINSTALL_INTRO="Die DMARC-Reports-Lösung ist installiert. Öffnen Sie <strong>Komponenten → DMARC Reports</strong>, legen Sie eine Postfach-Quelle an und aktivieren Sie die Erfassungsaufgabe unter <strong>System → Geplante Aufgaben</strong>, damit Berichte automatisch gesammelt werden."
PKG_DMARCREPORTS_POSTINSTALL_UPDATED="DMARC-Reports-Paket auf Version %s aktualisiert."
