COM_J2STORE_CLEANUP_COL_ENABLED="Status"
COM_J2STORE_CLEANUP_COL_ISSUES="Gefundene Probleme"
COM_J2STORE_CLEANUP_COL_DETAILS="Details"
COM_J2STORE_CLEANUP_CONFIRM_REMOVE="Die ausgewählten Erweiterungen entfernen? Ihre Deinstallationsskripte werden ausgeführt, ihre Dateien und Datenbankeinträge gelöscht. Dies kann nicht rückgängig gemacht werden."
COM_J2STORE_CLEANUP_BUTTON_REMOVE="Ausgewählte Erweiterungen entfernen"
COM_J2STORE_CLEANUP_ALL_COMPATIBLE_TITLE="Alle Erweiterungen sind kompatibel."
COM_J2STORE_CLEANUP_ALL_COMPATIBLE_DESC="Keine veralteten Schnittstellen gefunden. Die Erweiterungen sind bereit für J2Commerce 4.x und Joomla 5 und neuer."
