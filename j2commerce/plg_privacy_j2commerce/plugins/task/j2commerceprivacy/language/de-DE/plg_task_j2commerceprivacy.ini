PLG_TASK_J2COMMERCEPRIVACY="Task - J2Commerce Datenschutz-Bereinigung"
PLG_TASK_J2COMMERCEPRIVACY_XML_DESCRIPTION="Geplante Anonymisierung von abgelaufenen J2Commerce-Kundendaten."
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_TITLE="J2Commerce - Automatische Datenlöschung"
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_DESC="Anonymisiert J2Commerce-Kundendaten automatisch, sobald die konfigurierte Aufbewahrungsfrist abgelaufen ist."
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_LABEL="Aufbewahrungsfrist (Jahre)"
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_DESC="Aufbewahrungsfrist in Jahren ab dem Ende des Geschäftsjahres der Bestellung. Die Bestelldaten registrierter Benutzer werden anonymisiert, wenn ihre neueste Bestellung ausserhalb der Frist liegt. Gastbestellungen werden einzeln anonymisiert, sobald ihre Frist abgelaufen ist."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_LABEL="Geschäftsjahresende (MM-TT)"
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_INVALID="Geschäftsjahresende: bitte einen existierenden Tag als MM-TT eingeben, z.B. 12-31 oder 06-30."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_DESC="Letzter Tag des Geschäftsjahres als MM-TT, z.B. 12-31. Die Aufbewahrungsfrist einer Bestellung beginnt mit dem Ende ihres Geschäftsjahres (OR Art. 958f), bestimmt in der Zeitzone der Website. 02-29 bedeutet den letzten Tag im Februar."
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_LABEL="Bestellungen anonymisieren"
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_DESC="Bestellnotizen, IP-Adressen, E-Mail-Adressen sowie Rechnungs- und Lieferdaten anonymisieren."
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_LABEL="Adressen löschen"
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_DESC="Gespeicherte J2Commerce-Adressen von Benutzern löschen, deren Aufbewahrungsfrist abgelaufen ist."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_TASK_J2COMMERCEPRIVACY_HELP_NOTE="Was dieses Plugin tut, wie Sie es einrichten und was bei Problemen zu tun ist, erklärt der Tab «Hilfe». Das Plugin wird zusammen mit dem Plugin «Privacy - J2Commerce Datenschutz» installiert und aktualisiert. Dessen Tab «Hilfe» erklärt die ganze Funktion."
PLG_TASK_J2COMMERCEPRIVACY_HELP_TAB="Hilfe"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="Was dieses Plugin tut"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P1="Dieses Plugin stellt in den geplanten Aufgaben von Joomla den Aufgabentyp «J2Commerce - Automatische Datenlöschung» bereit. Die Aufgabe anonymisiert Shopdaten, deren Aufbewahrungsfrist abgelaufen ist, auch ohne Datenschutzanfrage. Bei jedem Lauf geschieht in allen vorhandenen Shop-Tabellen (J2Commerce 6 und J2Store 4) Folgendes:"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI1="Registrierte Kundinnen und Kunden, deren neueste Bestellung ausserhalb der Frist liegt: Alle ihre Bestellungen werden anonymisiert (bei «Bestellungen anonymisieren» auf «Ja»), und ihre gespeicherten Adressen werden gelöscht (bei «Adressen löschen» auf «Ja»)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI2="Gastbestellungen ausserhalb der Frist werden einzeln anonymisiert, sofern sie noch Personendaten enthalten (bei «Bestellungen anonymisieren» auf «Ja»)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI3="Bestellungen mit einem als unbefristete Lizenz markierten Produkt behalten ihre E-Mail-Adresse. Kann die Aufgabe die Markierung nicht lesen, behält sie die E-Mail-Adresse aller betroffenen Bestellungen."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI4="Einwilligungen aus dem Checkout und Newsletter-Einwilligungen aus dem Checkout verlieren IP-Adresse und User-Agent, wenn ihre Bestellung anonymisiert oder gelöscht ist oder der Eintrag ausserhalb der Frist liegt. Der Eintrag selbst bleibt als Nachweis."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI5="Einwilligungseinträge einer früheren Template-Version werden anonymisiert und als ungültig markiert."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI6="Abgelaufene Zähler der Bestätigungsseite für Gastanfragen werden gelöscht."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI7="Kontakte in AcyMailing, welche die Pseudonymisierung eines Benutzerkontos durch Joomla angelegt hat (Adresse <code>UserID…removed@email.invalid</code>), werden gelöscht. Das gilt nur, wenn das Konto pseudonymisiert ist, der Kontakt genau dessen Platzhalteradresse trägt und keinen Listeneintrag hat."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P2="Anonymisiert wird wie bei einer Löschanfrage: E-Mail-Adresse, Namen, Adressen, Telefon- und Faxnummern, Firma, Steuernummer, Bestellnotiz und IP-Adresse. Bestellnummer, Datum, Beträge und Produkte bleiben. Benutzerkonten, Warenkörbe, Gastadressen und Newsletter-Abonnenten ändert die Aufgabe nicht, ausser den oben genannten Platzhalter-Kontakten in AcyMailing. Dafür ist eine Löschanfrage nötig."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Einstellungen der Aufgabe"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="Dieses Plugin hat ausser diesem Tab keine eigenen Einstellungen. Die Werte stellen Sie in der Aufgabe unter «System → Verwalten → Geplante Aufgaben» ein. Sie gelten nur für diese Aufgabe. Die Einstellungen des Plugins «Privacy - J2Commerce Datenschutz» übernimmt die Aufgabe nicht, tragen Sie deshalb dieselben Werte ein."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="«Aufbewahrungsfrist (Jahre)» (Standard: 10, Pflichtfeld, erlaubt 1 bis 30): Frist in Jahren ab dem Ende des Geschäftsjahres der Bestellung."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="«Geschäftsjahresende (MM-TT)» (Standard: 12-31): Letzter Tag des Geschäftsjahres. 02-29 bedeutet den letzten Tag im Februar. Einen ungültigen gespeicherten Wert ersetzt die Aufgabe durch 12-31 und schreibt das ins Protokoll."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="«Bestellungen anonymisieren» (Standard: Ja): Bei «Nein» anonymisiert die Aufgabe keine Bestellungen, auch keine Gastbestellungen. Einwilligungen ausserhalb der Frist verlieren IP-Adresse und User-Agent trotzdem."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI4="«Adressen löschen» (Standard: Ja): Löscht die gespeicherten Adressen der registrierten Kundinnen und Kunden, deren neueste Bestellung ausserhalb der Frist liegt. Bei «Nein» bleiben sie erhalten."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P2="Die Frist einer Bestellung endet am Ende ihres Geschäftsjahres plus die eingestellten Jahre, um 23:59:59 Uhr in der Zeitzone der Website. Beispiel mit 10 Jahren und 12-31: Eine Bestellung vom 15. März 2016 bleibt bis 31. Dezember 2026 erhalten und wird beim ersten Lauf ab 1. Januar 2027 anonymisiert."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_TITLE="Aufgabe einrichten"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP1="Prüfen Sie, ob dieses Plugin aktiviert ist."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP2="Wählen Sie unter «System → Verwalten → Geplante Aufgaben → Neu» den Typ «J2Commerce - Automatische Datenlöschung»."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP3="Tragen Sie dieselben Werte ein wie im Plugin «Privacy - J2Commerce Datenschutz»."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP4="Wählen Sie eine tägliche Ausführung, z.B. um 02:00 Uhr, aktivieren und speichern Sie die Aufgabe."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP5="Richten Sie einen zuverlässigen Auslöser ein, einen Cronjob mit <code>php cli/joomla.php scheduler:run</code> oder den Web-Cron von Joomla. Ohne ihn startet Joomla Aufgaben nur bei Seitenaufrufen."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_NOTE1="Es gibt keinen Probelauf. Anonymisierte Daten lassen sich nicht wiederherstellen. Testen Sie die Aufgabe zuerst auf einer Testinstallation mit Testdaten. Die Joomla-Aufgabe vom Typ <code>privacy.consent</code> ist eine andere Aufgabe und ersetzt diese nicht."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, Update und Deaktivierung"
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="Der Installer des Plugins «Privacy - J2Commerce Datenschutz» installiert dieses Plugin und aktiviert es bei der ersten Installation. Ein Update behält den Zustand (aktiviert oder deaktiviert). Ein eigenes Update gibt es nicht."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="Die Aufgabe verwendet Programmteile des Datenschutz-Plugins. Fehlen sie, endet sie mit einem Fehlerstatus und anonymisiert nichts."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="Die Deinstallation des Datenschutz-Plugins entfernt auch dieses Plugin und alle Aufgaben dieses Typs. Bereits anonymisierte Daten bleiben anonymisiert."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI4="Ist dieses Plugin deaktiviert, bietet Joomla den Aufgabentyp nicht mehr an, und bestehende Aufgaben dieses Typs bearbeiten keine Daten. Abgelaufene Daten bleiben dann erhalten, bis eine Löschanfrage sie anonymisiert oder Sie das Plugin wieder aktivieren."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Typische Probleme und Lösungen"
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>Der Aufgabentyp fehlt:</strong> Aktivieren Sie dieses Plugin."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>Die Aufgabe läuft nicht:</strong> Prüfen Sie, ob die Aufgabe aktiviert ist, ob der Zeitplan stimmt und ob ein Auslöser läuft. Den Verlauf der Läufe zeigt die Aufgabe in «System → Verwalten → Geplante Aufgaben»."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>Die Aufgabe endet mit Fehlerstatus:</strong> Lesen Sie das Protokoll der Aufgabe. Fehler bei Gastbestellungen, bei Einwilligungseinträgen, bei Platzhalter-Kontakten in AcyMailing, beim Löschen der Zähler oder bei allen Benutzern führen zu diesem Status. Scheitern nur einzelne Benutzer, meldet die Aufgabe Erfolg, nennt die Fehler aber im Protokoll."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>Eine Bestellung wurde nicht anonymisiert:</strong> Sie liegt noch innerhalb der Frist, die Person hat eine neuere Bestellung innerhalb der Frist, «Bestellungen anonymisieren» steht auf «Nein», oder die Bestellung hat eine unbefristete Lizenz und behält deshalb ihre E-Mail-Adresse."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI5="<strong>Warnung zu mehrfach vergebenen Bestellnummern:</strong> Gehört eine Bestellnummer auch zu einer anderen Bestellung, lässt die Aufgabe die Rechnungs- und Lieferdaten und die Einwilligung dieser Nummer unverändert. Prüfen Sie solche Bestellungen von Hand."
