COM_APPOINTMENTS_MENU_FIELD_SHOW_BACK_DESC="Le bouton « Retour aux rendez-vous » sur la page de réservation de cet élément de menu. Masqué par défaut : cet élément de menu ouvre un seul type de rendez-vous, et le bouton mènerait à la liste de tous les types. Tant qu'il est masqué, la confirmation et les pages ouvertes par les liens des e-mails ramènent à cette page de réservation."
