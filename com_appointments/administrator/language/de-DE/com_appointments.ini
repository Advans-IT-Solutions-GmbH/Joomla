COM_APPOINTMENTS_CLOSE_CREDENTIAL_DESC="Gespeichert wird nur der Name der Variable. Sie gilt für die Terminarten dieses Profils, die im Reiter «Close CRM» keinen eigenen Schlüssel haben. Für jede Close-Organisation eine eigene Variable verwenden. Nie den Schlüssel selbst hier eintragen."
