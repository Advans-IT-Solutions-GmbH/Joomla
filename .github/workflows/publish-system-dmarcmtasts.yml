name: Publish - DMARC Reports MTA-STS Plugin

on:
  # A manual run only recovers a release whose push-triggered publication never ran,
  # for example because Actions could not start jobs. It builds the merged release
  # commit of the given version, never the current main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish (x.y.z), as in the merged release PR'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'plg_system_dmarcmtasts/**'

concurrency:
  group: publish-system-dmarcmtasts-v
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: system-dmarcmtasts v'))"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out exactly the released source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Builds only the merged release commit, also on a manual run, and compares the
          # trees of every bundled path with it. Runs a copy: the checkout replaces the files.
          cp .github/scripts/release-source.py "$RUNNER_TEMP/release-source.py"
          python3 "$RUNNER_TEMP/release-source.py" --prefix "system-dmarcmtasts" \
            --path plg_system_dmarcmtasts \
            --path shared/build \
            --path .github/scripts \
            --provenance-out "$RUNNER_TEMP/provenance.json"

      - name: Read version from manifest
        id: version
        run: |
          XML_FILE="plg_system_dmarcmtasts/dmarcmtasts.xml"
          VERSION=$(grep -oP '(?<=<version>)[^<]+' "$XML_FILE")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check publication version and built commit
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-release.py preflight \
            --prefix "system-dmarcmtasts-v" --version "${{ steps.version.outputs.new }}"

      - name: Confirm that the build source is the verified release commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
        run: |
          # The tag, the release notes and the attestation all name this one commit.
          if [ -z "$SOURCE_SHA" ] || [ "$SOURCE_SHA" != "$BUILT_SHA" ] || [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "::error::The build source $BUILT_SHA is not the verified release commit $SOURCE_SHA."
            exit 1
          fi

      - name: Build extension
        run: |
          cd plg_system_dmarcmtasts
          chmod +x build.sh
          ./build.sh

      - name: Find package file
        id: package
        run: |
          cd plg_system_dmarcmtasts
          PACKAGE=$(ls -1 plg_system_dmarcmtasts_*.zip | head -1)
          echo "file=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.preflight.outputs.previous_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -- plg_system_dmarcmtasts/ | awk '!/\[skip ci\]/ && !/^- release:/ { if (count++ < 20) print }')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.preflight.outputs.sha }}
          TAG: system-dmarcmtasts-v${{ steps.version.outputs.new }}
          NOTES: |
            ## DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}

            System plugin that serves the MTA-STS policy (RFC 8461) for the
            DMARC Reports component dynamically at
            https://mta-sts.<domain>/.well-known/mta-sts.txt, built from the
            component's options with no hand-maintained static file. The DNS
            records and the one manual subdomain/TLS step are shown in the
            component's Action Center.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Source
            Built from the release commit ${{ steps.source.outputs.sha }}.

            ### Installation
            1. Download `${{ steps.package.outputs.file }}`
            2. Install via Joomla Extension Manager
            3. Enable the plugin and configure MTA-STS in the DMARC Reports
               component options

            ### Requirements
            - Joomla 5.4 or later (5.4.x, 6.x)
            - PHP 8.1 or higher
            - The DMARC Reports component (com_dmarcreports)

            ### License
            GNU General Public License version 3 or later (GPL-3.0-or-later)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/publish-release.py publish \
            --prefix "system-dmarcmtasts-v" --version "${{ steps.version.outputs.new }}" \
            --package "plg_system_dmarcmtasts/${{ steps.package.outputs.file }}" \
            --title "DMARC Reports MTA-STS Policy Plugin v${{ steps.version.outputs.new }}"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plg_system_dmarcmtasts/${{ steps.package.outputs.file }}

      - name: Attest the provenance of the recovered release commit
        # A manual run starts from the current main, so GitHub's derived provenance would
        # name that commit. This predicate names the verified release commit instead.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: plg_system_dmarcmtasts/${{ steps.package.outputs.file }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/provenance.json
