; Help tab of the module edit screen (manifest, field type helppage)
MOD_APPOINTMENTS_HELP_NOTE="The 'Help' tab explains what this module shows, who sees it and what to do if something goes wrong."
MOD_APPOINTMENTS_HELP_TAB="Help"
MOD_APPOINTMENTS_HELP_WHAT_TITLE="What this module shows"
MOD_APPOINTMENTS_HELP_WHAT_P1="The module shows the next appointments of the Appointments component on the administrator Home Dashboard."
MOD_APPOINTMENTS_HELP_WHAT_LI1="The next pending or confirmed appointments, as many as set under 'Number of appointments', with date and time in the time zone of the website (Global Configuration, 'Website Time Zone'), the event type and the name of the booking person. Pending appointments are marked 'Awaiting approval'. A click opens the booking."
MOD_APPOINTMENTS_HELP_WHAT_LI2="The number of bookings made since your last visit, per user: the module stores the time of your last view of the dashboard with your user account and counts the bookings made after it. The reference stays the same until you log in again. On your very first visit there is no number yet."
MOD_APPOINTMENTS_HELP_WHAT_LI3="Past, cancelled and erased appointments are not listed. Erased bookings are not counted."
MOD_APPOINTMENTS_HELP_WHAT_LI4="'Open bookings' leads to the bookings list of the component."
MOD_APPOINTMENTS_HELP_ACCESS_TITLE="Who sees what"
MOD_APPOINTMENTS_HELP_ACCESS_P1="The module follows the rules of the bookings list: a user sees it only with 'Access Administration Interface' on the component and 'Edit' on at least one event type, and then only the appointments of those event types. Everybody else sees nothing at all, not even the title of the module. The help page of the component explains the permissions and how to give another account access (section 'Permissions')."
MOD_APPOINTMENTS_HELP_ACCESS_NOTE="Names of booking persons are personal data. Give access only to accounts that need it."
MOD_APPOINTMENTS_HELP_SETUP_TITLE="Setup"
MOD_APPOINTMENTS_HELP_SETUP_STEP1="The component installs the module on its first installation, publishes it at the position 'cpanel' of the Home Dashboard and names it 'Next appointments'. An update keeps position, title and state as you set them."
MOD_APPOINTMENTS_HELP_SETUP_STEP2="Under System, Administrator Modules you change the title, the number of appointments, the position and the access level, or unpublish the module."
MOD_APPOINTMENTS_HELP_SETUP_STEP3="Uninstalling the component removes the module and the stored times of the last visits."
MOD_APPOINTMENTS_HELP_PROBLEMS_TITLE="Problems and what to do"
MOD_APPOINTMENTS_HELP_PROBLEMS_LI1="The module is missing on the dashboard: check that it is published at the position 'cpanel' and that your account has the permissions under 'Who sees what'."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI2="'The appointments could not be loaded.': the cause is in the Joomla log (category com_appointments). Check that the component is enabled and run its system checks."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI3="A time differs from the bookings list: the module shows the time zone of the website, the bookings list shows UTC."
