PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CHECK_CONSENT="Datenschutzerklärung als Artikel verlinkt (falls das Kontrollfeld für die Einwilligung aktiv ist)"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CHECK_OVERRIDES="Template-Overrides im aktiven Template geprüft (Einwilligung im Checkout und Registerkarte Datenschutz in MyProfile)"
