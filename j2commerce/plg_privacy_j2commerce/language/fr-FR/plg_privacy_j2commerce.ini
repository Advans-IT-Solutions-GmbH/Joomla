PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_INSTALL_FAILED="Le plugin de tâche inclus (Tâche - Nettoyage confidentialité J2Commerce) n'a pas pu être installé automatiquement. La tâche de nettoyage automatique n'est disponible qu'après son installation."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_MISSING="Ni J2Commerce 6 (com_j2commerce) ni J2Store/J2Commerce 4 (com_j2store) n'est installé. Le plugin n'a aucune donnée J2Commerce à traiter tant que l'un des deux n'est pas installé."
PLG_PRIVACY_J2COMMERCE_WARN_OVERRIDES_FAILED="Les substitutions de template suivantes n'ont pas pu être copiées : %s. Copiez-les manuellement depuis plugins/privacy/j2commerce/overrides/."
