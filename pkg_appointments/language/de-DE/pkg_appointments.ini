PKG_APPOINTMENTS="Paket Termine"
PKG_APPOINTMENTS_XML_DESCRIPTION="Selbst gehostete Terminbuchung in einer Installation: die Komponente Termine, ihr Dashboard-Modul für den Administrationsbereich und ihre sechs Plugins (geplante Aufgaben, Datenschutzanfragen, Datenschutz-Einwilligung, Internetkalender, Herkunft der Buchungen und Schlüssel bei der Anmeldung). Installieren, Aktualisieren und Entfernen des Pakets verwaltet alle gemeinsam. Über die eigenständige Komponente einer früheren Version installiert, übernimmt das Paket sie mit allen Daten, Einstellungen und Aktivierungszuständen."
PKG_APPOINTMENTS_POSTINSTALL_INTRO="Das Paket Termine ist installiert. Öffnen Sie <strong>Komponenten → Termine</strong>, um Zeitpläne und Veranstaltungstypen einzurichten. Das Dashboard-Modul zeigt die nächsten Termine auf der Startseite des Administrationsbereichs. Die geplanten Aufgaben, die die Komponente braucht, legt die Installation an, ihre Meldungen sagen es."
PKG_APPOINTMENTS_POSTINSTALL_UPDATED="Paket Termine auf Version %s aktualisiert."
PKG_APPOINTMENTS_POSTINSTALL_MIGRATED="Termine läuft jetzt als Paket (Version %s). Komponente, Modul und Plugins wurden übernommen, wie sie waren: Daten, Einstellungen und Aktivierungszustände sind unverändert. Updates kommen jetzt über das Paket."
PKG_APPOINTMENTS_INSTALL_CHILD_NEWER="%1$s ist in Version %2$s installiert, die neuer ist als die Version %3$s in diesem Paket. Die Installation wurde angehalten, es wurde nichts geändert. Installieren Sie das aktuelle Paket Termine."
PKG_APPOINTMENTS_UPDATE_CHANNEL_WARNING="Das Paket Termine wurde installiert oder aktualisiert, aber Joomla konnte nicht alle gebündelten Erweiterungen auf den Paket-Updatekanal umstellen. Einzelne Erweiterungen können weiterhin eigenständige Updates erhalten. Aktualisieren Sie das Paket erneut, um die Umstellung zu wiederholen."
PKG_APPOINTMENTS_INSTALL_CONFLICT_ERROR="Appointments konnte die bestehenden Dateien nicht sicher prüfen. Die Installation wurde angehalten. Prüfen Sie das Installer-Protokoll."
PKG_APPOINTMENTS_INSTALL_CONFLICT_TITLE="Die Installation von Appointments wurde vor dem Kopieren der Dateien angehalten."
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXPLANATION="Die folgenden bestehenden Dateien unterscheiden sich vom Paket und sind nicht als unveränderte Release-Dateien bekannt. Das bedeutet nicht, dass sie bearbeitet wurden. Es wurden keine Dateiinhalte auf dem Server kopiert. Laden Sie jede Datei in der Appointments-Wiederherstellung auf Ihren Computer herunter, bevor Sie den Ersatz freigeben, und starten Sie danach dasselbe Update erneut."
PKG_APPOINTMENTS_INSTALL_CONFLICT_REVIEW="Appointments-Wiederherstellung öffnen"
PKG_APPOINTMENTS_INSTALL_CONFLICT_EXISTING="Bestehender SHA-256"
PKG_APPOINTMENTS_INSTALL_CONFLICT_INCOMING="Neuer SHA-256 (oder Entfernungsaktion)"
PKG_APPOINTMENTS_INSTALL_TASK_FAILED="Die geplante Aufgabe «%s» konnte nicht angelegt werden. Legen Sie sie unter System, Geplante Aufgaben selbst an."
PKG_APPOINTMENTS_INSTALL_TASK_DISABLED="Die optionale geplante Aufgabe «%s» ist angelegt, aber ausgeschaltet: Sie wird erst gebraucht, wenn die Übertragung der Buchungen an Close eingerichtet ist. Schalten Sie sie dann unter System, Geplante Aufgaben ein."
PKG_APPOINTMENTS_MODULE_DEFAULT_TITLE="Nächste Termine"
PKG_APPOINTMENTS_UNINSTALL_RETAINED_ACL_CONFLICT="Die Appointments-Berechtigungen konnten nicht behalten werden, weil bereits ein weiterer gespeicherter Berechtigungsbaum besteht. Beheben Sie das doppelte Asset vor einem erneuten Deinstallationsversuch. Es wurde nichts entfernt."
