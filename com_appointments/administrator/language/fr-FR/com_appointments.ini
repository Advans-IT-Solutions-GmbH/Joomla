COM_APPOINTMENTS_TEAM_D_MAIL_ACCOUNT_LOCKED_BODY="Bonjour {user_name},\n\nLe compte {account_name} ({account_username}) disposant d'un droit sur les calendriers Internet sur {site_name} est bloqué pendant {minutes} minutes après des échecs de connexion répétés. Le blocage prend fin de lui-même. Il empêche aussi la connexion avec le bon mot de passe.\n\nSi quelqu'un d'autre provoque ces échecs, la personne concernée est bloquée. Vous pouvez lever le blocage dans l'administration sous Calendriers Internet, Appareils.\n\nAppareils :\n{devices_url}"
