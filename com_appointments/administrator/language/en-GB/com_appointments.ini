; Installed as editable site-wide defaults; the mandatory action footer is added separately.
COM_APPOINTMENTS_MAIL_CONFIRMATION_SUBJECT="Confirmed: {event_title}"
COM_APPOINTMENTS_MAIL_CONFIRMATION_BODY="Hello {invitee_name},\n\nYour appointment is confirmed.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\nLocation: {location}\n{conference_url}\n\nThe attached calendar invitation adds this appointment to your calendar."
COM_APPOINTMENTS_MAIL_PENDING_SUBJECT="Awaiting approval: {event_title}"
COM_APPOINTMENTS_MAIL_PENDING_BODY="Hello {invitee_name},\n\nYour requested time is held while the host reviews it.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\n\nThe attached calendar invitation is tentative until approval."
COM_APPOINTMENTS_MAIL_APPROVED_SUBJECT="Approved: {event_title}"
COM_APPOINTMENTS_MAIL_APPROVED_BODY="Hello {invitee_name},\n\nThe host has approved your appointment.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\nLocation: {location}\n{conference_url}\n\nAccept the attached invitation to update your calendar."
COM_APPOINTMENTS_MAIL_RESCHEDULE_SUBJECT="New time: {event_title}"
COM_APPOINTMENTS_MAIL_RESCHEDULE_BODY="Hello {invitee_name},\n\nYour appointment has a new time.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\nLocation: {location}\n{conference_url}\n\nThe attached invitation updates the existing calendar entry."
COM_APPOINTMENTS_MAIL_CANCELLATION_SUBJECT="Cancelled: {event_title}"
COM_APPOINTMENTS_MAIL_CANCELLATION_BODY="The appointment has been cancelled.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\n\nThe attached calendar cancellation removes the existing entry."
COM_APPOINTMENTS_MAIL_REMINDER_SUBJECT="Reminder: {event_title}"
COM_APPOINTMENTS_MAIL_REMINDER_BODY="Hello {invitee_name},\n\nYour appointment is coming up.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\nLocation: {location}\n{conference_url}\n\nThe current calendar invitation is attached."
COM_APPOINTMENTS_MAIL_HOST_NOTICE_SUBJECT="New appointment: {event_title}"
COM_APPOINTMENTS_MAIL_HOST_NOTICE_BODY="A new appointment has been received.\n{event_title}\nStatus: {state_label}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\nInvitee: {invitee_name}\nEmail: {invitee_email}\nTelephone: {invitee_phone}\nGuests: {guest_emails}\nLocation: {location}\n{conference_url}\n\nThe calendar invitation is attached."
COM_APPOINTMENTS_MAIL_ERASURE_NOTICE_SUBJECT="Cancelled: {event_title}"
COM_APPOINTMENTS_MAIL_ERASURE_NOTICE_BODY="The appointment has been cancelled.\n{event_title}\nFrom: {start}\nTo: {end}\nTime zone: {timezone}\n\nThe calendar cancellation is attached."
