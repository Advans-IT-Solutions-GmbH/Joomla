; Help tab
PLG_AJAX_JOOMLAAJAXFORMS_HELP_NOTE="What this plugin does, how to set it up and what to do when something goes wrong is explained on the «Help» tab."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_TAB="Help"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_TITLE="What the plugin does"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P1="The plugin sends Joomla's account forms in the background (AJAX) and shows the answer directly in the form. The page is not reloaded."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI1="<strong>Login and logout</strong>, with a redirect to Joomla's verification page when two-factor authentication is set up for the account."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI2="<strong>Registration</strong> of a new user account."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI3="<strong>Password reset</strong>: request of the e-mail for resetting the password."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI4="<strong>Username reminder</strong>: request of the e-mail with the username."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI5="<strong>Profile</strong>: saving the user profile with all fields of Joomla's profile form, including fields of profile plugins."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_LI6="<strong>Shop cart</strong> of J2Store 4 or J2Commerce 6: removing an item (customers who are logged in only) and reading the number of items."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_P2="The same rules apply as in Joomla's own forms: the options of the Users component (whether registration is allowed, password rules, captcha, allowed e-mail domains) and the fields other plugins add, for example the privacy consent. The e-mails use Joomla's mail templates of the Users component."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_WHAT_NOTE="The plugin has no page of its own and creates no tables. It only changes how the existing forms are sent."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_TITLE="Prerequisites and setup"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP1="Joomla 5.4 or later and PHP 8.1 or later. The cart functions need J2Store 4 (component <code>com_j2store</code>) or J2Commerce 6 (component <code>com_j2commerce</code>), installed and enabled. All other forms work without a shop."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP2="Enable the plugin under <strong>System → Manage → Plugins</strong> (search for <strong>Joomla! AJAX Forms</strong>)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP3="Load the script <code>plg_ajax_joomlaajaxforms/joomlaajaxforms.js</code> in the site template, for example in the template's <code>index.php</code> or in a template override. The plugin does not load the script itself. Without it the forms are sent the normal way. The plugin README shows the code (section «Template Integration»)."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP4="The script finds Joomla's forms itself: the login form (also the login module), registration, password reset, username reminder and profile editing. If a template override replaces the markup of the reset or reminder form, add the attribute <code>data-joomlaajaxforms</code> with the value <code>reset</code> or <code>remind</code> to its <code>form</code> element."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETUP_STEP5="On every installation and update the plugin checks the site's <code>.htaccess</code>. If it blocks addresses with <code>/component/</code> or <code>index.php?option=com_</code> without an exception for <code>com_ajax</code>, a warning names the missing exception. Add it, otherwise every request of the plugin fails."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_TITLE="Settings"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_P1="The settings are on the «Plugin» tab. For the five forms: while a setting is set to «No», the script sends that form to Joomla the normal way, with a page reload. Switch a form off if it is to work without AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI1="<strong>«Enable Login»</strong> (default «Yes»): sends the login form with AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI2="<strong>«Enable Registration»</strong> (default «Yes»): sends the registration form with AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI3="<strong>«Enable Password Reset»</strong> (default «Yes»): sends the password reset form with AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI4="<strong>«Enable Username Reminder»</strong> (default «Yes»): sends the username reminder form with AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI5="<strong>«Enable Profile»</strong> (default «Yes»): saves the profile form with AJAX."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI6="<strong>«Enable Shop Cart»</strong> (default «Yes»): removing a cart item and reading the number of items. While it is set to «No», these requests answer «This feature is currently disabled.». Set it to «No» if your site does not use these functions."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_LI7="<strong>«Debug Output»</strong> (default «No»): writes developer messages of the plugin to the browser console. Failed requests are reported there even without this setting. Switch it on only to look for a fault and switch it off again afterwards."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SETTINGS_NOTE="Logout is always handled and has no setting of its own."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_TITLE="Security and privacy"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI1="Every request except loading the texts of the script needs Joomla's form token. The plugin refuses requests without a valid token."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI2="A failed login always gets the same message, which does not reveal whether an account exists. Only when the password was correct does the plugin say that the account is not confirmed yet or still awaits approval, and it names the site's e-mail address."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI3="Password reset and username reminder always give the same answer, whether the address is known or not. The reset keeps the limit set in the options of the Users component (number of requests within a period) and never resets the password of a Super User from the site."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI4="If two-factor authentication is set up or a user must change the password first, Joomla's own pages take over. Profile and cart are reachable through the plugin only afterwards."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI5="A customer can only remove items from their own cart. Guests always get 0 as the number of items."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_SECURITY_LI6="The plugin keeps no data of its own. Personal data such as name and e-mail address is stored only where Joomla and the shop store it anyway."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_TITLE="Typical problems and what to do"
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI1="<strong>The page reloads on sending, as without the plugin.</strong> Check that the plugin is enabled, that the template loads the script and that the form's setting is «Yes». A template override of the reset or reminder form often lacks the attribute <code>data-joomlaajaxforms</code>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI2="<strong>Forms show «An error occurred. Please try again.» or do not react.</strong> Usually the <code>.htaccess</code> blocks calls to <code>com_ajax</code>. Add the exception named in the installation warning. Then switch on «Debug Output» for a short time and check the browser console."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI3="<strong>«User registration is currently disabled.»</strong> Registration is switched off in the options of the Users component. Switch it on there if visitors are to register."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI4="<strong>A new user cannot log in.</strong> The account is not confirmed yet or awaits approval by an administrator. The login message says which case applies. You approve accounts under <strong>Users → Manage</strong>."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI5="<strong>No e-mails arrive.</strong> Check the mail settings in the Global Configuration. If an e-mail cannot be sent, the plugin writes an entry to the Joomla log (category <code>plg_ajax_joomlaajaxforms</code>). Whether Joomla keeps these entries depends on the logging settings of the site."
PLG_AJAX_JOOMLAAJAXFORMS_HELP_PROBLEMS_LI6="<strong>Cart: «J2Commerce is not installed or not active.»</strong> Neither J2Commerce 6 nor J2Store 4 is enabled together with its tables. Enable the shop component. When both are enabled, the plugin uses J2Commerce 6."
