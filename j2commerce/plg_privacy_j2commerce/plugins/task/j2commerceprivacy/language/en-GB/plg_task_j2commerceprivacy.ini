PLG_TASK_J2COMMERCEPRIVACY="Task - J2Commerce Privacy Cleanup"
PLG_TASK_J2COMMERCEPRIVACY_XML_DESCRIPTION="Scheduled anonymization task for expired J2Commerce customer data."
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_TITLE="J2Commerce - Automatic data cleanup"
PLG_TASK_J2COMMERCEPRIVACY_TASK_AUTOCLEANUP_DESC="Automatically anonymizes J2Commerce customer data after the configured retention period expires."
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_LABEL="Retention period (years)"
PLG_TASK_J2COMMERCEPRIVACY_RETENTION_YEARS_DESC="Retention period in years from the end of the fiscal year of the order. Registered users' order data is anonymised when their newest order is outside the period. Guest orders are anonymised one by one once their period has expired."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_LABEL="Fiscal year end (MM-DD)"
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_INVALID="Fiscal year end: enter an existing day as MM-DD, e.g. 12-31 or 06-30."
PLG_TASK_J2COMMERCEPRIVACY_FISCAL_YEAR_END_DESC="Last day of the fiscal year as MM-DD, e.g. 12-31. The retention period of an order starts at the end of its fiscal year (OR Art. 958f), determined in the website time zone. 02-29 means the last day of February."
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_LABEL="Anonymize orders"
PLG_TASK_J2COMMERCEPRIVACY_ANONYMIZE_ORDERS_DESC="Anonymize order notes, IP addresses, e-mail addresses and billing/shipping data."
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_LABEL="Delete addresses"
PLG_TASK_J2COMMERCEPRIVACY_DELETE_ADDRESSES_DESC="Delete saved J2Commerce addresses for users whose data retention period has expired."

; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_TASK_J2COMMERCEPRIVACY_HELP_NOTE="The ‘Help’ tab explains what this plugin does, how to set it up and what to do if something goes wrong. The plugin is installed and updated together with the plugin ‘Privacy - J2Commerce’, whose ‘Help’ tab explains the whole function."
PLG_TASK_J2COMMERCEPRIVACY_HELP_TAB="Help"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_TITLE="What this plugin does"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P1="This plugin provides the task type ‘J2Commerce - Automatic data cleanup’ in Joomla's scheduled tasks. The task anonymises shop data whose retention period has ended, also without a privacy request. On every run, the following happens in all existing shop tables (J2Commerce 6 and J2Store 4):"
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI1="Registered customers whose newest order is outside the period: all their orders are anonymised (with ‘Anonymize orders’ set to ‘Yes’) and their saved addresses are deleted (with ‘Delete addresses’ set to ‘Yes’)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI2="Guest orders outside the period are anonymised one by one, as long as they still contain personal data (with ‘Anonymize orders’ set to ‘Yes’)."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI3="Orders with a product flagged as lifetime licence keep their e-mail address. If the task cannot read the flag, it keeps the e-mail address of all affected orders."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI4="Checkout consents and newsletter consents given at checkout lose their IP address and user agent when their order is anonymised or deleted or the record is outside the period. The record itself stays as evidence. Newsletter consents given at checkout whose order no longer carries an address or a user account (anonymised or deleted) also become invalid, because nobody can be named for them any more."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI5="Consent records of an earlier template version are anonymised and marked as invalid."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI6="Expired counters of the confirmation page for guest requests are deleted."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_LI7="AcyMailing contacts that Joomla's pseudonymisation of a user account created (address <code>UserID…removed@email.invalid</code>) are deleted, but only if the account is pseudonymised, the contact carries exactly its placeholder address, has no list entry and the removal request of the account is complete."
PLG_TASK_J2COMMERCEPRIVACY_HELP_WHAT_P2="Anonymisation works as for a removal request: e-mail address, names, addresses, phone and fax numbers, company, tax number, order note and IP address. Order number, date, amounts and products stay. The task does not change user accounts, carts, guest addresses or newsletter subscribers, apart from the AcyMailing placeholder contacts above. That requires a removal request."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_TITLE="Task settings"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P1="Apart from this tab, this plugin has no settings of its own. The values are set in the task under ‘System → Manage → Scheduled Tasks’ and apply to this task only. A task the installation creates takes over the retention period and fiscal year end of the plugin ‘Privacy - J2Commerce’; if you change them there later, change them in the task as well."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI1="‘Retention period (years)’ (default: 10, required, allowed 1 to 30): period in years from the end of the order's fiscal year."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI2="‘Fiscal year end (MM-DD)’ (default: 12-31): the last day of the fiscal year. 02-29 means the last day of February. The task replaces an invalid stored value with 12-31 and writes this to the log."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI3="‘Anonymize orders’ (default: Yes): with ‘No’ the task anonymises no orders, not even guest orders. Consents outside the period still lose their IP address and user agent."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_LI4="‘Delete addresses’ (default: Yes): deletes the saved addresses of registered customers whose newest order is outside the period. With ‘No’ they are kept."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETTINGS_P2="The period of an order ends at the end of its fiscal year plus the set years, at 23:59:59 in the website time zone. Example with 10 years and 12-31: an order of 15 March 2016 is kept until 31 December 2026 and is anonymised by the first run from 1 January 2027."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_TITLE="Scheduled tasks"
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP1="Nothing to set up: the installation of the plugin ‘Privacy - J2Commerce’ checks the task after every installation and update. If it is missing, it creates the task ‘J2Commerce - Automatic data cleanup’ and switches it on. It never changes or duplicates an existing task."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP2="The created task runs every day at 02:15 UTC, with the retention period and fiscal year end of the privacy plugin, ‘Anonymize orders’ and ‘Delete addresses’ set to ‘Yes’."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP3="The task is required. If it is switched off or in the trash, it stays that way: the installation message and the system check say so and explain how to switch it on."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP4="Check under ‘System → Manage → Scheduled Tasks’ that the task is switched on and has run. The ‘System check’ tab shows the same."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_STEP5="Set up a reliable trigger, a cron job with <code>php cli/joomla.php scheduler:run</code> or Joomla's web cron. Without it Joomla starts tasks only when pages are visited."
PLG_TASK_J2COMMERCEPRIVACY_HELP_SETUP_NOTE1="There is no dry run. Anonymised data cannot be restored. Test the task on a test installation with test data first. Joomla's task of the type <code>privacy.consent</code> is a different task and does not replace this one."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_TITLE="Installation, update and disabling"
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI1="The installer of the plugin ‘Privacy - J2Commerce’ installs this plugin and enables it on the first installation. An update keeps its state (enabled or disabled). There is no separate update."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI2="The task uses program parts of the privacy plugin. If they are missing, it ends with an error status and anonymises nothing."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI3="Uninstalling the privacy plugin also removes this plugin and all tasks of this type. Data already anonymised stays anonymised."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI4="While this plugin is disabled, Joomla no longer offers the task type and existing tasks of this type process no data. Expired data then stays until a removal request anonymises it or you enable the plugin again."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI5="Before updating the plugin ‘Privacy - J2Commerce’, take a current, complete backup of the whole website that you can restore independently. The installer keeps no file copies and cannot check your backup. The first update attempt shows this recommendation and stops before it changes files, then you start the update again. If the installer finds a modified or unknown file that the update would replace, it stops before copying anything and lists the path and the hashes. Check the file, resolve it by hand or postpone the update, then try again. There is no approval command and no bypass."
PLG_TASK_J2COMMERCEPRIVACY_HELP_INSTALL_LI6="The plugin has no <code>access.xml</code> and no permissions of its own. Joomla's permissions for the scheduled tasks decide who may change, run or delete the task: give such access only to trusted administrators. The task writes no table of its own and sends no mail. It changes the shop's records and deletes expired counters of the confirmation page. No data is sent to external services."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_TITLE="Typical problems and solutions"
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI1="<strong>The task type is missing:</strong> enable this plugin."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI2="<strong>The task does not run:</strong> check that the task is enabled, that the schedule is right and that a trigger is running. The task shows its run history under ‘System → Manage → Scheduled Tasks’."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI3="<strong>The task ends with an error status:</strong> read the task log. Errors with guest orders, consent records, AcyMailing placeholder contacts, deleting the counters or with all users lead to this status. If only some users fail, the task reports success but lists the errors in the log."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI4="<strong>An order was not anonymised:</strong> it is still within the period, the person has a newer order within the period, ‘Anonymize orders’ is set to ‘No’, or the order has a lifetime licence and therefore keeps its e-mail address."
PLG_TASK_J2COMMERCEPRIVACY_HELP_PROBLEMS_LI5="<strong>Warning about order numbers used more than once:</strong> if an order number also belongs to another order, the task leaves the billing and shipping data and the consent of this number unchanged. Check such orders manually."
