; Help tab of the module edit screen (manifest, field type helppage)
MOD_APPOINTMENTS_HELP_NOTE="L'onglet « Aide » explique ce que ce module affiche, qui le voit et que faire en cas de problème."
MOD_APPOINTMENTS_HELP_TAB="Aide"
MOD_APPOINTMENTS_HELP_WHAT_TITLE="Ce que ce module affiche"
MOD_APPOINTMENTS_HELP_WHAT_P1="Le module affiche les prochains rendez-vous du composant Rendez-vous sur le tableau de bord de l'administration."
MOD_APPOINTMENTS_HELP_WHAT_LI1="Les prochains rendez-vous en attente ou confirmés, autant que réglé sous « Nombre de rendez-vous », avec la date et l'heure dans le fuseau horaire du site (Configuration globale, « Fuseau horaire du site »), le type de rendez-vous et le nom de la personne qui a réservé. Les rendez-vous en attente portent la mention « Approbation en attente ». Un clic ouvre la réservation."
MOD_APPOINTMENTS_HELP_WHAT_LI2="Le nombre de réservations depuis votre dernière visite, pour chaque utilisateur : le module enregistre avec votre compte quand vous avez vu le tableau de bord pour la dernière fois et compte les réservations arrivées ensuite. La référence reste la même jusqu'à votre prochaine connexion. Lors de votre toute première visite, il n'y a pas encore de nombre."
MOD_APPOINTMENTS_HELP_WHAT_LI3="Les rendez-vous passés, annulés et effacés n'apparaissent pas. Les réservations effacées ne sont pas comptées."
MOD_APPOINTMENTS_HELP_WHAT_LI4="« Ouvrir les réservations » mène à la liste des réservations du composant."
MOD_APPOINTMENTS_HELP_ACCESS_TITLE="Qui voit quoi"
MOD_APPOINTMENTS_HELP_ACCESS_P1="Le module suit les règles de la liste des réservations : un utilisateur ne le voit qu'avec « Accès à l'interface d'administration » sur le composant et « Modifier » sur au moins un type de rendez-vous, et seulement les rendez-vous de ces types. Tous les autres ne voient rien, pas même le titre du module. La page d'aide du composant explique les permissions et comment donner accès à un autre compte (section « Permissions »)."
MOD_APPOINTMENTS_HELP_ACCESS_NOTE="Les noms des personnes qui réservent sont des données personnelles. Ne donnez accès qu'aux comptes qui en ont besoin."
MOD_APPOINTMENTS_HELP_SETUP_TITLE="Mise en place"
MOD_APPOINTMENTS_HELP_SETUP_STEP1="Le composant installe le module lors de sa première installation, le publie à la position « cpanel » du tableau de bord et lui donne le titre « Prochains rendez-vous ». Une mise à jour conserve la position, le titre et l'état que vous avez réglés."
MOD_APPOINTMENTS_HELP_SETUP_STEP2="Sous Système, Modules d'administration, vous modifiez le titre, le nombre de rendez-vous, la position et le niveau d'accès, ou dépubliez le module."
MOD_APPOINTMENTS_HELP_SETUP_STEP3="La désinstallation du composant supprime le module et les heures enregistrées des dernières visites."
MOD_APPOINTMENTS_HELP_PROBLEMS_TITLE="Problèmes et que faire"
MOD_APPOINTMENTS_HELP_PROBLEMS_LI1="Le module manque sur le tableau de bord : vérifiez qu'il est publié à la position « cpanel » et que votre compte a les permissions décrites sous « Qui voit quoi »."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI2="« Les rendez-vous n'ont pas pu être chargés. » : la cause figure dans le journal de Joomla (catégorie com_appointments). Vérifiez que le composant est activé et lancez ses vérifications système."
MOD_APPOINTMENTS_HELP_PROBLEMS_LI3="Une heure diffère de la liste des réservations : le module affiche le fuseau horaire du site, la liste des réservations l'UTC."
