COM_APPOINTMENTS_PRIVACY_REVIEW_KEPT="Der Eintrag bleibt unverändert und ist aus der Liste genommen."
COM_APPOINTMENTS_PRIVACY_REVIEW_GONE="Der Eintrag ist nicht mehr vorhanden und aus der Liste genommen."
COM_APPOINTMENTS_PRIVACY_REVIEW_REQUEST_MISSING="Die Anfrage ist nicht mehr vorhanden, die Adresse darum unbekannt. Löschen Sie den Eintrag oder lassen Sie ihn unverändert."
COM_APPOINTMENTS_PRIVACY_REVIEW_NO_ACCESS="Sie haben auf diesen Kalender keinen Zugriff mit Schreibrecht, oder Ihr Schlüssel ist in dieser Sitzung nicht entsperrt."
COM_APPOINTMENTS_PRIVACY_REVIEW_NOT_REMOVABLE="Die Adresse liess sich nicht sicher entfernen. Der Eintrag bleibt unverändert. Löschen Sie ihn oder bearbeiten Sie ihn auf einem Gerät."
COM_APPOINTMENTS_PRIVACY_REVIEW_ERROR="Das hat nicht geklappt. Der Eintrag wurde vielleicht inzwischen geändert. Laden Sie die Seite neu und versuchen Sie es noch einmal."
COM_APPOINTMENTS_PRIVACY_REVIEW_CHANGED="Der Eintrag wurde seit dem Öffnen der Seite geändert, z.B. auf einem Gerät. Prüfen Sie ihn in der neu geladenen Liste noch einmal."
COM_APPOINTMENTS_PRIVACY_REVIEW_PAGES="Seiten"
COM_APPOINTMENTS_PRIVACY_REVIEW_PAGE="Seite %1$d von %2$d"
COM_APPOINTMENTS_TEAM_F_PRIVACY_TEAM_KEPT="Beibehaltene Kalendereinträge: %d. Einträge mit der Adresse eines Teammitglieds oder einer Anfrage, deren Konto sich nicht mehr bestimmen lässt, werden nie automatisch geändert. Prüfen Sie sie in den Kalendern."
COM_APPOINTMENTS_TEAM_F_PRIVACY_STAFF_REMOVED="Geräte, Schlüssel und Zugriffsrechte des Kontos gelöscht. Seine eigenen Kalender bleiben ohne Eigentümer erhalten. Protokolleinträge bleiben für ihre Aufbewahrung von zwölf Monaten."
COM_APPOINTMENTS_TEAM_F_PRIVACY_UNSEARCHED="Diese Internetkalender wurden nicht durchsucht, weil in dieser Sitzung kein Schlüssel für sie entsperrt ist: %s. Wiederholen Sie die Anfrage als Person mit Schlüssel für diese Kalender."
COM_APPOINTMENTS_TEAM_F_PRIVACY_FAILED="Ein Teil der Daten der Internetkalender konnte nicht verarbeitet werden. Siehe Joomla-Protokoll."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ENABLED="Internetkalender"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SODIUM="PHP-Erweiterung sodium (erforderlich)"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SODIUM_FIX="Verlangen Sie beim Hoster PHP mit der Erweiterung sodium. Die Komponente verschlüsselt damit die Buchungen und lässt sich ohne sie weder installieren noch aktualisieren."
COM_APPOINTMENTS_TEAM_F_SYSTEM_MEMORY="Internetkalender: PHP-Speichergrenze"
COM_APPOINTMENTS_TEAM_F_SYSTEM_MEMORY_FIX="Setzen Sie memory_limit auf mindestens 128M. Der Schlüssel eines Passworts braucht kurz 64 MiB."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ARGON2="Internetkalender: Test von Argon2id"
COM_APPOINTMENTS_TEAM_F_SYSTEM_HTTPS="Internetkalender: Adresse der Website mit HTTPS"
COM_APPOINTMENTS_TEAM_F_SYSTEM_HTTPS_FIX="Schalten Sie TLS für die Website ein und tragen Sie die https-Adresse in der Komponentenoption «Öffentliche Adresse der Website» ein. Kalenderprogramme verbinden sich nie ohne HTTPS."
COM_APPOINTMENTS_TEAM_F_SYSTEM_TLS="Internetkalender: Die Website antwortet über HTTPS mit gültigem Zertifikat"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PLUGIN_DAV="Internetkalender: CalDAV-Systemplugin"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PLUGIN_USER="Internetkalender: Benutzerplugin"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PLUGIN_FIX="Aktivieren Sie das Plugin unter System, Plugins."
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_FORCED="Internetkalender: zweiter Faktor für beide Gruppen erzwungen"
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_FORCED_FIX="Tragen Sie beide Gruppen der Internetkalender unter Benutzer, Optionen, Multi-Faktor-Authentifizierung, «MFA für diese Benutzergruppen erzwingen» ein."
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_NEVER="Internetkalender: eine Gruppe ist vom zweiten Faktor ausgenommen"
COM_APPOINTMENTS_TEAM_F_SYSTEM_MFA_NEVER_FIX="Entfernen Sie die Gruppen der Internetkalender unter Benutzer, Optionen, Multi-Faktor-Authentifizierung, «MFA für diese Benutzergruppen nie verwenden»."
COM_APPOINTMENTS_TEAM_F_SYSTEM_RECOVERY="Internetkalender: Wiederherstellungsschlüssel eingerichtet"
COM_APPOINTMENTS_TEAM_F_SYSTEM_RECOVERY_FIX="Richten Sie den Wiederherstellungsschlüssel unter Internetkalender ein. Vorher lassen sich keine Kalender anlegen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET="Internetkalender: Site-Secret unverändert"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET_SAME="Unverändert"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET_CHANGED="Geändert, oder das Protokoll wurde verändert"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET_NO_LOG="Noch nichts protokolliert"
COM_APPOINTMENTS_TEAM_F_SYSTEM_SECRET_FIX="Alle Serverschlüssel der Internetkalender stammen aus dem Site-Secret in configuration.php. Stellen Sie das bisherige Secret aus den gedruckten Wiederherstellungsunterlagen wieder her. Mit einem neuen Secret sind App-Passwörter, Zeitdaten und Schutzcodes nicht mehr gültig."
COM_APPOINTMENTS_TEAM_F_SYSTEM_LEGACY_FEEDS="Token-Feeds (veraltet)"
COM_APPOINTMENTS_TEAM_F_SYSTEM_LEGACY_ON="Eingeschaltet"
COM_APPOINTMENTS_TEAM_F_SYSTEM_LEGACY_FIX="Die Token-Feeds werden durch die Internetkalender ersetzt und mit Version 2.0.0 entfernt. Schalten Sie sie in den Optionen aus, sobald jeder Gastgeber einen Internetkalender nutzt."
COM_APPOINTMENTS_TEAM_F_SYSTEM_OUTLOOK_CLEANUP="Internetkalender: aktive Outlook-Geräte mit «Aufräumen»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_OUTLOOK_CLEANUP_FIX="Prüfen Sie diese Geräte unter Internetkalender, Geräte. Gleicht ein Outlook-Gerät beidseitig mit dem Outlook-Hauptkalender ab, stellen Sie es auf «Nur sperren». Sonst löscht Outlook beim Entfernen des Geräts, nach einem Passwort-Reset oder bei einer Sperre alle abgeglichenen Termine dieses Kalenders. Geräte aus der Zeit vor dieser Einstellung stehen auf «Aufräumen». Gleicht das Gerät nur in einen eigenen, leeren Ordner ab, ist «Aufräumen» richtig und dieser Hinweis kann bleiben."
COM_APPOINTMENTS_HELP_DEVREMOVE_TITLE="Geräte entfernen"
COM_APPOINTMENTS_HELP_DEVREMOVE_SETTING="Jedes Gerät hat die Einstellung «Beim Entfernen oder Sperren». Die Person wählt sie beim Hinzufügen unter «Meine Kalender» und kann sie dort später ändern. Administratoren ändern sie unter Internetkalender, Geräte. Sonst kann niemand sie ändern."
COM_APPOINTMENTS_HELP_DEVREMOVE_CLEANUP="«Aufräumen»: Beim nächsten Abgleich erhält das Gerät seine Kalender leer. Jeder bekannte Eintrag gilt als gelöscht, Schreibzugriffe werden abgelehnt. Danach verschwinden die Kalender, danach wird jede Anfrage mit 401 abgelehnt. Das Programm löscht dabei seine lokale Kopie, der Server behält alle Einträge. Gedacht für Handys und Tablets, auf denen die Internetkalender eigene Kalender sind."
COM_APPOINTMENTS_HELP_DEVREMOVE_BLOCK="«Nur sperren»: Das Gerät wird sofort widerrufen. Jede Anfrage, auch PROPFIND und REPORT, wird mit 401 abgelehnt. Ein leerer Kalender wird nie ausgeliefert. Das Programm meldet einen Fehler und löscht nichts. Die Kopie auf dem Gerät bleibt, bis die Person sie im Programm entfernt."
COM_APPOINTMENTS_HELP_DEVREMOVE_OUTLOOK="Warum «Nur sperren» für Outlook: CalDav Synchronizer gleicht im Modus «Two-Way» in beide Richtungen ab. Ist der Internetkalender dem Outlook-Hauptkalender zugeordnet, sind die abgeglichenen Einträge die Originaltermine der Person. Ein leerer Kalender beim Aufräumen würde Outlook veranlassen, diese Termine zu löschen. Mit «Nur sperren» meldet Outlook nur einen Fehler, alle Termine bleiben."
COM_APPOINTMENTS_HELP_DEVREMOVE_TRIGGERS="Wer betroffen ist: Gerät entfernen unter «Meine Kalender» und «Nach Geräteeinstellung sperren» im Backend betreffen nur dieses eine Gerät, alle anderen Geräte laufen unverändert weiter. Ein Passwort-Reset, die Sperre des Joomla-Kontos, die Sperre des Kalenderzugriffs, der Widerruf eines Zugangs und das Verwerfen eines ungültigen Schlüssels sperren alle Geräte der Person, jedes nach seiner eigenen Einstellung. «Sofort sperren» widerruft immer ohne Aufräumen, für ein verlorenes Gerät."
COM_APPOINTMENTS_HELP_DEVREMOVE_CALENDAR="Wird nur die Freigabe für einen Kalender entzogen, behält das Gerät seine anderen Kalender. Der entzogene Kalender wird nicht mehr aufgelistet und antwortet mit 404, auch auf PROPFIND und REPORT. Bei «Nur sperren» wird er nie leer ausgeliefert. Bei «Aufräumen» erhält das Gerät ihn erst leer, wenn das ganze Gerät aufgeräumt wird."
COM_APPOINTMENTS_HELP_DEVREMOVE_DEFAULTS="Vorgabe beim Hinzufügen: «Nur sperren» für Outlook mit CalDav Synchronizer, Thunderbird, eM Client und andere Programme, «Aufräumen» für iPhone, iPad und Android mit DAVx⁵. Geräte aus der Zeit vor dieser Einstellung stehen nach dem Update auf «Aufräumen», wie bisher. Die Systemprüfung meldet aktive Outlook-Geräte mit «Aufräumen». Stellen Sie diese auf «Nur sperren», wenn sie beidseitig mit dem Outlook-Hauptkalender abgleichen."
COM_APPOINTMENTS_HELP_BOOKINGS_TITLE="Buchungen: Status und Aktionen"
COM_APPOINTMENTS_HELP_BOOKINGS_INTRO="Die Buchungsliste («Termine: Buchungen» in der Übersicht) zeigt nur die Buchungen der Terminarten, die Sie bearbeiten dürfen. Filtern Sie nach Terminart, Status und UTC-Startdatum, suchen Sie nach Name oder E-Mail-Adresse und sortieren Sie nach Beginn, Nachname, Terminart, Status oder ID. Ein Klick auf eine Beginnzeit öffnet die Buchungsdetails. Die Zeiten in der Liste und in den Details sind UTC."
COM_APPOINTMENTS_HELP_BOOKINGS_STATES_TITLE="Status"
COM_APPOINTMENTS_HELP_BOOKINGS_STATE_PENDING="<strong>«Ausstehend»</strong>: Bei der Terminart ist «Bestätigung durch den Gastgeber verlangen» eingeschaltet. Die Buchung belegt ihre Zeit, bis Sie sie genehmigen oder absagen. Sie erhält keine Erinnerungen."
COM_APPOINTMENTS_HELP_BOOKINGS_STATE_CONFIRMED="<strong>«Bestätigt»</strong>: Eine Buchung ohne verlangte Bestätigung ist sofort bestätigt, eine ausstehende Buchung, sobald Sie sie genehmigen. Sie belegt ihre Zeit und erhält die Erinnerungen."
COM_APPOINTMENTS_HELP_BOOKINGS_STATE_CANCELLED="<strong>«Abgesagt»</strong>: Die eingeladene Person hat über den Link in der Mail abgesagt, ein Administrator hat abgesagt oder eine Löschung hat einen künftigen Termin abgesagt. Die Zeit ist wieder frei. Eine abgesagte Buchung lässt sich nicht wieder bestätigen. Für einen neuen Termin bucht die Person neu."
COM_APPOINTMENTS_HELP_BOOKINGS_STATE_ERASED="<strong>Gelöscht</strong> ist kein eigener Status. Eine anonymisierte Buchung behält ihren letzten Status, ihre Personendaten sind entfernt und die Details zeigen «Anonymisiert (UTC)». Mit «Buchung vollständig löschen» unter «Bei Datenlöschung» verschwindet die Buchung aus der Liste."
COM_APPOINTMENTS_HELP_BOOKINGS_STATE_FLOW="Der Status ändert sich nur in eine Richtung: von Ausstehend zu Bestätigt durch die Genehmigung, von Ausstehend oder Bestätigt zu Abgesagt. Eine Verschiebung behält den Status. Keine Aktion setzt eine abgesagte oder gelöschte Buchung in einen früheren Zustand zurück."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTIONS_TITLE="Aktionen"
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_APPROVE="<strong>«Genehmigen»</strong> (Werkzeugleiste der Liste und Details): Bestätigt die ausgewählten ausstehenden Buchungen und versendet die Mails zur Genehmigung (siehe Benachrichtigungen). Enthält die Auswahl eine Buchung, die nicht ausstehend ist, bricht die Verarbeitung bei dieser Buchung mit einer Fehlermeldung ab."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_CANCEL="<strong>«Termin absagen»</strong> (Werkzeugleiste der Liste und Details): Sagt die ausgewählten Buchungen ab. Die Zeit wird frei, die Buchungskopien verschwinden aus den Internetkalendern, ein Konferenzraum wird freigegeben und die Absagemails gehen hinaus. Das lässt sich nicht rückgängig machen."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_RESCHEDULE="<strong>«Verschieben»</strong> (nur in den Details): Geben Sie «Neuer Beginn (UTC)» ein. Die neue Zeit muss nach der aktuellen Verfügbarkeit frei sein, wie bei einer neuen Buchung. Die Buchung behält ihre Nummer, ihre Kalender-UID und ihren Status. Die Links der eingeladenen Person aus früheren Mails gelten nicht mehr. Verwendet die Terminart Videokonferenzen, entsteht ein neuer Konferenzlink. Die Erinnerungen gehen für die neue Zeit erneut hinaus und alle erhalten aktualisierte Einladungen. Nur künftige ausstehende oder bestätigte Buchungen lassen sich verschieben."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_RETRY="<strong>«Konferenzlink erneut erstellen»</strong> (Werkzeugleiste der Liste, in den Details nur bei fehlendem Link): Fordert den Konferenzlink für Buchungen ohne Link erneut an. Bei Erfolg gehen die Einladungen mit dem Link erneut hinaus. Sonst bleibt die Buchung unverändert und eine Warnung erscheint. Die Liste kennzeichnet solche Buchungen mit «Die Buchung ist gespeichert, aber kein Konferenzlink ist verfügbar.»"
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_ICS="<strong>«ICS exportieren»</strong> (Liste und Details): Lädt den Kalendereintrag einer Buchung als Datei herunter."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_CSV="<strong>«Gefilterte CSV exportieren»</strong> (Werkzeugleiste der Liste): Lädt alle Buchungen, die den aktuellen Filtern entsprechen, mit Namen, E-Mail-Adressen, Telefonnummern, Gästen und Antworten herunter. Behandeln Sie die Datei als Personendaten. Eine heruntergeladene Datei kann die Website nicht löschen."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_ERASE="<strong>«Personendaten löschen»</strong> (Werkzeugleiste der Liste und Details, nach einer Bestätigung): Entfernt die Personendaten der ausgewählten Buchungen sofort, wie unter «Bei Datenlöschung» eingestellt. Ein künftiger Termin wird zuerst abgesagt und der Gastgeber erhält eine Absage ohne die Daten der eingeladenen Person. Buchungskopien, Konferenzraum und Verknüpfung zu Close werden entfernt, in Close wird nichts gelöscht. Ein Löschnachweis ohne Daten der eingeladenen Person bleibt. Das lässt sich nicht rückgängig machen."
COM_APPOINTMENTS_HELP_BOOKINGS_ACTION_ENCRYPT="<strong>«Jetzt verschlüsseln»</strong> (Werkzeugleiste der Liste, nur für Administratoren der Komponente): Erscheint nur, solange Buchungen aus der Zeit vor Version 1.4.0 noch unverschlüsselt gespeichert sind. Diese Buchungen sind als «Nicht verifiziert» markiert, weil ihre Daten direkt in der Datenbank verändert worden sein könnten. Prüfen Sie sie und verschlüsseln Sie sie danach."
COM_APPOINTMENTS_HELP_BOOKINGS_RIGHTS="Berechtigungen je Terminart: «Genehmigen» und «Termin absagen» brauchen «Status bearbeiten», «Personendaten löschen» braucht «Löschen». Die Details, «Verschieben», «Konferenzlink erneut erstellen» und «ICS exportieren» brauchen «Bearbeiten». «Jetzt verschlüsseln» braucht Administratorrechte für die Komponente. Die Werkzeugleiste der Liste zeigt «Genehmigen», «Termin absagen» und «Personendaten löschen» nur, wenn Sie das Recht für mindestens eine Terminart der Liste haben. Der Abschnitt «Berechtigungen» erklärt jedes Recht."
COM_APPOINTMENTS_HELP_PERMISSIONS_TITLE="Berechtigungen"
COM_APPOINTMENTS_HELP_PERMISSIONS_INTRO="Die Komponente verwendet die Berechtigungen von Joomla. Sie setzen sie für die ganze Komponente unter Termine, Optionen, Reiter «Berechtigungen», und für eine einzelne Terminart in deren Bearbeitungsansicht, Reiter «Berechtigungen». Eine Einstellung der Terminart gilt nur für diese Terminart und geht der Komponente vor. Berechtigungen gehören Benutzergruppen: Ein Konto hat die Rechte seiner Gruppen."
COM_APPOINTMENTS_HELP_PERMISSIONS_TABLE_TITLE="Was jedes Recht erlaubt"
COM_APPOINTMENTS_HELP_PERMISSIONS_COL_PERMISSION="Recht"
COM_APPOINTMENTS_HELP_PERMISSIONS_COL_ALLOWS="Was es erlaubt"
COM_APPOINTMENTS_HELP_PERMISSIONS_MANAGE="Zugriff auf Administrationsoberfläche (Komponente)"
COM_APPOINTMENTS_HELP_PERMISSIONS_MANAGE_ALLOWS="Öffnet die Komponente im Administrator: Übersicht, Listen und diese Hilfe. Ohne dieses Recht sieht ein Konto nichts von der Komponente, auch kein Dashboard-Modul. Allein zeigt es keine Buchung."
COM_APPOINTMENTS_HELP_PERMISSIONS_EDIT="Bearbeiten (Komponente oder Terminart)"
COM_APPOINTMENTS_HELP_PERMISSIONS_EDIT_ALLOWS="Zeigt die Buchungen der Terminart: in der Buchungsliste, in den Buchungsdetails, in den Zahlen der Übersicht und im Dashboard-Modul. Erlaubt Verschieben, Konferenzlink erneut erstellen, ICS und CSV exportieren und das Bearbeiten der Terminart mit ihren Feldern und Vorlagen. Für die Komponente erlaubt es zusätzlich das Bearbeiten der Zeitpläne und gesperrten Zeiten. Wer die Buchungen einer Terminart sehen darf, darf sie auch ändern: Ein eigenes Leserecht im Administrator gibt es nicht."
COM_APPOINTMENTS_HELP_PERMISSIONS_EDITSTATE="Status bearbeiten (Komponente oder Terminart)"
COM_APPOINTMENTS_HELP_PERMISSIONS_EDITSTATE_ALLOWS="Buchungen genehmigen und absagen, Terminarten, Felder und Vorlagen veröffentlichen und sperren."
COM_APPOINTMENTS_HELP_PERMISSIONS_DELETE="Löschen (Komponente oder Terminart)"
COM_APPOINTMENTS_HELP_PERMISSIONS_DELETE_ALLOWS="Personendaten von Buchungen löschen, Terminarten, Felder, Vorlagen, Zeitpläne und gesperrte Zeiten löschen."
COM_APPOINTMENTS_HELP_PERMISSIONS_CREATE="Erstellen (Komponente)"
COM_APPOINTMENTS_HELP_PERMISSIONS_CREATE_ALLOWS="Terminarten, Felder, Vorlagen, Zeitpläne und gesperrte Zeiten anlegen."
COM_APPOINTMENTS_HELP_PERMISSIONS_OPTIONS="Optionen (Komponente)"
COM_APPOINTMENTS_HELP_PERMISSIONS_OPTIONS_ALLOWS="Die Optionen der Komponente und die E-Mail-Vorlagen für die ganze Website ändern."
COM_APPOINTMENTS_HELP_PERMISSIONS_ADMIN="Konfigurieren (Komponente)"
COM_APPOINTMENTS_HELP_PERMISSIONS_ADMIN_ALLOWS="Die Berechtigungen ändern, Buchungen alter Versionen verschlüsseln («Jetzt verschlüsseln»), den Close-API-Schlüssel setzen und die Internetkalender anderer Benutzer administrieren."
COM_APPOINTMENTS_HELP_PERMISSIONS_EXTERNAL="Für Externe freigeben (Komponente)"
COM_APPOINTMENTS_HELP_PERMISSIONS_EXTERNAL_ALLOWS="Externe einladen und Internetkalender für sie freigeben."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_TITLE="Einem weiteren Konto Zugriff auf die Buchungen geben"
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_1="Legen Sie unter Benutzer, Gruppen eine Gruppe an, z.B. unter «Registriert», und nehmen Sie das Konto darin auf."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_2="Wählen Sie unter System, Konfiguration, Reiter «Berechtigungen» die Gruppe und setzen Sie «Administrator-Anmeldung» auf «Erlaubt»."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_3="Wählen Sie unter Termine, Optionen, Reiter «Berechtigungen» die Gruppe und setzen Sie «Zugriff auf Administrationsoberfläche» und «Bearbeiten» auf «Erlaubt». Das Konto sieht und ändert dann die Buchungen aller Terminarten."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_4="Ergänzen Sie «Status bearbeiten», wenn das Konto Buchungen genehmigt und absagt, und «Löschen», wenn es Personendaten löscht. Lassen Sie alle anderen Rechte auf «Nicht gesetzt»: Für eine Gruppe unter «Registriert» heisst das verweigert."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_5="Nur für einzelne Terminarten: Setzen Sie «Bearbeiten» nicht in den Optionen der Komponente, sondern im Reiter «Berechtigungen» jeder dieser Terminarten."
COM_APPOINTMENTS_HELP_PERMISSIONS_ACCESS_6="Melden Sie sich mit dem Konto an und prüfen Sie die Buchungsliste: Sie zeigt nur die Buchungen der erlaubten Terminarten und die Werkzeugleiste nur die Schaltflächen, die das Konto verwenden darf."
COM_APPOINTMENTS_HELP_PERMISSIONS_READ="Termine lesen, ohne sie ändern zu können, geht ausserhalb des Administrators: mit den Internetkalendern und der Rolle «Lesen» (Abschnitt «Freigaben, Eigentümer und Wiederherstellung»)."
COM_APPOINTMENTS_HELP_MODULE_TITLE="Dashboard-Modul"
COM_APPOINTMENTS_HELP_MODULE_DESC="Die Komponente installiert das Administratormodul «Termine - Nächste Termine» und veröffentlicht es bei ihrer ersten Installation auf der Position «cpanel» des Dashboards. Es listet die nächsten Termine mit Datum und Zeit in der Zeitzone der Website, der Terminart und dem Namen der buchenden Person auf und zeigt die Zahl der Buchungen seit Ihrem letzten Besuch. Es zeigt die Buchungen der Terminarten, die das Konto bearbeiten darf, und anderen Konten gar nichts (Abschnitt «Berechtigungen»). Seine Einstellungen und seine eigene Hilfe finden Sie unter System, Administratormodule. Die Deinstallation der Komponente entfernt es."
COM_APPOINTMENTS_HELP_BOOKINGS_MAILFAIL="Kann eine Mail nicht zugestellt werden, bleibt die Änderung trotzdem bestehen und eine Meldung weist darauf hin. Prüfen Sie dann die E-Mail-Konfiguration und das Komponentenprotokoll."
COM_APPOINTMENTS_HELP_CLOSE_TITLE="Übertragung an Close (CRM)"
COM_APPOINTMENTS_HELP_CLOSE_INTRO="Optional und standardmässig ausgeschaltet. Die Website überträgt neue Buchungen an das CRM Close: einen Kontakt und Lead für die eingeladene Person und einen Eintrag zur Buchung. Übertragen werden nur Buchungen, die bei eingeschalteter Übertragung entstehen und deren Terminart zu einem Profil gehört, ausstehende Buchungen eingeschlossen. Frühere Buchungen werden nie übertragen."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_TITLE="Einrichten"
COM_APPOINTMENTS_HELP_CLOSE_SETUP_1="Legen Sie in den Optionen im Register «Buchungsübertragung an Close» je Close-Organisation ein Profil an: «Profilkennung», «Terminarten», «Freigegebener HTTPS-API-Ursprung (ohne Pfad)» und, wenn der Schlüssel auf dem Server liegt, «Server-Umgebungsvariable mit dem API-Schlüssel (optional)». Gespeichert wird nur der Name der Variable. Den API-Schlüssel erfassen Sie entweder je Buchungsseite in ihrer Terminart im Register «Close CRM» (nur Komponenten-Administratoren, verschlüsselt gespeichert und nie mehr angezeigt) oder setzen ihn auf dem Server als Umgebungsvariable. Ein für die Buchungsseite gespeicherter Schlüssel hat Vorrang vor der Variable."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_2="Tragen Sie bei Bedarf «Erwartete Organisations-ID (freiwillig)» ein. Vor dem Senden von Personendaten liest die Website, zu welcher Organisation der Schlüssel gehört. Eine andere Organisation blockiert die Übertragung."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_3="Wählen Sie «Buchungseintrag in Close»: Eine Notiz funktioniert in jedem Close-Tarif, eine Custom Activity braucht einen Tarif mit Custom Activities. Wählen Sie die Antworten für die Notiz, «Kampagne», «Quelle» und die Felder für Lead-Name, Kontakttitel und Leadfelder."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_4="Schalten Sie im selben Register «Aktiviert» ein und speichern Sie."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_5="Schalten Sie unter System → Geplante Aufgaben die Aufgabe «Termine: freigegebene Buchungen an Close übertragen» ein. Die Installation legt sie ausgeschaltet an, mit einem Lauf alle fünf Minuten."
COM_APPOINTMENTS_HELP_CLOSE_SETUP_INVALID="Solange die Konfiguration unvollständig oder ungültig ist, zeigt die Übersicht eine Warnung und es wird nichts übertragen. Buchungen werden trotzdem angenommen."
COM_APPOINTMENTS_HELP_CLOSE_SENT_TITLE="Was übertragen wird"
COM_APPOINTMENTS_HELP_CLOSE_SENT_PERSON="Die Website sucht die eingeladene Person in Close in drei Schritten, jeder nur, wenn der vorherige nichts gefunden hat: 1. die genaue E-Mail-Adresse, 2. die Telefonnummer in internationaler Form (E.164), 3. Vor- und Nachname zusammen mit der Firma (die Antwort des Felds, das als Lead-Name eingestellt ist), beide genau, abgesehen von Gross- und Kleinschreibung und Leerzeichen. Ein Name allein passt nie, denn denselben Namen gibt es in verschiedenen Firmen. Genau ein Treffer in einem Schritt: Dieser Kontakt und sein Lead werden unverändert verwendet. Mehrere Treffer in einem Schritt halten die Übertragung nie an: Ein neuer Lead entsteht, und seine Notiz nennt die passenden Leads als mögliche Duplikate. Kein Treffer: Ein neuer Lead mit einem Kontakt (Name, E-Mail-Adresse, Telefon) entsteht. Die Notiz nennt immer, wie die Buchung zugeordnet wurde und welche E-Mail-Adresse und Telefonnummer die Person angegeben hat. Die Suchen senden Close nur diese Werte, die ein neuer Lead ohnehin erhält. Lead-Name, Kontakttitel und Lead-Felder aus dem Profil werden nur bei neuen Leads gesetzt."
COM_APPOINTMENTS_HELP_CLOSE_SENT_BOOKING="Jede Buchung erhält eine Notiz (oder Custom Activity). Die Notiz enthält Status, Beginn und Ende in der Zeitzone der Website, Terminart, Name, E-Mail-Adresse, Telefon, die gewählten Antworten mit ihren Feldbezeichnungen, Kampagne, Quelle, ob der Kontakt neu angelegt wurde, Buchungs-UID und Änderungsnummer. Genehmigung, Verschiebung und Absage aktualisieren dieselbe Notiz. Die Notiz ist in der Standardsprache der Website geschrieben."
COM_APPOINTMENTS_HELP_CLOSE_SENT_NEVER="Nie übertragen werden Gäste, Konferenzlinks, Absagegründe, Einwilligungsnachweise, die Links aus den Mails und nicht gewählte Antworten."
COM_APPOINTMENTS_HELP_CLOSE_WHEN="Jede neue Buchung und jede spätere Änderung (Genehmigung, Verschiebung, Absage) wird vorgemerkt. Die Aufgabe überträgt höchstens 20 Buchungen je Lauf. Ändert sich eine Buchung vor der Übertragung erneut, wird sie einmal mit ihrem neuesten Stand übertragen."
COM_APPOINTMENTS_HELP_CLOSE_NOTHING_DELETED="Die Website löscht oder anonymisiert in Close nie etwas und ändert bestehende Leads und Kontakte nie. Aufbewahrung, Löschung und Datenschutzanfragen entfernen nur die lokale Verknüpfung zu Close. Eine vor der Übertragung gelöschte Buchung wird nicht übertragen. Datenschutzanfragen für Close bearbeiten Sie in Close selbst."
COM_APPOINTMENTS_HELP_CLOSE_RETENTION="Ist die Übertragung eingerichtet, wartet die Buchungsaufbewahrung auf sie, siehe <a href='#help-retention'>Aufbewahrung und Löschung</a>."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_TITLE="Status und Fehler"
COM_APPOINTMENTS_HELP_CLOSE_STATUS_INTRO="Administratoren der Komponente sehen in der Übersicht den Bereich «Buchungsübertragung an Close». Er listet die Übertragungsdatensätze bestehender Buchungen, 100 je Seite, mit Buchungs-ID, Profil, Status und Diagnosecode. Die Aufgabe unter System → Geplante Aufgaben meldet einen Fehler, solange ein Datensatz blockiert oder unklar ist."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_QUEUED="<strong>«Vorgemerkt»</strong>: Wartet auf den nächsten Lauf."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_RETRY="<strong>«Wiederholung geplant»</strong>: Ein vorübergehendes Problem, z.B. eine Zeitüberschreitung bei einer Aktualisierung oder eine Ratenbegrenzung von Close. Der nächste Lauf versucht es nach der Pause erneut, standardmässig nach fünf Minuten. Eine Ratenbegrenzung pausiert nur das betroffene Profil."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_DONE="<strong>«Übertragung abgeschlossen»</strong>: Close hat den aktuellen Stand der Buchung."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_BLOCKED="<strong>«Blockiert: Prüfung durch Betreiber erforderlich»</strong>: Zum Beispiel ein fehlender oder falscher API-Schlüssel, eine andere Organisation, ein unbekanntes Feld oder eine falsche Feldzuordnung. Mehrere Kontakte mit derselben Adresse blockieren nicht mehr: Die Buchung erhält einen neuen Lead, dessen Notiz die Duplikate nennt. Beheben Sie die Ursache und klicken Sie dann auf «Sichere Übertragungen wiederholen / blockierte neu prüfen»."
COM_APPOINTMENTS_HELP_CLOSE_STATUS_UNCERTAIN="<strong>«Unklare Neuanlage: vor Fortsetzung abgleichen»</strong>: Ein neuer Kontakt oder eine neue Notiz wurde gesendet, aber die Website weiss nicht, ob Close sie angelegt hat (Zeitüberschreitung, Serverfehler, ungültige Antwort oder Unterbruch). Sie wird nie automatisch erneut gesendet, weil das ein Duplikat erzeugen könnte."
COM_APPOINTMENTS_HELP_CLOSE_RETRY_BUTTON="«Sichere Übertragungen wiederholen / blockierte neu prüfen» führt sofort einen Lauf aus, blockierte Datensätze eingeschlossen. Eine unklare Neuanlage, eine Buchung oder eine Mail wiederholt er nie."
COM_APPOINTMENTS_HELP_CLOSE_PROFILE_CHANGE="Eine Änderung von «Profilkennung», API-Ursprung, Schlüsselvariable, Art des Buchungseintrags oder Aktivitätstyp stoppt die Aktualisierung bereits übertragener Buchungen. Ihre Datensätze werden blockiert."
COM_APPOINTMENTS_HELP_CLOSE_RECONCILE_TITLE="Unklare Neuanlage abgleichen"
COM_APPOINTMENTS_HELP_CLOSE_RECONCILE_1="Suchen Sie in Close den Kontakt mit der E-Mail-Adresse der eingeladenen Person oder die Notiz zur Buchung. Die Notiz enthält die Buchungs-UID, die auch in der Zeile steht."
COM_APPOINTMENTS_HELP_CLOSE_RECONCILE_2="Haben Sie das Objekt gefunden, tragen Sie seine ID in «Geprüfte entfernte Kontakt-, Notiz- oder Aktivitäts-ID» ein und klicken Sie auf «Bestehendes Objekt prüfen und fortsetzen». Eine Kontakt-ID beginnt mit cont_, eine Notiz- oder Aktivitäts-ID mit acti_."
COM_APPOINTMENTS_HELP_CLOSE_RECONCILE_3="Die Website liest dieses Objekt in Close nur und verknüpft es, nachdem sie die E-Mail-Adresse oder Lead, Kontakt und Buchungs-UID geprüft hat. Klicken Sie danach auf «Sichere Übertragungen wiederholen / blockierte neu prüfen», um fortzusetzen."
COM_APPOINTMENTS_HELP_CLOSE_RECONCILE_LIMIT="Verknüpfen lässt sich nur ein Objekt, das in Close besteht. Eine unklare Neuanlage sendet die Website nie erneut."
COM_APPOINTMENTS_HELP_TASKS_TITLE="Geplante Aufgaben"
COM_APPOINTMENTS_HELP_TASKS_INTRO="Das Plugin «Aufgabe - Termine» bietet dem Scheduler von Joomla sieben Routinen an. Eine Routine läuft nur als Aufgabe unter System → Geplante Aufgaben und nur, wenn der Scheduler tatsächlich ausgelöst wird. Auf einer wenig besuchten Website sind Besuche allein kein zuverlässiger Auslöser. Lösen Sie den Scheduler per Cron auf dem Server aus, mit dem Befehl <code>php cli/joomla.php scheduler:run</code>."
COM_APPOINTMENTS_HELP_TASKS_INSTALL="Nach jeder Installation und jedem Update prüft die Installation die Aufgaben selbst. «Termine: Aufbewahrung» ist erforderlich, «Termine: Erinnerungen» ist erforderlich, solange «Erinnerungsvorlaufzeiten (Minuten)» gesetzt ist, und die vier Aufgaben der Internetkalender sind erforderlich, solange die Internetkalender eingeschaltet sind. Eine fehlende erforderliche Aufgabe wird eingeschaltet angelegt, und die Meldung nach der Installation sagt es. Eine Aufgabe, die in irgendeinem Zustand besteht, wird nie geändert oder neu angelegt: Eine ausgeschaltete Aufgabe oder eine im Papierkorb bleibt so, und die Meldung nach der Installation und der Systemcheck nennen sie und sagen, wie Sie sie einschalten. «Termine: freigegebene Buchungen an Close übertragen» ist optional und wird ausgeschaltet angelegt. Schalten Sie eine Aufgabe aus, statt sie endgültig zu löschen, denn die nächste Installation oder das nächste Update legt eine endgültig gelöschte erforderliche Aufgabe wieder an."
COM_APPOINTMENTS_HELP_TASKS_CREATE="Von Hand ist nichts anzulegen. Schalten Sie die Internetkalender später ein, nennt der Systemcheck ihre vier Aufgaben als fehlend; die nächste Installation oder das nächste Update legt sie an, oder Sie legen sie unter System → Geplante Aufgaben mit «Neu» und der Wahl der Routine selbst an. «Termine: Aufbewahrung der Internetkalender» arbeitet auch bei ausgeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_TASKS_COL_TASK="Aufgabe"
COM_APPOINTMENTS_HELP_TASKS_COL_WHAT="Was sie tut"
COM_APPOINTMENTS_HELP_TASKS_COL_SCHEDULE="Zeitplan"
COM_APPOINTMENTS_HELP_TASKS_COL_MISSING="Wenn sie nicht läuft"
COM_APPOINTMENTS_HELP_TASKS_SCHEDULE_MANUAL="Täglich. Erforderlich, solange die Internetkalender eingeschaltet sind: dann eingeschaltet angelegt."
COM_APPOINTMENTS_HELP_TASKS_REMINDERS_TASK="Termine: Erinnerungen"
COM_APPOINTMENTS_HELP_TASKS_REMINDERS_WHAT="Sendet die fälligen Erinnerungen bestätigter künftiger Termine zu den Zeiten aus «Erinnerungsvorlaufzeiten (Minuten)», standardmässig einen Tag und eine Stunde vorher."
COM_APPOINTMENTS_HELP_TASKS_REMINDERS_SCHEDULE="Alle fünf Minuten. Erforderlich, solange Erinnerungszeitpunkte gesetzt sind: eingeschaltet angelegt."
COM_APPOINTMENTS_HELP_TASKS_REMINDERS_MISSING="Keine Erinnerungen. Ein verspäteter Lauf sendet fällige Erinnerungen noch, solange der Termin nicht begonnen hat."
COM_APPOINTMENTS_HELP_TASKS_RETENTION_TASK="Termine: Aufbewahrung"
COM_APPOINTMENTS_HELP_TASKS_RETENTION_WHAT="Löscht die Buchungen nach Ablauf ihrer Aufbewahrung, Löschnachweise nach Ablauf ihrer Frist und abgelaufene Zugriffszähler. Je Lauf höchstens ein Stapel, standardmässig 100."
COM_APPOINTMENTS_HELP_TASKS_RETENTION_SCHEDULE="Täglich. Erforderlich: eingeschaltet angelegt."
COM_APPOINTMENTS_HELP_TASKS_RETENTION_MISSING="Personendaten bleiben über die Frist hinaus gespeichert. Ein Rückstand braucht mehrere Läufe."
COM_APPOINTMENTS_HELP_TASKS_CLOSE_TASK="Termine: freigegebene Buchungen an Close übertragen"
COM_APPOINTMENTS_HELP_TASKS_CLOSE_WHAT="Überträgt vorgemerkte Buchungen an Close, höchstens 20 je Lauf."
COM_APPOINTMENTS_HELP_TASKS_CLOSE_SCHEDULE="Alle fünf Minuten. Optional: immer ausgeschaltet angelegt."
COM_APPOINTMENTS_HELP_TASKS_CLOSE_MISSING="Nichts kommt in Close an. Die Buchungsaufbewahrung wartet bis zu 30 Tage länger auf die Übertragung und löscht danach trotzdem."
COM_APPOINTMENTS_HELP_TASKS_TEAMRETENTION_TASK="Termine: Aufbewahrung der Internetkalender"
COM_APPOINTMENTS_HELP_TASKS_TEAMRETENTION_WHAT="Löscht Buchungskopien nach «Buchungskopien löschen nach (Tagen)» des Kalenders, entfernt Kopien abgesagter, gelöschter und verwaister Buchungen, schreibt die Kopien künftiger Buchungen nach dem Wiedereinschalten oder einem neuen Zielkalender neu und setzt die Verschlüsselung älterer Buchungen fort."
COM_APPOINTMENTS_HELP_TASKS_TEAMRETENTION_SCHEDULE="Täglich. Immer erforderlich, auch bei ausgeschalteten Internetkalendern: Bei Fehlen Installation oder Aktualisierung wiederholen. Keinen zweiten Worker anlegen; die vorhandene Aufgabe einschalten oder erhalten."
COM_APPOINTMENTS_HELP_TASKS_TEAMRETENTION_MISSING="Verbliebene Kopien abgesagter oder gelöschter Buchungen bleiben in den Internetkalendern, die Kalenderfrist greift nicht und Kopien werden nicht neu geschrieben."
COM_APPOINTMENTS_HELP_TASKS_TEAMCLEANUP_TASK="Termine: Aufräumen der Internetkalender"
COM_APPOINTMENTS_HELP_TASKS_TEAMCLEANUP_WHAT="Setzt gesperrte Geräte in die nächste Aufräumphase und löscht Zähler fehlgeschlagener Anmeldungen, die älter als 24 Stunden sind. Ohne Wirkung bei ausgeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_TASKS_TEAMCLEANUP_MISSING="Gesperrte Geräte bleiben in ihrer aktuellen Aufräumphase."
COM_APPOINTMENTS_HELP_TASKS_TEAMLOG_TASK="Termine: Protokoll der Internetkalender"
COM_APPOINTMENTS_HELP_TASKS_TEAMLOG_WHAT="Löscht Protokolleinträge der Internetkalender, die älter als zwölf Monate sind. Ohne Wirkung bei ausgeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_TASKS_TEAMLOG_MISSING="Ältere Protokolleinträge bleiben gespeichert."
COM_APPOINTMENTS_HELP_TASKS_TEAMINVITATIONS_TASK="Termine: abgelaufene Einladungen"
COM_APPOINTMENTS_HELP_TASKS_TEAMINVITATIONS_WHAT="Schliesst abgelaufene Einladungen externer Benutzer und löscht deren Adressen. Ohne Wirkung bei ausgeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_TASKS_TEAMINVITATIONS_MISSING="Die Adressen abgelaufener Einladungen bleiben gespeichert."
COM_APPOINTMENTS_HELP_TASKS_BATCH="«Termine: Erinnerungen» und «Termine: Aufbewahrung» haben die Einstellung «Stapelgrösse» (1 bis 1000, Standard 100). Erhöhen Sie sie oder lassen Sie die Aufgabe öfter laufen, wenn ein Rückstand grösser ist als ein Stapel."
COM_APPOINTMENTS_HELP_TASKS_CHECK="Prüfen Sie das Ergebnis in der Aufgabenliste (letzter Lauf und Status), in der «Systemprüfung» der Übersicht, die den letzten Lauf der Erinnerungs- und der Aufbewahrungsaufgabe zeigt, und im Tab «Systemcheck» der Optionen, der jede erforderliche Aufgabe mit Zustand und letztem Lauf nennt und zeigt, ob Joomla auf dieser Website geplante Aufgaben startet. Eine fehlgeschlagene Aufgabe zeigt dort einen Fehlerstatus. Beheben Sie die Ursache, statt die Aufgabe nur erneut auszuführen."
COM_APPOINTMENTS_HELP_PLUGINS_TITLE="Mitgelieferte Plugins"
COM_APPOINTMENTS_HELP_PLUGINS_INTRO="Die Komponente installiert sechs Plugins. Sie finden sie unter System → Plugins unter den unten genannten Namen. Ein Update behält bei, ob ein Plugin ein- oder ausgeschaltet ist. Die Deinstallation der Komponente entfernt sie."
COM_APPOINTMENTS_HELP_PLUGINS_PRIVACY_TITLE="Datenschutz - Termine"
COM_APPOINTMENTS_HELP_PLUGINS_PRIVACY_WHAT="Verbindet die Buchungen mit den Datenschutzanfragen von Joomla. Für eine Anfrage exportiert und entfernt es die Buchungen der Adresse, entfernt die Adresse als weiteren Gast aus anderen Buchungen und bearbeitet Einträge der Internetkalender und die Mitarbeiterdaten des Kontos."
COM_APPOINTMENTS_HELP_PLUGINS_PRIVACY_STATE="Bei der Installation eingeschaltet. Lassen Sie es eingeschaltet."
COM_APPOINTMENTS_HELP_PLUGINS_PRIVACY_OFF="Ist es ausgeschaltet, exportieren und entfernen Joomla-Datenschutzanfragen keine Termindaten, und die «Systemprüfung» meldet «Privacy-Plugin» als Problem."
COM_APPOINTMENTS_HELP_PLUGINS_PRIVACY_SETTINGS="Keine eigenen Einstellungen. Es folgt «Bei Datenlöschung» und «Rechtsgrund zum Blockieren formeller Entfernung» in den Optionen der Komponente."
COM_APPOINTMENTS_HELP_PLUGINS_CONTENT_TITLE="Inhalt - Appointments Datenschutz-Abschlussprüfung"
COM_APPOINTMENTS_HELP_PLUGINS_CONTENT_WHAT="Verhindert, dass eine Joomla-Datenschutzanfrage zur Entfernung als abgeschlossen markiert wird, solange die Termindaten dieser Anfrage nicht vollständig entfernt sind, z.B. nach einer fehlgeschlagenen Bereinigung von Kalenderkopien oder Konferenzen."
COM_APPOINTMENTS_HELP_PLUGINS_CONTENT_STATE="Bei der Installation eingeschaltet. Lassen Sie es eingeschaltet. Schalten Sie es nie aus, um eine Anfrage abzuschliessen."
COM_APPOINTMENTS_HELP_PLUGINS_CONTENT_OFF="Ist es ausgeschaltet, lässt sich eine Anfrage abschliessen, obwohl noch Termindaten vorhanden sind."
COM_APPOINTMENTS_HELP_PLUGINS_CONTENT_SETTINGS="Keine Einstellungen."
COM_APPOINTMENTS_HELP_PLUGINS_TASK_TITLE="Aufgabe - Termine"
COM_APPOINTMENTS_HELP_PLUGINS_TASK_WHAT="Stellt die Routinen der geplanten Aufgaben bereit (siehe <a href='#help-tasks'>Geplante Aufgaben</a>)."
COM_APPOINTMENTS_HELP_PLUGINS_TASK_STATE="Bei der Installation eingeschaltet. Lassen Sie es eingeschaltet."
COM_APPOINTMENTS_HELP_PLUGINS_TASK_OFF="Ist es ausgeschaltet, läuft keine Aufgabe der Komponente: keine Erinnerungen, keine Aufbewahrung, keine Übertragung an Close und keine Pflege der Internetkalender. Die «Systemprüfung» meldet «Scheduler-Plugin» als Problem."
COM_APPOINTMENTS_HELP_PLUGINS_TASK_SETTINGS="Keine eigenen Einstellungen. Jede Aufgabe hat ihren Zeitplan unter System → Geplante Aufgaben, die Erinnerungs- und die Aufbewahrungsaufgabe zusätzlich «Stapelgrösse»."
COM_APPOINTMENTS_HELP_PLUGINS_DAV_TITLE="System - Termine CalDAV"
COM_APPOINTMENTS_HELP_PLUGINS_DAV_WHAT="Stellt den Geräten die Internetkalender über CalDAV bereit, auch unter der Adresse /.well-known/caldav, und prüft die zeitweise Anmeldesperre, bevor Joomla ein Passwort prüft. Es wirkt nur bei eingeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_PLUGINS_DAV_STATE="Bei der Installation ausgeschaltet. Schalten Sie es nur ein, wenn Sie Internetkalender verwenden, zusammen mit «Benutzer - Termine Internetkalender» und nach abgeschlossener Einrichtung."
COM_APPOINTMENTS_HELP_PLUGINS_DAV_OFF="Ist es ausgeschaltet, kann kein Gerät abgleichen. Bei eingeschalteten Internetkalendern meldet die «Systemprüfung» das. Das Ausschalten löscht keine Kalenderdaten."
COM_APPOINTMENTS_HELP_PLUGINS_DAV_SETTINGS="Einstellung «CalDAV-Adresse» im Plugin: die vollständige HTTPS-Adresse der CalDAV-Schnittstelle, z.B. https://www.example.org/dav/. Leer bedeutet die Adresse der Website mit «dav/». Die Adresse muss unter der Adresse der Website liegen. Sie gilt für die Weiterleitung von /.well-known/caldav, die Anleitungen für die Geräte und die Mails."
COM_APPOINTMENTS_HELP_PLUGINS_ATTRIBUTION_TITLE="System - Termine Herkunft der Buchungen"
COM_APPOINTMENTS_HELP_PLUGINS_ATTRIBUTION_WHAT="Hält auf jeder Seite der Website in der Sitzung eines Besuchs fest, wie die Person auf die Website gelangt ist: Einstiegsseite, Kampagnenparameter und Klick-IDs, verweisende Seite eines anderen Hosts und Anzahl Seitenaufrufe. Eine spätere Buchung in derselben Sitzung speichert diese Herkunft. Kein eigenes Cookie, kein Skript. Seitenadressen werden ohne Fragment, ohne Benutzername und Passwort vor dem Host und ohne jeden Abfrageparameter gespeichert, der Zugangsdaten tragen kann: nach seinem Namen (zum Beispiel token, password, key, code, session, reset, invite oder signature) oder nach seinem Wert (ein JSON Web Token oder mindestens 32 Zeichen ohne Leerzeichen, in denen ein Abschnitt von 12 oder mehr Zeichen Buchstaben und Ziffern mischt, etwa ein Hex- oder Base64-Token oder eine UUID). Lesbare Werte wie «spring-2026-linkedin-retargeting-switzerland» bleiben. Kampagnenparameter (utm_*) und Klick-IDs bleiben immer erhalten."
COM_APPOINTMENTS_HELP_PLUGINS_ATTRIBUTION_STATE="Bei der Installation eingeschaltet, auch wenn ein Update es erstmals mitbringt. Es erfasst nichts, solange die Komponentenoption «Herkunft der Buchungen» ausgeschaltet ist."
COM_APPOINTMENTS_HELP_PLUGINS_ATTRIBUTION_OFF="Ist es ausgeschaltet, werden nur die Seiten der Komponente selbst erfasst. Eine Einstiegsseite anderswo, z.B. ein Beitrag mit Kampagnenparametern, fehlt dann in der Herkunft der Buchung. Um die Erfassung ganz abzuschalten, schalten Sie die Komponentenoption «Herkunft der Buchungen» aus."
COM_APPOINTMENTS_HELP_PLUGINS_ATTRIBUTION_SETTINGS="Keine eigenen Einstellungen. Die Komponentenoption «Herkunft der Buchungen» im Reiter «Allgemein» schaltet Erfassung und Speicherung ein oder aus."
COM_APPOINTMENTS_HELP_PLUGINS_USER_TITLE="Benutzer - Termine Internetkalender"
COM_APPOINTMENTS_HELP_PLUGINS_USER_WHAT="Entsperrt bei der Anmeldung mit Passwort die Schlüssel der Internetkalender einer Person, sperrt nach fehlgeschlagenen Anmeldungen zeitweise und sperrt die Geräte der Person, wenn ihr Passwort geändert oder ihr Konto gesperrt oder gelöscht wird. Es wirkt nur bei eingeschalteten Internetkalendern."
COM_APPOINTMENTS_HELP_PLUGINS_USER_STATE="Bei der Installation ausgeschaltet. Schalten Sie es zusammen mit «System - Termine CalDAV» ein, wenn Sie Internetkalender verwenden."
COM_APPOINTMENTS_HELP_PLUGINS_USER_OFF="Ist es ausgeschaltet, bleiben die Schlüssel nach der Anmeldung gesperrt und die Meldung «Die Schlüssel sind gesperrt.» erscheint. Eine Passwortänderung oder ein gesperrtes Konto sperrt die Geräte der Person dann nicht mehr. Bei eingeschalteten Internetkalendern meldet die «Systemprüfung» das."
COM_APPOINTMENTS_HELP_PLUGINS_USER_SETTINGS="Keine Einstellungen. Die Internetkalender und ihre Benutzergruppen stellen Sie in den Optionen der Komponente im Register «Internetkalender» ein."
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_CLEANUP="Internetkalender: geplante Aufgabe «Aufräumen»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_LOG="Internetkalender: geplante Aufgabe «Protokoll»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_INVITATIONS="Internetkalender: geplante Aufgabe «abgelaufene Einladungen»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_RETENTION="Internetkalender: geplante Aufgabe «Aufbewahrung»"
COM_APPOINTMENTS_TEAM_F_SYSTEM_TASK_FIX="Legen Sie die Aufgabe unter System, Geplante Aufgaben an und lassen Sie sie täglich laufen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE="Internetkalender: Prüfungen der eigenen Adresse"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE_OFF="Nicht ausgeführt. Nutzen Sie oben «Hosting prüfen»."
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE_RUN="Hosting prüfen"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE_UNAVAILABLE="Auf diesem Server nicht möglich"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROBE_FIX="Der Server kann keine Anfragen an die eigene Adresse senden (PHP curl fehlt, oder die öffentliche Adresse der Website ist nicht gesetzt). Prüfen Sie die folgenden Punkte mit einem Kalenderprogramm."
COM_APPOINTMENTS_TEAM_F_SYSTEM_NO_ANSWER="Keine Antwort"
COM_APPOINTMENTS_TEAM_F_SYSTEM_NOT_CONFIRMED="Nicht bestätigt"
COM_APPOINTMENTS_TEAM_F_SYSTEM_METHODS="Internetkalender: Kalendermethoden erreichen die Website"
COM_APPOINTMENTS_TEAM_F_SYSTEM_METHODS_FIX="Der Webserver oder eine Firewall-Regel (z.B. ModSecurity) hält diese Methoden vor Joomla an. Bitten Sie den Hoster, OPTIONS, PROPFIND, REPORT, PUT, DELETE und MKCALENDAR für die Kalenderadresse zuzulassen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_AUTH_HEADER="Internetkalender: Der Authorization-Header erreicht PHP"
COM_APPOINTMENTS_TEAM_F_SYSTEM_AUTH_HEADER_FIX="Verwenden Sie Joomlas htaccess.txt als .htaccess, die den Header mit der Regel E=HTTP_AUTHORIZATION weitergibt, oder bitten Sie den Hoster, den Authorization-Header an PHP weiterzugeben."
COM_APPOINTMENTS_TEAM_F_SYSTEM_WELL_KNOWN="Internetkalender: /.well-known/caldav führt zur Kalenderadresse"
COM_APPOINTMENTS_TEAM_F_SYSTEM_WELL_KNOWN_FIX="Der Hoster beantwortet /.well-known/ selbst. Bitten Sie darum, die Adresse an Joomla weiterzugeben, oder tragen Sie in den Kalenderprogrammen die vollständige Kalenderadresse ein."
COM_APPOINTMENTS_TEAM_F_PRIVACY_OTHER_PERSON="eine andere Person"
COM_APPOINTMENTS_TEAM_F_PRIVACY_LOG_TRUNCATED="Nur die ersten %d Protokolleinträge sind aufgeführt. Die übrigen erhalten Sie beim Betreiber."
COM_APPOINTMENTS_TEAM_F_SYSTEM_HSTS="Internetkalender: Die Website sendet Strict-Transport-Security (HSTS)"
COM_APPOINTMENTS_TEAM_F_SYSTEM_HSTS_FIX="Empfohlen: Schalten Sie HSTS im Joomla-Plugin «System - HTTP-Header» oder im Webserver ein, damit Browser die Website nie ohne HTTPS aufrufen."
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROXY="Internetkalender: Website hinter einem Load Balancer"
COM_APPOINTMENTS_TEAM_F_SYSTEM_PROXY_FIX="Joomla übernimmt die Adresse des Besuchers dann aus X-Forwarded-For. Stellen Sie sicher, dass der Proxy diesen Header überschreibt, sonst kann ein Programm die Adresse wählen, die die Anmeldesperre zählt."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR="Internetkalender: Schutz gegen eine zurückgespielte Datenbank"
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_FIX="Der Schutz gegen eine ohne ihre Dateien zurückgespielte Datenbank ist aus: Die Komponente kann ihre Ankerdatei unter administrator/components/com_appointments-data nicht schreiben. Erlauben Sie dem Webserver, dort zu schreiben."
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_CLEAR="Noch nicht verschlüsselte Buchungen"
COM_APPOINTMENTS_TEAM_F_SYSTEM_BOOKINGS_CLEAR_FIX="Die geplante Aufgabe «Aufbewahrung der Internetkalender» verschlüsselt sie in Stapeln. Lassen Sie sie laufen, bis die Zahl 0 ist."
COM_APPOINTMENTS_TEAM_F_DEVICES_UNLOCK="Anmeldesperre aufheben"
COM_APPOINTMENTS_TEAM_F_DEVICES_UNLOCKED="Anmeldesperre für %d Benutzer aufgehoben."
COM_APPOINTMENTS_TEAM_F_PRIVACY_CONTENT_NOTE="Enthalten sind nur Zeiten, Titel, Ort und Ihre eigene Teilnahme. Beschreibungen, Notizen, Anhänge und weitere Teilnehmende sind weggelassen, weil sie andere Personen betreffen können."
COM_APPOINTMENTS_TEAM_F_PRIVACY_BOOKINGS_UNREADABLE="Buchungen, die für diese Anfrage nicht gelesen werden konnten (nur die Anzahl). Der Betreiber prüft sie gesondert."
COM_APPOINTMENTS_TEAM_F_PRIVACY_BOOKINGS_UNREADABLE_ADMIN="Die Anfrage ist unvollständig: %d Buchung(en) konnten nicht entschlüsselt werden und wurden nicht durchsucht. Prüfen Sie das Site-Secret und die Systemprüfung."
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_BEHIND="Internetkalender: noch nicht verankerte Kalender und Benutzer"
COM_APPOINTMENTS_TEAM_F_SYSTEM_ANCHOR_BEHIND_FIX="Für diese ist der Schutz gegen eine zurückgespielte Datenbank noch nicht aktiv. Hinweis: Wer nur die Datenbank aus einem Backup zurückspielt, das älter ist als die letzte Rotation, der letzte Entzug oder die letzte Gerätesperre, für den bleiben die betroffenen Kalender und Benutzer geschlossen, bis administrator/components/com_appointments-data/epochs.php gelöscht wird. Das setzt den Schutz zurück."
COM_APPOINTMENTS_TEAM_F_SYSTEM_GUARD="Internetkalender: Ausfälle der Anmeldesperre in den letzten 24 Stunden"
COM_APPOINTMENTS_TEAM_F_SYSTEM_GUARD_FIX="Die Anmeldesperre konnte nicht geprüft werden, und Anmeldungen auf der Website liefen ohne sie weiter. Prüfen Sie die Datenbank und das Joomla-Protokoll."
