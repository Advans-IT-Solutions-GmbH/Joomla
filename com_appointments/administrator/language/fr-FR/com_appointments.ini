COM_APPOINTMENTS_SCHEDULE_ERROR_WEEKDAY="Chaque plage hebdomadaire a besoin d'un jour de la semaine."
COM_APPOINTMENTS_SCHEDULE_ERROR_DATE="Une entrée pour une date précise a besoin d'une date valable."
COM_APPOINTMENTS_SCHEDULE_ERROR_TIME="Veuillez indiquer les heures en heures et minutes, par exemple 09:00."
