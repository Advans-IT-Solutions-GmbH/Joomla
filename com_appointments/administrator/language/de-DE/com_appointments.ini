COM_APPOINTMENTS_TEAM_C_GRANTS_HEADING="Freigaben"
COM_APPOINTMENTS_TEAM_C_GRANTS_INTRO="Inhalte erfordern eine wirksame Freigabe und echte Schlüssel, auch für Administratoren. Komponentenadministratoren können Einstellungen und Freigaben ohne Inhaltszugriff verwalten."
COM_APPOINTMENTS_TEAM_C_ADMINISTRATION_HELP="Super Users und Komponentenadministratoren können fremde und verwaiste Kalender administrieren: Einstellungen, Freigaben, Eigentümerzuweisung und Löschung gemäss Joomlas Anlege-, Bearbeitungs- und Löschrechten. Das ist kein Inhaltszugriff: Lesen oder Synchronisieren von Inhalten und Rotation der Kalenderinhaltsschlüssel brauchen weiterhin echte wirksame Freigaben und Schlüssel. Schlüsselhaltende Freigaben benötigen echte Hüllen von einem Schlüsselhalter oder einer berechtigten Wiederherstellung; ohne sie bleiben sie ausstehend. Buchungsanbieter brauchen weiterhin eigenen wirksamen Zugriff 'Schreiben'."
COM_APPOINTMENTS_TEAM_C_KEY_SETUP_HELP="Aktivieren Sie für die Ersteinrichtung Internetkalender und ihr Benutzer-Plugin, konfigurieren Sie interne Teamgruppen und zugelassene zweite Faktoren und legen Sie im Wiederherstellungsbereich den Wiederherstellungsschlüssel an. Melden Sie sich in dieser Backend-Sitzung mit Passwort und zugelassenem zweiten Faktor an. Wählen Sie bei einem neuen Kalender Ihr eigenes berechtigtes Teamkonto: Speichern kann dann einen fehlenden ersten Benutzerschlüssel anlegen. Listen-/Formular-GETs und Administratorrechte allein tun das nicht und initialisieren auch keinen fremden Schlüssel."
COM_APPOINTMENTS_TEAM_C_OWNER_ASSIGN="Eigentümer zuweisen"
COM_APPOINTMENTS_TEAM_C_OWNER_ASSIGN_DESC="Einem aktiven Teamkonto eine Verwaltungsfreigabe zuweisen. Ohne echte Schlüsselhüllen bleibt sie ausstehend und erlaubt weder Inhaltszugriff noch Verwaltung als Kalendermitglied. Die Freigabe des bisherigen Eigentümers bleibt erhalten; bei Bedarf separat entziehen. Die Zuweisung erfordert eine Passwortanmeldung und einen zugelassenen zweiten Faktor."
