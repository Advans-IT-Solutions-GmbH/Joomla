; Installer notices
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_UPDATED="Privacy - J2Commerce has been updated to version %s."
PLG_PRIVACY_J2COMMERCE_ENABLE_HINT="The plugin is disabled. Enable it under <strong>System → Manage → Plugins</strong> (search for <strong>Privacy - J2Commerce</strong>)."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC_TASK_FAILED="<strong>System → Manage → Plugins</strong> → search for <strong>Privacy - J2Commerce</strong> → enable. The bundled <strong>Task - J2Commerce Privacy Cleanup</strong> plugin could <strong>not</strong> be installed automatically; see the warning above and install the package again."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_MISSING="The bundled task plugin (Task - J2Commerce Privacy Cleanup) was not found in the installation package."
PLG_PRIVACY_J2COMMERCE_WARN_TASK_PLUGIN_INSTALL_FAILED="The bundled task plugin (Task - J2Commerce Privacy Cleanup) could not be installed automatically. The automatic cleanup task is not available until it is installed."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_MISSING="Neither J2Commerce 6 (com_j2commerce) nor J2Store/J2Commerce 4 (com_j2store) is installed. The plugin has no J2Commerce data to process until one of them is installed."
PLG_PRIVACY_J2COMMERCE_WARN_OVERRIDES_FAILED="The following template overrides could not be copied: %s. Copy them manually from plugins/privacy/j2commerce/overrides/."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASKS_REMOVED="Deleted %d scheduled task(s) of type J2Commerce - Automatic data cleanup."
PLG_PRIVACY_J2COMMERCE_UNINSTALL_TASK_PLUGIN_REMOVED="The bundled task plugin (Task - J2Commerce Privacy Cleanup) was removed together with this plugin."
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE="Given in"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_CHECKOUT="Checkout, order %s"
PLG_PRIVACY_J2COMMERCE_CONSENT_SOURCE_ACCOUNT="User account (registration or profile)"
PLG_PRIVACY_J2COMMERCE_NO_CONSENT_RECORDED="No recorded consent was found for your account or orders."
PLG_PRIVACY_J2COMMERCE_MYPROFILE_GUEST_REQUEST_DESC="The online privacy request form requires a user account. As a guest customer, send your request for a copy or deletion of your data by email."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_MISSING="The bundled consent system plugin (System - J2Commerce Privacy Consent) was not found in the installation package. Checkout consent is neither checked nor recorded."
PLG_PRIVACY_J2COMMERCE_WARN_CONSENT_PLUGIN_INSTALL_FAILED="The bundled consent system plugin (System - J2Commerce Privacy Consent) could not be installed automatically. Checkout consent is only checked and recorded after it is installed."
PLG_PRIVACY_J2COMMERCE_LEGACY_CONSENTS_ANONYMIZED="%d consent record(s) of an earlier site template version were anonymized (e-mail address, IP address and user agent removed). They no longer count as consent."
PLG_PRIVACY_J2COMMERCE_WARN_LEGACY_CONSENTS_FAILED="Consent records of an earlier site template version could not be anonymized: %s. The cleanup task will try again."
PLG_PRIVACY_J2COMMERCE_CONSENTS_INCOMPLETE="Consent records or the AcyMailing placeholder contact of this request could not be processed completely. The orders of the request were not anonymised in this run, so that they can still be found. Fix the cause according to the log (category plg_privacy_j2commerce) and carry out the removal again."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_OUTDATED="These J2Commerce 6 checkout overrides neither fire the J2Commerce event AfterDisplayShippingPayment nor render the consent checkbox: %s. When consent is required, the checkout cannot be completed with them. Add the AfterDisplayShippingPayment event call of the J2Commerce core template (components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php) before the Continue button."
PLG_PRIVACY_J2COMMERCE_WARN_J2STORE_CHECKOUT_OVERRIDE_OUTDATED="These J2Store 4 checkout overrides deployed by an earlier version of this plugin are missing at least one element the step needs in order to submit itself: %s. Required are the Joomla form token, the three hidden fields task, option and view, and the Continue button as type=\"button\" with the id button-payment-method, which has to carry the attribute disabled whenever $_showConsent and $_consentRequired both hold, so a required consent cannot be bypassed while the validator is not yet loaded. J2Store 4.1.8 rejects the shipping_payment_method_validate step without a token with “Invalid Token”. An update does not overwrite such a copy. Replace it with overrides/com_j2store/checkout/default_shipping_payment.php of this package."
PLG_PRIVACY_J2COMMERCE_WARN_CHECKOUT_OVERRIDE_BUNDLED="These J2Commerce 6 checkout overrides were copied by an earlier version of this plugin and were not changed by this update because they differ from the shipped version or could not be renamed: %s. They replace the J2Commerce core templates (bootstrap5 and uikit) and lack newer core features such as payment-step custom fields and payment descriptions. Compare them with components/com_j2commerce/tmpl/checkout/bootstrap5/default_shipping_payment.php and remove them if they contain no changes of your own."
PLG_PRIVACY_J2COMMERCE_WARN_J2COMMERCE_TOO_OLD="J2Commerce %1$s is installed. The consent checkbox is shown through the J2Commerce event AfterDisplayShippingPayment, which the J2Commerce checkout templates fire from version %2$s. Update J2Commerce; until then the checkbox is missing and, when consent is required, the checkout cannot be completed."
PLG_PRIVACY_J2COMMERCE_CHECKOUT_OVERRIDE_RETIRED="Unchanged J2Commerce 6 checkout overrides copied by an earlier version of this plugin were disabled (renamed with the suffix %2$s): %1$s. The J2Commerce core template now shows the checkout step, including the consent checkbox. Delete the renamed files once the checkout works."

; Guest privacy requests
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_LABEL="Guest Request Confirmation"
PLG_PRIVACY_J2COMMERCE_GUEST_CONFIRMATION_DESC="Customers without a user account (guest orders) confirm a privacy request that an administrator created under Users → Privacy → Requests on a page of this plugin, with their e-mail address and the code from the request e-mail. The links in that e-mail lead to this page. Guest orders are assigned to a request through its e-mail address in any case."
PLG_PRIVACY_J2COMMERCE_CONFIRM_TITLE="Confirm privacy request"
PLG_PRIVACY_J2COMMERCE_CONFIRM_INTRO="Enter the e-mail address the request was created for and the confirmation code from the e-mail. The code is valid for 24 hours."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EMAIL_LABEL="E-mail address"
PLG_PRIVACY_J2COMMERCE_CONFIRM_TOKEN_LABEL="Confirmation code"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUBMIT="Confirm request"
PLG_PRIVACY_J2COMMERCE_CONFIRM_SUCCESS="Thank you. Your request has been confirmed and will now be processed."
PLG_PRIVACY_J2COMMERCE_CONFIRM_FAILED="The request could not be confirmed. Check the e-mail address and the confirmation code. If the problem persists, please contact us."
PLG_PRIVACY_J2COMMERCE_CONFIRM_EXPIRED="The confirmation code has expired and the request was cancelled. Please contact us so that we can create a new request."
PLG_PRIVACY_J2COMMERCE_CONFIRM_UNAVAILABLE="Privacy requests cannot be confirmed on this page. Please contact us."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST="Your data deletion request has been carried out. Your saved addresses and any newsletter subscription were deleted. Order data is subject to a legal retention obligation and is kept until the date shown. It is anonymized afterwards. For orders with a lifetime license, the order e-mail address is kept so that the license can be reactivated."
PLG_PRIVACY_J2COMMERCE_ADMIN_NOTIFICATION_GUEST_DATA_DELETION="Guest customer %s (no user account) requested data deletion."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_GUEST_ADDRESSES_KEPT="Your data deletion request has been carried out. Any newsletter subscription was deleted. Saved addresses are not deleted under the settings of this shop. Contact us if you want them deleted. Order data is subject to a legal retention obligation and is kept until the date shown. It is anonymized afterwards. For orders with a lifetime license, the order e-mail address is kept so that the license can be reactivated."
PLG_PRIVACY_J2COMMERCE_REMOVAL_CUSTOMER_BODY_ADDRESSES_KEPT="Your data deletion request has been carried out. Your shopping carts and newsletter data were deleted, and your customer account was anonymized. Saved addresses are not deleted under the settings of this shop. Contact us if you want them deleted. Order data is subject to a legal retention obligation and is kept until the date shown. It is anonymized afterwards. For orders with a lifetime license, the order e-mail address is kept so that the license can be reactivated."
PLG_PRIVACY_J2COMMERCE_REMOVAL_ACCOUNT_MISMATCH="J2Commerce: Joomla found the user account %1$s for the request address %2$s. These are different addresses (Joomla compares e-mail addresses without accents and special letter forms). The request was refused, so that the data of that account stays untouched. Check the address of the request."
PLG_PRIVACY_J2COMMERCE_REMOVAL_MARKER_FAILED="The removal request cannot be carried out: the user account could not be marked for a later repetition of the removal. Nothing was removed. Check the database according to the log (category plg_privacy_j2commerce) and try again."
PLG_PRIVACY_J2COMMERCE_EXPORT_ACCOUNT_MISMATCH="J2Commerce: Joomla found the user account %1$s for the request address %2$s. These are different addresses. The J2Commerce data of that account is not part of this export, but Joomla adds the data of the account itself. Do not send this export. Check the address of the request."
PLG_PRIVACY_J2COMMERCE_WARN_ATTEMPTS_TABLE_FAILED="The table of the confirmation attempts (#__privacy_j2commerce_attempts) could not be created: %s. Until it exists, the confirmation page for privacy requests confirms nothing. Install the package again."

