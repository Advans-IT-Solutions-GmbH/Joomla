PLG_SYSTEM_APPOINTMENTSATTRIBUTION="Système - Rendez-vous origine des réservations"
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_DESC="Enregistre dans la session du visiteur comment il est arrivé sur le site (page d'entrée, paramètres de campagne, page de provenance d'un autre hôte, nombre de pages vues), afin qu'une réservation faite plus tard dans la même session en conserve l'origine. Aucun cookie propre, aucun script. N'enregistre rien tant que l'option du composant « Origine des réservations » n'est pas activée."
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_HELP_NOTE="Ce que fait ce plugin et comment il fonctionne avec le composant Rendez-vous est expliqué dans <a href='index.php?option=com_appointments&amp;view=help#help-plugins'>Rendez-vous › Aide et conseils</a>, section «Plugins fournis». Le bouton «Aide» en haut à droite ouvre la même section."
PLG_SYSTEM_APPOINTMENTSATTRIBUTION_HELP_URL="index.php?option=com_appointments&view=help&tmpl=component#help-plugins"
