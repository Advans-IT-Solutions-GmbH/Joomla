PLG_SYSTEM_DMARCMTASTS="Système - Politique MTA-STS DMARC"
PLG_SYSTEM_DMARCMTASTS_XML_DESCRIPTION="Publie la politique MTA-STS (RFC 8461) pour les domaines configurés à l'adresse /.well-known/mta-sts.txt, générée à partir des paramètres du composant DMARC Reports."
PLG_SYSTEM_DMARCMTASTS_ENABLE_HINT="Le plugin est désactivé. Activez-le dans <strong>Système → Gérer → Plugins</strong> (recherchez <strong>System - DMARC MTA-STS Policy</strong>) pour que le point de terminaison de la politique puisse répondre."
PLG_SYSTEM_DMARCMTASTS_POSTINSTALL_INTRO="Le plugin de politique MTA-STS est installé et activé. Activez MTA-STS et renseignez vos serveurs de messagerie dans <strong>Composants → DMARC Reports → Options</strong>, puis publiez les enregistrements DNS indiqués par le Centre d'actions afin que le point de terminaison de la politique soit accessible."
