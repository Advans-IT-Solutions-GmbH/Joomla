COM_APPOINTMENTS_SCHEDULE_FIELD_OVERRIDES_DESC="Eine Zeile je Datum, das vom wöchentlichen Muster abweicht."
COM_APPOINTMENTS_SCHEDULE_WEEKLY_HEADING="Wöchentliche Zeiten"
COM_APPOINTMENTS_SCHEDULE_WEEKLY_INTRO="Legen Sie eine Zeile je Zeitfenster an. Mehrere Zeilen am gleichen Wochentag sind erlaubt, etwa ein Vormittag und ein Nachmittag. Liegt das Ende nicht nach dem Beginn, läuft das Zeitfenster über Mitternacht und gilt als ein Fenster."
COM_APPOINTMENTS_SCHEDULE_OVERRIDES_HEADING="Zeiten für einzelne Daten"
COM_APPOINTMENTS_SCHEDULE_OVERRIDES_INTRO="Ein hier eingetragenes Datum ersetzt die wöchentlichen Zeiten dieses Datums vollständig. Für einen Feiertag oder eine ganztägige Abwesenheit markieren Sie das Datum als geschlossen."
