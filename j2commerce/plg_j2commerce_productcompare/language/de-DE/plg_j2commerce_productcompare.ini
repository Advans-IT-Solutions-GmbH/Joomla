PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_SEARCH="Plugin-Einstellungen nach Bedarf anpassen: wo die Vergleichsschaltfläche erscheint (Produktliste, Produktdetails), die maximale Anzahl zu vergleichender Produkte sowie Beschriftung und CSS-Klasse der Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_J2STORE_NOTE="J2Store 4: Die Vergleichsschaltfläche erscheint in Produktlisten nach der Warenkorb-Schaltfläche und am Ende der Produktseite. J2Store zeigt den Warenkorb-Bereich nur, wenn der Warenkorb angezeigt werden darf. Im Katalogmodus und für Gäste, wenn der Warenkorb registrierten Benutzern vorbehalten ist, fehlt die Vergleichsschaltfläche deshalb in Produktlisten. Dafür braucht es die J2Store-Produktlayouts, die diese Ereignisse auslösen (app_bootstrap3/4/5); Template-Overrides ohne diese Ereignis-Aufrufe zeigen keine Schaltfläche."
PLG_J2COMMERCE_PRODUCTCOMPARE_POSTINSTALL_DOCS="Dokumentation: <strong>README.md</strong> im Plugin-Ordner · Support: <a href='https://advans.ch' style='color:#2563eb'>advans.ch</a>"
