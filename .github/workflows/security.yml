name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: Advans-IT-Solutions-GmbH/.github/.github/workflows/reusable-security.yml@2d64da0c83e70e2f230f07143b0699b7e75b62f3 # v1
    with:
      fail_on_findings: false   # Semgrep/zizmor: report-only
      gitleaks_fail: true       # Gitleaks: blockierendes Gate für neue Secrets