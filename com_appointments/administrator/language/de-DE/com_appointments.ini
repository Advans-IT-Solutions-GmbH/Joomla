COM_APPOINTMENTS_MAIL_CALENDAR_BUSY_BODY="Im Kalender {calendar_title} ist eine Zeit neu belegt.\nVon: {start}\nBis: {end}\nZeitzone: {timezone}\n\nIhre Rolle in diesem Kalender zeigt nur belegte Zeiten. Diese Mail enthält deshalb keine Angaben zum Termin."
