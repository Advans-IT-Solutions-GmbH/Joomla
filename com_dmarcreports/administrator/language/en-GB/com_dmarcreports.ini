; Action items (title + text). Placeholders are positional.
COM_DMARCREPORTS_ACTION_NO_DATA_TITLE="No reports yet"
COM_DMARCREPORTS_ACTION_NO_DATA_TEXT="No aggregate reports have been imported for %1$s yet. Publish a DMARC record with a rua address, then import the first reports."

COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TITLE="Move to p=quarantine"
COM_DMARCREPORTS_ACTION_MOVE_TO_QUARANTINE_TEXT="%2$s%% of observed mail for %1$s passes DMARC, meeting the configured threshold to move from p=none to p=quarantine. Review the failing sources before enforcing so legitimate forwarded mail is not quarantined."

COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TITLE="Stay at p=none for now"
COM_DMARCREPORTS_ACTION_STAY_AT_NONE_TEXT="Only %2$s%% of mail for %1$s passes DMARC, below the %3$s%% needed to move to p=quarantine. Fix the failing senders first."

COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TITLE="Move to p=reject"
COM_DMARCREPORTS_ACTION_MOVE_TO_REJECT_TEXT="%2$s%% of observed mail for %1$s passes DMARC under p=quarantine, meeting the configured threshold to move to p=reject. Review the remaining failing sources before enforcing so legitimate mail is not rejected."

COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TITLE="Stay at p=quarantine for now"
COM_DMARCREPORTS_ACTION_STAY_AT_QUARANTINE_TEXT="Only %2$s%% of mail for %1$s passes DMARC, below the %3$s%% needed to move to p=reject. Resolve the remaining failures first."

COM_DMARCREPORTS_ACTION_ENFORCED_TITLE="Enforcement reached"
COM_DMARCREPORTS_ACTION_ENFORCED_TEXT="%1$s is enforcing p=reject. Keep importing reports and watch for new sending sources."
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TITLE="Partial enforcement only"
COM_DMARCREPORTS_ACTION_PARTIAL_ENFORCEMENT_TEXT="%1$s publishes p=reject but only %2$d%% of its mail is subject to the policy; receivers are only asked to treat the remainder as if p=quarantine applied (RFC 7489, receiver-dependent). Raise pct to 100 so the policy applies to all mail."
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TITLE="Partial quarantine only"
COM_DMARCREPORTS_ACTION_PARTIAL_QUARANTINE_TEXT="%1$s publishes p=quarantine but only %2$d%% of its mail is subject to the policy. Raise pct to 100 to exercise quarantine on all mail before advancing towards reject."

COM_DMARCREPORTS_ACTION_AT_TARGET_TITLE="Target policy reached"
COM_DMARCREPORTS_ACTION_AT_TARGET_TEXT="%1$s is already at its chosen target policy p=%2$s. Keep importing reports and watch for new sending sources; raise the target if you want to tighten further."

COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TITLE="Mail at risk under p=reject"
COM_DMARCREPORTS_ACTION_WOULD_BE_REJECTED_TEXT="%1$d message(s), %2$s%% of the volume, are unaligned and would be rejected under p=reject. Authenticate these senders before tightening the policy."

COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TITLE="Unauthenticated mail was delivered"
COM_DMARCREPORTS_ACTION_ALIGN_SOURCE_TEXT="%1$s (%2$s) sent %3$d message(s), %4$s%% of the volume, that failed DMARC and were still delivered. If it is a service of yours, switch on DKIM signing for your domain there. If not, someone is using your domain's name: the stricter policy (quarantine, then reject) stops this mail, and the policy entry tells you when that step is safe."
COM_DMARCREPORTS_ACTION_SPF_ONLY_SOURCE_TITLE="Mail passed only through SPF, without your DKIM signature"
COM_DMARCREPORTS_ACTION_SPF_ONLY_SOURCE_TEXT="%1$s (%2$s) sent %3$d of %5$d message(s) with your domain as sender that passed DMARC only because your SPF record allows the server, without your domain's DKIM signature (%4$d carried it). SPF alone does not prove that you sent them: if your SPF record includes a provider's shared mail servers, every other customer of that provider passes SPF for your domain too. If it is a service of yours, switch on DKIM signing for your domain in that service. If it is not, make sure your own mail is DKIM-signed, then remove the part of your SPF record that allows this server, or ask the provider to stop other customers from sending with your domain."

COM_DMARCREPORTS_ACTION_NEW_SOURCE_TITLE="New sending source seen"
COM_DMARCREPORTS_ACTION_NEW_SOURCE_TEXT="%1$s sends with your domain's DKIM signature and was confirmed automatically. Nothing to do."
COM_DMARCREPORTS_ACTION_SHOW_SOURCE="Show this source"

COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TITLE="Pass rate dropped"
COM_DMARCREPORTS_ACTION_PASS_RATE_DROP_TEXT="The DMARC pass rate fell from %1$s%% to %2$s%%. Check for a broken sender or a new unaligned source before tightening the policy."

COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TITLE="Publish a DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_MISSING_TEXT="No DMARC record was found for %1$s. Publish one at p=none with a rua address to start collecting reports."
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TITLE="Check the organizational domain's DMARC"
COM_DMARCREPORTS_ACTION_DNS_DMARC_SUBDOMAIN_CHECK_TEXT="%1$s is a subdomain with no DMARC record of its own. It may be covered by the organizational domain's policy, which receivers apply as a fallback. Confirm that the organizational domain publishes DMARC, and publish a dedicated record here only if this subdomain needs different handling."
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TITLE="Remove the duplicate DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_DUPLICATE_TEXT="More than one DMARC record is published for %1$s. This is invalid and receivers ignore the policy; keep exactly one record at _dmarc.%1$s."
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TITLE="Fix the malformed DMARC record"
COM_DMARCREPORTS_ACTION_DNS_DMARC_INVALID_TEXT="The DMARC record for %1$s is malformed: the p value must be none, quarantine or reject, and pct must be a whole number from 0 to 100. Receivers cannot apply an invalid record, so correct it at _dmarc.%1$s."

COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TITLE="DMARC policy is p=none"
COM_DMARCREPORTS_ACTION_DNS_DMARC_POLICY_NONE_TEXT="The published DMARC record for %1$s is at p=none and provides no protection yet. Plan the move to quarantine once your senders pass."

COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TITLE="Add a rua address"
COM_DMARCREPORTS_ACTION_DNS_DMARC_NO_RUA_TEXT="The DMARC record for %1$s has no rua address, so no aggregate reports are being requested. Add rua=mailto: to receive them."

COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TITLE="DMARC pct is below 100"
COM_DMARCREPORTS_ACTION_DNS_DMARC_PCT_TEXT="The DMARC record applies the policy to only %1$s%% of mail. Raise pct to 100 once you are confident."

COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TITLE="Consider publishing an SPF record"
COM_DMARCREPORTS_ACTION_DNS_SPF_MISSING_TEXT="No SPF record was found for %1$s. DMARC can still pass through DKIM or through SPF at the envelope sender domain, so this is not necessarily a problem; publish one if you want this domain to authenticate its sending hosts by IP as well."
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TITLE="Remove the duplicate SPF record"
COM_DMARCREPORTS_ACTION_DNS_SPF_DUPLICATE_TEXT="More than one SPF record is published for %1$s. This is invalid and causes a permerror; merge them into a single record."
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TITLE="DNS lookup failed"
COM_DMARCREPORTS_ACTION_DNS_LOOKUP_ERROR_TEXT="The DNS lookup for %1$s failed, so its DMARC and SPF records could not be checked. This is usually temporary; retry shortly, and if it persists check the server's DNS resolver."
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TITLE="Add MX hosts for MTA-STS"
COM_DMARCREPORTS_ACTION_MTASTS_NO_MX_TEXT="MTA-STS is enabled for %1$s but no MX hosts are configured, so no policy can be built. Add the receiving mail servers in the component options under MTA-STS."
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TITLE="Publish the MTA-STS record and policy host"
COM_DMARCREPORTS_ACTION_MTASTS_PUBLISH_TEXT="Publish a TXT record at %1$s with the value \"%2$s\", and make sure the policy is reachable with a valid TLS certificate at %3$s. Before using enforce, enable diagnostics and verify actual DNS MX coverage in the domain detail or System Check. The component cannot publish the host or DNS records for you."
COM_DMARCREPORTS_ACTION_MTASTS_MX_LOOKUP_ERROR_TITLE="Retry the MTA-STS MX check"
COM_DMARCREPORTS_ACTION_MTASTS_MX_LOOKUP_ERROR_TEXT="The DNS MX lookup for %1$s failed. Policy coverage is unverified; retry the check before switching to enforce."
COM_DMARCREPORTS_ACTION_MTASTS_MX_NO_ANSWER_TITLE="Verify receiving MX records"
COM_DMARCREPORTS_ACTION_MTASTS_MX_NO_ANSWER_TEXT="No usable DNS MX targets were returned for %1$s (including domains with null MX). Policy coverage cannot be confirmed. Verify whether the domain receives mail and check its MX records before using enforce."
COM_DMARCREPORTS_ACTION_MTASTS_MX_UNCOVERED_TITLE="Cover the actual receiving MX hosts"
COM_DMARCREPORTS_ACTION_MTASTS_MX_UNCOVERED_TEXT="The configured MTA-STS policy for %1$s does not cover these DNS MX hosts: %2$s. Correct the MX patterns, publish the updated policy and TXT id, then recheck before using enforce. An enforcing policy mismatch can defer delivery and eventually cause a bounce."
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TITLE="Update the MTA-STS record id"
COM_DMARCREPORTS_ACTION_MTASTS_RECORD_DRIFT_TEXT="The published _mta-sts record id (%1$s) differs from the current policy id (%2$s). Update the TXT record to \"%3$s\" so senders pick up the latest policy."
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TITLE="MTA-STS lookup failed"
COM_DMARCREPORTS_ACTION_MTASTS_LOOKUP_ERROR_TEXT="The _mta-sts DNS lookup for %1$s failed, so the record could not be validated. This is usually temporary; retry shortly, and if it persists check the server's DNS resolver."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TITLE="MTA-STS policy not reachable"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_UNREACHABLE_TEXT="The policy at %1$s could not be fetched over HTTPS. Check that the mta-sts host exists, presents a valid TLS certificate and that its web server passes /.well-known/mta-sts.txt to Joomla (see the MTA-STS plugin documentation)."
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TITLE="Hosted MTA-STS policy is out of date"
COM_DMARCREPORTS_ACTION_MTASTS_POLICY_DRIFT_TEXT="The policy served at %1$s does not match the configured mode and MX hosts. Re-publish it, or confirm the system plugin is enabled so it is served automatically."
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TITLE="Switch MTA-STS to enforce"
COM_DMARCREPORTS_ACTION_MTASTS_MODE_TESTING_TEXT="The MTA-STS record and policy for %1$s are consistent and cover the current DNS MX hosts, but remain in testing mode. This check does not test SMTP STARTTLS or MX certificates. Once those are verified and TLS-RPT reports look clean, switch the policy mode to enforce."
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TITLE="Publish the TLS-RPT record"
COM_DMARCREPORTS_ACTION_TLSRPT_PUBLISH_TEXT="Publish a TXT record at %1$s with the value \"%2$s\" so TLS reporting is delivered to the configured address."
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TITLE="Configure a TLS-RPT reporting address"
COM_DMARCREPORTS_ACTION_TLSRPT_MISSING_RUA_TEXT="TLS-RPT reporting is enabled for %1$s but no valid reporting address is configured, so no record can be published and TLS reports will never arrive. Set a valid mailto: or https: address in the component options."

COM_DMARCREPORTS_ACTION_GENERIC_TITLE="Review this item"
COM_DMARCREPORTS_ACTION_GENERIC_TEXT="This item needs your review."

