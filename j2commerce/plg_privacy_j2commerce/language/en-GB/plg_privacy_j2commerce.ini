; Help tab of the plugin edit screen (manifest, field type helppage)
PLG_PRIVACY_J2COMMERCE_HELP_NOTE="The ‘Help’ tab explains what this plugin does, how to set it up and what to do if something goes wrong."
PLG_PRIVACY_J2COMMERCE_HELP_TAB="Help"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_TITLE="What this plugin does"
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_P1="The plugin adds the shop data to Joomla's privacy functions (Privacy component, ‘Users → Privacy → Requests’). It supports J2Commerce 6 and J2Store 4 (J2Commerce 4)."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI1="<strong>Export:</strong> an export request contains the orders with their items, billing and shipping data, the saved addresses, the checkout consents of guest orders, the newsletter consents of guests (newsletter form of the website and checkout) and any AcyMailing newsletter data. With ‘Include Joomla Core Data’ the user account, profile and action log are added."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI2="<strong>Removal:</strong> a removal request deletes the carts of the user account, AcyMailing newsletter data and, depending on the settings, the saved addresses. Depending on the settings, orders outside the retention period are anonymised. Orders within it are kept and reported. Details are in the section ‘What is deleted, anonymised and kept’."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI3="<strong>Guest orders:</strong> orders without a user account are matched to a request by the e-mail address of the request or of the account."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI4="<strong>Checkout:</strong> the shipping and payment step shows a checkbox for consent to the privacy policy."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI5="<strong>Profile page:</strong> the shop's profile page (MyProfile) gets the ‘Privacy’ tab with the consent status and buttons for requests. Saved addresses get a delete button."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI6="<strong>Confirmation page:</strong> customers without a user account confirm a request created by an administrator on a page of this plugin."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI7="<strong>Cleanup:</strong> a scheduled task regularly anonymises expired orders, also without a request."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_LI8="<strong>Notifications:</strong> if you wish, the plugin e-mails the administration and writes entries to Joomla's action log."
PLG_PRIVACY_J2COMMERCE_HELP_WHAT_NOTE1="The plugin is no substitute for legal advice. You decide the retention period, the privacy policy and how requests are handled."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_TITLE="Requirements"
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI1="Joomla 5.4 or 6 and PHP 8.1 or later."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI2="J2Commerce 6 or J2Store 4 (J2Commerce 4). The checkout checkbox on J2Commerce 6 needs version 6.3.4 or later."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI3="Joomla's Privacy component (com_privacy) is enabled."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI4="A site template based on Bootstrap 5, so that the ‘Privacy’ tab is displayed correctly."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI5="Working mail delivery in the Global Configuration. Joomla sends the confirmation codes through it, the plugin its notices."
PLG_PRIVACY_J2COMMERCE_HELP_REQUIREMENTS_LI6="The bundled plugins ‘System - J2Commerce Privacy Consent’ and ‘Task - J2Commerce Privacy Cleanup’. The installer installs them with this plugin and enables them on the first installation. An update keeps their state."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_TITLE="Setup step by step"
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP1="Enable this plugin under ‘System → Manage → Plugins’. Check there that the two bundled plugins are enabled as well."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP2="On the ‘Data Retention’ tab, set the retention period and the fiscal year end and enter a ‘Support Email’."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP3="Under ‘Menus’, create a menu item of the type ‘Privacy → Create Request’ with the access level ‘Registered’. On the ‘Link Type’ tab, set ‘Display in Menu’ to ‘No’. Without this menu item the buttons on the ‘Privacy’ tab do not lead to the request form."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP4="On the ‘Checkout Consent’ tab, select the article with your privacy policy under ‘Privacy Policy Article’."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP5="Check the template overrides in your site template (section ‘Template overrides’)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP6="Under ‘System → Manage → Scheduled Tasks → New’, create a task of the type ‘J2Commerce - Automatic data cleanup’. Enter the same values there as in this plugin, because the task does not take them over. Choose a daily run, then enable and save the task."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP7="If you sell products with a lifetime licence, flag these products (section ‘Lifetime licences’)."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_STEP8="Test the process on a test installation with test data, with one export request and one removal request under ‘Users → Privacy → Requests’."
PLG_PRIVACY_J2COMMERCE_HELP_SETUP_NOTE1="Without a trigger of its own, Joomla starts scheduled tasks only when pages are visited. For reliable runs, set up a cron job with <code>php cli/joomla.php scheduler:run</code> or Joomla's web cron."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_TITLE="Template overrides"
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_P1="The ‘Privacy’ tab, the address delete buttons and, on J2Store 4, the checkout checkbox are displayed by template overrides. The plugin ships them in the folder <code>plugins/privacy/j2commerce/overrides</code>."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI1="On the first installation the installer copies them into every site template, for <code>com_j2store</code> and <code>com_j2commerce</code>. It never overwrites existing files. The message after the installation lists the copied and the skipped files."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI2="An update only adds <code>myprofile/default_privacy.php</code> where the template already has <code>myprofile/default.php</code> of an installed shop component. All other overrides stay unchanged. Compare them with the shipped version after an update."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI3="J2Commerce 6 needs no override for the checkout. The checkbox appears in its checkout templates from version 6.3.4 through the event <code>AfterDisplayShippingPayment</code>. A checkout override of your own must still fire this event."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI4="From J2Commerce 6.3.4 the installer renames unchanged J2Commerce 6 checkout overrides of earlier plugin versions with the suffix <code>.plg_privacy_j2commerce-disabled</code>. Changed copies stay and the installer warns about them."
PLG_PRIVACY_J2COMMERCE_HELP_OVERRIDES_LI5="Place a layout of your own for the tab as <code>html/layouts/plg_privacy_j2commerce/privacy_tab.php</code> in your template. It takes precedence over the plugin's layout."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_TITLE="‘Privacy Settings’ tab"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI1="‘Include Joomla Core Data’ (default: Yes): the export also contains the person's user account, profile fields and action log. This applies only to requests with a user account. With ‘No’ this plugin supplies shop data only."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI2="‘Anonymize Orders’ (default: Yes): a removal request anonymises the orders outside the retention period. With ‘No’ they stay unchanged. Orders are never deleted."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_PRIVACY_LI3="‘Delete Addresses’ (default: Yes): a removal request deletes the saved addresses of the user account and the guest addresses with the e-mail address of the request or of the account. With ‘No’ they are kept."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_TITLE="‘Data Retention’ tab"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI1="‘Retention Period (Years)’ (default: 10, allowed 1 to 30): the number of years after the end of the order's fiscal year during which an order is kept complete. The number also appears on the ‘Privacy’ tab and in the notices."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI2="‘Fiscal Year End (MM-DD)’ (default: 12-31): the last day of your fiscal year. 02-29 means the last day of February. Days that do not exist, such as 04-31, are rejected when saving. Change the value only if your fiscal year does not end on 31 December."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI3="‘Legal Basis’: for internal documentation only. Customers do not see the text and the plugin uses it in no message."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_RETENTION_LI4="‘Support Email’ (default: empty): contact address for privacy questions. It appears in the e-mail about kept orders and is the target of the e-mail links for guest customers on the ‘Privacy’ tab. If empty, the sender address of the Global Configuration is used. Enter an address of your own before going live."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_TITLE="‘Checkout Consent’ tab"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI1="‘Show Consent Checkbox’ (default: Yes): shows the checkbox in the shipping and payment step. With ‘No’ no checkbox appears and nothing is checked or stored."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI2="‘Consent Required’ (default: Yes): the checkout continues only when the checkbox is ticked. On J2Commerce 6 the system plugin checks this on the server, also on confirmation and on payment submission. On J2Store 4 only a script in the browser checks it. With ‘No’ the checkbox is optional."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI3="‘Privacy Policy Article’ (default: none): the article the link in the consent text points to. Without an article, J2Commerce 6 shows the link text without a link and on J2Store 4 the placeholder <code>{privacy_policy}</code> stays visible. Therefore always select an article."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI4="‘Consent Text’ (default: empty): the text next to the checkbox. <code>{privacy_policy}</code> is replaced by the link to the article. If empty, the default text of the current language is used. A text of your own applies to all languages of the website."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI5="On J2Commerce 6 the system plugin stores the consent in Joomla's privacy consents once J2Commerce has accepted the order, once per order. It stores the order number, the time, the IP address and the user agent, no e-mail address. On J2Store 4 and for earlier orders there is no such record."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_CHECKOUT_LI6="Describe these data, their purpose and their storage period in your privacy policy."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_TITLE="‘Frontend Self-Service’ tab"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI1="‘Show Delete Address Buttons’ (default: Yes): shows a delete button next to every saved address in the address area of the profile page. Logged-in customers delete their own addresses with it immediately. Orders stay unchanged."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI2="‘Show Delete All Data’ (default: Yes): shows a button for a removal request on the ‘Privacy’ tab."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI3="‘Show Export Data’ (default: Yes): shows a button for an export request on the ‘Privacy’ tab."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI4="‘Show Privacy Section’ (default: Yes): shows the ‘Privacy’ tab on the profile page. With ‘No’ the tab is not shown."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI5="‘Guest Request Confirmation’ (default: Yes): the links in Joomla's e-mail for requests created by an administrator lead to the confirmation page of this plugin. There, people without a user account can also confirm with their e-mail address and the code. With ‘No’ the e-mail keeps Joomla's links, which only logged-in people can open. Guest orders are matched to a request by its e-mail address in any case."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI6="On the ‘Privacy’ tab both buttons open Joomla's request form for logged-in people, where the person chooses the type of request. Guest customers with an order session get an e-mail link to the ‘Support Email’ instead. With both buttons switched off, the tab only shows the consent status."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_FRONTEND_LI7="All settings on this tab only take effect while this plugin is enabled."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_TITLE="‘Notifications & Logging’ tab"
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI1="‘Admin Notifications’ (default: No): sends an e-mail to the administration when a customer deletes a saved address or a removal request is carried out. There is no notification for exports."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI2="‘Admin Email’ (default: empty, visible only with ‘Admin Notifications’ set to ‘Yes’): recipient of the notifications. If empty, the sender address of the Global Configuration is used. The e-mail is written in the language of the user account with this address, otherwise in the website's default language."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI3="‘Activity Logging’ (default: No): writes entries to Joomla's action log, namely for the start of a removal request with the number of kept orders, for deleted addresses, anonymised orders, deleted or kept newsletter data and for addresses that customers deleted themselves. Every entry contains the IP address of the person acting."
PLG_PRIVACY_J2COMMERCE_HELP_SETTINGS_NOTIFICATIONS_LI4="The plugin never changes or deletes existing action log entries."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_TITLE="How the retention period is calculated"
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_P1="The period of every order starts at the end of the fiscal year in which it was placed, not on the order date."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI1="An order is kept until the end of its fiscal year plus the set number of years, until 23:59:59 on that day. From the following day it is outside the retention period."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI2="Example with 10 years and fiscal year end 12-31: an order of 15 March 2016 is kept until 31 December 2026 and can be anonymised from 1 January 2027."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI3="The website time zone in the Global Configuration decides. J2Commerce stores order times in UTC. With the time zone Europe/Zurich, an order of 1 January 2017 at 00:30 therefore belongs to fiscal year 2017, although in UTC it still falls on 31 December 2016."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI4="A removal request checks every order on its own. The scheduled task handles registered customers only once their newest order is outside the period as well, and then anonymises all their orders. It handles guest orders one by one."
PLG_PRIVACY_J2COMMERCE_HELP_RETENTION_LI5="The plugin and the scheduled task each have their own settings. Enter the same period and the same fiscal year end in both."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_TITLE="What is deleted, anonymised and kept"
PLG_PRIVACY_J2COMMERCE_HELP_DATA_P1="A removal request takes effect when you carry it out in Joomla. It covers the user account of the request and the guest orders and guest addresses with the e-mail address of the request or of the account, in all existing shop tables, including J2Store tables left after a migration."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI1="<strong>Deleted:</strong> saved addresses (with ‘Delete Addresses’ set to ‘Yes’), the carts of the user account and the AcyMailing newsletter subscriber with lists, fields, statistics, clicks, history and queue. Guest carts stay, because they contain no e-mail address."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI2="<strong>Anonymised</strong> (orders outside the period, with ‘Anonymize Orders’ set to ‘Yes’): the e-mail address becomes <code>anonymized@deleted.invalid</code>, the billing name ‘Anonymized User’. The order note, the IP address and the billing and shipping names, addresses, phone and fax numbers, company and tax number are cleared."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI3="<strong>Kept:</strong> order number, date, amounts, items and products, because accounting needs them. The order stays linked to the user account."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI4="Orders within the period are kept complete. The message after the removal and an e-mail to the request address list them with the end of their period. The scheduled task anonymises them later."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI5="Checkout consents and newsletter consents given at checkout lose their IP address and user agent when the order is anonymised. The record stays as evidence with order number and time. A newsletter consent given at checkout becomes invalid at once, because the newsletter subscriber is deleted. Its IP address and user agent stay until the order is anonymised, as evidence for newsletters already sent. When an order is anonymised or deleted and no longer carries an address or a user account, its newsletter consents given at checkout also become invalid: nobody can be named for them any more. Orders that keep their address (lifetime licence) or belong to a user account keep their consents valid."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI6="The user account itself is pseudonymised by Joomla's privacy plugin for user accounts in the same request, not by this plugin."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI7="The plugin does not refuse a removal request because of retention obligations. It refuses it only if Joomla found a user account with a different address, e.g. muller@ for müller@. It also refuses it if the user account cannot be marked for a later repetition of the removal (database error); then nothing is removed."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI8="The plugin never deletes Joomla's action log or consent records."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI9="<strong>Other consent records:</strong> Joomla's registration consents of the user account and the consents of the newsletter form of the website are anonymised at once. E-mail address, IP address and user agent are replaced by a neutral note and the record becomes invalid. A record without user account counts only if its e-mail address field names the address of the request or of the account as a whole address. Records of another user account are never changed."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_LI10="<strong>AcyMailing placeholder contact:</strong> if AcyMailing synchronises the Joomla users, Joomla's pseudonymisation of the user account creates a contact with the address <code>UserID…removed@email.invalid</code>. The plugin deletes it right after the request and the cleanup task deletes any that are left, but only a contact that belongs to the pseudonymised account, carries exactly its placeholder address and has no list entry."
PLG_PRIVACY_J2COMMERCE_HELP_DATA_NOTE1="Anonymised data cannot be restored. Test settings and processes on a test installation with test data first."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_TITLE="Lifetime licences"
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_P1="For orders containing a product with a lifetime licence, the removal request and the scheduled task keep the order e-mail address after the period, so that the licence can be reactivated. Everything else is anonymised. Other orders of the same person are handled normally."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI1="J2Commerce 6: table <code>#__j2commerce_metafields</code>, a row with owner_id equal to the product ID, owner_resource <code>product</code>, metakey <code>is_lifetime_license</code> and metavalue <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI2="J2Store 4: table <code>#__j2store_product_customfields</code>, which you create yourself, a row with product_id equal to the product ID, field_name <code>is_lifetime_license</code> and field_value <code>yes</code>."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI3="The message after the installation shows the SQL statements. There is no input form. The case of <code>yes</code> does not matter, other values such as 1 do not count."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI4="If a database error prevents reading the flag, the plugin keeps the e-mail address of all affected orders and logs a warning."
PLG_PRIVACY_J2COMMERCE_HELP_LIFETIME_LI5="Without a flag, these orders are also fully anonymised after the period."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_TITLE="Requests from guest customers"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_P1="Joomla's request form is open to logged-in people only. For customers without a user account the process is as follows:"
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP1="The person contacts you by e-mail, e.g. through the link on the ‘Privacy’ tab."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP2="You create the request under ‘Users → Privacy → Requests’ with exactly the e-mail address of the orders. Joomla sends a code that is valid for 24 hours."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP3="The person opens the link in the e-mail and confirms on the page of this plugin with the e-mail address and the code. The request is then confirmed and Joomla notifies the super users."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_STEP4="You carry out the request and complete it."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI1="Failed attempts are limited within 15 minutes: 5 per session, 5 per e-mail address and 20 per IP address. While a limit is reached, the page also refuses the correct code. The answer does not reveal whether a request exists."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI2="A correct but expired code invalidates the request. In that case, create a new request."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI3="Joomla accepts only one open request per e-mail address and request type."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI4="The process needs the enabled plugin ‘System - J2Commerce Privacy Consent’ and ‘Guest Request Confirmation’ set to ‘Yes’."
PLG_PRIVACY_J2COMMERCE_HELP_GUESTS_LI5="With the separate, optional plugin ‘System - Privacy Requests’, people without an account can also submit removal requests themselves."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_TITLE="Disabling and uninstalling"
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI1="While this plugin is disabled, Joomla processes no shop data in requests. The ‘Privacy’ tab, the address delete buttons and the checkout checkbox disappear, and the confirmation page cannot be reached. The scheduled task keeps running."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI2="Uninstalling also removes the two bundled plugins, all scheduled tasks of the type ‘J2Commerce - Automatic data cleanup’ and the table <code>#__privacy_j2commerce_attempts</code> with the counters of the confirmation page."
PLG_PRIVACY_J2COMMERCE_HELP_DISABLE_LI3="The copied template overrides, all shop data (already anonymised data stays anonymised), the lifetime licence flags, the consent records and the action log are kept."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_TITLE="Typical problems and solutions"
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI1="<strong>The ‘Privacy’ tab is missing:</strong> check that this plugin is enabled, that ‘Show Privacy Section’ is set to ‘Yes’ and that the template has the overrides <code>myprofile/default.php</code> and <code>myprofile/default_privacy.php</code>."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI2="<strong>The buttons on the tab lead to the home page:</strong> the menu item of the type ‘Privacy → Create Request’ is missing."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI3="<strong>The checkbox is missing (J2Commerce 6):</strong> check that ‘System - J2Commerce Privacy Consent’ is enabled, that J2Commerce 6.3.4 or later is installed and that a checkout override of your own fires the event <code>AfterDisplayShippingPayment</code>."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI4="<strong>The checkout does not continue although the checkbox is ticked (J2Commerce 6):</strong> the consent applies to the current cart. If the cart changes, e.g. through a login in another tab, or the step is shown again, the person has to tick the checkbox again."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI5="<strong>The continue button stays locked (J2Store 4):</strong> the checkbox is not ticked, or the browser does not load <code>consent-validator.js</code>. Replace a checkout override of an earlier plugin version with the shipped version."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI6="<strong>No e-mail about kept orders:</strong> an e-mail is only sent when orders are kept or orders with a lifetime licence keep their e-mail address. If the address was invalid or sending failed, the message after the removal shows a warning with the list. Then inform the person yourself."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI7="<strong>Warning about newsletter data or consent records:</strong> the subscriber was not removed, the lookup failed, or consent records could not be processed. While the subscriber is kept, the newsletter consents of the request stay unchanged as well. Fix the cause according to the log (category <code>plg_privacy_j2commerce</code>) and carry out the removal again. This also works after Joomla pseudonymised the user account: until the removal is complete, the account keeps a marker with hashes of the addresses (never the addresses), through which the repeated removal finds it."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI8="<strong>Refused removal request or export warning because of a different address:</strong> Joomla found an account with a similar but different address. Check the address of the request and do not send such an export."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI9="<strong>The task type is missing in the scheduled tasks:</strong> enable ‘Task - J2Commerce Privacy Cleanup’."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI10="<strong>The confirmation page never confirms:</strong> check the address and the code and wait 15 minutes if a limit is reached. If the table <code>#__privacy_j2commerce_attempts</code> is missing, the page confirms nothing for security reasons. In that case install the package again."
PLG_PRIVACY_J2COMMERCE_HELP_PROBLEMS_LI11="<strong>A lifetime licence is not detected:</strong> check the name <code>is_lifetime_license</code>, the value <code>yes</code> and the product ID."
