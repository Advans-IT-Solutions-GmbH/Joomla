PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_DESC="Das Plugin hat J2Commerce-Template-Overrides in Ihr aktives Frontend-Template kopiert. Diese Overrides fügen die Registerkarte Datenschutz in MyProfile hinzu und für J2Store/J2Commerce 4 das Kontrollfeld für die Datenschutz-Einwilligung im Checkout. Unter J2Commerce 6 zeigt das mitgelieferte System-Plugin das Kontrollfeld in den Checkout-Kerntemplates an, prüft es serverseitig und protokolliert die Einwilligung pro Bestellung."
