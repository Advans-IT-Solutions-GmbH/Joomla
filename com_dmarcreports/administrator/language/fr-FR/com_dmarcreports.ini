COM_DMARCREPORTS_CONFIGURATION="DMARC: Configuration"
COM_DMARCREPORTS_CONFIG_MTASTS_FIELDSET="MTA-STS"
COM_DMARCREPORTS_CONFIG_MTASTS_ENABLE_LABEL="Activer l'hébergement de la politique MTA-STS"
COM_DMARCREPORTS_CONFIG_MTASTS_ENABLE_DESC="Publie la politique MTA-STS à l'adresse https://mta-sts.<domain>/.well-known/mta-sts.txt. Nécessite le plugin système DMARC MTA-STS Policy et les étapes DNS/hôte indiquées dans le Centre d'actions."
COM_DMARCREPORTS_CONFIG_MTASTS_MODE_LABEL="Mode de la politique"
COM_DMARCREPORTS_CONFIG_MTASTS_MODE_DESC="Commencez par testing pour collecter des rapports TLS-RPT sans affecter la distribution, puis passez à enforce une fois les rapports propres."
COM_DMARCREPORTS_CONFIG_MTASTS_MODE_NONE="Aucun"
COM_DMARCREPORTS_CONFIG_MTASTS_MODE_TESTING="Testing"
COM_DMARCREPORTS_CONFIG_MTASTS_MODE_ENFORCE="Enforce"
COM_DMARCREPORTS_CONFIG_MTASTS_MX_LABEL="Hôtes MX"
COM_DMARCREPORTS_CONFIG_MTASTS_MX_DESC="Un motif d'hôte MX par ligne, par exemple mail.example.com ou *.example.com (exactement une étiquette générique). Cette politique commune doit couvrir les MX de réception réels de chaque domaine surveillé utilisant MTA-STS. Activez les diagnostics et vérifiez la couverture avant enforce."
COM_DMARCREPORTS_CONFIG_MTASTS_MAX_AGE_LABEL="Durée de vie (secondes)"
COM_DMARCREPORTS_CONFIG_MTASTS_MAX_AGE_DESC="Durée pendant laquelle les expéditeurs peuvent mettre la politique en cache. 604800 (une semaine) est courant ; ne l'augmentez qu'une fois la politique stable."
COM_DMARCREPORTS_CONFIG_TLSRPT_ENABLE_LABEL="Activer les rapports TLS-RPT"
COM_DMARCREPORTS_CONFIG_TLSRPT_ENABLE_DESC="Génère et surveille l'enregistrement TXT _smtp._tls afin que les expéditeurs signalent les problèmes de livraison TLS, indépendamment de l'hébergement de la politique MTA-STS."
COM_DMARCREPORTS_CONFIG_TLSRPT_RUA_LABEL="Adresse de rapport TLS-RPT"
COM_DMARCREPORTS_CONFIG_TLSRPT_RUA_DESC="Où les rapports TLS-RPT sont envoyés, par exemple tlsrpt@example.com ou mailto:tlsrpt@example.com. Utilisée pour générer l'enregistrement TXT _smtp._tls."

; Installer messages
COM_DMARCREPORTS_INSTALL_LEGACY_MANIFEST="L'ancien fichier manifeste %s n'a pas pu être supprimé. Veuillez le supprimer du dossier du composant afin que la vérification de la base de données de Joomla reconnaisse correctement le composant."
COM_DMARCREPORTS_POSTINSTALL_TITLE="Merci d'avoir installé DMARC Reports"
COM_DMARCREPORTS_POSTINSTALL_DESC="Ajoutez les domaines à surveiller, configurez une boîte aux lettres qui reçoit les rapports agrégés DMARC, puis ouvrez le tableau de bord pour voir ce qui requiert votre attention."
COM_DMARCREPORTS_POSTINSTALL_DOCS="Commencez sur l'écran Domaines, ajoutez une source de rapports et lancez votre premier import."
COM_DMARCREPORTS_POSTINSTALL_UPDATED="DMARC Reports a été mis à jour vers la version %s."

; Page d'aide
COM_DMARCREPORTS_HELP_TITLE="Aide et conseils"
COM_DMARCREPORTS_HELP_INTRO="DMARC Reports lit les rapports que les autres serveurs de messagerie envoient au sujet de vos domaines et vous montre si vos e-mails sont correctement authentifiés et ce qu'il faut faire ensuite. Tout fonctionne sur votre propre serveur."
COM_DMARCREPORTS_HELP_CONTENTS="Sommaire"
COM_DMARCREPORTS_HELP_OPEN_OPTIONS="Ouvrir les options"
COM_DMARCREPORTS_HELP_BASICS_TITLE="Les notions en deux phrases"
COM_DMARCREPORTS_HELP_BASICS_DMARC="DMARC est un enregistrement DNS qui indique aux serveurs destinataires que faire des e-mails qui prétendent venir de votre domaine sans réussir SPF ni DKIM pour lui : seulement observer (p=none), les mettre en spam (p=quarantine) ou les rejeter (p=reject). Il demande aussi aux destinataires de vous envoyer chaque jour un rapport agrégé (rua), et ce sont ces rapports que l'extension analyse."
COM_DMARCREPORTS_HELP_BASICS_SPF="SPF est un enregistrement DNS qui liste les serveurs autorisés à envoyer des e-mails pour votre domaine. Pour DMARC, SPF ne compte que si le domaine d'enveloppe vérifié correspond à l'adresse d'expéditeur visible, ce qu'on appelle l'alignement."
COM_DMARCREPORTS_HELP_BASICS_DKIM="DKIM ajoute une signature numérique à chaque e-mail sortant, que les destinataires vérifient avec une clé publique publiée dans votre DNS. Comme la signature survit au transfert, une signature DKIM alignée est le moyen le plus fiable de réussir DMARC."
COM_DMARCREPORTS_HELP_BASICS_MTASTS="MTA-STS indique aux autres serveurs de messagerie de livrer les e-mails à votre domaine uniquement via une connexion chiffrée (TLS) et uniquement à vos vrais serveurs de messagerie avec un certificat valide. Il se compose d'un enregistrement TXT _mta-sts et d'un petit fichier de politique à l'adresse https://mta-sts.example.org/.well-known/mta-sts.txt (avec votre domaine à la place de example.org)."
COM_DMARCREPORTS_HELP_BASICS_TLSRPT="TLS-RPT est un enregistrement TXT _smtp._tls qui demande aux autres serveurs de messagerie de vous signaler chaque jour si la livraison chiffrée vers votre domaine a fonctionné. Vous voyez ainsi les problèmes de certificat ou de chiffrement avant de durcir MTA-STS."
COM_DMARCREPORTS_HELP_HOW_TITLE="Fonctionnement de l'extension"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TITLE="Domaines et sources de rapports"
COM_DMARCREPORTS_HELP_HOW_SOURCES_TEXT="Sous Domaines, vous ajoutez chaque domaine surveillé avec sa politique cible. Sous Sources de rapports, vous saisissez la boîte IMAP vers laquelle pointe l'adresse rua de votre enregistrement DMARC. Le mot de passe est stocké chiffré. Rattachez la source à un domaine publié pour que la tâche planifiée l'interroge."
COM_DMARCREPORTS_HELP_HOW_IMPORT_TITLE="Importer les rapports"
COM_DMARCREPORTS_HELP_HOW_IMPORT_TEXT="Les rapports arrivent de trois façons : avec « Lancer l'import » dans la liste des sources de rapports, en téléversant un fichier de rapport en bas de la même page, ou automatiquement par la tâche planifiée « DMARC Reports - Import automatique » (Système, Tâches planifiées). Joomla n'exécute la tâche que si quelque chose la déclenche : le Lazy Scheduler lors des visites normales ou une tâche cron. Les rapports en double sont reconnus et enregistrés une seule fois. Les rapports DMARC (XML) et TLS-RPT (JSON) peuvent arriver dans la même boîte."
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TITLE="Les chiffres du tableau de bord"
COM_DMARCREPORTS_HELP_HOW_DASHBOARD_TEXT="« Messages signalés » est le total des e-mails avec votre domaine comme expéditeur signalés par les destinataires. Le « Taux de réussite DMARC » est la part d'entre eux qui a réussi DKIM ou SPF avec alignement. « Seraient rejetés sous p=reject » compte les messages qui n'ont réussi ni l'un ni l'autre et seraient rejetés sous p=reject. Ces chiffres couvrent tous les rapports enregistrés. Le centre d'actions évalue en revanche les sept jours précédant le rapport le plus récent, afin qu'une ancienne erreur corrigée depuis longtemps ne bloque pas l'étape suivante."
COM_DMARCREPORTS_HELP_HOW_DETAIL_TITLE="Détail du domaine"
COM_DMARCREPORTS_HELP_HOW_DETAIL_TEXT="Un clic sur un domaine dans le tableau de bord ouvre son détail avec les sources d'envoi (adresse IP avec nom du serveur, chiffres DKIM et SPF, messages en échec, évaluation et dernier rapport), la chronologie, les résultats TLS-RPT, les enregistrements MTA-STS et un export CSV. Lorsque les diagnostics DNS sont activés, seuls cette vue et la vérification système interrogent le DNS en direct : les enregistrements publiés et les noms des serveurs des sources."
COM_DMARCREPORTS_HELP_HOW_JUDGE_TITLE="Comment les sources d'envoi sont évaluées"
COM_DMARCREPORTS_HELP_HOW_JUDGE_TEXT="Le composant évalue lui-même chaque adresse IP d'envoi à partir des résultats DKIM et SPF des rapports, vous n'avez rien de technique à vérifier. Une source dont les e-mails portent une signature DKIM alignée est confirmée automatiquement et ne crée aucune entrée : seule la clé privée de votre domaine peut créer cette signature. Une source dont les e-mails n'ont réussi DMARC que par SPF reçoit une entrée urgente. SPF indique seulement que le serveur figure dans votre enregistrement SPF. De nombreux hébergeurs vous font inclure leurs serveurs de messagerie partagés (par exemple avec include:), et ces serveurs envoient pour tous les clients de l'hébergeur. Un autre client pourrait ainsi réussir SPF avec votre domaine. Seul DKIM distingue vos e-mails des siens. Une source dont les e-mails ont échoué à DMARC et ont été rejetés ou mis en quarantaine par les destinataires ne demande rien de votre part, car votre politique fonctionne. Elle n'apparaît que dans les statistiques. Si des e-mails en échec ont tout de même été distribués, par exemple avec p=none, une entrée informative explique quoi faire. Avec les diagnostics DNS activés, la vue du domaine affiche aussi le nom du serveur de chaque adresse (DNS inverse, confirmé dans les deux sens), à titre d'information. Les noms sont mis en cache et les nouvelles recherches utilisent une vérification approximative du temps écoulé, sans délai garanti pour le résolveur. Sans DNS, l'évaluation fonctionne de la même manière."
COM_DMARCREPORTS_HELP_HOW_MODULE_TITLE="Module du panneau de contrôle"
COM_DMARCREPORTS_HELP_HOW_MODULE_TEXT="Le module « DMARC Reports Dashboard » affiche le résumé et les principales entrées du centre d'actions sur la page d'accueil de l'administration. Il ne calcule rien lui-même et affiche les mêmes données que le tableau de bord du composant. Ses options définissent si le résumé est affiché et combien d'entrées apparaissent."
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TITLE="Plugin système MTA-STS"
COM_DMARCREPORTS_HELP_HOW_PLUGIN_TEXT="Le plugin « System - DMARC MTA-STS Policy » sert le fichier de politique MTA-STS à l'adresse /.well-known/mta-sts.txt, généré à partir des options du composant. Si vous changez le mode ou les hôtes MX dans les options, le fichier servi change avec eux. Vous configurez vous-même l'hôte mta-sts avec un certificat valide et les enregistrements DNS. Le composant n'écrit jamais dans le DNS."
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TITLE="Confidentialité"
COM_DMARCREPORTS_HELP_HOW_PRIVACY_TEXT="Tous les rapports restent dans votre base de données Joomla, il n'y a aucun service externe. Ce n'est que si vous activez les diagnostics DNS que le serveur interroge les enregistrements DNS de vos domaines et récupère la politique MTA-STS en HTTPS. Le contenu des rapports ne quitte jamais le serveur."
COM_DMARCREPORTS_HELP_ACTIONS_TITLE="Le centre d'actions"
COM_DMARCREPORTS_HELP_ACTIONS_INTRO="Le centre d'actions calcule à chaque affichage, à partir des rapports enregistrés et des options, ce que vous devriez faire ensuite, le plus important en premier. Seule la façon dont vous avez traité une entrée est enregistrée. Lorsque les données changent, une entrée disparaît d'elle-même ou une nouvelle apparaît. La couleur indique l'urgence :"
COM_DMARCREPORTS_HELP_SEVERITY_3="Quelque chose laisse votre domaine sans protection, ou une étape est due maintenant."
COM_DMARCREPORTS_HELP_SEVERITY_2="Prévoyez la correction dans les prochains jours."
COM_DMARCREPORTS_HELP_SEVERITY_1="Vérifiez l'indication quand cela vous convient."
COM_DMARCREPORTS_HELP_SEVERITY_0="Pour information seulement, rien à faire."
COM_DMARCREPORTS_HELP_ACTIONS_STATUS="« Marquer comme fait » et « Ignorer » masquent une entrée jusqu'à ce que vous la rouvriez. Utilisez « Marquer comme fait » lorsque vous avez corrigé la cause et « Ignorer » lorsque l'indication ne vous concerne pas. « Reporter » la masque pendant sept jours. Toutes les entrées masquées figurent sous « Actions traitées », où « Rouvrir » les fait revenir. Une entrée dont la cause a disparu disparaît aussi sans marquage."
COM_DMARCREPORTS_HELP_ACTIONS_VIEWS="Le tableau de bord et le module du panneau de contrôle n'interrogent jamais le DNS, afin de rester rapides. Le contrôle des enregistrements DNS publiés (DMARC, SPF, MTA-STS, TLS-RPT, MX) n'apparaît que dans le détail du domaine et la vérification système, et seulement si les diagnostics DNS sont activés. S'ils sont désactivés, le tableau de bord affiche à la place les enregistrements MTA-STS et TLS-RPT à publier, car il ne peut pas savoir s'ils existent déjà. Le centre d'actions lit la politique (p=none, quarantine, reject) dans le rapport le plus récent : après une modification DNS, il faut donc un ou deux jours pour que la recommandation suive."
COM_DMARCREPORTS_HELP_GROUP_POLICY="Politique DMARC et déploiement"
COM_DMARCREPORTS_HELP_GROUP_SOURCES="Sources d'envoi"
COM_DMARCREPORTS_HELP_ACTION_SPF_ONLY_SOURCE="Ces sept derniers jours, cette adresse IP a envoyé des e-mails avec votre domaine comme expéditeur qui n'ont réussi DMARC que par SPF, sans la signature DKIM de votre domaine. SPF montre seulement que votre enregistrement SPF autorise le serveur, et les serveurs de messagerie partagés d'un fournisseur sont autorisés pour tous ses clients. Il peut donc s'agir d'un autre client qui utilise votre domaine. S'il s'agit d'un de vos services (le nom du serveur dans la vue du domaine vous aide), activez-y la signature DKIM pour votre domaine, et l'entrée disparaît d'elle-même. Sinon, assurez-vous que vos propres e-mails sont signés avec DKIM, puis retirez de votre enregistrement SPF la partie qui autorise ce serveur, ou demandez au fournisseur d'empêcher les autres clients d'envoyer avec votre domaine."
COM_DMARCREPORTS_HELP_GROUP_DNS="Enregistrements DNS (seulement avec les diagnostics DNS)"
COM_DMARCREPORTS_HELP_GROUP_MTASTS="MTA-STS et TLS-RPT"
COM_DMARCREPORTS_HELP_ACTION_NO_DATA="Aucun rapport DMARC n'est encore enregistré pour ce domaine. Vérifiez que votre enregistrement DMARC contient une adresse rua, que cette boîte est configurée comme source de rapports et que l'import fonctionne. Les premiers rapports arrivent en général un ou deux jours après la publication."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_NONE="Le domaine est à p=none et trop peu de messages réussissent DMARC pour passer sans risque à quarantine (seuil dans les options, 95 par défaut). Corrigez d'abord les expéditeurs en échec, voir « Aligner une source d'envoi »."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_QUARANTINE="Le domaine est à p=none et suffisamment de messages ont réussi DMARC ces sept derniers jours. Dans l'enregistrement DNS _dmarc de votre domaine, remplacez p=none par p=quarantine. Vérifiez d'abord qu'aucun expéditeur légitime, par exemple un service de newsletter, ne figure encore parmi les sources en échec."
COM_DMARCREPORTS_HELP_ACTION_STAY_AT_QUARANTINE="Le domaine est à p=quarantine, mais pas encore assez de messages réussissent DMARC pour p=reject (seuil dans les options, 99 par défaut). Corrigez les échecs restants avant de durcir."
COM_DMARCREPORTS_HELP_ACTION_MOVE_TO_REJECT="Le domaine est à p=quarantine et suffisamment de messages ont réussi DMARC ces sept derniers jours. Dans l'enregistrement DNS, remplacez p=quarantine par p=reject, et sp aussi si votre enregistrement le contient. Si c'est déjà fait, l'entrée disparaît dès que le premier rapport avec la nouvelle politique est importé."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_QUARANTINE="L'enregistrement DMARC a p=quarantine avec pct inférieur à 100 : la politique ne s'applique donc qu'à une partie des e-mails. Portez pct à 100 ou supprimez-le avant de passer à p=reject."
COM_DMARCREPORTS_HELP_ACTION_PARTIAL_ENFORCEMENT="L'enregistrement DMARC a p=reject avec pct inférieur à 100. Seule cette part est rejetée, le reste est au plus mis en spam. Portez pct à 100 ou supprimez-le."
COM_DMARCREPORTS_HELP_ACTION_AT_TARGET="Le domaine a atteint la politique cible définie sur le domaine. Rien à faire. Pour durcir davantage, relevez la politique cible du domaine."
COM_DMARCREPORTS_HELP_ACTION_ENFORCED="Le domaine est à p=reject pour tous les e-mails. Les e-mails falsifiés avec votre domaine sont rejetés. Rien à faire, surveillez les nouvelles sources d'envoi."
COM_DMARCREPORTS_HELP_ACTION_WOULD_BE_REJECTED="Ce nombre de messages des sept derniers jours n'a réussi ni DKIM ni SPF avec alignement et serait rejeté sous p=reject. À partir de 2 pour cent, l'entrée est rouge. Regardez dans le détail du domaine de quelles adresses IP ils proviennent. S'il s'agit de vos propres expéditeurs, alignez-les. S'il s'agit de falsifications, c'est exactement ce que DMARC doit empêcher."
COM_DMARCREPORTS_HELP_ACTION_ALIGN_SOURCE="Ces sept derniers jours, cette adresse IP a envoyé des e-mails avec votre domaine comme expéditeur qui ont échoué à DMARC (ni DKIM ni SPF alignés) et ont tout de même été distribués, parce que la politique est p=none, ne s'applique qu'à une partie des e-mails (pct inférieur à 100) ou qu'un destinataire a fait une exception. S'il s'agit d'un service que vous utilisez, comme une newsletter, une boutique ou un système de tickets, activez-y la signature DKIM pour votre domaine. Préférez DKIM à l'ajout du service dans SPF, car SPF seul n'est pas une preuve (voir « Comment les sources d'envoi sont évaluées »). Si ce n'est pas votre service, les e-mails sont falsifiés ou transférés. Une politique plus stricte arrête les e-mails falsifiés, et l'entrée sur la politique vous indique quand cette étape est sans risque. Une liste de diffusion ou le transfert d'un destinataire qui modifie le message peut aussi faire échouer des e-mails légitimes : vérifiez donc combien d'e-mails sont concernés avant de renforcer. Les e-mails en échec que les destinataires ont rejetés ou mis en quarantaine n'apparaissent pas ici, car la politique fonctionne déjà."
COM_DMARCREPORTS_HELP_ACTION_PASS_RATE_DROP="Le taux de réussite des sept derniers jours est inférieur de plus de 5 points à celui de la semaine précédente. En général, un de vos services a perdu sa signature ou un nouveau service envoie sans authentification. Regardez dans le détail du domaine quelle source échoue nouvellement avant de durcir la politique."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_MISSING="Aucun enregistrement DMARC n'a été trouvé sous _dmarc du domaine. Publiez un enregistrement TXT, pour commencer par exemple v=DMARC1; p=none; rua=mailto:dmarc@example.org (avec votre adresse de rapport). Sans lui, il n'y a ni protection ni rapports."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_SUBDOMAIN_CHECK="Le domaine surveillé est un sous-domaine sans enregistrement DMARC propre. C'est normal : la politique du domaine parent s'applique à lui (sa valeur sp, sinon p). Vérifiez seulement que le domaine parent possède un enregistrement DMARC."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_DUPLICATE="Il existe plus d'un enregistrement DMARC. Les destinataires les ignorent alors tous et votre domaine n'est pas protégé. Supprimez les enregistrements TXT en trop sous _dmarc pour qu'il n'en reste qu'un."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_INVALID="L'enregistrement DMARC est mal formé : p doit valoir none, quarantine ou reject et pct être un nombre entier de 0 à 100. Corrigez l'enregistrement, sinon les destinataires ne l'appliquent pas."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_POLICY_NONE="L'enregistrement DMARC publié est à p=none : il collecte seulement des rapports et ne protège pas encore. Suivez les recommandations de déploiement pour passer à quarantine puis reject."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_NO_RUA="L'enregistrement DMARC n'a pas d'adresse rua : personne ne vous envoie donc de rapports. Ajoutez rua=mailto: avec votre adresse de rapport et configurez cette boîte comme source de rapports."
COM_DMARCREPORTS_HELP_ACTION_DNS_DMARC_PCT="L'enregistrement DMARC n'applique la politique qu'à une partie des e-mails (pct inférieur à 100). Portez pct à 100 dès que les rapports sont propres."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_MISSING="Il n'y a pas d'enregistrement SPF. Ce n'est pas forcément un problème tant que vos e-mails sont signés DKIM. Un enregistrement SPF listant vos serveurs d'envoi reste recommandé, votre fournisseur de messagerie vous indique la bonne valeur."
COM_DMARCREPORTS_HELP_ACTION_DNS_SPF_DUPLICATE="Il existe plus d'un enregistrement SPF. C'est invalide et fait échouer SPF chez les destinataires. Fusionnez-les en un seul enregistrement v=spf1."
COM_DMARCREPORTS_HELP_ACTION_DNS_LOOKUP_ERROR="La requête DNS a échoué, rien n'a donc pu être vérifié. C'est généralement temporaire : rechargez la page plus tard. Si cela persiste, vérifiez le résolveur DNS du serveur avec votre hébergeur."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_NO_MX="MTA-STS est activé, mais aucun hôte MX n'est saisi dans les options, aucune politique ne peut donc être créée. Sous Options, MTA-STS, saisissez vos serveurs de messagerie de réception, un par ligne, tels qu'ils figurent dans l'enregistrement MX de votre domaine."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_PUBLISH="Affiche l'enregistrement TXT _mta-sts et l'adresse du fichier de politique à publier. Avec les diagnostics DNS désactivés, le tableau de bord l'affiche toujours, même si tout est déjà publié, car il ne peut pas vérifier. Avec les diagnostics DNS activés, le détail du domaine et la vérification système le contrôlent en direct et ne le signalent que si l'enregistrement manque vraiment, et le tableau de bord ne l'affiche plus."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_LOOKUP_ERROR="La requête DNS de l'enregistrement _mta-sts a échoué. C'est généralement temporaire, réessayez plus tard."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_RECORD_DRIFT="L'id de l'enregistrement _mta-sts publié ne correspond pas à la politique actuelle. Cela arrive après une modification du mode, des hôtes MX ou de la durée de vie. Remplacez l'enregistrement TXT par la valeur affichée pour que les serveurs d'envoi chargent la nouvelle politique."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_UNREACHABLE="Le fichier de politique à l'adresse https://mta-sts.example.org/.well-known/mta-sts.txt (avec votre domaine) est inaccessible. Vérifiez que l'hôte mta-sts pointe vers votre serveur web dans le DNS et a un certificat valide, que le plugin système est activé et que le serveur web transmet le chemin à Joomla (instructions dans le README du plugin)."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_POLICY_DRIFT="Le fichier de politique servi diffère des options, par exemple parce qu'un ancien fichier statique répond à la place du plugin. Supprimez le fichier statique et activez le plugin système."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_LOOKUP_ERROR="La requête des enregistrements MX de votre domaine a échoué : il n'est donc pas confirmé que la politique couvre tous les serveurs de messagerie. Refaites le contrôle avant de passer à enforce."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_NO_ANSWER="Le domaine n'a aucun enregistrement MX utilisable. S'il ne reçoit pas d'e-mails, il n'a pas besoin de MTA-STS. Sinon, vérifiez les enregistrements MX auprès de votre fournisseur DNS."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MX_UNCOVERED="Au moins un serveur MX de votre domaine ne figure pas dans la politique MTA-STS. En mode enforce, les serveurs d'envoi refuseraient de lui livrer. Ajoutez les hôtes indiqués sous Options, MTA-STS, puis publiez le nouvel id."
COM_DMARCREPORTS_HELP_ACTION_MTASTS_MODE_TESTING="L'enregistrement, le fichier de politique et la couverture MX concordent, mais la politique est encore en mode testing. Dans ce mode, les serveurs d'envoi signalent seulement les problèmes via TLS-RPT et livrent quand même. Collectez une à deux semaines de rapports TLS-RPT. S'ils ne montrent aucun échec et que le certificat de votre serveur de messagerie est valide et renouvelé à temps, passez à enforce sous Options, MTA-STS et publiez le nouvel id."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_PUBLISH="Affiche l'enregistrement TXT _smtp._tls à publier pour recevoir les rapports TLS. Comme pour MTA-STS, le tableau de bord l'affiche toujours lorsque les diagnostics DNS sont désactivés. Avec les diagnostics DNS activés, le détail du domaine ne le signale que si l'enregistrement manque ou pointe vers une autre adresse."
COM_DMARCREPORTS_HELP_ACTION_TLSRPT_MISSING_RUA="TLS-RPT est activé, mais aucune adresse de rapport valide n'est saisie. Sous Options, MTA-STS, saisissez une adresse comme mailto:dmarc@example.org. Le plus simple est d'utiliser la même boîte que pour DMARC."
COM_DMARCREPORTS_HELP_TASKS_TITLE="Tâches courantes"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_TITLE="Configurer une boîte de rapports"
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_1="Créez une boîte réservée aux rapports, par exemple dmarc@example.org, et indiquez-la dans votre enregistrement DMARC sous la forme rua=mailto:dmarc@example.org."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_2="Sous Domaines, ajoutez votre domaine et choisissez la politique cible, en général « Rejeter »."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_3="Sous Sources de rapports, ajoutez une source avec le serveur IMAP, le port 993 en SSL/TLS, le nom d'utilisateur, le mot de passe et le dossier INBOX, puis rattachez-la au domaine. « Lancer l'import » teste la connexion immédiatement."
COM_DMARCREPORTS_HELP_TASK_MAILBOX_STEP_4="Sous Système, Tâches planifiées, créez une tâche du type « DMARC Reports - Import automatique », par exemple toutes les heures, pour que les nouveaux rapports arrivent d'eux-mêmes."
COM_DMARCREPORTS_HELP_TASK_FAILING_TITLE="Comprendre une source en échec"
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_1="Suivez le lien « Afficher cette source » dans le centre d'actions, ou ouvrez le domaine depuis le tableau de bord, pour trouver l'adresse sous « Sources d'envoi »."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_2="Le nom du serveur sous l'adresse indique qui l'exploite (avec les diagnostics DNS activés), et l'évaluation dit si vous devez agir. Vous n'avez besoin d'aucun outil de recherche."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_3="S'il s'agit d'un service que vous utilisez, configurez-y la signature DKIM pour votre domaine. Le service fournit les instructions. N'ajoutez un serveur à votre enregistrement SPF que s'il envoie pour vous seul, jamais les serveurs partagés d'un fournisseur comme seule preuve."
COM_DMARCREPORTS_HELP_TASK_FAILING_STEP_4="S'il s'agit d'un serveur étranger, l'e-mail est soit falsifié, soit transféré. Une politique DMARC plus stricte arrête précisément les falsifications. Le transfert par une liste de diffusion ou par un destinataire peut faire échouer des e-mails légitimes : vérifiez combien d'e-mails sont concernés et si ces destinataires comptent avant de passer à quarantine ou reject."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_TITLE="Passer de p=none à quarantine puis reject"
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_1="Commencez par p=none et collectez des rapports pendant au moins deux semaines pour que tous les expéditeurs apparaissent, y compris les rares comme la facturation ou les newsletters."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_2="Alignez chacun de vos expéditeurs jusqu'à ce que le centre d'actions recommande « Passer à p=quarantine ». Remplacez alors p=none par p=quarantine."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_3="Observez encore une à deux semaines. Lorsque le centre d'actions recommande « Passer à p=reject », remplacez p=quarantine par p=reject. Donnez la même valeur à sp si votre enregistrement en contient un."
COM_DMARCREPORTS_HELP_TASK_ROLLOUT_STEP_4="Après chaque modification, il faut un ou deux jours pour que les premiers rapports avec la nouvelle politique arrivent. D'ici là, le centre d'actions affiche encore la recommandation précédente."
COM_DMARCREPORTS_HELP_TASK_MTASTS_TITLE="Passer MTA-STS de testing à enforce"
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_1="Sous Options, MTA-STS, activez la politique et TLS-RPT, choisissez le mode testing et saisissez vos hôtes MX."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_2="Faites pointer l'hôte mta-sts de votre domaine vers cette installation Joomla avec un certificat valide et publiez les enregistrements TXT _mta-sts et _smtp._tls affichés dans le détail du domaine."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_3="Activez les diagnostics DNS. Le détail du domaine affiche « Passer MTA-STS en enforce » dès que les enregistrements, la politique et la couverture MX concordent. Attendez d'avoir une à deux semaines de rapports TLS-RPT sans échec."
COM_DMARCREPORTS_HELP_TASK_MTASTS_STEP_4="Passez le mode à enforce et remplacez l'enregistrement _mta-sts par la nouvelle valeur avec son nouvel id. Le plugin met à jour le fichier de politique de lui-même."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_TITLE="Quand les rapports n'arrivent plus"
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_1="Sous Sources de rapports, vérifiez la colonne « Dernière exécution » et lancez l'import à la main. Un message d'erreur indique la cause, par exemple une connexion refusée après un changement de mot de passe."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_2="Sous Système, Tâches planifiées, vérifiez que la tâche d'import est activée et s'est exécutée récemment, et que le plugin « Tâche - Import des rapports DMARC » est activé. Sans visites ni tâche cron, le Lazy Scheduler ne s'exécute pas."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_3="Regardez directement dans la boîte. Si de nouveaux rapports s'y trouvent, le problème vient de l'import. S'il n'y a rien, vérifiez dans le DNS que l'adresse rua de l'enregistrement DMARC est toujours correcte."
COM_DMARCREPORTS_HELP_TASK_NOREPORTS_STEP_4="Une source n'enregistre que les rapports de son domaine rattaché et de ses sous-domaines. Les rapports de tout autre domaine sont ignorés, sauf si « Créer automatiquement les domaines inconnus » est activé dans les options. Pour la tâche planifiée, « Autoriser la création automatique de domaines par les tâches planifiées » dans les options et « Créer les domaines automatiquement » dans la tâche doivent aussi être activés. Les domaines créés ne sont pas publiés : publiez-les sous Domaines pour les surveiller. La tâche planifiée n'interroge que les sources rattachées à un domaine publié."
COM_DMARCREPORTS_HELP_SETTINGS_TITLE="Où trouver les réglages"
COM_DMARCREPORTS_HELP_SETTINGS_INTRO="Ouvrez les options du composant avec le bouton Options en haut à droite du tableau de bord. Elles comportent trois onglets, et la politique cible se règle par domaine."
COM_DMARCREPORTS_HELP_SETTINGS_BASIC="Politique cible par défaut des nouveaux domaines, seuils de quarantaine (95 par défaut) et de rejet (99 par défaut), délai et limites de l'import des boîtes, séparateur CSV, diagnostics DNS et création automatique des domaines inconnus."
COM_DMARCREPORTS_HELP_SETTINGS_MTASTS="Politique MTA-STS activée ou non, mode (testing ou enforce), hôtes MX et durée de vie, ainsi que TLS-RPT activé ou non avec son adresse de rapport."
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS_TITLE="Permissions"
COM_DMARCREPORTS_HELP_SETTINGS_PERMISSIONS="Qui peut ouvrir le composant, créer et modifier les domaines et les sources, marquer les entrées du centre d'actions (modifier l'état) et importer les rapports (Importer les rapports DMARC)."
COM_DMARCREPORTS_HELP_SETTINGS_DOMAIN="Réglez la politique cible de chaque domaine sous Domaines. Le centre d'actions ne recommande jamais d'étape au-delà de cette cible."
COM_DMARCREPORTS_CONFIG_HELP_NOTE="Ce que font ces réglages et ce que signifie chaque entrée du centre d'actions est expliqué sur la page <a href='index.php?option=com_dmarcreports&amp;view=help'>Aide et conseils</a>."
