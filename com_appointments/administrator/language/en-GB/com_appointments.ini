COM_APPOINTMENTS_TEAM_C_ADMINISTRATION_HELP="Super Users and component administrators can administer other owners' and orphan calendars, including settings, grants, owner assignment and deletion, subject to Joomla's Create/Edit/Delete permissions. This is not content access: reading or synchronising contents and rotating calendar content keys still require a real effective grant and keys. Key-holding grants need real wraps from a key holder or authorised recovery; without them they remain pending. Booking hosts still need their own effective Write access."
