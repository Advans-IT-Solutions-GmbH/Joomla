COM_APPOINTMENTS_HELP_NOTIFY_TITLE="Benachrichtigungen"
COM_APPOINTMENTS_HELP_NOTIFY_INTRO="Wer welche Mail zu einer Buchung bekommt, hängt davon ab, ob die Terminart einen Zielkalender verwendet. Er ist in Gebrauch, wenn die Internetkalender eingeschaltet sind, der Kalender aktiv ist und der Gastgeber darin wirksam schreiben darf. Nur dann landet die Buchung als Kopie im Kalender."
COM_APPOINTMENTS_HELP_NOTIFY_GUEST="Die buchende Person und alle weiteren Gäste bekommen ihre Mail immer mit der Kalendereinladung (iCalendar-Anhang) und ihren eigenen Links, mit und ohne Zielkalender."
COM_APPOINTMENTS_HELP_NOTIFY_NOCALENDAR="Ohne Zielkalender in Gebrauch bekommt der Gastgeber wie bisher die Mail mit der Kalendereinladung."
COM_APPOINTMENTS_HELP_NOTIFY_MEMBERS="Mit Zielkalender in Gebrauch bekommt jeder Benutzer mit wirksamem Zugriff auf diesen Kalender eine Mail, wenn eine Buchung neu eingeht, freigegeben, verschoben oder abgesagt wird. Wirksam heisst: eine aktive Freigabe, ein aktives Konto in einer Internetkalender-Gruppe und ein bestätigter zweiter Faktor, für interne und externe Benutzer gleich. Der Gastgeber gehört dazu und bekommt als Einziger die Erinnerung. Diese Mails enthalten keine Kalendereinladung, weil der Termin schon über die Synchronisierung in den Kalender kommt. Eine angenommene Einladung würde ihn doppelt zeigen, z.B. in Outlook, wenn der Kalender mit dem Hauptkalender abgeglichen wird."
COM_APPOINTMENTS_HELP_NOTIFY_CONTENT="Die Rollen Lesen, Schreiben und Verwalten bekommen, was auch die Kopie im Kalender zeigt: Terminart, Zeit, Gastgeber, Name und E-Mail-Adresse der buchenden Person, Gäste, Ort und Konferenzlink. Der Gastgeber bekommt zusätzlich die Telefonnummer und den Moderatorenlink. Wer die Buchungsliste im Administrator öffnen darf, bekommt zusätzlich einen Link zur Buchung."
COM_APPOINTMENTS_HELP_NOTIFY_FREEBUSY="Die Rolle Frei/Belegt bekommt keine Personendaten und keinen Titel, nur den Kalender, die Zeit und ob sie belegt, verschoben oder wieder frei wurde. Eine Freigabe ändert keine belegte Zeit und schickt dieser Rolle keine Mail. Auch eine geänderte Vorlage kann diesen Mails keine weiteren Werte hinzufügen."
COM_APPOINTMENTS_HELP_NOTIFY_EXTERNAL="Externe Benutzer bekommen, was ihre Rolle erlaubt, wie interne Benutzer mit derselben Rolle. Den Link in den Administrator bekommen sie nur, wenn sie dort die Buchungsliste öffnen dürfen."
COM_APPOINTMENTS_HELP_NOTIFY_ONCE="Jede Mail kommt pro Person nur einmal an: beim Gastgeber, der auch Kalenderbenutzer ist, bei einem Konto mit mehreren Freigaben und bei einer Adresse, die schon die Mail der buchenden Person oder eines Gastes bekommt."
COM_APPOINTMENTS_HELP_NOTIFY_LANGUAGE="Jede Mail verwendet die Kontosprache und Zeitzone ihres Empfängers, sonst die Vorgaben der Site. Die Vorlagen stehen unter Vorlagen als «Kalenderbenutzer», «Gastgeber mit Zielkalender» und «Frei/Belegt»."
COM_APPOINTMENTS_HELP_NOTIFY_SWITCH="Jeder Kalenderbenutzer kann die Buchungsmails jedes Kalenders in «Meine Kalender» aus- und wieder einschalten, nur für sein eigenes Konto. Vorgabe ist ein. Niemand kann diese Einstellung für eine andere Person ändern, weder der Eigentümer des Kalenders noch ein Administrator. Ein Gastgeber, der die Mails ausschaltet, erfährt von neuen Buchungen nur noch über den Kalender, und «Meine Kalender» weist darauf hin."
COM_APPOINTMENTS_HELP_NOTIFY_MANDATORY="Mails zum Konto und zu seiner Sicherheit lassen sich nicht ausschalten: neues Gerät, Aktivierung, geänderte Freigaben, gesperrter Zugriff, gelöschter Kalender und gesperrtes Konto."
; [notify] end

