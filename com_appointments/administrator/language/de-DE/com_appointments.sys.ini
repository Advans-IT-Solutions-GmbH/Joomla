COM_APPOINTMENTS="Termine"
COM_APPOINTMENTS_XML_DESCRIPTION="Terminbuchung auf dem eigenen Server. Sie veröffentlichen buchbare Zeitfenster, der Interessent wählt selbst einen Termin, und jede Bestätigung enthält den Kalendereintrag als Anhang. Alles läuft auf Ihrem eigenen Server, es wird kein fremder Dienst angefragt."
COM_APPOINTMENTS_INSTALL_ORPHAN_SCHEDULES="Das Update wurde abgebrochen, weil einige Terminarten auf fehlende Zeitpläne verweisen. Weisen Sie jede betroffene Terminart einem vorhandenen Zeitplan zu und versuchen Sie es erneut. Es wurden keine Terminarten geändert oder gelöscht."
