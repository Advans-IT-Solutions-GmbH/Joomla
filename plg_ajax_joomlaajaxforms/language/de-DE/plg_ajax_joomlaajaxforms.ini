COM_USERS_EMAIL_PASSWORD_RESET_BODY="Guten Tag,\n\nfür Ihr Konto bei {SITENAME} wurde eine Passwort-Zurücksetzung angefordert. Um die Echtheit der Anfrage zu prüfen, geben Sie diesen Bestätigungscode ein:\n\n{TOKEN}\n\nÖffnen Sie anschliessend den folgenden Link, um Ihr Passwort zurückzusetzen:\n\n{LINK_TEXT}\n\nVielen Dank."
COM_USERS_EMAIL_USERNAME_REMINDER_SUBJECT="Ihr Benutzername für {SITENAME}"
COM_USERS_EMAIL_USERNAME_REMINDER_BODY="Guten Tag,\n\nfür Ihr Konto bei {SITENAME} wurde eine Erinnerung des Benutzernamens angefordert.\n\nIhr Benutzername: {USERNAME}\n\nMit dem folgenden Link können Sie sich anmelden:\n\n{LINK_TEXT}\n\nVielen Dank."
COM_USERS_EMAIL_ACCOUNT_DETAILS="Kontodaten für {NAME} bei {SITENAME}"
COM_USERS_EMAIL_REGISTERED_WITH_ACTIVATION_BODY_NOPW="Guten Tag {NAME},\n\nvielen Dank für Ihre Registrierung bei {SITENAME}. Ihr Konto muss aktiviert werden, bevor Sie es nutzen können.\nAktivieren Sie Ihr Konto über den folgenden Link oder kopieren Sie ihn in Ihren Browser:\n{ACTIVATE}\n\nNach der Aktivierung können Sie sich bei {SITEURL} mit Ihrem Benutzernamen und dem bei der Registrierung gewählten Passwort anmelden:\n\nBenutzername: {USERNAME}"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY_NOPW="Guten Tag {NAME},\n\nvielen Dank für Ihre Registrierung bei {SITENAME}. Ihr Konto muss geprüft werden, bevor Sie es nutzen können.\n\nBestätigen Sie Ihre E-Mail-Adresse über den folgenden Link oder kopieren Sie ihn in Ihren Browser:\n{ACTIVATE}\n\nNach der Bestätigung wird die Administration benachrichtigt und Ihr Konto freigeschaltet. Sie erhalten eine weitere E-Mail, sobald dies geschehen ist.\n\nDanach können Sie sich bei {SITEURL} mit Ihrem Benutzernamen und dem bei der Registrierung gewählten Passwort anmelden:\n\nBenutzername: {USERNAME}"
