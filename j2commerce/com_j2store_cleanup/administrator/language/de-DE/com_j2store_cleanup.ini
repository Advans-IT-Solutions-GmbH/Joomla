; Extension overview page
COM_J2STORE_CLEANUP_SUBTITLE="Migrationswerkzeug für den Umstieg von J2Store auf J2Commerce 4.x"
COM_J2STORE_CLEANUP_SCAN_TITLE="Kompatibilitätsprüfung für Joomla %s"
COM_J2STORE_CLEANUP_SCAN_DESC="Die PHP-Dateien jeder Erweiterung werden nach Schnittstellen durchsucht, die <strong>in Joomla %d entfernt</strong> sind. J2Commerce 4.x bringt ein eigenes F0F-Framework und eigene Plugin-Basisklassen mit, diese werden daher nicht gemeldet."
COM_J2STORE_CLEANUP_BADGE_COMPATIBLE="Kompatibel"
COM_J2STORE_CLEANUP_BADGE_COMPATIBLE_DESC="Keine entfernten Schnittstellen im Code gefunden"
COM_J2STORE_CLEANUP_BADGE_INCOMPATIBLE="Inkompatibel"
COM_J2STORE_CLEANUP_BADGE_INCOMPATIBLE_DESC="Verwendet Schnittstellen, die in dieser Joomla-Version entfernt sind (mit Details)"
COM_J2STORE_CLEANUP_BADGE_NO_FILES="Keine Dateien"
COM_J2STORE_CLEANUP_BADGE_NO_FILES_DESC="In der Datenbank registriert, die Dateien fehlen jedoch auf dem Server"
COM_J2STORE_CLEANUP_BADGE_CORE="Kern"
COM_J2STORE_CLEANUP_BADGE_CORE_DESC="Kernkomponente von J2Store/J2Commerce"
COM_J2STORE_CLEANUP_NOTE_DEPRECATED="<strong>Hinweis:</strong> Unter Joomla %d funktionieren veraltete Schnittstellen (JFactory, JText und weitere) dank des Rückwärtskompatibilitäts-Plugins noch. Erweiterungen, die sie verwenden, werden hier als kompatibel angezeigt, funktionieren unter Joomla 6 jedoch nicht mehr."
COM_J2STORE_CLEANUP_NONE_FOUND_TITLE="Keine J2Store/J2Commerce-Erweiterungen gefunden."
COM_J2STORE_CLEANUP_NONE_FOUND_DESC="Diese Installation enthält keine Erweiterungen mit Bezug zu J2Store."
COM_J2STORE_CLEANUP_BACKUP_WARNING="<strong>Achtung:</strong> Erstellen Sie vor dem Entfernen von Erweiterungen immer eine vollständige Sicherung (zum Beispiel mit Akeeba Backup). Das Entfernen verwendet den Joomla-Deinstaller, der auch Dateien löscht und Deinstallationsskripte ausführt."
COM_J2STORE_CLEANUP_SECTION_INCOMPATIBLE="Inkompatible Erweiterungen (%d)"
COM_J2STORE_CLEANUP_SECTION_INCOMPATIBLE_DESC="Diese Erweiterungen verwenden veraltete Joomla- oder J2Store-Schnittstellen. Sie funktionieren voraussichtlich nicht mit J2Commerce 4.x und/oder Joomla 5 und neuer."
COM_J2STORE_CLEANUP_SECTION_NO_FILES="Keine Dateien gefunden (%d)"
COM_J2STORE_CLEANUP_SECTION_NO_FILES_DESC="Diese Erweiterungen sind in der Datenbank registriert, ihre Dateien fehlen jedoch auf dem Server. Sie können gefahrlos entfernt werden."
COM_J2STORE_CLEANUP_SECTION_COMPATIBLE="Kompatible Erweiterungen (%d)"
