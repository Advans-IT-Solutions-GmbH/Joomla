COM_APPOINTMENTS_TEAM_C_INVITE_DESC="Créez d'abord le compte dans la gestion des utilisateurs (groupe « Calendriers Internet internes » ou « Calendriers Internet externes »). Le lien permet à la personne de définir son mot de passe, une seule fois et dans les 72 heures. Le deuxième facteur suit lors de la première connexion."
