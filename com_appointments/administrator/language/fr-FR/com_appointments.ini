COM_APPOINTMENTS_TEAM_C_ADMINISTRATION_HELP="Les Super Users et administrateurs du composant peuvent administrer les calendriers d'autres propriétaires ou orphelins : paramètres, accès, propriétaire et suppression, selon les permissions Joomla de création, modification et suppression. Ce n'est pas un accès au contenu : lire ou synchroniser le contenu et renouveler ses clés exigent encore un accès effectif et de vraies clés. Les accès avec clés exigent les enveloppes d'un détenteur ou d'une récupération autorisée ; sans elles, ils restent en attente. Les hôtes gardent l'exigence d'un accès 'Écriture' effectif personnel."
COM_APPOINTMENTS_TEAM_C_KEY_SETUP_HELP="Pour démarrer, activez les calendriers Internet et leur plugin utilisateur, configurez les groupes internes et seconds facteurs approuvés, puis établissez la clé de récupération dans sa section. Connectez-vous avec mot de passe et second facteur approuvé dans cette session d'administration. Choisir votre propre compte d'équipe admissible et enregistrer un nouveau calendrier peut alors créer une première clé manquante. Les GET de listes/formulaires et les seuls droits administratifs ne le font pas, et n'initialisent jamais la clé d'un autre propriétaire."
COM_APPOINTMENTS_TEAM_C_OWNER_ASSIGN="Attribuer un propriétaire"
COM_APPOINTMENTS_TEAM_C_OWNER_ASSIGN_DESC="Attribuer un accès de gestion à un compte actif de l'équipe. Sans véritables clés enveloppées, il reste en attente et ne permet ni lecture du contenu ni gestion comme membre du calendrier. L'accès de l'ancien propriétaire est conservé ; révoquez-le séparément si nécessaire. L'attribution exige une connexion par mot de passe et un second facteur autorisé."
COM_APPOINTMENTS_TEAM_C_GRANTS_READONLY="Seuls les comptes listés ici voient ce calendrier. Seuls ses gestionnaires modifient les accès."
