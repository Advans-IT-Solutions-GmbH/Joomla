COM_APPOINTMENTS_SCHEDULE_WEEKLY_INTRO="Legen Sie eine Zeile je Zeitfenster an. Mehrere Zeilen am gleichen Wochentag sind erlaubt, etwa ein Vormittag und ein Nachmittag. Liegt das Ende nicht nach dem Beginn, läuft das Zeitfenster über Mitternacht und gilt als ein Fenster."
