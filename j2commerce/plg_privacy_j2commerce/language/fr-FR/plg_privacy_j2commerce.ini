PLG_PRIVACY_J2COMMERCE_POSTINSTALL_TITLE="Confidentialité – J2Commerce : Installation terminée"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP_LABEL="Étape %d"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_TITLE="Activer le plugin"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP1_DESC="<strong>Système → Gérer → Plugins</strong> → rechercher <strong>Privacy - J2Commerce Confidentialité</strong> → activer. Le plugin inclus <strong>Tâche - Nettoyage confidentialité J2Commerce</strong> est installé et activé automatiquement afin que Joomla puisse détecter le type de tâche planifiée."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP2_TITLE="Paramètres du plugin"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP2_NAV="<strong>Système → Gérer → Plugins → Privacy - J2Commerce Confidentialité</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_RETENTION_HINT="<strong>10</strong> – Suisse : OR Art. 958f, Allemagne : AO §147. Autriche : 7, UK/Espagne : 6."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_LEGAL_BASIS_HINT="Saisir la base juridique pour la période de conservation."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SUPPORT_EMAIL_HINT="Adresse de contact affichée aux utilisateurs pour les demandes de confidentialité. <strong>Doit être configurée.</strong>"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_CONSENT_HINT="Affiche une case de consentement au checkout. Liez votre politique de confidentialité comme article Joomla. Si le consentement est obligatoire, le checkout ne peut continuer qu'une fois la case cochée. Avec J2Store/J2Commerce 4, la substitution de template le vérifie dans le navigateur, avec J2Commerce 6, le plugin système fourni le vérifie sur le serveur."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP_OPTIONAL_LABEL="Étape %d – Optionnel (Configuration de licences spécifique à Advans IT Solutions GmbH)"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_TITLE="Indicateur de base de données Licence à vie"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_STEP3_DESC="Uniquement pertinent pour les boutiques vendant des licences perpétuelles. La suppression de confidentialité et la tâche de nettoyage planifiée vérifient la présence d'une licence à vie et conservent l'e-mail de commande pour la réactivation de la licence. Sans cet indicateur, les données client expirées sont complètement anonymisées après la période de conservation."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_TITLE="1. J2Commerce 6 : marquer les produits via les metafields"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_DESC="Pour chaque produit avec licence à vie, insérer une ligne metafield (remplacer <strong>123</strong> par l'ID produit J2Commerce réel) :"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_J6_HINT="La tâche vérifie #__j2commerce_metafields avec owner_resource = product, metakey = is_lifetime_license et metavalue = yes."
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_TITLE="2. J2Commerce 4 / J2Store : créer la table custom field"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_DESC="Uniquement pour les installations J2Commerce 4 / J2Store : exécuter ce SQL dans phpMyAdmin ou la console de base de données (remplacer <strong>#__</strong> par le préfixe de table Joomla, par ex. <strong>jos_</strong>) :"
PLG_PRIVACY_J2COMMERCE_POSTINSTALL_SQL_CREATE_NOTE="Cette table n'est <strong>pas</strong> visible dans l'interface Custom Fields de J2Commerce (Composants → J2Commerce → Custom Fields). C'est une table de base de données séparée utilisée uniquement par ce plugin de confidentialité."
