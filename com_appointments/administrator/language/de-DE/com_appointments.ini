COM_APPOINTMENTS="Termine"
COM_APPOINTMENTS_MENU_HELP="Hilfe und Tipps"
COM_APPOINTMENTS_HELP_TITLE="Hilfe und Tipps"
COM_APPOINTMENTS_HELP_INTRO="Praktische Anleitung für diese selbstgehostete Komponente. Beginnen Sie mit einer kleinen Testeinrichtung und prüfen Sie den ganzen Buchungsablauf vor der Veröffentlichung. Die Feldhilfen bleiben direkt bei den Einstellungen verfügbar; Softwarestandards sind keine Empfehlung zu gesetzlichen Aufbewahrungsfristen."
COM_APPOINTMENTS_HELP_CONTENTS="Hilfethemen"
COM_APPOINTMENTS_HELP_SETUP_TITLE="Ersteinrichtung: Kalender, Terminplan und Buchungsseite"
COM_APPOINTMENTS_HELP_SETUP_BASE_DESC="Tragen Sie zuerst die öffentliche Website-URL ein (Register Allgemein): Ohne sie versendet die Komponente keine E-Mails und nimmt keine Buchungen an, und die Systemprüfung zeigt einen Fehler. Prüfen Sie die Komponentenoptionen: Datenschutzhinweis/Einwilligung, Gästezahl, Mailversand und Aufbewahrung. Internetkalender sind optional; normale Terminbuchungen funktionieren auch ohne verknüpften Buchungskalender. Beginnen Sie bei Internetkalendern mit einem internen Kalender und dem vorgesehenen Eigentümer, nicht mit vielen Freigaben."
COM_APPOINTMENTS_HELP_SETUP_SCHEDULE_DESC="Erstellen Sie einen wiederverwendbaren Terminplan mit seiner tatsächlichen Zeitzone und wöchentlichen Öffnungszeiten. Ergänzen Sie Sperrzeiten für Ausnahmen. Die Zeitzone des Plans bestimmt die Wochenzeiten; gespeicherte Buchungszeiten sind UTC. Prüfen Sie Zeitumstellungen und angezeigte Zeiten auf einer Test-Buchungsseite."
COM_APPOINTMENTS_HELP_SETUP_BOOKING_DESC="Erstellen Sie eine Terminart, wählen Sie Terminplan und Anbieter und konfigurieren Sie Dauer, Zeitschritt, Puffer, Vorlauf, Buchungshorizont und Kapazität. Ein verknüpfter Buchungskalender braucht den eigenen wirksamen Zugriff 'Schreiben' des Anbieters; Administratorrechte liefern diesen Zugriff nicht. Veröffentlichen Sie in Joomlas Menüverwaltung entweder 'Termin buchen' für eine Terminart oder die Terminartenliste. Prüfen Sie Buchung, Bestätigung, Verschiebung, Absage und Löschung vor der Freigabe für Besucher."
COM_APPOINTMENTS_HELP_ADMIN_TITLE="Administratorrechte sind keine Inhaltsschlüssel"
COM_APPOINTMENTS_HELP_SHARES_TITLE="Freigaben, Eigentümer und Wiederherstellung"
COM_APPOINTMENTS_HELP_SHARES_DESC="Prüfen Sie im Kalendereditor Freigaben und ihren tatsächlichen Status, bevor Sie Rollen oder Eigentümer ändern. Interne Gruppenzugehörigkeit, aktives Konto, zugelassener zweiter Faktor und gültige Schlüsselhüllen bestimmen wirksamen Zugriff; eine sichtbare Freigabezeile allein genügt nicht. Schlüsselhaltende administrative Freigaben oder ein neuer Eigentümer können ausstehend bleiben, bis ein echter Schlüsselhalter oder eine berechtigte Wiederherstellung die Hüllen liefert. Entzug entfernt die Hülle des Empfängers und markiert die Inhaltsschlüsselrotation als fällig; führen Sie diese mit echten berechtigten Schlüsseln durch. Bewahren Sie das Wiederherstellungsgeheimnis sicher und getrennt auf und senden Sie es nie in Supportnachrichten."
COM_APPOINTMENTS_HELP_DEVICES_TITLE="Geräte und CalDAV-Clients"
COM_APPOINTMENTS_HELP_DEVICES_DESC="Ein Kalenderclient braucht ein Gerät der Person mit wirksamem Kalenderzugriff und nutzbaren persönlichen Schlüsseln. Melden Sie sich mit Passwort und zugelassenem zweiten Faktor an und erstellen Sie das Gerät über die persönlichen Kalender-/Geräteaktionen. Verwenden Sie die von der Komponente angezeigte HTTPS-CalDAV-Adresse und das Gerätepasswort, keine fremden Zugangsdaten. Bewahren Sie das einmal angezeigte Passwort sicher auf; entziehen Sie verlorenen oder ausgemusterten Geräten den Zugriff. Administratoren können Geräte sperren oder widerrufen, erhalten dadurch aber keine Inhaltsschlüssel. Ein Widerruf kann bereits heruntergeladene Daten nicht zurückholen."
COM_APPOINTMENTS_HELP_RETENTION_TITLE="Aufbewahrung und Löschung"
COM_APPOINTMENTS_HELP_PRIVACY_TITLE="Datenschutz, Einwilligung und Löschung"
COM_APPOINTMENTS_HELP_PRIVACY_DESC="Konfigurieren Sie Hinweis, Einwilligungsmodus und Datenschutzlink für Ihren eigenen Ablauf; ein Softwarestandard ist kein rechtlicher Entscheid. Nur die primär eingeladene Person erhält signierte Links für Verschiebung, Absage und Löschung; zusätzliche Gäste und Anbieter erhalten Benachrichtigungen ohne diese Befugnisse. Joomla-Datenschutzanfragen und der Löschlink der primär eingeladenen Person sind getrennte unterstützte Wege. Eine Internetkalenderfrist bestimmt nicht die Aufbewahrung persönlicher Buchungsdaten."
COM_APPOINTMENTS_HELP_MAIL_TITLE="Mail, Sprachen und optionale Konferenzen"
COM_APPOINTMENTS_HELP_MAIL_DESC="Konfigurieren Sie Joomla-Mail und testen Sie die tatsächliche Zustellung; ein grüner lokaler Systemcheck beweist diese nicht. Pflegen Sie Mailvorlagen in de-DE, en-GB und fr-FR. Empfänger verwenden ihre Kontosprache, sonst die Site-Standardsprache, auch Gäste. Bestätigung, Verschiebung und Absage enthalten einen iCalendar-Anhang für die buchende Person und die Gäste, für den Gastgeber nur ohne Zielkalender in Gebrauch (siehe Benachrichtigungen). Konferenzen sind optional: richten Sie Anbieter/Adresse bewusst ein und prüfen Sie erzeugte Links. Der Buchungskern braucht keinen externen Terminbuchungsdienst. Jeder Link in einer E-Mail wird aus der öffentlichen Website-URL (oder live_site in Joomla) gebildet, nie aus der Adresse einer Anfrage. Ohne sie geht keine E-Mail hinaus, und Buchungsseiten zeigen «Eine Buchung ist derzeit nicht möglich»."
COM_APPOINTMENTS_HELP_TROUBLE_TITLE="Fehlerbehebung"
COM_APPOINTMENTS_HELP_TROUBLE_SLOTS_DESC="Keine buchbaren Zeiten? Prüfen Sie Veröffentlichung/Zugriff, gewählten Terminplan und Zeitzone, Sperrzeiten, Vorlauf, Horizont, Puffer und Kapazität. Bei verknüpften Kalendern prüfen Sie den echten Anbieterzugriff, die gewählten Belegt-Kalender und das Buchungsziel. Administratorrechte machen einen Anbieter nicht schreibberechtigt."
COM_APPOINTMENTS_HELP_TROUBLE_SYNC_DESC="Fehlende oder veraltete Clienteinträge? Prüfen Sie aktive Internetkalender und benötigte Plugins, weiterhin berechtigtes Konto/Gruppe/Faktor, aktives Gerät und nutzbare Hüllen der Freigabe. Prüfen Sie Kalenderprotokoll und fällige Rotation. Ein altersgelöschtes Objekt kann durch späteren Upload oder Buchungsänderung neu entstehen; Löschung sperrt seine UID nicht dauerhaft. Reparieren Sie ausstehende Schlüssel nie durch erfundene Datenbankfreigaben oder Hüllen."
COM_APPOINTMENTS_HELP_TROUBLE_CHECKS_DESC="Wiederholen Sie den Systemcheck in den Komponentenoptionen und prüfen Sie die Ausführungshistorie von Joomlas geplanten Aufgaben. Auch aktive Aufgaben brauchen einen zuverlässigen tatsächlichen Auslöser. Speichern einer Frist führt keine Bereinigung aus. Prüfen Sie bei blockierten Dateiersetzungen einer Installation/Aktualisierung die exakten alten/neuen Hashes und verwenden Sie den dokumentierten Installer-Freigabeweg; überschreiben Sie Dateien nicht blind."
COM_APPOINTMENTS_HELP_CONFIG_DESC="Öffnen Sie <a href='index.php?option=com_appointments&amp;view=help'>Hilfe und Tipps</a> für Ersteinrichtung, Kalender, Terminpläne, Buchungsseiten, Rechte/Schlüssel, Geräte, Aufbewahrung, Datenschutz, Mail und Fehlerbehebung. Das ergänzt die Feldhilfen und ändert keine Einstellung."
COM_APPOINTMENTS_HELP_DEL_INTRO="Diese Regeln gelten für Buchungen, Internetkalender und Geräte. Sie schützen Ihre eigenen Termine und sorgen dafür, dass die Daten der eingeladenen Personen nach der Frist überall verschwinden."
COM_APPOINTMENTS_HELP_DEL_RULES_TITLE="Die Regeln"
COM_APPOINTMENTS_HELP_DEL_RULE_ORIGIN_TITLE="Die Herkunft entscheidet"
COM_APPOINTMENTS_HELP_DEL_RULE_ORIGIN_DESC="Jeder Eintrag in einem Internetkalender ist entweder eine Buchungskopie oder ein eigener Eintrag. Eine Buchungskopie schreibt die Website selbst, sobald jemand einen Termin bucht. Alles andere ist ein eigener Eintrag, auch ein Termin, den ein Gerät wie Outlook hochgeladen hat. Die automatischen Löschungen der Website betreffen nur Buchungskopien."
COM_APPOINTMENTS_HELP_DEL_RULE_BOOKINGS_TITLE="Buchungen verschwinden nach der Buchungsfrist"
COM_APPOINTMENTS_HELP_DEL_RULE_BOOKINGS_DESC="Die Aufgabe «Termine: Aufbewahrung» verarbeitet jede Buchung, deren Ende länger zurückliegt als die Buchungsfrist. Je nach Option «Bei Datenlöschung» wird die Buchung anonymisiert oder vollständig gelöscht. Mit ihr verschwinden alle ihre Kopien aus allen Internetkalendern und beim nächsten Abgleich von allen Geräten, auch aus Outlook. Eine abgesagte Buchung verliert ihre Kopie sofort, die Buchung selbst erst nach der Frist. Die Frist stellen Sie in den Optionen ein, z.B. 30 Tage mit «Buchung vollständig löschen». Ein Löschnachweis ohne Daten der eingeladenen Person bleibt für seine eigene Frist."
COM_APPOINTMENTS_HELP_DEL_RULE_OWNER_TITLE="Buchungskopien gehören der Website"
COM_APPOINTMENTS_HELP_DEL_RULE_OWNER_DESC="Ändern Sie eine Buchungskopie auf einem Gerät, überschreibt die Website diese Änderung bei der nächsten Änderung der Buchung, z.B. bei einer Verschiebung, einem neuen Konferenzlink oder wenn ein Gast entfernt wird. Spätestens mit der Buchungsfrist wird die Kopie gelöscht. Notizen zu einem Termin gehören darum ins CRM, nicht in die Kopie."
COM_APPOINTMENTS_HELP_DEL_RULE_DEVICE_DELETE_TITLE="Löschen im Kalender sagt den Termin nicht ab"
COM_APPOINTMENTS_HELP_DEL_RULE_DEVICE_DELETE_DESC="Löscht ein Gerät eine Buchungskopie, bleibt die Buchung bestehen und die eingeladene Person erscheint trotzdem. Die Website nimmt das hin und schreibt die Kopie erst bei der nächsten Änderung der Buchung wieder. Sagen Sie einen Termin nur in der Buchungsliste des Backends ab."
COM_APPOINTMENTS_HELP_DEL_RULE_OWN_TITLE="Eigene Einträge haben keine Frist"
COM_APPOINTMENTS_HELP_DEL_RULE_OWN_DESC="Die Website löscht eigene Einträge nie wegen ihres Alters. Das ist technisch gesperrt: Die Kalenderfrist erfasst nur Buchungskopien, auch wenn im Feld ein Wert über 0 steht. Ein eigener Eintrag verschwindet nur, wenn ihn jemand auf einem Gerät löscht, wenn der ganze Kalender gelöscht wird oder wenn eine Joomla-Datenschutzanfrage ihn erfasst (siehe «Datenschutz, Einwilligung und Löschung»)."
COM_APPOINTMENTS_HELP_DEL_RULE_CALRET_TITLE="Die Kalenderfrist löscht nur Buchungskopien"
COM_APPOINTMENTS_HELP_DEL_RULE_CALRET_DESC="Jeder Internetkalender hat das Feld «Buchungskopien löschen nach (Tagen)». Der Standard 0 heisst nie. Die Buchungsfrist löscht Buchungskopien ohnehin, ein Wert über 0 löscht sie nur früher, und zwar auf allen Geräten, die den Kalender abgleichen. Darum erscheint beim Speichern eine Warnung mit der Zahl dieser Geräte. Für Teamkalender bleibt der Wert vorerst 0."
COM_APPOINTMENTS_HELP_DEL_RULE_CLEANUP_TITLE="Geräte entfernen, sperren und Passwort-Reset"
COM_APPOINTMENTS_HELP_DEL_RULE_CLEANUP_DESC="Wird ein Gerät entfernt oder gesperrt, ein Passwort zurückgesetzt oder der Kalenderzugriff einer Person gesperrt, gilt je Gerät seine Einstellung (siehe «Geräte entfernen»). Mit «Aufräumen» erhält das Gerät seine Kalender beim nächsten Abgleich leer und löscht alles, was es mit ihnen abgleicht, z.B. auf einem Handy. Mit «Nur sperren» wird es nur abgewiesen und behält seine Daten. Der Server löscht in beiden Fällen nichts. Für Outlook mit dem Hauptkalender wählen Sie «Nur sperren», sonst löscht Outlook dort beim Aufräumen auch Ihre eigenen Termine."
COM_APPOINTMENTS_HELP_DEL_RULE_RESTORE_TITLE="Kopien nach dem Wiedereinschalten und bei neuem Zielkalender"
COM_APPOINTMENTS_HELP_DEL_RULE_RESTORE_DESC="Solange die Internetkalender ausgeschaltet sind, entfernt die Website alle Buchungskopien. Schalten Sie sie wieder ein oder ändern Sie den Zielkalender einer Terminart, schreibt die Aufgabe «Termine: Aufbewahrung der Internetkalender» die Kopien aller künftigen Buchungen neu, bei jedem Lauf bis zu 200. Dabei kommen auch Kopien zurück, die ein Gerät gelöscht hat. Vergangene Buchungen erhalten keine neue Kopie."
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_TITLE="Sicherungen und Wiederherstellung"
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_DESC="Bewahren Sie Sicherungen der Website höchstens 30 Tage auf und nennen Sie diese Frist in Ihrer Datenschutzerklärung. Eine Sicherung enthält Buchungen und Kopien, die seither gelöscht wurden. Nach einer Wiederherstellung holen Sie die Löschungen sofort nach:"
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_STEP_1="Lassen Sie unter System → Geplante Aufgaben «Termine: Aufbewahrung» und «Termine: Aufbewahrung der Internetkalender» sofort von Hand laufen, und zwar so oft, bis das Protokoll der ersten «bookings» 0 und das der zweiten «restore_pending» 0 und «restore_failed» 0 zeigt. Jeder Lauf verarbeitet nur einen Stapel. Beheben Sie Fehler, bevor die Geräte abgleichen."
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_STEP_2="Wiederholen Sie jede Löschung, die seit dem Datum der Sicherung verlangt wurde: Löschlinks aus Mails, Löschungen im Backend und Joomla-Datenschutzanfragen. Die wiederhergestellte Datenbank kennt diese Löschungen nicht mehr, massgeblich sind Ihre eigenen Unterlagen."
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_STEP_3="Sperren Sie Geräte und entziehen Sie Freigaben erneut, die nach dem Datum der Sicherung gesperrt oder entzogen wurden."
COM_APPOINTMENTS_HELP_DEL_RULE_BACKUP_STEP_4="Prüfen Sie danach Ihre Geräte. Sie erhalten beim nächsten Abgleich den Stand der Website."
COM_APPOINTMENTS_HELP_DEL_TABLE_TITLE="Was wird wann gelöscht"
COM_APPOINTMENTS_HELP_DEL_COL_WHAT="Was"
COM_APPOINTMENTS_HELP_DEL_COL_WHEN="Wann"
COM_APPOINTMENTS_HELP_DEL_COL_WHERE="Wo"
COM_APPOINTMENTS_HELP_DEL_ROW_BOOKING_WHAT="Buchung"
COM_APPOINTMENTS_HELP_DEL_ROW_BOOKING_WHEN="Nach der Buchungsfrist ab Terminende, z.B. 30 Tage. Sofort über den Löschlink oder eine Löschung im Backend."
COM_APPOINTMENTS_HELP_DEL_ROW_BOOKING_WHERE="Website. Anonymisiert oder vollständig gelöscht, je nach Option."
COM_APPOINTMENTS_HELP_DEL_ROW_COPY_WHAT="Buchungskopie"
COM_APPOINTMENTS_HELP_DEL_ROW_COPY_WHEN="Mit der Buchung. Sofort bei einer Absage. Früher, wenn eine Kalenderfrist gesetzt ist."
COM_APPOINTMENTS_HELP_DEL_ROW_COPY_WHERE="Alle Internetkalender und beim nächsten Abgleich alle Geräte, auch Outlook."
COM_APPOINTMENTS_HELP_DEL_ROW_OWN_WHAT="Eigener Eintrag"
COM_APPOINTMENTS_HELP_DEL_ROW_OWN_WHEN="Nie wegen seines Alters."
COM_APPOINTMENTS_HELP_DEL_ROW_OWN_WHERE="Bleibt, bis ihn jemand löscht."
COM_APPOINTMENTS_HELP_DEL_ROW_OFF_WHAT="Buchungskopien bei ausgeschalteten Internetkalendern"
COM_APPOINTMENTS_HELP_DEL_ROW_OFF_WHEN="Beim nächsten Lauf der Aufgabe oder bei der nächsten Änderung der Buchung."
COM_APPOINTMENTS_HELP_DEL_ROW_OFF_WHERE="Alle Internetkalender. Die Geräte gleichen erst nach dem Wiedereinschalten ab."
COM_APPOINTMENTS_HELP_DEL_ROW_CLEANUP_WHAT="Kalender auf einem Gerät mit «Aufräumen»"
COM_APPOINTMENTS_HELP_DEL_ROW_CLEANUP_WHEN="Beim nächsten Abgleich nach Gerät entfernen, Sperre oder Passwort-Reset. Ein Gerät mit «Nur sperren» wird nur abgewiesen und löscht nichts."
COM_APPOINTMENTS_HELP_DEL_ROW_CLEANUP_WHERE="Nur auf dem Gerät. Der Server behält alles."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_TITLE="Outlook-Hauptkalender: beim Gerät «Nur sperren» wählen"
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_DESC="Sie können den Zielkalender Ihrer Terminart beidseitig mit Ihrem Outlook-Hauptkalender abgleichen. Dann sehen Sie die Buchungen in Outlook, und Ihre eigenen Termine aus Outlook sperren Zeiten auf der Buchungsseite. Zwei Regeln machen das sicher:"
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_OWN="Ihre eigenen Termine liegen im selben Kalender wie die Buchungskopien. Buchungsfrist und Kalenderfrist löschen darin trotzdem nur Buchungskopien, Ihre eigenen Termine nie. Das ist technisch gesperrt."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STOP="Für das Outlook-Gerät wählen Sie beim Entfernen und Sperren «Nur sperren». Dann kann die Website beim Entfernen, bei einer Sperre oder einem Passwort-Reset nie Termine in Outlook löschen."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEPS_TITLE="So richten Sie es in Outlook mit CalDav Synchronizer ein"
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_1="Legen Sie unter «Internetkalender» einen Kalender mit Ihnen als Eigentümer an und lassen Sie «Sperrt Buchungszeiten» auf Ja."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_2="Wählen Sie ihn in der Terminart als «Zielkalender»."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_3="Fügen Sie auf der Website unter «Meine Kalender» ein Gerät für Outlook hinzu und wählen Sie für dieses Gerät «Nur sperren»."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_4="Ordnen Sie den Kalender in CalDav Synchronizer Ihrem Outlook-Hauptkalender zu, Synchronisierungsmodus «Outlook ↔ Server (Two-Way)»."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_5="Verwenden Sie einen lokalen Outlook-Kalender, z.B. in einer PST-Datei, kein Exchange- oder Microsoft-365-Postfach. Sonst liegen die Buchungskopien zusätzlich bei Microsoft."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_STEP_6="Für Handys und andere Geräte mit eigenem Kalenderordner wählen Sie «Aufräumen». Dann verschwinden die Kalender dort beim Entfernen ganz."
COM_APPOINTMENTS_HELP_DEL_OUTLOOK_WHY="Warum «Nur sperren»: Beim Aufräumen liefert die Website dem Gerät einen leeren Kalender. Im Zwei-Weg-Abgleich mit dem Hauptkalender gleicht Outlook den Kalender daran an und löscht alle Termine darin, auch Ihre eigenen. «Nur sperren» weist das Gerät ab, ohne ihm einen leeren Kalender zu liefern. Outlook behält dann alles. Die Buchungskopien verschwinden trotzdem nach der Buchungsfrist aus Outlook, solange das Gerät abgleicht."
COM_APPOINTMENTS_HELP_DEL_ROW_CALENDAR_WHAT="Ganzer Internetkalender"
COM_APPOINTMENTS_HELP_DEL_ROW_CALENDAR_WHEN="Sofort, wenn ihn jemand im Backend mit allen Einträgen löscht."
COM_APPOINTMENTS_HELP_DEL_ROW_CALENDAR_WHERE="Website. Auf Geräten je nach Programm."
COM_APPOINTMENTS_HELP_DEL_ROW_AUDIT_WHAT="Löschnachweis"
COM_APPOINTMENTS_HELP_DEL_ROW_AUDIT_WHEN="Nach der Aufbewahrung der Löschnachweise in Jahren."
COM_APPOINTMENTS_HELP_DEL_ROW_AUDIT_WHERE="Website."
COM_APPOINTMENTS_HELP_DEL_ROW_LOG_WHAT="Protokoll der Internetkalender"
COM_APPOINTMENTS_HELP_DEL_ROW_LOG_WHEN="Nach zwölf Monaten."
COM_APPOINTMENTS_HELP_DEL_ROW_LOG_WHERE="Website."
COM_APPOINTMENTS_HELP_DEL_ROW_BACKUP_WHAT="Sicherung der Website"
COM_APPOINTMENTS_HELP_DEL_ROW_BACKUP_WHEN="Nach höchstens 30 Tagen."
COM_APPOINTMENTS_HELP_DEL_ROW_BACKUP_WHERE="Ablage der Sicherungen."
COM_APPOINTMENTS_HELP_DEL_NEVER_TITLE="Was nie gelöscht wird"
COM_APPOINTMENTS_HELP_DEL_NEVER_1="Eigene Einträge wegen ihres Alters, weder durch die Buchungsfrist noch durch die Kalenderfrist."
COM_APPOINTMENTS_HELP_DEL_NEVER_2="Inhalte auf dem Server beim Aufräumen eines Geräts. Nur das Gerät leert seine Kopie."
COM_APPOINTMENTS_HELP_DEL_NEVER_3="Ihre eigenen Outlook-Termine durch die Website, wenn beim Outlook-Gerät «Nur sperren» gewählt ist."
COM_APPOINTMENTS_HELP_DEL_NEVER_4="Eine Buchung durch das Löschen ihrer Kopie auf einem Gerät."
COM_APPOINTMENTS_HELP_DEL_NEVER_5="Löschnachweise vor Ablauf ihrer eigenen Frist und das Protokoll der Internetkalender vor Ablauf von zwölf Monaten."
COM_APPOINTMENTS_HELP_DEL_BEYOND_TITLE="Was die Website nicht löschen kann"
COM_APPOINTMENTS_HELP_DEL_BEYOND_1="Kopien auf einem Gerät, das nicht mehr abgleicht, z.B. weil es verloren ging."
COM_APPOINTMENTS_HELP_DEL_BEYOND_2="Buchungskopien, die jemand in einen nicht abgeglichenen Outlook-Ordner verschoben oder kopiert hat."
COM_APPOINTMENTS_HELP_DEL_BEYOND_3="Termine aus Buchungsmails, die jemand in Outlook angenommen hat. Sie liegen in Outlook ausserhalb der Website. In einem abgeglichenen Kalender ausser dem Zielkalender gelten sie als eigene Einträge."
COM_APPOINTMENTS_HELP_DEL_BEYOND_4="Sicherungen, bis sie nach ihrer Frist verfallen."
COM_APPOINTMENTS_HELP_DEL_SETTINGS_TITLE="Die Einstellungen im Einzelnen"
COM_APPOINTMENTS_XML_DESCRIPTION="Terminbuchung auf dem eigenen Server. Sie veröffentlichen buchbare Zeitfenster, der Interessent wählt selbst einen Termin, und jede Bestätigung enthält den Kalendereintrag als Anhang. Alles läuft auf Ihrem eigenen Server, es wird kein fremder Dienst angefragt."

