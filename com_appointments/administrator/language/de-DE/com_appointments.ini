COM_APPOINTMENTS_MENU_FIELD_EVENTTYPE_DESC="Der Veranstaltungstyp, dessen Buchungsseite dieser Menüeintrag öffnet. Die Liste zeigt die veröffentlichten Veranstaltungstypen. Ein Veranstaltungstyp, der später nicht mehr veröffentlicht ist, bleibt ausgewählt und ist entsprechend markiert."
COM_APPOINTMENTS_MENU_FIELDSET_NAVIGATION="Navigation"
COM_APPOINTMENTS_MENU_FIELD_SHOW_BACK_LABEL="Schaltfläche «Zurück»"
COM_APPOINTMENTS_MENU_FIELD_SHOW_BACK_DESC="Die Schaltfläche «Zurück zu den Terminen» auf der Buchungsseite dieses Menüeintrags. Standardmässig ausgeblendet: Dieser Menüeintrag öffnet einen einzigen Veranstaltungstyp, und die Schaltfläche würde zur Liste aller Veranstaltungstypen führen. Solange sie ausgeblendet ist, führen die Bestätigung und die Seiten der Links in den E-Mails zurück zu dieser Buchungsseite."
COM_APPOINTMENTS_MENU_FIELD_BACK_TARGET_LABEL="Ziel der Schaltfläche «Zurück»"
COM_APPOINTMENTS_MENU_FIELD_BACK_TARGET_DESC="Wohin die Schaltfläche führt, auch auf der Bestätigung und auf den Seiten der Links in den E-Mails. Ohne Auswahl oder bei einem Menüeintrag, den die besuchende Person nicht öffnen kann, führt sie zur Liste aller Veranstaltungstypen. Menüeintrag-Aliase, Überschriften, Trennzeichen und externe URLs werden nicht verwendet."
