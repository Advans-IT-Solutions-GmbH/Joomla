COM_APPOINTMENTS_TEAM_C_RECOVERY_SECRET_NOTE="Affichée uniquement maintenant et enregistrée nulle part. Imprimez-la deux fois, avec le secret du site figurant dans configuration.php, et conservez les deux impressions hors ligne dans des lieux séparés. Sans elle, un calendrier dont tous les détenteurs de clé ont perdu leur accès ne peut plus être ouvert."
COM_APPOINTMENTS_TEAM_C_RECOVERY_USE="Utiliser la clé de récupération"
COM_APPOINTMENTS_TEAM_C_RECOVERY_USE_BUTTON="Donner l'accès avec la clé de récupération"
COM_APPOINTMENTS_TEAM_C_RECOVERY_USE_DESC="Donne accès à un calendrier lorsqu'aucun gestionnaire ne peut plus le faire, par exemple après une réinitialisation du mot de passe. La clé n'est utilisée que pour cette requête et n'est jamais enregistrée. L'accès est journalisé et envoyé par e-mail au propriétaire et aux gestionnaires."
