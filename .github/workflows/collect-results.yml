name: Collect Results

run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} base={1} base-sha={2} head-sha={3} merge-sha={4}', github.event.pull_request.number, github.event.pull_request.base.ref, github.event.pull_request.base.sha, github.event.pull_request.head.sha, github.sha) || (github.event_name == 'push' && github.event.head_commit.message) || github.workflow }}"

# Sole producer of the required "Collect Results" status check.
#
# Runs on every pull request to the supported base branches. It determines which extension build &
# test workflows are triggered by the changed files (from their own
# pull_request.paths filters), waits for those runs on the exact pull request
# base/head commits and tested merge commit, and fails unless every one succeeded. Workflows without path
# filters, including Security Scan, are required even on documentation-only PRs.
# Security Scan must also have successfully executed all expected scanner jobs.
#
# The extension workflows deliberately do not use the job name
# "Collect Results", so a failing extension run can never be hidden behind a
# green check with the same name.
#
# After re-running a failed extension workflow, re-run this workflow as well.

on:
  pull_request:
    branches: [main, advansit-superuser-calendar-administration, advansit-guest-privacy-requests]

permissions: {}

concurrency:
  group: collect-results-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect-results:
    name: Collect Results
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: read
      # The source head's check runs reveal runs the eventually consistent run list still lacks.
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: Wait for and evaluate required pull request workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: bash .github/scripts/collect-results.sh
