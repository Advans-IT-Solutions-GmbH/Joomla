PLG_PRIVACY_J2COMMERCE_POSTINSTALL_OVERRIDES_SKIPPED_NOTE="<strong>Handlungsbedarf:</strong> Diese Dateien existierten bereits und wurden nicht verändert. Sie müssen manuell prüfen, ob sie das Kontrollfeld für die Datenschutz-Einwilligung und die Registerkarte Datenschutz enthalten — oder sie durch die mitgelieferten Versionen aus <code>plugins/privacy/j2commerce/overrides/com_j2store/</code> bzw. <code>plugins/privacy/j2commerce/overrides/com_j2commerce/</code> ersetzen. Ohne diese Anpassung erscheinen weder das Kontrollfeld für die Einwilligung im Checkout noch die Registerkarte Datenschutz in MyProfile. Siehe <strong>README.md → Template Integration</strong>."
