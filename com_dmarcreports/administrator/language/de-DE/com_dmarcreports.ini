COM_DMARCREPORTS_DETAIL_MTASTS_MANUAL_STEP="Veröffentlichen Sie die untenstehenden Einträge und stellen Sie sicher, dass der Policy-Host (mta-sts.<domain>) über HTTPS mit gültigem Zertifikat erreichbar ist und der Webserver /.well-known/mta-sts.txt an Joomla weitergibt. Diese Schritte kann die Komponente nicht für Sie erledigen; das Action Center verfolgt, ob sie umgesetzt sind."
