COM_APPOINTMENTS_TEAM_D_MAIL_REASON_BLOCKED="Votre compte a été bloqué."
COM_APPOINTMENTS_TEAM_D_MAIL_REASON_ADMIN="L'administration a suspendu votre accès."
COM_APPOINTMENTS_TEAM_D_MAIL_REASON_OTHER="Votre accès a été suspendu pour des raisons de sécurité."
COM_APPOINTMENTS_TEAM_D_MAIL_DEVICE_ADDED_SUBJECT="Nouvel appareil pour vos calendriers Internet"
COM_APPOINTMENTS_TEAM_D_MAIL_DEVICE_ADDED_BODY="Bonjour {user_name},\n\nUn nouvel appareil pour les calendriers Internet a été ajouté à votre compte sur {site_name}.\n\nAppareil : {device_name}\nProgramme : {client}\nDate : {created}\n\nCe n'était pas vous ? Connectez-vous immédiatement, supprimez l'appareil sous « Mes calendriers », changez votre mot de passe et informez l'administration.\n\nMes calendriers :\n{mycalendars_url}\n\nCet e-mail ne contient aucun mot de passe. Le mot de passe d'application n'est affiché qu'une seule fois sur le site."
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_SUBJECT="Activer votre compte sur {site_name}"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_BODY="Bonjour {user_name},\n\nUn compte pour les calendriers Internet a été créé pour vous sur {site_name}. Définissez votre mot de passe avec ce lien. Le lien fonctionne une seule fois et jusqu'au {expires}.\n\nActiver le compte :\n{activation_url}\n\nÀ votre première connexion, vous configurez un second facteur, par exemple une app d'authentification.\n\nVous n'attendiez pas de compte ? N'ouvrez pas le lien et informez l'administration."
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_SUBJECT="Compte activé : {account_name}"
COM_APPOINTMENTS_TEAM_D_MAIL_INVITATION_ACCEPTED_BODY="Bonjour {user_name},\n\nLe compte {account_name} ({account_username}) a défini son mot de passe sur {site_name} et est actif. Lors de son premier accès aux calendriers Internet, il configure le second facteur.\n\nS'il ne s'agit pas de la personne prévue, révoquez l'accès en une étape. Tous les partages sont supprimés, le compte est bloqué et ses appareils sont nettoyés.\n\nRévoquer l'accès :\n{revoke_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_SUBJECT="Partage modifié : {calendar_title}"
COM_APPOINTMENTS_TEAM_D_MAIL_GRANT_CHANGED_BODY="Bonjour {user_name},\n\nUn partage du calendrier Internet « {calendar_title} » sur {site_name} a été créé ou modifié.\n\nPersonne : {grantee_name}\nRôle : {role}\nModifié par : {actor_name}\n\nSi ce partage n'était pas prévu, informez immédiatement l'administration.\n\nMes calendriers :\n{mycalendars_url}"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_SUBJECT="Votre accès aux calendriers Internet est suspendu"
COM_APPOINTMENTS_TEAM_D_MAIL_ACCESS_SUSPENDED_BODY="Bonjour {user_name},\n\nVotre accès aux calendriers Internet sur {site_name} est suspendu. Motif : {reason}\n\nÀ leur prochaine synchronisation, vos appareils reçoivent les calendriers vides et suppriment leur copie. Ensuite, aucune synchronisation n'est plus possible.\n\nLa personne qui gère un calendrier peut le partager de nouveau avec vous. Si vous ne vous y attendiez pas, informez l'administration."
